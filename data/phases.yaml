    D: "CAD (SolidWorks/Fusion/Onshape/FreeCAD), 3D printing and machining basics. CAD part set, beam calculator, FEM solver, a mechanism, 2D CFD, a thermal model, a robot arm simulated then built with ROS 2, a learned simulator; final capstone"
