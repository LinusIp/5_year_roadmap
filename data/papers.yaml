# The reading queue, in suggested order within each group. One paper a week from year 2.
# arXiv links were opened and their titles compared; direct PDF links were downloaded and searched for the
# paper's title (the Baraff-Witkin PDF is a scan, so it was confirmed through the author's publication list).

# ---- year 1-2 classics
- { id: paper-alexnet, title: "ImageNet Classification with Deep Convolutional Neural Networks (AlexNet)", authors: "Krizhevsky, Sutskever, Hinton", year: 2012, url: "https://papers.nips.cc/paper/4824-imagenet-classification-with-deep-convolutional-neural-networks", urlVerified: true, lastVerified: 2026-09-20, tracks: [ai], group: classics, short: "AlexNet", summary: "The 2012 result that kicked off the deep learning era, and a readable tour of GPU-trained CNN tricks.", level: "intro", fromYear: 1, priority: 1, roadmap: "ai-engineer", quality: 5 }
- { id: paper-word2vec, title: "Efficient Estimation of Word Representations in Vector Space (word2vec)", authors: "Mikolov, Chen, Corrado, Dean", year: 2013, url: "https://arxiv.org/abs/1301.3781", urlVerified: true, lastVerified: 2026-09-20, tracks: [ai], group: classics, short: "word2vec", summary: "The paper that made dense word embeddings mainstream, with the famous vector-arithmetic analogies.", level: "intro", fromYear: 1, priority: 1, roadmap: "ai-engineer", quality: 5 }
- { id: paper-vae, title: "Auto-Encoding Variational Bayes (VAE)", authors: "Kingma, Welling", year: 2013, url: "https://arxiv.org/abs/1312.6114", urlVerified: true, lastVerified: 2026-09-20, tracks: [ai], group: classics, short: "VAE (Kingma)", summary: "Introduces the reparameterization trick and the VAE, a core idea for latent-variable and diffusion models.", level: "advanced", fromYear: 2, priority: 1, roadmap: "ai-engineer", research: "diffusion", quality: 5 }
- { id: paper-gan, title: "Generative Adversarial Networks", authors: "Goodfellow et al.", year: 2014, url: "https://arxiv.org/abs/1406.2661", urlVerified: true, lastVerified: 2026-09-20, tracks: [ai], group: classics, short: "GANs (Goodfellow 2014)", summary: "The original minimax game between generator and discriminator, short and foundational for generative modeling.", level: "intermediate", fromYear: 2, priority: 1, roadmap: "ai-engineer", research: "genai", quality: 5 }
- { id: paper-dropout, title: "Dropout: A Simple Way to Prevent Neural Networks from Overfitting", authors: "Srivastava, Hinton, Krizhevsky, Sutskever, Salakhutdinov", year: 2014, url: "https://jmlr.org/papers/v15/srivastava14a.html", urlVerified: true, lastVerified: 2026-09-20, tracks: [ai], group: classics, short: "Dropout", summary: "The classic regularizer explained with both intuition and extensive experiments.", level: "intro", fromYear: 1, priority: 1, roadmap: "ai-engineer", quality: 5 }
- { id: paper-adam, title: "Adam: A Method for Stochastic Optimization", authors: "Kingma, Ba", year: 2014, url: "https://arxiv.org/abs/1412.6980", urlVerified: true, lastVerified: 2026-09-20, tracks: [ai, math], group: classics, short: "Adam", summary: "The default optimizer of deep learning; read it to know what its moment estimates and bias correction do.", level: "intermediate", fromYear: 1, priority: 1, roadmap: "ai-engineer", quality: 5 }
- { id: paper-batchnorm, title: "Batch Normalization: Accelerating Deep Network Training by Reducing Internal Covariate Shift", authors: "Ioffe, Szegedy", year: 2015, url: "https://arxiv.org/abs/1502.03167", urlVerified: true, lastVerified: 2026-09-20, tracks: [ai], group: classics, short: "Batch Norm", summary: "Introduces the normalization layer that made deep CNN training fast and stable.", level: "intermediate", fromYear: 1, priority: 1, roadmap: "ai-engineer", quality: 5 }
- { id: paper-unet, title: "U-Net: Convolutional Networks for Biomedical Image Segmentation", authors: "Ronneberger, Fischer, Brox", year: 2015, url: "https://arxiv.org/abs/1505.04597", urlVerified: true, lastVerified: 2026-09-20, tracks: [ai], group: classics, short: "U-Net", summary: "The encoder-decoder with skip connections behind segmentation and, later, every diffusion model's denoiser.", level: "intermediate", fromYear: 2, priority: 1, roadmap: "ai-engineer", research: "diffusion", quality: 5 }
- { id: paper-resnet, title: "Deep Residual Learning for Image Recognition (ResNet)", authors: "He, Zhang, Ren, Sun", year: 2015, url: "https://arxiv.org/abs/1512.03385", urlVerified: true, lastVerified: 2026-09-20, tracks: [ai], group: classics, short: "ResNet", summary: "Skip connections are now in nearly every deep model; this shows why they make very deep nets trainable.", level: "intermediate", fromYear: 1, priority: 1, roadmap: "ai-engineer", quality: 5 }
- { id: paper-attention, title: "Attention Is All You Need", authors: "Vaswani et al.", year: 2017, url: "https://arxiv.org/abs/1706.03762", urlVerified: true, lastVerified: 2026-09-20, tracks: [ai], group: classics, short: "Attention Is All You Need", summary: "The original Transformer paper; every modern LLM is a variation on the architecture it introduced.", level: "intermediate", fromYear: 2, priority: 1, roadmap: "ai-engineer", research: "genai", quality: 5 }

# ---- the LLM era
- { id: paper-gpt2, title: "Language Models are Unsupervised Multitask Learners (GPT-2)", authors: "Radford et al.", year: 2019, url: "https://openai.com/index/better-language-models/", urlVerified: true, lastVerified: 2026-09-20, tracks: [ai], group: llm, short: "GPT-2", summary: "The paper that argued a big enough next-token predictor learns many tasks without task-specific training.", level: "intermediate", fromYear: 2, priority: 1, roadmap: "ai-engineer", research: "genai", quality: 5 }
- { id: paper-scaling-laws, title: "Scaling Laws for Neural Language Models", authors: "Kaplan et al.", year: 2020, url: "https://arxiv.org/abs/2001.08361", urlVerified: true, lastVerified: 2026-09-20, tracks: [ai], group: llm, short: "Kaplan Scaling Laws", summary: "Empirical power laws linking loss to parameters, data and compute; the basis for planning training runs.", level: "advanced", fromYear: 3, priority: 1, roadmap: "ai-engineer", research: "genai", quality: 5 }
- { id: paper-gpt3, title: "Language Models are Few-Shot Learners (GPT-3)", authors: "Brown et al.", year: 2020, url: "https://arxiv.org/abs/2005.14165", urlVerified: true, lastVerified: 2026-09-20, tracks: [ai], group: llm, short: "GPT-3", summary: "Introduced in-context few-shot prompting at 175B scale and kicked off the modern LLM era.", level: "intermediate", fromYear: 2, priority: 1, roadmap: "ai-engineer", research: "genai", quality: 5 }
- { id: paper-rag, title: "Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks", authors: "Lewis et al.", year: 2020, url: "https://arxiv.org/abs/2005.11401", urlVerified: true, lastVerified: 2026-09-20, tracks: [ai], group: llm, short: "RAG (Lewis 2020)", summary: "The original RAG paper: couple a retriever to a generator so the model can look things up instead of memorizing.", level: "intermediate", fromYear: 1, priority: 1, roadmap: "ai-engineer", quality: 5 }
- { id: paper-lora, title: "LoRA: Low-Rank Adaptation of Large Language Models", authors: "Hu et al.", year: 2021, url: "https://arxiv.org/abs/2106.09685", urlVerified: true, lastVerified: 2026-09-20, tracks: [ai], group: llm, short: "LoRA", summary: "The standard trick for cheap fine-tuning: freeze weights and train small low-rank update matrices.", level: "intermediate", fromYear: 2, priority: 1, roadmap: "ai-engineer", research: "genai", quality: 5 }
- { id: paper-chain-of-thought, title: "Chain-of-Thought Prompting Elicits Reasoning in Large Language Models", authors: "Wei et al.", year: 2022, url: "https://arxiv.org/abs/2201.11903", urlVerified: true, lastVerified: 2026-09-20, tracks: [ai], group: llm, short: "Chain-of-Thought", summary: "Shows that asking a model to write intermediate steps dramatically improves multi-step reasoning.", level: "intro", fromYear: 2, priority: 1, roadmap: "ai-engineer", research: "genai", quality: 5 }
- { id: paper-instructgpt, title: "Training language models to follow instructions with human feedback (InstructGPT)", authors: "Ouyang et al.", year: 2022, url: "https://arxiv.org/abs/2203.02155", urlVerified: true, lastVerified: 2026-09-20, tracks: [ai], group: llm, short: "InstructGPT", summary: "The recipe of SFT, reward modeling and PPO that turned base models into helpful assistants.", level: "intermediate", fromYear: 2, priority: 1, roadmap: "ai-engineer", research: "genai", quality: 5 }
- { id: paper-chinchilla, title: "Training Compute-Optimal Large Language Models (Chinchilla)", authors: "Hoffmann et al.", year: 2022, url: "https://arxiv.org/abs/2203.15556", urlVerified: true, lastVerified: 2026-09-20, tracks: [ai], group: llm, short: "Chinchilla", summary: "Corrected earlier scaling advice by showing models should be trained on far more tokens per parameter.", level: "advanced", fromYear: 3, priority: 1, roadmap: "ai-engineer", research: "genai", quality: 5 }
- { id: paper-flashattention, title: "FlashAttention: Fast and Memory-Efficient Exact Attention with IO-Awareness", authors: "Dao et al.", year: 2022, url: "https://arxiv.org/abs/2205.14135", urlVerified: true, lastVerified: 2026-09-20, tracks: [ai, systems], group: llm, short: "FlashAttention", summary: "Shows how tiling attention to avoid HBM round-trips gives exact attention far faster, the textbook case of IO-aware kernel design.", level: "advanced", fromYear: 2, priority: 1, roadmap: "inference-engineering", research: "inference", quality: 5 }
- { id: paper-react, title: "ReAct: Synergizing Reasoning and Acting in Language Models", authors: "Yao et al.", year: 2022, url: "https://arxiv.org/abs/2210.03629", urlVerified: true, lastVerified: 2026-09-20, tracks: [ai], group: llm, short: "ReAct", summary: "The thought-action-observation loop that nearly every modern tool-using agent still runs on.", level: "intermediate", fromYear: 2, priority: 1, roadmap: "ai-agents", research: "genai", quality: 5 }
- { id: paper-toolformer, title: "Toolformer: Language Models Can Teach Themselves to Use Tools", authors: "Schick et al.", year: 2023, url: "https://arxiv.org/abs/2302.04761", urlVerified: true, lastVerified: 2026-09-20, tracks: [ai], group: llm, short: "Toolformer", summary: "Shows how a model can learn when and how to call APIs from self-labeled data, an early blueprint for tool use.", level: "intermediate", fromYear: 2, priority: 1, roadmap: "ai-agents", research: "genai", quality: 5 }
- { id: paper-dpo, title: "Direct Preference Optimization: Your Language Model is Secretly a Reward Model", authors: "Rafailov et al.", year: 2023, url: "https://arxiv.org/abs/2305.18290", urlVerified: true, lastVerified: 2026-09-20, tracks: [ai], group: llm, short: "DPO", summary: "Derives a simple classification-style loss that aligns models to preferences without RL or a separate reward model.", level: "advanced", fromYear: 3, priority: 1, roadmap: "ai-engineer", research: "genai", quality: 5 }
- { id: paper-mamba, title: "Mamba: Linear-Time Sequence Modeling with Selective State Spaces", authors: "Gu, Dao", year: 2023, url: "https://arxiv.org/abs/2312.00752", urlVerified: true, lastVerified: 2026-09-20, tracks: [ai], group: llm, short: "Mamba", summary: "The leading alternative to attention: selective state-space layers that scale linearly with sequence length.", level: "advanced", fromYear: 3, priority: 1, roadmap: "ai-engineer", quality: 5 }
- { id: paper-mixtral, title: "Mixtral of Experts", authors: "Jiang et al.", year: 2024, url: "https://arxiv.org/abs/2401.04088", urlVerified: true, lastVerified: 2026-09-20, tracks: [ai], group: llm, short: "Mixtral", summary: "A compact description of a strong sparse mixture-of-experts model with open weights.", level: "intermediate", fromYear: 2, priority: 1, roadmap: "ai-engineer", quality: 4 }

# ---- systems (most are assigned reading in MIT 6.5840)
- { id: paper-time-clocks, title: "Time, Clocks, and the Ordering of Events in a Distributed System", authors: "Lamport", year: 1978, url: "https://lamport.azurewebsites.net/pubs/time-clocks.pdf", urlVerified: true, lastVerified: 2026-09-20, tracks: [systems], group: systems, short: "Lamport Clocks", summary: "Introduces happened-before and logical clocks, the vocabulary every later distributed-systems paper assumes.", level: "intermediate", fromYear: 2, priority: 1, roadmap: "software-architect", quality: 5 }
- { id: paper-gfs, title: "The Google File System", authors: "Ghemawat, Gobioff, Leung", year: 2003, url: "https://research.google/pubs/the-google-file-system/", urlVerified: true, lastVerified: 2026-09-20, tracks: [systems], group: systems, short: "GFS paper", summary: "A classic case study in trading strict consistency for simplicity and throughput on commodity hardware.", level: "intermediate", fromYear: 2, priority: 1, roadmap: "software-architect", quality: 5 }
- { id: paper-mapreduce, title: "MapReduce: Simplified Data Processing on Large Clusters", authors: "Dean, Ghemawat", year: 2004, url: "https://research.google/pubs/mapreduce-simplified-data-processing-on-large-clusters/", urlVerified: true, lastVerified: 2026-09-20, tracks: [systems], group: systems, short: "MapReduce paper", summary: "Shows how a tiny programming model plus re-execution on failure makes cluster-scale batch jobs routine.", level: "intermediate", fromYear: 2, priority: 1, roadmap: "software-architect", quality: 5 }
- { id: paper-bigtable, title: "Bigtable: A Distributed Storage System for Structured Data", authors: "Chang et al.", year: 2006, url: "https://research.google/pubs/bigtable-a-distributed-storage-system-for-structured-data/", urlVerified: true, lastVerified: 2026-09-20, tracks: [systems], group: systems, short: "Bigtable paper", summary: "The origin of the wide-column/LSM design behind HBase, Cassandra's data model and many modern stores.", level: "intermediate", fromYear: 2, priority: 1, roadmap: "software-architect", quality: 5 }
- { id: paper-dynamo, title: "Dynamo: Amazon's Highly Available Key-value Store", authors: "DeCandia et al.", year: 2007, url: "https://www.allthingsdistributed.com/2007/10/amazons_dynamo.html", urlVerified: true, lastVerified: 2026-09-20, tracks: [systems], group: systems, short: "Dynamo paper", summary: "The canonical leaderless, always-writable design: consistent hashing, sloppy quorums, vector clocks and hinted handoff.", level: "intermediate", fromYear: 2, priority: 1, roadmap: "software-architect", quality: 5 }
- { id: paper-kafka, title: "Kafka: a Distributed Messaging System for Log Processing", authors: "Kreps, Narkhede, Rao", year: 2011, url: "https://www.microsoft.com/en-us/research/wp-content/uploads/2017/09/Kafka.pdf", urlVerified: true, lastVerified: 2026-09-20, tracks: [systems], group: systems, short: "Kafka paper", summary: "Shows why an append-only partitioned log beats traditional message queues for high-volume event streams.", level: "intermediate", fromYear: 2, priority: 2, roadmap: "software-architect", quality: 4 }
- { id: paper-spanner, title: "Spanner: Google's Globally-Distributed Database", authors: "Corbett et al.", year: 2012, url: "https://research.google/pubs/spanner-googles-globally-distributed-database-2/", urlVerified: true, lastVerified: 2026-09-20, tracks: [systems], group: systems, short: "Spanner paper", summary: "Explains how TrueTime-bounded clocks let a global database offer externally consistent transactions.", level: "advanced", fromYear: 3, priority: 1, roadmap: "software-architect", quality: 5 }
- { id: paper-raft, title: "In Search of an Understandable Consensus Algorithm (Raft)", authors: "Ongaro, Ousterhout", year: 2014, url: "https://raft.github.io/raft.pdf", urlVerified: true, lastVerified: 2026-09-20, tracks: [systems], group: systems, note: "Read it before project 24.", short: "Raft paper", summary: "Consensus designed for teachability; reading it is the prerequisite for the Raft labs in MIT 6.5840.", level: "intermediate", fromYear: 2, priority: 1, roadmap: "software-architect", quality: 5 }

# ---- graphics and simulation
- { id: paper-large-steps-cloth, title: "Large Steps in Cloth Simulation", authors: "Baraff, Witkin", year: 1998, url: "https://www.cs.cmu.edu/~baraff/papers/sig98.pdf", urlVerified: true, lastVerified: 2026-09-20, tracks: [simulation], group: graphics-sim, short: "Large Steps in Cloth", summary: "Landmark implicit-integration cloth paper that made big stable time steps possible; the basis of many later cloth solvers.", level: "advanced", fromYear: 3, priority: 1, roadmap: "game-developer", quality: 5 }
- { id: paper-stable-fluids, title: "Stable Fluids", authors: "Stam", year: 1999, url: "http://www.dgp.toronto.edu/people/stam/reality/Research/pdf/ns.pdf", urlVerified: true, lastVerified: 2026-09-20, tracks: [simulation], group: graphics-sim, short: "Stable Fluids", summary: "The semi-Lagrangian advection plus pressure-projection scheme that made unconditionally stable grid fluids standard in graphics.", level: "intermediate", fromYear: 2, priority: 1, roadmap: "game-developer", quality: 5 }
- { id: paper-iterative-dynamics, title: "Iterative Dynamics with Temporal Coherence", authors: "Catto", year: 2005, url: "https://box2d.org/files/ErinCatto_IterativeDynamics_GDC2005.pdf", urlVerified: true, lastVerified: 2026-09-20, tracks: [simulation], group: graphics-sim, note: "Read it before project 15.", short: "Catto: Iterative Dynamics", summary: "Derives the projected Gauss-Seidel constraint solver from first principles and shows why reusing last frame's impulses converges fast.", level: "advanced", fromYear: 2, priority: 1, roadmap: "game-developer", quality: 5 }
- { id: paper-pbd, title: "Position Based Dynamics", authors: "Muller, Heidelberger, Hennix, Ratcliff", year: 2006, url: "https://matthias-research.github.io/pages/publications/posBasedDyn.pdf", urlVerified: true, lastVerified: 2026-09-20, tracks: [simulation], group: graphics-sim, short: "PBD (Müller 2006)", summary: "The original paper behind the position-projection approach now used in cloth, soft bodies and game physics everywhere.", level: "intermediate", fromYear: 2, priority: 1, roadmap: "game-developer", quality: 5 }
- { id: paper-microfacet, title: "Microfacet Models for Refraction through Rough Surfaces", authors: "Walter, Marschner, Li, Torrance", year: 2007, url: "https://www.graphics.cornell.edu/~bjw/microfacetbsdf.pdf", urlVerified: true, lastVerified: 2026-09-20, tracks: [graphics], group: graphics-sim, note: "The GGX distribution used by the PBR chapter of LearnOpenGL." }
- { id: paper-xpbd, title: "XPBD: Position-Based Simulation of Compliant Constrained Dynamics", authors: "Macklin, Muller, Chentanez", year: 2016, url: "https://matthias-research.github.io/pages/publications/XPBD.pdf", urlVerified: true, lastVerified: 2026-09-20, tracks: [simulation], group: graphics-sim, note: "Read it before project 34.", short: "XPBD", summary: "Fixes PBD's stiffness-depends-on-iterations problem with a compliance term, giving a physically meaningful constraint solver in a few lines of code.", level: "intermediate", fromYear: 2, priority: 1, roadmap: "game-developer", quality: 5 }
- { id: paper-pinn, title: "Physics Informed Deep Learning (Part I): Data-driven Solutions of Nonlinear Partial Differential Equations", authors: "Raissi, Perdikaris, Karniadakis", year: 2017, url: "https://arxiv.org/abs/1711.10561", urlVerified: true, lastVerified: 2026-09-20, tracks: [simulation, ai], group: graphics-sim, note: "The arXiv precursor of the 2019 'Physics-Informed Neural Networks' paper.", short: "PINNs", summary: "Introduces physics-informed neural networks that put the PDE residual in the loss; worth knowing well, including where it falls short of classic solvers.", level: "intermediate", fromYear: 3, priority: 1, roadmap: "game-developer", quality: 5 }
- { id: paper-learning-to-simulate, title: "Learning to Simulate Complex Physics with Graph Networks", authors: "Sanchez-Gonzalez et al.", year: 2020, url: "https://arxiv.org/abs/2002.09405", urlVerified: true, lastVerified: 2026-09-20, tracks: [simulation, ai], group: graphics-sim, short: "GNS", summary: "Particle simulators learned by message-passing networks that generalize to larger, longer rollouts than they were trained on.", level: "advanced", fromYear: 3, priority: 1, roadmap: "game-developer", quality: 5 }
- { id: paper-nerf, title: "NeRF: Representing Scenes as Neural Radiance Fields for View Synthesis", authors: "Mildenhall et al.", year: 2020, url: "https://arxiv.org/abs/2003.08934", urlVerified: true, lastVerified: 2026-09-20, tracks: [graphics, ai], group: graphics-sim, short: "NeRF", summary: "Launched neural rendering by fitting a volumetric MLP to photos and rendering it with classic volume integration.", level: "advanced", fromYear: 3, priority: 1, roadmap: "game-developer", quality: 5 }
- { id: paper-3dgs, title: "3D Gaussian Splatting for Real-Time Radiance Field Rendering", authors: "Kerbl, Kopanas, Leimkuhler, Drettakis", year: 2023, url: "https://repo-sam.inria.fr/fungraph/3d-gaussian-splatting/", urlVerified: true, lastVerified: 2026-09-20, tracks: [graphics, ai], group: graphics-sim, short: "3D Gaussian Splatting", summary: "Replaces neural fields with differentiable rasterized Gaussians, hitting real-time frame rates at NeRF quality.", level: "advanced", fromYear: 3, priority: 1, roadmap: "game-developer", quality: 5 }

