# The Atlas Library's eighth file (ATLAS-LIBRARY, 14,547 rows): the rows the first seven files did not have, the
# energy and extreme physics cluster: semiconductor physics and devices, particle accelerators (the CERN Accelerator
# School), conductors and superconductors, compact and aneutronic fusion with direct energy conversion, radioisotope
# and space nuclear power and propulsion (NASA technical reports), heat-to-electricity conversion (thermoelectrics,
# thermophotovoltaics, thermionics, MHD, Stirling), pulsed power and high-energy-density physics, materials for
# extreme environments, and high-power storage and high-voltage engineering, across the engineering, simulation,
# math and hardware tracks. Free papers, articles, docs, practice, books, blogs and courses, each link checked when
# it was added (October 2026), each with its priority for years 1 to 3, the roadmap.sh roadmap it serves and its
# year 3 research area. None is on the plan: they sit on their shelves, in search, under "Optional for this path",
# in the Research view and under "Compact power & energy conversion". Generated from atlas-resources.jsonl by
# scratch/import-atlas.ts; rows the Library already had only filled in what their entries were missing.

