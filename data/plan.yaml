# The roadmap: which items sit in which lane of which phase, in order (the phase table of the brief of 2026-10-07).
# Ids and ordering are derived from this file, so reordering a list reorders the lane.
#
# Conventions:
#   * Block A carries the study (courses, books, lecture series) and block D carries the builds, because
#     the brief lists the same engine work in both. A capstone may span two lanes and states its `hours`
#     share in each; an item split across phases (LearnOpenGL) does the same. Nothing else appears twice.
#   * `hours` on a single appearance is the part of an item a phase uses ("CS50x weeks 1-5").
#   * Weekly mini-builds and unnumbered research cards are never listed here: they are drawn from the pool.
#
# Year 2 and year 3 are denser than their lanes' hours: the brief puts a great deal in them. The forecast shows
# which lanes run over, and Re-plan can spread them; see DECISIONS.md.

- phase: y1-p0
  lanes:
    A:
      - { project: a-small-game-1, note: "Close the GameDevHQ loop with one finished game" }
      - { resource: learnopengl, hours: 40, note: "Part 1: Getting started and Lighting" }
      - { resource: gamemath-3d-primer, note: "Game maths: vectors, matrices, transforms, quaternions" }
    B:
      - { resource: 30-days-of-python }
      - { resource: automate-the-boring-stuff, note: "Its projects become the small CLI tools of the phase" }
      - { resource: cs50x, hours: 50, note: "Weeks 1-5: start C" }
    C:
      - { resource: ml-zoomcamp }
      - { resource: hf-llm-course }
      - { resource: hf-agents-course }
      - { resource: roadmap-ai-engineer, note: "The basics: APIs, embeddings, vector search, RAG, Ollama, prompting, safety" }
    D:
      - { project: m01 }
      - { project: m02 }
      - { project: m03 }
      - { project: m04 }
    E:
