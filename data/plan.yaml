# The roadmap: which items sit in which lane of which phase, in order.
# Ids and ordering are derived from this file, so reordering a list reorders the lane.
#
# Two conventions:
#   * Block A carries the study (courses, books, lecture series) and block D carries the builds, because
#     the brief lists the same engine work in both. A capstone spans both lanes and states its `hours`
#     share in each; nothing else may appear twice.
#   * Weekly mini-builds are never listed here: they are drawn from the pool by "Pick my next project".
#
# Where the brief's phase table exceeded a lane's hour budget, the overflow moved to the next phase
# (K&R to Y2, 8.01 to Y2); see DECISIONS.md. Lanes that still run over show up in the forecast.

