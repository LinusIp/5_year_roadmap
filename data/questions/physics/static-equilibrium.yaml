subject: physics
topic: static-equilibrium
questions:
  - id: phys-equil-001
    difficulty: 1
    type: numeric
    prompt: |
      A {{m1}} kg child sits {{d1}} m from the pivot of a seesaw. How far from the pivot, on the other side, must a
      {{m2}} kg child sit for the (uniform, centrally pivoted) seesaw to balance? Give your answer with units.
    params:
      m1: { int: [20, 60] }
      m2: { int: [20, 60] }
      d1: { real: [0.5, 2], step: 0.1 }
    require: ["m1 * d1 / m2 <= 2.5"]
    answer: "m1 * d1 / m2"
    units: "m"
    tolerance: { rel: 0.01 }
    hints:
      - "The plank's own weight acts at the pivot, so it has no torque about it."
      - "Balance the torques: $m_1 g d_1 = m_2 g d_2$."
    solution: |
      Taking torques about the pivot, $m_1 g d_1 = m_2 g d_2$, so
      $d_2 = \dfrac{m_1 d_1}{m_2} = \dfrac{ {{m1}} \times {{d1}} }{ {{m2}} } \approx {{round(m1*d1/m2, 3)}}\ \text{m}$.
    verify: "solve(m1*9.8*d1 - m2*9.8*Symbol('D'), Symbol('D'))[0]"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 2

  - id: phys-equil-002
    difficulty: 1
    type: mc
    prompt: "What must be true of the forces on a rigid body for it to stay in static equilibrium?"
    options:
      - "The net force is zero and the net torque about any point is zero"
      - "The net force is zero; torques do not matter"
      - "The net torque about the centre of mass is zero; forces do not matter"
      - "Every individual force must be zero"
    answer: 0
    hints:
      - "Think of two equal and opposite forces applied at different points of a steering wheel."
    solution: |
      Zero net force keeps the centre of mass from accelerating, and zero net torque keeps the body from starting to
      rotate. Both are needed: a couple (two equal, opposite, non-collinear forces) has zero net force but a non-zero
      torque, and turns a steering wheel. Once the net force is zero, the torque is the same about every point, so
      "about any point" can be checked about the most convenient one.
    verify: "0 if abs(np.cross([1, 0, 0], [0, -5, 0])[2]) > 0 and np.allclose(np.array([0, 5, 0]) + np.array([0, -5, 0]), 0) else 1"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 1

  - id: phys-equil-003
    difficulty: 2
    type: numeric
    prompt: |
      A uniform {{M}} kg beam {{L}} m long rests on two supports, one under each end. A {{m}} kg crate sits on the beam
      {{x}} m from the left end. What upward force does the right-hand support exert? Take $g = 9.8\ \text{m/s}^2$ and
      give your answer with units.
    params:
      M: { int: [10, 50] }
      L: { real: [2, 6], step: 0.5 }
      m: { int: [10, 80] }
      x: { real: [0.5, 5.5], step: 0.5 }
    require: ["x < L"]
    answer: "(M * 9.8 * L / 2 + m * 9.8 * x) / L"
    units: "N"
    tolerance: { rel: 0.01 }
    hints:
      - "Take torques about the left support: its force then drops out."
      - "The beam's weight acts at its centre, $L/2$ from the left end."
    solution: |
      About the left end: $R_{\text{right}}\,L = Mg\tfrac{L}{2} + mgx$, so
      $$R_{\text{right}} = \frac{ {{M}}(9.8)({{L/2}}) + {{m}}(9.8)({{x}}) }{ {{L}} } \approx {{round((M*9.8*L/2 + m*9.8*x)/L, 2)}}\ \text{N}.$$
      (The left support then carries the rest of the total weight $(M + m)g = {{round((M + m)*9.8, 2)}}$ N.)
    verify: "np.linalg.solve([[1, 1], [0, L]], [(M + m)*9.8, M*9.8*L/2 + m*9.8*x])[1]"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 3

  - id: phys-equil-004
    difficulty: 2
    type: numeric
    prompt: |
      A {{m}} kg lamp hangs from two ropes. Rope A makes {{th1}}° with the horizontal on the left, and rope B makes
      {{th2}}° with the horizontal on the right. What is the tension in rope A? Take $g = 9.8\ \text{m/s}^2$ and give
      your answer with units.
    params:
      m: { int: [2, 30] }
      th1: { int: [20, 70] }
      th2: { int: [20, 70] }
    answer: "m * 9.8 * cos(th2 * pi / 180) / sin((th1 + th2) * pi / 180)"
    units: "N"
    tolerance: { rel: 0.01 }
    hints:
      - "The knot is in equilibrium: the horizontal components of the tensions cancel, and the vertical components hold up the weight."
      - "$T_A\\cos\\theta_1 = T_B\\cos\\theta_2$ and $T_A\\sin\\theta_1 + T_B\\sin\\theta_2 = mg$."
    solution: |
      Horizontally $T_A\cos\theta_1 = T_B\cos\theta_2$; vertically $T_A\sin\theta_1 + T_B\sin\theta_2 = mg$.
      Eliminating $T_B$:
      $$T_A = \frac{mg\cos\theta_2}{\sin\theta_1\cos\theta_2 + \cos\theta_1\sin\theta_2} = \frac{mg\cos\theta_2}{\sin(\theta_1 + \theta_2)} \approx {{round(m*9.8*cos(th2*pi/180)/sin((th1 + th2)*pi/180), 2)}}\ \text{N}.$$
    verify: "np.linalg.solve([[-math.cos(math.radians(th1)), math.cos(math.radians(th2))], [math.sin(math.radians(th1)), math.sin(math.radians(th2))]], [0, m*9.8])[0]"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 3

  - id: phys-equil-005
    difficulty: 2
    type: numeric
    prompt: |
      A uniform horizontal rod of mass {{M}} kg is hinged to a wall at one end. A {{m}} kg sign hangs from its far end,
      which is held up by a cable running back to the wall at {{th}}° above the rod. What is the tension in the cable?
      Take $g = 9.8\ \text{m/s}^2$ and give your answer with units.
    params:
      M: { real: [2, 10], step: 0.5 }
      m: { int: [5, 30] }
      th: { int: [20, 60] }
    answer: "(M / 2 + m) * 9.8 / sin(th * pi / 180)"
    units: "N"
    tolerance: { rel: 0.01 }
    hints:
      - "Take torques about the hinge, so the unknown hinge force drops out."
      - "Only the cable's component perpendicular to the rod, $T\\sin\\theta$, has a torque about the hinge."
    solution: |
      Let the rod have length $L$ (it cancels). About the hinge:
      $$T\sin\theta\,L = Mg\frac{L}{2} + mgL \Rightarrow T = \frac{(M/2 + m)g}{\sin\theta} = \frac{ {{M/2 + m}} \times 9.8}{\sin {{th}}°} \approx {{round((M/2 + m)*9.8/sin(th*pi/180), 2)}}\ \text{N}.$$
    verify: "solve(1.5*Symbol('T')*math.sin(math.radians(th)) - M*9.8*0.75 - m*9.8*1.5, Symbol('T'))[0]"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 3

  - id: phys-equil-006
    difficulty: 3
    type: multipart
    prompt: |
      A uniform ladder of mass {{M}} kg and length {{L}} m leans against a frictionless vertical wall, making {{th}}°
      with the floor. Take $g = 9.8\ \text{m/s}^2$.
    params:
      M: { int: [5, 25] }
      L: { real: [2, 6], step: 0.5 }
      th: { int: [45, 75] }
    parts:
      - prompt: "(a) What horizontal force does the wall exert on the ladder? Give it with units."
        type: numeric
        answer: "M * 9.8 / (2 * tan(th * pi / 180))"
        units: "N"
        tolerance: { rel: 0.01 }
        verify: "solve(Symbol('Nw')*L*math.sin(math.radians(th)) - M*9.8*(L/2)*math.cos(math.radians(th)), Symbol('Nw'))[0]"
      - prompt: "(b) Using your answer to (a), what is the smallest coefficient of static friction at the floor that stops the ladder slipping? (A pure number.)"
        type: numeric
        answer: "part1 / (M * 9.8)"
        tolerance: { rel: 0.01 }
        verify: "(lambda s: s[Symbol('f')]/s[Symbol('N')])(solve([Symbol('f') - Symbol('Nw'), Symbol('N') - M*9.8, Symbol('Nw')*L*math.sin(math.radians(th)) - M*9.8*(L/2)*math.cos(math.radians(th))], [Symbol('f'), Symbol('N'), Symbol('Nw')]))"
    hints:
      - "Forces: weight at the middle, the wall's normal force (horizontal, at the top), and the floor's normal force and friction (at the bottom)."
      - "Take torques about the foot of the ladder: the floor forces drop out."
      - "Horizontally, friction must balance the wall's push; vertically, the floor's normal force is the weight."
    solution: |
      (a) About the foot: the wall force $N_w$ at height $L\sin\theta$ balances the weight at horizontal distance $\tfrac{L}{2}\cos\theta$:
      $$N_w L\sin\theta = Mg\frac{L}{2}\cos\theta \Rightarrow N_w = \frac{Mg}{2\tan\theta} \approx {{round(M*9.8/(2*tan(th*pi/180)), 2)}}\ \text{N}.$$
      (b) Horizontally $f = N_w$; vertically $N = Mg$. Friction can supply at most $\mu_s N$, so
      $$\mu_s \ge \frac{N_w}{Mg} = \frac{1}{2\tan\theta} \approx {{round(1/(2*tan(th*pi/180)), 4)}}.$$
      The steeper the ladder, the less friction it needs.
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 6

  - id: phys-equil-007
    difficulty: 3
    type: numeric
    prompt: |
      You hold a {{m}} kg dumbbell in your hand with your forearm horizontal and your upper arm vertical. The hand is
      {{L}} m from the elbow joint, the forearm (mass {{M}} kg) has its centre of mass halfway along, and the biceps
      tendon pulls straight up on the forearm {{d}} m from the elbow. What force must the biceps exert?
      Take $g = 9.8\ \text{m/s}^2$ and give your answer with units.
    params:
      m: { int: [2, 15] }
      M: { real: [1, 2.5], step: 0.5 }
      L: { real: [0.3, 0.4], step: 0.01 }
      d: { real: [0.03, 0.05], step: 0.005 }
    answer: "(m * L + M * L / 2) * 9.8 / d"
    units: "N"
    tolerance: { rel: 0.01 }
    hints:
      - "Take torques about the elbow, where the unknown joint force acts."
      - "The biceps has a very short lever arm, so expect a force many times the dumbbell's weight."
    solution: |
      About the elbow:
      $$F_b\,d = mgL + Mg\frac{L}{2} \Rightarrow F_b = \frac{({{m}} \times {{L}} + {{M}} \times {{L/2}}) \times 9.8}{ {{d}} } \approx {{round((m*L + M*L/2)*9.8/d, 1)}}\ \text{N},$$
      about ${{round((m*L + M*L/2)/(m*d), 1)}}$ times the dumbbell's weight.
    verify: "solve(float(np.cross([d, 0, 0], [0, 1, 0])[2])*Symbol('Fb') + float(np.cross([L, 0, 0], [0, -m*9.8, 0])[2]) + float(np.cross([L/2, 0, 0], [0, -M*9.8, 0])[2]), Symbol('Fb'))[0]"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 3

  - id: phys-equil-008
    difficulty: 3
    type: vector
    prompt: |
      A uniform horizontal rod of mass {{M}} kg is hinged to a wall at one end. A {{m}} kg sign hangs from its far end,
      which is held up by a cable running back to the wall at {{th}}° above the rod. Find the force the hinge exerts on
      the rod, in newtons, with $x$ pointing away from the wall and $y$ up. Enter it as `Fx, Fy`. Take
      $g = 9.8\ \text{m/s}^2$.
    params:
      M: { real: [2, 10], step: 0.5 }
      m: { int: [5, 30] }
      th: { int: [20, 60] }
    let:
      T: "(M / 2 + m) * 9.8 / sin(th * pi / 180)"
    answer: "[T * cos(th * pi / 180), (M + m) * 9.8 - T * sin(th * pi / 180)]"
    tolerance: { rel: 0.01 }
    hints:
      - "First find the cable tension from torques about the hinge."
      - "Then use $\\sum F_x = 0$ and $\\sum F_y = 0$ for the rod."
      - "The cable pulls towards the wall, so the hinge must push away from it."
    solution: |
      Torques about the hinge give $T = \dfrac{(M/2 + m)g}{\sin\theta} \approx {{round(T, 2)}}$ N.
      The cable pulls with $(-T\cos\theta,\ T\sin\theta)$, so
      $$F_x = T\cos\theta \approx {{round(T*cos(th*pi/180), 2)}}\ \text{N},\qquad F_y = (M + m)g - T\sin\theta = \tfrac12 Mg \approx {{round((M + m)*9.8 - T*sin(th*pi/180), 2)}}\ \text{N}.$$
      Neat check: the hinge carries exactly half the rod's weight vertically, whatever the sign weighs.
    verify: "list(np.linalg.solve([[1, 0, -math.cos(math.radians(th))], [0, 1, math.sin(math.radians(th))], [0, 0, 1.5*math.sin(math.radians(th))]], [0, (M + m)*9.8, M*9.8*0.75 + m*9.8*1.5])[:2])"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 5

  - id: phys-equil-009
    difficulty: 3
    type: estimate
    prompt: |
      A 70 kg person stands on tiptoe on one foot. Estimate the tension in the Achilles tendon. Give a value with units.
    answer: "3 * 70 * 9.8"
    units: "N"
    factor: 3
    hints:
      - "Model the foot as a lever: the floor pushes up on the ball of the foot, the tendon pulls up on the heel, and the shin bone pushes down at the ankle joint."
      - "Typical distances: ball of the foot about 12 cm in front of the ankle joint; tendon attached about 4 cm behind it."
      - "Take torques about the ankle joint."
    solution: |
      The floor pushes up with the full weight $W = mg \approx 690$ N at the ball of the foot, 12 cm in front of the
      ankle. The tendon pulls up 4 cm behind the ankle. Torques about the ankle:
      $$T(4\ \text{cm}) = W(12\ \text{cm}) \Rightarrow T = 3W \approx 2\,000\ \text{N},$$
      about three times body weight; the ankle joint then carries $T + W \approx 4W$.
    verify: "np.linalg.solve([[1, -1], [0.16, -0.12]], [-70*9.8, 0])[0]"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 4

  - id: phys-equil-010
    difficulty: 4
    type: numeric
    prompt: |
      A uniform {{M}} kg ladder {{L}} m long leans against a frictionless wall at {{th}}° to the floor. The coefficient
      of static friction at the floor is {{mu}}. A {{m}} kg painter climbs the ladder. How far along the ladder (from
      its foot) can the painter go before the ladder starts to slip? Take $g = 9.8\ \text{m/s}^2$ and give your answer
      with units.
    params:
      M: { int: [10, 25] }
      m: { int: [50, 90] }
      L: { real: [3, 6], step: 0.5 }
      th: { int: [55, 75] }
      mu: { real: [0.2, 0.6], step: 0.05 }
    let:
      s: "(mu * (M + m) * L * tan(th * pi / 180) - M * L / 2) / m"
    require: ["s > 0.3", "s < L - 0.2"]
    answer: "s"
    units: "m"
    tolerance: { rel: 0.01 }
    hints:
      - "Vertically, the floor's normal force carries both weights: $N = (M + m)g$."
      - "At the point of slipping, friction is at its maximum $\\mu N$, and it balances the wall's push."
      - "Take torques about the foot of the ladder, with the painter a distance $s$ along it."
    solution: |
      $N = (M + m)g$, and at the limit $N_w = f = \mu(M + m)g$. About the foot:
      $$N_w L\sin\theta = Mg\frac{L}{2}\cos\theta + mgs\cos\theta \Rightarrow s = \frac{\mu(M + m)L\tan\theta - ML/2}{m} \approx {{round(s, 3)}}\ \text{m}.$$
      Beyond that the wall would need to push harder than friction can resist.
    verify: "solve([Symbol('N') - (M + m)*9.8, Symbol('Nw') - mu*Symbol('N'), Symbol('Nw')*L*math.sin(math.radians(th)) - M*9.8*(L/2)*math.cos(math.radians(th)) - m*9.8*Symbol('sp')*math.cos(math.radians(th))], [Symbol('N'), Symbol('Nw'), Symbol('sp')])[Symbol('sp')]"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 7

  - id: phys-equil-011
    difficulty: 4
    type: numeric
    prompt: |
      A {{M}} kg crate is {{w}} m wide and {{hc}} m tall and rests on a floor with coefficient of static friction
      {{mu}}. You push it horizontally, at height $y$ above the floor, increasing the force slowly. What is the greatest
      height $y$ at which the crate will start to slide rather than tip over? Give your answer with units.
    params:
      M: { int: [20, 80] }
      w: { real: [0.4, 1], step: 0.1 }
      hc: { real: [1, 2], step: 0.1 }
      mu: { real: [0.3, 0.8], step: 0.05 }
    require: ["w / (2 * mu) < hc"]
    answer: "w / (2 * mu)"
    units: "m"
    tolerance: { rel: 0.01 }
    hints:
      - "Sliding starts when the push reaches $F = \\mu_s Mg$."
      - "Tipping is about the front bottom edge: when it is on the point of tipping, the normal force acts entirely at that edge."
      - "Compare the push's torque $Fy$ with the weight's torque $Mg\\,w/2$ about that edge."
    solution: |
      The crate slides once $F = \mu_s Mg$. About the front bottom edge, the push has torque $Fy$ (tipping) and the
      weight $Mg\tfrac{w}{2}$ (restoring); friction and the normal force (at the edge, at the limit) have none. It
      tips first if $Fy > Mg\,w/2$ at a force below $\mu_s Mg$. So it slides first provided
      $$\mu_s Mg\,y \le Mg\frac{w}{2} \Rightarrow y \le \frac{w}{2\mu_s} = \frac{ {{w}} }{2 \times {{mu}}} \approx {{round(w/(2*mu), 3)}}\ \text{m}.$$
      The mass drops out.
    verify: "solve(mu*M*9.8*Symbol('Y') - M*9.8*w/2, Symbol('Y'))[0]"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 6

  - id: phys-equil-012
    difficulty: 4
    type: numeric
    prompt: |
      A wheel of mass {{M}} kg and radius {{R}} m rests against a kerb {{h}} m high. What horizontal force, applied at
      the axle, is just enough to lift the wheel off the road and over the kerb? Take $g = 9.8\ \text{m/s}^2$ and give
      your answer with units.
    params:
      M: { int: [10, 60] }
      R: { real: [0.2, 0.5], step: 0.05 }
      h: { real: [0.02, 0.15], step: 0.01 }
    require: ["h < R / 2"]
    answer: "M * 9.8 * sqrt(h * (2 * R - h)) / (R - h)"
    units: "N"
    tolerance: { rel: 0.01 }
    hints:
      - "At the moment it lifts off, the road's normal force is zero: only the kerb edge, the weight and your push act."
      - "Take torques about the kerb edge."
      - "The axle is $R - h$ above the edge and $\\sqrt{R^2 - (R - h)^2}$ behind it horizontally."
    solution: |
      When the wheel just leaves the road, the road pushes no more. About the kerb edge the push $F$ has lever arm
      $R - h$ and the weight has lever arm $\sqrt{R^2 - (R - h)^2} = \sqrt{h(2R - h)}$:
      $$F(R - h) = Mg\sqrt{h(2R - h)} \Rightarrow F = \frac{Mg\sqrt{h(2R - h)}}{R - h} \approx {{round(M*9.8*sqrt(h*(2*R - h))/(R - h), 2)}}\ \text{N}.$$
    verify: "solve(float(np.cross([-math.sqrt(R**2 - (R - h)**2), R - h, 0], [1, 0, 0])[2])*Symbol('F') + float(np.cross([-math.sqrt(R**2 - (R - h)**2), R - h, 0], [0, -M*9.8, 0])[2]), Symbol('F'))[0]"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 6

  - id: phys-equil-013
    difficulty: 4
    type: proof
    prompt: |
      Show that if the net force on a body is zero and the net torque about one point $O$ is zero, then the net torque
      about every other point $O'$ is also zero.
    hints:
      - "Let $\\mathbf{a}$ be the vector from $O'$ to $O$. Express each force's position relative to $O'$ in terms of its position relative to $O$."
      - "$\\mathbf{r}_i' = \\mathbf{r}_i + \\mathbf{a}$."
    solution: |
      Let force $\mathbf{F}_i$ act at $\mathbf{r}_i$ measured from $O$, so from $O'$ it is at $\mathbf{r}_i' = \mathbf{r}_i + \mathbf{a}$,
      where $\mathbf{a}$ points from $O'$ to $O$. Then
      $$\boldsymbol{\tau}_{O'} = \sum_i (\mathbf{r}_i + \mathbf{a})\times\mathbf{F}_i = \sum_i \mathbf{r}_i\times\mathbf{F}_i + \mathbf{a}\times\sum_i\mathbf{F}_i = \boldsymbol{\tau}_O + \mathbf{a}\times\mathbf{F}_{\text{net}}.$$
      With $\mathbf{F}_{\text{net}} = \mathbf{0}$ and $\boldsymbol{\tau}_O = \mathbf{0}$, $\boldsymbol{\tau}_{O'} = \mathbf{0}$. $\blacksquare$
      This is why, in statics, you may take torques about whichever point removes the most unknowns.
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 4
