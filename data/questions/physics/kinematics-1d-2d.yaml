subject: physics
topic: kinematics-1d-2d
questions:
  - id: phys-kin-001
    difficulty: 1
    type: numeric
    prompt: |
      A cart starts from rest and speeds up uniformly at {{a}} m/s² for {{tf}} s. What is its final speed? Give a value with units.
    params:
      a: { real: [0.5, 5], step: 0.5 }
      tf: { int: [2, 12] }
    answer: "a * tf"
    units: "m/s"
    tolerance: { rel: 0.01 }
    hints:
      - 'Constant acceleration means the velocity changes by the same amount every second.'
      - '$v = v_0 + at$ with $v_0 = 0$.'
    solution: |
      With constant acceleration, $v = v_0 + at = 0 + {{a}}\,\text{m/s}^2 \times {{tf}}\,\text{s} = {{a*tf}}\,\text{m/s}$.
    verify: "integrate(a, (t, 0, tf))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 1

  - id: phys-kin-002
    difficulty: 1
    type: mc
    prompt: |
      On a graph of velocity $v$ (vertical axis) against time $t$ (horizontal axis), the slope of the curve at an instant is:
    options:
      - 'the acceleration at that instant'
      - 'the displacement from the start'
      - 'the position at that instant'
      - 'the distance travelled in the first second'
    answer: 0
    hints:
      - 'The slope is $\Delta v / \Delta t$ over a very short interval.'
      - 'What is the rate of change of velocity called?'
    solution: |
      The slope of a $v$–$t$ graph is $dv/dt$, which is the acceleration. (The *area* under the $v$–$t$ graph is the displacement, and the slope of an $x$–$t$ graph is the velocity.)
    verify: "(lambda xx: [diff(xx, t, 2), xx - xx.subs(t, 0), xx, xx.subs(t, 1) - xx.subs(t, 0)].index(diff(diff(xx, t), t)))(Symbol('x0') + Symbol('v0')*t + Symbol('a')*t**2/2)"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 1

  - id: phys-kin-003
    difficulty: 2
    type: numeric
    prompt: |
      A car travelling at {{v0}} km/h brakes with a constant deceleration of {{a}} m/s². How far does it travel before it stops? Give a value with units.
    params:
      v0: { int: [40, 130] }
      a: { real: [3, 9], step: 0.5 }
    let:
      vms: "v0 / 3.6"
    answer: "vms^2 / (2 * a)"
    units: "m"
    tolerance: { rel: 0.01 }
    hints:
      - 'Convert the speed to m/s first: divide km/h by 3.6.'
      - 'You do not need the time: use $v^2 = v_0^2 + 2a\,\Delta x$ with $v = 0$.'
    solution: |
      $v_0 = {{v0}}/3.6 \approx {{vms}}\,\text{m/s}$. With final speed $0$ and acceleration $-{{a}}\,\text{m/s}^2$:
      $$0 = v_0^2 - 2a\,\Delta x \quad\Rightarrow\quad \Delta x = \frac{v_0^2}{2a} = \frac{ {{vms}}^2 }{2 \times {{a}}} \approx {{vms^2/(2*a)}}\,\text{m}.$$
    verify: "(lambda ts: integrate(v0/3.6 - a*t, (t, 0, ts)))(solve(v0/3.6 - a*t, t)[0])"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 3

  - id: phys-kin-004
    difficulty: 2
    type: numeric
    prompt: |
      A ball is thrown straight up at {{v0}} m/s. Ignoring air resistance and taking $g = 9.8\,\text{m/s}^2$, how high above the release point does it rise? Give a value with units.
    params:
      v0: { real: [5, 30], step: 0.5 }
    let:
      g: 9.8
    answer: "v0^2 / (2 * g)"
    units: "m"
    tolerance: { rel: 0.01 }
    hints:
      - 'At the highest point the velocity is momentarily zero.'
      - 'Use $v^2 = v_0^2 - 2g\,\Delta y$ with $v = 0$.'
    solution: |
      At the top $v = 0$, so $0 = v_0^2 - 2g\,h$ and
      $h = \dfrac{v_0^2}{2g} = \dfrac{ {{v0}}^2 }{2 \times 9.8} \approx {{v0^2/(2*g)}}\,\text{m}$.
    verify: "(lambda yy: yy.subs(t, solve(diff(yy, t), t)[0]))(v0*t - Rational(49, 10)*t**2)"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 2

  - id: phys-kin-005
    difficulty: 2
    type: numeric
    prompt: |
      You drive {{d1}} km at a steady {{v1}} km/h, then {{d2}} km at a steady {{v2}} km/h. What is your average speed for the whole trip? Give a value with units.
    params:
      d1: { int: [10, 100] }
      d2: { int: [10, 100] }
      v1: { int: [30, 120] }
      v2: { int: [30, 120] }
    require: ["abs(v1 - v2) >= 10"]
    let:
      t1: "d1 / v1"
      t2: "d2 / v2"
    answer: "(d1 + d2) / (t1 + t2)"
    units: "km/h"
    tolerance: { rel: 0.01 }
    hints:
      - 'Average speed is total distance divided by total time, not the average of the two speeds.'
      - 'Find the time for each leg: $t = d/v$.'
    solution: |
      Leg 1 takes $t_1 = \dfrac{ {{d1}} }{ {{v1}} } \approx {{t1}}\,\text{h}$, leg 2 takes $t_2 = \dfrac{ {{d2}} }{ {{v2}} } \approx {{t2}}\,\text{h}$.
      $$\bar v = \frac{d_1 + d_2}{t_1 + t_2} = \frac{ {{d1 + d2}} }{ {{t1 + t2}} } \approx {{(d1 + d2)/(t1 + t2)}}\,\text{km/h}.$$
      This is weighted towards the slower leg, because you spend longer on it.
    verify: "(d1 + d2)/sum(solve(Eq(vv*Symbol('tt'), dd), Symbol('tt'))[0] for vv, dd in [(v1, d1), (v2, d2)])"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 3

  - id: phys-kin-006
    difficulty: 3
    type: numeric
    prompt: |
      A speeding car passes a parked police car at a constant {{v}} m/s. At that instant the police car starts from rest with constant acceleration {{a}} m/s². How long after starting does the police car draw level with the speeder? Give a value with units.
    params:
      v: { int: [20, 45] }
      a: { real: [2, 6], step: 0.5 }
    answer: "2 * v / a"
    units: "s"
    tolerance: { rel: 0.01 }
    hints:
      - 'Write both positions as functions of time, measured from the police car.'
      - 'Speeder: $x_s = vt$. Police: $x_p = \tfrac12 a t^2$. Set them equal.'
    solution: |
      $x_s(t) = {{v}}t$ and $x_p(t) = \tfrac12({{a}})t^2$. They are level when
      $$\tfrac12 a t^2 = vt \quad\Rightarrow\quad t\left(\tfrac12 a t - v\right) = 0.$$
      The root $t = 0$ is the moment they start together; the other is $t = \dfrac{2v}{a} = \dfrac{2 \times {{v}}}{ {{a}} } \approx {{2*v/a}}\,\text{s}$.
      (At that moment the police car is moving at $at = 2v$, twice the speeder's speed.)
    verify: "max(np.roots([a/2, -v, 0]))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 4

  - id: phys-kin-007
    difficulty: 2
    type: multipart
    prompt: |
      A stone is dropped from rest from a bridge {{h}} m above the water. Ignore air resistance and take $g = 9.8\,\text{m/s}^2$.
    params:
      h: { real: [5, 80], step: 0.5 }
    let:
      g: 9.8
    parts:
      - prompt: "(a) How long does it take to reach the water? Give a value with units."
        type: numeric
        answer: "sqrt(2 * h / g)"
        units: "s"
        tolerance: { rel: 0.01 }
        verify: "max(np.roots([4.9, 0, -h]))"
      - prompt: "(b) Using your time from (a), how fast is it moving when it hits the water?"
        type: numeric
        answer: "g * part1"
        units: "m/s"
        tolerance: { rel: 0.01 }
        verify: "math.sqrt(2*9.8*h)"
    hints:
      - 'Starting from rest, the distance fallen is $\tfrac12 g t^2$.'
      - 'The speed after falling for time $t$ is $v = gt$.'
    solution: |
      (a) $h = \tfrac12 g t^2$, so $t = \sqrt{2h/g} = \sqrt{2 \times {{h}} / 9.8} \approx {{sqrt(2*h/g)}}\,\text{s}$.

      (b) $v = gt \approx 9.8 \times {{sqrt(2*h/g)}} \approx {{g*sqrt(2*h/g)}}\,\text{m/s}$. (Check: $v = \sqrt{2gh}$ gives the same.)
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 3

  - id: phys-kin-008
    difficulty: 3
    type: vector
    prompt: |
      A particle moves in the plane with position $\vec r(t) = \left({{p}}t^2 {{signed: q}}t\right)\hat\imath + {{c}}t^3\,\hat\jmath$ (metres, $t$ in seconds). Find its velocity at $t = {{t1}}\,\text{s}$, in m/s, as components `vx, vy`.
    params:
      p: { int: [1, 5] }
      q: { int: [-4, 4], not: [0] }
      c: { int: [2, 4] }
      t1: { int: [1, 4] }
    answer: "[2 * p * t1 + q, 3 * c * t1^2]"
    hints:
      - 'Velocity is the time derivative of position, component by component.'
      - '$v_x = \dfrac{d}{dt}\left({{p}}t^2 {{signed: q}}t\right)$ and $v_y = \dfrac{d}{dt}\left({{c}}t^3\right)$.'
    solution: |
      $v_x = \dfrac{dx}{dt} = {{2*p}}t {{signed: q}}$ and $v_y = \dfrac{dy}{dt} = {{3*c}}t^2$.
      At $t = {{t1}}$: $v_x = {{2*p*t1 + q}}$ and $v_y = {{3*c*t1^2}}$, so $\vec v = {{row: [2*p*t1 + q, 3*c*t1^2]}}\,\text{m/s}$.
    verify: "[diff(p*t**2 + q*t, t).subs(t, t1), diff(c*t**3, t).subs(t, t1)]"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 3

  - id: phys-kin-009
    difficulty: 3
    type: numeric
    prompt: |
      A puck on an air table starts at the origin with velocity $\vec v_0 = {{row: [vx, vy]}}\,\text{m/s}$ and has constant acceleration $\vec a = {{row: [ax, ay]}}\,\text{m/s}^2$. How far from the origin is it at $t = {{t1}}\,\text{s}$? Give a value with units.
    params:
      vx: { int: [-5, 5] }
      vy: { int: [-5, 5] }
      ax: { real: [-3, 3], step: 0.5 }
      ay: { real: [-3, 3], step: 0.5 }
      t1: { int: [2, 6] }
    let:
      sx: "vx * t1 + ax * t1^2 / 2"
      sy: "vy * t1 + ay * t1^2 / 2"
    require: ["sqrt(sx^2 + sy^2) > 1"]
    answer: "sqrt(sx^2 + sy^2)"
    units: "m"
    tolerance: { rel: 0.01 }
    hints:
      - 'The $x$ and $y$ motions are independent, each with constant acceleration.'
      - '$x = v_{0x}t + \tfrac12 a_x t^2$, and the same for $y$.'
      - 'Then the distance is $\sqrt{x^2 + y^2}$.'
    solution: |
      $x = ({{vx}})({{t1}}) + \tfrac12({{ax}})({{t1}})^2 = {{sx}}\,\text{m}$ and $y = ({{vy}})({{t1}}) + \tfrac12({{ay}})({{t1}})^2 = {{sy}}\,\text{m}$.
      Distance: $\sqrt{x^2 + y^2} \approx {{sqrt(sx^2 + sy^2)}}\,\text{m}$.
    verify: "(lambda s: math.hypot(float(s[0]), float(s[1])))([integrate(vv + aa*Symbol('u'), (Symbol('u'), 0, t1)) for vv, aa in [(vx, ax), (vy, ay)]])"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 4

  - id: phys-kin-010
    difficulty: 4
    type: numeric
    prompt: |
      From the edge of a cliff {{h}} m above the beach, a stone is thrown straight up at {{v0}} m/s. It rises, falls past the edge and lands on the beach. Ignoring air resistance ($g = 9.8\,\text{m/s}^2$), how long after release does it land? Give a value with units.
    params:
      h: { int: [10, 80] }
      v0: { real: [2, 25], step: 0.5 }
    let:
      g: 9.8
    answer: "(v0 + sqrt(v0^2 + 2 * g * h)) / g"
    units: "s"
    tolerance: { rel: 0.01 }
    hints:
      - 'Take up as positive and the release point as $y = 0$; the beach is at $y = -{{h}}$.'
      - 'Solve $-{{h}} = {{v0}}t - 4.9t^2$ and keep the positive root.'
    solution: |
      With up positive, $y(t) = v_0 t - \tfrac12 g t^2$, and the stone lands when $y = -h$:
      $$4.9t^2 - {{v0}}t - {{h}} = 0 \quad\Rightarrow\quad t = \frac{ {{v0}} + \sqrt{ {{v0}}^2 + 4(4.9)({{h}})} }{2(4.9)} \approx {{(v0 + sqrt(v0^2 + 2*g*h))/g}}\,\text{s}.$$
      The other root is negative and has no physical meaning here.
    verify: "max(np.roots([-4.9, v0, h]))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 5

  - id: phys-kin-011
    difficulty: 4
    type: numeric
    prompt: |
      A river {{d}} m wide flows at {{w}} m/s. A boat moves at {{u}} m/s relative to the water. The pilot heads upstream at just the angle needed to land directly opposite the starting point. How long does the crossing take? Give a value with units.
    params:
      d: { int: [40, 200] }
      w: { real: [0.5, 2.5], step: 0.5 }
      u: { real: [3, 8], step: 0.5 }
    let:
      vacross: "sqrt(u^2 - w^2)"
    answer: "d / vacross"
    units: "s"
    tolerance: { rel: 0.01 }
    hints:
      - 'The velocity relative to the ground is the boat''s velocity relative to the water plus the water''s velocity.'
      - 'To go straight across, the upstream component of the boat''s velocity must cancel the current: $u\sin\theta = w$.'
      - 'The ground velocity is then purely across, with magnitude $\sqrt{u^2 - w^2}$.'
    solution: |
      Let the boat head at angle $\theta$ upstream of straight across. The along-stream components cancel when $u\sin\theta = w$, so $\sin\theta = {{w}}/{{u}}$ and $\theta \approx {{asin(w/u)*180/pi}}^\circ$.
      The across-stream speed is $u\cos\theta = \sqrt{u^2 - w^2} = \sqrt{ {{u}}^2 - {{w}}^2 } \approx {{vacross}}\,\text{m/s}$, so
      $t = \dfrac{d}{\sqrt{u^2 - w^2}} = \dfrac{ {{d}} }{ {{vacross}} } \approx {{d/vacross}}\,\text{s}$.
    verify: "d/(u*math.cos(math.asin(w/u)))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 5

  - id: phys-kin-012
    difficulty: 4
    type: proof
    prompt: |
      For motion with constant acceleration $a$, start from $v = v_0 + at$ and $x = x_0 + v_0 t + \tfrac12 a t^2$, and derive $v^2 = v_0^2 + 2a(x - x_0)$, which contains no $t$.
    hints:
      - 'Solve the velocity equation for $t$ (assume $a \neq 0$).'
      - 'Substitute $t = (v - v_0)/a$ into the position equation.'
      - 'Multiply through by $2a$ and simplify.'
    solution: |
      From $v = v_0 + at$, $t = \dfrac{v - v_0}{a}$. Substituting into the position equation:
      $$x - x_0 = v_0\frac{v - v_0}{a} + \frac{a}{2}\frac{(v - v_0)^2}{a^2}.$$
      Multiply by $2a$:
      $$2a(x - x_0) = 2v_0 v - 2v_0^2 + v^2 - 2v v_0 + v_0^2 = v^2 - v_0^2,$$
      so $v^2 = v_0^2 + 2a(x - x_0)$. (For $a = 0$ both sides reduce to $v = v_0$.)

      A cleaner route: $a\,\dfrac{dx}{dt} = \dfrac{dv}{dt}\,v$, i.e. $a\,dx = v\,dv$; integrating gives $a(x - x_0) = \tfrac12(v^2 - v_0^2)$.
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 6

  - id: phys-kin-013
    difficulty: 5
    type: numeric
    prompt: |
      A motorboat cuts its engine while moving at {{v0}} m/s. Water drag then gives it an acceleration $a = -kv$, with $k = {{k}}\,\text{s}^{-1}$, opposite to its velocity $v$. How far does it coast in total (as $t \to \infty$)? Give a value with units.
    params:
      v0: { real: [2, 12], step: 0.5 }
      k: { real: [0.1, 0.8], step: 0.05 }
    answer: "v0 / k"
    units: "m"
    tolerance: { rel: 0.01 }
    hints:
      - 'Solve $\dfrac{dv}{dt} = -kv$: the speed decays exponentially.'
      - '$v(t) = v_0 e^{-kt}$. Integrate it from $0$ to $\infty$.'
      - 'Alternatively, write $a = v\,\dfrac{dv}{dx}$, so $\dfrac{dv}{dx} = -k$.'
    solution: |
      $\dfrac{dv}{dt} = -kv$ gives $v(t) = v_0 e^{-kt}$: the boat never quite stops, but it covers a finite distance:
      $$x_\infty = \int_0^\infty v_0 e^{-kt}\,dt = \frac{v_0}{k} = \frac{ {{v0}} }{ {{k}} } \approx {{v0/k}}\,\text{m}.$$
      Shortcut: $a = v\,\dfrac{dv}{dx} = -kv$ means $\dfrac{dv}{dx} = -k$, so the speed falls linearly with distance and reaches $0$ after $v_0/k$.
    verify: "integrate(dsolve(Eq(Function('w')(t).diff(t), -k*Function('w')(t)), ics={Function('w')(0): v0}).rhs, (t, 0, oo))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 7

  - id: phys-kin-014
    difficulty: 2
    type: estimate
    prompt: |
      Estimate how far a car on a motorway travels during the driver's reaction time: between seeing a hazard and pressing the brake. Give a value with units.
    answer: "110 / 3.6 * 1.0"
    units: "m"
    factor: 3
    hints:
      - 'Motorway speed: roughly 100–120 km/h. Convert to m/s.'
      - 'A typical reaction time is about one second.'
    solution: |
      At about $110\,\text{km/h} \approx 30\,\text{m/s}$ and a reaction time of about $1\,\text{s}$, the car covers $\approx 30\,\text{m}$ before braking even begins, comparable to the braking distance itself.
    verify: "integrate(Rational(110*1000, 3600), (t, 0, 1))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 2
