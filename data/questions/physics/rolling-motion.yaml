subject: physics
topic: rolling-motion
questions:
  - id: phys-roll-001
    difficulty: 1
    type: numeric
    prompt: |
      A car travels at {{v}} m/s on tyres of radius {{R}} m that roll without slipping. What is the angular velocity
      of each wheel? Give your answer with units.
    params:
      v: { int: [10, 35] }
      R: { real: [0.25, 0.4], step: 0.01 }
    answer: "v / R"
    units: "rad/s"
    tolerance: { rel: 0.01 }
    hints:
      - "Rolling without slipping means the point of the tyre touching the road is momentarily at rest."
      - "That gives $v_{\\text{cm}} = \\omega R$."
    solution: |
      The contact point has velocity $v - \omega R = 0$, so
      $\omega = \dfrac{v}{R} = \dfrac{ {{v}} }{ {{R}} } \approx {{round(v/R, 2)}}\ \text{rad/s}$.
    verify: "solve(v - Symbol('w')*R, Symbol('w'))[0]"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 2

  - id: phys-roll-002
    difficulty: 1
    type: mc
    prompt: |
      A wheel rolls without slipping along level ground; its centre moves at speed $v$. How fast is the point at the
      very top of the wheel moving, relative to the ground?
    options:
      - "$2v$"
      - "$v$"
      - "$0$"
      - "$\\sqrt{2}\\,v$"
    answer: 0
    hints:
      - "Add the velocity of the centre to the velocity of the point due to rotation about the centre."
      - "Or: think of the wheel as rotating instantaneously about the contact point."
    solution: |
      Relative to the centre, the top moves forwards at $\omega R = v$; adding the centre's velocity $v$ gives $2v$.
      Equivalently, the wheel turns about the contact point at angular speed $\omega$, and the top is $2R$ from it,
      so its speed is $\omega \cdot 2R = 2v$. (The contact point itself has speed 0.)
    verify: "0 if abs(np.linalg.norm(np.array([3.0, 0, 0]) + np.cross([0, 0, -3.0/0.4], [0, 0.4, 0])) - 2*3.0) < 1e-12 else 1"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 2

  - id: phys-roll-003
    difficulty: 1
    type: estimate
    prompt: "Estimate how many times a bicycle wheel turns during a 10 km ride."
    answer: "10000 / (pi * 0.7)"
    factor: 2
    hints:
      - "An adult's bicycle wheel is about 70 cm in diameter."
      - "Rolling without slipping, one turn carries the bike one circumference forward."
    solution: |
      Circumference $\approx \pi \times 0.7\ \text{m} \approx 2.2$ m, so
      $N \approx 10\,000\ \text{m} / 2.2\ \text{m} \approx 4\,500$ turns.
    verify: "10000 / (2*pi*0.35)"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 2

  - id: phys-roll-004
    difficulty: 2
    type: numeric
    prompt: |
      A uniform solid cylinder of mass {{M}} kg rolls without slipping across a floor; its centre moves at {{v}} m/s.
      What is its total kinetic energy? Give your answer with units.
    params:
      M: { real: [1, 20], step: 0.5 }
      v: { real: [1, 10], step: 0.5 }
    answer: "0.75 * M * v^2"
    units: "J"
    tolerance: { rel: 0.01 }
    hints:
      - "$K = \\tfrac12 Mv^2 + \\tfrac12 I_{\\text{cm}}\\omega^2$ with $\\omega = v/R$."
      - "For a solid cylinder $I_{\\text{cm}} = \\tfrac12 MR^2$; the radius cancels."
    solution: |
      $$K = \tfrac12 Mv^2 + \tfrac12\Big(\tfrac12 MR^2\Big)\frac{v^2}{R^2} = \tfrac34 Mv^2 = 0.75 \times {{M}} \times {{v}}^2 \approx {{round(0.75*M*v^2, 3)}}\ \text{J}.$$
      One third of it is rotational.
    verify: "Rational(1, 2)*M*v**2 + Rational(1, 2)*integrate(2*Symbol('rho')**3*M/0.3**2, (Symbol('rho'), 0, 0.3))*(v/0.3)**2"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 2

  - id: phys-roll-005
    difficulty: 2
    type: numeric
    prompt: |
      A solid ball starts from rest and rolls without slipping down a ramp, dropping a height of {{h}} m. How fast is
      its centre moving at the bottom? Take $g = 9.8\ \text{m/s}^2$ and give your answer with units.
    params:
      h: { real: [0.5, 5], step: 0.5 }
    answer: "sqrt(10 * 9.8 * h / 7)"
    units: "m/s"
    tolerance: { rel: 0.01 }
    hints:
      - "Static friction does no work on a ball that rolls without slipping, so mechanical energy is conserved."
      - "$Mgh = \\tfrac12 Mv^2 + \\tfrac12\\cdot\\tfrac25 MR^2\\cdot(v/R)^2$."
    solution: |
      $$Mgh = \tfrac12 Mv^2 + \tfrac15 Mv^2 = \tfrac{7}{10}Mv^2 \Rightarrow v = \sqrt{\tfrac{10}{7}gh} = \sqrt{\tfrac{10}{7} \times 9.8 \times {{h}}} \approx {{round(sqrt(10*9.8*h/7), 3)}}\ \text{m/s}.$$
      That is slower than a frictionless slide ($\sqrt{2gh} \approx {{round(sqrt(2*9.8*h), 3)}}$ m/s) because some energy goes into spin.
    verify: "max(solve(Rational(1, 2)*Symbol('v')**2 + Rational(1, 2)*Rational(2, 5)*Symbol('v')**2 - 9.8*h, Symbol('v')))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 3

  - id: phys-roll-006
    difficulty: 2
    type: mc
    prompt: |
      Four objects of the same mass and radius are released together from rest at the top of the same ramp and roll
      without slipping: a solid sphere, a solid cylinder, a thin hoop and a thin hollow sphere. Which reaches the
      bottom first?
    options:
      - "The solid sphere"
      - "The solid cylinder"
      - "The thin hoop"
      - "The thin hollow sphere"
    answer: 0
    hints:
      - "Write $I = kMR^2$. The acceleration down the slope is $a = \\dfrac{g\\sin\\theta}{1 + k}$."
      - "The winner has the smallest $k$: the most mass near the axis."
    solution: |
      With $I = kMR^2$, $a = g\sin\theta/(1 + k)$, independent of mass and radius. The values of $k$ are $\tfrac25$
      (solid sphere), $\tfrac12$ (solid cylinder), $\tfrac23$ (hollow sphere) and $1$ (hoop). The solid sphere has the
      smallest $k$, so the largest acceleration, and wins; the hoop comes last.
    verify: "int(np.argmax([1/(1 + k) for k in [0.4, 0.5, 1.0, 2/3]]))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 2

  - id: phys-roll-007
    difficulty: 3
    type: multipart
    prompt: |
      A {{shape}} rolls without slipping down a ramp inclined at {{th}}° to the horizontal.
      Take $g = 9.8\ \text{m/s}^2$.
    params:
      i: { int: [0, 3] }
      th: { int: [10, 50] }
    let:
      shape: '["uniform solid cylinder", "uniform solid sphere", "thin hoop", "thin hollow sphere"][i + 1]'
      k: "[1/2, 2/5, 1, 2/3][i + 1]"
    parts:
      - prompt: "(a) What is the acceleration of its centre? Give it with units."
        type: numeric
        answer: "9.8 * sin(th * pi / 180) / (1 + k)"
        units: "m/s^2"
        tolerance: { rel: 0.01 }
        verify: "(lambda kk: solve([9.8*math.sin(math.radians(th)) - Symbol('f') - Symbol('a'), Symbol('f') - kk*Symbol('a')], [Symbol('a'), Symbol('f')])[Symbol('a')])((integrate(2*x**3, (x, 0, 1)) if i == 0 else Rational(3, 2)*integrate(x**4, (x, 0, 1))*integrate(1 - y**2, (y, -1, 1)) if i == 1 else 1 if i == 2 else integrate(1 - y**2, (y, -1, 1))/2))"
      - prompt: "(b) Using your answer to (a), what is the smallest coefficient of static friction that lets it roll without slipping? (A pure number.)"
        type: numeric
        answer: "k * part1 / (9.8 * cos(th * pi / 180))"
        tolerance: { rel: 0.01 }
        verify: "(lambda kk: solve([9.8*math.sin(math.radians(th)) - Symbol('f') - Symbol('a'), Symbol('f') - kk*Symbol('a')], [Symbol('a'), Symbol('f')])[Symbol('f')] / (9.8*math.cos(math.radians(th))))((integrate(2*x**3, (x, 0, 1)) if i == 0 else Rational(3, 2)*integrate(x**4, (x, 0, 1))*integrate(1 - y**2, (y, -1, 1)) if i == 1 else 1 if i == 2 else integrate(1 - y**2, (y, -1, 1))/2))"
    hints:
      - "For a {{shape}}, $I_{\\text{cm}} = {{frac: k}}\\,MR^2$."
      - "Along the slope: $Ma = Mg\\sin\\theta - f$. About the centre: $fR = I\\alpha = I a/R$."
      - "Rolling needs $f \\le \\mu_s N$ with $N = Mg\\cos\\theta$."
    solution: |
      (a) With $I = kMR^2$, $k = {{frac: k}}$: the torque equation gives $f = kMa$, so $Ma = Mg\sin\theta - kMa$ and
      $$a = \frac{g\sin\theta}{1 + k} = \frac{9.8 \sin {{th}}°}{1 + {{frac: k}}} \approx {{round(9.8*sin(th*pi/180)/(1 + k), 3)}}\ \text{m/s}^2.$$
      (b) The friction needed is $f = kMa$, and at most $\mu_s Mg\cos\theta$ is available, so
      $$\mu_s \ge \frac{ka}{g\cos\theta} = \frac{k}{1 + k}\tan\theta \approx {{round(k/(1 + k)*tan(th*pi/180), 4)}}.$$
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 6

  - id: phys-roll-008
    difficulty: 3
    type: numeric
    prompt: |
      A yo-yo is a uniform disc of radius {{R}} m (treat it as a solid disc) with its string wound around a thin axle
      of radius {{r}} m. Holding the end of the string still, you release the yo-yo from rest. What is the
      acceleration of its centre as it falls? Take $g = 9.8\ \text{m/s}^2$ and give your answer with units.
    params:
      R: { real: [0.03, 0.06], step: 0.005 }
      r: { real: [0.005, 0.015], step: 0.001 }
    answer: "9.8 / (1 + R^2 / (2 * r^2))"
    units: "m/s^2"
    tolerance: { rel: 0.01 }
    hints:
      - "The string unwinds from the axle without slipping: $a = \\alpha r$ (the small radius, not $R$)."
      - "$Mg - T = Ma$ and $Tr = \\tfrac12 MR^2\\alpha$."
    solution: |
      From the torque equation, $T = \tfrac12 MR^2 a / r^2$. Substituting into $Mg - T = Ma$:
      $$a = \frac{g}{1 + \dfrac{R^2}{2r^2}} = \frac{9.8}{1 + \dfrac{ {{R}}^2}{2 \times {{r}}^2}} \approx {{round(9.8/(1 + R^2/(2*r^2)), 4)}}\ \text{m/s}^2.$$
      The thin axle makes the descent slow, and the string tension nearly equals the weight.
    verify: "solve([9.8 - Symbol('Tn') - Symbol('a'), Symbol('Tn')*r - Rational(1, 2)*R**2*Symbol('a')/r], [Symbol('a'), Symbol('Tn')])[Symbol('a')]"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 4

  - id: phys-roll-009
    difficulty: 3
    type: numeric
    prompt: |
      A solid ball rolls without slipping across a level floor at {{v}} m/s and then rolls up a ramp, still without
      slipping. How high above the floor does its centre rise before it stops? Take $g = 9.8\ \text{m/s}^2$ and give
      your answer with units.
    params:
      v: { real: [1, 6], step: 0.5 }
    answer: "7 * v^2 / (10 * 9.8)"
    units: "m"
    tolerance: { rel: 0.01 }
    hints:
      - "Count both kinds of kinetic energy at the bottom."
      - "If it rolls without slipping all the way up, all of it becomes potential energy at the top."
    solution: |
      At the bottom $K = \tfrac12 Mv^2 + \tfrac12\cdot\tfrac25 MR^2 (v/R)^2 = \tfrac{7}{10}Mv^2$. At the highest point the
      ball is momentarily at rest and not spinning, so
      $$Mgh = \tfrac{7}{10}Mv^2 \Rightarrow h = \frac{7v^2}{10g} = \frac{7 \times {{v}}^2}{98} \approx {{round(7*v^2/98, 4)}}\ \text{m}.$$
    verify: "solve(9.8*Symbol('hh') - (Rational(1, 2)*v**2 + Rational(1, 5)*v**2), Symbol('hh'))[0]"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 3

  - id: phys-roll-010
    difficulty: 4
    type: numeric
    prompt: |
      A bowling ball (a uniform solid sphere) is launched along the lane at {{v0}} m/s without any spin. The
      coefficient of kinetic friction between ball and lane is {{mu}}. How far does the ball skid before it starts to
      roll without slipping? Take $g = 9.8\ \text{m/s}^2$ and give your answer with units.
    params:
      v0: { real: [3, 9], step: 0.5 }
      mu: { real: [0.05, 0.3], step: 0.05 }
    answer: "12 * v0^2 / (49 * mu * 9.8)"
    units: "m"
    tolerance: { rel: 0.01 }
    hints:
      - "While it skids, kinetic friction $\\mu Mg$ slows the centre and spins the ball up."
      - "$v(t) = v_0 - \\mu g t$ and $\\omega(t) = \\dfrac{\\mu M g R}{\\tfrac25 MR^2}t = \\dfrac{5\\mu g}{2R}t$."
      - "Skidding stops when $v = \\omega R$."
    solution: |
      Rolling starts when $v_0 - \mu g t = \tfrac52\mu g t$, i.e. at $t^* = \dfrac{2v_0}{7\mu g} \approx {{round(2*v0/(7*mu*9.8), 4)}}$ s
      (when the speed has fallen to $\tfrac57 v_0$). The distance skidded is
      $$d = v_0 t^* - \tfrac12\mu g t^{*2} = \frac{12 v_0^2}{49\mu g} \approx {{round(12*v0^2/(49*mu*9.8), 3)}}\ \text{m}.$$
    verify: "(lambda ts: v0*ts - Rational(1, 2)*mu*9.8*ts**2)(solve(v0 - mu*9.8*t - Rational(5, 2)*mu*9.8*t, t)[0])"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 7

  - id: phys-roll-011
    difficulty: 4
    type: numeric
    prompt: |
      A spool is a uniform disc of mass {{M}} kg and radius {{R}} m (treat it as a solid disc) with thread wound on a
      hub of radius {{r}} m. The spool stands on a rough floor; the thread leaves the **bottom** of the hub and is
      pulled horizontally with a force of {{F}} N. The spool rolls without slipping. What is the magnitude of the
      acceleration of its centre? Give your answer with units.
    params:
      M: { real: [0.5, 3], step: 0.5 }
      R: { real: [0.05, 0.15], step: 0.01 }
      r: { real: [0.01, 0.04], step: 0.005 }
      F: { real: [1, 10], step: 0.5 }
    require: ["r < R - 0.005"]
    answer: "F * (R - r) / (1.5 * M * R)"
    units: "m/s^2"
    tolerance: { rel: 0.01 }
    hints:
      - "Unknowns: $a$ and the friction $f$ at the floor. Rolling: $\\alpha = a/R$."
      - "Take torques about the centre: the thread (lever arm $r$) and friction (lever arm $R$) turn the spool opposite ways."
      - "Or take torques about the contact point, where friction has no lever arm: the thread acts $R - r$ above it."
    solution: |
      Take torques about the contact point $P$, through which friction and the normal force pass. The thread is
      $R - r$ above $P$, and $I_P = \tfrac12 MR^2 + MR^2 = \tfrac32 MR^2$:
      $$F(R - r) = \tfrac32 MR^2\,\frac{a}{R} \Rightarrow a = \frac{F(R - r)}{\tfrac32 MR} \approx {{round(F*(R - r)/(1.5*M*R), 4)}}\ \text{m/s}^2,$$
      towards the pull. (The spool rolls towards you and winds the thread up.)
    verify: "solve([F - Symbol('f') - M*Symbol('a'), R*Symbol('f') - r*F - Rational(1, 2)*M*R**2*Symbol('a')/R], [Symbol('a'), Symbol('f')])[Symbol('a')]"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 7

  - id: phys-roll-012
    difficulty: 4
    type: proof
    prompt: |
      A body of mass $M$ rolls without slipping with angular velocity $\omega$. Show that its kinetic energy
      $\tfrac12 Mv_{\text{cm}}^2 + \tfrac12 I_{\text{cm}}\omega^2$ equals $\tfrac12 I_P\,\omega^2$, where $I_P$ is the moment of
      inertia about the contact point $P$.
    hints:
      - "Use the rolling condition $v_{\\text{cm}} = \\omega R$, where $R$ is the distance from $P$ to the centre of mass."
      - "Apply the parallel-axis theorem to $I_P$."
    solution: |
      With $v_{\text{cm}} = \omega R$,
      $$\tfrac12 Mv_{\text{cm}}^2 + \tfrac12 I_{\text{cm}}\omega^2 = \tfrac12\big(MR^2 + I_{\text{cm}}\big)\omega^2.$$
      The axis through $P$ is parallel to the one through the centre of mass and a distance $R$ from it, so by the
      parallel-axis theorem $I_P = I_{\text{cm}} + MR^2$. Hence $K = \tfrac12 I_P\omega^2$: at each instant the rolling body
      moves as if it were rotating purely about the contact point. $\blacksquare$
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 4

  - id: phys-roll-013
    difficulty: 5
    type: numeric
    prompt: |
      A small solid ball is balanced on top of a large fixed sphere and nudged, so that it starts from rest and rolls
      without slipping down the side. At what angle from the vertical (measured at the big sphere's centre) does the
      ball lose contact? Give your answer with units.
    answer: "acos(10 / 17) * 180 / pi"
    units: "deg"
    tolerance: { rel: 0.005 }
    hints:
      - "The centre of the ball moves on a circle of radius $\\rho = R + r$ while it stays in contact."
      - "Energy: $Mg\\rho(1 - \\cos\\theta) = \\tfrac12 Mv^2 + \\tfrac12\\cdot\\tfrac25 Mr^2(v/r)^2$."
      - "Contact is lost when the normal force vanishes: $Mg\\cos\\theta = Mv^2/\\rho$."
    solution: |
      Let $\rho = R + r$. Energy conservation (friction does no work in rolling) gives
      $$Mg\rho(1 - \cos\theta) = \tfrac{7}{10}Mv^2 \Rightarrow v^2 = \tfrac{10}{7}g\rho(1 - \cos\theta).$$
      Radially, $Mg\cos\theta - N = Mv^2/\rho$. Setting $N = 0$:
      $$g\cos\theta = \tfrac{10}{7}g(1 - \cos\theta) \Rightarrow \cos\theta = \tfrac{10}{17},\qquad \theta \approx 54.0°.$$
      (A frictionless particle leaves at $\cos\theta = \tfrac23$, about $48.2°$; the rolling ball, with less kinetic
      energy in translation, hangs on longer.)
    verify: "acos(solve(9.8*Symbol('c') - Rational(10, 7)*9.8*(1 - Symbol('c')), Symbol('c'))[0])*180/pi"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 8
