subject: physics
topic: momentum-impulse-collisions
questions:
  - id: phys-mom-001
    difficulty: 1
    type: numeric
    prompt: |
      A {{m}} kg car travels at {{v}} km/h. What is the magnitude of its momentum? Give a value with units.
    params:
      m: { int: [800, 2000] }
      v: { int: [20, 120] }
    answer: "m * v / 3.6"
    units: "kg m/s"
    tolerance: { rel: 0.01 }
    hints:
      - '$p = mv$, with $v$ in m/s.'
      - 'Divide km/h by 3.6 to get m/s.'
    solution: |
      $v = {{v}}/3.6 \approx {{v/3.6}}\,\text{m/s}$, so $p = mv \approx {{m}} \times {{v/3.6}} \approx {{m*v/3.6}}\,\text{kg·m/s}$.
    verify: "m*Rational(v*1000, 3600)"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 1

  - id: phys-mom-002
    difficulty: 2
    type: numeric
    prompt: |
      A bat strikes a ball. The force on the ball rises linearly from zero to a peak of {{Fmax}} N and falls linearly back to zero, the whole contact lasting {{tau}} ms. What impulse does the bat give the ball? Give a value with units.
    params:
      Fmax: { int: [100, 3000] }
      tau: { int: [2, 20] }
    answer: "Fmax * (tau / 1000) / 2"
    units: "N s"
    tolerance: { rel: 0.01 }
    hints:
      - 'Impulse is the area under the force–time graph.'
      - 'Here the graph is a triangle of base {{tau}} ms and height {{Fmax}} N.'
    solution: |
      $J = \int F\,dt$ is the area of a triangle: $J = \tfrac12 \times {{Fmax}}\,\text{N} \times {{tau/1000}}\,\text{s} \approx {{Fmax*(tau/1000)/2}}\,\text{N·s}$.
      That equals the change in the ball's momentum.
    verify: "integrate(Piecewise((2*Fmax*t/(Rational(tau, 1000)), t < Rational(tau, 2000)), (2*Fmax*(Rational(tau, 1000) - t)/Rational(tau, 1000), True)), (t, 0, Rational(tau, 1000)))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 2

  - id: phys-mom-003
    difficulty: 1
    type: mc
    prompt: |
      Two carts collide on a frictionless track and stick together. No external horizontal force acts. Which quantity is the same just before and just after the collision?
    options:
      - 'The total momentum of the two carts'
      - 'The total kinetic energy of the two carts'
      - 'The velocity of each cart'
      - 'The momentum of each cart'
    answer: 0
    hints:
      - 'With no external force, what does Newton''s third law say about the impulses the carts give each other?'
      - 'A sticking collision is perfectly inelastic.'
    solution: |
      The carts exert equal and opposite forces on each other for the same time, so their impulses cancel: total momentum is conserved. Each cart's own momentum changes, and since they stick, some kinetic energy turns into heat and deformation; kinetic energy is not conserved.
    verify: "(lambda m1, v1, m2, vf: [m1*v1 == (m1 + m2)*vf, m1*v1**2/2 == (m1 + m2)*vf**2/2, v1 == vf, m1*v1 == m1*vf].index(True))(2, 3, 1, Rational(2*3, 3))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 1

  - id: phys-mom-004
    difficulty: 2
    type: numeric
    prompt: |
      A {{m1}} kg cart moving at {{v1}} m/s runs into a {{m2}} kg cart at rest. They couple together. How fast do they move just after the collision? Give a value with units.
    params:
      m1: { real: [0.5, 5], step: 0.5 }
      v1: { real: [0.5, 6], step: 0.5 }
      m2: { real: [0.5, 5], step: 0.5 }
    answer: "m1 * v1 / (m1 + m2)"
    units: "m/s"
    tolerance: { rel: 0.01 }
    hints:
      - 'Momentum is conserved during the collision.'
      - '$m_1v_1 = (m_1 + m_2)v_f$.'
    solution: |
      $m_1v_1 = (m_1 + m_2)v_f$, so $v_f = \dfrac{ {{m1}} \times {{v1}} }{ {{m1 + m2}} } \approx {{m1*v1/(m1 + m2)}}\,\text{m/s}$.
    verify: "solve(Eq(m1*v1, (m1 + m2)*Symbol('u')), Symbol('u'))[0]"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 2

  - id: phys-mom-005
    difficulty: 2
    type: numeric
    prompt: |
      A {{m1}} kg skater stands at rest on frictionless ice and throws a {{m2}} kg ball horizontally at {{v}} m/s. How fast does the skater recoil? Give a value with units.
    params:
      m1: { int: [40, 100] }
      m2: { real: [0.5, 6], step: 0.5 }
      v: { int: [3, 20] }
    answer: "m2 * v / m1"
    units: "m/s"
    tolerance: { rel: 0.01 }
    hints:
      - 'Before the throw the total momentum is zero.'
      - '$0 = m_2 v - m_1 V$.'
    solution: |
      Total momentum stays zero: $m_2 v = m_1 V$, so $V = \dfrac{ {{m2}} \times {{v}} }{ {{m1}} } \approx {{m2*v/m1}}\,\text{m/s}$, opposite to the ball.
    verify: "abs(solve(Eq(0, m2*v + m1*Symbol('u')), Symbol('u'))[0])"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 2

  - id: phys-mom-006
    difficulty: 2
    type: numeric
    prompt: |
      A {{m}} g ball hits a wall head-on at {{vin}} m/s and rebounds straight back at {{vout}} m/s. It is in contact with the wall for {{dt}} ms. What is the magnitude of the average force of the wall on the ball? Give a value with units.
    params:
      m: { int: [50, 500] }
      vin: { int: [5, 30] }
      vout: { int: [2, 25] }
      dt: { int: [2, 30] }
    require: ["vout < vin"]
    let:
      dp: "(m / 1000) * (vin + vout)"
    answer: "dp / (dt / 1000)"
    units: "N"
    tolerance: { rel: 0.01 }
    hints:
      - 'The velocity reverses, so the change in velocity is $v_\text{out} - (-v_\text{in})$.'
      - 'Average force $=$ change in momentum $/$ contact time.'
    solution: |
      Take the rebound direction as positive. $\Delta p = m v_\text{out} - m(-v_\text{in}) = {{m/1000}}\,({{vout}} + {{vin}}) \approx {{dp}}\,\text{kg·m/s}$.
      $\bar F = \dfrac{\Delta p}{\Delta t} \approx \dfrac{ {{dp}} }{ {{dt/1000}} } \approx {{dp/(dt/1000)}}\,\text{N}$.
      Forgetting the sign change would give only $m(v_\text{in} - v_\text{out})$, far too small.
    verify: "abs((Matrix([-Rational(m, 1000)*vout]) - Matrix([Rational(m, 1000)*vin]))[0])/Rational(dt, 1000)"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 3

  - id: phys-mom-007
    difficulty: 3
    type: numeric
    prompt: |
      A {{m1}} kg glider moving at {{v1}} m/s collides **elastically** and head-on with a {{m2}} kg glider at rest on an air track. What is the velocity of the first glider just after the collision? Give a signed value with units (positive is its original direction).
    params:
      m1: { int: [1, 8] }
      m2: { int: [1, 8] }
      v1: { int: [1, 8] }
    require: ["m1 != m2"]
    answer: "(m1 - m2) / (m1 + m2) * v1"
    units: "m/s"
    tolerance: { rel: 0.01 }
    hints:
      - 'Elastic: both momentum and kinetic energy are conserved.'
      - 'For a 1D elastic collision the relative velocity reverses: $v_2'' - v_1'' = v_1$.'
      - 'Combine with $m_1v_1 = m_1v_1'' + m_2v_2''$.'
    solution: |
      Momentum: $m_1v_1 = m_1v_1' + m_2v_2'$. Elastic in 1D: $v_2' - v_1' = v_1 - 0$. Substituting $v_2' = v_1 + v_1'$:
      $$m_1v_1 = m_1v_1' + m_2(v_1 + v_1') \;\Rightarrow\; v_1' = \frac{m_1 - m_2}{m_1 + m_2}\,v_1 = \frac{ {{m1 - m2}} }{ {{m1 + m2}} } \times {{v1}} \approx {{(m1 - m2)/(m1 + m2)*v1}}\,\text{m/s}.$$
      A lighter glider bounces back (negative); a heavier one carries on, slower.
    verify: "[s for s in solve([Eq(m1*v1, m1*Symbol('a') + m2*Symbol('b')), Eq(m1*v1**2, m1*Symbol('a')**2 + m2*Symbol('b')**2)], [Symbol('a'), Symbol('b')]) if s[0] != v1][0][0]"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 5

  - id: phys-mom-008
    difficulty: 3
    type: multipart
    prompt: |
      Ballistic pendulum: a {{m}} g bullet travelling at {{v}} m/s embeds itself in a {{M}} kg wooden block hanging at rest on long strings. Take $g = 9.8\,\text{m/s}^2$.
    params:
      m: { int: [5, 30] }
      v: { int: [200, 600] }
      M: { real: [1, 6], step: 0.5 }
    let:
      g: 9.8
      mk: "m / 1000"
      V: "mk * v / (mk + M)"
    parts:
      - prompt: "(a) How fast do block and bullet move just after the impact? Give a value with units."
        type: numeric
        answer: V
        units: "m/s"
        tolerance: { rel: 0.01 }
        verify: "solve(Eq(Rational(m, 1000)*v, (Rational(m, 1000) + M)*Symbol('u')), Symbol('u'))[0]"
      - prompt: "(b) Using your answer to (a), how high does the block swing above its lowest position?"
        type: numeric
        answer: "part1^2 / (2 * g)"
        units: "m"
        tolerance: { rel: 0.01 }
        verify: "(lambda V: solve(Eq((Rational(m, 1000) + M)*9.8*Symbol('H'), (Rational(m, 1000) + M)*V**2/2), Symbol('H'))[0])(Rational(m, 1000)*v/(Rational(m, 1000) + M))"
    hints:
      - 'The impact is brief and perfectly inelastic: conserve momentum, not energy.'
      - 'After the impact the swing conserves mechanical energy: $\tfrac12 V^2 = gh$.'
    solution: |
      (a) Momentum: $mv = (m + M)V$, so $V = \dfrac{ {{mk}} \times {{v}} }{ {{mk + M}} } \approx {{V}}\,\text{m/s}$.

      (b) Energy during the swing: $\tfrac12(m + M)V^2 = (m + M)gh$, so $h = \dfrac{V^2}{2g} \approx \dfrac{ {{V}}^2 }{19.6} \approx {{V^2/(2*g)}}\,\text{m}$.
      Energy is *not* conserved in step (a): most of the bullet's kinetic energy becomes heat in the wood.
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 5

  - id: phys-mom-009
    difficulty: 3
    type: numeric
    prompt: |
      A {{m1}} kg cart moving right at {{v1}} m/s collides head-on with a {{m2}} kg cart moving left at {{v2}} m/s. They stick together. How much kinetic energy is lost in the collision? Give a value with units.
    params:
      m1: { real: [0.5, 5], step: 0.5 }
      v1: { real: [0.5, 5], step: 0.5 }
      m2: { real: [0.5, 5], step: 0.5 }
      v2: { real: [0.5, 5], step: 0.5 }
    let:
      vf: "(m1 * v1 - m2 * v2) / (m1 + m2)"
      Ki: "m1 * v1^2 / 2 + m2 * v2^2 / 2"
      Kf: "(m1 + m2) * vf^2 / 2"
    answer: "Ki - Kf"
    units: "J"
    tolerance: { rel: 0.01 }
    hints:
      - 'Find the common final velocity from momentum conservation (right positive).'
      - 'Then compare total kinetic energy before and after.'
    solution: |
      Right positive: $v_f = \dfrac{m_1v_1 - m_2v_2}{m_1 + m_2} = \dfrac{ {{m1*v1}} - {{m2*v2}} }{ {{m1 + m2}} } \approx {{vf}}\,\text{m/s}$.
      $K_i = \tfrac12({{m1}})({{v1}})^2 + \tfrac12({{m2}})({{v2}})^2 \approx {{Ki}}\,\text{J}$ and $K_f = \tfrac12({{m1 + m2}})v_f^2 \approx {{Kf}}\,\text{J}$.
      Lost: $K_i - K_f \approx {{Ki - Kf}}\,\text{J}$. (In general the loss is $\tfrac12\,\dfrac{m_1m_2}{m_1 + m_2}\,v_\text{rel}^2$.)
    verify: "Rational(1, 2)*m1*m2/(m1 + m2)*(v1 + v2)**2"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 5

  - id: phys-mom-010
    difficulty: 3
    type: vector
    prompt: |
      At an icy junction, a {{m1}} kg car heading east at {{v1}} m/s collides with a {{m2}} kg van heading north at {{v2}} m/s. They lock together. With $x$ east and $y$ north, find their velocity just after the collision, in m/s, as components `vx, vy`.
    params:
      m1: { int: [800, 1600] }
      v1: { int: [5, 25] }
      m2: { int: [1500, 3000] }
      v2: { int: [5, 25] }
    answer: "[m1 * v1, m2 * v2] / (m1 + m2)"
    tolerance: { rel: 0.01 }
    hints:
      - 'Momentum is conserved separately in $x$ and in $y$.'
      - '$x$: $m_1v_1 = (m_1 + m_2)v_x$. $y$: $m_2v_2 = (m_1 + m_2)v_y$.'
    solution: |
      Total mass {{m1 + m2}} kg. In $x$: $v_x = \dfrac{ {{m1}} \times {{v1}} }{ {{m1 + m2}} } \approx {{m1*v1/(m1 + m2)}}\,\text{m/s}$. In $y$: $v_y = \dfrac{ {{m2}} \times {{v2}} }{ {{m1 + m2}} } \approx {{m2*v2/(m1 + m2)}}\,\text{m/s}$.
      So $\vec v \approx {{row: [m1*v1, m2*v2] / (m1 + m2)}}\,\text{m/s}$, at {{atan2(m2*v2, m1*v1)*180/pi}}° north of east.
    verify: "list(np.linalg.solve((m1 + m2)*np.eye(2), [m1*v1, m2*v2]))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 4

  - id: phys-mom-011
    difficulty: 4
    type: numeric
    prompt: |
      A puck sliding at {{v}} m/s on frictionless ice strikes an identical puck at rest. The collision is elastic, and afterwards the first puck moves off at {{th}}° to its original direction. How fast is the first puck moving after the collision? Give a value with units.
    params:
      v: { real: [1, 8], step: 0.5 }
      th: { int: [15, 75] }
    answer: "v * cos(th * pi / 180)"
    units: "m/s"
    tolerance: { rel: 0.01 }
    hints:
      - 'Equal masses: momentum gives $\vec v = \vec v_1 + \vec v_2$, and energy gives $v^2 = v_1^2 + v_2^2$.'
      - 'Squaring the momentum equation and comparing shows $\vec v_1 \cdot \vec v_2 = 0$: the pucks leave at right angles.'
      - 'So $\vec v$, $\vec v_1$, $\vec v_2$ form a right triangle with hypotenuse $\vec v$.'
    solution: |
      With equal masses, momentum gives $\vec v = \vec v_1 + \vec v_2$ and kinetic energy gives $v^2 = v_1^2 + v_2^2$. Squaring the first, $v^2 = v_1^2 + v_2^2 + 2\vec v_1\cdot\vec v_2$, so $\vec v_1\cdot\vec v_2 = 0$: the pucks separate at $90^\circ$.
      The velocities form a right triangle with hypotenuse $\vec v$ and $\vec v_1$ at {{th}}° to it, so $v_1 = v\cos\theta = {{v}}\cos{{th}}^\circ \approx {{v*cos(th*pi/180)}}\,\text{m/s}$ (and $v_2 = v\sin\theta \approx {{v*sin(th*pi/180)}}\,\text{m/s}$).
    verify: "max(s[0] for s in solve([Eq(v, Symbol('a')*math.cos(math.radians(th)) + Symbol('b')), Eq(0, Symbol('a')*math.sin(math.radians(th)) + Symbol('c')), Eq(v**2, Symbol('a')**2 + Symbol('b')**2 + Symbol('c')**2)], [Symbol('a'), Symbol('b'), Symbol('c')]))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 6

  - id: phys-mom-012
    difficulty: 3
    type: numeric
    prompt: |
      A {{m}} kg cart starts at rest on a frictionless track. A horizontal force $F(t) = {{F0}}\sin(\pi t/{{tau}})$ N acts on it from $t = 0$ to $t = {{tau}}\,\text{s}$, then stops. What is the cart's final speed? Give a value with units.
    params:
      m: { real: [1, 10], step: 0.5 }
      F0: { int: [5, 50] }
      tau: { real: [0.1, 1], step: 0.1 }
    let:
      J: "2 * F0 * tau / pi"
    answer: "J / m"
    units: "m/s"
    tolerance: { rel: 0.01 }
    hints:
      - 'Impulse–momentum theorem: $\int F\,dt = \Delta p$.'
      - '$\int_0^\tau \sin(\pi t/\tau)\,dt = 2\tau/\pi$.'
    solution: |
      $$J = \int_0^{\tau} F_0\sin\frac{\pi t}{\tau}\,dt = \frac{2F_0\tau}{\pi} = \frac{2 \times {{F0}} \times {{tau}}}{\pi} \approx {{J}}\,\text{N·s}.$$
      Starting from rest, $mv = J$, so $v = J/m \approx {{J}}/{{m}} \approx {{J/m}}\,\text{m/s}$.
    verify: "integrate(F0*sin(pi*t/tau), (t, 0, tau))/m"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 4

  - id: phys-mom-013
    difficulty: 4
    type: proof
    prompt: |
      In a one-dimensional elastic collision between masses $m_1$ and $m_2$ with velocities $v_1, v_2$ before and $v_1', v_2'$ after, show that the relative velocity reverses: $v_1 - v_2 = -(v_1' - v_2')$.
    hints:
      - 'Write momentum and kinetic-energy conservation with all the $m_1$ terms on one side and the $m_2$ terms on the other.'
      - 'Factor the energy equation as a difference of squares.'
      - 'Divide one equation by the other (when the velocities change at all).'
    solution: |
      Momentum: $m_1(v_1 - v_1') = m_2(v_2' - v_2)$. Energy: $m_1(v_1^2 - v_1'^2) = m_2(v_2'^2 - v_2^2)$, i.e.
      $$m_1(v_1 - v_1')(v_1 + v_1') = m_2(v_2' - v_2)(v_2' + v_2).$$
      If a collision actually happens, $v_1 \ne v_1'$, so we may divide this by the momentum equation: $v_1 + v_1' = v_2' + v_2$.
      Rearranging, $v_1 - v_2 = v_2' - v_1' = -(v_1' - v_2')$: the objects separate as fast as they approached.
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 6

  - id: phys-mom-014
    difficulty: 4
    type: numeric
    prompt: |
      A rocket in deep space (no gravity, no air) ejects exhaust at {{u}} m/s relative to itself. It fires its engine until its mass has fallen to {{fr}} of its initial mass. By how much does its speed increase? Give a value with units.
    params:
      u: { int: [1500, 4500] }
      fr: { real: [0.1, 0.6], step: 0.05 }
    answer: "u * log(1 / fr)"
    units: "m/s"
    tolerance: { rel: 0.01 }
    hints:
      - 'In a short time the rocket ejects mass $|dm|$ at speed $u$ backwards relative to itself.'
      - 'Momentum conservation in the rocket''s frame gives $M\,dv = -u\,dM$.'
      - 'Integrate $dv = -u\,dM/M$ from $M_0$ to $M_f$.'
    solution: |
      In time $dt$ the rocket (mass $M$) ejects mass $-dM > 0$ backwards at $u$ relative to itself. Momentum conservation gives $M\,dv = -u\,dM$, so
      $$\Delta v = -u\int_{M_0}^{M_f}\frac{dM}{M} = u\ln\frac{M_0}{M_f} = {{u}} \times \ln\frac{1}{ {{fr}} } \approx {{u*log(1/fr)}}\,\text{m/s}.$$
      This is the Tsiolkovsky rocket equation: the speed gain grows only logarithmically with the mass ratio.
    verify: "integrate(u/Symbol('M'), (Symbol('M'), fr, 1))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 6

  - id: phys-mom-015
    difficulty: 5
    type: numeric
    prompt: |
      A {{M}} kg block rests on a frictionless table, attached to a wall by a horizontal spring ($k = {{k}}\,\text{N/m}$) at its natural length. A {{m}} g bullet travelling at {{vin}} m/s along the spring's axis, towards the wall, passes straight through the block and leaves at {{vout}} m/s. Assume the bullet passes through before the block has moved appreciably. What is the maximum compression of the spring? Give a value with units.
    params:
      M: { real: [0.5, 5], step: 0.5 }
      k: { int: [100, 2000] }
      m: { int: [5, 30] }
      vin: { int: [300, 600] }
      vout: { int: [100, 250] }
    let:
      V: "(m / 1000) * (vin - vout) / M"
    answer: "V * sqrt(M / k)"
    units: "m"
    tolerance: { rel: 0.01 }
    hints:
      - 'Two stages: a brief collision (momentum conserved, energy not), then the block compresses the spring (mechanical energy conserved).'
      - 'Collision: $mv_\text{in} = mv_\text{out} + MV$.'
      - 'Spring: $\tfrac12 MV^2 = \tfrac12 kx^2$.'
    solution: |
      Collision (momentum): $V = \dfrac{m(v_\text{in} - v_\text{out})}{M} = \dfrac{ {{m/1000}} \times {{vin - vout}} }{ {{M}} } \approx {{V}}\,\text{m/s}$.
      Compression (energy): $\tfrac12 MV^2 = \tfrac12 kx^2$, so $x = V\sqrt{M/k} \approx {{V}}\sqrt{ {{M}}/{{k}} } \approx {{V*sqrt(M/k)}}\,\text{m}$.
      Using energy conservation through the collision itself would be wrong: the bullet loses far more kinetic energy than the block gains.
    verify: "(lambda V: max(solve(Eq(M*V**2/2, k*Symbol('s')**2/2), Symbol('s'))))(solve(Eq(Rational(m, 1000)*vin, Rational(m, 1000)*vout + M*Symbol('V')), Symbol('V'))[0])"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 8

  - id: phys-mom-016
    difficulty: 3
    type: estimate
    prompt: |
      You jump off a 1 m high wall and land on hard ground with stiff legs, stopping in about 1 cm. Estimate the average force of the ground on you during the landing. Give a value with units.
    answer: "70 * sqrt(2 * 9.8 * 1) / (2 * 0.01 / sqrt(2 * 9.8 * 1)) + 70 * 9.8"
    units: "N"
    factor: 3
    hints:
      - 'Find your landing speed from the fall, and the stopping time from the stopping distance (average speed is half the landing speed).'
      - 'Impulse: $(\bar F - mg)\,\Delta t = mv$.'
    solution: |
      Landing speed $v = \sqrt{2gh} \approx 4.4\,\text{m/s}$. Stopping in $d \approx 0.01\,\text{m}$ at average speed $v/2$ takes $\Delta t = 2d/v \approx 4.5\,\text{ms}$.
      With $m \approx 70\,\text{kg}$: $\bar F = \dfrac{mv}{\Delta t} + mg \approx \dfrac{70 \times 4.4}{0.0045} + 690 \approx 7\times10^4\,\text{N}$, about 100 times your weight.
      Bending your knees stretches the stop over ~0.5 m and cuts the force fifty-fold.
    verify: "solve(Eq((Symbol('F') - 70*9.8)*(2*0.01/math.sqrt(2*9.8)), 70*math.sqrt(2*9.8)), Symbol('F'))[0]"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 4
