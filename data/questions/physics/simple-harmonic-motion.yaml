subject: physics
topic: simple-harmonic-motion
questions:
  - id: phys-shm-001
    difficulty: 1
    type: numeric
    prompt: |
      A {{m}} kg block on a frictionless table is attached to a spring of stiffness {{k}} N/m. What is the period of its
      oscillations? Give your answer with units.
    params:
      m: { real: [0.1, 5], step: 0.1 }
      k: { int: [10, 500] }
    answer: "2 * pi * sqrt(m / k)"
    units: "s"
    tolerance: { rel: 0.01 }
    hints:
      - "$m\\ddot{x} = -kx$ is simple harmonic with $\\omega = \\sqrt{k/m}$."
      - "$T = 2\\pi/\\omega$."
    solution: |
      $$T = 2\pi\sqrt{\frac{m}{k}} = 2\pi\sqrt{\frac{ {{m}} }{ {{k}} }} \approx {{round(2*pi*sqrt(m/k), 4)}}\ \text{s}.$$
    verify: "2*pi/abs(im(solve(m*x**2 + k, x)[0]))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 2

  - id: phys-shm-002
    difficulty: 1
    type: numeric
    prompt: |
      What is the period of small oscillations of a simple pendulum {{L}} m long? Take $g = 9.8\ \text{m/s}^2$ and give
      your answer with units.
    params:
      L: { real: [0.2, 3], step: 0.1 }
    answer: "2 * pi * sqrt(L / 9.8)"
    units: "s"
    tolerance: { rel: 0.01 }
    hints:
      - "For small angles $\\sin\\theta \\approx \\theta$, and the pendulum obeys $\\ddot\\theta = -(g/L)\\theta$."
    solution: |
      $$T = 2\pi\sqrt{\frac{L}{g}} = 2\pi\sqrt{\frac{ {{L}} }{9.8}} \approx {{round(2*pi*sqrt(L/9.8), 4)}}\ \text{s}.$$
      The mass of the bob does not matter.
    verify: "2*pi/abs(im(solve(L*x**2 + 9.8, x)[0]))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 1

  - id: phys-shm-003
    difficulty: 1
    type: mc
    prompt: "The mass on a spring is replaced by one four times as heavy. What happens to the period of oscillation?"
    options:
      - "It doubles"
      - "It quadruples"
      - "It halves"
      - "It is unchanged"
    answer: 0
    hints:
      - "$T = 2\\pi\\sqrt{m/k}$."
    solution: "$T \\propto \\sqrt{m}$, so multiplying $m$ by 4 multiplies $T$ by $\\sqrt4 = 2$: a heavier mass oscillates more slowly."
    verify: "[2, 4, Rational(1, 2), 1].index(simplify(sqrt(4*Symbol('m', positive=True)/Symbol('k', positive=True))/sqrt(Symbol('m', positive=True)/Symbol('k', positive=True))))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 1

  - id: phys-shm-004
    difficulty: 2
    type: numeric
    prompt: |
      A {{m}} kg mass on a spring of stiffness {{k}} N/m oscillates with amplitude {{A}} m. What is its maximum speed?
      Give your answer with units.
    params:
      m: { real: [0.2, 3], step: 0.1 }
      k: { int: [20, 400] }
      A: { real: [0.02, 0.3], step: 0.01 }
    answer: "A * sqrt(k / m)"
    units: "m/s"
    tolerance: { rel: 0.01 }
    hints:
      - "$x(t) = A\\cos\\omega t$, so $v(t) = -A\\omega\\sin\\omega t$."
      - "Or: all the energy $\\tfrac12 kA^2$ is kinetic at the centre."
    solution: |
      $\omega = \sqrt{k/m} \approx {{round(sqrt(k/m), 4)}}$ rad/s, and the speed peaks at the centre:
      $$v_{\max} = A\omega = {{A}} \times {{round(sqrt(k/m), 4)}} \approx {{round(A*sqrt(k/m), 4)}}\ \text{m/s}.$$
    verify: "abs(diff(A*cos(sqrt(k/m)*t), t).subs(t, pi/2/sqrt(k/m)))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 2

  - id: phys-shm-005
    difficulty: 2
    type: numeric
    prompt: |
      A {{m}} kg block on a spring of stiffness {{k}} N/m oscillates on a frictionless surface with amplitude {{A}} m.
      How fast is it moving when it is {{x0}} m from equilibrium? Give your answer with units.
    params:
      m: { real: [0.2, 3], step: 0.1 }
      k: { int: [20, 400] }
      A: { real: [0.05, 0.3], step: 0.01 }
      x0: { real: [0, 0.25], step: 0.01 }
    require: ["x0 < A"]
    answer: "sqrt(k / m) * sqrt(A^2 - x0^2)"
    units: "m/s"
    tolerance: { rel: 0.01 }
    hints:
      - "Mechanical energy is conserved: $\\tfrac12 mv^2 + \\tfrac12 kx^2 = \\tfrac12 kA^2$."
    solution: |
      $$v = \sqrt{\frac{k}{m}(A^2 - x^2)} = \sqrt{\frac{ {{k}} }{ {{m}} }({{A}}^2 - {{x0}}^2)} \approx {{round(sqrt(k/m)*sqrt(A^2 - x0^2), 4)}}\ \text{m/s}.$$
    verify: "max(solve(Rational(1, 2)*m*Symbol('v')**2 + Rational(1, 2)*k*x0**2 - Rational(1, 2)*k*A**2, Symbol('v')))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 3

  - id: phys-shm-006
    difficulty: 2
    type: numeric
    prompt: |
      Two springs, of stiffness {{k1}} N/m and {{k2}} N/m, are joined end to end (in series) and a {{m}} kg mass hangs
      from the bottom. What is the period of vertical oscillations? Give your answer with units.
    params:
      k1: { int: [50, 400] }
      k2: { int: [50, 400] }
      m: { real: [0.2, 3], step: 0.1 }
    answer: "2 * pi * sqrt(m * (1 / k1 + 1 / k2))"
    units: "s"
    tolerance: { rel: 0.01 }
    hints:
      - "In series, both springs carry the same force and their stretches add."
      - "$\\dfrac{1}{k_{\\text{eff}}} = \\dfrac{1}{k_1} + \\dfrac{1}{k_2}$. Gravity only shifts the equilibrium; it does not change the period."
    solution: |
      A force $F$ stretches the springs by $F/k_1$ and $F/k_2$, so $1/k_{\text{eff}} = 1/k_1 + 1/k_2$ and
      $k_{\text{eff}} \approx {{round(1/(1/k1 + 1/k2), 3)}}$ N/m. Then
      $$T = 2\pi\sqrt{\frac{m}{k_{\text{eff}}}} \approx {{round(2*pi*sqrt(m*(1/k1 + 1/k2)), 4)}}\ \text{s}.$$
    verify: "(lambda s: 2*pi*sqrt(m*(s[Symbol('x1')] + s[Symbol('x2')])))(solve([k1*Symbol('x1') - 1, k2*Symbol('x2') - 1], [Symbol('x1'), Symbol('x2')]))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 3

  - id: phys-shm-007
    difficulty: 2
    type: estimate
    prompt: |
      When four adults get into a car, its body sinks about 3 cm on its springs. Estimate the frequency at which the
      loaded car bounces up and down (ignore the shock absorbers). Give a value with units.
    answer: "sqrt((300 * 9.8 / 0.03) / 1500) / (2 * pi)"
    units: "Hz"
    factor: 2
    hints:
      - "Four adults weigh about 300 kg; a car about 1200 kg."
      - "The stiffness of the suspension is $k = \\Delta F/\\Delta x$."
    solution: |
      $k \approx \dfrac{300 \times 9.8\ \text{N}}{0.03\ \text{m}} \approx 1 \times 10^5\ \text{N/m}$, and the loaded car has
      $m \approx 1500$ kg, so
      $$f = \frac{1}{2\pi}\sqrt{\frac{k}{m}} \approx \frac{1}{2\pi}\sqrt{\frac{10^5}{1500}} \approx 1.3\ \text{Hz}.$$
      Car suspensions are indeed tuned to about 1–1.5 Hz, close to the pace of walking.
    verify: "1/(2*pi/abs(im(solve(1500*x**2 + 300*9.8/0.03, x)[0])))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 4

  - id: phys-shm-008
    difficulty: 3
    type: numeric
    prompt: |
      A uniform rod {{L}} m long swings in a vertical plane about a horizontal axis through one end. What is the period
      of small oscillations? Take $g = 9.8\ \text{m/s}^2$ and give your answer with units.
    params:
      L: { real: [0.3, 2], step: 0.1 }
    answer: "2 * pi * sqrt(2 * L / (3 * 9.8))"
    units: "s"
    tolerance: { rel: 0.01 }
    hints:
      - "A physical pendulum: $I\\ddot\\theta = -Mgd\\sin\\theta$, with $d$ the pivot-to-centre-of-mass distance."
      - "Here $I = \\tfrac13 ML^2$ and $d = L/2$, so $T = 2\\pi\\sqrt{I/(Mgd)}$."
    solution: |
      For small angles $\ddot\theta = -\dfrac{Mgd}{I}\theta$ with $I = \tfrac13 ML^2$, $d = \tfrac{L}{2}$:
      $$T = 2\pi\sqrt{\frac{\tfrac13 ML^2}{Mg\tfrac{L}{2}}} = 2\pi\sqrt{\frac{2L}{3g}} \approx {{round(2*pi*sqrt(2*L/(3*9.8)), 4)}}\ \text{s},$$
      the same as a simple pendulum of length $\tfrac23 L$.
    verify: "2*pi*sqrt(integrate(x**2/L, (x, 0, L)) / (9.8*integrate(x/L, (x, 0, L))))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 3

  - id: phys-shm-009
    difficulty: 3
    type: numeric
    prompt: |
      A {{m}} kg mass on a spring of stiffness {{k}} N/m is at $x = {{x0}}$ m with velocity {{v0}} m/s at $t = 0$.
      What is the amplitude of the resulting oscillation? Give your answer with units.
    params:
      m: { real: [0.2, 2], step: 0.1 }
      k: { int: [20, 200] }
      x0: { real: [-0.1, 0.1], step: 0.01 }
      v0: { real: [-1, 1], step: 0.1 }
    require: ["abs(x0) > 0.005", "abs(v0) > 0.05"]
    answer: "sqrt(x0^2 + (v0 / sqrt(k / m))^2)"
    units: "m"
    tolerance: { rel: 0.01 }
    hints:
      - "Write $x(t) = A\\cos(\\omega t + \\phi)$ and match $x(0)$ and $\\dot x(0)$; or use energy."
      - "At the turning points all the energy is in the spring: $\\tfrac12 kA^2 = \\tfrac12 kx_0^2 + \\tfrac12 mv_0^2$."
    solution: |
      $$\tfrac12 kA^2 = \tfrac12 kx_0^2 + \tfrac12 mv_0^2 \Rightarrow A = \sqrt{x_0^2 + \frac{v_0^2}{\omega^2}},\qquad \omega = \sqrt{k/m} \approx {{round(sqrt(k/m), 4)}}\ \text{rad/s}.$$
      $A = \sqrt{({{x0}})^2 + ({{v0}}/{{round(sqrt(k/m), 4)}})^2} \approx {{round(sqrt(x0^2 + (v0/sqrt(k/m))^2), 4)}}$ m.
    verify: "max(solve(Rational(1, 2)*k*Symbol('A')**2 - Rational(1, 2)*k*x0**2 - Rational(1, 2)*m*v0**2, Symbol('A')))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 4

  - id: phys-shm-010
    difficulty: 3
    type: multipart
    prompt: |
      A {{m}} kg glider on an air track is attached to a spring of stiffness {{k}} N/m. It is pulled {{A}} m from
      equilibrium and released from rest at $t = 0$.
    params:
      m: { real: [0.2, 2], step: 0.1 }
      k: { int: [10, 200] }
      A: { real: [0.05, 0.3], step: 0.01 }
    parts:
      - prompt: "(a) What is the angular frequency? Give it with units."
        type: numeric
        answer: "sqrt(k / m)"
        units: "rad/s"
        tolerance: { rel: 0.01 }
        verify: "abs(im(solve(m*x**2 + k, x)[0]))"
      - prompt: "(b) Using your answer to (a), what is the glider's maximum acceleration? Give it with units."
        type: numeric
        answer: "part1^2 * A"
        units: "m/s^2"
        tolerance: { rel: 0.01 }
        verify: "k*A/m"
      - prompt: "(c) Using your answer to (a), how long after release does the glider first reach $x = A/2$? Give it with units."
        type: numeric
        answer: "acos(0.5) / part1"
        units: "s"
        tolerance: { rel: 0.01 }
        verify: "min(solve(cos(sqrt(k/m)*t) - Rational(1, 2), t))"
    hints:
      - "$\\omega = \\sqrt{k/m}$ and $x(t) = A\\cos\\omega t$."
      - "The acceleration $-\\omega^2 x$ is largest at the ends."
      - "Solve $\\cos\\omega t = \\tfrac12$ for the smallest positive $t$."
    solution: |
      (a) $\omega = \sqrt{ {{k}}/{{m}} } \approx {{round(sqrt(k/m), 4)}}$ rad/s.

      (b) $a = -\omega^2 x$, largest at $x = \pm A$: $a_{\max} = \omega^2 A = kA/m \approx {{round(k*A/m, 4)}}\ \text{m/s}^2$.

      (c) $\cos\omega t = \tfrac12$ first at $\omega t = \pi/3$, so $t = \dfrac{\pi}{3\omega} \approx {{round(pi/(3*sqrt(k/m)), 4)}}$ s:
      one sixth of a period, although it covers half the distance to the centre.
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 6

  - id: phys-shm-011
    difficulty: 4
    type: numeric
    prompt: |
      A uniform disc of radius {{R}} m hangs in a vertical plane from a horizontal axle through a point a distance $d$
      from its centre, and swings as a physical pendulum. For which $d$ is the period of small oscillations shortest,
      and what is that shortest period? Enter the period. Take $g = 9.8\ \text{m/s}^2$ and give your answer with units.
    params:
      R: { real: [0.05, 0.5], step: 0.05 }
    answer: "2 * pi * sqrt(sqrt(2) * R / 9.8)"
    units: "s"
    tolerance: { rel: 0.01 }
    hints:
      - "Parallel-axis theorem: $I = \\tfrac12 MR^2 + Md^2$."
      - "$T(d) = 2\\pi\\sqrt{\\dfrac{R^2/2 + d^2}{gd}}$. Minimise $T^2$ over $d$."
    solution: |
      $$T^2 = \frac{4\pi^2}{g}\left(\frac{R^2}{2d} + d\right),\qquad \frac{d(T^2)}{dd} = \frac{4\pi^2}{g}\left(-\frac{R^2}{2d^2} + 1\right) = 0 \Rightarrow d = \frac{R}{\sqrt2}.$$
      Then $\dfrac{R^2}{2d} + d = \sqrt2 R$, so
      $$T_{\min} = 2\pi\sqrt{\frac{\sqrt2 R}{g}} \approx {{round(2*pi*sqrt(sqrt(2)*R/9.8), 4)}}\ \text{s}.$$
      Pivoting at the centre ($d \to 0$) or far out both make the period longer.
    verify: "(lambda dd: (lambda T: T.subs(dd, [s for s in solve(diff(T**2, dd), dd) if s > 0][0]))(2*pi*sqrt((R**2/2 + dd**2)/(9.8*dd))))(Symbol('dd', positive=True))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 7

  - id: phys-shm-012
    difficulty: 4
    type: numeric
    prompt: |
      Imagine a straight frictionless tunnel through the centre of a uniform, non-rotating planet of density
      {{rho}} g/cm³. A ball dropped into it falls through to the far side. How long does the trip take? Take
      $G = 6.674 \times 10^{-11}\ \text{N m}^2/\text{kg}^2$ and give your answer with units.
    params:
      rho: { real: [2, 8], step: 0.1 }
    answer: "pi / sqrt(4 / 3 * pi * 6.674e-11 * rho * 1000) / 60"
    units: "min"
    tolerance: { rel: 0.01 }
    hints:
      - "Inside a uniform sphere only the mass within radius $r$ pulls: $M(r) = \\rho\\,\\tfrac43\\pi r^3$."
      - "The force is then $F = -\\tfrac43\\pi G\\rho m\\,r$: Hooke's law."
      - "The trip to the far side is half a period."
    solution: |
      With $\rho = {{rho*1000}}$ kg/m³, the force at distance $r$ from the centre is
      $F = -\dfrac{GM(r)m}{r^2} = -\tfrac43\pi G\rho m\,r$, so the ball oscillates with $\omega^2 = \tfrac43\pi G\rho$, independent of the planet's size.
      The crossing takes half a period:
      $$t = \frac{\pi}{\omega} = \frac{\pi}{\sqrt{\tfrac43\pi G\rho}} \approx {{round(pi/sqrt(4/3*pi*6.674e-11*rho*1000), 0)}}\ \text{s} \approx {{round(pi/sqrt(4/3*pi*6.674e-11*rho*1000)/60, 2)}}\ \text{min}.$$
      (For the Earth's mean density, 5.5 g/cm³, about 42 minutes.)
    verify: "pi/sqrt(diff(6.674e-11*rho*1000*Rational(4, 3)*pi*x**3/x**2, x)) / 60"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 7

  - id: phys-shm-013
    difficulty: 4
    type: proof
    prompt: |
      For a mass $m$ on a spring of stiffness $k$ moving as $x(t) = A\cos(\omega t + \phi)$, show that this solves
      $m\ddot x = -kx$ exactly when $\omega = \sqrt{k/m}$, and that the kinetic and potential energies, averaged over
      one period, are equal: each is half the total energy $\tfrac12 kA^2$.
    hints:
      - "Differentiate twice and substitute."
      - "Write $K$ and $U$ in terms of $\\sin^2$ and $\\cos^2$ of $\\omega t + \\phi$; each averages to $\\tfrac12$ over a period."
    solution: |
      $\ddot x = -A\omega^2\cos(\omega t + \phi) = -\omega^2 x$, so $m\ddot x = -kx$ for all $t$ (and $A \ne 0$) iff
      $m\omega^2 = k$, i.e. $\omega = \sqrt{k/m}$.

      Then $U = \tfrac12 kx^2 = \tfrac12 kA^2\cos^2(\omega t + \phi)$ and
      $K = \tfrac12 m\dot x^2 = \tfrac12 mA^2\omega^2\sin^2(\omega t + \phi) = \tfrac12 kA^2\sin^2(\omega t + \phi)$, so
      $K + U = \tfrac12 kA^2$. Over a period $T = 2\pi/\omega$,
      $\frac1T\int_0^T\cos^2(\omega t + \phi)\,dt = \frac1T\int_0^T\sin^2(\omega t + \phi)\,dt = \tfrac12$
      (they are equal by a quarter-period shift and sum to 1). Hence $\langle K\rangle = \langle U\rangle = \tfrac14 kA^2$. $\blacksquare$
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 6
