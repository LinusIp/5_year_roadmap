subject: physics
topic: friction-and-inclines
questions:
  - id: phys-fric-001
    difficulty: 1
    type: numeric
    prompt: |
      A {{m}} kg crate slides across a level floor. The coefficient of kinetic friction is $\mu_k = {{mu}}$. How large is the friction force on the crate? Take $g = 9.8\,\text{m/s}^2$ and give a value with units.
    params:
      m: { int: [5, 60] }
      mu: { real: [0.1, 0.8], step: 0.05 }
    let:
      g: 9.8
    answer: "mu * m * g"
    units: "N"
    tolerance: { rel: 0.01 }
    hints:
      - 'Kinetic friction is $f_k = \mu_k N$.'
      - 'On a level floor with no other vertical forces, $N = mg$.'
    solution: |
      $N = mg = {{m}} \times 9.8 = {{m*g}}\,\text{N}$, so $f_k = \mu_k N = {{mu}} \times {{m*g}} \approx {{mu*m*g}}\,\text{N}$, directed against the sliding.
    verify: "(lambda n: mu*n)(solve(Eq(Symbol('n') - m*9.8, 0), Symbol('n'))[0])"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 1

  - id: phys-fric-002
    difficulty: 1
    type: mc
    prompt: |
      A block sits at rest on a rough ramp. In which direction does the static friction force on the block point?
    options:
      - 'Up the slope'
      - 'Down the slope'
      - 'Perpendicular to the slope, away from it'
      - 'Nowhere: there is no friction because the block is not moving'
    answer: 0
    hints:
      - 'Without friction, which way would the block slide?'
      - 'Static friction opposes the motion that *would* happen without it.'
    solution: |
      The component of gravity along the slope, $mg\sin\theta$, points down the slope. The block stays at rest, so the net force along the slope is zero: static friction must supply $mg\sin\theta$ **up** the slope. It is not zero just because nothing moves; it is exactly as large as needed to prevent motion (up to $\mu_s N$).
    verify: "(lambda f: 0 if f > 0 else (1 if f < 0 else 3))(solve(Eq(Symbol('f') - 2*9.8*math.sin(math.radians(20)), 0), Symbol('f'))[0])"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 1

  - id: phys-fric-003
    difficulty: 2
    type: numeric
    prompt: |
      A block slides down a frictionless ramp inclined at {{th}}° to the horizontal. With $g = 9.8\,\text{m/s}^2$, what is the magnitude of its acceleration? Give a value with units.
    params:
      th: { int: [5, 60] }
    let:
      g: 9.8
    answer: "g * sin(th * pi / 180)"
    units: "m/s^2"
    tolerance: { rel: 0.01 }
    hints:
      - 'Choose axes along and perpendicular to the slope.'
      - 'Only the component of gravity along the slope, $mg\sin\theta$, accelerates the block.'
    solution: |
      Along the slope the only force is $mg\sin\theta$ (the normal force is perpendicular to the slope), so
      $a = g\sin\theta = 9.8 \times \sin{{th}}^\circ \approx {{g*sin(th*pi/180)}}\,\text{m/s}^2$, independent of the mass.
    verify: "(lambda c, s: np.linalg.solve([[s, -c], [c, s]], [0, 9.8])[1])(math.cos(math.radians(th)), math.sin(math.radians(th)))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 2

  - id: phys-fric-004
    difficulty: 2
    type: numeric
    prompt: |
      A coin lies on a book. You slowly tilt the book. The coefficient of static friction between coin and cover is $\mu_s = {{mu}}$. At what tilt angle does the coin start to slide? Enter a number of degrees.
    params:
      mu: { real: [0.2, 1.2], step: 0.05 }
    answer: "atan(mu) * 180 / pi"
    tolerance: { abs: 0.3 }
    hints:
      - 'Just before sliding, static friction is at its maximum, $\mu_s N$.'
      - 'Along the slope: $mg\sin\theta = \mu_s mg\cos\theta$.'
    solution: |
      At the point of slipping, $mg\sin\theta = \mu_s N = \mu_s mg\cos\theta$, so $\tan\theta = \mu_s$ and
      $\theta = \arctan {{mu}} \approx {{atan(mu)*180/pi}}^\circ$. Mass and $g$ cancel; that is why tilting is a simple way to measure $\mu_s$.
    verify: "float(nsolve(sin(x) - mu*cos(x), x, (1e-6, math.pi/2 - 1e-6), solver='bisect'))*180/math.pi"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 2

  - id: phys-fric-005
    difficulty: 3
    type: numeric
    prompt: |
      You push a {{m}} kg box across a level floor at constant velocity by pushing on it with a force directed {{th}}° **below** the horizontal. The coefficient of kinetic friction is {{mu}}. With $g = 9.8\,\text{m/s}^2$, how hard must you push? Give a value with units.
    params:
      m: { int: [10, 50] }
      th: { int: [10, 45] }
      mu: { real: [0.1, 0.6], step: 0.05 }
    let:
      g: 9.8
      c: "cos(th * pi / 180)"
      s: "sin(th * pi / 180)"
    require: ["c - mu * s > 0.3"]
    answer: "mu * m * g / (c - mu * s)"
    units: "N"
    tolerance: { rel: 0.01 }
    hints:
      - 'Pushing downward at an angle increases the normal force.'
      - 'Vertical: $N = mg + F\sin\theta$. Horizontal (constant velocity): $F\cos\theta = \mu_k N$.'
      - 'Substitute $N$ and solve for $F$.'
    solution: |
      Vertical balance: $N = mg + F\sin\theta$. Horizontal balance: $F\cos\theta = \mu_k N = \mu_k(mg + F\sin\theta)$. So
      $$F = \frac{\mu_k mg}{\cos\theta - \mu_k\sin\theta} = \frac{ {{mu}} \times {{m*g}} }{ {{c}} - {{mu*s}} } \approx {{mu*m*g/(c - mu*s)}}\,\text{N}.$$
      This is more than the {{mu*m*g}} N needed for a horizontal push: part of your effort presses the box into the floor.
    verify: "(lambda c, s: np.linalg.solve([[c, -mu], [-s, 1]], [0, m*9.8])[0])(math.cos(math.radians(th)), math.sin(math.radians(th)))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 5

  - id: phys-fric-006
    difficulty: 3
    type: numeric
    prompt: |
      A {{m}} kg block slides down a ramp inclined at {{th}}°. The coefficient of kinetic friction is {{mu}}. With $g = 9.8\,\text{m/s}^2$, what is its acceleration down the ramp? Give a value with units.
    params:
      m: { int: [2, 20] }
      th: { int: [20, 60] }
      mu: { real: [0.1, 0.5], step: 0.05 }
    let:
      g: 9.8
      rad: "th * pi / 180"
    require: ["tan(rad) > mu + 0.05"]
    answer: "g * (sin(rad) - mu * cos(rad))"
    units: "m/s^2"
    tolerance: { rel: 0.01 }
    hints:
      - 'Perpendicular to the slope: $N = mg\cos\theta$.'
      - 'Along the slope (down positive): $mg\sin\theta - \mu_k N = ma$.'
    solution: |
      $N = mg\cos\theta$, so friction is $\mu_k mg\cos\theta$ up the slope. Along the slope,
      $$ma = mg\sin\theta - \mu_k mg\cos\theta \;\Rightarrow\; a = g(\sin\theta - \mu_k\cos\theta) = 9.8({{sin(rad)}} - {{mu*cos(rad)}}) \approx {{g*(sin(rad) - mu*cos(rad))}}\,\text{m/s}^2.$$
      The mass cancels.
    verify: "np.linalg.solve([[1, 0], [mu, m]], [m*9.8*math.cos(math.radians(th)), m*9.8*math.sin(math.radians(th))])[1]"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 4

  - id: phys-fric-007
    difficulty: 3
    type: multipart
    prompt: |
      A block is shoved **up** a ramp inclined at {{th}}° with an initial speed of {{v0}} m/s. The coefficient of kinetic friction is {{mu}}. Take $g = 9.8\,\text{m/s}^2$.
    params:
      th: { int: [10, 45] }
      v0: { real: [2, 10], step: 0.5 }
      mu: { real: [0.1, 0.5], step: 0.05 }
    let:
      g: 9.8
      rad: "th * pi / 180"
    parts:
      - prompt: "(a) While it slides up, what is the magnitude of its deceleration? Give a value with units."
        type: numeric
        answer: "g * (sin(rad) + mu * cos(rad))"
        units: "m/s^2"
        tolerance: { rel: 0.01 }
        verify: "np.linalg.solve([[1, 0], [-mu, 1]], [9.8*math.cos(math.radians(th)), 9.8*math.sin(math.radians(th))])[1]"
      - prompt: "(b) Using your answer to (a), how far along the ramp does it slide before stopping?"
        type: numeric
        answer: "v0^2 / (2 * part1)"
        units: "m"
        tolerance: { rel: 0.01 }
        verify: "(lambda dec: integrate(v0 - dec*t, (t, 0, v0/dec)))(9.8*(math.sin(math.radians(th)) + mu*math.cos(math.radians(th))))"
    hints:
      - 'Moving up, both gravity''s component and friction point down the slope.'
      - 'Deceleration: $g(\sin\theta + \mu_k\cos\theta)$.'
      - 'Then use $0 = v_0^2 - 2ad$.'
    solution: |
      (a) Sliding up, friction acts down the slope along with $mg\sin\theta$:
      $a = g(\sin\theta + \mu_k\cos\theta) = 9.8({{sin(rad)}} + {{mu*cos(rad)}}) \approx {{g*(sin(rad) + mu*cos(rad))}}\,\text{m/s}^2$.

      (b) $d = \dfrac{v_0^2}{2a} = \dfrac{ {{v0}}^2 }{2 \times {{g*(sin(rad) + mu*cos(rad))}} } \approx {{v0^2/(2*g*(sin(rad) + mu*cos(rad)))}}\,\text{m}$.
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 5

  - id: phys-fric-008
    difficulty: 4
    type: numeric
    prompt: |
      A {{m1}} kg book rests on top of a {{m2}} kg box, which sits on a frictionless floor. The coefficient of static friction between book and box is {{mu}}. You pull the **box** horizontally. With $g = 9.8\,\text{m/s}^2$, what is the largest force you can apply without the book slipping on the box? Give a value with units.
    params:
      m1: { real: [0.5, 5], step: 0.5 }
      m2: { int: [2, 20] }
      mu: { real: [0.2, 0.8], step: 0.05 }
    let:
      g: 9.8
    answer: "mu * (m1 + m2) * g"
    units: "N"
    tolerance: { rel: 0.01 }
    hints:
      - 'The only horizontal force on the book is static friction from the box.'
      - 'So the book''s acceleration can be at most $\mu_s g$.'
      - 'If they move together, the whole system has that acceleration too.'
    solution: |
      The book is accelerated only by static friction, at most $\mu_s m_1 g$, so its acceleration is at most $a_{\max} = \mu_s g = {{mu*g}}\,\text{m/s}^2$.
      Without slipping, book and box share that acceleration, and the whole system needs
      $$F_{\max} = (m_1 + m_2)a_{\max} = \mu_s(m_1 + m_2)g \approx {{mu*(m1 + m2)*g}}\,\text{N}.$$
    verify: "np.linalg.solve([[m1, 0], [m1 + m2, -1]], [mu*m1*9.8, 0])[1]"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 5

  - id: phys-fric-009
    difficulty: 2
    type: numeric
    prompt: |
      A car moving at {{v0}} km/h locks its wheels and skids to a stop. The coefficient of kinetic friction between tyres and road is {{mu}}. With $g = 9.8\,\text{m/s}^2$, how long is the skid? Give a value with units.
    params:
      v0: { int: [30, 120] }
      mu: { real: [0.3, 0.9], step: 0.05 }
    let:
      g: 9.8
      v: "v0 / 3.6"
    answer: "v^2 / (2 * mu * g)"
    units: "m"
    tolerance: { rel: 0.01 }
    hints:
      - 'Friction $\mu_k mg$ is the only horizontal force, so the deceleration is $\mu_k g$.'
      - 'Then $0 = v_0^2 - 2(\mu_k g)d$.'
    solution: |
      $v_0 = {{v0}}/3.6 \approx {{v}}\,\text{m/s}$ and the deceleration is $\mu_k g = {{mu*g}}\,\text{m/s}^2$. So
      $d = \dfrac{v_0^2}{2\mu_k g} \approx \dfrac{ {{v}}^2 }{2 \times {{mu*g}} } \approx {{v^2/(2*mu*g)}}\,\text{m}$. Doubling the speed quadruples the skid.
    verify: "(lambda dec: integrate(v0/3.6 - dec*t, (t, 0, v0/3.6/dec)))(mu*9.8)"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 3

  - id: phys-fric-010
    difficulty: 4
    type: numeric
    prompt: |
      A {{m1}} kg block on a ramp inclined at {{th}}° is tied to a string that runs up the slope, over a light pulley at the top, to a hanging {{m2}} kg mass. The hanging mass descends, pulling the block up the ramp. The coefficient of kinetic friction between block and ramp is {{mu}}. With $g = 9.8\,\text{m/s}^2$, what is the acceleration? Give a value with units.
    params:
      m1: { int: [1, 10] }
      m2: { int: [2, 15] }
      th: { int: [10, 45] }
      mu: { real: [0.1, 0.5], step: 0.05 }
    let:
      g: 9.8
      rad: "th * pi / 180"
      drive: "m2 * g - m1 * g * (sin(rad) + mu * cos(rad))"
    require: ["drive / (m1 + m2) > 0.3"]
    answer: "drive / (m1 + m2)"
    units: "m/s^2"
    tolerance: { rel: 0.01 }
    hints:
      - 'Draw separate free-body diagrams. The block moves up the slope, so friction on it points down the slope.'
      - 'Block: $T - m_1 g\sin\theta - \mu_k m_1 g\cos\theta = m_1 a$. Hanging mass: $m_2 g - T = m_2 a$.'
      - 'Add them to eliminate $T$.'
    solution: |
      Block (up the slope positive): $T - m_1 g\sin\theta - \mu_k m_1 g\cos\theta = m_1 a$. Hanging mass (down positive): $m_2 g - T = m_2 a$. Adding:
      $$a = \frac{m_2 g - m_1 g(\sin\theta + \mu_k\cos\theta)}{m_1 + m_2} = \frac{ {{m2*g}} - {{m1*g*(sin(rad) + mu*cos(rad))}} }{ {{m1 + m2}} } \approx {{drive/(m1 + m2)}}\,\text{m/s}^2.$$
    verify: "np.linalg.solve([[m1, -1], [m2, 1]], [-m1*9.8*(math.sin(math.radians(th)) + mu*math.cos(math.radians(th))), m2*9.8])[0]"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 6

  - id: phys-fric-011
    difficulty: 4
    type: mc
    prompt: |
      A block of mass $m$ rests on a ramp at angle $\theta$, below the angle at which it would start to slip. The coefficient of static friction is $\mu_s$. What is the magnitude of the friction force on it?
    options:
      - '$mg\sin\theta$'
      - '$\mu_s mg\cos\theta$'
      - '$\mu_s mg$'
      - '$mg\cos\theta$'
    answer: 0
    hints:
      - '$\mu_s N$ is the *maximum* static friction, reached only at the point of slipping.'
      - 'The block is in equilibrium: balance the forces along the slope.'
    solution: |
      Along the slope the block is in equilibrium, so friction exactly balances the downhill component of gravity: $f_s = mg\sin\theta$.
      Static friction obeys $f_s \le \mu_s N = \mu_s mg\cos\theta$, with equality only at the slipping angle. Below that angle, $mg\sin\theta < \mu_s mg\cos\theta$, so the answer $\mu_s mg\cos\theta$ would be too large.
    verify: "(lambda m, th, mu: (lambda f: [abs(f - v) < 1e-9 for v in [m*9.8*math.sin(th), mu*m*9.8*math.cos(th), mu*m*9.8, m*9.8*math.cos(th)]].index(True))(float(solve(Eq(Symbol('f') - m*9.8*math.sin(th), 0), Symbol('f'))[0])))(3, math.radians(20), 0.6)"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 2

  - id: phys-fric-012
    difficulty: 4
    type: proof
    prompt: |
      Show that a block given a push down a rough ramp slides at constant speed exactly when $\tan\theta = \mu_k$, whatever its mass. What happens if $\tan\theta < \mu_k$, and if $\tan\theta > \mu_k$?
    hints:
      - 'Write the force balance perpendicular to the slope to find $N$.'
      - 'Along the slope the net force is $mg\sin\theta - \mu_k mg\cos\theta$.'
    solution: |
      Perpendicular to the slope there is no acceleration, so $N = mg\cos\theta$, and kinetic friction is $\mu_k mg\cos\theta$ up the slope. Along the slope (down positive),
      $$ma = mg\sin\theta - \mu_k mg\cos\theta = mg\cos\theta\,(\tan\theta - \mu_k).$$
      Constant speed means $a = 0$; since $mg\cos\theta > 0$ for $0 < \theta < 90^\circ$, this holds exactly when $\tan\theta = \mu_k$. The mass cancels.

      If $\tan\theta < \mu_k$, $a < 0$: the block slows down and stops (and then static friction can hold it). If $\tan\theta > \mu_k$, $a > 0$: it speeds up.
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 5

  - id: phys-fric-013
    difficulty: 5
    type: numeric
    prompt: |
      You drag a {{m}} kg sled across level snow at constant speed with a rope. The coefficient of kinetic friction is {{mu}}. You may choose the angle of the rope above the horizontal. With $g = 9.8\,\text{m/s}^2$, what is the **smallest** rope tension that keeps the sled moving at constant speed? Give a value with units.
    params:
      m: { int: [10, 80] }
      mu: { real: [0.1, 0.8], step: 0.05 }
    let:
      g: 9.8
    answer: "mu * m * g / sqrt(1 + mu^2)"
    units: "N"
    tolerance: { rel: 0.01 }
    hints:
      - 'With the rope at angle $\theta$: $N = mg - T\sin\theta$ and $T\cos\theta = \mu_k N$.'
      - 'So $T(\theta) = \dfrac{\mu_k mg}{\cos\theta + \mu_k\sin\theta}$. Maximise the denominator.'
      - 'The denominator is largest at $\tan\theta = \mu_k$, where it equals $\sqrt{1 + \mu_k^2}$.'
    solution: |
      Vertical: $N = mg - T\sin\theta$. Horizontal: $T\cos\theta = \mu_k N$. Hence $T(\theta) = \dfrac{\mu_k mg}{\cos\theta + \mu_k\sin\theta}$.
      The denominator $D(\theta) = \cos\theta + \mu_k\sin\theta$ has $D'(\theta) = -\sin\theta + \mu_k\cos\theta = 0$ at $\tan\theta = \mu_k$, i.e. $\theta \approx {{atan(mu)*180/pi}}^\circ$, where $D = \sqrt{1 + \mu_k^2}$. So
      $$T_{\min} = \frac{\mu_k mg}{\sqrt{1 + \mu_k^2}} = \frac{ {{mu}} \times {{m*g}} }{\sqrt{1 + {{mu}}^2}} \approx {{mu*m*g/sqrt(1 + mu^2)}}\,\text{N},$$
      a little less than the {{mu*m*g}} N needed with a horizontal rope.
    verify: "(lambda Fx: float(Fx.subs(x, nsolve(diff(Fx, x), x, (0.0, 1.2), solver='bisect'))))(mu*m*9.8/(cos(x) + mu*sin(x)))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 8

  - id: phys-fric-014
    difficulty: 2
    type: estimate
    prompt: |
      Estimate the horizontal force needed to slide a full refrigerator across a kitchen floor at steady speed. Give a value with units.
    answer: "0.4 * 80 * 9.8"
    units: "N"
    factor: 3
    hints:
      - 'Guess the mass of a full fridge (tens of kilograms) and a coefficient of kinetic friction for metal or plastic feet on tile or vinyl.'
      - 'At steady speed, the push equals the kinetic friction $\mu_k mg$.'
    solution: |
      Take $m \approx 80\,\text{kg}$ and $\mu_k \approx 0.4$: $F = \mu_k mg \approx 0.4 \times 80 \times 9.8 \approx 300\,\text{N}$, the weight of a 30 kg sack. Getting it started takes more, because $\mu_s > \mu_k$.
    verify: "solve(Eq(Symbol('P') - 0.4*Symbol('n'), 0).subs(Symbol('n'), 80*9.8), Symbol('P'))[0]"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 2
