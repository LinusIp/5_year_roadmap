subject: physics
topic: gravitation-and-orbits
questions:
  - id: phys-grav-001
    difficulty: 1
    type: numeric
    prompt: |
      Two lead spheres of {{m1}} kg and {{m2}} kg have their centres {{r}} m apart. What is the magnitude of the
      gravitational force between them? Take $G = 6.674 \times 10^{-11}\ \text{N m}^2/\text{kg}^2$ and give your answer
      with units.
    params:
      m1: { int: [100, 2000] }
      m2: { int: [100, 2000] }
      r: { real: [0.5, 5], step: 0.5 }
    answer: "6.674e-11 * m1 * m2 / r^2"
    units: "N"
    tolerance: { rel: 0.01 }
    hints:
      - "Newton's law of gravitation: $F = \\dfrac{Gm_1m_2}{r^2}$."
      - "Expect a tiny number: micronewtons."
    solution: |
      $$F = \frac{Gm_1m_2}{r^2} = \frac{6.674 \times 10^{-11} \times {{m1}} \times {{m2}}}{ {{r}}^2} \approx {{round(6.674e-11*m1*m2/r^2*1e6, 4)}} \times 10^{-6}\ \text{N}.$$
    verify: "diff(-6.674e-11*m1*m2/x, x).subs(x, r)"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 2

  - id: phys-grav-002
    difficulty: 1
    type: mc
    prompt: |
      The distance between two asteroids triples. By what factor does the gravitational force between them change?
    options:
      - "It becomes $\\tfrac19$ as large"
      - "It becomes $\\tfrac13$ as large"
      - "It triples"
      - "It becomes 9 times as large"
    answer: 0
    hints:
      - "Gravity is an inverse-square force."
    solution: "$F \\propto 1/r^2$, so tripling $r$ multiplies the force by $1/3^2 = 1/9$."
    verify: "[Rational(1, 9), Rational(1, 3), 3, 9].index((1/x**2).subs(x, 3) / (1/x**2).subs(x, 1))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 1

  - id: phys-grav-003
    difficulty: 2
    type: numeric
    prompt: |
      A planet has mass ${{Mm}} \times 10^{24}$ kg and radius ${{Rm}} \times 10^{6}$ m. What is the gravitational
      acceleration at its surface? Take $G = 6.674 \times 10^{-11}\ \text{N m}^2/\text{kg}^2$ and give your answer with units.
    params:
      Mm: { real: [0.5, 10], step: 0.1 }
      Rm: { real: [2, 10], step: 0.1 }
    answer: "6.674e-11 * Mm * 1e24 / (Rm * 1e6)^2"
    units: "m/s^2"
    tolerance: { rel: 0.01 }
    hints:
      - "Set the weight $mg$ equal to the gravitational force $GMm/R^2$."
    solution: |
      $$g = \frac{GM}{R^2} = \frac{6.674 \times 10^{-11} \times {{Mm}} \times 10^{24}}{({{Rm}} \times 10^{6})^2} \approx {{round(6.674e-11*Mm*1e24/(Rm*1e6)^2, 3)}}\ \text{m/s}^2.$$
    verify: "diff(-6.674e-11*Mm*1e24/x, x).subs(x, Rm*1e6)"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 2

  - id: phys-grav-004
    difficulty: 2
    type: numeric
    prompt: |
      A satellite is in a circular orbit {{h}} km above the Earth's surface. How fast does it move? Take
      $G = 6.674 \times 10^{-11}\ \text{N m}^2/\text{kg}^2$, $M_E = 5.97 \times 10^{24}$ kg and
      $R_E = 6.37 \times 10^{6}$ m, and give your answer with units.
    params:
      h: { int: [200, 2000] }
    let:
      rr: "6.37e6 + h * 1000"
    answer: "sqrt(6.674e-11 * 5.97e24 / rr) / 1000"
    units: "km/s"
    tolerance: { rel: 0.01 }
    hints:
      - "Gravity provides the centripetal force: $\\dfrac{GMm}{r^2} = \\dfrac{mv^2}{r}$."
      - "$r$ is measured from the Earth's centre: $r = R_E + h$."
    solution: |
      $r = R_E + h \approx {{round(rr/1000, 0)}}$ km. From $GMm/r^2 = mv^2/r$,
      $$v = \sqrt{\frac{GM}{r}} = \sqrt{\frac{6.674 \times 10^{-11} \times 5.97 \times 10^{24}}{ {{round(rr, 0)}} }} \approx {{round(sqrt(6.674e-11*5.97e24/rr)/1000, 3)}}\ \text{km/s}.$$
    verify: "max(solve(Symbol('v')**2/(6.37e6 + h*1000) - 6.674e-11*5.97e24/(6.37e6 + h*1000)**2, Symbol('v'))) / 1000"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 3

  - id: phys-grav-005
    difficulty: 2
    type: numeric
    prompt: |
      What is the escape speed from the surface of an airless planet of mass ${{Mm}} \times 10^{24}$ kg and radius
      ${{Rm}} \times 10^{6}$ m? Take $G = 6.674 \times 10^{-11}\ \text{N m}^2/\text{kg}^2$ and give your answer with units.
    params:
      Mm: { real: [0.5, 10], step: 0.1 }
      Rm: { real: [2, 10], step: 0.1 }
    answer: "sqrt(2 * 6.674e-11 * Mm * 1e24 / (Rm * 1e6)) / 1000"
    units: "km/s"
    tolerance: { rel: 0.01 }
    hints:
      - "A projectile just escapes if its total energy is zero: it arrives at infinity with no speed left."
      - "$\\tfrac12 mv^2 - \\dfrac{GMm}{R} = 0$."
    solution: |
      $$\tfrac12 v_{\text{esc}}^2 = \frac{GM}{R} \Rightarrow v_{\text{esc}} = \sqrt{\frac{2GM}{R}} = \sqrt{\frac{2 \times 6.674 \times 10^{-11} \times {{Mm}} \times 10^{24}}{ {{Rm}} \times 10^{6}}} \approx {{round(sqrt(2*6.674e-11*Mm*1e24/(Rm*1e6))/1000, 3)}}\ \text{km/s}.$$
    verify: "max(solve(Rational(1, 2)*Symbol('v')**2 + integrate(6.674e-11*Mm*1e24/x**2, (x, Rm*1e6, oo))*(-1), Symbol('v'))) / 1000"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 3

  - id: phys-grav-006
    difficulty: 3
    type: numeric
    prompt: |
      What is the period of a satellite in a circular orbit {{h}} km above the Earth's surface? Take
      $G = 6.674 \times 10^{-11}\ \text{N m}^2/\text{kg}^2$, $M_E = 5.97 \times 10^{24}$ kg and
      $R_E = 6.37 \times 10^{6}$ m, and give your answer with units.
    params:
      h: { int: [200, 5000] }
    let:
      rr: "6.37e6 + h * 1000"
    answer: "2 * pi * sqrt(rr^3 / (6.674e-11 * 5.97e24)) / 60"
    units: "min"
    tolerance: { rel: 0.01 }
    hints:
      - "Find the orbital speed from $GM/r^2 = v^2/r$, then $T = 2\\pi r / v$."
      - "Or use Kepler's third law in the form $T^2 = 4\\pi^2 r^3/(GM)$."
    solution: |
      With $r = R_E + h \approx {{round(rr/1000, 0)}}$ km,
      $$T = 2\pi\sqrt{\frac{r^3}{GM}} \approx {{round(2*pi*sqrt(rr^3/(6.674e-11*5.97e24)), 0)}}\ \text{s} \approx {{round(2*pi*sqrt(rr^3/(6.674e-11*5.97e24))/60, 1)}}\ \text{min}.$$
    verify: "2*pi*(6.37e6 + h*1000) / sqrt(6.674e-11*5.97e24/(6.37e6 + h*1000)) / 60"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 3

  - id: phys-grav-007
    difficulty: 3
    type: numeric
    prompt: |
      A planet of mass ${{Mm}} \times 10^{24}$ kg spins once every {{P}} hours. At what distance from its centre would a
      satellite in a circular equatorial orbit stay above the same point of the surface (a synchronous orbit)?
      Take $G = 6.674 \times 10^{-11}\ \text{N m}^2/\text{kg}^2$ and give your answer with units.
    params:
      Mm: { real: [0.5, 10], step: 0.5 }
      P: { real: [10, 40], step: 0.5 }
    answer: "(6.674e-11 * Mm * 1e24 * (P * 3600)^2 / (4 * pi^2))^(1/3) / 1000"
    units: "km"
    tolerance: { rel: 0.01 }
    hints:
      - "The orbital period must equal the planet's rotation period."
      - "$\\dfrac{GM}{r^2} = \\omega^2 r$ with $\\omega = 2\\pi/P$."
    solution: |
      Set the orbital angular velocity equal to the spin, $\omega = 2\pi/P$ with $P = {{P*3600}}$ s:
      $$\frac{GM}{r^2} = \omega^2 r \Rightarrow r = \left(\frac{GMP^2}{4\pi^2}\right)^{1/3} \approx {{round((6.674e-11*Mm*1e24*(P*3600)^2/(4*pi^2))^(1/3)/1000, 0)}}\ \text{km}.$$
      (For the Earth, $M = 5.97 \times 10^{24}$ kg and $P = 23.93$ h give the geostationary radius, about 42 200 km.)
    verify: "solve(6.674e-11*Mm*1e24/Symbol('rr', positive=True)**2 - (2*pi/(P*3600))**2*Symbol('rr', positive=True), Symbol('rr', positive=True))[0] / 1000"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 4

  - id: phys-grav-008
    difficulty: 3
    type: multipart
    prompt: |
      A comet orbits the Sun on an ellipse with perihelion distance {{rp}} AU and aphelion distance {{ra}} AU.
      Take $G = 6.674 \times 10^{-11}\ \text{N m}^2/\text{kg}^2$, $M_\odot = 1.989 \times 10^{30}$ kg,
      $1\ \text{AU} = 1.496 \times 10^{11}$ m and $1\ \text{year} = 3.15576 \times 10^7$ s.
    params:
      rp: { real: [0.3, 1.5], step: 0.1 }
      ra: { int: [2, 40] }
    let:
      a: "(rp + ra) / 2 * 1.496e11"
    parts:
      - prompt: "(a) What is its orbital period? Give it with units."
        type: numeric
        answer: "2 * pi * sqrt(a^3 / (6.674e-11 * 1.989e30)) / 3.15576e7"
        units: "year"
        tolerance: { rel: 0.01 }
        verify: "(lambda vp: pi*((rp + ra)/2*1.496e11)*sqrt(rp*ra)*1.496e11 / (rp*1.496e11*vp/2) / 3.15576e7)(max(solve(Rational(1, 2)*Symbol('vp')**2 - 6.674e-11*1.989e30/(rp*1.496e11) - Rational(1, 2)*(rp*Symbol('vp')/ra)**2 + 6.674e-11*1.989e30/(ra*1.496e11), Symbol('vp'))))"
      - prompt: "(b) How fast does it move at perihelion? Give it with units."
        type: numeric
        answer: "sqrt(6.674e-11 * 1.989e30 * (2 / (rp * 1.496e11) - 1 / a)) / 1000"
        units: "km/s"
        tolerance: { rel: 0.01 }
        verify: "max(solve(Rational(1, 2)*Symbol('vp')**2 - 6.674e-11*1.989e30/(rp*1.496e11) - Rational(1, 2)*(rp*Symbol('vp')/ra)**2 + 6.674e-11*1.989e30/(ra*1.496e11), Symbol('vp'))) / 1000"
      - prompt: "(c) Using your answer to (b), how fast does it move at aphelion? Give it with units."
        type: numeric
        answer: "part2 * rp / ra"
        units: "km/s"
        tolerance: { rel: 0.01 }
        verify: "sqrt(2*(Rational(1, 2)*(part2*1000)**2 - 6.674e-11*1.989e30/(rp*1.496e11) + 6.674e-11*1.989e30/(ra*1.496e11))) / 1000"
    hints:
      - "Kepler's third law holds for ellipses with $r$ replaced by the semi-major axis $a = (r_p + r_a)/2$."
      - "The vis-viva equation, $v^2 = GM\\left(\\dfrac{2}{r} - \\dfrac{1}{a}\\right)$, gives the speed anywhere on the orbit."
      - "At perihelion and aphelion $\\mathbf{v} \\perp \\mathbf{r}$, so angular momentum gives $r_p v_p = r_a v_a$."
    solution: |
      (a) $a = \tfrac12({{rp}} + {{ra}})$ AU $\approx {{round(a/1.496e11, 3)}}$ AU. Kepler's third law:
      $$T = 2\pi\sqrt{\frac{a^3}{GM_\odot}} \approx {{round(2*pi*sqrt(a^3/(6.674e-11*1.989e30))/3.15576e7, 3)}}\ \text{years}$$
      (equivalently $T/\text{year} \approx (a/\text{AU})^{3/2}$).

      (b) Vis-viva at $r = r_p$:
      $v_p = \sqrt{GM_\odot(2/r_p - 1/a)} \approx {{round(sqrt(6.674e-11*1.989e30*(2/(rp*1.496e11) - 1/a))/1000, 3)}}\ \text{km/s}$.

      (c) Angular momentum: $v_a = v_p\,r_p/r_a \approx {{round(sqrt(6.674e-11*1.989e30*(2/(rp*1.496e11) - 1/a))/1000*rp/ra, 3)}}\ \text{km/s}$.
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 8

  - id: phys-grav-009
    difficulty: 3
    type: numeric
    prompt: |
      How much energy must be supplied to move a {{m}} kg satellite from a circular orbit {{h1}} km above the Earth's
      surface to a circular orbit {{h2}} km up? Take $G = 6.674 \times 10^{-11}\ \text{N m}^2/\text{kg}^2$,
      $M_E = 5.97 \times 10^{24}$ kg and $R_E = 6.37 \times 10^{6}$ m, and give your answer with units.
    params:
      m: { int: [100, 2000] }
      h1: { int: [200, 1000] }
      h2: { int: [2000, 36000] }
    let:
      r1: "6.37e6 + h1 * 1000"
      r2: "6.37e6 + h2 * 1000"
      dE: "6.674e-11 * 5.97e24 * m / 2 * (1 / r1 - 1 / r2)"
    answer: "dE"
    units: "J"
    tolerance: { rel: 0.01 }
    hints:
      - "For a circular orbit the kinetic energy is $\\tfrac12 mv^2 = \\dfrac{GMm}{2r}$."
      - "So the total energy is $E = K + U = -\\dfrac{GMm}{2r}$."
    solution: |
      With $E(r) = -\dfrac{GMm}{2r}$, $r_1 \approx {{round(r1/1000, 0)}}$ km and $r_2 \approx {{round(r2/1000, 0)}}$ km:
      $$\Delta E = \frac{GMm}{2}\left(\frac{1}{r_1} - \frac{1}{r_2}\right) \approx {{round(dE/1e9, 3)}} \times 10^{9}\ \text{J}.$$
      The satellite ends up *slower*: its kinetic energy falls, but its potential energy rises twice as much.
    verify: "(lambda E: E(6.37e6 + h2*1000) - E(6.37e6 + h1*1000))(lambda r_: Rational(1, 2)*m*max(solve(Symbol('v')**2/r_ - 6.674e-11*5.97e24/r_**2, Symbol('v')))**2 - 6.674e-11*5.97e24*m/r_)"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 5

  - id: phys-grav-010
    difficulty: 3
    type: estimate
    prompt: |
      Using only the Earth's orbit (its distance from the Sun and the length of the year) and
      $G = 6.674 \times 10^{-11}\ \text{N m}^2/\text{kg}^2$, estimate the mass of the Sun. Give a value with units.
    answer: "4 * pi^2 * (1.5e11)^3 / (6.674e-11 * (3.156e7)^2)"
    units: "kg"
    factor: 2
    hints:
      - "The Earth is about $1.5 \\times 10^{11}$ m from the Sun; a year is about $3.2 \\times 10^7$ s."
      - "Treat the orbit as a circle: $\\dfrac{GM}{r^2} = \\omega^2 r$."
    solution: |
      $$M_\odot = \frac{\omega^2 r^3}{G} = \frac{4\pi^2 r^3}{GT^2} \approx \frac{4\pi^2 (1.5 \times 10^{11})^3}{6.674 \times 10^{-11} \times (3.16 \times 10^7)^2} \approx 2 \times 10^{30}\ \text{kg}.$$
    verify: "solve(6.674e-11*Symbol('Ms')/(1.5e11)**2 - (2*pi/3.156e7)**2*1.5e11, Symbol('Ms'))[0]"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 3

  - id: phys-grav-011
    difficulty: 4
    type: numeric
    prompt: |
      Two stars of {{m1}} and {{m2}} solar masses orbit their common centre of mass in circles, a constant {{d}} AU
      apart. What is their orbital period? Take $G = 6.674 \times 10^{-11}\ \text{N m}^2/\text{kg}^2$,
      $M_\odot = 1.989 \times 10^{30}$ kg, $1\ \text{AU} = 1.496 \times 10^{11}$ m and $1\ \text{year} = 3.15576 \times 10^7$ s,
      and give your answer with units.
    params:
      m1: { real: [0.5, 3], step: 0.1 }
      m2: { real: [0.5, 3], step: 0.1 }
      d: { real: [0.5, 10], step: 0.5 }
    answer: "2 * pi * sqrt((d * 1.496e11)^3 / (6.674e-11 * (m1 + m2) * 1.989e30)) / 3.15576e7"
    units: "year"
    tolerance: { rel: 0.01 }
    hints:
      - "Each star circles the centre of mass; star 1 at radius $r_1 = d\\,\\dfrac{m_2}{m_1 + m_2}$."
      - "For star 1: $\\dfrac{Gm_1m_2}{d^2} = m_1\\omega^2 r_1$. Both stars share the same $\\omega$."
    solution: |
      Star 1 moves on a circle of radius $r_1 = d\,m_2/(m_1 + m_2)$, pulled by $Gm_1m_2/d^2$ (the separation is $d$,
      not $r_1$):
      $$\frac{Gm_1m_2}{d^2} = m_1\omega^2\frac{d\,m_2}{m_1 + m_2} \Rightarrow \omega^2 = \frac{G(m_1 + m_2)}{d^3},\qquad T = 2\pi\sqrt{\frac{d^3}{G(m_1 + m_2)}}.$$
      In solar masses, AU and years this is $T = \sqrt{d^3/(m_1 + m_2)} \approx {{round(2*pi*sqrt((d*1.496e11)^3/(6.674e-11*(m1 + m2)*1.989e30))/3.15576e7, 3)}}$ years.
    verify: "2*pi / sqrt(6.674e-11*m2*1.989e30 / ((d*1.496e11)**2 * (d*1.496e11*m2/(m1 + m2)))) / 3.15576e7"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 6

  - id: phys-grav-012
    difficulty: 4
    type: proof
    prompt: |
      Using the shell theorem, show that inside a uniform solid planet of mass $M$ and radius $R$ the gravitational
      field at distance $r < R$ from the centre has magnitude $g(r) = \dfrac{GMr}{R^3}$, growing linearly with $r$.
    hints:
      - "Shell theorem: a uniform spherical shell exerts no net force on a mass inside it, and attracts a mass outside as if all its mass were at its centre."
      - "Only the mass within radius $r$ pulls on you. How much is that for uniform density?"
    solution: |
      Split the planet into the solid ball of radius $r$ and the shells outside it. By the shell theorem the outer
      shells exert no net force, and the inner ball acts as a point mass at the centre. For uniform density the mass
      inside radius $r$ is
      $$M(r) = M\frac{\tfrac43\pi r^3}{\tfrac43\pi R^3} = M\frac{r^3}{R^3},\qquad\text{so}\qquad g(r) = \frac{GM(r)}{r^2} = \frac{GMr}{R^3}.$$
      At $r = R$ this matches the surface value $GM/R^2$, and outside it falls as $1/r^2$. $\blacksquare$
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 5

  - id: phys-grav-013
    difficulty: 5
    type: numeric
    prompt: |
      A satellite in a circular orbit {{h1}} km above the Earth's surface is to be moved to a circular orbit {{h2}} km
      up by a Hohmann transfer: a first engine burn puts it on an ellipse whose perigee is the old orbit and whose
      apogee touches the new one. By how much must the first burn increase its speed? Take
      $G = 6.674 \times 10^{-11}\ \text{N m}^2/\text{kg}^2$, $M_E = 5.97 \times 10^{24}$ kg and
      $R_E = 6.37 \times 10^{6}$ m, and give your answer with units.
    params:
      h1: { int: [200, 1000] }
      h2: { int: [2000, 36000] }
    let:
      r1: "6.37e6 + h1 * 1000"
      r2: "6.37e6 + h2 * 1000"
      GM: "6.674e-11 * 5.97e24"
    answer: "(sqrt(GM / r1) * (sqrt(2 * r2 / (r1 + r2)) - 1)) / 1000"
    units: "km/s"
    tolerance: { rel: 0.01 }
    hints:
      - "Before the burn the speed is the circular speed $\\sqrt{GM/r_1}$."
      - "Just after the burn the satellite is at perigee of an ellipse with $a = (r_1 + r_2)/2$."
      - "Use vis-viva, or energy and angular-momentum conservation between perigee and apogee."
    solution: |
      Circular speed at $r_1 \approx {{round(r1/1000, 0)}}$ km: $v_1 = \sqrt{GM/r_1} \approx {{round(sqrt(GM/r1)/1000, 4)}}$ km/s.
      On the transfer ellipse, $a = (r_1 + r_2)/2$ and vis-viva gives at perigee
      $$v_p = \sqrt{GM\left(\frac{2}{r_1} - \frac{1}{a}\right)} = v_1\sqrt{\frac{2r_2}{r_1 + r_2}} \approx {{round(sqrt(GM/r1)*sqrt(2*r2/(r1 + r2))/1000, 4)}}\ \text{km/s}.$$
      So $\Delta v_1 = v_p - v_1 \approx {{round(sqrt(GM/r1)*(sqrt(2*r2/(r1 + r2)) - 1)/1000, 4)}}$ km/s.
    verify: "(max(solve(Rational(1, 2)*Symbol('vp')**2 - 6.674e-11*5.97e24/(6.37e6 + h1*1000) - Rational(1, 2)*((6.37e6 + h1*1000)*Symbol('vp')/(6.37e6 + h2*1000))**2 + 6.674e-11*5.97e24/(6.37e6 + h2*1000), Symbol('vp'))) - max(solve(Symbol('v')**2/(6.37e6 + h1*1000) - 6.674e-11*5.97e24/(6.37e6 + h1*1000)**2, Symbol('v')))) / 1000"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 8
