subject: physics
topic: units-dimensions-vectors
questions:
  - id: phys-units-001
    difficulty: 1
    type: numeric
    prompt: "A car travels at {{v}} km/h. What is its speed? Give a value with units."
    params:
      v: { int: [36, 144] }
    answer: "v / 3.6"
    units: "m/s"
    tolerance: { rel: 0.005 }
    hints: ["1 km = 1000 m and 1 h = 3600 s."]
    solution: "${{v}}\\,\\text{km/h} = {{v}} \\times \\tfrac{1000}{3600}\\,\\text{m/s} \\approx {{v/3.6}}\\,\\text{m/s}$."
    verify: "v*1000/3600"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 2
  - id: phys-units-002
    difficulty: 2
    type: estimate
    prompt: "Estimate the number of heartbeats in a human lifetime of 80 years."
    answer: "70 * 60 * 24 * 365 * 80"
    factor: 3
    hints: ["Roughly 70 beats per minute.", "Minutes in a year: about $5 \\times 10^5$."]
    solution: "$70 \\times 60 \\times 24 \\times 365 \\times 80 \\approx 3 \\times 10^9$ beats."
    verify: "70*60*24*365*80"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 3

  - id: phys-units-003
    difficulty: 1
    type: mc
    prompt: |
      Newton's second law, $F = ma$, fixes the dimensions of force. In terms of mass $\mathrm{M}$, length $\mathrm{L}$ and time $\mathrm{T}$, the dimensions of force are:
    options:
      - '$\mathrm{M\,L\,T^{-2}}$'
      - '$\mathrm{M\,L^{2}\,T^{-2}}$'
      - '$\mathrm{M\,L\,T^{-1}}$'
      - '$\mathrm{M\,L^{-1}\,T^{-2}}$'
    answer: 0
    hints:
      - 'Acceleration is a change of velocity per unit time.'
      - 'Velocity has dimensions $\mathrm{L\,T^{-1}}$, so acceleration has $\mathrm{L\,T^{-2}}$.'
    solution: |
      $[F] = [m][a] = \mathrm{M} \cdot \mathrm{L\,T^{-2}} = \mathrm{M\,L\,T^{-2}}$. In SI units this is $1\,\text{N} = 1\,\text{kg\,m/s}^2$.
      ($\mathrm{M\,L^2\,T^{-2}}$ is energy, $\mathrm{M\,L\,T^{-1}}$ is momentum and $\mathrm{M\,L^{-1}\,T^{-2}}$ is pressure.)
    verify: "(lambda M, L, T: [M*L/T**2, M*L**2/T**2, M*L/T, M/(L*T**2)].index(M*(L/T)/T))(*symbols('M L T', positive=True))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 1

  - id: phys-units-004
    difficulty: 1
    type: numeric
    prompt: |
      A rope pulls a sled with a force of magnitude {{F}} N directed {{th}}° above the horizontal. What is the horizontal component of this force? Give a value with units.
    params:
      F: { int: [20, 200] }
      th: { int: [10, 70] }
    answer: "F * cos(th * pi / 180)"
    units: "N"
    tolerance: { rel: 0.01 }
    hints:
      - 'Draw the force as the hypotenuse of a right triangle whose legs are the components.'
      - 'The component adjacent to the angle is $F\cos\theta$.'
    solution: |
      The horizontal component is adjacent to the {{th}}° angle:
      $F_x = F\cos\theta = {{F}}\,\text{N} \times \cos {{th}}^\circ \approx {{F*cos(th*pi/180)}}\,\text{N}$.
    verify: "(F*np.exp(1j*np.radians(th))).real"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 2

  - id: phys-units-005
    difficulty: 2
    type: numeric
    prompt: |
      A displacement vector has components $A_x = {{ax}}\,\text{m}$ and $A_y = {{ay}}\,\text{m}$. What is its direction, as an angle in degrees measured counter-clockwise from the $+x$ axis, between 0 and 360? Enter a number of degrees.
    params:
      ax: { int: [-9, 9], not: [0] }
      ay: { int: [-9, 9], not: [0] }
    let:
      ang: "mod(atan2(ay, ax) * 180 / pi, 360)"
    answer: ang
    tolerance: { abs: 0.5 }
    hints:
      - 'First decide which quadrant the vector points into from the signs of its components.'
      - '$\arctan(A_y/A_x)$ only returns angles between $-90^\circ$ and $90^\circ$; add $180^\circ$ when $A_x < 0$, and $360^\circ$ if the result is still negative.'
    solution: |
      The reference angle is $\arctan\left|\dfrac{A_y}{A_x}\right| = \arctan\dfrac{ {{abs(ay)}} }{ {{abs(ax)}} } \approx {{atan(abs(ay)/abs(ax))*180/pi}}^\circ$.
      With $A_x = {{ax}}$ and $A_y = {{ay}}$ the vector lies in the quadrant these signs give, so measured counter-clockwise from $+x$ the direction is $\theta \approx {{ang}}^\circ$.
    verify: "float(arg(ax + I*ay)*180/pi) % 360"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 3

  - id: phys-units-006
    difficulty: 2
    type: vector
    prompt: |
      Two forces are $\vec A = {{row: [a1, a2, a3]}}\,\text{N}$ and $\vec B = {{row: [b1, b2, b3]}}\,\text{N}$. Find $2\vec A - \vec B$ in newtons, as components such as `1, -2, 3`.
    params:
      a1: { int: [-6, 6] }
      a2: { int: [-6, 6] }
      a3: { int: [-6, 6] }
      b1: { int: [-6, 6] }
      b2: { int: [-6, 6] }
      b3: { int: [-6, 6] }
    answer: "2 * [a1, a2, a3] - [b1, b2, b3]"
    hints:
      - 'Scaling and adding vectors act component by component.'
      - 'The $x$ component is $2A_x - B_x$.'
    solution: |
      Component by component: $2\vec A = {{row: 2*[a1, a2, a3]}}$, and subtracting $\vec B$ gives
      $2\vec A - \vec B = {{row: 2*[a1, a2, a3] - [b1, b2, b3]}}\,\text{N}$.
    verify: "list(2*Matrix([a1, a2, a3]) - Matrix([b1, b2, b3]))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 2

  - id: phys-units-007
    difficulty: 3
    type: numeric
    prompt: |
      Find the angle between $\vec A = {{row: [a1, a2, a3]}}$ and $\vec B = {{row: [b1, b2, b3]}}$, in degrees. Enter a number of degrees.
    params:
      a1: { int: [-4, 4] }
      a2: { int: [-4, 4] }
      a3: { int: [-4, 4] }
      b1: { int: [-4, 4] }
      b2: { int: [-4, 4] }
      b3: { int: [-4, 4] }
    let:
      dotp: "a1*b1 + a2*b2 + a3*b3"
      na: "sqrt(a1^2 + a2^2 + a3^2)"
      nb: "sqrt(b1^2 + b2^2 + b3^2)"
    require: ["na > 0", "nb > 0", "abs(dotp) < 0.999 * na * nb"]
    answer: "acos(dotp / (na * nb)) * 180 / pi"
    tolerance: { abs: 0.5 }
    hints:
      - 'Use the dot product: $\vec A \cdot \vec B = |\vec A|\,|\vec B|\cos\theta$.'
      - '$\vec A \cdot \vec B = A_xB_x + A_yB_y + A_zB_z$.'
    solution: |
      $\vec A \cdot \vec B = {{dotp}}$, $|\vec A| = \sqrt{ {{na^2}} } \approx {{na}}$ and $|\vec B| = \sqrt{ {{nb^2}} } \approx {{nb}}$.
      So $\cos\theta = \dfrac{ {{dotp}} }{ {{na}} \times {{nb}} } \approx {{dotp/(na*nb)}}$ and $\theta \approx {{acos(dotp/(na*nb))*180/pi}}^\circ$.
    verify: "math.degrees(math.acos(((a1**2+a2**2+a3**2) + (b1**2+b2**2+b3**2) - ((a1-b1)**2+(a2-b2)**2+(a3-b3)**2)) / (2*math.sqrt(a1**2+a2**2+a3**2)*math.sqrt(b1**2+b2**2+b3**2))))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 4

  - id: phys-units-008
    difficulty: 3
    type: vector
    prompt: |
      A force $\vec F = {{row: [b1, b2, b3]}}\,\text{N}$ acts at the point $\vec r = {{row: [a1, a2, a3]}}\,\text{m}$ from a pivot. Find the torque $\vec\tau = \vec r \times \vec F$ in N·m, as components `x, y, z`.
    params:
      a1: { int: [-4, 4] }
      a2: { int: [-4, 4] }
      a3: { int: [-4, 4] }
      b1: { int: [-5, 5] }
      b2: { int: [-5, 5] }
      b3: { int: [-5, 5] }
    answer: "cross([a1, a2, a3], [b1, b2, b3])"
    hints:
      - 'Write the cross product as a determinant with $\hat\imath, \hat\jmath, \hat k$ in the first row.'
      - '$\tau_x = r_yF_z - r_zF_y$, $\tau_y = r_zF_x - r_xF_z$, $\tau_z = r_xF_y - r_yF_x$.'
    solution: |
      $$\vec\tau = \begin{vmatrix} \hat\imath & \hat\jmath & \hat k \\ {{a1}} & {{a2}} & {{a3}} \\ {{b1}} & {{b2}} & {{b3}} \end{vmatrix}$$
      $\tau_x = ({{a2}})({{b3}}) - ({{a3}})({{b2}}) = {{a2*b3 - a3*b2}}$, $\tau_y = ({{a3}})({{b1}}) - ({{a1}})({{b3}}) = {{a3*b1 - a1*b3}}$, $\tau_z = ({{a1}})({{b2}}) - ({{a2}})({{b1}}) = {{a1*b2 - a2*b1}}$.
      So $\vec\tau = {{row: cross([a1, a2, a3], [b1, b2, b3])}}\,\text{N·m}$.
    verify: "[Matrix([[a2, a3], [b2, b3]]).det(), -Matrix([[a1, a3], [b1, b3]]).det(), Matrix([[a1, a2], [b1, b2]]).det()]"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 4

  - id: phys-units-009
    difficulty: 3
    type: numeric
    prompt: |
      On an unfamiliar planet, a pendulum of length {{L1}} m swings with period {{T1}} s. Assume the period depends only on the length $L$ and the local gravitational acceleration $g$ (not on the mass or a small amplitude). Using dimensional analysis alone, find the period of a pendulum of length {{L2}} m on the same planet. Give a value with units.
    params:
      L1: { real: [0.5, 2.0], step: 0.1 }
      L2: { real: [0.2, 5.0], step: 0.1 }
      T1: { real: [1.0, 3.0], step: 0.05 }
    require: ["abs(L2 - L1) > 0.05"]
    answer: "T1 * sqrt(L2 / L1)"
    units: "s"
    tolerance: { rel: 0.01 }
    hints:
      - 'Write $T = C\,L^p g^q$ with a dimensionless constant $C$.'
      - 'Match powers: $\mathrm{T}^1 = \mathrm{L}^p (\mathrm{L\,T^{-2}})^q$ gives $p + q = 0$ and $-2q = 1$.'
      - 'So $T \propto \sqrt{L/g}$; on the same planet $g$ cancels in the ratio.'
    solution: |
      Write $T = C\,L^p g^q$. Dimensions: $\mathrm{T} = \mathrm{L}^{p+q}\,\mathrm{T}^{-2q}$, so $-2q = 1$ and $p + q = 0$: $q = -\tfrac12$, $p = \tfrac12$, and $T = C\sqrt{L/g}$.
      The unknown $C$ and $g$ cancel in a ratio: $\dfrac{T_2}{T_1} = \sqrt{\dfrac{L_2}{L_1}}$, so
      $T_2 = {{T1}}\,\text{s} \times \sqrt{\dfrac{ {{L2}} }{ {{L1}} }} \approx {{T1*sqrt(L2/L1)}}\,\text{s}$.
    verify: "(lambda s: T1*(L2/L1)**float(s[Symbol('p')]))(solve([Eq(Symbol('p') + Symbol('q'), 0), Eq(-2*Symbol('q'), 1)], [Symbol('p'), Symbol('q')]))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 4

  - id: phys-units-010
    difficulty: 3
    type: multipart
    prompt: |
      The speed of waves on deep water depends only on the wavelength $\lambda$ and on $g$. Suppose $v = C\,\lambda^a g^b$ with $C$ a dimensionless number.
    parts:
      - prompt: "(a) Find the exponent $a$."
        type: numeric
        answer: 0.5
        tolerance: { abs: 0.001 }
        verify: "solve([Eq(Symbol('a') + Symbol('b'), 1), Eq(-2*Symbol('b'), -1)], [Symbol('a'), Symbol('b')])[Symbol('a')]"
      - prompt: "(b) Find the exponent $b$."
        type: numeric
        answer: 0.5
        tolerance: { abs: 0.001 }
        verify: "solve([Eq(Symbol('a') + Symbol('b'), 1), Eq(-2*Symbol('b'), -1)], [Symbol('a'), Symbol('b')])[Symbol('b')]"
      - prompt: "(c) Using your exponent from (a): if the wavelength is multiplied by 4, by what factor does the wave speed change?"
        type: numeric
        answer: "4^part1"
        tolerance: { rel: 0.01 }
        verify: "sqrt(4)"
    hints:
      - 'Write the dimensions of each side: $[v] = \mathrm{L\,T^{-1}}$, $[\lambda] = \mathrm{L}$, $[g] = \mathrm{L\,T^{-2}}$.'
      - 'Matching powers of $\mathrm{T}$ gives $-1 = -2b$; matching powers of $\mathrm{L}$ gives $1 = a + b$.'
    solution: |
      $\mathrm{L\,T^{-1}} = \mathrm{L}^a(\mathrm{L\,T^{-2}})^b = \mathrm{L}^{a+b}\mathrm{T}^{-2b}$.

      (a), (b) Time: $-2b = -1$, so $b = \tfrac12$. Length: $a + b = 1$, so $a = \tfrac12$. Hence $v = C\sqrt{g\lambda}$ (the full theory gives $C = 1/\sqrt{2\pi}$).

      (c) $v \propto \lambda^{1/2}$, so quadrupling $\lambda$ multiplies $v$ by $4^{1/2} = 2$: long ocean swells outrun short ripples.
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 5

  - id: phys-units-011
    difficulty: 4
    type: proof
    prompt: |
      Let $\hat n$ be a unit vector and $\vec A$ any vector. Show that $\vec A_\parallel = (\vec A \cdot \hat n)\,\hat n$ and $\vec A_\perp = \vec A - (\vec A\cdot\hat n)\,\hat n$ satisfy $\vec A = \vec A_\parallel + \vec A_\perp$ with $\vec A_\perp \perp \hat n$, and that $|\vec A|^2 = |\vec A_\parallel|^2 + |\vec A_\perp|^2$. (This is how a force is split into components along and perpendicular to a slope.)
    hints:
      - 'The sum is immediate from the definition of $\vec A_\perp$.'
      - 'Compute $\vec A_\perp \cdot \hat n$ using $\hat n \cdot \hat n = 1$.'
      - 'Expand $|\vec A_\parallel + \vec A_\perp|^2$ as a dot product of the sum with itself.'
    solution: |
      By definition $\vec A_\parallel + \vec A_\perp = (\vec A\cdot\hat n)\hat n + \vec A - (\vec A\cdot\hat n)\hat n = \vec A$.

      Perpendicularity: $\vec A_\perp \cdot \hat n = \vec A\cdot\hat n - (\vec A\cdot\hat n)(\hat n\cdot\hat n) = \vec A\cdot\hat n - \vec A\cdot\hat n = 0$, because $\hat n\cdot\hat n = |\hat n|^2 = 1$.

      Lengths: $\vec A_\parallel$ is a multiple of $\hat n$, so $\vec A_\parallel\cdot\vec A_\perp = (\vec A\cdot\hat n)(\hat n\cdot\vec A_\perp) = 0$. Then
      $$|\vec A|^2 = (\vec A_\parallel + \vec A_\perp)\cdot(\vec A_\parallel + \vec A_\perp) = |\vec A_\parallel|^2 + 2\,\vec A_\parallel\cdot\vec A_\perp + |\vec A_\perp|^2 = |\vec A_\parallel|^2 + |\vec A_\perp|^2,$$
      which is Pythagoras' theorem for the two components.
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 6

  - id: phys-units-012
    difficulty: 4
    type: estimate
    prompt: |
      Atmospheric pressure at sea level is about $10^5\,\text{Pa}$ and Earth's radius is about 6400 km. Estimate the total mass of Earth's atmosphere. Give a value with units.
    answer: "1.013e5 * 4 * pi * (6.37e6)^2 / 9.8"
    units: "kg"
    factor: 2
    hints:
      - 'Pressure at the ground is the weight of the air column above each square metre.'
      - 'Total weight of the air = pressure × Earth''s surface area, $4\pi R^2$.'
    solution: |
      The air above each square metre weighs about $10^5\,\text{N}$, so the whole atmosphere weighs $P \cdot 4\pi R^2 \approx 10^5 \times 4\pi \times (6.4\times10^6)^2 \approx 5\times10^{19}\,\text{N}$.
      Dividing by $g \approx 9.8\,\text{m/s}^2$: $M \approx 5\times10^{18}\,\text{kg}$ (about a millionth of Earth's mass).
    verify: "integrate(101300*sin(Symbol('th'))*(6.37e6)**2, (Symbol('th'), 0, pi), (Symbol('ph'), 0, 2*pi))/9.8"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 4

  - id: phys-units-013
    difficulty: 4
    type: multipart
    prompt: |
      Take $+x$ east and $+y$ north. You walk {{d1}} m due east, then {{d2}} m in a direction {{th}}° north of west, then {{d3}} m due south.
    params:
      d1: { int: [20, 90] }
      d2: { int: [20, 90] }
      th: { int: [15, 75] }
      d3: { int: [10, 80] }
    let:
      sx: "d1 - d2 * cos(th * pi / 180)"
      sy: "d2 * sin(th * pi / 180) - d3"
    require: ["abs(sx) > 5", "abs(sy) > 5"]
    parts:
      - prompt: "(a) What is the $x$ component of your net displacement? Give a value with units (it may be negative)."
        type: numeric
        answer: sx
        units: "m"
        tolerance: { rel: 0.01 }
        verify: "(d1 + d2*np.exp(1j*np.radians(180 - th)) - 1j*d3).real"
      - prompt: "(b) What is its $y$ component?"
        type: numeric
        answer: sy
        units: "m"
        tolerance: { rel: 0.01 }
        verify: "(d1 + d2*np.exp(1j*np.radians(180 - th)) - 1j*d3).imag"
      - prompt: "(c) Using your answers to (a) and (b), how far are you from your starting point?"
        type: numeric
        answer: "sqrt(part1^2 + part2^2)"
        units: "m"
        tolerance: { rel: 0.01 }
        verify: "abs(d1 + d2*np.exp(1j*np.radians(180 - th)) - 1j*d3)"
    hints:
      - 'Write each leg as components. "North of west" points along $-x$, tilted towards $+y$.'
      - 'The second leg is $(-{{d2}}\cos {{th}}^\circ,\ {{d2}}\sin {{th}}^\circ)$.'
      - 'Add the components, then use Pythagoras for the distance.'
    solution: |
      Legs: $({{d1}}, 0)$, $(-{{d2}}\cos {{th}}^\circ, {{d2}}\sin {{th}}^\circ) \approx ({{-d2*cos(th*pi/180)}}, {{d2*sin(th*pi/180)}})$ and $(0, -{{d3}})$, in metres.

      (a) $s_x = {{d1}} - {{d2*cos(th*pi/180)}} \approx {{sx}}\,\text{m}$.

      (b) $s_y = {{d2*sin(th*pi/180)}} - {{d3}} \approx {{sy}}\,\text{m}$.

      (c) $|\vec s| = \sqrt{s_x^2 + s_y^2} \approx {{sqrt(sx^2 + sy^2)}}\,\text{m}$.
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 6
