subject: physics
topic: rotational-kinematics
questions:
  - id: phys-rotkin-001
    difficulty: 1
    type: numeric
    prompt: "A drill bit turns at {{N}} revolutions per minute. What is its angular velocity? Give your answer with units."
    params:
      N: { int: [100, 3000] }
    answer: "N * 2 * pi / 60"
    units: "rad/s"
    tolerance: { rel: 0.01 }
    hints:
      - "One revolution is $2\\pi$ radians, and one minute is 60 s."
    solution: |
      $$\omega = {{N}}\ \frac{\text{rev}}{\text{min}} \times \frac{2\pi\ \text{rad}}{1\ \text{rev}} \times \frac{1\ \text{min}}{60\ \text{s}} \approx {{round(N*2*pi/60, 2)}}\ \text{rad/s}.$$
    verify: "N*360/60*pi/180"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 2

  - id: phys-rotkin-002
    difficulty: 1
    type: mc
    prompt: "A rigid disc spins about its central axis. Which quantity is the same for every point of the disc?"
    options:
      - "The angular velocity"
      - "The linear speed"
      - "The centripetal acceleration"
      - "The distance travelled in one second"
    answer: 0
    hints:
      - "A rigid body turns through the same angle in the same time everywhere."
    solution: |
      Every point turns through the same angle $\Delta\theta$ in the same time, so $\omega = d\theta/dt$ is shared.
      The linear speed $v = \omega r$, the centripetal acceleration $\omega^2 r$ and the distance covered all grow with
      the distance $r$ from the axis.
    verify: "0 if abs(3.0*0.2/0.2 - 3.0*0.5/0.5) < 1e-12 and abs(3.0*0.2 - 3.0*0.5) > 0.1 else 1"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 1

  - id: phys-rotkin-003
    difficulty: 1
    type: numeric
    prompt: |
      A merry-go-round turns at {{w}} rad/s. How fast is a child moving who sits {{r}} m from the axis?
      Give your answer with units.
    params:
      w: { real: [0.5, 3], step: 0.1 }
      r: { real: [0.5, 3], step: 0.1 }
    answer: "w * r"
    units: "m/s"
    tolerance: { rel: 0.01 }
    hints:
      - "For circular motion about a fixed axis, $v = \\omega r$ (with $\\omega$ in rad/s)."
    solution: "$v = \\omega r = {{w}} \\times {{r}} = {{round(w*r, 3)}}\\ \\text{m/s}$."
    verify: "float(np.linalg.norm(np.cross([0, 0, w], [r, 0, 0])))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 1

  - id: phys-rotkin-004
    difficulty: 2
    type: numeric
    prompt: |
      A grinding wheel starts from rest and has a constant angular acceleration of {{alpha}} rad/s². Through what
      angle has it turned after {{tf}} s? Give your answer with units.
    params:
      alpha: { real: [0.5, 6], step: 0.5 }
      tf: { int: [2, 12] }
    answer: "0.5 * alpha * tf^2"
    units: "rad"
    tolerance: { rel: 0.01 }
    hints:
      - "The rotational equations of constant acceleration mirror the linear ones: $\\theta = \\omega_0 t + \\tfrac12\\alpha t^2$."
    solution: |
      With $\omega_0 = 0$:
      $\theta = \tfrac12 \alpha t^2 = \tfrac12 \times {{alpha}} \times {{tf}}^2 = {{0.5*alpha*tf^2}}\ \text{rad}$
      (about ${{round(0.5*alpha*tf^2/(2*pi), 2)}}$ revolutions).
    verify: "integrate(integrate(alpha, (t, 0, Symbol('s'))), (Symbol('s'), 0, tf))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 2

  - id: phys-rotkin-005
    difficulty: 2
    type: numeric
    prompt: |
      A flywheel spinning at {{w0}} rad/s is braked with a constant angular deceleration and stops after exactly
      {{n}} revolutions. What is the magnitude of its angular acceleration? Give your answer with units.
    params:
      w0: { int: [10, 80] }
      n: { int: [5, 60] }
    answer: "w0^2 / (4 * pi * n)"
    units: "rad/s^2"
    tolerance: { rel: 0.01 }
    hints:
      - "Convert revolutions to radians: $\\Delta\\theta = 2\\pi n$."
      - "Use $\\omega^2 = \\omega_0^2 + 2\\alpha\\,\\Delta\\theta$ with final $\\omega = 0$."
    solution: |
      $\Delta\theta = 2\pi \times {{n}} \approx {{round(2*pi*n, 2)}}$ rad. With $\omega = 0$,
      $$0 = \omega_0^2 - 2|\alpha|\Delta\theta \Rightarrow |\alpha| = \frac{\omega_0^2}{2\Delta\theta} = \frac{ {{w0}}^2 }{4\pi \times {{n}}} \approx {{round(w0^2/(4*pi*n), 3)}}\ \text{rad/s}^2.$$
    verify: "w0 / (2*pi*n / (w0/2))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 3

  - id: phys-rotkin-006
    difficulty: 2
    type: numeric
    prompt: |
      A ceiling fan turns steadily at {{N}} revolutions per minute. What is the magnitude of the acceleration of a
      point on a blade {{r}} m from the axis? Give your answer with units.
    params:
      N: { int: [60, 300] }
      r: { real: [0.2, 0.7], step: 0.05 }
    let:
      w: "N * pi / 30"
    answer: "w^2 * r"
    units: "m/s^2"
    tolerance: { rel: 0.01 }
    hints:
      - "First convert to rad/s."
      - "At constant $\\omega$ only the centripetal acceleration $\\omega^2 r$ remains."
    solution: |
      $\omega = {{N}} \times 2\pi/60 \approx {{round(w, 3)}}$ rad/s. The speed is constant, so the acceleration is
      purely centripetal:
      $a = \omega^2 r \approx {{round(w, 3)}}^2 \times {{r}} \approx {{round(w^2*r, 2)}}\ \text{m/s}^2$, pointing at the axis.
    verify: "(lambda P: sqrt(sum(diff(c, t, 2)**2 for c in P)).subs(t, 0.37))((r*cos(N*2*pi/60*t), r*sin(N*2*pi/60*t)))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 2

  - id: phys-rotkin-007
    difficulty: 2
    type: numeric
    prompt: |
      Some time after {{H}} o'clock the minute hand and the hour hand of a clock point in exactly the same direction
      for the first time. How many minutes after {{H}}:00 does this happen? Give your answer with units.
    params:
      H: { int: [1, 10] }
    answer: "60 * H / 11"
    units: "min"
    tolerance: { rel: 0.002 }
    hints:
      - "The minute hand turns at $360°/60\\ \\text{min} = 6°$ per minute; the hour hand at $0.5°$ per minute."
      - "At {{H}}:00 the hour hand is already ${{30*H}}°$ ahead."
    solution: |
      Measure angles from 12 in degrees and time $\tau$ in minutes after {{H}}:00. The minute hand is at $6\tau$, the
      hour hand at ${{30*H}} + 0.5\tau$. They coincide when
      $$6\tau = {{30*H}} + 0.5\tau \Rightarrow \tau = \frac{ {{30*H}} }{5.5} = \frac{ {{60*H}} }{11} \approx {{round(60*H/11, 2)}}\ \text{min}.$$
      The minute hand gains $5.5°$ per minute on the hour hand, the relative angular velocity.
    verify: "solve(Eq(6*Symbol('u'), 30*H + Rational(1, 2)*Symbol('u')), Symbol('u'))[0]"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 3

  - id: phys-rotkin-008
    difficulty: 2
    type: estimate
    prompt: |
      A car tyre lasts roughly 60 000 km. Estimate how many revolutions it makes in its lifetime.
    answer: "6e7 / (2 * pi * 0.31)"
    factor: 3
    hints:
      - "A typical car tyre is about 60 cm in diameter."
      - "Each revolution, a tyre that rolls without slipping moves the car forward one circumference."
    solution: |
      Rolling without slipping, each revolution moves the car one circumference, $2\pi r \approx 2\pi(0.31\ \text{m}) \approx 1.9$ m. So
      $$N \approx \frac{6 \times 10^7\ \text{m}}{1.9\ \text{m}} \approx 3 \times 10^7\ \text{revolutions}.$$
    verify: "6e7 / (pi*0.62)"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 3

  - id: phys-rotkin-009
    difficulty: 3
    type: multipart
    prompt: |
      A disc of radius {{r}} m starts from rest and spins up with a constant angular acceleration of
      {{alpha}} rad/s² for {{tf}} s.
    params:
      r: { real: [0.1, 0.5], step: 0.05 }
      alpha: { real: [0.5, 4], step: 0.5 }
      tf: { int: [2, 8] }
    parts:
      - prompt: "(a) What is its angular velocity at $t = {{tf}}$ s? Give it with units."
        type: numeric
        answer: "alpha * tf"
        units: "rad/s"
        tolerance: { rel: 0.01 }
        verify: "diff(alpha*t**2/2, t).subs(t, tf)"
      - prompt: "(b) How many revolutions has it made by then? (A pure number.)"
        type: numeric
        answer: "0.5 * alpha * tf^2 / (2 * pi)"
        tolerance: { rel: 0.01 }
        verify: "integrate(alpha*t, (t, 0, tf)) / (2*pi)"
      - prompt: "(c) Using your answer to (a), what is the magnitude of the total acceleration of a point on the rim at that instant? Give it with units."
        type: numeric
        answer: "sqrt((alpha * r)^2 + (part1^2 * r)^2)"
        units: "m/s^2"
        tolerance: { rel: 0.01 }
        verify: "(lambda P: sqrt(sum(diff(c, t, 2)**2 for c in P)).subs(t, tf))((r*cos(alpha*t**2/2), r*sin(alpha*t**2/2)))"
    hints:
      - "Constant $\\alpha$: $\\omega = \\alpha t$ and $\\theta = \\tfrac12\\alpha t^2$."
      - "Divide the angle in radians by $2\\pi$ to get revolutions."
      - "The rim point has a tangential component $a_t = \\alpha r$ and a centripetal one $a_c = \\omega^2 r$, at right angles."
    solution: |
      (a) $\omega = \alpha t = {{alpha}} \times {{tf}} = {{alpha*tf}}$ rad/s.

      (b) $\theta = \tfrac12\alpha t^2 = {{0.5*alpha*tf^2}}$ rad, which is ${{0.5*alpha*tf^2}}/(2\pi) \approx {{round(0.5*alpha*tf^2/(2*pi), 3)}}$ revolutions.

      (c) $a_t = \alpha r = {{round(alpha*r, 4)}}\ \text{m/s}^2$ and $a_c = \omega^2 r = {{alpha*tf}}^2 \times {{r}} = {{round((alpha*tf)^2*r, 4)}}\ \text{m/s}^2$. They are perpendicular, so
      $$a = \sqrt{a_t^2 + a_c^2} \approx {{round(sqrt((alpha*r)^2 + ((alpha*tf)^2*r)^2), 3)}}\ \text{m/s}^2.$$
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 6

  - id: phys-rotkin-010
    difficulty: 3
    type: numeric
    prompt: |
      The Earth turns once on its axis every 86 164 s (a sidereal day), and its radius is $6.37 \times 10^6$ m.
      How fast is a point on the ground at latitude {{lat}}° carried around by this rotation? Give your answer with units.
    params:
      lat: { int: [0, 70] }
    answer: "2 * pi * 6.37e6 * cos(lat * pi / 180) / 86164"
    units: "m/s"
    tolerance: { rel: 0.01 }
    hints:
      - "The point moves on a circle about the Earth's axis, not about its centre."
      - "That circle has radius $R\\cos\\lambda$ at latitude $\\lambda$."
    solution: |
      $\omega = 2\pi/86\,164\ \text{s} \approx 7.29 \times 10^{-5}$ rad/s. At latitude $\lambda = {{lat}}°$ the point
      circles the axis at radius $R\cos\lambda \approx {{round(6.37e6*cos(lat*pi/180)/1000, 1)}}$ km, so
      $$v = \omega R \cos\lambda \approx {{round(2*pi*6.37e6*cos(lat*pi/180)/86164, 1)}}\ \text{m/s}.$$
    verify: "float(np.linalg.norm(np.cross([0, 0, 2*np.pi/86164], [6.37e6*math.cos(math.radians(lat)), 0, 6.37e6*math.sin(math.radians(lat))])))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 3

  - id: phys-rotkin-011
    difficulty: 3
    type: numeric
    prompt: |
      A motor spins a shaft up from rest with an angular acceleration that grows in time, $\alpha(t) = {{c}}\,t$
      (in rad/s² with $t$ in seconds). Through what angle has the shaft turned after {{tf}} s? Give your answer with units.
    params:
      c: { real: [0.2, 3], step: 0.2 }
      tf: { int: [2, 10] }
    answer: "c * tf^3 / 6"
    units: "rad"
    tolerance: { rel: 0.01 }
    hints:
      - "The constant-acceleration formulas do not apply. Integrate instead."
      - "$\\omega(t) = \\int_0^t \\alpha\\,dt'$, then $\\theta(t) = \\int_0^t \\omega\\,dt'$."
    solution: |
      $$\omega(t) = \int_0^t {{c}}\,t'\,dt' = \frac{ {{c}} }{2}t^2,\qquad \theta(t) = \int_0^t \frac{ {{c}} }{2}t'^2\,dt' = \frac{ {{c}} }{6}t^3.$$
      At $t = {{tf}}$ s: $\theta = {{c}} \times {{tf}}^3/6 \approx {{round(c*tf^3/6, 3)}}$ rad.
    verify: "integrate(integrate(c*Symbol('u'), (Symbol('u'), 0, t)), (t, 0, tf))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 3

  - id: phys-rotkin-012
    difficulty: 3
    type: numeric
    prompt: |
      A wheel's angle is $\theta(t) = {{p}}t^3 - {{q}}t^2$ (in radians, $t$ in seconds). At the instant its angular
      acceleration is zero, what is the magnitude of its angular velocity? Give your answer with units.
    params:
      p: { real: [0.5, 3], step: 0.5 }
      q: { int: [2, 9] }
    answer: "q^2 / (3 * p)"
    units: "rad/s"
    tolerance: { rel: 0.01 }
    hints:
      - "$\\omega = d\\theta/dt$ and $\\alpha = d\\omega/dt$."
      - "Solve $\\alpha(t) = 0$ for $t$, then evaluate $\\omega$ there."
    solution: |
      $\omega = 3({{p}})t^2 - 2({{q}})t$ and $\alpha = 6({{p}})t - 2({{q}})$. Then $\alpha = 0$ at
      $t = \dfrac{ {{q}} }{3 \times {{p}}} \approx {{round(q/(3*p), 4)}}$ s, where
      $$\omega = 3p\Big(\frac{q}{3p}\Big)^2 - 2q\frac{q}{3p} = -\frac{q^2}{3p} \approx -{{round(q^2/(3*p), 3)}}\ \text{rad/s}.$$
      The magnitude is ${{round(q^2/(3*p), 3)}}$ rad/s (the wheel is turning backwards then, at its fastest).
    verify: "(lambda th: abs(diff(th, t).subs(t, solve(diff(th, t, 2), t)[0])))(p*t**3 - q*t**2)"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 4

  - id: phys-rotkin-013
    difficulty: 4
    type: numeric
    prompt: |
      A coin sits {{r}} m from the centre of a turntable. The turntable starts from rest and speeds up with constant
      angular acceleration, reaching {{wf}} rad/s after {{T}} s. The coefficient of static friction between coin and
      turntable is {{mu}}. How long after the start does the coin begin to slide? Take $g = 9.8\ \text{m/s}^2$ and
      give your answer with units.
    params:
      r: { real: [0.1, 0.3], step: 0.05 }
      wf: { real: [5, 10], step: 0.5 }
      T: { int: [4, 12] }
      mu: { real: [0.2, 0.6], step: 0.05 }
    let:
      al: "wf / T"
      ts: "sqrt(sqrt((mu * 9.8)^2 - (al * r)^2) / (al^2 * r))"
    require: ["mu * 9.8 > al * r", "ts < T - 0.5"]
    answer: "ts"
    units: "s"
    tolerance: { rel: 0.01 }
    hints:
      - "Friction must supply the coin's whole acceleration, tangential and centripetal."
      - "$a_t = \\alpha r$ is constant, while $a_c = \\omega^2 r = \\alpha^2 t^2 r$ grows."
      - "The coin slides when $\\sqrt{a_t^2 + a_c^2} = \\mu_s g$."
    solution: |
      $\alpha = \omega_f/T = {{wf}}/{{T}} \approx {{round(al, 4)}}$ rad/s². Static friction can provide at most
      $\mu_s g = {{round(mu*9.8, 3)}}\ \text{m/s}^2$ of acceleration. The coin needs
      $$a^2 = (\alpha r)^2 + (\alpha^2 t^2 r)^2.$$
      Setting $a = \mu_s g$:
      $$t^2 = \frac{\sqrt{(\mu_s g)^2 - (\alpha r)^2}}{\alpha^2 r} \Rightarrow t \approx {{round(ts, 3)}}\ \text{s},$$
      which is before the spin-up ends at {{T}} s, so the coin does slide then.
    verify: "max(s for s in solve(((wf/T)*r)**2 + ((wf/T)**2*t**2*r)**2 - (mu*9.8)**2, t) if s.is_real)"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 8

  - id: phys-rotkin-014
    difficulty: 4
    type: proof
    prompt: |
      For rotation with constant angular acceleration $\alpha$, show that $\omega^2 = \omega_0^2 + 2\alpha(\theta - \theta_0)$,
      starting only from the definitions $\omega = d\theta/dt$ and $\alpha = d\omega/dt$.
    hints:
      - "Use the chain rule to write $\\alpha$ as a derivative with respect to $\\theta$."
      - "$\\alpha = \\dfrac{d\\omega}{dt} = \\dfrac{d\\omega}{d\\theta}\\dfrac{d\\theta}{dt}$."
    solution: |
      By the chain rule, $\alpha = \dfrac{d\omega}{dt} = \dfrac{d\omega}{d\theta}\dfrac{d\theta}{dt} = \omega\dfrac{d\omega}{d\theta}$.
      So $\omega\,d\omega = \alpha\,d\theta$. With $\alpha$ constant, integrate from $(\theta_0, \omega_0)$ to $(\theta, \omega)$:
      $$\int_{\omega_0}^{\omega} \omega'\,d\omega' = \alpha\int_{\theta_0}^{\theta} d\theta' \Rightarrow \tfrac12(\omega^2 - \omega_0^2) = \alpha(\theta - \theta_0),$$
      which is $\omega^2 = \omega_0^2 + 2\alpha(\theta - \theta_0)$. $\blacksquare$ (Alternatively eliminate $t$ between
      $\omega = \omega_0 + \alpha t$ and $\theta - \theta_0 = \omega_0 t + \tfrac12\alpha t^2$.)
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 5
