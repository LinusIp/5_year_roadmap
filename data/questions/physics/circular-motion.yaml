subject: physics
topic: circular-motion
questions:
  - id: phys-circ-001
    difficulty: 1
    type: numeric
    prompt: |
      A runner goes round a curve of radius {{r}} m at a steady {{v}} m/s. What is the magnitude of her centripetal acceleration? Give a value with units.
    params:
      v: { real: [2, 12], step: 0.5 }
      r: { real: [5, 50], step: 0.5 }
    answer: "v^2 / r"
    units: "m/s^2"
    tolerance: { rel: 0.01 }
    hints:
      - 'Uniform circular motion has an acceleration towards the centre even though the speed is constant.'
      - '$a_c = v^2/r$.'
    solution: |
      $a_c = \dfrac{v^2}{r} = \dfrac{ {{v}}^2 }{ {{r}} } \approx {{v^2/r}}\,\text{m/s}^2$, directed towards the centre of the curve.
    verify: "float(sqrt(sum(c**2 for c in diff(Matrix([r*cos(v/r*t), r*sin(v/r*t)]), t, 2))).subs(t, 0.3))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 1

  - id: phys-circ-002
    difficulty: 1
    type: mc
    prompt: |
      A car drives round a circular track at constant speed. Which way does its acceleration point?
    options:
      - 'Towards the centre of the circle'
      - 'Forwards, along its velocity'
      - 'Outwards, away from the centre'
      - 'Nowhere: the acceleration is zero because the speed is constant'
    answer: 0
    hints:
      - 'Acceleration is the rate of change of the velocity *vector*, not just of the speed.'
      - 'The velocity keeps turning towards the inside of the curve.'
    solution: |
      The speed is constant but the direction of the velocity keeps changing, turning towards the inside of the curve. The change in velocity over a short time points towards the centre, so the acceleration is centripetal, of size $v^2/r$. The "outward" push you feel in the car is your own inertia, not a force on the car.
    verify: "(lambda rr: (lambda a: 0 if simplify(a.dot(rr)) < 0 and simplify(a[0]*rr[1] - a[1]*rr[0]) == 0 else 1)(diff(rr, t, 2)))(Matrix([2*cos(3*t), 2*sin(3*t)]))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 1

  - id: phys-circ-003
    difficulty: 2
    type: numeric
    prompt: |
      A child sits {{r}} m from the centre of a merry-go-round that turns once every {{T1}} s. How fast is the child moving? Give a value with units.
    params:
      r: { real: [0.5, 4], step: 0.25 }
      T1: { real: [2, 10], step: 0.5 }
    answer: "2 * pi * r / T1"
    units: "m/s"
    tolerance: { rel: 0.01 }
    hints:
      - 'In one period the child travels once round a circle of radius {{r}} m.'
      - '$v = \dfrac{2\pi r}{T}$.'
    solution: |
      One revolution covers the circumference $2\pi r$ in one period: $v = \dfrac{2\pi r}{T} = \dfrac{2\pi \times {{r}}}{ {{T1}} } \approx {{2*pi*r/T1}}\,\text{m/s}$.
    verify: "float(sqrt(sum(c**2 for c in diff(Matrix([r*cos(2*pi*t/T1), r*sin(2*pi*t/T1)]), t))).subs(t, 0.37))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 2

  - id: phys-circ-004
    difficulty: 2
    type: numeric
    prompt: |
      A {{m}} kg puck on frictionless ice is tied to a post by a string {{r}} m long and moves in a horizontal circle, making {{f}} revolutions per second. What is the tension in the string? Give a value with units.
    params:
      m: { real: [0.1, 2], step: 0.1 }
      r: { real: [0.3, 2], step: 0.1 }
      f: { real: [0.5, 2], step: 0.25 }
    let:
      w: "2 * pi * f"
    answer: "m * w^2 * r"
    units: "N"
    tolerance: { rel: 0.01 }
    hints:
      - 'The tension is the only horizontal force, so it provides the centripetal force.'
      - 'Angular speed $\omega = 2\pi f$, and $a_c = \omega^2 r$.'
    solution: |
      $\omega = 2\pi f = 2\pi \times {{f}} \approx {{w}}\,\text{rad/s}$. The tension supplies the centripetal force:
      $T = m\omega^2 r = {{m}} \times {{w}}^2 \times {{r}} \approx {{m*w^2*r}}\,\text{N}$.
    verify: "m*float(sqrt(sum(c**2 for c in diff(Matrix([r*cos(2*pi*f*t), r*sin(2*pi*f*t)]), t, 2))).subs(t, 0.1))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 3

  - id: phys-circ-005
    difficulty: 2
    type: numeric
    prompt: |
      A car rounds a flat (unbanked) curve of radius {{r}} m. The coefficient of static friction between tyres and road is {{mu}}. With $g = 9.8\,\text{m/s}^2$, what is the greatest speed at which it can take the curve without skidding? Give a value with units.
    params:
      r: { int: [20, 200] }
      mu: { real: [0.3, 1.0], step: 0.05 }
    let:
      g: 9.8
    answer: "sqrt(mu * g * r)"
    units: "m/s"
    tolerance: { rel: 0.01 }
    hints:
      - 'Static friction, pointing towards the centre, is the only horizontal force.'
      - 'At the limit, $\mu_s mg = mv^2/r$.'
    solution: |
      Friction provides the centripetal force, and at most $f = \mu_s N = \mu_s mg$. So $\mu_s mg = \dfrac{mv_{\max}^2}{r}$ and
      $v_{\max} = \sqrt{\mu_s g r} = \sqrt{ {{mu}} \times 9.8 \times {{r}} } \approx {{sqrt(mu*g*r)}}\,\text{m/s}$ ($\approx {{3.6*sqrt(mu*g*r)}}$ km/h). The mass cancels.
    verify: "max(solve(Eq(mu*9.8, Symbol('u')**2/r), Symbol('u')))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 3

  - id: phys-circ-006
    difficulty: 3
    type: numeric
    prompt: |
      A road curve of radius {{r}} m is banked at {{th}}°. At what speed can a car take the curve with **no** friction needed at all? Take $g = 9.8\,\text{m/s}^2$ and give a value with units.
    params:
      r: { int: [30, 300] }
      th: { int: [5, 35] }
    let:
      g: 9.8
    answer: "sqrt(r * g * tan(th * pi / 180))"
    units: "m/s"
    tolerance: { rel: 0.01 }
    hints:
      - 'Only gravity and the normal force act. The normal force is tilted towards the centre.'
      - 'Vertical: $N\cos\theta = mg$. Horizontal: $N\sin\theta = mv^2/r$.'
      - 'Divide the two equations.'
    solution: |
      With no friction: $N\cos\theta = mg$ (vertical) and $N\sin\theta = \dfrac{mv^2}{r}$ (horizontal, towards the centre). Dividing,
      $$\tan\theta = \frac{v^2}{rg} \;\Rightarrow\; v = \sqrt{rg\tan\theta} = \sqrt{ {{r}} \times 9.8 \times \tan{{th}}^\circ } \approx {{sqrt(r*g*tan(th*pi/180))}}\,\text{m/s}.$$
    verify: "math.sqrt(r*np.linalg.solve([[math.sin(math.radians(th)), -1], [math.cos(math.radians(th)), 0]], [0, 9.8])[1])"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 4

  - id: phys-circ-007
    difficulty: 3
    type: numeric
    prompt: |
      A conical pendulum: a small ball on a string {{L}} m long moves in a horizontal circle, with the string making a steady {{th}}° with the vertical. With $g = 9.8\,\text{m/s}^2$, what is the period of the motion? Give a value with units.
    params:
      L: { real: [0.3, 2], step: 0.1 }
      th: { int: [10, 70] }
    let:
      g: 9.8
      rad: "th * pi / 180"
    answer: "2 * pi * sqrt(L * cos(rad) / g)"
    units: "s"
    tolerance: { rel: 0.01 }
    hints:
      - 'The radius of the circle is $r = L\sin\theta$.'
      - 'Vertical: $T\cos\theta = mg$. Horizontal: $T\sin\theta = m\omega^2 L\sin\theta$.'
      - 'So $\omega^2 = g/(L\cos\theta)$, and the period is $2\pi/\omega$.'
    solution: |
      The ball moves on a circle of radius $L\sin\theta$. Vertically $T\cos\theta = mg$; horizontally $T\sin\theta = m\omega^2 L\sin\theta$, so $T = m\omega^2 L$. Combining,
      $$\omega^2 = \frac{g}{L\cos\theta}, \qquad P = \frac{2\pi}{\omega} = 2\pi\sqrt{\frac{L\cos\theta}{g}} = 2\pi\sqrt{\frac{ {{L}}\cos{{th}}^\circ}{9.8}} \approx {{2*pi*sqrt(L*cos(rad)/g)}}\,\text{s}.$$
    verify: "(lambda S: 2*math.pi/math.sqrt(S/L))(np.linalg.solve([[math.cos(math.radians(th))]], [9.8])[0])"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 5

  - id: phys-circ-008
    difficulty: 3
    type: multipart
    prompt: |
      A {{m}} kg ball on a string is whirled in a vertical circle of radius {{r}} m. At the top of the circle its speed is {{v}} m/s. Take $g = 9.8\,\text{m/s}^2$.
    params:
      m: { real: [0.1, 1.5], step: 0.1 }
      r: { real: [0.4, 1.5], step: 0.1 }
      v: { real: [2.5, 8], step: 0.5 }
    let:
      g: 9.8
    require: ["v^2 > 1.2 * g * r"]
    parts:
      - prompt: "(a) What is the ball's centripetal acceleration at the top? Give a value with units."
        type: numeric
        answer: "v^2 / r"
        units: "m/s^2"
        tolerance: { rel: 0.01 }
        verify: "float(sqrt(sum(c**2 for c in diff(Matrix([r*sin(v/r*t), r*cos(v/r*t)]), t, 2))).subs(t, 0))"
      - prompt: "(b) Using your answer to (a), what is the tension in the string at the top?"
        type: numeric
        answer: "m * (part1 - g)"
        units: "N"
        tolerance: { rel: 0.01 }
        verify: "solve(Eq(Symbol('T') + m*9.8, m*v**2/r), Symbol('T'))[0]"
    hints:
      - 'At the top, both the tension and the weight point down, towards the centre.'
      - '$T + mg = m\,v^2/r$.'
    solution: |
      (a) $a_c = v^2/r = {{v}}^2/{{r}} \approx {{v^2/r}}\,\text{m/s}^2$, pointing down towards the centre.

      (b) At the top both $T$ and $mg$ point down: $T + mg = ma_c$, so $T = m(a_c - g) = {{m}}({{v^2/r}} - 9.8) \approx {{m*(v^2/r - g)}}\,\text{N}$.
      If $v^2 < gr$ this would be negative: the string would go slack and the ball would leave the circle.
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 4

  - id: phys-circ-009
    difficulty: 3
    type: numeric
    prompt: |
      A {{m}} kg car drives over the crest of a hill whose top is a circular arc of radius {{r}} m, at {{v}} m/s. With $g = 9.8\,\text{m/s}^2$, what is the normal force of the road on the car at the crest? Give a value with units.
    params:
      m: { int: [800, 2000] }
      r: { int: [20, 100] }
      v: { real: [3, 25], step: 0.5 }
    let:
      g: 9.8
    require: ["v^2 < 0.9 * g * r"]
    answer: "m * (g - v^2 / r)"
    units: "N"
    tolerance: { rel: 0.01 }
    hints:
      - 'At the crest the centre of the circle is below the car, so the net force must point down.'
      - '$mg - N = mv^2/r$.'
    solution: |
      Towards the centre (down): $mg - N = \dfrac{mv^2}{r}$, so
      $N = m\left(g - \dfrac{v^2}{r}\right) = {{m}}\left(9.8 - \dfrac{ {{v}}^2 }{ {{r}} }\right) \approx {{m*(g - v^2/r)}}\,\text{N}$,
      less than the weight {{m*g}} N: the car feels lighter. At $v = \sqrt{gr} \approx {{sqrt(g*r)}}\,\text{m/s}$ it would leave the road.
    verify: "solve(Eq(m*9.8 - Symbol('n'), m*v**2/r), Symbol('n'))[0]"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 3

  - id: phys-circ-010
    difficulty: 4
    type: numeric
    prompt: |
      A curve of radius {{r}} m is banked at {{th}}°, and the coefficient of static friction between tyres and road is {{mu}}. With $g = 9.8\,\text{m/s}^2$, what is the greatest speed at which a car can take the curve without sliding up and out? Give a value with units.
    params:
      r: { int: [30, 200] }
      th: { int: [10, 35] }
      mu: { real: [0.1, 0.6], step: 0.05 }
    let:
      g: 9.8
      s: "sin(th * pi / 180)"
      c: "cos(th * pi / 180)"
    require: ["c - mu * s > 0.2"]
    answer: "sqrt(r * g * (s + mu * c) / (c - mu * s))"
    units: "m/s"
    tolerance: { rel: 0.01 }
    hints:
      - 'At the maximum speed the car tends to slide up the bank, so friction points *down* the slope, at its maximum $\mu_s N$.'
      - 'Horizontal: $N\sin\theta + \mu_s N\cos\theta = mv^2/r$. Vertical: $N\cos\theta - \mu_s N\sin\theta = mg$.'
      - 'Divide the equations to eliminate $N$.'
    solution: |
      Friction (down the slope, $\mu_s N$) and the normal force both have horizontal components towards the centre:
      $$N(\sin\theta + \mu_s\cos\theta) = \frac{mv^2}{r}, \qquad N(\cos\theta - \mu_s\sin\theta) = mg.$$
      Dividing: $v_{\max}^2 = rg\,\dfrac{\sin\theta + \mu_s\cos\theta}{\cos\theta - \mu_s\sin\theta} = {{r}} \times 9.8 \times \dfrac{ {{s + mu*c}} }{ {{c - mu*s}} }$, so $v_{\max} \approx {{sqrt(r*g*(s + mu*c)/(c - mu*s))}}\,\text{m/s}$.
    verify: "(lambda s, c: math.sqrt(r*np.linalg.solve([[s + mu*c, -1], [c - mu*s, 0]], [0, 9.8])[1]))(math.sin(math.radians(th)), math.cos(math.radians(th)))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 7

  - id: phys-circ-011
    difficulty: 2
    type: numeric
    prompt: |
      A ring-shaped space station of radius {{r}} m spins so that astronauts standing on the inside of the outer rim feel the same "gravity" as on Earth, $9.8\,\text{m/s}^2$. How long does one rotation take? Give a value with units.
    params:
      r: { int: [50, 1000] }
    let:
      g: 9.8
    answer: "2 * pi * sqrt(r / g)"
    units: "s"
    tolerance: { rel: 0.01 }
    hints:
      - 'The floor must give the astronaut a centripetal acceleration of $9.8\,\text{m/s}^2$.'
      - '$a_c = \omega^2 r = \left(\dfrac{2\pi}{P}\right)^2 r$.'
    solution: |
      Set $\left(\dfrac{2\pi}{P}\right)^2 r = g$: $P = 2\pi\sqrt{\dfrac{r}{g}} = 2\pi\sqrt{\dfrac{ {{r}} }{9.8}} \approx {{2*pi*sqrt(r/g)}}\,\text{s}$, i.e. about {{60/(2*pi*sqrt(r/g))}} revolutions per minute.
    verify: "solve(Eq(r*(2*pi/Symbol('P', positive=True))**2, 9.8), Symbol('P', positive=True))[0]"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 3

  - id: phys-circ-012
    difficulty: 4
    type: proof
    prompt: |
      A particle moves on a circle of radius $R$ at constant angular speed $\omega$: $\vec r(t) = R(\cos\omega t,\ \sin\omega t)$. Show that its speed is $v = R\omega$, that its acceleration is $\vec a = -\omega^2\vec r$, and hence that $|\vec a| = v^2/R$, directed towards the centre.
    hints:
      - 'Differentiate each component with respect to $t$.'
      - 'Differentiate again and compare with $\vec r$.'
    solution: |
      $\vec v = \dfrac{d\vec r}{dt} = R\omega(-\sin\omega t,\ \cos\omega t)$, so $|\vec v| = R\omega\sqrt{\sin^2\omega t + \cos^2\omega t} = R\omega$. (Also $\vec v \cdot \vec r = 0$: the velocity is tangent to the circle.)

      $\vec a = \dfrac{d\vec v}{dt} = R\omega^2(-\cos\omega t,\ -\sin\omega t) = -\omega^2\vec r$.

      So $\vec a$ points from the particle towards the centre, with $|\vec a| = \omega^2 R = \dfrac{(R\omega)^2}{R} = \dfrac{v^2}{R}$.
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 5

  - id: phys-circ-013
    difficulty: 5
    type: numeric
    prompt: |
      A bead slides without friction on a vertical circular hoop of radius {{R}} m. The hoop spins about its vertical diameter at {{f}} revolutions per second. The bead settles at a steady position, off the bottom, where it goes round with the hoop. Taking $g = 9.8\,\text{m/s}^2$, what angle does the radius to the bead make with the downward vertical? Enter a number of degrees.
    params:
      R: { real: [0.1, 0.5], step: 0.05 }
      f: { real: [1, 4], step: 0.25 }
    let:
      g: 9.8
      w: "2 * pi * f"
    require: ["w^2 * R > 1.1 * g"]
    answer: "acos(g / (w^2 * R)) * 180 / pi"
    tolerance: { abs: 0.3 }
    hints:
      - 'At angle $\theta$ from the bottom, the bead moves on a horizontal circle of radius $R\sin\theta$.'
      - 'The normal force points along the radius of the hoop. Vertical: $N\cos\theta = mg$. Horizontal: $N\sin\theta = m\omega^2 R\sin\theta$.'
      - 'Divide, for $\sin\theta \neq 0$: $\cos\theta = g/(\omega^2 R)$.'
    solution: |
      The bead circles the axis on a radius $R\sin\theta$. The normal force from the hoop points towards the hoop's centre, so
      $$N\cos\theta = mg, \qquad N\sin\theta = m\omega^2 R\sin\theta.$$
      For $\sin\theta \ne 0$ the second gives $N = m\omega^2 R$, and then $\cos\theta = \dfrac{g}{\omega^2 R}$.
      With $\omega = 2\pi \times {{f}} \approx {{w}}\,\text{rad/s}$: $\cos\theta = \dfrac{9.8}{ {{w}}^2 \times {{R}} } \approx {{g/(w^2*R)}}$, so $\theta \approx {{acos(g/(w^2*R))*180/pi}}^\circ$.
      This exists only when $\omega^2 R > g$; spinning slower, the bead stays at the bottom.
    verify: "float(nsolve(diff(-9.8*R*cos(x) - (2*math.pi*f)**2*R**2*sin(x)**2/2, x)/sin(x), x, (1e-3, math.pi/2 - 1e-3), solver='bisect'))*180/math.pi"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 8

  - id: phys-circ-014
    difficulty: 2
    type: estimate
    prompt: |
      Estimate the centripetal acceleration of a person standing on the equator, due to the Earth's daily rotation. Give a value with units.
    answer: "(2 * pi / 86400)^2 * 6.37e6"
    units: "m/s^2"
    factor: 2
    hints:
      - 'Earth''s radius is about 6400 km and it turns once a day.'
      - '$a = \omega^2 R$ with $\omega = 2\pi/(1\ \text{day})$.'
    solution: |
      $\omega = \dfrac{2\pi}{86\,400\,\text{s}} \approx 7.3\times10^{-5}\,\text{rad/s}$, so $a = \omega^2 R \approx (7.3\times10^{-5})^2 \times 6.4\times10^6 \approx 0.034\,\text{m/s}^2$:
      about 0.3 % of $g$, which is why you weigh very slightly less at the equator.
    verify: "float(sqrt(sum(c**2 for c in diff(Matrix([6.37e6*cos(2*pi*t/86400), 6.37e6*sin(2*pi*t/86400)]), t, 2))).subs(t, 1000))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 3
