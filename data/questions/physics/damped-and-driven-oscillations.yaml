subject: physics
topic: damped-and-driven-oscillations
questions:
  - id: phys-damp-001
    difficulty: 1
    type: mc
    prompt: |
      A mass $m$ on a spring of stiffness $k$ moves through a fluid that exerts a drag force $-b\dot x$. For which
      damping is the motion **critically damped** (returning to equilibrium as fast as possible without oscillating)?
    options:
      - "$b^2 = 4mk$"
      - "$b = 0$"
      - "$b^2 < 4mk$"
      - "$b^2 > 4mk$"
    answer: 0
    hints:
      - "Try $x = e^{rt}$ in $m\\ddot x + b\\dot x + kx = 0$: $mr^2 + br + k = 0$."
      - "Critical damping is the boundary between complex roots (oscillation) and two distinct real roots."
    solution: |
      The characteristic equation $mr^2 + br + k = 0$ has discriminant $b^2 - 4mk$. If it is negative the roots are
      complex and the motion oscillates (underdamped); if positive, two real negative roots give a slow non-oscillating
      return (overdamped). Critical damping is the repeated root, $b^2 = 4mk$, where $x = (A + Bt)e^{-bt/2m}$.
    verify: "0 if len(roots(1*x**2 + 2*x + 1, x)) == 1 else 2"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 2

  - id: phys-damp-002
    difficulty: 1
    type: numeric
    prompt: |
      A {{m}} kg mass on a spring of stiffness {{k}} N/m is lightly damped by a drag force $-b\dot x$ with
      $b = {{b}}$ kg/s. It starts oscillating with amplitude {{A0}} m. What is the amplitude after {{tt}} s?
      Give your answer with units.
    params:
      m: { real: [0.5, 5], step: 0.5 }
      k: { int: [20, 200] }
      b: { real: [0.1, 2], step: 0.1 }
      A0: { real: [0.05, 0.3], step: 0.01 }
      tt: { int: [1, 20] }
    require: ["b^2 < 4 * m * k"]
    answer: "A0 * exp(-b * tt / (2 * m))"
    units: "m"
    tolerance: { rel: 0.01 }
    hints:
      - "An underdamped oscillator has $x(t) = A_0 e^{-bt/2m}\\cos(\\omega_d t + \\phi)$."
      - "The amplitude envelope decays as $e^{-bt/2m}$; the spring constant does not affect it."
    solution: |
      $$A(t) = A_0 e^{-bt/2m} = {{A0}}\,e^{-{{b}} \times {{tt}}/(2 \times {{m}})} \approx {{round(A0*exp(-b*tt/(2*m)), 5)}}\ \text{m}.$$
    verify: "A0*exp(re(solve(m*x**2 + b*x + k, x)[0])*tt)"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 2

  - id: phys-damp-003
    difficulty: 2
    type: numeric
    prompt: |
      A {{m}} kg mass on a spring of stiffness {{k}} N/m is damped by a force $-b\dot x$ with $b = {{b}}$ kg/s. At what
      angular frequency does it oscillate? Give your answer with units.
    params:
      m: { real: [0.5, 3], step: 0.5 }
      k: { int: [10, 100] }
      b: { real: [0.5, 6], step: 0.5 }
    require: ["b^2 < 4 * m * k"]
    answer: "sqrt(k / m - b^2 / (4 * m^2))"
    units: "rad/s"
    tolerance: { rel: 0.01 }
    hints:
      - "Substitute $x = e^{rt}$ into $m\\ddot x + b\\dot x + kx = 0$."
      - "The imaginary part of $r$ is the damped angular frequency $\\omega_d$."
    solution: |
      $r = -\dfrac{b}{2m} \pm i\sqrt{\dfrac{k}{m} - \dfrac{b^2}{4m^2}}$, so
      $$\omega_d = \sqrt{\omega_0^2 - \frac{b^2}{4m^2}} = \sqrt{ {{round(k/m, 4)}} - {{round(b^2/(4*m^2), 4)}} } \approx {{round(sqrt(k/m - b^2/(4*m^2)), 4)}}\ \text{rad/s},$$
      a little below the undamped $\omega_0 = \sqrt{k/m} \approx {{round(sqrt(k/m), 4)}}$ rad/s.
    verify: "abs(im(solve(m*x**2 + b*x + k, x)[0]))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 3

  - id: phys-damp-004
    difficulty: 2
    type: numeric
    prompt: |
      A {{m}} kg mass hangs on a spring of stiffness {{k}} N/m in a damper with drag force $-b\dot x$. What value of
      $b$ makes the motion critically damped? Give your answer with units.
    params:
      m: { real: [0.5, 5], step: 0.5 }
      k: { int: [10, 500] }
    answer: "2 * sqrt(m * k)"
    units: "kg/s"
    tolerance: { rel: 0.01 }
    hints:
      - "Critical damping: the characteristic equation $mr^2 + br + k = 0$ has a repeated root."
    solution: |
      A repeated root needs zero discriminant: $b^2 = 4mk$, so
      $b_c = 2\sqrt{mk} = 2\sqrt{ {{m}} \times {{k}} } \approx {{round(2*sqrt(m*k), 3)}}$ kg/s.
    verify: "max(solve(discriminant(m*x**2 + Symbol('bb')*x + k, x), Symbol('bb')))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 2

  - id: phys-damp-005
    difficulty: 2
    type: numeric
    prompt: |
      An oscillator has mass {{m}} kg, spring stiffness {{k}} N/m and damping coefficient $b = {{b}}$ kg/s. What is its
      quality factor $Q = \omega_0 m / b$? (A pure number.)
    params:
      m: { real: [0.5, 3], step: 0.5 }
      k: { int: [10, 200] }
      b: { real: [0.05, 1], step: 0.05 }
    answer: "sqrt(k / m) * m / b"
    tolerance: { rel: 0.01 }
    hints:
      - "$\\omega_0 = \\sqrt{k/m}$."
      - "$Q$ is roughly the number of radians of oscillation it takes for the energy to fall by a factor $e$."
    solution: |
      $\omega_0 = \sqrt{ {{k}}/{{m}} } \approx {{round(sqrt(k/m), 4)}}$ rad/s, so
      $$Q = \frac{\omega_0 m}{b} = \frac{\sqrt{mk}}{b} \approx {{round(sqrt(k*m)/b, 3)}}.$$
      It also equals $\omega_0/\Delta\omega$, where $\Delta\omega = b/m$ is the full width of the resonance curve at half power.
    verify: "(lambda ws: sqrt(k/m)/(max(ws) - min(ws)))([s for s in solve((k - m*Symbol('w')**2)**2 - b**2*Symbol('w')**2, Symbol('w')) if s > 0])"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 2

  - id: phys-damp-006
    difficulty: 3
    type: numeric
    prompt: |
      A {{m}} kg mass on a spring of stiffness {{k}} N/m, with damping coefficient {{b}} kg/s, is driven by a force
      ${{F0}}\cos({{w}}\,t)$ N. What is the amplitude of the steady-state motion? Give your answer with units.
    params:
      m: { real: [0.2, 2], step: 0.1 }
      k: { int: [10, 200] }
      b: { real: [0.2, 3], step: 0.1 }
      F0: { real: [0.5, 5], step: 0.5 }
      w: { real: [1, 30], step: 0.5 }
    answer: "F0 / sqrt((k - m * w^2)^2 + (b * w)^2)"
    units: "m"
    tolerance: { rel: 0.01 }
    hints:
      - "In the steady state, $x(t) = C\\cos\\omega t + D\\sin\\omega t$ at the driving frequency."
      - "Substitute and match the $\\cos$ and $\\sin$ terms: $(k - m\\omega^2)C + b\\omega D = F_0$ and $(k - m\\omega^2)D - b\\omega C = 0$."
    solution: |
      Solving for $C$ and $D$ and taking $A = \sqrt{C^2 + D^2}$:
      $$A = \frac{F_0}{\sqrt{(k - m\omega^2)^2 + (b\omega)^2}} = \frac{ {{F0}} }{\sqrt{({{round(k - m*w^2, 3)}})^2 + ({{round(b*w, 3)}})^2}} \approx {{round(F0/sqrt((k - m*w^2)^2 + (b*w)^2)*1000, 4)}}\ \text{mm}.$$
      Here $\omega_0 = \sqrt{k/m} \approx {{round(sqrt(k/m), 3)}}$ rad/s; the closer $\omega$ is to it, the larger the response.
    verify: "(lambda C, D: (lambda xx: (lambda s: sqrt(s[C]**2 + s[D]**2))(solve([(m*diff(xx, t, 2) + b*diff(xx, t) + k*xx - F0*cos(w*t)).subs(t, tv) for tv in (0, 0.37)], [C, D])))(C*cos(w*t) + D*sin(w*t)))(Symbol('C'), Symbol('D'))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 5

  - id: phys-damp-007
    difficulty: 3
    type: multipart
    prompt: |
      A {{m}} kg mass on a spring of stiffness {{k}} N/m, with damping coefficient {{b}} kg/s, is driven by a force
      $F_0\cos\omega t$ with $F_0 = {{F0}}$ N, exactly at its natural frequency $\omega_0 = \sqrt{k/m}$.
    params:
      m: { real: [0.2, 2], step: 0.1 }
      k: { int: [10, 200] }
      b: { real: [0.05, 1], step: 0.05 }
      F0: { real: [0.1, 2], step: 0.1 }
    parts:
      - prompt: "(a) What is the steady-state amplitude? Give it with units."
        type: numeric
        answer: "F0 / (b * sqrt(k / m))"
        units: "m"
        tolerance: { rel: 0.01 }
        verify: "(lambda C, D: (lambda xx: (lambda s: sqrt(s[C]**2 + s[D]**2))(solve([(m*diff(xx, t, 2) + b*diff(xx, t) + k*xx - F0*cos(sqrt(k/m)*t)).subs(t, tv) for tv in (0, 0.37)], [C, D])))(C*cos(sqrt(k/m)*t) + D*sin(sqrt(k/m)*t)))(Symbol('C'), Symbol('D'))"
      - prompt: "(b) Using your answer to (a), by what factor is it larger than the static stretch $F_0/k$ the same force would produce? (A pure number.)"
        type: numeric
        answer: "part1 / (F0 / k)"
        tolerance: { rel: 0.01 }
        verify: "sqrt(m*k)/b"
    hints:
      - "At $\\omega = \\omega_0$ the spring and inertia terms cancel: $k - m\\omega_0^2 = 0$."
      - "Only damping limits the amplitude: $A = F_0/(b\\omega_0)$."
    solution: |
      (a) With $k - m\omega_0^2 = 0$ the general amplitude reduces to
      $A = \dfrac{F_0}{b\omega_0} \approx \dfrac{ {{F0}} }{ {{b}} \times {{round(sqrt(k/m), 4)}} } \approx {{round(F0/(b*sqrt(k/m)), 5)}}$ m.

      (b) $\dfrac{A}{F_0/k} = \dfrac{k}{b\omega_0} = \dfrac{m\omega_0}{b} = Q \approx {{round(sqrt(m*k)/b, 3)}}$:
      at resonance the response is $Q$ times the static one.
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 5

  - id: phys-damp-008
    difficulty: 3
    type: numeric
    prompt: |
      A {{m}} kg mass on a spring oscillates with period {{T}} s. Its amplitude falls by a factor of {{ratio}} over
      {{N}} complete oscillations. Assuming a linear drag force $-b\dot x$, what is $b$? Give your answer with units.
    params:
      m: { real: [0.2, 2], step: 0.1 }
      T: { real: [0.5, 2], step: 0.1 }
      N: { int: [5, 30] }
      ratio: { real: [1.5, 5], step: 0.5 }
    answer: "2 * m * log(ratio) / (N * T)"
    units: "kg/s"
    tolerance: { rel: 0.01 }
    hints:
      - "The amplitude decays as $e^{-bt/2m}$."
      - "After $N$ oscillations, $t = NT$, and the amplitude has fallen to $1/{{ratio}}$ of its starting value."
    solution: |
      $$e^{-bNT/2m} = \frac{1}{ {{ratio}} } \Rightarrow b = \frac{2m\ln({{ratio}})}{NT} = \frac{2 \times {{m}} \times {{round(log(ratio), 4)}}}{ {{N}} \times {{T}} } \approx {{round(2*m*log(ratio)/(N*T), 5)}}\ \text{kg/s}.$$
      (Light damping barely shifts the period, so using the measured $T$ is fine.)
    verify: "nsolve(exp(-Symbol('bb')*N*T/(2*m)) - 1/ratio, Symbol('bb'), (1e-6, 100), solver='bisect')"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 4

  - id: phys-damp-009
    difficulty: 3
    type: proof
    prompt: |
      For the damped oscillator $m\ddot x + b\dot x + kx = 0$, show that the mechanical energy
      $E = \tfrac12 m\dot x^2 + \tfrac12 kx^2$ always decreases, at the rate $dE/dt = -b\dot x^2$.
    hints:
      - "Differentiate $E$ with respect to time using the chain rule."
      - "Then use the equation of motion to replace $m\\ddot x$."
    solution: |
      $$\frac{dE}{dt} = m\dot x\ddot x + kx\dot x = \dot x\,(m\ddot x + kx) = \dot x\,(-b\dot x) = -b\dot x^2 \le 0.$$
      The rate is the power delivered by the drag force, $F\dot x = (-b\dot x)\dot x$: energy leaves only through the
      damper, and it stops leaving only at the instants when the mass is at rest. $\blacksquare$
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 3

  - id: phys-damp-010
    difficulty: 3
    type: estimate
    prompt: |
      Car shock absorbers are designed to be close to critically damped. Estimate the damping coefficient $b$ of one
      shock absorber. Give a value with units.
    answer: "2 * 400 * 2 * pi * 1.5"
    units: "kg/s"
    factor: 2
    hints:
      - "Each wheel carries about a quarter of a 1600 kg loaded car."
      - "Car bodies bounce at about 1.5 Hz on their springs."
      - "Critical damping: $b = 2\\sqrt{mk} = 2m\\omega_0$."
    solution: |
      With $m \approx 400$ kg per wheel and $\omega_0 \approx 2\pi \times 1.5\ \text{Hz} \approx 9.4$ rad/s,
      $$b_c = 2m\omega_0 \approx 2 \times 400 \times 9.4 \approx 8 \times 10^3\ \text{kg/s}.$$
    verify: "max(solve(discriminant(400*x**2 + Symbol('bb')*x + 400*(2*pi*1.5)**2, x), Symbol('bb')))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 4

  - id: phys-damp-011
    difficulty: 4
    type: numeric
    prompt: |
      A {{m}} kg mass on a spring of stiffness {{k}} N/m, with damping coefficient {{b}} kg/s, is driven by a force
      ${{F0}}\cos({{w}}\,t)$ N. In the steady state the displacement lags behind the driving force by a phase angle
      $\delta$ (between 0° and 180°). Find $\delta$, with units.
    params:
      m: { real: [0.2, 2], step: 0.1 }
      k: { int: [10, 200] }
      b: { real: [0.2, 3], step: 0.1 }
      F0: { real: [0.5, 5], step: 0.5 }
      w: { real: [1, 30], step: 0.5 }
    answer: "atan2(b * w, k - m * w^2) * 180 / pi"
    units: "deg"
    tolerance: { rel: 0.01 }
    hints:
      - "Write $x = A\\cos(\\omega t - \\delta)$ and substitute into $m\\ddot x + b\\dot x + kx = F_0\\cos\\omega t$."
      - "$\\tan\\delta = \\dfrac{b\\omega}{k - m\\omega^2}$; take care with the quadrant when $\\omega > \\omega_0$."
    solution: |
      Matching coefficients gives $\cos\delta \propto k - m\omega^2 = {{round(k - m*w^2, 3)}}$ and
      $\sin\delta \propto b\omega = {{round(b*w, 3)}}$ (both over the same positive factor), so
      $$\delta = \operatorname{atan2}(b\omega,\ k - m\omega^2) \approx {{round(atan2(b*w, k - m*w^2)*180/pi, 2)}}°.$$
      Below resonance ($\omega < \omega_0 \approx {{round(sqrt(k/m), 3)}}$ rad/s) the lag is under 90°; at resonance it is
      exactly 90°; well above, it approaches 180°.
    verify: "(lambda C, D: (lambda xx: (lambda s: atan2(s[D], s[C])*180/pi)(solve([(m*diff(xx, t, 2) + b*diff(xx, t) + k*xx - F0*cos(w*t)).subs(t, tv) for tv in (0, 0.37)], [C, D])))(C*cos(w*t) + D*sin(w*t)))(Symbol('C'), Symbol('D'))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 6

  - id: phys-damp-012
    difficulty: 4
    type: numeric
    prompt: |
      A driven oscillator has mass {{m}} kg, spring stiffness {{k}} N/m and damping coefficient {{b}} kg/s. At what
      driving angular frequency is the steady-state amplitude largest? Give your answer with units.
    params:
      m: { real: [0.5, 3], step: 0.5 }
      k: { int: [10, 200] }
      b: { real: [0.5, 5], step: 0.5 }
    require: ["b^2 < 1.8 * m * k"]
    answer: "sqrt(k / m - b^2 / (2 * m^2))"
    units: "rad/s"
    tolerance: { rel: 0.01 }
    hints:
      - "$A(\\omega) = F_0/\\sqrt{(k - m\\omega^2)^2 + (b\\omega)^2}$ is largest where the expression under the root is smallest."
      - "Differentiate $(k - m\\omega^2)^2 + b^2\\omega^2$ with respect to $\\omega$ (or $\\omega^2$) and set it to zero."
    solution: |
      Let $u = \omega^2$ and minimise $f(u) = (k - mu)^2 + b^2u$:
      $f'(u) = -2m(k - mu) + b^2 = 0 \Rightarrow u = \dfrac{k}{m} - \dfrac{b^2}{2m^2}$. So
      $$\omega_{\text{peak}} = \sqrt{\frac{k}{m} - \frac{b^2}{2m^2}} \approx {{round(sqrt(k/m - b^2/(2*m^2)), 4)}}\ \text{rad/s},$$
      slightly below both $\omega_0 \approx {{round(sqrt(k/m), 4)}}$ and the free damped frequency $\omega_d \approx {{round(sqrt(k/m - b^2/(4*m^2)), 4)}}$ rad/s.
    verify: "[s for s in solve(diff((k - m*Symbol('w')**2)**2 + b**2*Symbol('w')**2, Symbol('w')), Symbol('w')) if s > 0][0]"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 6

  - id: phys-damp-013
    difficulty: 5
    type: numeric
    prompt: |
      A {{m}} kg mass on a spring of stiffness {{k}} N/m, with damping coefficient {{b}} kg/s, is driven by a force
      ${{F0}}\cos({{w}}\,t)$ N. In the steady state, what average power does the driving force deliver? Give your answer
      with units.
    params:
      m: { real: [0.2, 2], step: 0.1 }
      k: { int: [10, 200] }
      b: { real: [0.2, 3], step: 0.1 }
      F0: { real: [0.5, 5], step: 0.5 }
      w: { real: [1, 30], step: 0.5 }
    answer: "F0^2 * b * w^2 / (2 * ((k - m * w^2)^2 + (b * w)^2))"
    units: "W"
    tolerance: { rel: 0.01 }
    hints:
      - "$P(t) = F(t)\\,\\dot x(t)$; only the part of $\\dot x$ in phase with $F$ survives the average."
      - "In the steady state the average input equals the average loss in the damper, $\\langle b\\dot x^2\\rangle = \\tfrac12 b\\omega^2 A^2$."
    solution: |
      In the steady state $x = A\cos(\omega t - \delta)$ with $A = F_0/\sqrt{(k - m\omega^2)^2 + (b\omega)^2}$. Energy put in
      per cycle equals energy dissipated, so
      $$\langle P\rangle = \langle b\dot x^2\rangle = \tfrac12 b\omega^2A^2 = \frac{F_0^2\,b\,\omega^2}{2\big[(k - m\omega^2)^2 + (b\omega)^2\big]} \approx {{round(F0^2*b*w^2/(2*((k - m*w^2)^2 + (b*w)^2))*1000, 4)}}\ \text{mW}.$$
      At resonance this peaks at $F_0^2/(2b)$, here ${{round(F0^2/(2*b), 4)}}$ W.
    verify: "(lambda C, D: (lambda xx: (lambda s: float(np.mean([float(F0*math.cos(w*tv)*(diff(xx, t).subs({C: s[C], D: s[D]})).subs(t, tv)) for tv in np.linspace(0, 2*math.pi/w, 64, endpoint=False)])))(solve([(m*diff(xx, t, 2) + b*diff(xx, t) + k*xx - F0*cos(w*t)).subs(t, tv) for tv in (0, 0.37)], [C, D])))(C*cos(w*t) + D*sin(w*t)))(Symbol('C'), Symbol('D'))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 8
