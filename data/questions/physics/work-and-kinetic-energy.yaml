subject: physics
topic: work-and-kinetic-energy
questions:
  - id: phys-work-001
    difficulty: 1
    type: numeric
    prompt: |
      A cyclist and bicycle have a combined mass of {{m}} kg and move at {{v}} m/s. What is their kinetic energy? Give a value with units.
    params:
      m: { int: [60, 110] }
      v: { real: [2, 15], step: 0.5 }
    answer: "m * v^2 / 2"
    units: "J"
    tolerance: { rel: 0.01 }
    hints:
      - '$K = \tfrac12 mv^2$.'
    solution: |
      $K = \tfrac12 mv^2 = \tfrac12 \times {{m}} \times {{v}}^2 \approx {{m*v^2/2}}\,\text{J}$.
    verify: "integrate(m*Symbol('u'), (Symbol('u'), 0, v))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 1

  - id: phys-work-002
    difficulty: 1
    type: numeric
    prompt: |
      You pull a suitcase {{d}} m along level ground with a constant force of {{F}} N directed {{th}}° above the horizontal. How much work does your force do? Give a value with units.
    params:
      F: { int: [10, 200] }
      d: { real: [1, 20], step: 0.5 }
      th: { int: [0, 75] }
    answer: "F * d * cos(th * pi / 180)"
    units: "J"
    tolerance: { rel: 0.01 }
    hints:
      - 'Only the component of the force along the displacement does work.'
      - '$W = Fd\cos\theta$.'
    solution: |
      $W = \vec F \cdot \Delta\vec r = Fd\cos\theta = {{F}} \times {{d}} \times \cos{{th}}^\circ \approx {{F*d*cos(th*pi/180)}}\,\text{J}$.
    verify: "Matrix([F*math.cos(math.radians(th)), F*math.sin(math.radians(th))]).dot(Matrix([d, 0]))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 2

  - id: phys-work-003
    difficulty: 1
    type: mc
    prompt: |
      You push a box horizontally across a rough, level floor. Which of these forces on the box does **no** work?
    options:
      - 'The normal force from the floor'
      - 'Kinetic friction from the floor'
      - 'Your horizontal push'
      - 'None of them: every force on a moving box does work'
    answer: 0
    hints:
      - '$W = \vec F \cdot \Delta\vec r$: a force does no work if it is perpendicular to the displacement.'
      - 'Which way does each force point, compared with the horizontal motion?'
    solution: |
      The displacement is horizontal. The normal force is vertical, perpendicular to it, so $W_N = N\,d\cos 90^\circ = 0$ (gravity, also vertical, does none either).
      Your push does positive work (along the motion) and friction does negative work (against it).
    verify: "(lambda d, fs: [abs(f.dot(d)) < 1e-12 for f in fs].index(True))(Matrix([2, 0]), [Matrix([0, 19.6]), Matrix([-5, 0]), Matrix([8, 0])])"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 1

  - id: phys-work-004
    difficulty: 2
    type: numeric
    prompt: |
      A {{m}} kg box starts at rest on a level floor and is pulled {{d}} m by a horizontal force of {{F}} N. The coefficient of kinetic friction is {{mu}}. Using the work–energy theorem with $g = 9.8\,\text{m/s}^2$, find the box's final speed. Give a value with units.
    params:
      m: { int: [5, 40] }
      d: { real: [1, 10], step: 0.5 }
      F: { int: [20, 200] }
      mu: { real: [0.1, 0.5], step: 0.05 }
    let:
      g: 9.8
      Wnet: "(F - mu * m * g) * d"
    require: ["F > mu * m * g + 5"]
    answer: "sqrt(2 * Wnet / m)"
    units: "m/s"
    tolerance: { rel: 0.01 }
    hints:
      - 'Add up the work done by every force: the pull, friction, and (zero) from gravity and the normal force.'
      - 'Net work $= (F - \mu_k mg)d = \tfrac12 mv^2 - 0$.'
    solution: |
      Work by the pull: ${{F}} \times {{d}} = {{F*d}}\,\text{J}$. Work by friction: $-\mu_k mg\,d = -{{mu*m*g*d}}\,\text{J}$. The normal force and gravity do none.
      $W_\text{net} = {{Wnet}}\,\text{J} = \tfrac12 mv^2$, so $v = \sqrt{2W_\text{net}/m} = \sqrt{2 \times {{Wnet}}/{{m}}} \approx {{sqrt(2*Wnet/m)}}\,\text{m/s}$.
    verify: "max(solve(Eq(m*Symbol('u')**2/2, integrate(F - mu*m*9.8, (x, 0, d))), Symbol('u')))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 4

  - id: phys-work-005
    difficulty: 2
    type: numeric
    prompt: |
      A {{m}} kg crate slides {{L}} m down a ramp inclined at {{th}}°. How much work does gravity do on it? Take $g = 9.8\,\text{m/s}^2$ and give a value with units.
    params:
      m: { int: [2, 50] }
      L: { real: [1, 10], step: 0.5 }
      th: { int: [10, 60] }
    let:
      g: 9.8
    answer: "m * g * L * sin(th * pi / 180)"
    units: "J"
    tolerance: { rel: 0.01 }
    hints:
      - 'Gravity is vertical; only the vertical drop matters.'
      - 'The crate drops a height $L\sin\theta$.'
    solution: |
      The crate descends $h = L\sin\theta = {{L}}\sin{{th}}^\circ \approx {{L*sin(th*pi/180)}}\,\text{m}$, so
      $W_g = mgh \approx {{m}} \times 9.8 \times {{L*sin(th*pi/180)}} \approx {{m*g*L*sin(th*pi/180)}}\,\text{J}$ (positive: gravity points partly along the motion).
      Equivalently $W = (mg)(L)\cos(90^\circ - \theta)$.
    verify: "Matrix([0, -m*9.8]).dot(Matrix([L*math.cos(math.radians(th)), -L*math.sin(math.radians(th))]))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 2

  - id: phys-work-006
    difficulty: 2
    type: numeric
    prompt: |
      A spring with spring constant {{k}} N/m is already stretched {{x1}} cm from its natural length. How much work must you do to stretch it further, to {{x2}} cm? Give a value with units.
    params:
      k: { int: [50, 800] }
      x1: { int: [1, 10] }
      x2: { int: [5, 30] }
    require: ["x2 > x1 + 1"]
    let:
      a: "x1 / 100"
      b: "x2 / 100"
    answer: "k * (b^2 - a^2) / 2"
    units: "J"
    tolerance: { rel: 0.01 }
    hints:
      - 'The force you need grows with the stretch: $F = kx$. Work is the area under $F(x)$.'
      - '$W = \int_{x_1}^{x_2} kx\,dx = \tfrac12 k(x_2^2 - x_1^2)$, with $x$ in metres.'
    solution: |
      In metres, $x_1 = {{a}}$ and $x_2 = {{b}}$. The work is the area under $F = kx$:
      $$W = \int_{x_1}^{x_2} kx\,dx = \tfrac12 k\left(x_2^2 - x_1^2\right) = \tfrac12 \times {{k}} \times \left({{b}}^2 - {{a}}^2\right) \approx {{k*(b^2 - a^2)/2}}\,\text{J}.$$
      Not $\tfrac12 k(x_2 - x_1)^2$: the extra stretch starts where the force is already {{k*a}} N.
    verify: "integrate(k*x, (x, Rational(x1, 100), Rational(x2, 100)))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 3

  - id: phys-work-007
    difficulty: 3
    type: numeric
    prompt: |
      A force along the $x$ axis varies with position as $F(x) = {{a}}x^2 + {{b}}$ (newtons, with $x$ in metres). How much work does it do on an object that moves from $x = 0$ to $x = {{X}}\,\text{m}$? Give a value with units.
    params:
      a: { int: [1, 6] }
      b: { int: [1, 20] }
      X: { real: [0.5, 4], step: 0.5 }
    answer: "a * X^3 / 3 + b * X"
    units: "J"
    tolerance: { rel: 0.01 }
    hints:
      - 'For a varying force, $W = \int F\,dx$.'
      - 'Integrate term by term from $0$ to {{X}}.'
    solution: |
      $$W = \int_0^{ {{X}} } \left({{a}}x^2 + {{b}}\right)dx = \left[\frac{ {{a}} }{3}x^3 + {{b}}x\right]_0^{ {{X}} } = \frac{ {{a}} }{3}({{X}})^3 + {{b}}({{X}}) \approx {{a*X^3/3 + b*X}}\,\text{J}.$$
    verify: "integrate(a*x**2 + b, (x, 0, X))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 3

  - id: phys-work-008
    difficulty: 3
    type: multipart
    prompt: |
      A toy launcher has a spring with $k = {{k}}\,\text{N/m}$, compressed by {{xc}} cm. When released, it pushes a ball of mass {{m}} g along a frictionless horizontal track.
    params:
      k: { int: [100, 1000] }
      xc: { int: [2, 10] }
      m: { int: [10, 200] }
    let:
      W: "k * (xc / 100)^2 / 2"
    parts:
      - prompt: "(a) How much work does the spring do on the ball as it returns to its natural length? Give a value with units."
        type: numeric
        answer: W
        units: "J"
        tolerance: { rel: 0.01 }
        verify: "integrate(k*x, (x, 0, Rational(xc, 100)))"
      - prompt: "(b) Using your answer to (a), how fast is the ball moving when it leaves the spring?"
        type: numeric
        answer: "sqrt(2 * part1 / (m / 1000))"
        units: "m/s"
        tolerance: { rel: 0.01 }
        verify: "max(solve(Eq(Rational(m, 1000)*Symbol('u')**2/2, integrate(k*x, (x, 0, Rational(xc, 100)))), Symbol('u')))"
    hints:
      - 'The spring force is $kx$; the work it does as $x$ goes from {{xc/100}} m to 0 is the area under $kx$.'
      - 'Work–energy theorem: $W = \tfrac12 mv^2$. Convert grams to kilograms.'
    solution: |
      (a) $W = \int_0^{x_c} kx\,dx = \tfrac12 kx_c^2 = \tfrac12 \times {{k}} \times ({{xc/100}})^2 \approx {{W}}\,\text{J}$.

      (b) $\tfrac12 mv^2 = W$ with $m = {{m/1000}}\,\text{kg}$: $v = \sqrt{\dfrac{2W}{m}} \approx \sqrt{\dfrac{2 \times {{W}}}{ {{m/1000}} }} \approx {{sqrt(2*W/(m/1000))}}\,\text{m/s}$.
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 4

  - id: phys-work-009
    difficulty: 3
    type: numeric
    prompt: |
      A {{m}} kg car accelerates from rest to {{v}} km/h in {{tt}} s on a level road. Ignoring friction and air resistance, what average power does the engine deliver? Give a value with units.
    params:
      m: { int: [900, 2000] }
      v: { int: [50, 120] }
      tt: { real: [4, 15], step: 0.5 }
    let:
      vms: "v / 3.6"
      K: "m * vms^2 / 2"
    answer: "K / tt / 1000"
    units: "kW"
    tolerance: { rel: 0.01 }
    hints:
      - 'Average power is work done divided by time.'
      - 'By the work–energy theorem, the work is the gain in kinetic energy.'
    solution: |
      $v = {{v}}/3.6 \approx {{vms}}\,\text{m/s}$, so the work done is $\Delta K = \tfrac12 mv^2 \approx {{K}}\,\text{J}$.
      $\bar P = \dfrac{\Delta K}{t} \approx \dfrac{ {{K}} }{ {{tt}} } \approx {{K/tt}}\,\text{W} \approx {{K/tt/1000}}\,\text{kW}$.
    verify: "solve(Eq(integrate(Symbol('P'), (t, 0, tt)), m*(v/3.6)**2/2), Symbol('P'))[0]/1000"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 3

  - id: phys-work-010
    difficulty: 4
    type: numeric
    prompt: |
      A force $\vec F = \left({{c}}\,y,\ {{c}}\,x\right)$ N (with $x, y$ in metres) acts on a bead that moves along the parabola $y = \dfrac{ {{b}} }{ {{a^2}} }x^2$ from $(0, 0)$ to $({{a}}, {{b}})$. How much work does $\vec F$ do? Give a value with units.
    params:
      c: { int: [2, 5] }
      a: { int: [1, 4] }
      b: { int: [1, 4] }
    answer: "c * a * b"
    units: "J"
    tolerance: { rel: 0.01 }
    hints:
      - 'Parametrise the path by $x$: $y = kx^2$ with $k = {{b}}/{{a^2}}$, so $dy = 2kx\,dx$.'
      - '$W = \int (F_x\,dx + F_y\,dy)$.'
      - 'Or notice that $\vec F = \nabla({{c}}xy)$.'
    solution: |
      With $k = {{b}}/{{a^2}}$, $y = kx^2$ and $dy = 2kx\,dx$:
      $$W = \int_0^{ {{a}} } \left({{c}}kx^2 + {{c}}x \cdot 2kx\right)dx = {{3*c}}k\int_0^{ {{a}} } x^2\,dx = {{c}}k\,({{a}})^3 = {{c*a*b}}\,\text{J}.$$
      Faster: $\vec F = \nabla({{c}}xy)$ is conservative, so $W = {{c}}xy\big|_{(0,0)}^{({{a}},{{b}})} = {{c}} \times {{a}} \times {{b}} = {{c*a*b}}\,\text{J}$, for any path between the two points.
    verify: "(lambda u: integrate(c*(Rational(b)/a**2)*u**2 + c*u*diff(Rational(b)/a**2*u**2, u), (u, 0, a)))(Symbol('u'))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 6

  - id: phys-work-011
    difficulty: 4
    type: numeric
    prompt: |
      A {{m}} kg car drives up a straight {{th}}° slope at a constant {{v}} m/s. Air resistance and rolling friction together exert {{Fd}} N against the motion. With $g = 9.8\,\text{m/s}^2$, what power must the engine deliver to the wheels? Give a value with units.
    params:
      m: { int: [1000, 2000] }
      th: { real: [2, 10], step: 0.5 }
      v: { int: [10, 30] }
      Fd: { int: [200, 800] }
    let:
      g: 9.8
      Fneed: "m * g * sin(th * pi / 180) + Fd"
    answer: "Fneed * v / 1000"
    units: "kW"
    tolerance: { rel: 0.01 }
    hints:
      - 'At constant speed the net force is zero: the driving force balances the downhill component of gravity plus the resistance.'
      - 'Power of a constant force along the velocity: $P = Fv$.'
    solution: |
      Driving force $= mg\sin\theta + F_d = {{m*g*sin(th*pi/180)}} + {{Fd}} \approx {{Fneed}}\,\text{N}$.
      $P = Fv \approx {{Fneed}} \times {{v}} \approx {{Fneed*v}}\,\text{W} \approx {{Fneed*v/1000}}\,\text{kW}$.
      Going uphill, most of that power goes into gravitational potential energy.
    verify: "(lambda dirn: (Matrix([0, m*9.8]).dot(dirn)*v + Fd*v)/1000)(Matrix([math.cos(math.radians(th)), math.sin(math.radians(th))]))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 5

  - id: phys-work-012
    difficulty: 4
    type: proof
    prompt: |
      A particle of mass $m$ moves along the $x$ axis under a net force $F(x)$. Using Newton's second law, prove the work–energy theorem: $\displaystyle\int_{x_1}^{x_2} F\,dx = \tfrac12 mv_2^2 - \tfrac12 mv_1^2$.
    hints:
      - 'Write $F = m\,\dfrac{dv}{dt}$ and use the chain rule to change variables from $t$ to $x$.'
      - '$\dfrac{dv}{dt} = \dfrac{dv}{dx}\dfrac{dx}{dt} = v\,\dfrac{dv}{dx}$.'
    solution: |
      By Newton's second law and the chain rule,
      $$F = m\frac{dv}{dt} = m\frac{dv}{dx}\frac{dx}{dt} = mv\frac{dv}{dx} = \frac{d}{dx}\left(\tfrac12 mv^2\right).$$
      Integrating both sides from $x_1$ to $x_2$ (where the speeds are $v_1$ and $v_2$):
      $$\int_{x_1}^{x_2} F\,dx = \Big[\tfrac12 mv^2\Big]_{x_1}^{x_2} = \tfrac12 mv_2^2 - \tfrac12 mv_1^2.$$
      The net work equals the change in kinetic energy.
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 5

  - id: phys-work-013
    difficulty: 5
    type: numeric
    prompt: |
      A block slides on a level frictionless track. A rope tied to it runs up to a small pulley {{h}} m above the track, and you pull the rope's other end with a constant tension of {{Ft}} N. The block moves from a horizontal distance of {{x1}} m from the point below the pulley to {{x2}} m from it. How much work does the tension do on the block? Give a value with units.
    params:
      h: { real: [0.5, 3], step: 0.5 }
      Ft: { int: [10, 100] }
      x1: { real: [3, 8], step: 0.5 }
      x2: { real: [0.5, 2.5], step: 0.5 }
    let:
      l1: "sqrt(x1^2 + h^2)"
      l2: "sqrt(x2^2 + h^2)"
    answer: "Ft * (l1 - l2)"
    units: "J"
    tolerance: { rel: 0.01 }
    hints:
      - 'The tension is constant in size but its direction changes as the block moves, so $W \neq F\,\Delta x$.'
      - 'The horizontal component of the tension at distance $x$ is $F\,x/\sqrt{x^2 + h^2}$.'
      - 'Integrate it, or note that the work equals the tension times the length of rope pulled through the pulley.'
    solution: |
      At horizontal distance $x$ from below the pulley the rope makes an angle with the track such that the horizontal component of the tension is $F\dfrac{x}{\sqrt{x^2 + h^2}}$. So
      $$W = \int_{x_2}^{x_1} \frac{Fx}{\sqrt{x^2 + h^2}}\,dx = F\left[\sqrt{x^2 + h^2}\right]_{x_2}^{x_1} = F\left(\sqrt{x_1^2 + h^2} - \sqrt{x_2^2 + h^2}\right).$$
      Numerically: ${{Ft}}\,({{l1}} - {{l2}}) \approx {{Ft*(l1 - l2)}}\,\text{J}$.
      That is the tension times the length of rope you pulled through the pulley, which is how the work you do at your end reaches the block.
    verify: "integrate(Ft*x/sqrt(x**2 + h**2), (x, x2, x1))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 8

  - id: phys-work-014
    difficulty: 2
    type: estimate
    prompt: |
      Estimate the kinetic energy of a family car travelling at motorway speed. Give a value with units.
    answer: "1500 * 30^2 / 2"
    units: "J"
    factor: 3
    hints:
      - 'A family car has a mass of about 1.5 tonnes.'
      - 'Motorway speed is about 110 km/h, roughly 30 m/s.'
    solution: |
      $K = \tfrac12 mv^2 \approx \tfrac12 \times 1500 \times 30^2 \approx 7\times10^5\,\text{J}$: enough to lift the car about 45 m, which is the energy the brakes must turn into heat to stop it.
    verify: "integrate(1500*Symbol('u'), (Symbol('u'), 0, 30))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 2
