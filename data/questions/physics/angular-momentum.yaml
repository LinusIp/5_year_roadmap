subject: physics
topic: angular-momentum
questions:
  - id: phys-angmom-001
    difficulty: 1
    type: numeric
    prompt: |
      A uniform disc of mass {{M}} kg and radius {{R}} m spins at {{w}} rad/s about its central axis. What is the
      magnitude of its angular momentum? Give your answer with units.
    params:
      M: { real: [0.5, 5], step: 0.5 }
      R: { real: [0.1, 0.5], step: 0.05 }
      w: { int: [5, 60] }
    answer: "0.5 * M * R^2 * w"
    units: "kg m^2/s"
    tolerance: { rel: 0.01 }
    hints:
      - "For rotation about a fixed symmetry axis, $L = I\\omega$."
      - "A uniform disc has $I = \\tfrac12 MR^2$ about its central axis."
    solution: |
      $$L = I\omega = \tfrac12 MR^2\omega = \tfrac12 \times {{M}} \times {{R}}^2 \times {{w}} \approx {{round(0.5*M*R^2*w, 4)}}\ \text{kg·m}^2/\text{s}.$$
    verify: "integrate(2*pi*Symbol('rho')**3*M/(pi*R**2), (Symbol('rho'), 0, R))*w"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 2

  - id: phys-angmom-002
    difficulty: 1
    type: mc
    prompt: |
      A figure skater spinning on frictionless ice pulls her arms in, halving her moment of inertia. What happens to
      her angular velocity and her rotational kinetic energy?
    options:
      - "Angular velocity doubles; kinetic energy doubles"
      - "Angular velocity doubles; kinetic energy stays the same"
      - "Angular velocity stays the same; kinetic energy halves"
      - "Angular velocity doubles; kinetic energy halves"
    answer: 0
    hints:
      - "There is no external torque about the spin axis, so $L = I\\omega$ is conserved."
      - "Write the kinetic energy as $K = L^2/(2I)$."
    solution: |
      $L = I\omega$ is conserved, so halving $I$ doubles $\omega$. The kinetic energy $K = \tfrac12 I\omega^2 = L^2/(2I)$
      then doubles. The extra energy is the work her muscles do pulling her arms inwards against the centrifugal
      tendency.
    verify: "0 if (0.5*2*(4*3/2)**2 > 0.5*4*3**2) and abs(0.5*2*(4*3/2)**2 / (0.5*4*3**2) - 2) < 1e-12 else 1"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 2

  - id: phys-angmom-003
    difficulty: 2
    type: numeric
    prompt: |
      A skater spins at {{w1}} rad/s with her arms out, where her moment of inertia is {{I1}} kg·m². She pulls her
      arms in, reducing it to {{I2}} kg·m². What is her new angular velocity? Give your answer with units.
    params:
      I1: { real: [3, 6], step: 0.5 }
      I2: { real: [1, 2.5], step: 0.1 }
      w1: { real: [1, 4], step: 0.5 }
    answer: "I1 * w1 / I2"
    units: "rad/s"
    tolerance: { rel: 0.01 }
    hints:
      - "No external torque acts about the vertical axis. Which quantity is conserved?"
    solution: |
      Angular momentum is conserved: $I_1\omega_1 = I_2\omega_2$, so
      $$\omega_2 = \frac{I_1}{I_2}\omega_1 = \frac{ {{I1}} }{ {{I2}} } \times {{w1}} \approx {{round(I1*w1/I2, 3)}}\ \text{rad/s}.$$
    verify: "solve(Eq(I1*w1, I2*Symbol('w2')), Symbol('w2'))[0]"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 2

  - id: phys-angmom-004
    difficulty: 2
    type: vector
    prompt: |
      A {{m}} kg particle is at position $\mathbf{r} = ({{x}}, {{y}}, 0)$ m and moves with velocity
      $\mathbf{v} = ({{vx}}, {{vy}}, 0)$ m/s. Find its angular momentum about the origin, in kg·m²/s. Enter the three
      components as `Lx, Ly, Lz`.
    params:
      m: { int: [1, 5] }
      x: { int: [-4, 4] }
      y: { int: [-4, 4] }
      vx: { int: [-5, 5] }
      vy: { int: [-5, 5] }
    require: ["x * vy - y * vx != 0"]
    answer: "[0, 0, m * (x * vy - y * vx)]"
    tolerance: { abs: 0.01 }
    hints:
      - "$\\mathbf{L} = \\mathbf{r} \\times \\mathbf{p}$ with $\\mathbf{p} = m\\mathbf{v}$."
      - "Both vectors lie in the $xy$-plane, so only the $z$-component survives: $L_z = m(x v_y - y v_x)$."
    solution: |
      $$\mathbf{L} = m\,\mathbf{r}\times\mathbf{v} = {{m}}\begin{vmatrix}\hat{\mathbf{x}} & \hat{\mathbf{y}} & \hat{\mathbf{z}} \\ {{x}} & {{y}} & 0 \\ {{vx}} & {{vy}} & 0\end{vmatrix}
      = {{m}}\big[({{x}})({{vy}}) - ({{y}})({{vx}})\big]\hat{\mathbf{z}} = {{m*(x*vy - y*vx)}}\,\hat{\mathbf{z}}\ \text{kg·m}^2/\text{s}.$$
      So $\mathbf{L} = (0, 0, {{m*(x*vy - y*vx)}})$.
    verify: "list(Matrix([x, y, 0]).cross(m*Matrix([vx, vy, 0])))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 3

  - id: phys-angmom-005
    difficulty: 2
    type: numeric
    prompt: |
      A {{m}} kg car drives at a steady {{v}} m/s along a straight road. You stand {{d}} m from the road (measured
      perpendicular to it). What is the magnitude of the car's angular momentum about you, treating the car as a
      point? Give your answer with units.
    params:
      m: { int: [800, 2000] }
      v: { int: [10, 30] }
      d: { int: [5, 50] }
    answer: "m * v * d"
    units: "kg m^2/s"
    tolerance: { rel: 0.01 }
    hints:
      - "$|\\mathbf{L}| = |\\mathbf{r}\\times\\mathbf{p}| = p\\,r\\sin\\phi$."
      - "$r\\sin\\phi$ is the perpendicular distance from you to the line of motion, the same wherever the car is."
    solution: |
      $|\mathbf{r} \times \mathbf{p}| = mv\,(r\sin\phi) = mvd$, because $r\sin\phi$ is the perpendicular distance
      from the line of motion. So $L = {{m}} \times {{v}} \times {{d}} = {{m*v*d}}\ \text{kg·m}^2/\text{s}$, constant
      as the car passes: a particle moving in a straight line at constant speed has constant angular momentum about
      any fixed point.
    verify: "float(np.linalg.norm(np.cross([7.3, d, 0], [m*v, 0, 0])))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 2

  - id: phys-angmom-006
    difficulty: 2
    type: numeric
    prompt: |
      A comet orbits the Sun. At perihelion it is ${{rp}} \times 10^{11}$ m from the Sun and moves at
      {{round(vp, 2)}} km/s. At aphelion it is ${{ra}} \times 10^{11}$ m away. How fast is it moving at aphelion?
      Give your answer with units.
    params:
      rp: { real: [0.5, 1.5], step: 0.1 }
      ra: { int: [3, 30] }
    let:
      vp: "sqrt(2 * 6.674e-11 * 1.989e30 * ra / (rp * (rp + ra) * 1e11)) / 1000"
    answer: "vp * rp / ra"
    units: "km/s"
    tolerance: { rel: 0.01 }
    hints:
      - "Gravity points at the Sun, so it exerts no torque about the Sun."
      - "At perihelion and aphelion the velocity is perpendicular to the radius, so $L = mvr$ there."
    solution: |
      The gravitational force is central, so the comet's angular momentum about the Sun is conserved. At both
      extreme points $\mathbf{v} \perp \mathbf{r}$, so $m v_p r_p = m v_a r_a$:
      $$v_a = v_p\frac{r_p}{r_a} = {{round(vp, 2)}} \times \frac{ {{rp}} }{ {{ra}} } \approx {{round(vp*rp/ra, 3)}}\ \text{km/s}.$$
    verify: "max(solve(Eq(Rational(1, 2)*Symbol('va')**2 - 6.674e-11*1.989e30/(ra*1e11), Rational(1, 2)*(2*6.674e-11*1.989e30*ra/(rp*(rp + ra)*1e11)) - 6.674e-11*1.989e30/(rp*1e11)), Symbol('va'))) / 1000"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 3

  - id: phys-angmom-007
    difficulty: 2
    type: estimate
    prompt: |
      Estimate the angular momentum of the Earth's daily spin about its axis, treating the Earth as a uniform sphere.
      Give a value with units.
    answer: "0.4 * 5.97e24 * (6.37e6)^2 * 2 * pi / 86164"
    units: "kg m^2/s"
    factor: 3
    hints:
      - "$M \\approx 6 \\times 10^{24}$ kg, $R \\approx 6.4 \\times 10^6$ m, and $I = \\tfrac25 MR^2$ for a uniform sphere."
      - "One turn a day: $\\omega = 2\\pi/(1\\ \\text{day}) \\approx 7 \\times 10^{-5}$ rad/s."
    solution: |
      $I \approx \tfrac25 (6 \times 10^{24})(6.4 \times 10^6)^2 \approx 1 \times 10^{38}\ \text{kg·m}^2$ and
      $\omega \approx 2\pi/86\,164\ \text{s} \approx 7.3 \times 10^{-5}$ rad/s, so
      $$L = I\omega \approx 7 \times 10^{33}\ \text{kg·m}^2/\text{s}.$$
      (With the real, centrally condensed Earth, $I \approx 0.33MR^2$ and $L \approx 6 \times 10^{33}$.)
    verify: "2*pi*integrate(integrate(3*5.97e24/(4*pi*6.37e6**3)*Symbol('rr')**4*sin(Symbol('th'))**3, (Symbol('rr'), 0, 6.37e6)), (Symbol('th'), 0, pi)) * 2*pi/86164"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 3

  - id: phys-angmom-008
    difficulty: 3
    type: multipart
    prompt: |
      A flywheel with moment of inertia {{I1}} kg·m² spins at {{w1}} rad/s on a frictionless axle. A second, initially
      stationary flywheel with moment of inertia {{I2}} kg·m² is dropped onto it, on the same axle. Friction between
      them soon makes them turn together.
    params:
      I1: { real: [0.1, 1], step: 0.05 }
      I2: { real: [0.1, 1], step: 0.05 }
      w1: { int: [5, 40] }
    parts:
      - prompt: "(a) What is their common angular velocity? Give it with units."
        type: numeric
        answer: "I1 * w1 / (I1 + I2)"
        units: "rad/s"
        tolerance: { rel: 0.01 }
        verify: "solve(Eq(I1*w1, (I1 + I2)*Symbol('wf')), Symbol('wf'))[0]"
      - prompt: "(b) Using your answer to (a), how much kinetic energy is lost to friction? Give it with units."
        type: numeric
        answer: "0.5 * I1 * w1^2 - 0.5 * (I1 + I2) * part1^2"
        units: "J"
        tolerance: { rel: 0.01 }
        verify: "Rational(1, 2)*I1*I2/(I1 + I2)*w1**2"
    hints:
      - "The friction between the flywheels is internal to the pair; no external torque acts about the axle."
      - "This is a rotational perfectly inelastic collision: angular momentum is conserved, kinetic energy is not."
    solution: |
      (a) $I_1\omega_1 = (I_1 + I_2)\omega_f$, so
      $\omega_f = \dfrac{ {{I1}} \times {{w1}} }{ {{I1 + I2}} } \approx {{round(I1*w1/(I1 + I2), 3)}}\ \text{rad/s}$.

      (b) $K_i = \tfrac12 I_1\omega_1^2 \approx {{round(0.5*I1*w1^2, 3)}}$ J and
      $K_f = \tfrac12(I_1 + I_2)\omega_f^2 \approx {{round(0.5*(I1 + I2)*(I1*w1/(I1 + I2))^2, 3)}}$ J, so
      $\Delta K \approx {{round(0.5*I1*w1^2 - 0.5*(I1 + I2)*(I1*w1/(I1 + I2))^2, 3)}}$ J is lost.
      (In general $\Delta K = \tfrac12 \frac{I_1 I_2}{I_1 + I_2}\omega_1^2$.)
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 5

  - id: phys-angmom-009
    difficulty: 3
    type: numeric
    prompt: |
      A playground roundabout is a uniform disc of mass {{M}} kg and radius {{R}} m, turning freely at {{w1}} rad/s.
      A {{m}} kg child standing at its rim walks to the centre. What is the roundabout's angular velocity when the
      child reaches the centre? Treat the child as a point. Give your answer with units.
    params:
      M: { int: [100, 300] }
      R: { real: [1.5, 3], step: 0.5 }
      m: { int: [20, 50] }
      w1: { real: [0.5, 2], step: 0.1 }
    answer: "w1 * (M / 2 + m) / (M / 2)"
    units: "rad/s"
    tolerance: { rel: 0.01 }
    hints:
      - "The child's push on the roundabout is internal to child + roundabout. What is conserved?"
      - "At the rim the child contributes $mR^2$ to the moment of inertia; at the centre, nothing."
    solution: |
      Angular momentum about the axle is conserved:
      $$\Big(\tfrac12 MR^2 + mR^2\Big)\omega_1 = \tfrac12 MR^2\,\omega_2 \Rightarrow \omega_2 = \omega_1\frac{M/2 + m}{M/2} = {{w1}} \times \frac{ {{M/2 + m}} }{ {{M/2}} } \approx {{round(w1*(M/2 + m)/(M/2), 3)}}\ \text{rad/s}.$$
      The radius cancels.
    verify: "solve(Eq((integrate(2*Symbol('rho')**3*M/R**2, (Symbol('rho'), 0, R)) + m*R**2)*w1, integrate(2*Symbol('rho')**3*M/R**2, (Symbol('rho'), 0, R))*Symbol('w2')), Symbol('w2'))[0]"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 4

  - id: phys-angmom-010
    difficulty: 4
    type: multipart
    prompt: |
      A uniform rod of mass {{M}} kg and length {{L}} m hangs at rest from a frictionless pivot at its top end. A
      {{m}} kg bullet travelling horizontally at {{v}} m/s hits the bottom end of the rod and embeds itself.
      Take $g = 9.8\ \text{m/s}^2$.
    params:
      M: { real: [2, 6], step: 0.5 }
      L: { real: [0.5, 1.5], step: 0.1 }
      m: { real: [0.01, 0.03], step: 0.005 }
      v: { int: [100, 400] }
    let:
      Itot: "M * L^2 / 3 + m * L^2"
      wf: "m * v * L / Itot"
    require: ["0.5 * Itot * wf^2 < 1.8 * (M * L / 2 + m * L) * 9.8"]
    parts:
      - prompt: "(a) What is the angular velocity of the rod just after the collision? Give it with units."
        type: numeric
        answer: "m * v * L / (M * L^2 / 3 + m * L^2)"
        units: "rad/s"
        tolerance: { rel: 0.01 }
        verify: "solve(Eq(m*v*L, (integrate(M/L*x**2, (x, 0, L)) + m*L**2)*Symbol('w')), Symbol('w'))[0]"
      - prompt: "(b) Using your answer to (a), through what maximum angle from the vertical does the rod swing? Give it with units."
        type: numeric
        answer: "acos(1 - 0.5 * (M * L^2 / 3 + m * L^2) * part1^2 / ((M * L / 2 + m * L) * 9.8)) * 180 / pi"
        units: "deg"
        tolerance: { rel: 0.01 }
        verify: "(lambda c: acos(solve(integrate(M/L*9.8*x*(1 - c), (x, 0, L)) + m*9.8*L*(1 - c) - Rational(1, 2)*(integrate(M/L*x**2, (x, 0, L)) + m*L**2)*part1**2, c)[0])*180/pi)(Symbol('c'))"
    hints:
      - "During the brief collision the pivot exerts a force but no torque about itself: angular momentum about the pivot is conserved. Linear momentum is not."
      - "Before: $L = mvL_{\\text{rod}}$. After: $(I_{\\text{rod}} + mL^2)\\omega$ with $I_{\\text{rod}} = \\tfrac13 ML^2$."
      - "After the collision, mechanical energy is conserved: the rotational KE becomes potential energy of the rod's centre ($L/2$ from the pivot) and of the bullet ($L$ from the pivot)."
    solution: |
      (a) About the pivot, $mvL = \big(\tfrac13 ML^2 + mL^2\big)\omega$, so
      $$\omega = \frac{mvL}{\tfrac13 ML^2 + mL^2} = \frac{ {{m}} \times {{v}} \times {{L}} }{ {{round(Itot, 4)}} } \approx {{round(wf, 3)}}\ \text{rad/s}.$$
      (b) After the collision, $\tfrac12 I\omega^2 = \big(M\tfrac{L}{2} + mL\big)g(1 - \cos\theta)$. The kinetic energy is
      ${{round(0.5*Itot*wf^2, 3)}}$ J, so
      $$\cos\theta = 1 - \frac{\tfrac12 I\omega^2}{(ML/2 + mL)g} \approx {{round(1 - 0.5*Itot*wf^2/((M*L/2 + m*L)*9.8), 4)}},\qquad \theta \approx {{round(acos(1 - 0.5*Itot*wf^2/((M*L/2 + m*L)*9.8))*180/pi, 2)}}°.$$
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 8

  - id: phys-angmom-011
    difficulty: 4
    type: numeric
    prompt: |
      A toy gyroscope is a uniform disc of mass {{M}} kg and radius {{R}} m spinning at {{w}} rad/s on a light axle.
      The axle is horizontal, with one end resting on a pivot {{d}} m from the disc's centre. At what angular velocity
      does the gyroscope precess about the vertical? Take $g = 9.8\ \text{m/s}^2$ and give your answer with units.
    params:
      M: { real: [0.1, 0.5], step: 0.05 }
      R: { real: [0.03, 0.1], step: 0.01 }
      d: { real: [0.03, 0.12], step: 0.01 }
      w: { int: [100, 600] }
    answer: "M * 9.8 * d / (0.5 * M * R^2 * w)"
    units: "rad/s"
    tolerance: { rel: 0.01 }
    hints:
      - "Gravity's torque about the pivot is horizontal and perpendicular to the spin angular momentum."
      - "The torque turns $\\mathbf{L}$ without changing its size: $\\tau = \\Omega L$."
    solution: |
      The torque about the pivot has magnitude $\tau = Mgd$ and is horizontal, perpendicular to the spin angular
      momentum $L = I\omega = \tfrac12 MR^2\omega$. It swings $\mathbf{L}$ round in a horizontal circle:
      $|d\mathbf{L}/dt| = \Omega L = \tau$. So
      $$\Omega = \frac{Mgd}{\tfrac12 MR^2\omega} = \frac{2gd}{R^2\omega} \approx {{round(2*9.8*d/(R^2*w), 3)}}\ \text{rad/s}.$$
      (Valid when $\Omega \ll \omega$, the fast-top approximation.)
    verify: "float(np.linalg.norm(np.cross([d, 0, 0], [0, 0, -M*9.8]))) / (integrate(2*pi*Symbol('rho')**3*M/(pi*R**2), (Symbol('rho'), 0, R))*w)"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 5

  - id: phys-angmom-012
    difficulty: 4
    type: proof
    prompt: |
      A planet moves under a central force $\mathbf{F} = f(r)\,\hat{\mathbf{r}}$ directed along the line to the Sun.
      Show that its angular momentum about the Sun is constant, and deduce Kepler's second law: the line from the Sun
      to the planet sweeps out equal areas in equal times.
    hints:
      - "Differentiate $\\mathbf{L} = \\mathbf{r}\\times m\\mathbf{v}$ with the product rule."
      - "In a short time $dt$ the radius vector sweeps a thin triangle of area $\\tfrac12|\\mathbf{r}\\times d\\mathbf{r}|$."
    solution: |
      $$\frac{d\mathbf{L}}{dt} = \frac{d\mathbf{r}}{dt}\times m\mathbf{v} + \mathbf{r}\times m\frac{d\mathbf{v}}{dt} = \mathbf{v}\times m\mathbf{v} + \mathbf{r}\times\mathbf{F}.$$
      The first term is zero (a vector crossed with itself) and so is the second, because $\mathbf{F}$ is parallel
      to $\mathbf{r}$. So $\mathbf{L}$ is constant.

      In time $dt$ the planet moves $d\mathbf{r} = \mathbf{v}\,dt$, and the radius vector sweeps a triangle of area
      $dA = \tfrac12|\mathbf{r}\times\mathbf{v}\,dt|$. Hence
      $$\frac{dA}{dt} = \frac{|\mathbf{r}\times m\mathbf{v}|}{2m} = \frac{L}{2m},$$
      a constant: equal areas in equal times. (Constant direction of $\mathbf{L}$ also means the orbit stays in one plane.) $\blacksquare$
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 6

  - id: phys-angmom-013
    difficulty: 5
    type: numeric
    prompt: |
      A uniform rod of mass {{M}} kg and length {{L}} m lies at rest on frictionless ice. A {{m}} kg puck sliding at
      {{v}} m/s perpendicular to the rod hits one end and sticks to it. What is the magnitude of the angular velocity
      of the rod + puck afterwards? Give your answer with units.
    params:
      M: { real: [0.5, 3], step: 0.5 }
      L: { real: [0.5, 2], step: 0.1 }
      m: { real: [0.1, 1], step: 0.1 }
      v: { real: [2, 10], step: 0.5 }
    let:
      yc: "m * (L / 2) / (m + M)"
      Icm: "M * L^2 / 12 + M * yc^2 + m * (L / 2 - yc)^2"
    answer: "m * v * (L / 2 - yc) / Icm"
    units: "rad/s"
    tolerance: { rel: 0.01 }
    hints:
      - "Nothing is pivoted: linear momentum and angular momentum are both conserved."
      - "Work about the centre of mass of rod + puck, which lies on the rod a distance $\\dfrac{m(L/2)}{m + M}$ from its middle."
      - "Afterwards the moment of inertia about that point is $\\tfrac{1}{12}ML^2 + My_c^2 + m(L/2 - y_c)^2$."
    solution: |
      The combined centre of mass is $y_c = \dfrac{m(L/2)}{m + M} \approx {{round(yc, 4)}}$ m from the rod's middle,
      towards the struck end. Linear momentum fixes how that point moves afterwards, $V = mv/(m + M)$. Take angular
      momentum about the fixed point in space where the centre of mass is at the moment of impact: before, the puck
      alone gives $mv(L/2 - y_c)$; just after, the centre-of-mass motion passes through that point and contributes
      nothing, leaving $I_{\text{cm}}\omega$ with
      $$I_{\text{cm}} = \tfrac{1}{12}ML^2 + My_c^2 + m\big(\tfrac{L}{2} - y_c\big)^2 \approx {{round(Icm, 5)}}\ \text{kg·m}^2,$$
      so
      $$\omega = \frac{mv(L/2 - y_c)}{I_{\text{cm}}} \approx {{round(m*v*(L/2 - yc)/Icm, 3)}}\ \text{rad/s}.$$
    verify: "(lambda yc_: abs(solve([m*v - (m + M)*Symbol('V'), -m*v*L/2 - (-yc_*(m + M)*Symbol('V') + (integrate(M/L*(Symbol('s') - yc_)**2, (Symbol('s'), -L/2, L/2)) + m*(L/2 - yc_)**2)*Symbol('W'))], [Symbol('V'), Symbol('W')])[Symbol('W')]))(m*(L/2)/(m + M))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 10
