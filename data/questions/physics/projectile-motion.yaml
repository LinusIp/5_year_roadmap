subject: physics
topic: projectile-motion
questions:
  - id: phys-proj-001
    difficulty: 1
    type: numeric
    prompt: |
      A marble rolls off the edge of a table {{h}} m high with a horizontal speed of {{v}} m/s. Ignoring air resistance ($g = 9.8\,\text{m/s}^2$), how long does it take to reach the floor? Give a value with units.
    params:
      h: { real: [0.6, 1.5], step: 0.05 }
      v: { real: [0.5, 4], step: 0.5 }
    let:
      g: 9.8
    answer: "sqrt(2 * h / g)"
    units: "s"
    tolerance: { rel: 0.01 }
    hints:
      - 'The horizontal and vertical motions are independent.'
      - 'Vertically the marble starts with zero velocity, exactly as if it were dropped.'
    solution: |
      Vertically, $h = \tfrac12 g t^2$ with no initial vertical velocity, so
      $t = \sqrt{2h/g} = \sqrt{2 \times {{h}}/9.8} \approx {{sqrt(2*h/g)}}\,\text{s}$. The horizontal speed of {{v}} m/s does not affect the time.
    verify: "max(np.roots([-4.9, 0, h]))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 2

  - id: phys-proj-002
    difficulty: 1
    type: mc
    prompt: |
      A ball is thrown at an angle above the horizontal. Ignoring air resistance, what is its acceleration at the highest point of its path?
    options:
      - '$9.8\,\text{m/s}^2$, straight down'
      - 'Zero, because its vertical velocity is momentarily zero'
      - '$9.8\,\text{m/s}^2$, horizontally along its direction of motion'
      - 'Less than $9.8\,\text{m/s}^2$, because the ball is still moving sideways'
    answer: 0
    hints:
      - 'Which forces act on the ball once it has left the hand?'
      - 'A zero velocity component does not mean a zero acceleration.'
    solution: |
      Only gravity acts, all the way along the path, so $\vec a = \vec g$: $9.8\,\text{m/s}^2$ straight down, at the top as everywhere else. At the top the vertical *velocity* is zero, but it is changing from upward to downward, which is exactly what a downward acceleration does.
    verify: "(lambda vx, vy: [Matrix([0, -Rational(49, 5)]), Matrix([0, 0]), Matrix([Rational(49, 5), 0])].index(Matrix([diff(vx*t, t, 2), diff(vy*t - Rational(49, 10)*t**2, t, 2)]).subs(t, vy/Rational(49, 5))))(3, 4)"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 1

  - id: phys-proj-003
    difficulty: 2
    type: numeric
    prompt: |
      A marble rolls off the edge of a table {{h}} m high with a horizontal speed of {{v}} m/s. Ignoring air resistance ($g = 9.8\,\text{m/s}^2$), how far from the foot of the table does it land? Give a value with units.
    params:
      h: { real: [0.6, 1.5], step: 0.05 }
      v: { real: [0.5, 4], step: 0.5 }
    let:
      g: 9.8
      tf: "sqrt(2 * h / g)"
    answer: "v * tf"
    units: "m"
    tolerance: { rel: 0.01 }
    hints:
      - 'First find the time to fall {{h}} m from rest vertically.'
      - 'During that time the horizontal velocity stays {{v}} m/s.'
    solution: |
      Fall time: $t = \sqrt{2h/g} = \sqrt{2 \times {{h}}/9.8} \approx {{tf}}\,\text{s}$.
      Horizontal distance: $x = v\,t = {{v}} \times {{tf}} \approx {{v*tf}}\,\text{m}$.
    verify: "v*max(np.roots([-4.9, 0, h]))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 3

  - id: phys-proj-004
    difficulty: 2
    type: numeric
    prompt: |
      A ball is kicked from level ground at {{v0}} m/s, {{th}}° above the horizontal. Ignoring air resistance ($g = 9.8\,\text{m/s}^2$), how far away does it land? Give a value with units.
    params:
      v0: { real: [8, 30], step: 0.5 }
      th: { int: [15, 75] }
    let:
      g: 9.8
      rad: "th * pi / 180"
    answer: "v0^2 * sin(2 * rad) / g"
    units: "m"
    tolerance: { rel: 0.01 }
    hints:
      - 'Split the launch velocity: $v_{0x} = v_0\cos\theta$, $v_{0y} = v_0\sin\theta$.'
      - 'Time of flight: solve $v_{0y}t - \tfrac12 g t^2 = 0$ for $t \neq 0$.'
      - 'Range $= v_{0x} \times$ time of flight $= v_0^2\sin 2\theta / g$.'
    solution: |
      $v_{0x} = {{v0}}\cos{{th}}^\circ \approx {{v0*cos(rad)}}\,\text{m/s}$ and $v_{0y} = {{v0}}\sin{{th}}^\circ \approx {{v0*sin(rad)}}\,\text{m/s}$.
      It lands when $v_{0y}t = \tfrac12 g t^2$, i.e. at $t = 2v_{0y}/g \approx {{2*v0*sin(rad)/g}}\,\text{s}$, so
      $$R = v_{0x}\,t = \frac{v_0^2 \sin 2\theta}{g} \approx {{v0^2*sin(2*rad)/g}}\,\text{m}.$$
    verify: "(lambda tf: v0*math.cos(math.radians(th))*tf)(max(np.roots([-4.9, v0*math.sin(math.radians(th)), 0])))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 3

  - id: phys-proj-005
    difficulty: 2
    type: numeric
    prompt: |
      A ball is launched from level ground at {{v0}} m/s, {{th}}° above the horizontal. Ignoring air resistance ($g = 9.8\,\text{m/s}^2$), what is the greatest height it reaches? Give a value with units.
    params:
      v0: { real: [8, 30], step: 0.5 }
      th: { int: [15, 80] }
    let:
      g: 9.8
      vy: "v0 * sin(th * pi / 180)"
    answer: "vy^2 / (2 * g)"
    units: "m"
    tolerance: { rel: 0.01 }
    hints:
      - 'Only the vertical component of velocity matters for the height.'
      - 'At the top the vertical velocity is zero: $0 = v_{0y}^2 - 2gH$.'
    solution: |
      $v_{0y} = {{v0}}\sin{{th}}^\circ \approx {{vy}}\,\text{m/s}$. At the top $v_y = 0$, so
      $H = \dfrac{v_{0y}^2}{2g} = \dfrac{ {{vy}}^2 }{2 \times 9.8} \approx {{vy^2/(2*g)}}\,\text{m}$.
    verify: "(lambda yy: yy.subs(t, solve(diff(yy, t), t)[0]))(v0*math.sin(math.radians(th))*t - Rational(49, 10)*t**2)"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 3

  - id: phys-proj-006
    difficulty: 3
    type: multipart
    prompt: |
      A golf ball leaves level ground at {{v0}} m/s, {{th}}° above the horizontal. Ignore air resistance and take $g = 9.8\,\text{m/s}^2$.
    params:
      v0: { real: [15, 45], step: 0.5 }
      th: { int: [15, 70] }
    let:
      g: 9.8
      rad: "th * pi / 180"
    parts:
      - prompt: "(a) How long is the ball in the air? Give a value with units."
        type: numeric
        answer: "2 * v0 * sin(rad) / g"
        units: "s"
        tolerance: { rel: 0.01 }
        verify: "max(np.roots([-4.9, v0*math.sin(math.radians(th)), 0]))"
      - prompt: "(b) Using your time from (a), how far away does it land?"
        type: numeric
        answer: "v0 * cos(rad) * part1"
        units: "m"
        tolerance: { rel: 0.01 }
        verify: "v0**2*math.sin(math.radians(2*th))/9.8"
    hints:
      - 'Vertically: $y = v_0\sin\theta\,t - \tfrac12 g t^2$; set $y = 0$.'
      - 'Horizontally the velocity $v_0\cos\theta$ is constant, so $x = v_0\cos\theta\,t$.'
    solution: |
      (a) $y = 0$ when $t\left(v_0\sin\theta - \tfrac12 g t\right) = 0$, so $T = \dfrac{2v_0\sin\theta}{g} = \dfrac{2 \times {{v0}} \sin {{th}}^\circ}{9.8} \approx {{2*v0*sin(rad)/g}}\,\text{s}$.

      (b) $R = v_0\cos\theta \cdot T \approx {{v0*cos(rad)}} \times {{2*v0*sin(rad)/g}} \approx {{2*v0^2*sin(rad)*cos(rad)/g}}\,\text{m}$.
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 4

  - id: phys-proj-007
    difficulty: 3
    type: numeric
    prompt: |
      A stone is thrown from the top of a cliff {{h}} m high at {{v0}} m/s, {{th}}° above the horizontal. It lands on the flat ground below. Ignoring air resistance ($g = 9.8\,\text{m/s}^2$), how far from the base of the cliff does it land? Give a value with units.
    params:
      h: { int: [10, 60] }
      v0: { real: [5, 25], step: 0.5 }
      th: { int: [10, 60] }
    let:
      g: 9.8
      vx: "v0 * cos(th * pi / 180)"
      vy: "v0 * sin(th * pi / 180)"
      tl: "(vy + sqrt(vy^2 + 2 * g * h)) / g"
    answer: "vx * tl"
    units: "m"
    tolerance: { rel: 0.01 }
    hints:
      - 'Put the origin at the launch point with up positive; the ground is at $y = -{{h}}$.'
      - 'Solve $-{{h}} = v_{0y}t - 4.9t^2$ for the positive $t$.'
      - 'Then $x = v_{0x}t$.'
    solution: |
      $v_{0x} \approx {{vx}}\,\text{m/s}$, $v_{0y} \approx {{vy}}\,\text{m/s}$. Landing: $4.9t^2 - {{vy}}t - {{h}} = 0$, whose positive root is
      $$t = \frac{v_{0y} + \sqrt{v_{0y}^2 + 2gh}}{g} \approx {{tl}}\,\text{s}.$$
      Horizontal distance: $x = v_{0x}t \approx {{vx}} \times {{tl}} \approx {{vx*tl}}\,\text{m}$.
    verify: "v0*math.cos(math.radians(th))*max(np.roots([-4.9, v0*math.sin(math.radians(th)), h]))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 5

  - id: phys-proj-008
    difficulty: 3
    type: numeric
    prompt: |
      A stone is thrown from the top of a cliff {{h}} m high at {{v0}} m/s, {{th}}° above the horizontal, and lands on the ground below. Ignoring air resistance ($g = 9.8\,\text{m/s}^2$), how fast is it moving just before it lands? Give a value with units.
    params:
      h: { int: [10, 60] }
      v0: { real: [5, 25], step: 0.5 }
      th: { int: [10, 60] }
    let:
      g: 9.8
    answer: "sqrt(v0^2 + 2 * g * h)"
    units: "m/s"
    tolerance: { rel: 0.01 }
    hints:
      - 'The horizontal velocity never changes; only the vertical one does.'
      - 'For the vertical part, $v_y^2 = v_{0y}^2 + 2gh$ on the way down to $h$ below the launch point.'
      - 'Add the squares: $v^2 = v_{0x}^2 + v_{0y}^2 + 2gh = v_0^2 + 2gh$. The angle drops out.'
    solution: |
      $v_x = v_0\cos\theta$ is constant and $v_y^2 = (v_0\sin\theta)^2 + 2gh$ at the ground. So
      $$v^2 = v_0^2\cos^2\theta + v_0^2\sin^2\theta + 2gh = v_0^2 + 2gh,$$
      $v = \sqrt{ {{v0}}^2 + 2(9.8)({{h}})} \approx {{sqrt(v0^2 + 2*g*h)}}\,\text{m/s}$, whatever the launch angle. (Energy conservation gives the same in one line.)
    verify: "(lambda tl: math.hypot(v0*math.cos(math.radians(th)), v0*math.sin(math.radians(th)) - 9.8*tl))(max(np.roots([-4.9, v0*math.sin(math.radians(th)), h])))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 4

  - id: phys-proj-009
    difficulty: 2
    type: mc
    prompt: |
      From the same height, one ball is dropped from rest and at the same instant a second ball is fired horizontally at high speed. Ignoring air resistance, over level ground:
    options:
      - 'They land at the same time'
      - 'The dropped ball lands first'
      - 'The fired ball lands first'
      - 'It depends on how fast the second ball is fired'
    answer: 0
    hints:
      - 'Treat the horizontal and vertical motions separately.'
      - 'What is each ball''s initial vertical velocity?'
    solution: |
      Both start with zero vertical velocity and both have vertical acceleration $g$, so their heights obey the same $y(t) = h - \tfrac12 g t^2$. They hit the ground together, after $t = \sqrt{2h/g}$; the fired ball simply lands farther away.
    verify: "(lambda t1, t2: 0 if abs(t1 - t2) < 1e-12 else (1 if t1 < t2 else 2))(max(np.roots([-4.9, 0, 1.2])), max(np.roots([-4.9, 0*math.sin(0)*25, 1.2])))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 1

  - id: phys-proj-010
    difficulty: 4
    type: numeric
    prompt: |
      A water jet leaves a nozzle at ground level at {{v0}} m/s. At what angle above the horizontal (the smaller of the two possible angles) must it be aimed to land on a target {{D}} m away on level ground? Ignore air resistance and take $g = 9.8\,\text{m/s}^2$. Enter a number of degrees.
    params:
      v0: { int: [15, 35] }
      D: { int: [10, 80] }
    let:
      g: 9.8
      s2: "g * D / v0^2"
    require: ["s2 < 0.95"]
    answer: "asin(s2) / 2 * 180 / pi"
    tolerance: { abs: 0.3 }
    hints:
      - 'The range on level ground is $R = v_0^2\sin 2\theta / g$.'
      - 'Solve $\sin 2\theta = gD/v_0^2$; there are two solutions for $2\theta$ between $0^\circ$ and $180^\circ$.'
    solution: |
      $R = \dfrac{v_0^2\sin 2\theta}{g} = D$ gives $\sin 2\theta = \dfrac{gD}{v_0^2} = \dfrac{9.8 \times {{D}}}{ {{v0}}^2 } \approx {{s2}}$.
      So $2\theta \approx {{asin(s2)*180/pi}}^\circ$ or $180^\circ - {{asin(s2)*180/pi}}^\circ$; the smaller angle is $\theta \approx {{asin(s2)/2*180/pi}}^\circ$ (the other, $\approx {{90 - asin(s2)/2*180/pi}}^\circ$, is its complement).
    verify: "float(nsolve(v0**2*sin(2*x)/9.8 - D, x, (1e-6, math.pi/4), solver='bisect'))*180/math.pi"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 5

  - id: phys-proj-011
    difficulty: 4
    type: numeric
    prompt: |
      A ball is kicked from level ground at {{v0}} m/s, {{th}}° above the horizontal, towards a wall {{D}} m away. Ignoring air resistance ($g = 9.8\,\text{m/s}^2$), how high above the ground is the ball when it reaches the wall? Give a value with units.
    params:
      v0: { int: [15, 30] }
      th: { int: [25, 65] }
      D: { int: [8, 30] }
    let:
      g: 9.8
      rad: "th * pi / 180"
      tw: "D / (v0 * cos(rad))"
      yw: "v0 * sin(rad) * tw - g * tw^2 / 2"
    require: ["yw > 0.5"]
    answer: yw
    units: "m"
    tolerance: { rel: 0.01 }
    hints:
      - 'Use the horizontal motion to find when the ball reaches the wall.'
      - '$t_w = D / (v_0\cos\theta)$.'
      - 'Put that time into $y = v_0\sin\theta\,t - \tfrac12 g t^2$.'
    solution: |
      Horizontally $x = v_0\cos\theta\,t$, so the ball reaches the wall at $t_w = \dfrac{ {{D}} }{ {{v0}}\cos{{th}}^\circ} \approx {{tw}}\,\text{s}$.
      Then $y = v_0\sin\theta\,t_w - \tfrac12 g t_w^2 \approx {{v0*sin(rad)*tw}} - {{g*tw^2/2}} \approx {{yw}}\,\text{m}$.
    verify: "(lambda tw: v0*math.sin(math.radians(th))*tw - Rational(49, 10)*tw**2)(solve(v0*math.cos(math.radians(th))*t - D, t)[0])"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 5

  - id: phys-proj-012
    difficulty: 4
    type: proof
    prompt: |
      A projectile is launched from level ground with speed $v_0$ at angle $\theta$ and lands at the same height. Ignoring air resistance, show that its range is $R = v_0^2\sin 2\theta/g$, that the range is greatest at $\theta = 45^\circ$, and that the angles $\theta$ and $90^\circ - \theta$ give the same range.
    hints:
      - 'Find the time of flight from the vertical motion.'
      - 'Multiply by the constant horizontal velocity and use $2\sin\theta\cos\theta = \sin 2\theta$.'
      - 'What is $\sin(180^\circ - 2\theta)$?'
    solution: |
      Vertically $y = v_0\sin\theta\,t - \tfrac12 g t^2$, which is zero again at $T = 2v_0\sin\theta/g$. Horizontally the velocity is constant, so
      $$R = v_0\cos\theta\cdot T = \frac{2v_0^2\sin\theta\cos\theta}{g} = \frac{v_0^2\sin 2\theta}{g}.$$
      For fixed $v_0$, $R$ is largest when $\sin 2\theta = 1$, i.e. $2\theta = 90^\circ$, $\theta = 45^\circ$, giving $R_{\max} = v_0^2/g$.

      Replacing $\theta$ by $90^\circ - \theta$ turns $2\theta$ into $180^\circ - 2\theta$, and $\sin(180^\circ - 2\theta) = \sin 2\theta$, so the range is unchanged: a high lob and a flat shot at complementary angles land at the same spot (the lob just takes longer).
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 6

  - id: phys-proj-013
    difficulty: 5
    type: numeric
    prompt: |
      A ball is launched from the bottom of a straight hillside that rises at {{al}}° to the horizontal. It leaves at {{v0}} m/s, {{th}}° above the horizontal (so it heads up the slope). Ignoring air resistance ($g = 9.8\,\text{m/s}^2$), how far up the slope, measured along the slope, does it land? Give a value with units.
    params:
      v0: { int: [10, 25] }
      al: { int: [10, 30] }
      th: { int: [25, 75] }
    require: ["th >= al + 10"]
    let:
      g: 9.8
      a: "al * pi / 180"
      b: "th * pi / 180"
      tl: "2 * v0 * sin(b - a) / (g * cos(a))"
    answer: "2 * v0^2 * cos(b) * sin(b - a) / (g * cos(a)^2)"
    units: "m"
    tolerance: { rel: 0.01 }
    hints:
      - 'The slope is the line $y = x\tan\alpha$ through the launch point.'
      - 'The ball lands when $v_0\sin\theta\,t - \tfrac12 g t^2 = (v_0\cos\theta\,t)\tan\alpha$.'
      - 'Find the landing $x$, then the distance along the slope is $x/\cos\alpha$.'
    solution: |
      With $x = v_0\cos\theta\,t$ and $y = v_0\sin\theta\,t - \tfrac12 g t^2$, landing on $y = x\tan\alpha$ gives (for $t \neq 0$)
      $$\tfrac12 g t = v_0(\sin\theta - \cos\theta\tan\alpha) = \frac{v_0\sin(\theta - \alpha)}{\cos\alpha} \;\Rightarrow\; t = \frac{2v_0\sin(\theta - \alpha)}{g\cos\alpha} \approx {{tl}}\,\text{s}.$$
      Then $x = v_0\cos\theta\,t \approx {{v0*cos(b)*tl}}\,\text{m}$, and the distance along the slope is
      $$d = \frac{x}{\cos\alpha} = \frac{2v_0^2\cos\theta\sin(\theta - \alpha)}{g\cos^2\alpha} \approx {{2*v0^2*cos(b)*sin(b - a)/(g*cos(a)^2)}}\,\text{m}.$$
    verify: "(lambda tl: v0*math.cos(math.radians(th))*tl/math.cos(math.radians(al)))(max(np.roots([-4.9, v0*math.sin(math.radians(th)) - v0*math.cos(math.radians(th))*math.tan(math.radians(al)), 0])))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 8

  - id: phys-proj-014
    difficulty: 2
    type: estimate
    prompt: |
      Treat a long jumper as a point projectile that takes off and lands at the same height. Take the take-off speed to be about a sprinter's top speed and the take-off angle about 20°. Estimate the length of the jump. Give a value with units.
    answer: "10^2 * sin(40 * pi / 180) / 9.8"
    units: "m"
    factor: 2
    hints:
      - 'An elite sprinter''s top speed is about 10 m/s.'
      - 'Range on level ground: $R = v_0^2\sin 2\theta/g$.'
    solution: |
      With $v_0 \approx 10\,\text{m/s}$ and $\theta \approx 20^\circ$: $R \approx \dfrac{100 \times \sin 40^\circ}{9.8} \approx 6.6\,\text{m}$.
      Real world records are near 9 m: jumpers take off with their centre of mass above the landing height and stretch their legs forward on landing.
    verify: "(lambda tf: 10*math.cos(math.radians(20))*tf)(max(np.roots([-4.9, 10*math.sin(math.radians(20)), 0])))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 3
