subject: calculus
topic: vectors-dot-and-cross-product
questions:
  - id: calc-vec-001
    difficulty: 1
    type: numeric
    prompt: |
      Let $\mathbf{u} = \langle {{u1}}, {{u2}}, {{u3}} \rangle$ and $\mathbf{v} = \langle {{v1}}, {{v2}}, {{v3}} \rangle$.
      Compute $\mathbf{u} \cdot \mathbf{v}$.
    params:
      u1: { int: [-5, 5] }
      u2: { int: [-5, 5] }
      u3: { int: [-5, 5] }
      v1: { int: [-5, 5] }
      v2: { int: [-5, 5] }
      v3: { int: [-5, 5] }
    answer: "u1*v1 + u2*v2 + u3*v3"
    hints:
      - 'Multiply matching components and add: $\mathbf{u}\cdot\mathbf{v} = u_1v_1 + u_2v_2 + u_3v_3$.'
    solution: |
      $$\mathbf{u}\cdot\mathbf{v} = ({{u1}})({{v1}}) + ({{u2}})({{v2}}) + ({{u3}})({{v3}}) = {{u1*v1}} {{signed: u2*v2}} {{signed: u3*v3}} = {{u1*v1 + u2*v2 + u3*v3}}.$$
    verify: "Matrix([u1, u2, u3]).dot(Matrix([v1, v2, v3]))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 1

  - id: calc-vec-002
    difficulty: 1
    type: mc
    prompt: |
      Two non-zero vectors $\mathbf{u}$ and $\mathbf{v}$ satisfy $\mathbf{u} \cdot \mathbf{v} = 0$. What does this tell you?
    options:
      - "$\\mathbf{u}$ and $\\mathbf{v}$ are perpendicular."
      - "$\\mathbf{u}$ and $\\mathbf{v}$ are parallel."
      - "$\\mathbf{u}$ and $\\mathbf{v}$ have the same length."
      - "$\\mathbf{u} \\times \\mathbf{v} = \\mathbf{0}$."
    answer: 0
    hints:
      - 'Use $\mathbf{u}\cdot\mathbf{v} = |\mathbf{u}|\,|\mathbf{v}|\cos\theta$.'
    solution: |
      $\mathbf{u}\cdot\mathbf{v} = |\mathbf{u}|\,|\mathbf{v}|\cos\theta$ with both lengths non-zero, so $\cos\theta = 0$ and
      $\theta = \pi/2$: the vectors are perpendicular (orthogonal). Their cross product then has the largest possible length,
      $|\mathbf{u}|\,|\mathbf{v}|$, so it is certainly not $\mathbf{0}$.
    verify: "0 if Matrix([1, 2, 0]).dot(Matrix([-2, 1, 5])) == 0 and acos(Rational(0)) == pi/2 else 1"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 1

  - id: calc-vec-003
    difficulty: 1
    type: mc
    prompt: |
      Two non-zero vectors $\mathbf{u}$ and $\mathbf{v}$ satisfy $\mathbf{u} \times \mathbf{v} = \mathbf{0}$. What does this tell you?
    options:
      - "$\\mathbf{u}$ and $\\mathbf{v}$ are parallel (one is a multiple of the other)."
      - "$\\mathbf{u}$ and $\\mathbf{v}$ are perpendicular."
      - "$\\mathbf{u} \\cdot \\mathbf{v} = 0$."
      - "$\\mathbf{u} = \\mathbf{v}$."
    answer: 0
    hints:
      - '$|\mathbf{u}\times\mathbf{v}| = |\mathbf{u}|\,|\mathbf{v}|\sin\theta$.'
    solution: |
      $|\mathbf{u}\times\mathbf{v}| = |\mathbf{u}|\,|\mathbf{v}|\sin\theta = 0$ with non-zero lengths forces $\sin\theta = 0$, so
      $\theta = 0$ or $\pi$: the vectors are parallel (possibly pointing in opposite directions, so not necessarily equal).
    verify: "0 if Matrix([1, -2, 3]).cross(Matrix([-2, 4, -6])) == zeros(3, 1) else 1"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 1

  - id: calc-vec-004
    difficulty: 2
    type: vector
    prompt: |
      Let $\mathbf{u} = \langle {{u1}}, {{u2}}, {{u3}} \rangle$ and $\mathbf{v} = \langle {{v1}}, {{v2}}, {{v3}} \rangle$.
      Compute $\mathbf{u} \times \mathbf{v}$. Enter it as a list such as `1, -2, 3`.
    params:
      u1: { int: [-4, 4] }
      u2: { int: [-4, 4] }
      u3: { int: [-4, 4] }
      v1: { int: [-4, 4] }
      v2: { int: [-4, 4] }
      v3: { int: [-4, 4] }
    answer: "cross([u1, u2, u3], [v1, v2, v3])"
    hints:
      - 'Expand the determinant $\begin{vmatrix} \mathbf{i} & \mathbf{j} & \mathbf{k} \\ u_1 & u_2 & u_3 \\ v_1 & v_2 & v_3 \end{vmatrix}$ along its first row.'
      - 'The $\mathbf{j}$ component carries a minus sign: $-(u_1v_3 - u_3v_1)$.'
    solution: |
      $$\mathbf{u}\times\mathbf{v} = \begin{vmatrix} \mathbf{i} & \mathbf{j} & \mathbf{k} \\ {{u1}} & {{u2}} & {{u3}} \\ {{v1}} & {{v2}} & {{v3}} \end{vmatrix}
        = \big(({{u2}})({{v3}}) - ({{u3}})({{v2}})\big)\mathbf{i} - \big(({{u1}})({{v3}}) - ({{u3}})({{v1}})\big)\mathbf{j} + \big(({{u1}})({{v2}}) - ({{u2}})({{v1}})\big)\mathbf{k}$$
      $$= \langle {{u2*v3 - u3*v2}}, {{u3*v1 - u1*v3}}, {{u1*v2 - u2*v1}} \rangle.$$
      Check: the result is perpendicular to both $\mathbf{u}$ and $\mathbf{v}$ (its dot product with each is $0$).
    verify: "Matrix([u1, u2, u3]).cross(Matrix([v1, v2, v3]))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 3

  - id: calc-vec-005
    difficulty: 2
    type: numeric
    prompt: |
      Find the angle between $\mathbf{u} = \langle {{u1}}, {{u2}}, {{u3}} \rangle$ and $\mathbf{v} = \langle {{v1}}, {{v2}}, {{v3}} \rangle$,
      **in degrees**, to one decimal place.
    params:
      u1: { int: [-4, 4] }
      u2: { int: [-4, 4] }
      u3: { int: [1, 4] }
      v1: { int: [-4, 4] }
      v2: { int: [-4, 4] }
      v3: { int: [-4, 4], not: [0] }
    let:
      dp: "u1*v1 + u2*v2 + u3*v3"
      nu: "sqrt(u1^2 + u2^2 + u3^2)"
      nv: "sqrt(v1^2 + v2^2 + v3^2)"
      deg: "acos(dp / (nu * nv)) * 180 / pi"
    require: ["norm(cross([u1, u2, u3], [v1, v2, v3])) > 0"]
    answer: "deg"
    tolerance: { abs: 0.1 }
    hints:
      - '$\cos\theta = \dfrac{\mathbf{u}\cdot\mathbf{v}}{|\mathbf{u}|\,|\mathbf{v}|}$.'
      - '$\mathbf{u}\cdot\mathbf{v} = {{dp}}$. Now compute the two lengths.'
    solution: |
      $\mathbf{u}\cdot\mathbf{v} = {{dp}}$, $|\mathbf{u}| = \sqrt{ {{u1^2 + u2^2 + u3^2}} }$ and $|\mathbf{v}| = \sqrt{ {{v1^2 + v2^2 + v3^2}} }$. So
      $$\cos\theta = \frac{ {{dp}} }{\sqrt{ {{u1^2 + u2^2 + u3^2}} }\,\sqrt{ {{v1^2 + v2^2 + v3^2}} }} \approx {{dp / (nu*nv)}},
        \qquad \theta = \arccos({{dp / (nu*nv)}}) \approx {{deg}}^\circ.$$
    verify: "N(atan2(Matrix([u1, u2, u3]).cross(Matrix([v1, v2, v3])).norm(), Matrix([u1, u2, u3]).dot(Matrix([v1, v2, v3]))) * 180 / pi)"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 3

  - id: calc-vec-006
    difficulty: 2
    type: numeric
    prompt: |
      Find the area of the triangle with vertices $P({{p1}}, {{p2}}, {{p3}})$, $Q({{q1}}, {{q2}}, {{q3}})$ and $R({{r1}}, {{r2}}, {{r3}})$.
      Give it to 4 significant figures.
    params:
      p1: { int: [-3, 3] }
      p2: { int: [-3, 3] }
      p3: { int: [-3, 3] }
      q1: { int: [-3, 3] }
      q2: { int: [-3, 3] }
      q3: { int: [-3, 3] }
      r1: { int: [-3, 3] }
      r2: { int: [-3, 3] }
      r3: { int: [-3, 3] }
    let:
      a: "[q1 - p1, q2 - p2, q3 - p3]"
      b: "[r1 - p1, r2 - p2, r3 - p3]"
      n: "cross(a, b)"
      area: "norm(n) / 2"
    require: ["area > 0"]
    answer: "area"
    hints:
      - 'The area of the parallelogram spanned by $\overrightarrow{PQ}$ and $\overrightarrow{PR}$ is $|\overrightarrow{PQ}\times\overrightarrow{PR}|$.'
      - 'The triangle is half of that parallelogram.'
    solution: |
      $\overrightarrow{PQ} = {{row: a}}$ and $\overrightarrow{PR} = {{row: b}}$, so
      $$\overrightarrow{PQ}\times\overrightarrow{PR} = {{row: n}}, \qquad |\overrightarrow{PQ}\times\overrightarrow{PR}| = \sqrt{ {{dot(n, n)}} }.$$
      The triangle has area $\tfrac12\sqrt{ {{dot(n, n)}} } \approx {{area}}$.
    verify: "(lambda A, B: sqrt((Matrix([[A.dot(A), A.dot(B)], [B.dot(A), B.dot(B)]])).det()) / 2)(Matrix([q1 - p1, q2 - p2, q3 - p3]), Matrix([r1 - p1, r2 - p2, r3 - p3]))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 4

  - id: calc-vec-007
    difficulty: 2
    type: vector
    prompt: |
      Find the vector projection of $\mathbf{b} = \langle {{b1}}, {{b2}}, {{b3}} \rangle$ onto $\mathbf{a} = \langle {{a1}}, {{a2}}, {{a3}} \rangle$.
      Enter it as a list such as `0.5, -1, 2` (decimals to 4 significant figures).
    params:
      a1: { int: [-3, 3] }
      a2: { int: [-3, 3] }
      a3: { int: [1, 3] }
      b1: { int: [-5, 5] }
      b2: { int: [-5, 5] }
      b3: { int: [-5, 5] }
    let:
      ab: "a1*b1 + a2*b2 + a3*b3"
      aa: "a1^2 + a2^2 + a3^2"
    answer: "(ab / aa) * [a1, a2, a3]"
    hints:
      - '$\operatorname{proj}_{\mathbf{a}}\mathbf{b} = \dfrac{\mathbf{a}\cdot\mathbf{b}}{\mathbf{a}\cdot\mathbf{a}}\,\mathbf{a}$.'
      - '$\mathbf{a}\cdot\mathbf{b} = {{ab}}$ and $\mathbf{a}\cdot\mathbf{a} = {{aa}}$.'
    solution: |
      $\mathbf{a}\cdot\mathbf{b} = {{ab}}$ and $\mathbf{a}\cdot\mathbf{a} = |\mathbf{a}|^2 = {{aa}}$, so
      $$\operatorname{proj}_{\mathbf{a}}\mathbf{b} = {{frac: ab/aa}}\,\langle {{a1}}, {{a2}}, {{a3}} \rangle \approx {{row: (ab / aa) * [a1, a2, a3]}}.$$
    verify: "Matrix([b1, b2, b3]).project(Matrix([a1, a2, a3]))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 3

  - id: calc-vec-008
    difficulty: 2
    type: numeric
    prompt: |
      For which value of $k$ are $\mathbf{u} = \langle {{a}}, {{b}}, k \rangle$ and $\mathbf{v} = \langle {{c}}, {{d}}, {{e}} \rangle$ perpendicular?
      Give the exact value or a decimal to 4 significant figures.
    params:
      a: { int: [-5, 5] }
      b: { int: [-5, 5] }
      c: { int: [-5, 5] }
      d: { int: [-5, 5] }
      e: { int: [-4, 4], not: [0] }
    answer: "-(a*c + b*d) / e"
    hints:
      - 'Perpendicular means $\mathbf{u}\cdot\mathbf{v} = 0$.'
    solution: |
      $$\mathbf{u}\cdot\mathbf{v} = ({{a}})({{c}}) + ({{b}})({{d}}) + {{e}}k = {{a*c + b*d}} {{signed: e}}k = 0
        \quad\Longrightarrow\quad k = {{frac: -(a*c + b*d)/e}}.$$
    verify: "solve(a*c + b*d + Symbol('k')*e, Symbol('k'))[0]"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 2

  - id: calc-vec-009
    difficulty: 3
    type: numeric
    prompt: |
      Find the volume of the parallelepiped with edges $\mathbf{u} = \langle {{u1}}, {{u2}}, {{u3}} \rangle$,
      $\mathbf{v} = \langle {{v1}}, {{v2}}, {{v3}} \rangle$ and $\mathbf{w} = \langle {{w1}}, {{w2}}, {{w3}} \rangle$.
    params:
      u1: { int: [-3, 3] }
      u2: { int: [-3, 3] }
      u3: { int: [-3, 3] }
      v1: { int: [-3, 3] }
      v2: { int: [-3, 3] }
      v3: { int: [-3, 3] }
      w1: { int: [-3, 3] }
      w2: { int: [-3, 3] }
      w3: { int: [-3, 3] }
    let:
      D: "det([[u1, u2, u3], [v1, v2, v3], [w1, w2, w3]])"
    require: ["D != 0"]
    answer: "abs(D)"
    hints:
      - 'The volume is the absolute value of the triple product $\mathbf{u}\cdot(\mathbf{v}\times\mathbf{w})$.'
      - 'The triple product equals the $3\times3$ determinant with rows $\mathbf{u}, \mathbf{v}, \mathbf{w}$.'
    solution: |
      $$\mathbf{u}\cdot(\mathbf{v}\times\mathbf{w}) = \det\begin{bmatrix} {{u1}} & {{u2}} & {{u3}} \\ {{v1}} & {{v2}} & {{v3}} \\ {{w1}} & {{w2}} & {{w3}} \end{bmatrix}
        = {{u1}}({{v2*w3 - v3*w2}}) - ({{u2}})({{v1*w3 - v3*w1}}) + ({{u3}})({{v1*w2 - v2*w1}}) = {{D}}.$$
      The volume is $|{{D}}| = {{abs(D)}}$.
    verify: "abs(Matrix([u1, u2, u3]).dot(Matrix([v1, v2, v3]).cross(Matrix([w1, w2, w3]))))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 4

  - id: calc-vec-010
    difficulty: 3
    type: vector
    prompt: |
      Find a vector normal to the plane through $P({{p1}}, {{p2}}, {{p3}})$, $Q({{q1}}, {{q2}}, {{q3}})$ and $R({{r1}}, {{r2}}, {{r3}})$.
      Enter it as a list such as `2, -1, 3`; any non-zero multiple is accepted.
    params:
      p1: { int: [-3, 3] }
      p2: { int: [-3, 3] }
      p3: { int: [-3, 3] }
      q1: { int: [-3, 3] }
      q2: { int: [-3, 3] }
      q3: { int: [-3, 3] }
      r1: { int: [-3, 3] }
      r2: { int: [-3, 3] }
      r3: { int: [-3, 3] }
    let:
      a: "[q1 - p1, q2 - p2, q3 - p3]"
      b: "[r1 - p1, r2 - p2, r3 - p3]"
      n: "cross(a, b)"
    require: ["norm(n) > 0"]
    answer: "n"
    upToScale: true
    hints:
      - 'Two vectors lying in the plane are $\overrightarrow{PQ}$ and $\overrightarrow{PR}$.'
      - 'Their cross product is perpendicular to both, hence to the plane.'
    solution: |
      $\overrightarrow{PQ} = {{row: a}}$ and $\overrightarrow{PR} = {{row: b}}$ lie in the plane, so
      $$\mathbf{n} = \overrightarrow{PQ}\times\overrightarrow{PR} = {{row: n}}$$
      is normal to it. (The plane is then ${{n[1]}}(x {{signed: -p1}}) + ({{n[2]}})(y {{signed: -p2}}) + ({{n[3]}})(z {{signed: -p3}}) = 0$.)
    verify: "Matrix([[q1 - p1, q2 - p2, q3 - p3], [r1 - p1, r2 - p2, r3 - p3]]).nullspace()[0]"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 4

  - id: calc-vec-011
    difficulty: 3
    type: numeric
    prompt: |
      Find the distance from the point $P({{p1}}, {{p2}}, {{p3}})$ to the plane ${{a}}x {{signed: b}}y {{signed: c}}z = {{d}}$.
      Give it to 4 significant figures.
    params:
      a: { int: [-4, 4], not: [0, 1, -1] }
      b: { int: [-4, 4], not: [0, 1, -1] }
      c: { int: [-4, 4], not: [0, 1, -1] }
      d: { int: [-6, 6] }
      p1: { int: [-4, 4] }
      p2: { int: [-4, 4] }
      p3: { int: [-4, 4] }
    let:
      num: "a*p1 + b*p2 + c*p3 - d"
      len: "sqrt(a^2 + b^2 + c^2)"
    require: ["num != 0"]
    answer: "abs(num) / len"
    hints:
      - 'The normal vector of the plane is $\mathbf{n} = \langle {{a}}, {{b}}, {{c}} \rangle$.'
      - 'Distance $= \dfrac{|ax_0 + by_0 + cz_0 - d|}{|\mathbf{n}|}$: the component of $\overrightarrow{QP}$ along $\mathbf{n}$, for any point $Q$ on the plane.'
    solution: |
      Take any point $Q$ on the plane; the distance is the length of the projection of $\overrightarrow{QP}$ onto the unit normal
      $\mathbf{n}/|\mathbf{n}|$, which works out to
      $$\frac{|{{a}}\cdot({{p1}}) + ({{b}})({{p2}}) + ({{c}})({{p3}}) - ({{d}})|}{\sqrt{ {{a^2}} + {{b^2}} + {{c^2}} }} = \frac{ {{abs(num)}} }{\sqrt{ {{a^2 + b^2 + c^2}} }} \approx {{abs(num) / len}}.$$
    verify: "(lambda s: abs(s)*sqrt(a**2 + b**2 + c**2))(solve(a*(p1 + a*Symbol('s')) + b*(p2 + b*Symbol('s')) + c*(p3 + c*Symbol('s')) - d, Symbol('s'))[0])"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 4

  - id: calc-vec-012
    difficulty: 3
    type: proof
    prompt: |
      Prove Lagrange's identity: for vectors $\mathbf{a}, \mathbf{b}$ in $\mathbb{R}^3$,
      $$|\mathbf{a}\times\mathbf{b}|^2 + (\mathbf{a}\cdot\mathbf{b})^2 = |\mathbf{a}|^2\,|\mathbf{b}|^2 .$$
    hints:
      - 'If either vector is $\mathbf{0}$ both sides are $0$. Otherwise let $\theta$ be the angle between them.'
      - 'Use $|\mathbf{a}\times\mathbf{b}| = |\mathbf{a}||\mathbf{b}|\sin\theta$ and $\mathbf{a}\cdot\mathbf{b} = |\mathbf{a}||\mathbf{b}|\cos\theta$.'
    solution: |
      If $\mathbf{a} = \mathbf{0}$ or $\mathbf{b} = \mathbf{0}$, both sides are $0$. Otherwise, with $\theta \in [0, \pi]$ the angle between them,
      $|\mathbf{a}\times\mathbf{b}| = |\mathbf{a}||\mathbf{b}|\sin\theta$ and $\mathbf{a}\cdot\mathbf{b} = |\mathbf{a}||\mathbf{b}|\cos\theta$, so
      $$|\mathbf{a}\times\mathbf{b}|^2 + (\mathbf{a}\cdot\mathbf{b})^2 = |\mathbf{a}|^2|\mathbf{b}|^2(\sin^2\theta + \cos^2\theta) = |\mathbf{a}|^2|\mathbf{b}|^2 .$$
      (A proof from components also works: expand $(a_2b_3 - a_3b_2)^2 + (a_3b_1 - a_1b_3)^2 + (a_1b_2 - a_2b_1)^2 + (a_1b_1 + a_2b_2 + a_3b_3)^2$;
      the cross terms $\pm 2a_ia_jb_ib_j$ cancel and what remains is $(a_1^2 + a_2^2 + a_3^2)(b_1^2 + b_2^2 + b_3^2)$.) $\blacksquare$
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 6

  - id: calc-vec-013
    difficulty: 4
    type: multipart
    prompt: |
      The line $\mathbf{r}(t) = \langle {{p1}}, {{p2}}, {{p3}} \rangle + t\,\langle {{v1}}, {{v2}}, {{v3}} \rangle$ meets the plane
      ${{a}}x {{signed: b}}y {{signed: c}}z = {{D}}$ at one point.
    params:
      p1: { int: [-3, 3] }
      p2: { int: [-3, 3] }
      p3: { int: [-3, 3] }
      v1: { int: [-3, 3] }
      v2: { int: [-3, 3] }
      v3: { int: [-3, 3] }
      a: { int: [-3, 3], not: [0, 1, -1] }
      b: { int: [-3, 3], not: [0, 1, -1] }
      c: { int: [-3, 3], not: [0, 1, -1] }
      t0: { int: [-3, 3] }
    let:
      D: "a*(p1 + t0*v1) + b*(p2 + t0*v2) + c*(p3 + t0*v3)"
      nv: "a*v1 + b*v2 + c*v3"
    require: ["nv != 0"]
    parts:
      - prompt: "(a) For which value of $t$ does the line meet the plane?"
        type: numeric
        answer: "t0"
        verify: "solve(a*(p1 + Symbol('s')*v1) + b*(p2 + Symbol('s')*v2) + c*(p3 + Symbol('s')*v3) - (a*(p1 + t0*v1) + b*(p2 + t0*v2) + c*(p3 + t0*v3)), Symbol('s'))[0]"
      - prompt: "(b) What is the point of intersection? Enter it as a list such as `1, 0, -2`."
        type: vector
        answer: "[p1, p2, p3] + part1 * [v1, v2, v3]"
        verify: "(lambda s: [p1 + s*v1, p2 + s*v2, p3 + s*v3])(solve(a*(p1 + Symbol('s')*v1) + b*(p2 + Symbol('s')*v2) + c*(p3 + Symbol('s')*v3) - (a*(p1 + t0*v1) + b*(p2 + t0*v2) + c*(p3 + t0*v3)), Symbol('s'))[0])"
    hints:
      - 'Substitute $x = {{p1}} {{signed: v1}}t$, $y = {{p2}} {{signed: v2}}t$, $z = {{p3}} {{signed: v3}}t$ into the equation of the plane.'
      - 'You get a linear equation in $t$: $({{a*p1 + b*p2 + c*p3}}) + ({{nv}})\,t = {{D}}$.'
    solution: |
      **(a)** Substituting the line into the plane:
      $${{a}}({{p1}} {{signed: v1}}t) + ({{b}})({{p2}} {{signed: v2}}t) + ({{c}})({{p3}} {{signed: v3}}t) = {{D}}
        \;\Longrightarrow\; {{a*p1 + b*p2 + c*p3}} + ({{nv}})\,t = {{D}} \;\Longrightarrow\; t = {{t0}}.$$
      (The coefficient of $t$ is $\mathbf{n}\cdot\mathbf{v} = {{nv}} \ne 0$: the line is not parallel to the plane, so there is exactly one point.)

      **(b)** At $t = {{t0}}$: $\mathbf{r}({{t0}}) = {{row: [p1 + t0*v1, p2 + t0*v2, p3 + t0*v3]}}$.
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 6

  - id: calc-vec-014
    difficulty: 4
    type: numeric
    prompt: |
      Find the shortest distance between the lines
      $$L_1:\ \langle {{p1}}, {{p2}}, {{p3}} \rangle + s\,\langle {{u1}}, {{u2}}, {{u3}} \rangle, \qquad
        L_2:\ \langle {{q1}}, {{q2}}, {{q3}} \rangle + t\,\langle {{v1}}, {{v2}}, {{v3}} \rangle .$$
      Give it to 4 significant figures.
    params:
      p1: { int: [-3, 3] }
      p2: { int: [-3, 3] }
      p3: { int: [-3, 3] }
      q1: { int: [-3, 3] }
      q2: { int: [-3, 3] }
      q3: { int: [-3, 3] }
      u1: { int: [-2, 2] }
      u2: { int: [-2, 2] }
      u3: { int: [1, 2] }
      v1: { int: [-2, 2] }
      v2: { int: [1, 2] }
      v3: { int: [-2, 2] }
    let:
      n: "cross([u1, u2, u3], [v1, v2, v3])"
      w: "[q1 - p1, q2 - p2, q3 - p3]"
      dist: "abs(dot(w, n)) / norm(n)"
    require: ["norm(n) > 0", "dot(w, n) != 0"]
    answer: "dist"
    hints:
      - 'The common perpendicular to both lines is along $\mathbf{n} = \mathbf{u}\times\mathbf{v}$.'
      - 'Project the vector joining a point of $L_1$ to a point of $L_2$ onto $\mathbf{n}$.'
    solution: |
      $\mathbf{n} = \mathbf{u}\times\mathbf{v} = {{row: n}}$ is perpendicular to both lines. The vector from the point of $L_1$ to the point of $L_2$ is
      $\mathbf{w} = {{row: w}}$. The distance is the length of the projection of $\mathbf{w}$ onto $\mathbf{n}$:
