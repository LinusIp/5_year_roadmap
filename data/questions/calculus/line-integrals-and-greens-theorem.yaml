subject: calculus
topic: line-integrals-and-greens-theorem
questions:
  - id: calc-green-001
    difficulty: 1
    type: mc
    prompt: |
      $C$ is the boundary of a region $R$ in the plane, traversed counterclockwise, and $P$, $Q$ have continuous partial derivatives on and
      inside $C$. Which of these is Green's theorem?
    options:
      - "$\\displaystyle\\oint_C P\\,dx + Q\\,dy = \\iint_R \\left(\\frac{\\partial Q}{\\partial x} - \\frac{\\partial P}{\\partial y}\\right) dA$"
      - "$\\displaystyle\\oint_C P\\,dx + Q\\,dy = \\iint_R \\left(\\frac{\\partial P}{\\partial x} - \\frac{\\partial Q}{\\partial y}\\right) dA$"
      - "$\\displaystyle\\oint_C P\\,dx + Q\\,dy = \\iint_R \\left(\\frac{\\partial P}{\\partial y} - \\frac{\\partial Q}{\\partial x}\\right) dA$"
      - "$\\displaystyle\\oint_C P\\,dx + Q\\,dy = \\iint_R \\left(\\frac{\\partial P}{\\partial x} + \\frac{\\partial Q}{\\partial y}\\right) dA$"
    answer: 0
    hints:
      - 'Test the formula on $\mathbf{F} = \langle -y, x \rangle$ around the unit circle: the line integral is $2\pi$.'
    solution: |
      Green's theorem (circulation form): $\displaystyle\oint_C P\,dx + Q\,dy = \iint_R (Q_x - P_y)\,dA$, with $C$ positively oriented
      (the region on the left). Check with $\mathbf{F} = \langle -y, x \rangle$ on the unit disk: $Q_x - P_y = 2$, so the right side is $2\pi$,
      which matches $\oint_C -y\,dx + x\,dy = \int_0^{2\pi} (\sin^2 t + \cos^2 t)\,dt = 2\pi$. The last option is the flux (normal) form's integrand,
      which belongs with $\oint_C \mathbf{F}\cdot\mathbf{n}\,ds$, not with $\oint P\,dx + Q\,dy$.
    verify: "(lambda P, Q: [integrate(e, (x, 0, 1), (y, 0, 1)) for e in [diff(Q, x) - diff(P, y), diff(P, x) - diff(Q, y), diff(P, y) - diff(Q, x), diff(P, x) + diff(Q, y)]].index(integrate(P.subs(y, 0), (x, 0, 1)) + integrate(Q.subs(x, 1), (y, 0, 1)) - integrate(P.subs(y, 1), (x, 0, 1)) - integrate(Q.subs(x, 0), (y, 0, 1))))(x*y**2 + 3*y, x**3 + y)"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 2

  - id: calc-green-002
    difficulty: 1
    type: numeric
    prompt: |
      Find the work done by the constant force field $\mathbf{F} = \langle {{a}}, {{b}} \rangle$ on a particle moving in a straight line from
      $({{x0}}, {{y0}})$ to $({{x1}}, {{y1}})$.
    params:
      a: { int: [-5, 5], not: [0] }
      b: { int: [-5, 5], not: [0] }
      x0: { int: [-3, 3] }
      y0: { int: [-3, 3] }
      x1: { int: [-3, 3] }
      y1: { int: [-3, 3] }
    answer: "a*(x1 - x0) + b*(y1 - y0)"
    hints:
      - 'For a constant field, $W = \int_C \mathbf{F}\cdot d\mathbf{r} = \mathbf{F}\cdot\Delta\mathbf{r}$.'
    solution: |
      The displacement is $\Delta\mathbf{r} = \langle {{x1 - x0}}, {{y1 - y0}} \rangle$, and since $\mathbf{F}$ is constant,
      $$W = \mathbf{F}\cdot\Delta\mathbf{r} = ({{a}})({{x1 - x0}}) + ({{b}})({{y1 - y0}}) = {{a*(x1 - x0) + b*(y1 - y0)}}.$$
    verify: "(lambda X, Y: integrate(a*diff(X, t) + b*diff(Y, t), (t, 0, 1)))(x0 + (x1 - x0)*t, y0 + (y1 - y0)*t**2)"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 2

  - id: calc-green-003
    difficulty: 2
    type: numeric
    prompt: |
      Let $\mathbf{F} = \langle {{p}}y, {{q}}x \rangle$ and let $C$ be the parabola $y = x^2$ from $(0, 0)$ to $({{a}}, {{a^2}})$.
      Compute $\displaystyle\int_C \mathbf{F}\cdot d\mathbf{r}$. Give the exact value or a decimal to 4 significant figures.
    params:
      p: { int: [-4, 4], not: [0, 1, -1] }
      q: { int: [-4, 4], not: [0, 1, -1] }
      a: { int: [1, 3] }
    answer: "(p + 2*q) * a^3 / 3"
    hints:
      - 'Parametrise by $x = t$, $y = t^2$, $0 \le t \le {{a}}$; then $dx = dt$ and $dy = 2t\,dt$.'
      - '$\mathbf{F}\cdot d\mathbf{r} = {{p}}y\,dx + ({{q}})x\,dy$.'
    solution: |
      With $x = t$, $y = t^2$ ($0 \le t \le {{a}}$): $dx = dt$, $dy = 2t\,dt$, so
      $$\int_C {{p}}y\,dx + ({{q}})x\,dy = \int_0^{ {{a}} } \left({{p}}t^2 + ({{q}})\,t\cdot 2t\right)dt = ({{p + 2*q}})\int_0^{ {{a}} } t^2\,dt = \frac{ ({{p + 2*q}})\cdot{{a^3}} }{3} = {{frac: (p + 2*q)*a^3/3}}.$$
    verify: "integrate(p*t**2*diff(t, t) + q*t*diff(t**2, t), (t, 0, a))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 3

  - id: calc-green-004
    difficulty: 2
    type: numeric
    prompt: |
      Let $C$ be the upper half of the circle $x^2 + y^2 = {{R^2}}$. Compute the scalar line integral $\displaystyle\int_C ({{k}}y + {{m}})\, ds$.
      Give it to 4 significant figures.
    params:
      R: { int: [1, 4] }
      k: { int: [1, 5] }
      m: { int: [1, 5] }
    answer: "2*k*R^2 + m*pi*R"
    hints:
      - 'Parametrise $x = {{R}}\cos t$, $y = {{R}}\sin t$, $0 \le t \le \pi$; then $ds = {{R}}\,dt$.'
      - '$\int_0^\pi \sin t\,dt = 2$.'
    solution: |
      With $x = {{R}}\cos t$, $y = {{R}}\sin t$ for $0 \le t \le \pi$, $ds = |\mathbf{r}'(t)|\,dt = {{R}}\,dt$:
      $$\int_C ({{k}}y + {{m}})\,ds = \int_0^{\pi} ({{k*R}}\sin t + {{m}})\,{{R}}\,dt = {{k*R^2}}\cdot 2 + {{m*R}}\pi = {{2*k*R^2}} + {{m*R}}\pi \approx {{2*k*R^2 + m*pi*R}}.$$
    verify: "integrate((k*R*sin(t) + m)*sqrt(diff(R*cos(t), t)**2 + diff(R*sin(t), t)**2), (t, 0, pi))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 3

  - id: calc-green-005
    difficulty: 2
    type: mc
    prompt: |
      $\mathbf{F} = \langle P, Q \rangle$ has continuous partial derivatives on the whole plane. Which condition guarantees that
      $\int_C \mathbf{F}\cdot d\mathbf{r}$ depends only on the endpoints of $C$?
    options:
      - "$\\dfrac{\\partial P}{\\partial y} = \\dfrac{\\partial Q}{\\partial x}$ everywhere"
      - "$\\dfrac{\\partial P}{\\partial x} = \\dfrac{\\partial Q}{\\partial y}$ everywhere"
      - "$\\dfrac{\\partial P}{\\partial x} + \\dfrac{\\partial Q}{\\partial y} = 0$ everywhere"
      - "$P$ and $Q$ are both bounded"
    answer: 0
    hints:
      - 'Path independence means $\mathbf{F} = \nabla f$. What does equality of mixed partials $f_{xy} = f_{yx}$ say about $P = f_x$ and $Q = f_y$?'
    solution: |
      If $\mathbf{F} = \nabla f$, then $P_y = f_{xy} = f_{yx} = Q_x$. Conversely, on a simply connected domain such as the whole plane,
      $P_y = Q_x$ makes $\oint_C \mathbf{F}\cdot d\mathbf{r} = \iint (Q_x - P_y)\,dA = 0$ around every simple closed curve (Green), which is
      equivalent to path independence. So the test is $P_y = Q_x$ (that is, $\operatorname{curl}\mathbf{F} = 0$).
    verify: "(lambda P, Q: 0 if diff(P, y) == diff(Q, x) and integrate(P.subs({x: t, y: t}) + Q.subs({x: t, y: t}), (t, 0, 1)) == integrate(P.subs(y, 0), (x, 0, 1)) + integrate(Q.subs(x, 1), (y, 0, 1)) else 1)(2*x*y + 1, x**2 + 3*y**2)"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 2

  - id: calc-green-006
    difficulty: 3
    type: numeric
    prompt: |
      Let $\mathbf{F} = \langle {{2*a}}xy {{signed: b}},\ {{a}}x^2 {{signed: 3*c}}y^2 \rangle$. Compute $\displaystyle\int_C \mathbf{F}\cdot d\mathbf{r}$, where $C$ is any
      path from $({{x0}}, {{y0}})$ to $({{x1}}, {{y1}})$.
    params:
      a: { int: [-3, 3], not: [0, 1, -1] }
      b: { int: [-5, 5], not: [0] }
      c: { int: [-2, 2], not: [0, 1, -1] }
      x0: { int: [-2, 2] }
      y0: { int: [-2, 2] }
      x1: { int: [-2, 2] }
      y1: { int: [-2, 2] }
    let:
      f1: "a*x1^2*y1 + b*x1 + c*y1^3"
      f0: "a*x0^2*y0 + b*x0 + c*y0^3"
    require: ["f1 != f0"]
    answer: "f1 - f0"
    hints:
      - 'Check $P_y = Q_x$: the field is conservative, so find $f$ with $\nabla f = \mathbf{F}$.'
      - '$f = {{a}}x^2y {{signed: b}}x {{signed: c}}y^3$ works. Then $\int_C \mathbf{F}\cdot d\mathbf{r} = f(\text{end}) - f(\text{start})$.'
    solution: |
      $P_y = {{2*a}}x = Q_x$, so $\mathbf{F}$ is conservative. Integrating $P$ in $x$: $f = {{a}}x^2y {{signed: b}}x + g(y)$, and $f_y = {{a}}x^2 + g'(y) = Q$
      gives $g'(y) = {{3*c}}y^2$, $g = {{c}}y^3$. So $f = {{a}}x^2y {{signed: b}}x {{signed: c}}y^3$ and, by the fundamental theorem for line integrals,
      $$\int_C \mathbf{F}\cdot d\mathbf{r} = f({{x1}}, {{y1}}) - f({{x0}}, {{y0}}) = ({{f1}}) - ({{f0}}) = {{f1 - f0}}.$$
    verify: "(lambda P, Q: integrate(P.subs({x: x0 + (x1 - x0)*t, y: y0 + (y1 - y0)*t})*(x1 - x0) + Q.subs({x: x0 + (x1 - x0)*t, y: y0 + (y1 - y0)*t})*(y1 - y0), (t, 0, 1)))(2*a*x*y + b, a*x**2 + 3*c*y**2)"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 4

  - id: calc-green-007
    difficulty: 3
    type: expression
    prompt: |
      The field $\mathbf{F} = \langle {{2*a}}xy {{signed: b}},\ {{a}}x^2 {{signed: 3*c}}y^2 \rangle$ is conservative. Find its potential $f(x, y)$ with
      $\nabla f = \mathbf{F}$ and $f(0, 0) = 0$. Enter an expression in $x$ and $y$.
    params:
      a: { int: [-3, 3], not: [0, 1, -1] }
      b: { int: [-5, 5], not: [0] }
      c: { int: [-2, 2], not: [0, 1, -1] }
    answer: "a*x^2*y + b*x + c*y^3"
    vars: [x, y]
    hints:
      - 'Integrate $P = f_x$ with respect to $x$; the "constant" of integration may depend on $y$: $f = {{a}}x^2y {{signed: b}}x + g(y)$.'
      - 'Differentiate in $y$ and compare with $Q$ to find $g''(y)$.'
    solution: |
      From $f_x = {{2*a}}xy {{signed: b}}$: $f = {{a}}x^2y {{signed: b}}x + g(y)$. Then $f_y = {{a}}x^2 + g'(y)$ must equal ${{a}}x^2 {{signed: 3*c}}y^2$, so
      $g'(y) = {{3*c}}y^2$ and $g(y) = {{c}}y^3 + K$. The condition $f(0, 0) = 0$ gives $K = 0$:
      $$f(x, y) = {{a}}x^2y {{signed: b}}x {{signed: c}}y^3 .$$
    verify: "(lambda s: integrate((2*a*x*y + b).subs({x: s*x, y: s*y}, simultaneous=True)*x + (a*x**2 + 3*c*y**2).subs({x: s*x, y: s*y}, simultaneous=True)*y, (s, 0, 1)))(Symbol('s'))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 4

  - id: calc-green-008
    difficulty: 3
    type: numeric
    prompt: |
      Let $C$ be the boundary of the rectangle $[0, {{a}}] \times [0, {{b}}]$, traversed counterclockwise. Use Green's theorem to compute
      $$\oint_C {{p}}y\, dx + {{q}}x\, dy .$$
    params:
      a: { int: [1, 5] }
      b: { int: [1, 5] }
      p: { int: [-4, 4], not: [0, 1, -1] }
      q: { int: [-4, 4], not: [0, 1, -1] }
    answer: "(q - p) * a * b"
    hints:
      - 'With $P = {{p}}y$ and $Q = {{q}}x$: $Q_x - P_y = {{q}} - ({{p}})$.'
      - 'A constant integrand integrates to (constant) $\times$ (area).'
    solution: |
      Green: $\displaystyle\oint_C P\,dx + Q\,dy = \iint_R (Q_x - P_y)\,dA$ with $Q_x - P_y = {{q}} - ({{p}}) = {{q - p}}$, a constant. The rectangle has area ${{a*b}}$, so
      $$\oint_C {{p}}y\,dx + {{q}}x\,dy = {{q - p}}\cdot{{a*b}} = {{(q - p)*a*b}}.$$
    verify: "(lambda s: sum(integrate(p*(Y0 + (Y1 - Y0)*s)*(X1 - X0) + q*(X0 + (X1 - X0)*s)*(Y1 - Y0), (s, 0, 1)) for (X0, Y0, X1, Y1) in [(0, 0, a, 0), (a, 0, a, b), (a, b, 0, b), (0, b, 0, 0)]))(Symbol('s'))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 3

  - id: calc-green-009
    difficulty: 3
    type: numeric
    prompt: |
      Use Green's theorem, in the form $\text{Area} = \dfrac12\displaystyle\oint_C x\,dy - y\,dx$, to find the area enclosed by the ellipse
      $x = {{A}}\cos t$, $y = {{B}}\sin t$, $0 \le t \le 2\pi$. Give it to 4 significant figures.
    params:
      A: { int: [2, 6] }
      B: { int: [2, 6] }
    answer: "pi * A * B"
    hints:
      - 'Why does it work? For $P = -\frac{y}{2}$, $Q = \frac{x}{2}$, $Q_x - P_y = 1$.'
      - '$x\,dy - y\,dx = ({{A}}\cos t)({{B}}\cos t)\,dt - ({{B}}\sin t)(-{{A}}\sin t)\,dt = {{A*B}}\,dt$.'
    solution: |
      With $P = -y/2$ and $Q = x/2$, $Q_x - P_y = 1$, so Green's theorem gives $\frac12\oint_C x\,dy - y\,dx = \iint_R 1\,dA = \text{Area}$. On the ellipse,
      $$x\,dy - y\,dx = {{A}}\cos t\cdot{{B}}\cos t\,dt + {{B}}\sin t\cdot{{A}}\sin t\,dt = {{A*B}}\,dt,$$
      so the area is $\frac12\int_0^{2\pi} {{A*B}}\,dt = {{A*B}}\pi \approx {{pi*A*B}}$.
    verify: "integrate(2*B*sqrt(1 - x**2/A**2), (x, -A, A))"
    source: "Adapted from MIT OCW 18.02SC, Part V: Green's theorem (area)"
    license: CC BY-NC-SA 4.0
    estMinutes: 4

  - id: calc-green-010
    difficulty: 4
    type: numeric
    prompt: |
      Let $C$ be the circle $x^2 + y^2 = {{R^2}}$, counterclockwise. Compute
      $$\oint_C -{{p}}x^2y\, dx + {{q}}xy^2\, dy .$$
      Give it to 4 significant figures.
    params:
      R: { int: [1, 3] }
      p: { int: [1, 4] }
      q: { int: [1, 4] }
    answer: "(p + q) * pi * R^4 / 4"
    hints:
      - 'Green: $Q_x - P_y = {{q}}y^2 + {{p}}x^2$.'
      - 'In polar coordinates over the disk, $\iint x^2\,dA = \iint y^2\,dA = \frac{\pi R^4}{4}$.'
    solution: |
      With $P = -{{p}}x^2y$ and $Q = {{q}}xy^2$: $Q_x - P_y = {{q}}y^2 + {{p}}x^2$. By symmetry and polar coordinates,
      $\iint_D x^2\,dA = \iint_D y^2\,dA = \frac12\iint_D r^2\,dA = \frac12\int_0^{2\pi}\!\!\int_0^{ {{R}} } r^3\,dr\,d\theta = \frac{\pi\cdot{{R^4}}}{4}$. Hence
      $$\oint_C P\,dx + Q\,dy = ({{p}} + {{q}})\frac{\pi\cdot{{R^4}}}{4} = \frac{ {{(p + q)*R^4}}\pi}{4} \approx {{(p + q)*pi*R^4/4}}.$$
    verify: "(lambda X, Y: integrate(-p*X**2*Y*diff(X, t) + q*X*Y**2*diff(Y, t), (t, 0, 2*pi)))(R*cos(t), R*sin(t))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 5

  - id: calc-green-011
    difficulty: 4
    type: mc
    prompt: |
      Let $\mathbf{F} = \left\langle \dfrac{-y}{x^2 + y^2}, \dfrac{x}{x^2 + y^2} \right\rangle$. One checks that $Q_x - P_y = 0$ wherever $\mathbf{F}$
      is defined, yet $\oint_C \mathbf{F}\cdot d\mathbf{r} = 2\pi$ around the unit circle. Why does this not contradict Green's theorem?
    options:
      - "$\\mathbf{F}$ is undefined at the origin, which lies inside the circle, so Green's theorem does not apply to the unit disk."
      - "Green's theorem only applies to clockwise curves."
      - "The computation $Q_x - P_y = 0$ is wrong; it equals $2$."
      - "Green's theorem only applies to conservative fields."
    answer: 0
    hints:
      - 'Green''s theorem needs $P$ and $Q$ to have continuous partial derivatives on the **whole** region enclosed by $C$.'
    solution: |
      Green's theorem requires $P$, $Q$ to be continuously differentiable everywhere on the region $R$ bounded by $C$. Here $R$ is the unit
      disk, which contains the origin, where $\mathbf{F}$ is not even defined. So the theorem says nothing, and indeed the circulation $2\pi$
      differs from $\iint 0\,dA = 0$. The domain of $\mathbf{F}$ (the plane minus a point) is not simply connected; $\mathbf{F}$ has zero curl
      but is not conservative there.
    verify: "0 if integrate((-sin(t))*(-sin(t)) + cos(t)*cos(t), (t, 0, 2*pi)) == 2*pi and simplify(diff(x/(x**2 + y**2), x) - diff(-y/(x**2 + y**2), y)) == 0 else 1"
    source: "Adapted from MIT OCW 18.02SC, Part V: Green's theorem (simply connected regions)"
    license: CC BY-NC-SA 4.0
    estMinutes: 3

  - id: calc-green-012
    difficulty: 4
    type: multipart
    prompt: |
      Let $\mathbf{F} = \langle {{a}}x {{signed: c}}y,\ {{d}}x {{signed: b}}y \rangle$ and let $C$ be the circle $x^2 + y^2 = {{R^2}}$, counterclockwise.
      Give each answer to 4 significant figures.
    params:
      a: { int: [-3, 3], not: [0, 1, -1] }
      b: { int: [-3, 3], not: [0, 1, -1] }
      c: { int: [-3, 3], not: [0, 1, -1] }
      d: { int: [-3, 3], not: [0, 1, -1] }
      R: { int: [1, 3] }
    require: ["d != c", "a + b != 0"]
    parts:
      - prompt: "(a) What is the circulation $\\displaystyle\\oint_C \\mathbf{F}\\cdot d\\mathbf{r}$?"
        type: numeric
        answer: "(d - c) * pi * R^2"
        verify: "(lambda X, Y: integrate((a*X + c*Y)*diff(X, t) + (d*X + b*Y)*diff(Y, t), (t, 0, 2*pi)))(R*cos(t), R*sin(t))"
      - prompt: "(b) What is the outward flux $\\displaystyle\\oint_C \\mathbf{F}\\cdot\\mathbf{n}\\, ds$?"
        type: numeric
        answer: "(a + b) * pi * R^2"
        verify: "(lambda X, Y: integrate((a*X + c*Y)*diff(Y, t) - (d*X + b*Y)*diff(X, t), (t, 0, 2*pi)))(R*cos(t), R*sin(t))"
    hints:
      - 'Circulation form: $\oint_C \mathbf{F}\cdot d\mathbf{r} = \iint_R (Q_x - P_y)\,dA$.'
      - 'Flux (normal) form: $\oint_C \mathbf{F}\cdot\mathbf{n}\,ds = \oint_C P\,dy - Q\,dx = \iint_R (P_x + Q_y)\,dA$.'
    solution: |
      Here $P = {{a}}x {{signed: c}}y$ and $Q = {{d}}x {{signed: b}}y$, and the disk has area ${{R^2}}\pi$.

      **(a)** $Q_x - P_y = {{d}} - ({{c}}) = {{d - c}}$, so the circulation is ${{d - c}}\cdot{{R^2}}\pi \approx {{(d - c)*pi*R^2}}$.

      **(b)** $\operatorname{div}\mathbf{F} = P_x + Q_y = {{a}} + ({{b}}) = {{a + b}}$, so the outward flux is ${{a + b}}\cdot{{R^2}}\pi \approx {{(a + b)*pi*R^2}}$.
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 6

  - id: calc-green-013
    difficulty: 4
    type: numeric
    prompt: |
      Let $C$ be the upper half of the circle $x^2 + y^2 = {{R^2}}$, from $({{R}}, 0)$ to $({{-R}}, 0)$. Compute
      $$\int_C ({{p}}y + x^2)\, dx + ({{q}}x + y^3)\, dy$$
      by closing the curve with a segment of the $x$-axis and using Green's theorem. Give it to 4 significant figures.
    params:
      R: { int: [1, 3] }
      p: { int: [-3, 3], not: [0, 1, -1] }
      q: { int: [-3, 3], not: [0, 1, -1] }
    require: ["p != q"]
    answer: "(q - p) * pi * R^2 / 2 - 2 * R^3 / 3"
    hints:
      - 'The semicircle followed by the segment from $({{-R}}, 0)$ to $({{R}}, 0)$ is the counterclockwise boundary of the half-disk $D$.'
      - '$\iint_D (Q_x - P_y)\,dA = ({{q}} - ({{p}}))\cdot\frac{\pi\cdot{{R^2}}}{2}$. On the segment $y = 0$, $dy = 0$ and the integrand is $x^2\,dx$.'
    solution: |
      Let $L$ be the segment from $({{-R}}, 0)$ to $({{R}}, 0)$. Then $C + L$ bounds the half-disk $D$ counterclockwise, and with
      $Q_x - P_y = {{q}} - ({{p}}) = {{q - p}}$:
      $$\int_C + \int_L = \iint_D {{q - p}}\,dA = {{q - p}}\cdot\frac{ {{R^2}}\pi}{2}.$$
      On $L$, $y = 0$ and $dy = 0$, so $\int_L = \int_{-{{R}}}^{ {{R}} } x^2\,dx = \frac{2\cdot{{R^3}}}{3}$. Hence
      $$\int_C = \frac{ {{(q - p)*R^2}}\pi}{2} - \frac{ {{2*R^3}} }{3} \approx {{(q - p)*pi*R^2/2 - 2*R^3/3}}.$$
    verify: "(lambda X, Y: integrate((p*Y + X**2)*diff(X, t) + (q*X + Y**3)*diff(Y, t), (t, 0, pi)))(R*cos(t), R*sin(t))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 7

  - id: calc-green-014
    difficulty: 3
    type: proof
    prompt: |
      Let $\mathbf{F} = \langle P, Q \rangle$ have continuous partial derivatives on the whole plane with $P_y = Q_x$ everywhere. Using Green's
      theorem, show that $\int_{C_1} \mathbf{F}\cdot d\mathbf{r} = \int_{C_2} \mathbf{F}\cdot d\mathbf{r}$ for any two paths $C_1$, $C_2$ from $A$ to $B$
      that together bound a region (i.e. do not cross each other).
    hints:
      - '$C_1$ followed by $C_2$ reversed is a closed curve.'
      - 'Apply Green''s theorem to the region it encloses; mind the orientation.'
    solution: |
      Let $C = C_1 - C_2$ ($C_1$ followed by $C_2$ traversed backwards). It is a simple closed curve bounding a region $R$. If $C$ is counterclockwise,
      Green's theorem gives
      $$\oint_C \mathbf{F}\cdot d\mathbf{r} = \iint_R (Q_x - P_y)\,dA = \iint_R 0\,dA = 0;$$
      if it is clockwise, the same holds with a minus sign, still $0$. Since $\oint_C = \int_{C_1} - \int_{C_2}$, we get
      $\int_{C_1}\mathbf{F}\cdot d\mathbf{r} = \int_{C_2}\mathbf{F}\cdot d\mathbf{r}$. (Paths that cross can be compared via a third path that crosses neither,
      so in fact $\mathbf{F}$ is path independent, i.e. conservative.) $\blacksquare$
