subject: calculus
topic: partial-derivatives-and-gradients
questions:
  - id: calc-partial-001
    difficulty: 1
    type: expression
    prompt: |
      Let $f(x, y) = {{a}}x^{ {{m}} }y^{ {{n}} } {{signed: b}}y$. Find $\dfrac{\partial f}{\partial x}$.
      Enter an expression in $x$ and $y$, such as `6x^2 y^3`.
    params:
      a: { int: [2, 6] }
      m: { int: [2, 4] }
      n: { int: [2, 4] }
      b: { int: [-5, 5], not: [0] }
    answer: "a*m*x^(m-1)*y^n"
    vars: [x, y]
    hints:
      - 'Treat $y$ as a constant and differentiate with respect to $x$.'
      - 'The term ${{b}}y$ does not depend on $x$.'
    solution: |
      Holding $y$ fixed, ${{a}}y^{ {{n}} }$ is a constant factor and ${{b}}y$ is a constant term, so
      $$\frac{\partial f}{\partial x} = {{a}}\cdot{{m}}\,x^{ {{m - 1}} }y^{ {{n}} } + 0 = {{a*m}}x^{ {{m - 1}} }y^{ {{n}} }.$$
    verify: "diff(a*x**m*y**n + b*y, x)"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 2

  - id: calc-partial-002
    difficulty: 1
    type: mc
    prompt: |
      What does the partial derivative $f_x(a, b)$ measure?
    options:
      - "The rate of change of $f$ as $x$ varies through $a$ while $y$ is held fixed at $b$."
      - "The rate of change of $f$ in the direction of the gradient at $(a, b)$."
      - "The rate of change of $f$ as both $x$ and $y$ increase at the same rate."
      - "The value of $f$ at $(a, b)$ divided by $a$."
    answer: 0
    hints:
      - 'Recall the definition $f_x(a, b) = \lim_{h \to 0} \frac{f(a + h, b) - f(a, b)}{h}$.'
    solution: |
      By definition $f_x(a, b) = \lim_{h \to 0} \dfrac{f(a + h, b) - f(a, b)}{h}$: only $x$ moves, $y$ stays at $b$.
      Geometrically it is the slope of the curve cut from the graph $z = f(x, y)$ by the vertical plane $y = b$.
    verify: "0 if limit(((1 + Symbol('h'))**2*2 - 2)/Symbol('h'), Symbol('h'), 0) == diff(x**2*y, x).subs({x: 1, y: 2}) else 1"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 1

  - id: calc-partial-003
    difficulty: 2
    type: expression
    prompt: |
      Let $f(x, y) = e^{ {{a}}xy } {{signed: b}}x^2y$. Find $\dfrac{\partial f}{\partial y}$.
      Enter an expression in $x$ and $y$, such as `2x e^(3x y) + x^2`.
    params:
      a: { int: [2, 5] }
      b: { int: [-5, 5], not: [0] }
    answer: "a*x*e^(a*x*y) + b*x^2"
    vars: [x, y]
    domain: [-1, 1]
    hints:
      - 'Hold $x$ constant.'
      - 'Chain rule: $\frac{\partial}{\partial y} e^{ {{a}}xy } = {{a}}x\,e^{ {{a}}xy }$.'
    solution: |
      With $x$ held constant, the exponent ${{a}}xy$ has $y$-derivative ${{a}}x$, and $x^2y$ has $y$-derivative $x^2$:
      $$\frac{\partial f}{\partial y} = {{a}}x\,e^{ {{a}}xy } {{signed: b}}x^2 .$$
    verify: "diff(exp(a*x*y) + b*x**2*y, y)"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 2

  - id: calc-partial-004
    difficulty: 2
    type: vector
    prompt: |
      Let $f(x, y) = {{a}}x^2y {{signed: b}}y^3 {{signed: c}}x$. Find $\nabla f({{p}}, {{q}})$.
      Enter it as a list such as `3, -2`.
    params:
      a: { int: [-4, 4], not: [0, 1, -1] }
      b: { int: [-3, 3], not: [0, 1, -1] }
      c: { int: [-6, 6], not: [0] }
      p: { int: [-3, 3] }
      q: { int: [-3, 3] }
    answer: "[2*a*p*q + c, a*p^2 + 3*b*q^2]"
    hints:
      - '$\nabla f = \langle f_x, f_y \rangle$.'
      - '$f_x = {{2*a}}xy {{signed: c}}$ and $f_y = {{a}}x^2 {{signed: 3*b}}y^2$.'
    solution: |
      $$f_x = {{2*a}}xy {{signed: c}}, \qquad f_y = {{a}}x^2 {{signed: 3*b}}y^2 .$$
      At $({{p}}, {{q}})$: $f_x = {{2*a}}({{p}})({{q}}) {{signed: c}} = {{2*a*p*q + c}}$ and $f_y = {{a}}({{p}})^2 {{signed: 3*b}}({{q}})^2 = {{a*p^2 + 3*b*q^2}}$, so
      $$\nabla f({{p}}, {{q}}) = \langle {{2*a*p*q + c}}, {{a*p^2 + 3*b*q^2}} \rangle .$$
    verify: "[diff(a*x**2*y + b*y**3 + c*x, v).subs({x: p, y: q}) for v in (x, y)]"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 3

  - id: calc-partial-005
    difficulty: 2
    type: expression
    prompt: |
      Let $f(x, y) = x^{ {{m}} }e^{ {{a}}y } {{signed: b}}xy^2$. Find the mixed partial derivative $f_{xy} = \dfrac{\partial^2 f}{\partial y\,\partial x}$.
      Enter an expression in $x$ and $y$.
    params:
      m: { int: [2, 4] }
      a: { int: [2, 4] }
      b: { int: [-5, 5], not: [0] }
    answer: "a*m*x^(m-1)*e^(a*y) + 2*b*y"
    vars: [x, y]
    domain: [-1, 1]
    hints:
      - 'First find $f_x$, then differentiate that with respect to $y$.'
      - '$f_x = {{m}}x^{ {{m - 1}} }e^{ {{a}}y } {{signed: b}}y^2$.'
    solution: |
      $$f_x = {{m}}x^{ {{m - 1}} }e^{ {{a}}y } {{signed: b}}y^2, \qquad
        f_{xy} = \frac{\partial}{\partial y}f_x = {{a*m}}x^{ {{m - 1}} }e^{ {{a}}y } {{signed: 2*b}}y .$$
      (Differentiating in the other order gives the same result, as Clairaut's theorem promises for such smooth $f$.)
    verify: "diff(x**m*exp(a*y) + b*x*y**2, x, y)"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 3

  - id: calc-partial-006
    difficulty: 2
    type: numeric
    prompt: |
      Let $f(x, y) = \ln({{a}}x + {{b}}y)$. Find $f_x({{p}}, {{q}})$.
      Give the exact value or a decimal to 4 significant figures.
    params:
      a: { int: [2, 5] }
      b: { int: [2, 5] }
      p: { int: [1, 4] }
      q: { int: [1, 4] }
    answer: "a / (a*p + b*q)"
    hints:
      - '$\frac{\partial}{\partial x}\ln(u) = \frac{1}{u}\frac{\partial u}{\partial x}$.'
    solution: |
      $$f_x = \frac{ {{a}} }{ {{a}}x + {{b}}y }, \qquad f_x({{p}}, {{q}}) = \frac{ {{a}} }{ {{a*p}} + {{b*q}} } = {{frac: a/(a*p + b*q)}}.$$
    verify: "diff(log(a*x + b*y), x).subs({x: p, y: q})"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 2

  - id: calc-partial-007
    difficulty: 3
    type: vector
    prompt: |
      Let $f(x, y, z) = xyz {{signed: a}}x^2 {{signed: c}}y {{signed: b}}z^2$. Find $\nabla f({{p}}, {{q}}, {{r}})$.
      Enter it as a list such as `1, 4, -2`.
    params:
      a: { int: [-3, 3], not: [0, 1, -1] }
      b: { int: [-3, 3], not: [0, 1, -1] }
      c: { int: [-5, 5], not: [0] }
      p: { int: [-2, 3] }
      q: { int: [-2, 3] }
      r: { int: [-2, 3] }
    answer: "[q*r + 2*a*p, p*r + c, p*q + 2*b*r]"
    hints:
      - '$\nabla f = \langle f_x, f_y, f_z \rangle$; differentiate in one variable at a time, holding the other two fixed.'
      - '$f_x = yz {{signed: 2*a}}x$, $f_y = xz {{signed: c}}$, $f_z = xy {{signed: 2*b}}z$.'
    solution: |
      $$f_x = yz {{signed: 2*a}}x, \qquad f_y = xz {{signed: c}}, \qquad f_z = xy {{signed: 2*b}}z .$$
      At $({{p}}, {{q}}, {{r}})$:
      $$\nabla f = \langle ({{q}})({{r}}) {{signed: 2*a}}({{p}}),\; ({{p}})({{r}}) {{signed: c}},\; ({{p}})({{q}}) {{signed: 2*b}}({{r}}) \rangle
        = \langle {{q*r + 2*a*p}}, {{p*r + c}}, {{p*q + 2*b*r}} \rangle .$$
    verify: "[diff(x*y*z + a*x**2 + c*y + b*z**2, v).subs({x: p, y: q, z: r}) for v in (x, y, z)]"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 3

  - id: calc-partial-008
    difficulty: 3
    type: numeric
    prompt: |
      Let $w = x^2y {{signed: a}}x$, where $x = t^2$ and $y = {{b}}t + 1$. Use the chain rule to find $\dfrac{dw}{dt}$ at $t = {{c}}$.
    params:
      a: { int: [-5, 5], not: [0] }
      b: { int: [2, 4] }
      c: { int: [-2, 3], not: [0] }
    let:
      X: "c^2"
      Y: "b*c + 1"
      wx: "2*X*Y + a"
      wy: "X^2"
    answer: "wx * 2*c + wy * b"
    hints:
      - '$\dfrac{dw}{dt} = \dfrac{\partial w}{\partial x}\dfrac{dx}{dt} + \dfrac{\partial w}{\partial y}\dfrac{dy}{dt}$.'
      - 'At $t = {{c}}$: $x = {{X}}$, $y = {{Y}}$, $\frac{dx}{dt} = {{2*c}}$, $\frac{dy}{dt} = {{b}}$.'
    solution: |
      $w_x = 2xy {{signed: a}}$ and $w_y = x^2$; $\frac{dx}{dt} = 2t$ and $\frac{dy}{dt} = {{b}}$.
      At $t = {{c}}$: $x = {{X}}$ and $y = {{Y}}$, so $w_x = {{wx}}$ and $w_y = {{wy}}$. Then
      $$\frac{dw}{dt} = ({{wx}})({{2*c}}) + ({{wy}})({{b}}) = {{wx*2*c + wy*b}}.$$
    verify: "diff((t**2)**2*(b*t + 1) + a*t**2, t).subs(t, c)"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 4

  - id: calc-partial-009
    difficulty: 3
    type: numeric
    prompt: |
      Let $f(x, y) = x^2y$. Use the linear approximation of $f$ at $({{p}}, {{q}})$ to estimate $f({{p + h}}, {{q + k}})$.
      Give the value of the linear approximation (not the exact value of $f$), to 4 significant figures.
    params:
      p: { int: [1, 4] }
      q: { int: [1, 4] }
      h: { choice: [-0.1, -0.05, -0.02, 0.02, 0.05, 0.1] }
      k: { choice: [-0.1, -0.05, -0.02, 0.02, 0.05, 0.1] }
    answer: "p^2*q + 2*p*q*h + p^2*k"
    hints:
      - '$f(x, y) \approx f(a, b) + f_x(a, b)(x - a) + f_y(a, b)(y - b)$.'
      - '$f_x = 2xy$ and $f_y = x^2$.'
    solution: |
      $f({{p}}, {{q}}) = {{p^2*q}}$, $f_x = 2xy$ gives $f_x({{p}}, {{q}}) = {{2*p*q}}$, and $f_y = x^2$ gives $f_y({{p}}, {{q}}) = {{p^2}}$. With
      $\Delta x = {{h}}$ and $\Delta y = {{k}}$:
      $$f \approx {{p^2*q}} + {{2*p*q}}({{h}}) + {{p^2}}({{k}}) = {{p^2*q + 2*p*q*h + p^2*k}}.$$
      (The exact value is $({{p + h}})^2({{q + k}}) = {{(p + h)^2*(q + k)}}$; the difference is second order in $\Delta x, \Delta y$.)
    verify: "(Matrix([x**2*y]).jacobian([x, y]).subs({x: p, y: q}) * Matrix([h, k]))[0] + (x**2*y).subs({x: p, y: q})"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 4

  - id: calc-partial-010
    difficulty: 3
    type: expression
    prompt: |
      Let $f(x, y) = x^{ {{m}} }y^{ {{n}} }$. Compute the Laplacian $\nabla^2 f = f_{xx} + f_{yy}$.
      Enter an expression in $x$ and $y$.
    params:
      m: { int: [3, 5] }
      n: { int: [3, 5] }
    answer: "m*(m-1)*x^(m-2)*y^n + n*(n-1)*x^m*y^(n-2)"
    vars: [x, y]
    domain: [0.5, 2]
    hints:
      - 'Differentiate twice in $x$ holding $y$ fixed, then twice in $y$ holding $x$ fixed.'
      - '$f_{xx} = {{m*(m-1)}}x^{ {{m - 2}} }y^{ {{n}} }$.'
    solution: |
      $$f_{xx} = {{m}}\cdot{{m - 1}}\,x^{ {{m - 2}} }y^{ {{n}} } = {{m*(m-1)}}x^{ {{m - 2}} }y^{ {{n}} }, \qquad
        f_{yy} = {{n}}\cdot{{n - 1}}\,x^{ {{m}} }y^{ {{n - 2}} } = {{n*(n-1)}}x^{ {{m}} }y^{ {{n - 2}} }.$$
      So $\nabla^2 f = {{m*(m-1)}}x^{ {{m - 2}} }y^{ {{n}} } + {{n*(n-1)}}x^{ {{m}} }y^{ {{n - 2}} }$.
    verify: "diff(x**m*y**n, x, 2) + diff(x**m*y**n, y, 2)"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 3

  - id: calc-partial-011
    difficulty: 3
    type: multipart
    prompt: |
      Let $w = x^2y$, where $x = u + v$ and $y = uv$. Use the chain rule at $(u, v) = ({{p}}, {{q}})$.
    params:
      p: { int: [-3, 3], not: [0] }
      q: { int: [-3, 3], not: [0] }
    let:
      X: "p + q"
      Y: "p*q"
    parts:
      - prompt: "(a) Find $\\dfrac{\\partial w}{\\partial u}$ at $(u, v) = ({{p}}, {{q}})$."
        type: numeric
        answer: "2*X*Y*1 + X^2*q"
        verify: "diff((Symbol('u') + Symbol('v'))**2*Symbol('u')*Symbol('v'), Symbol('u')).subs({Symbol('u'): p, Symbol('v'): q})"
      - prompt: "(b) Find $\\dfrac{\\partial w}{\\partial v}$ at $(u, v) = ({{p}}, {{q}})$."
        type: numeric
        answer: "2*X*Y*1 + X^2*p"
        verify: "diff((Symbol('u') + Symbol('v'))**2*Symbol('u')*Symbol('v'), Symbol('v')).subs({Symbol('u'): p, Symbol('v'): q})"
    hints:
      - '$\dfrac{\partial w}{\partial u} = w_x\dfrac{\partial x}{\partial u} + w_y\dfrac{\partial y}{\partial u}$, with $w_x = 2xy$ and $w_y = x^2$.'
      - 'At $(u, v) = ({{p}}, {{q}})$: $x = {{X}}$ and $y = {{Y}}$.'
    solution: |
      $w_x = 2xy$, $w_y = x^2$; $x_u = x_v = 1$; $y_u = v$, $y_v = u$. At $(u, v) = ({{p}}, {{q}})$, $x = {{X}}$ and $y = {{Y}}$, so
      $w_x = {{2*X*Y}}$ and $w_y = {{X^2}}$.

      **(a)** $\dfrac{\partial w}{\partial u} = w_x \cdot 1 + w_y \cdot v = {{2*X*Y}} + {{X^2}}\cdot({{q}}) = {{2*X*Y + X^2*q}}$.

      **(b)** $\dfrac{\partial w}{\partial v} = w_x \cdot 1 + w_y \cdot u = {{2*X*Y}} + {{X^2}}\cdot({{p}}) = {{2*X*Y + X^2*p}}$.
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 5

  - id: calc-partial-012
    difficulty: 4
    type: numeric
    prompt: |
      The point $({{x0}}, {{y0}}, {{z0}})$ lies on the surface $x^2 + {{a}}y^2 + {{b}}z^2 = {{K}}$, which near that point defines $z$
      as a function of $x$ and $y$. Find $\dfrac{\partial z}{\partial x}$ there.
      Give the exact value or a decimal to 4 significant figures.
    params:
      x0: { int: [-3, 3], not: [0] }
      y0: { int: [-3, 3] }
      z0: { int: [1, 3] }
      a: { int: [2, 4] }
      b: { int: [2, 5] }
    let:
      K: "x0^2 + a*y0^2 + b*z0^2"
    answer: "-x0 / (b*z0)"
    hints:
      - 'Differentiate the equation with respect to $x$, treating $y$ as a constant and $z$ as a function of $x$ and $y$.'
      - 'You get $2x + {{2*b}}z\,\dfrac{\partial z}{\partial x} = 0$.'
    solution: |
      Differentiate $x^2 + {{a}}y^2 + {{b}}z^2 = {{K}}$ with respect to $x$ (with $y$ fixed):
      $$2x + {{2*b}}z\,\frac{\partial z}{\partial x} = 0 \quad\Longrightarrow\quad \frac{\partial z}{\partial x} = -\frac{x}{ {{b}}z}.$$
      At $({{x0}}, {{y0}}, {{z0}})$: $\dfrac{\partial z}{\partial x} = -\dfrac{ {{x0}} }{ {{b*z0}} } = {{frac: -x0/(b*z0)}}$.
      (Equivalently $z_x = -F_x/F_z$ for $F = x^2 + {{a}}y^2 + {{b}}z^2$.)
    verify: "diff(sqrt((x0**2 + a*y0**2 + b*z0**2 - x**2 - a*y**2)/b), x).subs({x: x0, y: y0})"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 4

  - id: calc-partial-013
    difficulty: 4
    type: mc
    prompt: |
      Let $f(x, y) = \dfrac{xy}{x^2 + y^2}$ for $(x, y) \ne (0, 0)$ and $f(0, 0) = 0$. Which statement is true at the origin?
    options:
      - "Both partial derivatives exist (and equal $0$), but $f$ is not continuous there."
      - "$f$ is differentiable there, since both partial derivatives exist."
      - "Neither partial derivative exists there."
      - "$f$ is continuous there, but $f_x(0, 0)$ does not exist."
    answer: 0
    hints:
      - 'On the $x$-axis, $f(x, 0) = 0$. What is $f_x(0, 0)$?'
      - 'Approach the origin along the line $y = x$.'
    solution: |
      On the axes $f(x, 0) = 0$ and $f(0, y) = 0$, so $f_x(0, 0) = \lim_{h\to0}\frac{f(h, 0) - f(0, 0)}{h} = 0$ and likewise $f_y(0, 0) = 0$.
      But along $y = x$, $f(x, x) = \dfrac{x^2}{2x^2} = \tfrac12$ for every $x \ne 0$, so $f(x, y)$ does not tend to $f(0, 0) = 0$:
      $f$ is not continuous at the origin, hence not differentiable either. Existence of partial derivatives alone does not give differentiability.
    verify: "0 if limit((Symbol('h')*0/(Symbol('h')**2))/Symbol('h'), Symbol('h'), 0) == 0 and limit(x*x/(x**2 + x**2), x, 0) != 0 else 1"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 3

  - id: calc-partial-014
    difficulty: 4
    type: proof
    prompt: |
      Let $f$ and $g$ be twice-differentiable functions of one variable and $c > 0$ a constant. Show that
      $$z(x, t) = f(x + ct) + g(x - ct)$$
      satisfies the wave equation $z_{tt} = c^2 z_{xx}$.
    hints:
      - 'Use the chain rule with $u = x + ct$ and $v = x - ct$.'
      - '$\frac{\partial}{\partial t} f(x + ct) = c\,f''(x + ct)$ and $\frac{\partial}{\partial t} g(x - ct) = -c\,g''(x - ct)$.'
    solution: |
      By the chain rule, with $u = x + ct$ and $v = x - ct$ ($u_x = v_x = 1$, $u_t = c$, $v_t = -c$):
      $$z_x = f'(u) + g'(v), \qquad z_{xx} = f''(u) + g''(v),$$
      $$z_t = c\,f'(u) - c\,g'(v), \qquad z_{tt} = c^2 f''(u) + c^2 g''(v).$$
      Hence $z_{tt} = c^2\big(f''(u) + g''(v)\big) = c^2 z_{xx}$. $\blacksquare$
      (The two terms are waves of fixed shape travelling left and right at speed $c$.)
    source: "Adapted from MIT OCW 18.02SC, Part II: Partial derivatives (chain rule problems)"
    license: CC BY-NC-SA 4.0
    estMinutes: 6
