subject: calculus
topic: multivariable-optimisation-lagrange
questions:
  - id: calc-lagr-001
    difficulty: 1
    type: mc
    prompt: |
      $f(x, y)$ is differentiable and has a local maximum at an interior point $P$ of its domain. What must be true at $P$?
    options:
      - "$\\nabla f(P) = \\mathbf{0}$"
      - "$f_{xx}(P) > 0$"
      - "$f(P) = 0$"
      - "$|\\nabla f(P)| = 1$"
    answer: 0
    hints:
      - 'Restrict $f$ to the lines $y = y_P$ and $x = x_P$: each restriction has a local maximum at $P$.'
    solution: |
      Along the line through $P$ parallel to the $x$-axis, $g(x) = f(x, y_P)$ has a local maximum at $x_P$, so $g'(x_P) = f_x(P) = 0$.
      In the same way $f_y(P) = 0$. Hence $\nabla f(P) = \mathbf{0}$: $P$ is a critical point. (At a local maximum one would expect
      $f_{xx}(P) \le 0$, not $> 0$.)
    verify: "0 if [diff(4 - x**2 - 2*y**2, v).subs({x: 0, y: 0}) for v in (x, y)] == [0, 0] else 1"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 1

  - id: calc-lagr-002
    difficulty: 2
    type: vector
    prompt: |
      Find the critical point of
      $$f(x, y) = x^2 {{signed: a}}xy + {{b}}y^2 {{signed: c}}x {{signed: d}}y .$$
      Enter it as a list `x, y`.
    params:
      a: { int: [-2, 2], not: [0] }
      b: { int: [2, 4] }
      p: { int: [-3, 3] }
      q: { int: [-3, 3] }
    let:
      c: "-2*p - a*q"
      d: "-a*p - 2*b*q"
    require: ["c != 0", "d != 0"]
    answer: "[p, q]"
    hints:
      - 'Solve $f_x = 0$ and $f_y = 0$ simultaneously.'
      - '$f_x = 2x {{signed: a}}y {{signed: c}}$ and $f_y = {{a}}x {{signed: 2*b}}y {{signed: d}}$.'
    solution: |
      $$f_x = 2x {{signed: a}}y {{signed: c}} = 0, \qquad f_y = {{a}}x {{signed: 2*b}}y {{signed: d}} = 0 .$$
      This linear system has determinant $2\cdot{{2*b}} - ({{a}})^2 = {{4*b - a^2}} \ne 0$, so exactly one solution. Eliminating $x$
      (multiply the first equation by ${{a}}$, the second by $2$, and subtract) gives $y = {{q}}$, and then $x = {{p}}$.
      The critical point is $({{p}}, {{q}})$.
    verify: "(lambda c, d: (lambda s: [s[x], s[y]])(solve([diff(x**2 + a*x*y + b*y**2 + c*x + d*y, v) for v in (x, y)], [x, y])))(-2*p - a*q, -a*p - 2*b*q)"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 3

  - id: calc-lagr-003
    difficulty: 2
    type: mc
    prompt: |
      At a critical point $P$ of $f(x, y)$, $\;f_{xx} = 2$, $f_{yy} = 3$ and $f_{xy} = 4$. What does the second derivative test say?
    options:
      - "$P$ is a saddle point."
      - "$P$ is a local minimum."
      - "$P$ is a local maximum."
      - "The test is inconclusive."
    answer: 0
    hints:
      - 'Compute $D = f_{xx}f_{yy} - f_{xy}^2$.'
    solution: |
      $D = f_{xx}f_{yy} - f_{xy}^2 = 2\cdot3 - 4^2 = -10 < 0$, so $P$ is a saddle point. (The sign of $f_{xx}$ only matters when $D > 0$.)
    verify: "(lambda H: 0 if H.det() < 0 else (1 if H.is_positive_definite else (2 if H.is_negative_definite else 3)))(hessian(x**2 + 4*x*y + Rational(3, 2)*y**2, (x, y)))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 2

  - id: calc-lagr-004
    difficulty: 3
    type: multipart
    prompt: |
      Let $f(x, y) = x^3 - {{3*s^2}}x + y^2 {{signed: -2*n}}y$. It has exactly two critical points.
    params:
      s: { int: [1, 3] }
      n: { int: [-3, 3], not: [0] }
    parts:
      - prompt: "(a) One critical point is a local minimum. What is the value of $f$ there?"
        type: numeric
        answer: "-2*s^3 - n^2"
        verify: "(lambda f: [f.subs(c) for c in solve([diff(f, x), diff(f, y)], [x, y], dict=True) if hessian(f, (x, y)).subs(c).is_positive_definite][0])(x**3 - 3*s**2*x + y**2 - 2*n*y)"
      - prompt: "(b) What is the other critical point?"
        type: mc
        options:
          - "a saddle point"
          - "a local maximum"
          - "a local minimum"
          - "a point where the second derivative test is inconclusive"
        answer: 0
        verify: "(lambda f: [(lambda H: 0 if H.det() < 0 else (1 if H.is_negative_definite else (2 if H.is_positive_definite else 3)))(hessian(f, (x, y)).subs(c)) for c in solve([diff(f, x), diff(f, y)], [x, y], dict=True) if not hessian(f, (x, y)).subs(c).is_positive_definite][0])(x**3 - 3*s**2*x + y**2 - 2*n*y)"
    hints:
      - '$f_x = 3x^2 - {{3*s^2}}$ and $f_y = 2y {{signed: -2*n}}$.'
      - 'Second derivative test: $D = f_{xx}f_{yy} - f_{xy}^2$ with $f_{xx} = 6x$, $f_{yy} = 2$, $f_{xy} = 0$.'
    solution: |
      $f_x = 3x^2 - {{3*s^2}} = 0$ gives $x = \pm{{s}}$, and $f_y = 2y {{signed: -2*n}} = 0$ gives $y = {{n}}$: the critical points are $({{s}}, {{n}})$ and $({{-s}}, {{n}})$.
      $D = (6x)(2) - 0^2 = 12x$.

      **(a)** At $({{s}}, {{n}})$: $D = {{12*s}} > 0$ and $f_{xx} = {{6*s}} > 0$, a local minimum, with value
      $f = {{s^3}} - {{3*s^3}} + {{n^2}} {{signed: -2*n^2}} = {{-2*s^3 - n^2}}$.

      **(b)** At $({{-s}}, {{n}})$: $D = {{-12*s}} < 0$, so it is a saddle point.
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 6

  - id: calc-lagr-005
    difficulty: 3
    type: numeric
    prompt: |
      Use a Lagrange multiplier to find the maximum of $f(x, y) = xy$ on the segment $\dfrac{x}{ {{a}} } + \dfrac{y}{ {{b}} } = 1$ with $x, y \ge 0$.
      Give the exact value or a decimal to 4 significant figures.
    params:
      a: { int: [2, 9] }
      b: { int: [2, 9] }
    answer: "a*b/4"
    hints:
      - 'Solve $\nabla f = \lambda\nabla g$ with $g(x, y) = \frac{x}{ {{a}} } + \frac{y}{ {{b}} }$: that is, $y = \frac{\lambda}{ {{a}} }$ and $x = \frac{\lambda}{ {{b}} }$.'
      - 'Substitute into the constraint to find $\lambda$. The endpoints give $f = 0$.'
    solution: |
      $\nabla f = \langle y, x \rangle$ and $\nabla g = \langle \tfrac{1}{ {{a}} }, \tfrac{1}{ {{b}} } \rangle$, so $y = \lambda/{{a}}$ and $x = \lambda/{{b}}$.
      The constraint gives $\frac{\lambda}{ {{a*b}} } + \frac{\lambda}{ {{a*b}} } = 1$, so $\lambda = {{frac: a*b/2}}$, $x = {{frac: a/2}}$, $y = {{frac: b/2}}$.
      There $f = {{frac: a/2}}\cdot{{frac: b/2}} = {{frac: a*b/4}}$; at the endpoints $f = 0$, so the maximum is ${{frac: a*b/4}}$.
    verify: "(lambda L: Max(*[(x*y).subs(s) for s in solve([y - L/a, x - L/b, x/a + y/b - 1], [x, y, L], dict=True)]))(Symbol('L'))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 4

  - id: calc-lagr-006
    difficulty: 3
    type: numeric
    prompt: |
      Find the maximum value of $f(x, y) = {{p}}x {{signed: q}}y$ on the circle $x^2 + y^2 = {{R^2}}$.
      Give it to 4 significant figures.
    params:
      p: { int: [-6, 6], not: [0] }
      q: { int: [-6, 6], not: [0] }
      R: { int: [1, 5] }
    answer: "R * sqrt(p^2 + q^2)"
    hints:
      - 'Lagrange: $\langle {{p}}, {{q}} \rangle = \lambda\langle 2x, 2y \rangle$, so $(x, y)$ is parallel to $\langle {{p}}, {{q}} \rangle$.'
      - 'The point on the circle in the direction of $\langle {{p}}, {{q}} \rangle$ is ${{R}}\,\frac{\langle {{p}}, {{q}} \rangle}{\sqrt{ {{p^2 + q^2}} }}$.'
    solution: |
      $\nabla f = \lambda\nabla g$ reads ${{p}} = 2\lambda x$, ${{q}} = 2\lambda y$, so $(x, y) = \frac{1}{2\lambda}\langle {{p}}, {{q}} \rangle$. On the circle of radius ${{R}}$ this
      gives $(x, y) = \pm\frac{ {{R}} }{\sqrt{ {{p^2 + q^2}} }}\langle {{p}}, {{q}} \rangle$, where
      $f = \pm\frac{ {{R}}({{p^2 + q^2}}) }{\sqrt{ {{p^2 + q^2}} }} = \pm{{R}}\sqrt{ {{p^2 + q^2}} }$. The maximum is ${{R}}\sqrt{ {{p^2 + q^2}} } \approx {{R*sqrt(p^2 + q^2)}}$.
      (Geometrically: $f = \langle {{p}}, {{q}} \rangle\cdot\langle x, y \rangle$ is largest when $\langle x, y \rangle$ points along $\langle {{p}}, {{q}} \rangle$.)
    verify: "maximum(p*R*cos(t) + q*R*sin(t), t, Interval(0, 2*pi))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 4

  - id: calc-lagr-007
    difficulty: 3
    type: vector
    prompt: |
      Use a Lagrange multiplier to find the point of the plane ${{a}}x {{signed: b}}y {{signed: c}}z = {{d}}$ closest to the origin.
      Enter it as a list such as `0.5, -1, 2` (decimals to 4 significant figures).
    params:
      a: { int: [-3, 3], not: [0, 1, -1] }
      b: { int: [-3, 3], not: [0, 1, -1] }
      c: { int: [-3, 3], not: [0, 1, -1] }
      d: { int: [-12, 12], not: [0] }
    let:
      nn: "a^2 + b^2 + c^2"
    answer: "(d / nn) * [a, b, c]"
    hints:
      - 'Minimise $x^2 + y^2 + z^2$ subject to ${{a}}x {{signed: b}}y {{signed: c}}z = {{d}}$.'
      - '$\langle 2x, 2y, 2z \rangle = \lambda\langle {{a}}, {{b}}, {{c}} \rangle$, so $(x, y, z) = \frac{\lambda}{2}\langle {{a}}, {{b}}, {{c}} \rangle$.'
    solution: |
      Minimise $f = x^2 + y^2 + z^2$ subject to $g = {{a}}x {{signed: b}}y {{signed: c}}z = {{d}}$. The Lagrange condition gives
      $(x, y, z) = \frac{\lambda}{2}\langle {{a}}, {{b}}, {{c}} \rangle$. Substituting into the constraint: $\frac{\lambda}{2}\cdot{{nn}} = {{d}}$, so $\frac{\lambda}{2} = {{frac: d/nn}}$ and
      $$(x, y, z) = {{frac: d/nn}}\,\langle {{a}}, {{b}}, {{c}} \rangle \approx {{row: (d / nn) * [a, b, c]}}.$$
      (It is the foot of the perpendicular from the origin, along the normal vector.)
    verify: "(lambda L: (lambda s: [s[x], s[y], s[z]])(solve([2*x - L*a, 2*y - L*b, 2*z - L*c, a*x + b*y + c*z - d], [x, y, z, L])))(Symbol('L'))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 4

  - id: calc-lagr-008
    difficulty: 4
    type: numeric
    prompt: |
      An open-topped rectangular box (no lid) must hold a volume of ${{4*k^3}}$ cm³. What is the least possible total area of its
      base and four sides, in cm²?
    params:
      k: { int: [1, 5] }
    answer: "12 * k^2"
    hints:
      - 'With base $x \times y$ and height $z$: minimise $A = xy + 2xz + 2yz$ subject to $xyz = {{4*k^3}}$.'
      - 'Eliminate $z = {{4*k^3}}/(xy)$: $A = xy + \frac{ {{8*k^3}} }{y} + \frac{ {{8*k^3}} }{x}$. Set $A_x = A_y = 0$.'
    solution: |
      Let the base be $x \times y$ and the height $z$, with $V = xyz = {{4*k^3}}$. Then $z = {{4*k^3}}/(xy)$ and
      $$A = xy + 2xz + 2yz = xy + \frac{ {{8*k^3}} }{y} + \frac{ {{8*k^3}} }{x}.$$
      $A_x = y - \frac{ {{8*k^3}} }{x^2} = 0$ and $A_y = x - \frac{ {{8*k^3}} }{y^2} = 0$ give $x^2y = xy^2 = {{8*k^3}}$, so $x = y$ and $x^3 = {{8*k^3}}$:
      $x = y = {{2*k}}$, $z = {{k}}$ (the height is half the side of the square base). The area is
      $A = {{4*k^2}} + 4\cdot{{2*k}}\cdot{{k}} = {{12*k^2}}$ cm². Since $A \to \infty$ at the edges of the domain, this critical point is the minimum.
    verify: "(lambda A: Min(*[A.subs(s) for s in solve([diff(A, x), diff(A, y)], [x, y], dict=True) if s[x].is_real and s[x] > 0 and s[y].is_real and s[y] > 0]))(x*y + 2*4*k**3/y + 2*4*k**3/x)"
    source: "Adapted from MIT OCW 18.02SC, Part II: Lagrange multipliers"
    license: CC BY-NC-SA 4.0
    estMinutes: 7

  - id: calc-lagr-009
    difficulty: 4
    type: multipart
    prompt: |
      Let $f(x, y) = x^2 + y^2 {{signed: -2*p}}x$ on the closed disk $x^2 + y^2 \le {{R^2}}$.
    params:
      p: { int: [1, 3] }
      R: { int: [4, 6] }
    parts:
      - prompt: "(a) What is the absolute minimum of $f$ on the disk?"
        type: numeric
        answer: "-p^2"
        verify: "(lambda f: Min(*([f.subs(s) for s in solve([diff(f, x), diff(f, y)], [x, y], dict=True)] + [minimum(f.subs({x: R*cos(t), y: R*sin(t)}), t, Interval(0, 2*pi))])))(x**2 + y**2 - 2*p*x)"
      - prompt: "(b) What is the absolute maximum of $f$ on the disk?"
        type: numeric
        answer: "R^2 + 2*p*R"
        verify: "(lambda f: Max(*([f.subs(s) for s in solve([diff(f, x), diff(f, y)], [x, y], dict=True)] + [maximum(f.subs({x: R*cos(t), y: R*sin(t)}), t, Interval(0, 2*pi))])))(x**2 + y**2 - 2*p*x)"
    hints:
      - 'Compare the values at interior critical points with the extreme values on the boundary circle.'
      - 'On the boundary, $x = {{R}}\cos t$, $y = {{R}}\sin t$, so $f = {{R^2}} - {{2*p*R}}\cos t$.'
    solution: |
      **Interior:** $f_x = 2x - {{2*p}} = 0$ and $f_y = 2y = 0$ give $({{p}}, 0)$, inside the disk, with $f({{p}}, 0) = {{-p^2}}$.

      **Boundary:** with $x = {{R}}\cos t$, $y = {{R}}\sin t$, $f = {{R^2}} - {{2*p*R}}\cos t$, ranging from ${{R^2 - 2*p*R}}$ (at $t = 0$) to ${{R^2 + 2*p*R}}$ (at $t = \pi$).

      **(a)** The smallest candidate is $f({{p}}, 0) = {{-p^2}}$. **(b)** The largest is $f({{-R}}, 0) = {{R^2 + 2*p*R}}$.
      (Indeed $f = (x - {{p}})^2 + y^2 - {{p^2}}$: the squared distance to $({{p}}, 0)$, minus ${{p^2}}$.)
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 7

  - id: calc-lagr-010
    difficulty: 3
    type: numeric
    prompt: |
      Find the maximum of $f(x, y) = xy$ on the ellipse $\dfrac{x^2}{ {{A^2}} } + \dfrac{y^2}{ {{B^2}} } = 1$.
      Give the exact value or a decimal to 4 significant figures.
    params:
      A: { int: [1, 6] }
      B: { int: [1, 6] }
    answer: "A*B/2"
    hints:
      - 'Lagrange: $y = \lambda\frac{2x}{ {{A^2}} }$ and $x = \lambda\frac{2y}{ {{B^2}} }$.'
      - 'Multiply the first by $x$ and the second by $y$: you get $\frac{x^2}{ {{A^2}} } = \frac{y^2}{ {{B^2}} }$, so each is $\frac12$.'
    solution: |
      With $g = \frac{x^2}{ {{A^2}} } + \frac{y^2}{ {{B^2}} }$: $y = \frac{2\lambda x}{ {{A^2}} }$ and $x = \frac{2\lambda y}{ {{B^2}} }$. Then
      $xy = \frac{2\lambda x^2}{ {{A^2}} } = \frac{2\lambda y^2}{ {{B^2}} }$, so $\frac{x^2}{ {{A^2}} } = \frac{y^2}{ {{B^2}} } = \frac12$ (for $\lambda \ne 0$).
      Hence $x^2 = \frac{ {{A^2}} }{2}$, $y^2 = \frac{ {{B^2}} }{2}$, and with $x, y$ of the same sign
      $$xy = \frac{ {{A}}\cdot{{B}} }{2} = {{frac: A*B/2}}.$$
    verify: "(lambda L: Max(*[(x*y).subs(s) for s in solve([y - 2*L*x/A**2, x - 2*L*y/B**2, x**2/A**2 + y**2/B**2 - 1], [x, y, L], dict=True)]))(Symbol('L'))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 5

  - id: calc-lagr-011
    difficulty: 4
    type: mc
    prompt: |
      $M(c)$ is the maximum of $f(x, y)$ subject to $g(x, y) = c$, attained at a point where $\nabla f = \lambda\nabla g$.
      What does the multiplier $\lambda$ measure?
    options:
      - "Approximately how fast $M$ changes with $c$: $\\lambda = \\dfrac{dM}{dc}$."
      - "The maximum value $M(c)$ itself."
      - "The distance from the maximum point to the curve $g = c$."
      - "Nothing: it is always positive at a maximum and has no meaning."
    answer: 0
    hints:
      - 'Try an example: maximise $xy$ subject to $x + y = c$. Compute $M(c)$ and $\lambda$.'
    solution: |
      Along the optimal points $(x(c), y(c))$, $M(c) = f(x(c), y(c))$, so by the chain rule
      $M'(c) = \nabla f\cdot\frac{d}{dc}(x, y) = \lambda\,\nabla g\cdot\frac{d}{dc}(x, y) = \lambda\,\frac{d}{dc}g(x(c), y(c)) = \lambda \cdot 1$.
      Example: for $xy$ on $x + y = c$, $x = y = \lambda = c/2$ and $M = c^2/4$, so $M'(c) = c/2 = \lambda$. (In economics, $\lambda$ is the "shadow price".)
    verify: "(lambda c, L: 0 if diff(c**2/4, c) == solve([L - y, L - x, x + y - c], [x, y, L], dict=True)[0][L] else 1)(Symbol('c'), Symbol('L'))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 3

  - id: calc-lagr-012
    difficulty: 5
    type: numeric
    prompt: |
      Find the maximum of $f(x, y, z) = xy^2z^3$ for positive $x, y, z$ with $x + y + z = {{6*k}}$.
    params:
      k: { int: [1, 3] }
    answer: "108 * k^6"
    hints:
      - '$\nabla f = \lambda\nabla g$: $y^2z^3 = \lambda$, $2xyz^3 = \lambda$, $3xy^2z^2 = \lambda$.'
      - 'Divide the equations pairwise: $y = 2x$ and $z = 3x$.'
    solution: |
      With $g = x + y + z$, $\nabla g = \langle 1, 1, 1 \rangle$, so
      $$y^2z^3 = 2xyz^3 = 3xy^2z^2 = \lambda .$$
      Dividing the first two (all variables positive): $y = 2x$. Dividing the first and third: $z = 3x$. The constraint $x + 2x + 3x = {{6*k}}$ gives
      $x = {{k}}$, $y = {{2*k}}$, $z = {{3*k}}$, and
      $$f = {{k}}\cdot({{2*k}})^2\cdot({{3*k}})^3 = {{108*k^6}}.$$
      This is the maximum: $f \to 0$ on the boundary of the region ($x$, $y$ or $z \to 0$), so the only interior critical point is the maximum.
    verify: "(lambda L: Max(*[(x*y**2*z**3).subs(s) for s in solve([y**2*z**3 - L, 2*x*y*z**3 - L, 3*x*y**2*z**2 - L, x + y + z - 6*k], [x, y, z, L], dict=True) if all(s[v].is_positive for v in (x, y, z))]))(Symbol('L'))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 8

  - id: calc-lagr-013
    difficulty: 4
    type: proof
    prompt: |
      Let $f$ and $g$ be differentiable in the plane, and suppose $f$, restricted to the curve $g(x, y) = c$, has a local maximum at $P$,
      where $\nabla g(P) \ne \mathbf{0}$. Explain why $\nabla f(P) = \lambda\nabla g(P)$ for some number $\lambda$.
    hints:
      - 'Parametrise the curve near $P$ by $\mathbf{r}(t)$ with $\mathbf{r}(0) = P$ and $\mathbf{r}''(0) \ne \mathbf{0}$.'
      - 'Differentiate $g(\mathbf{r}(t)) = c$ and $f(\mathbf{r}(t))$ at $t = 0$.'
    solution: |
      Since $\nabla g(P) \ne \mathbf{0}$, near $P$ the level curve $g = c$ is a smooth curve; parametrise it by $\mathbf{r}(t)$ with $\mathbf{r}(0) = P$ and
      $\mathbf{r}'(0) \ne \mathbf{0}$.

      1. $g(\mathbf{r}(t)) = c$ for all $t$, so by the chain rule $\nabla g(P)\cdot\mathbf{r}'(0) = 0$.
      2. $h(t) = f(\mathbf{r}(t))$ has a local maximum at $t = 0$, so $h'(0) = \nabla f(P)\cdot\mathbf{r}'(0) = 0$.

      Both $\nabla f(P)$ and $\nabla g(P)$ are perpendicular to the same non-zero vector $\mathbf{r}'(0)$ in the plane, so they are parallel.
      Since $\nabla g(P) \ne \mathbf{0}$, $\nabla f(P) = \lambda\nabla g(P)$ for some $\lambda$ (possibly $0$). $\blacksquare$
    source: "Adapted from MIT OCW 18.02SC, Part II: Lagrange multipliers"
    license: CC BY-NC-SA 4.0
    estMinutes: 6

  - id: calc-lagr-014
    difficulty: 3
    type: multipart
    prompt: |
      Fit a line $y = mx + b$ to the data points $(0, {{y0}})$, $(1, {{y1}})$, $(2, {{y2}})$, $(3, {{y3}})$ by least squares, i.e. by minimising
      $$E(m, b) = \sum_{i} (m x_i + b - y_i)^2 .$$
      Give each answer exactly or as a decimal to 4 significant figures.
    params:
      y0: { int: [-3, 5] }
      y1: { int: [-3, 5] }
      y2: { int: [-3, 5] }
      y3: { int: [-3, 5] }
    parts:
      - prompt: "(a) What is the slope $m$?"
        type: numeric
        answer: "(-3*y0 - y1 + y2 + 3*y3) / 10"
        verify: "(lambda m, b: (lambda E: solve([diff(E, m), diff(E, b)], [m, b])[m])(sum((m*i + b - v)**2 for i, v in enumerate([y0, y1, y2, y3]))))(Symbol('m'), Symbol('b'))"
      - prompt: "(b) What is the intercept $b$?"
        type: numeric
        answer: "(y0 + y1 + y2 + y3) / 4 - 1.5 * part1"
        verify: "(lambda m, b: (lambda E: solve([diff(E, m), diff(E, b)], [m, b])[b])(sum((m*i + b - v)**2 for i, v in enumerate([y0, y1, y2, y3]))))(Symbol('m'), Symbol('b'))"
    hints:
      - 'Set $E_m = 0$ and $E_b = 0$; you get the normal equations $\left(\sum x_i^2\right)m + \left(\sum x_i\right)b = \sum x_iy_i$ and $\left(\sum x_i\right)m + 4b = \sum y_i$.'
      - 'Here $\sum x_i = 6$, $\sum x_i^2 = 14$, $\sum y_i = {{y0 + y1 + y2 + y3}}$ and $\sum x_iy_i = {{y1 + 2*y2 + 3*y3}}$.'
    solution: |
      $E_m = 2\sum x_i(mx_i + b - y_i) = 0$ and $E_b = 2\sum (mx_i + b - y_i) = 0$ give the normal equations
      $$14m + 6b = {{y1 + 2*y2 + 3*y3}}, \qquad 6m + 4b = {{y0 + y1 + y2 + y3}}.$$
      **(a)** Multiply the first by $2$ and the second by $3$ and subtract: $10m = {{2*(y1 + 2*y2 + 3*y3) - 3*(y0 + y1 + y2 + y3)}}$, so $m = {{(-3*y0 - y1 + y2 + 3*y3)/10}}$.

      **(b)** $b = \frac{ {{y0 + y1 + y2 + y3}} - 6m}{4} = {{(y0 + y1 + y2 + y3)/4 - 1.5*(-3*y0 - y1 + y2 + 3*y3)/10}}$ — the line passes through the centre of mass $(1.5, \bar y)$ of the data.
      ($E$ is a convex quadratic in $m, b$, so this critical point is its minimum.)
