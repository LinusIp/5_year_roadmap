subject: calculus
topic: applications-of-derivatives
questions:
  - id: calc-app-001
    difficulty: 1
    type: mc
    prompt: "Let $f(x) = x^3 - {{3*c^2}}x$. At $x = {{c}}$, $f$ has:"
    params:
      c: { int: [1, 4] }
    options:
      - "a local minimum"
      - "a local maximum"
      - "a critical point that is neither a maximum nor a minimum"
      - "no critical point"
    answer: 0
    hints:
      - "Compute $f'({{c}})$: is ${{c}}$ a critical point?"
      - "Second-derivative test: look at the sign of $f''({{c}})$."
    solution: |
      $f'(x) = 3x^2 - {{3*c^2}}$, so $f'({{c}}) = 0$: a critical point.
      $f''(x) = 6x$, so $f''({{c}}) = {{6*c}} > 0$: the graph is concave up there, so it is a **local minimum**.
    verify: "(lambda f: (0 if diff(f, x, 2).subs(x, c) > 0 else 1) if diff(f, x).subs(x, c) == 0 else 3)(x**3 - 3*c**2*x)"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 2

  - id: calc-app-002
    difficulty: 2
    type: numeric
    prompt: |
      Use the linear approximation of $f(x) = \sqrt{x}$ at $x = {{n^2}}$ to approximate $\sqrt{ {{n^2 + d}} }$.
      Give the value of the **linear approximation** (not the calculator value) to 4 decimal places.
    params:
      n: { int: [3, 10] }
      d: { int: [-3, 4], not: [0] }
    answer: "n + d / (2*n)"
    tolerance: { abs: 0.00006 }
    hints:
      - "$L(x) = f(a) + f'(a)(x - a)$ with $a = {{n^2}}$."
      - "$f'(x) = \\frac{1}{2\\sqrt{x}}$, so $f'({{n^2}}) = \\frac{1}{ {{2*n}} }$."
    solution: |
      With $a = {{n^2}}$: $f(a) = {{n}}$ and $f'(a) = \dfrac{1}{2\sqrt{ {{n^2}} }} = \dfrac{1}{ {{2*n}} }$. So
      $$\sqrt{ {{n^2 + d}} } \approx {{n}} + \frac{1}{ {{2*n}} }\cdot({{d}}) = {{n + d/(2*n)}}.$$
      (The true value is ${{sqrt(n^2 + d)}}$; the tangent line lies above the concave curve, so the approximation is a little too big.)
    verify: "(sqrt(x) + diff(sqrt(x), x)*(n**2 + d - x)).subs(x, n**2)"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 3

  - id: calc-app-003
    difficulty: 2
    type: numeric
    prompt: |
      A circular ripple spreads so that its radius grows at ${{v}}$ cm/s. How fast is the area inside the ripple
      growing, in cm²/s, at the moment the radius is ${{R}}$ cm? Give a decimal.
    params:
      v: { real: [0.5, 3], step: 0.5 }
      R: { int: [2, 20] }
    answer: "2*pi*R*v"
    hints:
      - "$A = \\pi r^2$. Differentiate both sides with respect to time $t$."
      - "$\\frac{dA}{dt} = 2\\pi r\\,\\frac{dr}{dt}$."
    solution: |
      $A = \pi r^2$, so $\dfrac{dA}{dt} = 2\pi r\,\dfrac{dr}{dt} = 2\pi({{R}})({{v}}) = {{2*R*v}}\pi \approx {{2*pi*R*v}}$ cm²/s.
    verify: "diff(pi*(R + v*t)**2, t).subs(t, 0)"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 3

  - id: calc-app-004
    difficulty: 2
    type: numeric
    prompt: "What is the **local minimum value** of $f(x) = x^3 - {{3*p^2}}x {{signed: q}}$?"
    params:
      p: { int: [1, 3] }
      q: { int: [-10, 10], not: [0] }
    answer: "q - 2*p^3"
    hints:
      - "Solve $f'(x) = 3x^2 - {{3*p^2}} = 0$."
      - "Use $f''(x) = 6x$ to decide which critical point is the minimum, then evaluate $f$ there."
    solution: |
      $f'(x) = 3x^2 - {{3*p^2}} = 0$ gives $x = \pm {{p}}$. Since $f''({{p}}) = {{6*p}} > 0$, the local minimum is at $x = {{p}}$:
      $$f({{p}}) = {{p^3}} - {{3*p^3}} {{signed: q}} = {{q - 2*p^3}}.$$
    verify: "(lambda f: [f.subs(x, r) for r in solve(diff(f, x), x) if diff(f, x, 2).subs(x, r) > 0][0])(x**3 - 3*p**2*x + q)"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 3

  - id: calc-app-005
    difficulty: 3
    type: numeric
    prompt: |
      A farmer has ${{L}}$ m of fencing to enclose a rectangular field along a straight river. No fence is needed
      along the river. What is the largest area, in m², the field can have?
    params:
      L: { choice: [40, 60, 80, 100, 120, 200, 240] }
    answer: "L^2 / 8"
    hints:
      - "Let $x$ be the length of each side perpendicular to the river. Then the side parallel to the river is ${{L}} - 2x$."
      - "Maximise $A(x) = x({{L}} - 2x)$ on $0 < x < {{L/2}}$."
    solution: |
      With $x$ the perpendicular sides, $A(x) = x({{L}} - 2x) = {{L}}x - 2x^2$.
      $A'(x) = {{L}} - 4x = 0$ at $x = {{L/4}}$, and $A'' = -4 < 0$, so this is the maximum.
      The parallel side is ${{L}} - 2({{L/4}}) = {{L/2}}$, and the area is ${{L/4}} \times {{L/2}} = {{L^2/8}}$ m².
    verify: "(lambda A: A.subs(x, solve(diff(A, x), x)[0]))(x*(L - 2*x))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 4

  - id: calc-app-006
    difficulty: 3
    type: numeric
    prompt: |
      An open-top box is made from a ${{s}}$ cm by ${{s}}$ cm square of card by cutting equal squares from the four
      corners and folding up the sides. What is the largest possible volume, in cm³?
    params:
      s: { choice: [6, 9, 12, 18, 24, 30] }
    answer: "2*s^3 / 27"
    hints:
      - "If the cut squares have side $x$, the box is $({{s}} - 2x) \\times ({{s}} - 2x) \\times x$."
      - "Maximise $V(x) = x({{s}} - 2x)^2$ for $0 < x < {{s/2}}$."
    solution: |
      $V(x) = x({{s}} - 2x)^2$. Then $V'(x) = ({{s}} - 2x)^2 - 4x({{s}} - 2x) = ({{s}} - 2x)({{s}} - 6x)$.
      The critical point inside $(0, {{s/2}})$ is $x = {{s/6}}$; $V$ is $0$ at both ends, so this is the maximum:
      $$V({{s/6}}) = {{s/6}}\,({{s}} - {{s/3}})^2 = {{s/6}} \times {{(2*s/3)^2}} = {{2*s^3/27}}\ \text{cm}^3.$$
    verify: "(lambda V: max([V.subs(x, r) for r in solve(diff(V, x), x) if 0 < r < Rational(s, 2)]))(x*(s - 2*x)**2)"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 5

  - id: calc-app-007
    difficulty: 3
    type: numeric
    prompt: |
      A ${{Lad}}$ m ladder leans against a vertical wall. Its foot slides away from the wall at ${{v}}$ m/s.
      How fast, in m/s, is the top sliding **down** the wall when the foot is ${{p}}$ m from the wall?
      Give a fraction such as `7/4`, or a decimal to 4 significant figures.
    params:
      k: { int: [1, 4] }
      v: { int: [1, 3] }
    let:
      Lad: "[5, 10, 13, 25][k]"
      p: "[3, 6, 5, 7][k]"
      h: "[4, 8, 12, 24][k]"
    answer: "p * v / h"
    hints:
      - "With the foot at distance $x$ and the top at height $y$: $x^2 + y^2 = {{Lad^2}}$."
      - "Differentiate in $t$: $2x\\,\\dot x + 2y\\,\\dot y = 0$. When $x = {{p}}$, $y = {{h}}$."
    solution: |
      $x^2 + y^2 = {{Lad^2}}$, so $x\dot x + y\dot y = 0$ and $\dot y = -\dfrac{x\dot x}{y}$.
      When $x = {{p}}$, $y = \sqrt{ {{Lad^2}} - {{p^2}} } = {{h}}$, so
      $$\dot y = -\frac{ {{p}} \cdot {{v}} }{ {{h}} } = {{frac: -p*v/h}}\ \text{m/s}.$$
      The top slides down at ${{frac: p*v/h}} \approx {{p*v/h}}$ m/s.
    verify: "(lambda Ld, P: -diff(sqrt(Ld**2 - (P + v*t)**2), t).subs(t, 0))([5, 10, 13, 25][k - 1], [3, 6, 5, 7][k - 1])"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 5

  - id: calc-app-008
    difficulty: 3
    type: multipart
    prompt: |
      Use Newton's method on $f(x) = x^2 - {{a}}$ to approximate $\sqrt{ {{a}} }$, starting from $x_0 = {{n}}$.
      Recall $x_{k+1} = x_k - \dfrac{f(x_k)}{f'(x_k)}$.
    params:
      a: { int: [2, 60] }
    let:
      n: "round(sqrt(a))"
    require: ["round(sqrt(a))^2 != a"]
    parts:
      - prompt: "(a) What is $x_1$? Give at least 6 significant figures."
        type: numeric
        answer: "(n + a/n) / 2"
        tolerance: { rel: 0.00001 }
        verify: "(lambda f, x0: (x - f/diff(f, x)).subs(x, x0))(x**2 - a, round(math.sqrt(a)))"
      - prompt: "(b) Using your $x_1$, what is $x_2$? Give at least 6 significant figures."
        type: numeric
        answer: "(part1 + a/part1) / 2"
        tolerance: { rel: 0.00001 }
        verify: "(lambda f: (x - f/diff(f, x)).subs(x, part1))(x**2 - a)"
    hints:
      - "Here $f'(x) = 2x$, so the step simplifies to $x_{k+1} = \\frac{1}{2}\\left(x_k + \\frac{ {{a}} }{x_k}\\right)$."
      - "Carry plenty of digits from (a) into (b)."
    solution: |
      With $f'(x) = 2x$: $x_{k+1} = x_k - \dfrac{x_k^2 - {{a}}}{2x_k} = \dfrac{1}{2}\left(x_k + \dfrac{ {{a}} }{x_k}\right)$.

      (a) $x_1 = \frac{1}{2}\left({{n}} + \frac{ {{a}} }{ {{n}} }\right) = {{(n + a/n)/2}}$.

      (b) $x_2 = \frac{1}{2}\left(x_1 + \frac{ {{a}} }{x_1}\right) = {{((n + a/n)/2 + a/((n + a/n)/2))/2}}$.
      Compare $\sqrt{ {{a}} } = {{sqrt(a)}}$: the number of correct digits roughly doubles with each step.
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 5

  - id: calc-app-009
    difficulty: 4
    type: numeric
    prompt: |
      What is the shortest distance from the point $(0, {{h}})$ to the parabola $y = x^2$? Give a decimal.
    params:
      h: { int: [1, 6] }
    answer: "sqrt(h - 1/4)"
    hints:
      - "Minimise the squared distance $D(x) = x^2 + (x^2 - {{h}})^2$; it has the same minimisers as the distance."
      - "$D'(x) = 2x\\bigl(1 + 2(x^2 - {{h}})\\bigr)$. Check all critical points, including $x = 0$."
    solution: |
      $D(x) = x^2 + (x^2 - {{h}})^2$ and $D'(x) = 2x + 4x(x^2 - {{h}}) = 2x\bigl(2x^2 - {{2*h - 1}}\bigr)$.
      The critical points are $x = 0$ (where $D = {{h^2}}$) and $x^2 = {{frac: (2*h - 1)/2}}$, where
      $$D = {{frac: (2*h - 1)/2}} + \left(-\tfrac{1}{2}\right)^2 = {{frac: h - 1/4}}.$$
      That is smaller, so the shortest distance is $\sqrt{ {{frac: h - 1/4}} } \approx {{sqrt(h - 1/4)}}$.
    verify: "(lambda D: sqrt(min([D.subs(x, r) for r in solve(diff(D, x), x) if r.is_real])))(x**2 + (x**2 - h)**2)"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 6

  - id: calc-app-010
    difficulty: 4
    type: numeric
    prompt: |
      A closed cylindrical can must hold ${{V}}$ cm³. What radius, in cm, minimises the total surface area (top,
      bottom and side)? Give 3 significant figures.
    params:
      V: { choice: [250, 330, 400, 500, 750, 1000] }
    answer: "(V / (2*pi))^(1/3)"
    tolerance: { rel: 0.005 }
    hints:
      - "Surface area $S = 2\\pi r^2 + 2\\pi r h$, with $\\pi r^2 h = {{V}}$."
      - "Eliminate $h$: $S(r) = 2\\pi r^2 + \\frac{ {{2*V}} }{r}$. Set $S'(r) = 0$."
    solution: |
      From $\pi r^2 h = {{V}}$, $h = \dfrac{ {{V}} }{\pi r^2}$, so $S(r) = 2\pi r^2 + \dfrac{ {{2*V}} }{r}$.
      $S'(r) = 4\pi r - \dfrac{ {{2*V}} }{r^2} = 0$ gives $r^3 = \dfrac{ {{V}} }{2\pi}$, so
      $$r = \left(\frac{ {{V}} }{2\pi}\right)^{1/3} \approx {{(V/(2*pi))^(1/3)}}\ \text{cm}.$$
      $S''(r) = 4\pi + {{4*V}}/r^3 > 0$, so it is a minimum. (Then $h = 2r$: the best can is as tall as it is wide.)
    verify: "[r for r in solve(diff(2*pi*x**2 + 2*V/x, x), x) if r.is_real and r > 0][0]"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 6

  - id: calc-app-011
    difficulty: 3
    type: mc
    prompt: "Where does $f(x) = x^3 - {{3*a}}x^2 + 5$ have its inflection point?"
    params:
      a: { int: [1, 4] }
    options:
      - "$x = {{a}}$"
      - "$x = {{2*a}}$"
      - "$x = 0$"
      - "$x = {{3*a}}$"
    answer: 0
    hints:
      - "An inflection point is where the concavity changes: look at $f''$."
      - "$f''(x) = 6x - {{6*a}}$."
    solution: |
      $f'(x) = 3x^2 - {{6*a}}x$ and $f''(x) = 6x - {{6*a}}$, which changes sign (from negative to positive) at
      $x = {{a}}$. ($x = 0$ and $x = {{2*a}}$ are the critical points, a local max and a local min.)
    verify: "[a, 2*a, 0, 3*a].index(solve(diff(x**3 - 3*a*x**2 + 5, x, 2), x)[0])"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 2

  - id: calc-app-012
    difficulty: 4
    type: proof
    prompt: "Use the mean value theorem to prove that $|\\sin a - \\sin b| \\le |a - b|$ for all real $a$ and $b$."
    hints:
      - "If $a = b$ there is nothing to prove. Otherwise apply the MVT to $\\sin$ on the interval between $a$ and $b$."
      - "The MVT gives a $c$ with $\\sin a - \\sin b = \\cos c\\,(a - b)$. What do you know about $|\\cos c|$?"
    solution: |
      If $a = b$ both sides are $0$. Otherwise, $\sin$ is continuous and differentiable everywhere, so by the mean
      value theorem there is a $c$ strictly between $a$ and $b$ with
      $$\frac{\sin a - \sin b}{a - b} = \cos c.$$
      Taking absolute values, $|\sin a - \sin b| = |\cos c|\,|a - b| \le |a - b|$, since $|\cos c| \le 1$. $\blacksquare$
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 5

  - id: calc-app-013
    difficulty: 1
    type: numeric
    prompt: "At what $x$ does $f(x) = {{a}}x^2 {{signed: b}}x + 7$ have a horizontal tangent? Give a fraction such as `7/4`, or a decimal to 4 significant figures."
    params:
      a: { int: [1, 5] }
      b: { int: [-10, 10], not: [0] }
    answer: "-b / (2*a)"
    hints:
      - "A horizontal tangent means $f'(x) = 0$."
    solution: "$f'(x) = {{2*a}}x {{signed: b}} = 0$ gives $x = {{frac: -b/(2*a)}}$."
    verify: "solve(diff(a*x**2 + b*x + 7, x), x)[0]"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 1

  - id: calc-app-014
    difficulty: 5
    type: numeric
    prompt: |
      A swimmer is ${{d}}$ km from a straight shore. The point on the shore nearest her is $P$; she wants to reach
      a point $Q$ on the shore ${{L}}$ km from $P$. She swims at ${{vs}}$ km/h and runs at ${{vr}}$ km/h. She swims to some
      point between $P$ and $Q$ and runs the rest. What is the **least** total time, in hours? Give 4 significant figures.
    params:
      d: { int: [1, 4] }
      L: { int: [5, 10] }
      vs: { int: [2, 3] }
      vr: { int: [6, 10] }
    answer: "L / vr + d * sqrt(vr^2 - vs^2) / (vs * vr)"
    tolerance: { rel: 0.001 }
    hints:
      - "If she lands $x$ km from $P$, the time is $T(x) = \\frac{\\sqrt{ {{d^2}} + x^2}}{ {{vs}} } + \\frac{ {{L}} - x}{ {{vr}} }$."
      - "$T'(x) = 0$ gives $\\frac{x}{\\sqrt{ {{d^2}} + x^2}} = \\frac{ {{vs}} }{ {{vr}} }$ (Snell's law for runners)."
    solution: |
      $T(x) = \dfrac{\sqrt{ {{d^2}} + x^2}}{ {{vs}} } + \dfrac{ {{L}} - x}{ {{vr}} }$, so $T'(x) = \dfrac{x}{ {{vs}}\sqrt{ {{d^2}} + x^2}} - \dfrac{1}{ {{vr}} }$.
      Setting $T' = 0$: $\dfrac{x}{\sqrt{ {{d^2}} + x^2}} = \dfrac{ {{vs}} }{ {{vr}} }$, which solves to
      $$x = \frac{ {{d*vs}} }{\sqrt{ {{vr^2}} - {{vs^2}} }} \approx {{d*vs/sqrt(vr^2 - vs^2)}}\ \text{km},$$
      inside $[0, {{L}}]$. $T'' > 0$, so this is the minimum, and
      $$T = \frac{ {{L}} }{ {{vr}} } + \frac{\sqrt{ {{d^2*(vr^2 - vs^2)}} } }{ {{vs*vr}} } \approx {{L/vr + d*sqrt(vr^2 - vs^2)/(vs*vr)}}\ \text{h}.$$
    verify: "(lambda T: min([T.subs(x, r) for r in solve(diff(T, x), x) if r.is_real and 0 <= r <= L] + [T.subs(x, 0), T.subs(x, L)]))(sqrt(d**2 + x**2)/vs + (L - x)/vr)"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 8
