subject: calculus
topic: exponentials-logarithms-lhopital
questions:
  - id: calc-exp-001
    difficulty: 1
    type: expression
    prompt: |
      Differentiate $f(x) = e^{ {{a}}x} + {{b}}\ln x$ for $x > 0$.

      Type an expression in $x$. Write $e^{u}$ as `e^(u)` or `exp(u)` and $\ln x$ as `log(x)`, e.g. `3e^(x) + 1/x`.
    params:
      a: { int: [2, 5] }
      b: { int: [2, 9] }
    answer: "a*e^(a*x) + b/x"
    vars: [x]
    domain: [0.5, 3]
    hints:
      - "$\\frac{d}{dx}e^{kx} = ke^{kx}$ (chain rule)."
      - "$\\frac{d}{dx}\\ln x = \\frac{1}{x}$."
    solution: |
      $$f'(x) = {{a}}e^{ {{a}}x} + \frac{ {{b}} }{x}.$$
    verify: "diff(exp(a*x) + b*log(x), x)"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 1

  - id: calc-exp-002
    difficulty: 1
    type: mc
    prompt: "For $x > 0$, which expression equals $\\ln\\left(x^{ {{n}} }\\right)$?"
    params:
      n: { int: [2, 5] }
    options:
      - "${{n}}\\ln x$"
      - "$(\\ln x)^{ {{n}} }$"
      - "$\\ln({{n}}x)$"
      - "${{n}} + \\ln x$"
    answer: 0
    hints:
      - "$\\ln(ab) = \\ln a + \\ln b$, applied ${{n}}$ times."
    solution: |
      $x^{ {{n}} }$ is a product of ${{n}}$ factors $x$, and the log of a product is the sum of the logs:
      $\ln\left(x^{ {{n}} }\right) = \ln x + \dots + \ln x = {{n}}\ln x$.
    verify: "[simplify(expand_log(log(Symbol('w', positive=True)**n), force=True) - cand) for cand in [n*log(Symbol('w', positive=True)), log(Symbol('w', positive=True))**n, log(n*Symbol('w', positive=True)), n + log(Symbol('w', positive=True))]].index(0)"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 1

  - id: calc-exp-003
    difficulty: 2
    type: expression
    prompt: |
      Differentiate $f(x) = x^2 e^{-{{a}}x}$.

      Type an expression in $x$, e.g. `(x - x^2) e^(-x)`.
    params:
      a: { int: [2, 5] }
    answer: "(2*x - a*x^2) * e^(-a*x)"
    vars: [x]
    hints:
      - "Product rule with $u = x^2$ and $v = e^{-{{a}}x}$."
      - "$v' = -{{a}}e^{-{{a}}x}$."
    solution: |
      $$f'(x) = 2x\,e^{-{{a}}x} + x^2\cdot\left(-{{a}}e^{-{{a}}x}\right) = \left(2x - {{a}}x^2\right)e^{-{{a}}x}.$$
    verify: "diff(x**2*exp(-a*x), x)"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 2

  - id: calc-exp-004
    difficulty: 2
    type: numeric
    prompt: |
      A bacterial culture doubles every ${{D}}$ hours. How many hours does it take to grow to ${{M}}$ times its initial
      size? Give 3 significant figures.
    params:
      D: { int: [2, 30] }
      M: { choice: [3, 5, 6, 10, 20] }
    answer: "D * log(M) / log(2)"
    tolerance: { rel: 0.005 }
    hints:
      - "The size is $P(t) = P_0\\,2^{t/{{D}}}$."
      - "Solve $2^{t/{{D}}} = {{M}}$ by taking natural logs."
    solution: |
      $P(t) = P_0\,2^{t/{{D}}}$. Setting $2^{t/{{D}}} = {{M}}$ and taking logs:
      $$\frac{t}{ {{D}} }\ln 2 = \ln {{M}} \quad\Longrightarrow\quad t = \frac{ {{D}}\ln {{M}} }{\ln 2} \approx {{D*log(M)/log(2)}}\ \text{hours}.$$
    verify: "solve(Eq(2**(Symbol('T')/D), M), Symbol('T'))[0]"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 2

  - id: calc-exp-005
    difficulty: 2
    type: numeric
    prompt: "Evaluate $\\displaystyle\\lim_{x \\to 0} \\frac{e^{ {{a}}x} - 1}{\\sin({{b}}x)}$. Give a fraction such as `7/4`, or a decimal to 4 significant figures."
    params:
      a: { int: [2, 6] }
      b: { int: [2, 6] }
    require: ["a != b"]
    answer: "a / b"
    hints:
      - "Substituting $x = 0$ gives $\\frac{0}{0}$, so L'Hôpital's rule applies."
      - "Differentiate the top and the bottom separately."
    solution: |
      It is a $\frac{0}{0}$ form. By L'Hôpital's rule,
      $$\lim_{x \to 0} \frac{e^{ {{a}}x} - 1}{\sin({{b}}x)} = \lim_{x \to 0} \frac{ {{a}}e^{ {{a}}x}}{ {{b}}\cos({{b}}x)} = \frac{ {{a}} }{ {{b}} } = {{frac: a/b}}.$$
    verify: "limit((exp(a*x) - 1)/sin(b*x), x, 0)"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 2

  - id: calc-exp-006
    difficulty: 3
    type: numeric
    prompt: |
      Evaluate $\displaystyle\lim_{x \to \infty} \left(1 + \frac{ {{a}} }{x}\right)^{ {{b}}x}$. Give a decimal (4 significant figures or more).
    params:
      a: { int: [1, 3] }
      b: { int: [2, 4] }
    answer: "e^(a*b)"
    hints:
      - "It is a $1^\\infty$ form. Take the logarithm: $\\ln y = {{b}}x\\ln\\left(1 + \\frac{ {{a}} }{x}\\right)$."
      - "Write that as $\\frac{\\ln(1 + {{a}}/x)}{1/({{b}}x)}$, a $\\frac{0}{0}$ form, and use L'Hôpital (or $\\ln(1 + u) \\approx u$)."
    solution: |
      Let $y = \left(1 + \frac{ {{a}} }{x}\right)^{ {{b}}x}$. Then
      $$\ln y = \frac{\ln\left(1 + {{a}}/x\right)}{1/({{b}}x)}.$$
      Put $u = 1/x \to 0^+$: $\ln y = {{b}}\,\frac{\ln(1 + {{a}}u)}{u} \to {{b}}\cdot{{a}} = {{a*b}}$ by L'Hôpital
      ($\frac{d}{du}\ln(1 + {{a}}u) = \frac{ {{a}} }{1 + {{a}}u} \to {{a}}$). Since $\ln y \to {{a*b}}$ and $\exp$ is continuous,
      $y \to e^{ {{a*b}} } \approx {{e^(a*b)}}$.
    verify: "limit((1 + a/x)**(b*x), x, oo)"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 4

  - id: calc-exp-007
    difficulty: 3
    type: expression
    prompt: |
      Differentiate $y = x^{ {{a}}x}$ for $x > 0$.

      Type an expression in $x$, using `log(x)` for $\ln x$, e.g. `x^(3x) log(x) + 1`.
    params:
      a: { int: [2, 4] }
    answer: "x^(a*x) * (a*log(x) + a)"
    vars: [x]
    domain: [0.5, 3]
    hints:
      - "Neither the power rule nor the exponential rule applies: both the base and the exponent vary. Take logs first."
      - "$\\ln y = {{a}}x\\ln x$. Differentiate both sides: $\\frac{y'}{y} = {{a}}\\ln x + {{a}}$."
    solution: |
      Logarithmic differentiation: $\ln y = {{a}}x\ln x$. Differentiating,
      $$\frac{y'}{y} = {{a}}\ln x + {{a}}x\cdot\frac{1}{x} = {{a}}\ln x + {{a}},$$
      so $y' = x^{ {{a}}x}\left({{a}}\ln x + {{a}}\right)$.
    verify: "diff(x**(a*x), x)"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 3

  - id: calc-exp-008
    difficulty: 3
    type: numeric
    prompt: "Evaluate $\\displaystyle\\lim_{x \\to 0} \\frac{e^{ {{a}}x} - 1 - {{a}}x}{x^2}$. Give a fraction such as `7/4`, or a decimal to 4 significant figures."
    params:
      a: { int: [2, 6] }
    answer: "a^2 / 2"
    hints:
      - "This is $\\frac{0}{0}$. Apply L'Hôpital's rule, and check the form again."
      - "After one step you still have $\\frac{0}{0}$: $\\frac{ {{a}}e^{ {{a}}x} - {{a}}}{2x}$. Apply it once more."
    solution: |
      Two applications of L'Hôpital's rule (each time the form is $\frac{0}{0}$):
      $$\lim_{x \to 0} \frac{e^{ {{a}}x} - 1 - {{a}}x}{x^2} = \lim_{x \to 0} \frac{ {{a}}e^{ {{a}}x} - {{a}}}{2x} = \lim_{x \to 0} \frac{ {{a^2}}e^{ {{a}}x}}{2} = {{frac: a^2/2}}.$$
    verify: "limit((exp(a*x) - 1 - a*x)/x**2, x, 0)"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 3

  - id: calc-exp-009
    difficulty: 4
    type: numeric
    prompt: "Evaluate $\\displaystyle\\lim_{x \\to 0} \\left(\\cos {{a}}x\\right)^{1/x^2}$. Give a decimal (4 significant figures or more)."
    params:
      a: { int: [2, 3] }
    answer: "e^(-a^2/2)"
    hints:
      - "A $1^\\infty$ form: let $y = (\\cos {{a}}x)^{1/x^2}$ and study $\\ln y = \\frac{\\ln\\cos {{a}}x}{x^2}$."
      - "L'Hôpital: $\\frac{d}{dx}\\ln\\cos {{a}}x = -{{a}}\\tan {{a}}x$."
    solution: |
      Let $y = (\cos {{a}}x)^{1/x^2}$, so $\ln y = \dfrac{\ln\cos {{a}}x}{x^2}$, a $\frac{0}{0}$ form. By L'Hôpital,
      $$\lim_{x \to 0}\frac{\ln\cos {{a}}x}{x^2} = \lim_{x \to 0}\frac{-{{a}}\tan {{a}}x}{2x} = -\frac{ {{a}} }{2}\cdot{{a}} = -{{frac: a^2/2}},$$
      using $\frac{\tan u}{u} \to 1$. Hence $y \to e^{-{{frac: a^2/2}}} \approx {{e^(-a^2/2)}}$.
    verify: "limit(cos(a*x)**(1/x**2), x, 0)"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 5

  - id: calc-exp-010
    difficulty: 4
    type: multipart
    prompt: |
      A cup of coffee at ${{T0}}$ °C is left in a room at ${{A}}$ °C. By Newton's law of cooling its temperature is
      $T(t) = {{A}} + ({{T0}} - {{A}})e^{-kt}$, with $t$ in minutes. After ${{m}}$ minutes it is at ${{T1}}$ °C.
    params:
      A: { int: [18, 24] }
      T0: { int: [85, 95] }
      T1: { int: [55, 70] }
      T2: { choice: [35, 40, 45] }
      m: { choice: [5, 10, 15] }
    parts:
      - prompt: "(a) What is $k$ (per minute)? Give 4 significant figures."
        type: numeric
        answer: "log((T0 - A) / (T1 - A)) / m"
        tolerance: { rel: 0.001 }
        verify: "[r for r in solve(Eq(A + (T0 - A)*exp(-Symbol('k')*m), T1), Symbol('k')) if r.is_real][0]"
      - prompt: "(b) Using your $k$, after how many minutes (from the start) will it reach ${{T2}}$ °C? Give 3 significant figures."
        type: numeric
        answer: "log((T0 - A) / (T2 - A)) / part1"
        tolerance: { rel: 0.005 }
        verify: "[r.subs(Symbol('k'), part1) for r in solve(Eq(A + (T0 - A)*exp(-Symbol('k')*Symbol('s')), T2), Symbol('s'))][0]"
    hints:
      - "Substitute $t = {{m}}$, $T = {{T1}}$ and isolate $e^{-{{m}}k}$."
      - "Then take natural logs. For (b) do the same with $T = {{T2}}$ and your $k$."
    solution: |
      (a) ${{T1}} = {{A}} + {{T0 - A}}e^{-{{m}}k}$ gives $e^{-{{m}}k} = \frac{ {{T1 - A}} }{ {{T0 - A}} }$, so
      $$k = \frac{1}{ {{m}} }\ln\frac{ {{T0 - A}} }{ {{T1 - A}} } \approx {{log((T0 - A)/(T1 - A))/m}}\ \text{per minute}.$$

      (b) ${{T2}} = {{A}} + {{T0 - A}}e^{-kt}$ gives
      $$t = \frac{1}{k}\ln\frac{ {{T0 - A}} }{ {{T2 - A}} } \approx {{log((T0 - A)/(T2 - A)) / (log((T0 - A)/(T1 - A))/m)}}\ \text{minutes}.$$
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 6

  - id: calc-exp-011
    difficulty: 4
    type: proof
    prompt: "Prove that $e^x \\ge 1 + x$ for every real number $x$, with equality only at $x = 0$."
    hints:
      - "Study $g(x) = e^x - 1 - x$. Where is it smallest?"
      - "$g'(x) = e^x - 1$ is negative for $x < 0$ and positive for $x > 0$."
    solution: |
      Let $g(x) = e^x - 1 - x$. Then $g'(x) = e^x - 1$, which is $< 0$ for $x < 0$ (since $e^x < 1$ there) and $> 0$ for
      $x > 0$. So $g$ is strictly decreasing on $(-\infty, 0]$ and strictly increasing on $[0, \infty)$, and its minimum
      value is $g(0) = 0$. Hence $g(x) > 0$ for $x \ne 0$, i.e. $e^x > 1 + x$, with equality only at $x = 0$.
      (Geometrically: $y = 1 + x$ is the tangent line at $0$, and $e^x$ is convex, so it lies above its tangent lines.) $\blacksquare$
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 5

  - id: calc-exp-012
    difficulty: 5
    type: numeric
    prompt: |
      Evaluate $\displaystyle\lim_{x \to \infty} x\left[\left(1 + \frac{ {{a}} }{x}\right)^{x} - e^{ {{a}} }\right]$.
      Give a decimal (4 significant figures or more).
    params:
      a: { int: [1, 3] }
    answer: "-a^2 * e^a / 2"
    hints:
      - "Write $\\left(1 + \\frac{ {{a}} }{x}\\right)^x = \\exp\\left(x\\ln\\left(1 + \\frac{ {{a}} }{x}\\right)\\right)$ and put $u = \\frac{1}{x}$."
      - "Expand $\\ln(1 + {{a}}u) = {{a}}u - \\frac{ {{a^2}}u^2}{2} + O(u^3)$, so the exponent is ${{a}} - \\frac{ {{a^2}} }{2}u + O(u^2)$."
    solution: |
      With $u = 1/x \to 0^+$, $x\ln\left(1 + \frac{ {{a}} }{x}\right) = \frac{1}{u}\ln(1 + {{a}}u) = \frac{1}{u}\left({{a}}u - \frac{ {{a^2}}u^2}{2} + O(u^3)\right) = {{a}} - \frac{ {{a^2}} }{2}u + O(u^2)$. So
      $$\left(1 + {{a}}u\right)^{1/u} = e^{ {{a}} }\,e^{-\frac{ {{a^2}} }{2}u + O(u^2)} = e^{ {{a}} }\left(1 - \frac{ {{a^2}} }{2}u + O(u^2)\right).$$
      Subtract $e^{ {{a}} }$ and divide by $u$:
      $$\frac{(1 + {{a}}u)^{1/u} - e^{ {{a}} }}{u} \to -\frac{ {{a^2}} }{2}e^{ {{a}} } \approx {{-a^2*e^a/2}}.$$
    verify: "limit(x*((1 + a/x)**x - exp(a)), x, oo)"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 8

  - id: calc-exp-013
    difficulty: 1
    type: numeric
    prompt: "Solve $e^{ {{a}}x} = {{M}}$ for $x$. Give a decimal (4 significant figures or more)."
    params:
      a: { int: [2, 5] }
      M: { int: [2, 20] }
    answer: "log(M) / a"
    hints:
      - "Take the natural log of both sides: $\\ln e^{u} = u$."
    solution: "$\\ln$ of both sides: ${{a}}x = \\ln {{M}}$, so $x = \\dfrac{\\ln {{M}}}{ {{a}} } \\approx {{log(M)/a}}$."
    verify: "[r for r in solve(Eq(exp(a*x), M), x) if r.is_real][0]"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 1

  - id: calc-exp-014
    difficulty: 2
    type: mc
    prompt: "As $x \\to \\infty$, which of these grows fastest?"
    options:
      - "$e^x$"
      - "$x^{100}$"
      - "$(\\ln x)^{100}$"
      - "$x^{10}\\ln x$"
    answer: 0
    hints:
      - "Compare two functions by the limit of their ratio; L'Hôpital's rule helps."
      - "Repeated L'Hôpital on $\\frac{x^{100}}{e^x}$ reduces the power of $x$ by one each time, while $e^x$ never changes."
    solution: |
      Any exponential $e^x$ beats any power: after 100 applications of L'Hôpital, $\frac{x^{100}}{e^x} \to \frac{100!}{e^x} \to 0$.
      Powers beat logarithms: $\frac{(\ln x)^{100}}{x^{100}} = \left(\frac{\ln x}{x}\right)^{100} \to 0$. And $x^{10}\ln x$ is
      smaller than $x^{11}$, so it also loses to $e^x$. The order is $(\ln x)^{100} \ll x^{10}\ln x \ll x^{100} \ll e^x$
      (for large enough $x$).
    verify: "0 if all(limit(f/exp(x), x, oo) == 0 for f in [x**100, log(x)**100, x**10*log(x)]) else 1"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 2
