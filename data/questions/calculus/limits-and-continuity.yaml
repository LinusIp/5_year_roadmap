subject: calculus
topic: limits-and-continuity
questions:
  - id: calc-lim-001
    difficulty: 1
    type: numeric
    prompt: |
      Evaluate $\displaystyle\lim_{x \to {{c}}} \left({{a}}x^2 {{signed: b}}x {{signed: d}}\right)$.
    params:
      a: { int: [2, 5] }
      b: { int: [-6, 6], not: [-1, 0, 1] }
      d: { int: [-9, 9], not: [0] }
      c: { int: [-3, 3] }
    answer: "a*c^2 + b*c + d"
    hints:
      - "A polynomial is continuous everywhere."
      - "So the limit is just the value of the polynomial at $x = {{c}}$."
    solution: |
      Polynomials are continuous, so the limit equals the value at $x = {{c}}$:
      $${{a}}({{c}})^2 {{signed: b}}({{c}}) {{signed: d}} = {{a*c^2}} {{signed: b*c}} {{signed: d}} = {{a*c^2 + b*c + d}}.$$
    verify: "limit(a*x**2 + b*x + d, x, c)"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 1

  - id: calc-lim-002
    difficulty: 2
    type: numeric
    prompt: |
      Evaluate $\displaystyle\lim_{x \to {{r}}} \frac{x^2 {{signed: -(r + s)}}x {{signed: r*s}}}{x {{signed: -r}}}$.
    params:
      r: { int: [-4, 5], not: [0] }
      s: { int: [-5, 5], not: [0] }
    require: ["r != s", "abs(r + s) > 1"]
    answer: "r - s"
    hints:
      - "Substituting $x = {{r}}$ gives $\\tfrac{0}{0}$, so something cancels."
      - "Factor the numerator: one factor is $(x {{signed: -r}})$."
    solution: |
      The numerator factors as $(x {{signed: -r}})(x {{signed: -s}})$. For $x \ne {{r}}$ the common factor cancels:
      $$\lim_{x \to {{r}}} \frac{(x {{signed: -r}})(x {{signed: -s}})}{x {{signed: -r}}} = \lim_{x \to {{r}}} (x {{signed: -s}}) = {{r}} {{signed: -s}} = {{r - s}}.$$
    verify: "limit((x**2 - (r + s)*x + r*s)/(x - r), x, r)"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 2

  - id: calc-lim-003
    difficulty: 2
    type: numeric
    prompt: |
      Evaluate $\displaystyle\lim_{x \to 0} \frac{\sin({{a}}x)}{\tan({{b}}x)}$. Give a fraction such as `7/4`, or a decimal to 4 significant figures.
    params:
      a: { int: [2, 7] }
      b: { int: [2, 7] }
    require: ["a != b"]
    answer: "a / b"
    hints:
      - "Use $\\lim_{u \\to 0} \\frac{\\sin u}{u} = 1$."
      - "Write $\\tan({{b}}x) = \\frac{\\sin({{b}}x)}{\\cos({{b}}x)}$ and multiply and divide by $x$."
    solution: |
      $$\frac{\sin({{a}}x)}{\tan({{b}}x)} = \frac{\sin({{a}}x)}{ {{a}}x} \cdot \frac{ {{b}}x}{\sin({{b}}x)} \cdot \cos({{b}}x) \cdot \frac{ {{a}} }{ {{b}} }.$$
      As $x \to 0$ the first three factors tend to $1$, so the limit is $\frac{ {{a}} }{ {{b}} } = {{frac: a/b}}$.
    verify: "limit(sin(a*x)/tan(b*x), x, 0)"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 2

  - id: calc-lim-004
    difficulty: 1
    type: mc
    prompt: |
      Let $f(x) = \dfrac{x^2 - {{c^2}}}{x - {{c}}}$ for $x \ne {{c}}$, and $f({{c}}) = k$.
      Which value of $k$ makes $f$ continuous at $x = {{c}}$?
    params:
      c: { int: [2, 6] }
    options:
      - "$k = {{2*c}}$"
      - "$k = {{c}}$"
      - "$k = {{c^2}}$"
      - "$k = 0$"
    answer: 0
    hints:
      - "Continuity at $c$ means $\\lim_{x \\to c} f(x) = f(c)$."
      - "Factor $x^2 - {{c^2}} = (x - {{c}})(x + {{c}})$."
    solution: |
      For $x \ne {{c}}$, $f(x) = x + {{c}}$, so $\lim_{x \to {{c}}} f(x) = {{2*c}}$.
      Continuity needs $f({{c}})$ to equal that limit: $k = {{2*c}}$.
    verify: "[2*c, c, c**2, 0].index(limit((x**2 - c**2)/(x - c), x, c))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 2

  - id: calc-lim-005
    difficulty: 3
    type: numeric
    prompt: |
      Evaluate $\displaystyle\lim_{x \to 0} \frac{\sqrt{x + {{a^2}}} - {{a}}}{x}$. Give a fraction such as `7/4`, or a decimal to 4 significant figures.
    params:
      a: { int: [2, 6] }
    answer: "1 / (2*a)"
    hints:
      - "Direct substitution gives $\\tfrac{0}{0}$."
      - "Multiply top and bottom by the conjugate $\\sqrt{x + {{a^2}}} + {{a}}$."
    solution: |
      Multiply by the conjugate:
      $$\frac{\sqrt{x + {{a^2}}} - {{a}}}{x} \cdot \frac{\sqrt{x + {{a^2}}} + {{a}}}{\sqrt{x + {{a^2}}} + {{a}}} = \frac{(x + {{a^2}}) - {{a^2}}}{x\left(\sqrt{x + {{a^2}}} + {{a}}\right)} = \frac{1}{\sqrt{x + {{a^2}}} + {{a}}}.$$
      Now substitute $x = 0$: $\dfrac{1}{ {{a}} + {{a}} } = {{frac: 1/(2*a)}}$.
    verify: "limit((sqrt(x + a**2) - a)/x, x, 0)"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 3

  - id: calc-lim-006
    difficulty: 2
    type: numeric
    prompt: |
      Evaluate $\displaystyle\lim_{x \to \infty} \frac{ {{a}}x^2 {{signed: b}}x + 1}{ {{c}}x^2 {{signed: d}} }$. Give a fraction such as `7/4`, or a decimal to 4 significant figures.
    params:
      a: { int: [1, 9] }
      b: { int: [-9, 9], not: [-1, 0, 1] }
      c: { int: [2, 6] }
      d: { int: [-9, 9], not: [0] }
    answer: "a / c"
    hints:
      - "Divide numerator and denominator by the highest power of $x$ in the denominator."
      - "Terms such as $\\frac{1}{x}$ and $\\frac{1}{x^2}$ tend to 0."
    solution: |
      Divide top and bottom by $x^2$:
      $$\frac{ {{a}} {{signed: b}}/x + 1/x^2}{ {{c}} {{signed: d}}/x^2} \to \frac{ {{a}} }{ {{c}} } = {{frac: a/c}} \quad (x \to \infty).$$
    verify: "limit((a*x**2 + b*x + 1)/(c*x**2 + d), x, oo)"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 2

  - id: calc-lim-007
    difficulty: 3
    type: numeric
    prompt: |
      For which value of $k$ is the function
      $$f(x) = \begin{cases} kx {{signed: b}} & x < {{c}} \\ x^2 {{signed: d}} & x \ge {{c}} \end{cases}$$
      continuous at every real $x$?
    params:
      b: { int: [-8, 8], not: [0] }
      c: { int: [1, 4] }
      d: { int: [-8, 8], not: [0] }
    require: ["mod(c^2 + d - b, c) == 0"]
    answer: "(c^2 + d - b) / c"
    hints:
      - "Each piece is a polynomial, so the only place continuity can fail is $x = {{c}}$."
      - "Make the left-hand limit at $x = {{c}}$ equal $f({{c}})$."
    solution: |
      Both pieces are continuous on their own intervals. At $x = {{c}}$:
      the left-hand limit is ${{c}}k {{signed: b}}$ and $f({{c}}) = {{c^2}} {{signed: d}} = {{c^2 + d}}$.
      Setting them equal: ${{c}}k = {{c^2 + d}} {{signed: -b}} = {{c^2 + d - b}}$, so $k = {{(c^2 + d - b)/c}}$.
    verify: "solve(Eq(Symbol('k')*c + b, c**2 + d), Symbol('k'))[0]"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 3

  - id: calc-lim-008
    difficulty: 2
    type: numeric
    prompt: |
      Evaluate the one-sided limit $\displaystyle\lim_{x \to {{c}}^-} \frac{x^2 - {{c^2}}}{|x - {{c}}|}$.
    params:
      c: { int: [1, 6] }
    answer: "-2*c"
    hints:
      - "For $x < {{c}}$, what is $|x - {{c}}|$ without the absolute value?"
      - "For $x < {{c}}$, $|x - {{c}}| = -(x - {{c}})$."
    solution: |
      When $x < {{c}}$, $|x - {{c}}| = -(x - {{c}})$, so
      $$\frac{x^2 - {{c^2}}}{|x - {{c}}|} = \frac{(x - {{c}})(x + {{c}})}{-(x - {{c}})} = -(x + {{c}}) \to -{{2*c}}.$$
      (From the right the limit is $+{{2*c}}$, so the two-sided limit does not exist.)
    verify: "limit((x**2 - c**2)/Abs(x - c), x, c, '-')"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 2

  - id: calc-lim-009
    difficulty: 4
    type: numeric
    prompt: |
      Evaluate $\displaystyle\lim_{x \to 0} \frac{1 - \cos({{a}}x)}{x \sin({{b}}x)}$ without L'Hôpital's rule. Give a fraction such as `7/4`, or a decimal to 4 significant figures.
    params:
      a: { int: [2, 6] }
      b: { int: [2, 5] }
    answer: "a^2 / (2*b)"
    hints:
      - "Multiply top and bottom by $1 + \\cos({{a}}x)$ to turn the numerator into $\\sin^2({{a}}x)$."
      - "Then group factors of the form $\\frac{\\sin u}{u}$."
    solution: |
      Since $1 - \cos^2 u = \sin^2 u$,
      $$\frac{1 - \cos({{a}}x)}{x\sin({{b}}x)} = \frac{\sin^2({{a}}x)}{x \sin({{b}}x)\,\bigl(1 + \cos({{a}}x)\bigr)}
      = \left(\frac{\sin({{a}}x)}{ {{a}}x}\right)^2 \cdot \frac{ {{b}}x}{\sin({{b}}x)} \cdot \frac{ {{a^2}} }{ {{b}}\,\bigl(1 + \cos({{a}}x)\bigr)}.$$
      As $x \to 0$ the first two factors tend to $1$ and the last to $\frac{ {{a^2}} }{ {{2*b}} }$, so the limit is ${{frac: a^2/(2*b)}}$.
    verify: "limit((1 - cos(a*x))/(x*sin(b*x)), x, 0)"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 5

  - id: calc-lim-010
    difficulty: 4
    type: proof
    prompt: |
      Use the $\varepsilon$–$\delta$ definition of the limit to prove that $\displaystyle\lim_{x \to 3} x^2 = 9$.
    hints:
      - "You must show: for every $\\varepsilon > 0$ there is $\\delta > 0$ with $0 < |x - 3| < \\delta \\Rightarrow |x^2 - 9| < \\varepsilon$."
      - "Factor $|x^2 - 9| = |x - 3|\\,|x + 3|$ and first restrict to $|x - 3| < 1$ to bound $|x + 3|$."
      - "Try $\\delta = \\min(1, \\varepsilon/7)$."
    solution: |
      Let $\varepsilon > 0$ and put $\delta = \min(1, \varepsilon/7)$. Suppose $0 < |x - 3| < \delta$.

      Because $|x - 3| < 1$, we have $2 < x < 4$, so $|x + 3| < 7$.
      Then
      $$|x^2 - 9| = |x - 3|\,|x + 3| < \delta \cdot 7 \le \frac{\varepsilon}{7}\cdot 7 = \varepsilon.$$
      Since $\varepsilon$ was arbitrary, $\lim_{x \to 3} x^2 = 9$. The key idea is to bound the "extra" factor $|x + 3|$ by
      first keeping $x$ within $1$ of $3$.
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 8

  - id: calc-lim-011
    difficulty: 3
    type: multipart
    prompt: |
      Let $f(x) = x^3 - {{c}}$. We use the intermediate value theorem and bisection to locate the root of $f$.
    params:
      c: { int: [2, 7] }
    parts:
      - prompt: "(a) What is $f(1)$?"
        type: numeric
        answer: "1 - c"
        verify: "(x**3 - c).subs(x, 1)"
      - prompt: "(b) What is $f(2)$?"
        type: numeric
        answer: "8 - c"
        verify: "(x**3 - c).subs(x, 2)"
      - prompt: "(c) Since $f(1) < 0 < f(2)$, the root lies in $[1, 2]$. Bisect once at $x = 1.5$: what is the **left** endpoint of the half-interval that still contains the root?"
        type: numeric
        answer: "1.5^3 - c < 0 ? 1.5 : 1"
        verify: "Rational(3, 2) if real_root(c, 3) > Rational(3, 2) else 1"
    hints:
      - "Just evaluate $x^3 - {{c}}$ at $x = 1$ and $x = 2$."
      - "For (c), compute $f(1.5) = 3.375 - {{c}}$ and keep the half on which $f$ changes sign."
    solution: |
      (a) $f(1) = 1 - {{c}} = {{1 - c}}$.
      (b) $f(2) = 8 - {{c}} = {{8 - c}}$.
      Since $f$ is continuous and changes sign on $[1, 2]$, the intermediate value theorem gives a root there.
      (c) $f(1.5) = 3.375 - {{c}} = {{1.5^3 - c}}$. The sign change is now on
      $[{{1.5^3 - c < 0 ? 1.5 : 1}}, {{1.5^3 - c < 0 ? 2 : 1.5}}]$, so the left endpoint is ${{1.5^3 - c < 0 ? 1.5 : 1}}$.
      (Indeed $\sqrt[3]{ {{c}} } \approx {{nthRoot(c, 3)}}$.)
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 4

  - id: calc-lim-012
    difficulty: 5
    type: numeric
    prompt: |
      Evaluate $\displaystyle\lim_{x \to \infty} \left(\sqrt{x^2 {{signed: a}}x {{signed: b}}} - x\right)$. Give a fraction such as `7/4`, or a decimal to 4 significant figures.
    params:
      a: { int: [-7, 7], not: [-1, 0, 1] }
      b: { int: [-6, 6], not: [0] }
    answer: "a / 2"
    hints:
      - "This is an $\\infty - \\infty$ form. Multiply and divide by the conjugate."
      - "After the conjugate step, divide numerator and denominator by $x$ (for $x > 0$, $\\sqrt{x^2} = x$)."
    solution: |
      Multiply by the conjugate:
      $$\sqrt{x^2 {{signed: a}}x {{signed: b}}} - x = \frac{(x^2 {{signed: a}}x {{signed: b}}) - x^2}{\sqrt{x^2 {{signed: a}}x {{signed: b}}} + x} = \frac{ {{a}}x {{signed: b}} }{\sqrt{x^2 {{signed: a}}x {{signed: b}}} + x}.$$
      Divide top and bottom by $x > 0$:
      $$\frac{ {{a}} {{signed: b}}/x}{\sqrt{1 {{signed: a}}/x {{signed: b}}/x^2} + 1} \to \frac{ {{a}} }{2} = {{frac: a/2}}.$$
    verify: "limit(sqrt(x**2 + a*x + b) - x, x, oo)"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 5

  - id: calc-lim-013
    difficulty: 2
    type: mc
    prompt: |
      What kind of discontinuity does $g(x) = \dfrac{|x - {{c}}|}{x - {{c}}}$ have at $x = {{c}}$?
    params:
      c: { int: [-4, 4] }
    options:
      - "A jump discontinuity: the one-sided limits exist but differ"
      - "A removable discontinuity: the limit exists but $g({{c}})$ is undefined"
      - "An infinite discontinuity: $g$ is unbounded near ${{c}}$"
      - "None: $g$ is continuous at ${{c}}$"
    answer: 0
    hints:
      - "Compute $g(x)$ for $x > {{c}}$ and for $x < {{c}}$ separately."
    solution: |
      For $x > {{c}}$, $g(x) = 1$; for $x < {{c}}$, $g(x) = -1$. Both one-sided limits exist ($1$ and $-1$) but are
      different, so $g$ has a **jump** discontinuity at ${{c}}$.
    verify: "0 if (limit(Abs(x - c)/(x - c), x, c, '+') - limit(Abs(x - c)/(x - c), x, c, '-')).is_nonzero else 1"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 1

  - id: calc-lim-014
    difficulty: 2
    type: estimate
    prompt: |
      The table shows $f(x) = \dfrac{ {{a}}^x - 1}{x}$ at small $x$:

      | $x$ | $0.1$ | $0.01$ | $0.001$ |
      |---|---|---|---|
      | $f(x)$ | ${{f1}}$ | ${{f2}}$ | ${{f3}}$ |

      Estimate $\displaystyle\lim_{x \to 0} f(x)$ to two decimal places.
    params:
      a: { choice: [2, 3, 5, 7, 10] }
    let:
      f1: "(a^0.1 - 1) / 0.1"
      f2: "(a^0.01 - 1) / 0.01"
      f3: "(a^0.001 - 1) / 0.001"
    answer: "log(a)"
    factor: 1.02
    hints:
      - "Look at how the values change as $x$ shrinks by a factor of 10."
      - "The change from $x = 0.01$ to $x = 0.001$ is about a tenth of the change from $0.1$ to $0.01$, so the limit is just past the last value."
    solution: |
      The values settle down: ${{f1}}, {{f2}}, {{f3}}$. The differences shrink by a factor of about 10 each time,
      so the limit is about ${{f3 - (f2 - f3)/9}}$. (Exactly, the limit is $\ln {{a}} \approx {{log(a)}}$:
      it is the derivative of ${{a}}^x$ at $x = 0$.)
    verify: "limit((a**x - 1)/x, x, 0)"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 2
