subject: calculus
topic: integrals-and-the-fundamental-theorem
questions:
  - id: calc-int-001
    difficulty: 1
    type: numeric
    prompt: "Evaluate $\\displaystyle\\int_0^{ {{b}} } \\left({{a}}x^2 + {{c}}\\right)dx$. Give a fraction such as `7/4`, or a decimal to 4 significant figures."
    params:
      a: { int: [2, 6] }
      b: { int: [1, 3] }
      c: { int: [1, 9] }
    answer: "a*b^3/3 + c*b"
    hints:
      - "An antiderivative of ${{a}}x^2 + {{c}}$ is $\\frac{ {{a}} }{3}x^3 + {{c}}x$."
      - "Evaluate it at ${{b}}$ and subtract its value at $0$."
    solution: |
      With $F(x) = \frac{ {{a}} }{3}x^3 + {{c}}x$, the fundamental theorem gives
      $$\int_0^{ {{b}} } \left({{a}}x^2 + {{c}}\right)dx = F({{b}}) - F(0) = \frac{ {{a}} \cdot {{b^3}} }{3} + {{c*b}} = {{frac: a*b^3/3 + c*b}}.$$
    verify: "integrate(a*x**2 + c, (x, 0, b))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 2

  - id: calc-int-002
    difficulty: 1
    type: mc
    prompt: "Let $F(x) = \\displaystyle\\int_2^x \\cos(t^2)\\,dt$. What is $F'(x)$?"
    options:
      - "$\\cos(x^2)$"
      - "$-2x\\sin(x^2)$"
      - "$\\cos(x^2) - \\cos 4$"
      - "$\\sin(x^2)$"
    answer: 0
    hints:
      - "The first fundamental theorem: $\\frac{d}{dx}\\int_a^x f(t)\\,dt = f(x)$ when $f$ is continuous."
    solution: |
      By the first fundamental theorem of calculus, differentiating an integral with respect to its upper limit gives
      back the integrand at that limit: $F'(x) = \cos(x^2)$. No antiderivative of $\cos(t^2)$ is needed (and none
      exists in elementary terms). The lower limit $2$ does not matter.
    verify: "[cos(x**2), -2*x*sin(x**2), cos(x**2) - cos(4), sin(x**2)].index(diff(Integral(cos(t**2), (t, 2, x)), x))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 1

  - id: calc-int-003
    difficulty: 2
    type: expression
    prompt: |
      Let $F(x) = \displaystyle\int_1^{x^2} \left(t^3 + {{a}}\right)dt$. Find $F'(x)$ without evaluating the integral.

      Type an expression in $x$, such as `3x^2(x^4 + 2)`.
    params:
      a: { int: [1, 9] }
    answer: "2*x*(x^6 + a)"
    vars: [x]
    hints:
      - "Write $F(x) = G(x^2)$ where $G(u) = \\int_1^u (t^3 + {{a}})\\,dt$, so $G'(u) = u^3 + {{a}}$."
      - "Chain rule: $F'(x) = G'(x^2)\\cdot 2x$."
    solution: |
      With $G(u) = \int_1^u (t^3 + {{a}})\,dt$, the fundamental theorem gives $G'(u) = u^3 + {{a}}$, and $F(x) = G(x^2)$. So
      $$F'(x) = G'(x^2)\cdot 2x = 2x\left(x^6 + {{a}}\right).$$
    verify: "diff(integrate(t**3 + a, (t, 1, x**2)), x)"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 3

  - id: calc-int-004
    difficulty: 2
    type: numeric
    prompt: "Evaluate $\\displaystyle\\int_{-1}^{ {{c}} } \\left(x^2 - {{k}}\\right)dx$. Give a fraction such as `7/4`, or a decimal to 4 significant figures."
    params:
      c: { int: [1, 3] }
      k: { int: [1, 6] }
    answer: "(c^3 + 1)/3 - k*(c + 1)"
    hints:
      - "An antiderivative is $\\frac{x^3}{3} - {{k}}x$."
      - "Be careful with the lower limit: $(-1)^3 = -1$."
    solution: |
      $$\left[\frac{x^3}{3} - {{k}}x\right]_{-1}^{ {{c}} } = \left(\frac{ {{c^3}} }{3} - {{k*c}}\right) - \left(-\frac{1}{3} + {{k}}\right) = {{frac: (c^3 + 1)/3 - k*(c + 1)}}.$$
      This is a **signed** area: where $x^2 < {{k}}$ the graph is below the axis and counts negatively.
    verify: "integrate(x**2 - k, (x, -1, c))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 2

  - id: calc-int-005
    difficulty: 2
    type: numeric
    prompt: "Evaluate $\\displaystyle\\int_0^{\\pi/{{2*a}}} \\cos({{a}}x)\\,dx$. Give a fraction such as `7/4`, or a decimal to 4 significant figures."
    params:
      a: { int: [2, 6] }
    answer: "1 / a"
    hints:
      - "An antiderivative of $\\cos({{a}}x)$ is $\\frac{1}{ {{a}} }\\sin({{a}}x)$ (check by differentiating)."
    solution: |
      $$\int_0^{\pi/{{2*a}}} \cos({{a}}x)\,dx = \left[\frac{\sin({{a}}x)}{ {{a}} }\right]_0^{\pi/{{2*a}}} = \frac{\sin(\pi/2) - \sin 0}{ {{a}} } = {{frac: 1/a}}.$$
    verify: "integrate(cos(a*x), (x, 0, pi/(2*a)))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 2

  - id: calc-int-006
    difficulty: 2
    type: numeric
    prompt: |
      Approximate $\displaystyle\int_0^{ {{b}} } x^2\,dx$ by a **left** Riemann sum with ${{n}}$ rectangles of equal width.
      What is the sum? Give a fraction such as `7/4`, or a decimal to 4 significant figures.
    params:
      b: { int: [1, 4] }
      n: { int: [2, 6] }
    answer: "(b/n)^3 * (n - 1)*n*(2*n - 1)/6"
    hints:
      - "The width is $\\Delta x = \\frac{ {{b}} }{ {{n}} }$; the left endpoints are $x_i = i\\,\\Delta x$ for $i = 0, 1, \\dots, {{n - 1}}$."
      - "The sum is $\\sum_{i=0}^{ {{n - 1}} } (i\\,\\Delta x)^2\\,\\Delta x = (\\Delta x)^3 \\sum_{i=0}^{ {{n - 1}} } i^2$."
    solution: |
      $\Delta x = {{frac: b/n}}$ and the left endpoints are $0, \Delta x, \dots, {{n - 1}}\Delta x$. The sum is
      $$(\Delta x)^3\left(0^2 + 1^2 + \dots + {{n - 1}}^2\right) = \left({{frac: b/n}}\right)^3 \cdot {{(n - 1)*n*(2*n - 1)/6}} = {{frac: (b/n)^3*(n - 1)*n*(2*n - 1)/6}}.$$
      It underestimates the exact value ${{frac: b^3/3}}$, because $x^2$ is increasing on $[0, {{b}}]$.
    verify: "sum([Rational(b*i, n)**2*Rational(b, n) for i in range(n)])"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 4

  - id: calc-int-007
    difficulty: 3
    type: numeric
    prompt: |
      Evaluate $\displaystyle\lim_{n \to \infty} \sum_{k=1}^{n} \frac{k^{ {{m}} }}{n^{ {{m + 1}} }}$ by recognising it as a Riemann sum.
      Give a fraction such as `7/4`, or a decimal to 4 significant figures.
    params:
      m: { int: [2, 6] }
    answer: "1 / (m + 1)"
    hints:
      - "Rewrite the term as $\\left(\\frac{k}{n}\\right)^{ {{m}} }\\cdot\\frac{1}{n}$."
      - "That is a right Riemann sum for $\\int_0^1 x^{ {{m}} }\\,dx$ with $\\Delta x = \\frac{1}{n}$."
    solution: |
      $$\sum_{k=1}^{n} \frac{k^{ {{m}} }}{n^{ {{m + 1}} }} = \sum_{k=1}^{n} \left(\frac{k}{n}\right)^{ {{m}} }\frac{1}{n},$$
      a right Riemann sum for $f(x) = x^{ {{m}} }$ on $[0, 1]$ with $n$ equal pieces. As $n \to \infty$ it tends to
      $$\int_0^1 x^{ {{m}} }\,dx = \frac{1}{ {{m + 1}} }.$$
    verify: "limit(summation(Symbol('k')**m, (Symbol('k'), 1, Symbol('n')))/Symbol('n')**(m + 1), Symbol('n'), oo)"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 4

  - id: calc-int-008
    difficulty: 4
    type: multipart
    prompt: |
      A particle moves along a line with velocity $v(t) = t^2 - {{p}}t$ (m/s) for $0 \le t \le {{p + extra}}$.
    params:
      p: { int: [1, 4] }
      extra: { int: [1, 3] }
    parts:
      - prompt: "(a) What is its **displacement** (change in position), in metres, over $[0, {{p + extra}}]$? Give a fraction such as `7/4`, or a decimal to 4 significant figures."
        type: numeric
        answer: "(p + extra)^3/3 - p*(p + extra)^2/2"
        verify: "integrate(t**2 - p*t, (t, 0, p + extra))"
      - prompt: "(b) What **total distance**, in metres, does it travel over $[0, {{p + extra}}]$? Give a fraction such as `7/4`, or a decimal to 4 significant figures."
        type: numeric
        answer: "p^3/3 + (p + extra)^3/3 - p*(p + extra)^2/2"
        verify: "(lambda f, T: (lambda pts: sum(Abs(integrate(f, (t, pts[i], pts[i + 1]))) for i in range(len(pts) - 1)))(sorted(set([0, T] + [r for r in solve(f, t) if r.is_real and 0 < r < T]))))(t**2 - p*t, p + extra)"
    hints:
      - "Displacement is $\\int v\\,dt$; distance is $\\int |v|\\,dt$."
      - "$v(t) = t(t - {{p}})$ is negative on $(0, {{p}})$ and positive after, so split the distance integral at $t = {{p}}$."
    solution: |
      An antiderivative of $v$ is $s(t) = \frac{t^3}{3} - \frac{ {{p}} t^2}{2}$.

      (a) Displacement $= s({{p + extra}}) - s(0) = {{frac: (p + extra)^3/3 - p*(p + extra)^2/2}}$ m.

      (b) $v < 0$ on $(0, {{p}})$, so
      $$\int_0^{ {{p + extra}} } |v|\,dt = -\bigl(s({{p}}) - s(0)\bigr) + \bigl(s({{p + extra}}) - s({{p}})\bigr) = {{frac: p^3/6}} + {{frac: (p + extra)^3/3 - p*(p + extra)^2/2 + p^3/6}} = {{frac: p^3/3 + (p + extra)^3/3 - p*(p + extra)^2/2}}\ \text{m}.$$
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 6

  - id: calc-int-009
    difficulty: 3
    type: expression
    prompt: |
      Let $F(x) = \displaystyle\int_x^{x^2} t^{ {{n}} }\,dt$. Find $F'(x)$ using the fundamental theorem (no need to integrate).

      Type an expression in $x$, such as `3x^7 - x^3`.
    params:
      n: { int: [2, 5] }
    answer: "2*x^(2*n + 1) - x^n"
    vars: [x]
    hints:
      - "Split: $\\int_x^{x^2} = \\int_0^{x^2} - \\int_0^{x}$."
      - "Differentiate each piece; the first needs the chain rule."
    solution: |
      $F(x) = \int_0^{x^2} t^{ {{n}} }dt - \int_0^{x} t^{ {{n}} }dt$, so
      $$F'(x) = (x^2)^{ {{n}} }\cdot 2x - x^{ {{n}} } = 2x^{ {{2*n + 1}} } - x^{ {{n}} }.$$
    verify: "diff(integrate(t**n, (t, x, x**2)), x)"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 3

  - id: calc-int-010
    difficulty: 4
    type: numeric
    prompt: "Evaluate $\\displaystyle\\int_0^{ {{p + extra}} } \\left|x^2 - {{p^2}}\\right|dx$. Give a fraction such as `7/4`, or a decimal to 4 significant figures."
    params:
      p: { int: [1, 3] }
      extra: { int: [1, 2] }
    answer: "4*p^3/3 + (p + extra)^3/3 - p^2*(p + extra)"
    hints:
      - "$x^2 - {{p^2}}$ changes sign at $x = {{p}}$."
      - "Split into $\\int_0^{ {{p}} } ({{p^2}} - x^2)\\,dx + \\int_{ {{p}} }^{ {{p + extra}} } (x^2 - {{p^2}})\\,dx$."
    solution: |
      On $[0, {{p}}]$, $|x^2 - {{p^2}}| = {{p^2}} - x^2$; on $[{{p}}, {{p + extra}}]$ it is $x^2 - {{p^2}}$.
      $$\int_0^{ {{p}} } ({{p^2}} - x^2)\,dx = {{frac: 2*p^3/3}}, \qquad \int_{ {{p}} }^{ {{p + extra}} } (x^2 - {{p^2}})\,dx = {{frac: ((p + extra)^3 - p^3)/3 - p^2*extra}}.$$
      The total is ${{frac: 4*p^3/3 + (p + extra)^3/3 - p^2*(p + extra)}}$.
    verify: "(lambda f, T: (lambda pts: sum(Abs(integrate(f, (x, pts[i], pts[i + 1]))) for i in range(len(pts) - 1)))(sorted(set([0, T] + [r for r in solve(f, x) if r.is_real and 0 < r < T]))))(x**2 - p**2, p + extra)"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 5

  - id: calc-int-011
    difficulty: 4
    type: proof
    prompt: |
      Assume the first fundamental theorem: if $f$ is continuous on $[a, b]$ then $A(x) = \int_a^x f(t)\,dt$ satisfies
      $A'(x) = f(x)$. Prove the second: if $F$ is **any** antiderivative of $f$ on $[a, b]$, then
      $\int_a^b f(x)\,dx = F(b) - F(a)$.
    hints:
      - "Consider $G(x) = F(x) - A(x)$. What is $G'$?"
      - "A function with zero derivative on an interval is constant (mean value theorem)."
    solution: |
      Let $G(x) = F(x) - A(x)$. Then $G'(x) = f(x) - f(x) = 0$ on $(a, b)$. By the mean value theorem, for any $x$
      there is a $c$ with $G(x) - G(a) = G'(c)(x - a) = 0$, so $G$ is constant: $F(x) = A(x) + C$.

      Put $x = a$: $A(a) = 0$, so $C = F(a)$. Put $x = b$:
      $$\int_a^b f(t)\,dt = A(b) = F(b) - C = F(b) - F(a). \qquad \blacksquare$$
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 6

  - id: calc-int-012
    difficulty: 3
    type: numeric
    prompt: |
      Find the number $c > 0$ such that $\displaystyle\int_0^{c} \left(x^2 - {{p}}x\right)dx = 0$. Give a fraction such as `7/4`, or a decimal to 4 significant figures.
    params:
      p: { int: [1, 6] }
    answer: "3*p / 2"
    hints:
      - "Evaluate the integral as a function of $c$: $\\frac{c^3}{3} - \\frac{ {{p}} c^2}{2}$."
      - "Factor out $c^2$ and use $c > 0$."
    solution: |
      $$\int_0^c \left(x^2 - {{p}}x\right)dx = \frac{c^3}{3} - \frac{ {{p}} c^2}{2} = c^2\left(\frac{c}{3} - \frac{ {{p}} }{2}\right).$$
      For $c > 0$ this is zero when $c = {{frac: 3*p/2}}$: the negative area on $(0, {{p}})$ is cancelled by the positive area on
      $({{p}}, {{frac: 3*p/2}})$.
    verify: "[r for r in solve(integrate(x**2 - p*x, (x, 0, Symbol('c'))), Symbol('c')) if r > 0][0]"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 3

  - id: calc-int-013
    difficulty: 5
    type: numeric
    prompt: |
      Evaluate $\displaystyle\lim_{x \to 0} \frac{1}{x^3}\int_0^{x} \sin\left({{a}}t^2\right)dt$. Give a fraction such as `7/4`, or a decimal to 4 significant figures.
    params:
      a: { int: [2, 6] }
    answer: "a / 3"
    hints:
      - "Both numerator and denominator tend to $0$. Use L'Hôpital's rule with the fundamental theorem."
      - "After one step you get $\\frac{\\sin({{a}}x^2)}{3x^2}$."
    solution: |
      It is a $\frac{0}{0}$ form. By L'Hôpital's rule and the fundamental theorem,
      $$\lim_{x \to 0} \frac{\int_0^x \sin({{a}}t^2)\,dt}{x^3} = \lim_{x \to 0}\frac{\sin({{a}}x^2)}{3x^2} = \lim_{x \to 0}\frac{ {{a}} }{3}\cdot\frac{\sin({{a}}x^2)}{ {{a}}x^2} = {{frac: a/3}}.$$
      (Alternatively: $\sin({{a}}t^2) \approx {{a}}t^2$ for small $t$, whose integral is $\frac{ {{a}} x^3}{3}$.)
    verify: "limit(integrate(sin(a*t**2), (t, 0, x))/x**3, x, 0)"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 5

  - id: calc-int-014
    difficulty: 2
    type: mc
    prompt: "What is $\\displaystyle\\int_{-{{a}}}^{ {{a}} } x^3\\cos x\\,dx$?"
    params:
      a: { int: [1, 5] }
    options:
      - "$0$"
      - "$2\\displaystyle\\int_0^{ {{a}} } x^3\\cos x\\,dx$"
      - "It cannot be found without an antiderivative of $x^3\\cos x$"
      - "$\\displaystyle\\int_0^{ {{a}} } x^3\\cos x\\,dx$"
    answer: 0
    hints:
      - "Is $f(x) = x^3\\cos x$ even, odd, or neither?"
      - "$f(-x) = (-x)^3\\cos(-x) = -f(x)$."
    solution: |
      $f(x) = x^3\cos x$ is **odd**: $f(-x) = -f(x)$. Over an interval symmetric about $0$, the signed area on
      $[-{{a}}, 0]$ exactly cancels the area on $[0, {{a}}]$, so the integral is $0$. No antiderivative is needed.
    verify: "0 if simplify(integrate(x**3*cos(x), (x, -a, a))) == 0 else 1"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 1
