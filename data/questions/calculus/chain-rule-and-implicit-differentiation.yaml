subject: calculus
topic: chain-rule-and-implicit-differentiation
questions:
  - id: calc-chain-001
    difficulty: 1
    type: expression
    prompt: |
      Differentiate $f(x) = ({{a}}x {{signed: b}})^{ {{n}} }$.

      Type an expression in $x$, such as `5(2x + 1)^4`.
    params:
      a: { int: [2, 5] }
      b: { int: [-6, 6], not: [0] }
      n: { int: [3, 7] }
    answer: "n*a*(a*x + b)^(n-1)"
    vars: [x]
    hints:
      - "Outer function $u^{ {{n}} }$, inner function $u = {{a}}x {{signed: b}}$."
      - "Chain rule: multiply the derivative of the outer function (at the inner one) by the derivative of the inner one, ${{a}}$."
    solution: |
      With $u = {{a}}x {{signed: b}}$, $f = u^{ {{n}} }$ and
      $$f'(x) = {{n}}u^{ {{n - 1}} }\cdot u' = {{n}}({{a}}x {{signed: b}})^{ {{n - 1}} }\cdot {{a}} = {{n*a}}({{a}}x {{signed: b}})^{ {{n - 1}} }.$$
    verify: "diff((a*x + b)**n, x)"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 1

  - id: calc-chain-002
    difficulty: 1
    type: mc
    prompt: "If $h(x) = f(g(x))$ with $f$ and $g$ differentiable, then $h'(x)$ equals:"
    options:
      - "$f'(g(x))\\,g'(x)$"
      - "$f'(x)\\,g'(x)$"
      - "$f'(g'(x))$"
      - "$f(g'(x))\\,g(x)$"
    answer: 0
    hints:
      - "Test the options on an example you can check, e.g. $f = \\sin$, $g(x) = x^2$, $h(x) = \\sin(x^2)$."
    solution: |
      The chain rule: differentiate the outer function **at the inner function**, then multiply by the derivative of
      the inner function: $h'(x) = f'(g(x))\,g'(x)$. For $h(x) = \sin(x^2)$ this gives $\cos(x^2)\cdot 2x$, while
      $f'(x)\,g'(x)$ would give the wrong $\cos(x)\cdot 2x$.
    verify: "[simplify(cand - diff(sin(x**2), x)) for cand in [cos(x**2)*2*x, cos(x)*2*x, cos(2*x), sin(2*x)*x**2]].index(0)"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 1

  - id: calc-chain-003
    difficulty: 2
    type: expression
    prompt: |
      Differentiate $f(x) = \sin\!\left({{a}}x^2 {{signed: b}}\right)$.

      Type an expression in $x$, such as `4x cos(x^2 + 1)`.
    params:
      a: { int: [2, 6] }
      b: { int: [-5, 5], not: [0] }
    answer: "2*a*x*cos(a*x^2 + b)"
    vars: [x]
    hints:
      - "The inner function is $u = {{a}}x^2 {{signed: b}}$."
      - "$\\frac{d}{dx}\\sin u = \\cos u \\cdot u'$ and $u' = {{2*a}}x$."
    solution: |
      $$f'(x) = \cos\!\left({{a}}x^2 {{signed: b}}\right)\cdot\frac{d}{dx}\left({{a}}x^2 {{signed: b}}\right) = {{2*a}}x\cos\!\left({{a}}x^2 {{signed: b}}\right).$$
    verify: "diff(sin(a*x**2 + b), x)"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 2

  - id: calc-chain-004
    difficulty: 2
    type: expression
    prompt: |
      Differentiate $f(x) = \sqrt{x^2 + {{a}}}$.

      Type an expression in $x$; write a square root as `sqrt(...)`.
    params:
      a: { int: [1, 9] }
    answer: "x / sqrt(x^2 + a)"
    vars: [x]
    hints:
      - "Write $f = u^{1/2}$ with $u = x^2 + {{a}}$."
      - "$\\frac{d}{dx}u^{1/2} = \\frac{1}{2}u^{-1/2}u'$."
    solution: |
      $$f'(x) = \frac{1}{2}(x^2 + {{a}})^{-1/2}\cdot 2x = \frac{x}{\sqrt{x^2 + {{a}}}}.$$
    verify: "diff(sqrt(x**2 + a), x)"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 2

  - id: calc-chain-005
    difficulty: 2
    type: numeric
    prompt: |
      Let $h(x) = f(g(x))$. You know only these values:
      $$g({{c}}) = {{p}}, \quad g'({{c}}) = {{w}}, \quad f'({{p}}) = {{r}}, \quad f'({{c}}) = {{s}}.$$
      What is $h'({{c}})$?
    params:
      c: { int: [1, 4] }
      p: { int: [-3, 6] }
      w: { int: [-4, 5], not: [0, 1] }
      r: { int: [-5, 5], not: [0] }
      s: { int: [-5, 5], not: [0] }
    require: ["p != c", "r != s"]
    answer: "r * w"
    hints:
      - "Chain rule: $h'(x) = f'(g(x))\\,g'(x)$."
      - "At $x = {{c}}$, $f'$ is evaluated at $g({{c}}) = {{p}}$, not at ${{c}}$."
    solution: |
      $h'({{c}}) = f'(g({{c}}))\,g'({{c}}) = f'({{p}})\cdot({{w}}) = ({{r}})({{w}}) = {{r*w}}$.
      The value $f'({{c}}) = {{s}}$ is a distractor: $f'$ must be taken at the inner value $g({{c}})$.
    verify: "(lambda f, g: diff(f.subs(x, g), x).subs(x, c))(integrate(r + (s - r)*(x - p)/(c - p), x), p + w*(x - c))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 2

  - id: calc-chain-006
    difficulty: 3
    type: expression
    prompt: |
      The curve $x^2 {{signed: a}}xy + y^2 = {{k}}$ defines $y$ implicitly as a function of $x$. Find $\dfrac{dy}{dx}$.

      Type an expression in $x$ and $y$, such as `-(2x + y)/(x + 2y)`.
    params:
      a: { int: [3, 6] }
      k: { int: [5, 30] }
    answer: "-(2*x + a*y) / (a*x + 2*y)"
    vars: [x, y]
    domain: [0.5, 3]
    hints:
      - "Differentiate both sides with respect to $x$, treating $y$ as a function of $x$: $\\frac{d}{dx}y^2 = 2y\\,y'$."
      - "The middle term needs the product rule: $\\frac{d}{dx}(xy) = y + xy'$."
    solution: |
      Differentiate each term:
      $$2x + {{a}}(y + xy') + 2y\,y' = 0.$$
      Collect the $y'$ terms: $({{a}}x + 2y)\,y' = -(2x + {{a}}y)$, so
      $$\frac{dy}{dx} = -\frac{2x + {{a}}y}{ {{a}}x + 2y}.$$
    verify: "idiff(x**2 + a*x*y + y**2 - k, y, x)"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 4

  - id: calc-chain-007
    difficulty: 3
    type: numeric
    prompt: |
      The point $({{p}}, {{q}})$ lies on the curve $x^3 + y^3 = {{p^3 + q^3}}$. What is the slope of the tangent line there?
      Give a fraction such as `7/4`, or a decimal to 4 significant figures.
    params:
      p: { int: [1, 4] }
      q: { int: [1, 4] }
    require: ["p != q"]
    answer: "-p^2 / q^2"
    hints:
      - "Differentiate implicitly: $3x^2 + 3y^2\\,y' = 0$."
      - "Solve for $y'$ and substitute $x = {{p}}$, $y = {{q}}$."
    solution: |
      Implicit differentiation gives $3x^2 + 3y^2 y' = 0$, so $y' = -\dfrac{x^2}{y^2}$.
      At $({{p}}, {{q}})$: $y' = -\dfrac{ {{p^2}} }{ {{q^2}} } = {{frac: -p^2/q^2}}$.
    verify: "idiff(x**3 + y**3 - (p**3 + q**3), y, x).subs({x: p, y: q})"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 3

  - id: calc-chain-008
    difficulty: 3
    type: expression
    prompt: |
      Differentiate $f(x) = \arctan({{a}}x)$.

      Type an expression in $x$, such as `3/(2 + x^2)`.
    params:
      a: { int: [2, 6] }
    answer: "a / (1 + a^2*x^2)"
    vars: [x]
    hints:
      - "$\\frac{d}{du}\\arctan u = \\frac{1}{1 + u^2}$. (Derive it by differentiating $\\tan y = u$ implicitly.)"
      - "With $u = {{a}}x$, multiply by $u' = {{a}}$."
    solution: |
      If $y = \arctan u$ then $\tan y = u$, so $\sec^2 y\,\frac{dy}{du} = 1$ and $\frac{dy}{du} = \frac{1}{1 + \tan^2 y} = \frac{1}{1 + u^2}$.
      By the chain rule with $u = {{a}}x$:
      $$f'(x) = \frac{1}{1 + ({{a}}x)^2}\cdot {{a}} = \frac{ {{a}} }{1 + {{a^2}}x^2}.$$
    verify: "diff(atan(a*x), x)"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 3

  - id: calc-chain-009
    difficulty: 4
    type: numeric
    prompt: |
      Let $f(x) = x^3 {{signed: a}}x {{signed: b}}$, which is increasing, so it has an inverse $f^{-1}$.
      Find $\left(f^{-1}\right)'({{d}})$. Give a fraction such as `7/4`, or a decimal to 4 significant figures.
    params:
      a: { int: [2, 5] }
      b: { int: [-5, 5], not: [0] }
      c: { int: [-2, 2] }
    let:
      d: "c^3 + a*c + b"
    answer: "1 / (3*c^2 + a)"
    hints:
      - "Differentiate $f(f^{-1}(y)) = y$: $f'(f^{-1}(y))\\,(f^{-1})'(y) = 1$."
      - "First find the $x$ with $f(x) = {{d}}$; try small integers."
    solution: |
      Differentiating $f(f^{-1}(y)) = y$ gives $(f^{-1})'(y) = \dfrac{1}{f'(f^{-1}(y))}$.
      Since $f({{c}}) = ({{c}})^3 {{signed: a}}({{c}}) {{signed: b}} = {{d}}$, we have $f^{-1}({{d}}) = {{c}}$.
      With $f'(x) = 3x^2 + {{a}}$, $f'({{c}}) = {{3*c^2 + a}}$, so $(f^{-1})'({{d}}) = {{frac: 1/(3*c^2 + a)}}$.
    verify: "[1/diff(x**3 + a*x + b, x).subs(x, r) for r in solve(x**3 + a*x + b - (c**3 + a*c + b), x) if r.is_real][0]"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 5

  - id: calc-chain-010
    difficulty: 4
    type: multipart
    prompt: |
      The point $({{p}}, {{q}})$ lies on the curve $x^2 y + y^3 = {{k}}$.
    params:
      p: { int: [1, 3] }
      q: { int: [1, 3] }
    let:
      k: "p^2*q + q^3"
    parts:
      - prompt: "(a) What is $\\dfrac{dy}{dx}$ at $({{p}}, {{q}})$? Give a fraction such as `7/4`, or a decimal to 4 significant figures."
        type: numeric
        answer: "-2*p*q / (p^2 + 3*q^2)"
        verify: "idiff(x**2*y + y**3 - (p**2*q + q**3), y, x).subs({x: p, y: q})"
      - prompt: "(b) Using your slope from (a), what is the $y$-intercept of the tangent line at $({{p}}, {{q}})$?"
        type: numeric
        answer: "q - part1*p"
        verify: "solve(Eq(q, part1*p + Symbol('B')), Symbol('B'))[0]"
    hints:
      - "Differentiate implicitly; $x^2y$ needs the product rule: $2xy + x^2y'$."
      - "The tangent line is $y = {{q}} + m(x - {{p}})$; set $x = 0$."
    solution: |
      (a) Differentiating, $2xy + x^2y' + 3y^2y' = 0$, so $y' = -\dfrac{2xy}{x^2 + 3y^2}$.
      At $({{p}}, {{q}})$: $y' = -\dfrac{ {{2*p*q}} }{ {{p^2 + 3*q^2}} } = {{frac: -2*p*q/(p^2 + 3*q^2)}}$.

      (b) The tangent line is $y = {{q}} + m(x - {{p}})$ with $m$ from (a). At $x = 0$:
      $y = {{q}} - {{p}}m = {{q}} + {{frac: 2*p^2*q/(p^2 + 3*q^2)}} = {{frac: q + 2*p^2*q/(p^2 + 3*q^2)}}$.
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 6

  - id: calc-chain-011
    difficulty: 3
    type: expression
    prompt: |
      Differentiate $f(x) = \sin^{ {{n}} }({{a}}x)$.

      Type an expression in $x$; write $\sin^k(u)$ as `sin(u)^k`, e.g. `2 sin(x)^3 cos(x)`.
    params:
      n: { int: [2, 5] }
      a: { int: [2, 5] }
    answer: "n*a*sin(a*x)^(n-1)*cos(a*x)"
    vars: [x]
    hints:
      - "There are three layers: $u^{ {{n}} }$, then $\\sin v$, then $v = {{a}}x$."
      - "Chain rule twice: ${{n}}\\sin^{ {{n - 1}} }({{a}}x)\\cdot\\cos({{a}}x)\\cdot{{a}}$."
    solution: |
      Outer layer: $\frac{d}{du}u^{ {{n}} } = {{n}}u^{ {{n - 1}} }$ with $u = \sin({{a}}x)$.
      Middle: $\frac{d}{dx}\sin({{a}}x) = {{a}}\cos({{a}}x)$. Multiplying,
      $$f'(x) = {{n*a}}\sin^{ {{n - 1}} }({{a}}x)\cos({{a}}x).$$
    verify: "diff(sin(a*x)**n, x)"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 3

  - id: calc-chain-012
    difficulty: 4
    type: proof
    prompt: |
      Using implicit differentiation, prove that $\dfrac{d}{dx}\arcsin x = \dfrac{1}{\sqrt{1 - x^2}}$ for $-1 < x < 1$.
      Explain why the positive square root is the right one.
    hints:
      - "Let $y = \\arcsin x$, so $\\sin y = x$ with $-\\pi/2 < y < \\pi/2$."
      - "Differentiate $\\sin y = x$ and express $\\cos y$ in terms of $x$."
    solution: |
      Let $y = \arcsin x$, so $\sin y = x$ and $-\frac{\pi}{2} < y < \frac{\pi}{2}$. Differentiating with respect to $x$:
      $$\cos y\,\frac{dy}{dx} = 1 \quad\Longrightarrow\quad \frac{dy}{dx} = \frac{1}{\cos y}.$$
      From $\sin^2 y + \cos^2 y = 1$, $\cos y = \pm\sqrt{1 - x^2}$. On $\left(-\frac{\pi}{2}, \frac{\pi}{2}\right)$ the cosine is
      positive, so $\cos y = \sqrt{1 - x^2}$, which is non-zero for $|x| < 1$. Hence $\dfrac{d}{dx}\arcsin x = \dfrac{1}{\sqrt{1 - x^2}}$. $\blacksquare$
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 6

  - id: calc-chain-013
    difficulty: 5
    type: numeric
    prompt: |
      On the circle $x^2 + y^2 = {{p^2 + q^2}}$, find $\dfrac{d^2y}{dx^2}$ at the point $({{p}}, {{q}})$.
      Give a fraction such as `7/4`, or a decimal to 4 significant figures.
    params:
      p: { int: [1, 4] }
      q: { int: [1, 4] }
    answer: "-(p^2 + q^2) / q^3"
    hints:
      - "First derivative: $y' = -x/y$."
      - "Differentiate $y' = -x/y$ again with the quotient rule, then substitute $y' = -x/y$ and use $x^2 + y^2 = {{p^2 + q^2}}$."
    solution: |
      From $2x + 2yy' = 0$, $y' = -\dfrac{x}{y}$. Differentiating again,
      $$y'' = -\frac{y - xy'}{y^2} = -\frac{y + x^2/y}{y^2} = -\frac{x^2 + y^2}{y^3} = -\frac{ {{p^2 + q^2}} }{y^3}.$$
      At $y = {{q}}$: $y'' = -\dfrac{ {{p^2 + q^2}} }{ {{q^3}} } = {{frac: -(p^2 + q^2)/q^3}}$.
    verify: "idiff(x**2 + y**2 - (p**2 + q**2), y, x, 2).subs({x: p, y: q})"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 6

  - id: calc-chain-014
    difficulty: 2
    type: mc
    prompt: "Which is $\\dfrac{d}{dx}\\cos\\left(x^{ {{n}} }\\right)$?"
    params:
      n: { int: [3, 6] }
    options:
      - "$-{{n}}x^{ {{n - 1}} }\\sin\\left(x^{ {{n}} }\\right)$"
      - "$-\\sin\\left({{n}}x^{ {{n - 1}} }\\right)$"
      - "${{n}}x^{ {{n - 1}} }\\sin\\left(x^{ {{n}} }\\right)$"
      - "$-{{n}}x^{ {{n - 1}} }\\cos\\left(x^{ {{n}} }\\right)$"
    answer: 0
    hints:
      - "$\\frac{d}{du}\\cos u = -\\sin u$, evaluated at the inner function $u = x^{ {{n}} }$."
    solution: |
      Chain rule with $u = x^{ {{n}} }$: $\frac{d}{dx}\cos u = -\sin u \cdot u' = -{{n}}x^{ {{n - 1}} }\sin\left(x^{ {{n}} }\right)$.
      $-\sin\left({{n}}x^{ {{n - 1}} }\right)$ differentiates the inner function in the wrong place; the version without the
      minus sign forgets that $(\cos u)' = -\sin u$; the version with $\cos$ forgets to differentiate the cosine at all.
    verify: "[simplify(cand - diff(cos(x**n), x)) for cand in [-n*x**(n-1)*sin(x**n), -sin(n*x**(n-1)), n*x**(n-1)*sin(x**n), -n*x**(n-1)*cos(x**n)]].index(0)"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 1
