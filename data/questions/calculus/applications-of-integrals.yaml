subject: calculus
topic: applications-of-integrals
questions:
  - id: calc-aint-001
    difficulty: 1
    type: numeric
    prompt: "What is the average value of $f(x) = {{m}}x {{signed: q}}$ on the interval $[0, {{b}}]$?"
    params:
      m: { int: [2, 6] }
      q: { int: [-5, 5], not: [0] }
      b: { int: [2, 6] }
    answer: "m*b/2 + q"
    hints:
      - "Average value: $\\bar f = \\frac{1}{b - a}\\int_a^b f(x)\\,dx$."
      - "$\\int_0^{ {{b}} } ({{m}}x {{signed: q}})\\,dx = \\frac{ {{m}} \\cdot {{b^2}} }{2} {{signed: q}} \\cdot {{b}}$."
    solution: |
      $$\bar f = \frac{1}{ {{b}} }\int_0^{ {{b}} } \left({{m}}x {{signed: q}}\right)dx = \frac{1}{ {{b}} }\left(\frac{ {{m*b^2}} }{2} {{signed: q*b}}\right) = {{m*b/2 + q}}.$$
      (For a linear function the average is just the value at the midpoint, $f({{b/2}})$.)
    verify: "integrate(m*x + q, (x, 0, b))/b"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 2

  - id: calc-aint-002
    difficulty: 1
    type: mc
    prompt: |
      The region under the graph of a continuous $f(x) \ge 0$, for $a \le x \le b$, is rotated about the $x$-axis.
      Which integral gives the volume of the solid?
    options:
      - "$\\displaystyle\\int_a^b \\pi f(x)^2\\,dx$"
      - "$\\displaystyle\\int_a^b 2\\pi x f(x)\\,dx$"
      - "$\\displaystyle\\int_a^b \\pi f(x)\\,dx$"
      - "$\\displaystyle\\int_a^b f(x)^2\\,dx$"
    answer: 0
    hints:
      - "Slice perpendicular to the $x$-axis. What shape is each slice, and what is its radius?"
      - "Check your choice on $f(x) = 2$ on $[0, 1]$, which gives a cylinder of radius 2 and height 1."
    solution: |
      Each slice at $x$ is a disk of radius $f(x)$ and thickness $dx$, with volume $\pi f(x)^2\,dx$. Adding them up gives
      $V = \int_a^b \pi f(x)^2\,dx$. Check: $f = 2$ on $[0, 1]$ gives $4\pi$, the volume $\pi r^2 h$ of that cylinder.
      ($\int 2\pi x f(x)\,dx$ is the shell formula for rotating about the $y$-axis.)
    verify: "[integrate(pi*2**2, (x, 0, 1)), integrate(2*pi*x*2, (x, 0, 1)), integrate(pi*2, (x, 0, 1)), integrate(2**2, (x, 0, 1))].index(pi*2**2*1)"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 1

  - id: calc-aint-003
    difficulty: 2
    type: numeric
    prompt: "Find the area of the region enclosed by $y = {{a}}x$ and $y = x^2$. Give a fraction such as `7/4`, or a decimal to 4 significant figures."
    params:
      a: { int: [2, 6] }
    answer: "a^3 / 6"
    hints:
      - "The curves meet where $x^2 = {{a}}x$: at $x = 0$ and $x = {{a}}$."
      - "On $[0, {{a}}]$ the line is above the parabola, so integrate ${{a}}x - x^2$."
    solution: |
      The curves meet at $x = 0$ and $x = {{a}}$, and the line is on top in between:
      $$\int_0^{ {{a}} } \left({{a}}x - x^2\right)dx = \left[\frac{ {{a}} x^2}{2} - \frac{x^3}{3}\right]_0^{ {{a}} } = \frac{ {{a^3}} }{2} - \frac{ {{a^3}} }{3} = {{frac: a^3/6}}.$$
    verify: "(lambda r: Abs(integrate(a*x - x**2, (x, min(r), max(r)))))(solve(a*x - x**2, x))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 3

  - id: calc-aint-004
    difficulty: 2
    type: numeric
    prompt: "Find the area of the region enclosed by the parabola $y = x^2$ and the line $y = 2x + {{k}}$. Give a fraction such as `7/4`, or a decimal to 4 significant figures."
    params:
      k: { choice: [3, 8, 15, 24] }
    answer: "4/3 * (1 + k)^(3/2)"
    hints:
      - "Solve $x^2 = 2x + {{k}}$ for the intersection points."
      - "Between them the line is above the parabola: integrate $2x + {{k}} - x^2$."
    solution: |
      $x^2 - 2x - {{k}} = 0$ gives $x = 1 \pm {{sqrt(1 + k)}}$, i.e. $x = {{1 - sqrt(1 + k)}}$ and $x = {{1 + sqrt(1 + k)}}$. The area is
      $$\int_{ {{1 - sqrt(1 + k)}} }^{ {{1 + sqrt(1 + k)}} } \left(2x + {{k}} - x^2\right)dx = \left[x^2 + {{k}}x - \frac{x^3}{3}\right]_{ {{1 - sqrt(1 + k)}} }^{ {{1 + sqrt(1 + k)}} } = {{frac: 4/3*(1 + k)^(3/2)}}.$$
      (A neat check: the area between a parabola $y = x^2$ and a chord with endpoints $w$ apart in $x$ is always $\frac{w^3}{6}$; here $w = {{2*sqrt(1 + k)}}$.)
    verify: "(lambda r: integrate(2*x + k - x**2, (x, min(r), max(r))))(solve(x**2 - 2*x - k, x))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 4

  - id: calc-aint-005
    difficulty: 2
    type: numeric
    prompt: |
      The region under $y = x^2$ for $0 \le x \le {{b}}$ is rotated about the $x$-axis. What is the volume of the solid?
      Give a decimal (4 significant figures or more).
    params:
      b: { int: [1, 3] }
    answer: "pi * b^5 / 5"
    hints:
      - "Disks: $V = \\int_0^{ {{b}} } \\pi (x^2)^2\\,dx$."
    solution: |
      Each slice is a disk of radius $x^2$:
      $$V = \int_0^{ {{b}} } \pi x^4\,dx = \frac{\pi \cdot {{b^5}} }{5} \approx {{pi*b^5/5}}.$$
    verify: "integrate(pi*(x**2)**2, (x, 0, b))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 2

  - id: calc-aint-006
    difficulty: 3
    type: numeric
    prompt: |
      The region between the $x$-axis and $y = x({{c}} - x)$, for $0 \le x \le {{c}}$, is rotated about the **$y$-axis**.
      Find the volume. Give a decimal (4 significant figures or more).
    params:
      c: { int: [1, 4] }
    answer: "pi * c^4 / 6"
    hints:
      - "Cylindrical shells: a strip at $x$ of height $f(x)$ sweeps a shell of volume $2\\pi x f(x)\\,dx$."
      - "$V = 2\\pi\\int_0^{ {{c}} } x \\cdot x({{c}} - x)\\,dx$."
    solution: |
      By shells,
      $$V = 2\pi\int_0^{ {{c}} } x^2({{c}} - x)\,dx = 2\pi\left[\frac{ {{c}} x^3}{3} - \frac{x^4}{4}\right]_0^{ {{c}} } = 2\pi\cdot\frac{ {{c^4}} }{12} = \frac{ {{c^4}}\pi}{6} \approx {{pi*c^4/6}}.$$
    verify: "integrate(2*pi*x*x*(c - x), (x, 0, c))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 4

  - id: calc-aint-007
    difficulty: 3
    type: numeric
    prompt: |
      The region enclosed by $y = {{a}}x$ and $y = x^2$ is rotated about the $x$-axis. Find the volume of the solid.
      Give a decimal (4 significant figures or more).
    params:
      a: { int: [1, 3] }
    answer: "2*pi*a^5 / 15"
    hints:
      - "Washers: outer radius ${{a}}x$ (the line), inner radius $x^2$, for $0 \\le x \\le {{a}}$."
      - "$V = \\pi\\int_0^{ {{a}} } \\left(({{a}}x)^2 - (x^2)^2\\right)dx$."
    solution: |
      The curves meet at $x = 0$ and $x = {{a}}$; there the line is above the parabola. Each slice is a washer:
      $$V = \pi\int_0^{ {{a}} }\left({{a^2}}x^2 - x^4\right)dx = \pi\left(\frac{ {{a^2}}\cdot{{a^3}} }{3} - \frac{ {{a^5}} }{5}\right) = \frac{ {{2*a^5}}\pi}{15} \approx {{2*pi*a^5/15}}.$$
    verify: "(lambda r: integrate(pi*((a*x)**2 - (x**2)**2), (x, min(r), max(r))))(solve(a*x - x**2, x))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 4

  - id: calc-aint-008
    difficulty: 2
    type: numeric
    prompt: |
      A spring has constant ${{k}}$ N/m (Hooke's law: $F = kx$, with $x$ the stretch from natural length).
      How much work does it take to stretch it from ${{d1}}$ m to ${{d1 + extra}}$ m beyond its natural length?
      Give a value with units, such as `2.5 J`.
    params:
      k: { choice: [50, 100, 150, 200, 250, 300] }
      d1: { choice: [0, 0.1, 0.2] }
      extra: { choice: [0.1, 0.2, 0.3] }
    answer: "k*((d1 + extra)^2 - d1^2)/2"
    units: "J"
    hints:
      - "Work is $W = \\int F\\,dx$ over the stretch."
      - "$W = \\int_{ {{d1}} }^{ {{d1 + extra}} } {{k}}x\\,dx$."
    solution: |
      $$W = \int_{ {{d1}} }^{ {{d1 + extra}} } {{k}}x\,dx = \frac{ {{k}} }{2}\left({{d1 + extra}}^2 - {{d1}}^2\right) = {{k*((d1 + extra)^2 - d1^2)/2}}\ \text{J}.$$
    verify: "integrate(k*x, (x, d1, d1 + extra))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 3

  - id: calc-aint-009
    difficulty: 4
    type: numeric
    prompt: |
      A vertical cylindrical tank of radius ${{R}}$ m and height ${{H}}$ m is full of water (density $1000$ kg/m³).
      How much work is needed to pump all the water out over the **top** rim? Use $g = 9.8$ m/s².
      Give a value with units, such as `1.2e5 J` or `120 kJ`.
    params:
      R: { real: [0.5, 2], step: 0.5 }
      H: { int: [1, 4] }
    answer: "1000 * 9.8 * pi * R^2 * H^2 / 2"
    units: "J"
    tolerance: { rel: 0.002 }
    hints:
      - "Slice the water into horizontal layers of thickness $dy$ at height $y$ above the bottom."
      - "A layer weighs $1000 \\cdot 9.8 \\cdot \\pi ({{R}})^2\\,dy$ newtons and must be lifted ${{H}} - y$ metres."
    solution: |
      The layer at height $y$ has volume $\pi ({{R}})^2\,dy$, weight $1000 \cdot 9.8 \cdot \pi ({{R}})^2\,dy$ N, and is lifted $({{H}} - y)$ m:
      $$W = \int_0^{ {{H}} } 9800\pi ({{R}})^2 ({{H}} - y)\,dy = 9800\pi ({{R}})^2\cdot\frac{ {{H}}^2}{2} \approx {{9.8*pi*R^2*H^2/2}}\ \text{kJ}.$$
      (Equivalently: the whole mass is lifted by the distance its centre of mass travels, $\frac{ {{H}} }{2}$ m.)
    verify: "integrate(1000*Rational(98, 10)*pi*R**2*(H - y), (y, 0, H))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 6

  - id: calc-aint-010
    difficulty: 3
    type: numeric
    prompt: |
      Find the length of the curve $y = \tfrac{2}{3}x^{3/2}$ from $x = 0$ to $x = {{b}}$. Give a decimal (4 significant figures or more).
    params:
      b: { int: [1, 8] }
    answer: "2/3 * ((1 + b)^(3/2) - 1)"
    hints:
      - "Arc length: $L = \\int_a^b \\sqrt{1 + (y')^2}\\,dx$."
      - "$y' = x^{1/2}$, so $1 + (y')^2 = 1 + x$."
    solution: |
      $y' = x^{1/2}$, so
      $$L = \int_0^{ {{b}} } \sqrt{1 + x}\,dx = \left[\tfrac{2}{3}(1 + x)^{3/2}\right]_0^{ {{b}} } = \tfrac{2}{3}\left({{1 + b}}^{3/2} - 1\right) \approx {{2/3*((1 + b)^(3/2) - 1)}}.$$
    verify: "integrate(sqrt(1 + diff(Rational(2, 3)*x**Rational(3, 2), x)**2), (x, 0, b))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 4

  - id: calc-aint-011
    difficulty: 4
    type: multipart
    prompt: |
      Let $\mathcal{R}$ be the region between the parabola $y = x^2$ and the line $y = {{c}}$.
    params:
      c: { choice: [1, 4, 9, 16] }
    parts:
      - prompt: "(a) What is the area of $\\mathcal{R}$? Give a fraction such as `7/4`, or a decimal to 4 significant figures."
        type: numeric
        answer: "4/3 * c^(3/2)"
        verify: "integrate(c - x**2, (x, -sqrt(c), sqrt(c)))"
      - prompt: "(b) Using your area from (a), find the height $m$ such that the horizontal line $y = m$ cuts $\\mathcal{R}$ into two pieces of equal area. Give 4 significant figures."
        type: numeric
        answer: "(3*part1/8)^(2/3)"
        tolerance: { rel: 0.001 }
        verify: "(lambda m: [r for r in solve(Eq(integrate(m - x**2, (x, -sqrt(m), sqrt(m))), part1/2), m) if r.is_real and r > 0][0])(Symbol('m', positive=True))"
    hints:
      - "The parabola meets $y = {{c}}$ at $x = \\pm{{sqrt(c)}}$; integrate ${{c}} - x^2$ between them."
      - "The part below $y = m$ is the same kind of region with $m$ in place of ${{c}}$. Its area is $\\frac{4}{3}m^{3/2}$; set that equal to half of (a)."
    solution: |
      (a) $$\int_{-{{sqrt(c)}}}^{ {{sqrt(c)}} } \left({{c}} - x^2\right)dx = 2\left({{c*sqrt(c)}} - \frac{ {{c*sqrt(c)}} }{3}\right) = {{frac: 4/3*c^(3/2)}}.$$

      (b) By the same computation, the region between $y = x^2$ and $y = m$ has area $\frac{4}{3}m^{3/2}$. Setting it equal to
      half of (a): $\frac{4}{3}m^{3/2} = {{frac: 2/3*c^(3/2)}}$, so $m^{3/2} = \frac{ {{c*sqrt(c)}} }{2}$ and
      $$m = \frac{ {{c}} }{2^{2/3}} \approx {{c/2^(2/3)}}.$$
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 7

  - id: calc-aint-012
    difficulty: 2
    type: estimate
    prompt: |
      Water flows into a tank. The inflow rate $r(t)$ is measured every 10 minutes:

      | $t$ (min) | $0$ | $10$ | $20$ | $30$ |
      |---|---|---|---|---|
      | $r(t)$ (L/min) | ${{r0}}$ | ${{r1}}$ | ${{r2}}$ | ${{r3}}$ |

      Estimate the total volume of water, in litres, that flows in over the 30 minutes.
    params:
      r0: { int: [10, 30] }
      r1: { int: [20, 40] }
      r2: { int: [25, 45] }
      r3: { int: [15, 35] }
    answer: "10 * (r0/2 + r1 + r2 + r3/2)"
    factor: 1.25
    hints:
      - "Total volume is $\\int_0^{30} r(t)\\,dt$. You only have samples, so approximate the integral."
      - "Trapezoid rule: $\\Delta t\\left(\\tfrac{1}{2}r_0 + r_1 + r_2 + \\tfrac{1}{2}r_3\\right)$ with $\\Delta t = 10$."
    solution: |
      The volume is $\int_0^{30} r(t)\,dt$. The trapezoid rule with $\Delta t = 10$ gives
      $$10\left(\frac{ {{r0}} }{2} + {{r1}} + {{r2}} + \frac{ {{r3}} }{2}\right) = {{10*(r0/2 + r1 + r2 + r3/2)}}\ \text{L}.$$
      Left or right Riemann sums (${{10*(r0 + r1 + r2)}}$ or ${{10*(r1 + r2 + r3)}}$ L) are fine estimates too.
    verify: "float(np.trapezoid([r0, r1, r2, r3], dx=10))"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 3

  - id: calc-aint-013
    difficulty: 5
    type: numeric
    prompt: |
      The disk $(x - {{R}})^2 + y^2 \le {{r^2}}$ is rotated about the $y$-axis, producing a torus (a doughnut).
      Use cylindrical shells to find its volume. Give a decimal (4 significant figures or more).
    params:
      R: { int: [3, 6] }
      r: { int: [1, 2] }
    answer: "2 * pi^2 * R * r^2"
    hints:
      - "A shell at $x$ (for ${{R - r}} \\le x \\le {{R + r}}$) has height $2\\sqrt{ {{r^2}} - (x - {{R}})^2}$."
      - "Substitute $u = x - {{R}}$. The term with $u\\sqrt{ {{r^2}} - u^2}$ integrates to $0$ (odd), and $\\int_{-{{r}}}^{ {{r}} }\\sqrt{ {{r^2}} - u^2}\\,du$ is half a disk's area."
    solution: |
      $$V = \int_{ {{R - r}} }^{ {{R + r}} } 2\pi x\cdot 2\sqrt{ {{r^2}} - (x - {{R}})^2}\,dx.$$
      With $u = x - {{R}}$:
      $$V = 4\pi\int_{-{{r}}}^{ {{r}} } (u + {{R}})\sqrt{ {{r^2}} - u^2}\,du = 4\pi\left(0 + {{R}}\cdot\frac{\pi \cdot {{r^2}} }{2}\right) = {{2*R*r^2}}\pi^2 \approx {{2*pi^2*R*r^2}}.$$
      This is Pappus's theorem: area $\pi \cdot {{r^2}}$ times the distance $2\pi \cdot {{R}}$ travelled by the centre.
    verify: "Integral(2*pi*x*2*sqrt(r**2 - (x - R)**2), (x, R - r, R + r)).evalf(30)"
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 8

  - id: calc-aint-014
    difficulty: 3
    type: proof
    prompt: |
      Derive the volume $V = \tfrac{1}{3}\pi r^2 h$ of a right circular cone of base radius $r$ and height $h$ by slicing
      it into thin disks and integrating.
    hints:
      - "Put the apex at the origin with the axis along the $x$-axis, so the base is at $x = h$."
      - "By similar triangles, the slice at $x$ has radius $\\frac{r}{h}x$."
    solution: |
      Place the apex at $x = 0$ and the base at $x = h$. By similar triangles the cross-section at $x$ is a disk of
      radius $\rho(x) = \frac{r}{h}x$, with area $\pi\frac{r^2}{h^2}x^2$. Adding slices of thickness $dx$:
      $$V = \int_0^h \pi\frac{r^2}{h^2}x^2\,dx = \pi\frac{r^2}{h^2}\cdot\frac{h^3}{3} = \frac{1}{3}\pi r^2 h. \qquad\blacksquare$$
      (Equivalently: rotate the line $y = \frac{r}{h}x$, $0 \le x \le h$, about the $x$-axis.)
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 5
