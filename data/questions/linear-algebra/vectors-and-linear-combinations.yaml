subject: linear-algebra
topic: vectors-and-linear-combinations
questions:
  - id: la-vec-001
    difficulty: 1
    type: vector
    prompt: |
      Let $\mathbf{u} = {{u}}$ and $\mathbf{v} = {{v}}$. Compute the linear combination $ {{a}}\mathbf{u} {{signed: b}}\mathbf{v}$.

      Enter the result as a list such as `1, 2, 3`.
    params:
      u1: { int: [-4, 4] }
      u2: { int: [-4, 4] }
      u3: { int: [-4, 4] }
      v1: { int: [-4, 4] }
      v2: { int: [-4, 4] }
      v3: { int: [-4, 4] }
      a: { int: [-3, 3], not: [0] }
      b: { int: [-3, 3], not: [0] }
    let:
      u: "[u1, u2, u3]"
      v: "[v1, v2, v3]"
      w: "a*u + b*v"
    answer: w
    hints:
      - 'Scale each vector first: multiply every component of $\mathbf{u}$ by ${{a}}$ and every component of $\mathbf{v}$ by ${{b}}$.'
      - 'Then add the two scaled vectors component by component.'
    solution: |
      Scaling: ${{a}}\mathbf{u} = {{a*u}}$ and ${{b}}\mathbf{v} = {{b*v}}$.

      Adding component by component:
      $$ {{a}}\mathbf{u} {{signed: b}}\mathbf{v} = {{w}}. $$
    verify: "list(a*Matrix([u1, u2, u3]) + b*Matrix([v1, v2, v3]))"
    covers: [mit-18-06/lecture-1, game-developer/vector, game-developer/linear-algebra]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 2

  - id: la-vec-002
    difficulty: 1
    type: mc
    prompt: |
      $\mathbf{v}$ and $\mathbf{w}$ are two non-zero vectors in $\mathbb{R}^3$ that do not lie on the same line through the origin.
      What do **all** the linear combinations $c\mathbf{v} + d\mathbf{w}$ (with $c, d$ any real numbers) fill?
    options:
      - "A plane through the origin"
      - "A line through the origin"
      - "All of $\\mathbb{R}^3$"
      - "A plane that does not pass through the origin"
    answer: 0
    hints:
      - 'Try $c = d = 0$: which point is always a combination?'
      - 'Two independent directions give two degrees of freedom.'
    solution: |
      Taking $c = d = 0$ gives $\mathbf{0}$, so the set contains the origin. The multiples $c\mathbf{v}$ fill one line and the multiples
      $d\mathbf{w}$ fill a different line; adding them sweeps out the whole **plane** through $\mathbf{0}$ containing both lines.
      It cannot be all of $\mathbb{R}^3$: two directions only give two degrees of freedom.
    verify: "0 if Matrix([[1, 0], [2, 1], [0, 3]]).rank() == 2 else 1"
    covers: [mit-18-06/lecture-1, game-developer/vector, game-developer/linear-algebra]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 1

  - id: la-vec-003
    difficulty: 2
    type: vector
    prompt: |
      Let $\mathbf{v} = {{v}}$, $\mathbf{w} = {{w}}$ and $\mathbf{b} = {{bb}}$.
      Find the numbers $c$ and $d$ with $c\mathbf{v} + d\mathbf{w} = \mathbf{b}$.

      Enter them as `c, d`.
    params:
      v1: { int: [-3, 3] }
      v2: { int: [-3, 3] }
      w1: { int: [-3, 3] }
      w2: { int: [-3, 3] }
      c: { int: [-4, 4] }
      d: { int: [-4, 4] }
    let:
      v: "[v1, v2]"
      w: "[w1, w2]"
      bb: "c*v + d*w"
      det2: "v1*w2 - w1*v2"
    require: ["det2 != 0"]
    answer: "[c, d]"
    hints:
      - 'Write the vector equation as two ordinary equations, one per component.'
      - 'The equations are ${{v1}}c {{signed: w1}}d = {{bb[1]}}$ and ${{v2}}c {{signed: w2}}d = {{bb[2]}}$. Eliminate one unknown.'
    solution: |
      Component by component:
      $$ {{v1}}c {{signed: w1}}d = {{bb[1]}}, \qquad {{v2}}c {{signed: w2}}d = {{bb[2]}}. $$
      Eliminating $d$ (multiply the first equation by $w_2 = {{w2}}$, the second by $w_1 = {{w1}}$, and subtract) gives
      $(v_1 w_2 - w_1 v_2)\,c = b_1 w_2 - w_1 b_2$, that is ${{det2}}\,c = {{bb[1]*w2 - w1*bb[2]}}$, so $c = {{c}}$.
      In the same way $(v_1 w_2 - w_1 v_2)\,d = v_1 b_2 - b_1 v_2$, so ${{det2}}\,d = {{v1*bb[2] - bb[1]*v2}}$ and $d = {{d}}$.

      Check: ${{c}}{{v}} {{signed: d}}{{w}} = {{bb}}$.
    verify: "list(Matrix([[v1, w1], [v2, w2]]).solve(Matrix([c*v1 + d*w1, c*v2 + d*w2])))"
    covers: [mit-18-06/lecture-1, game-developer/vector, game-developer/linear-algebra]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 4

  - id: la-vec-004
    difficulty: 3
    type: numeric
    prompt: |
      Let $\mathbf{v} = {{v}}$ and $\mathbf{w} = {{w}}$. For which number $k$ is
      $\mathbf{b} = ({{b1}}, {{b2}}, k)$ a linear combination of $\mathbf{v}$ and $\mathbf{w}$?
    params:
      v1: { int: [-3, 3] }
      v2: { int: [-3, 3] }
      v3: { int: [-3, 3] }
      w1: { int: [-3, 3] }
      w2: { int: [-3, 3] }
      w3: { int: [-3, 3] }
      c: { int: [-3, 3] }
      d: { int: [-3, 3] }
    let:
      v: "[v1, v2, v3]"
      w: "[w1, w2, w3]"
      b1: "c*v1 + d*w1"
      b2: "c*v2 + d*w2"
      det2: "v1*w2 - w1*v2"
      kk: "c*v3 + d*w3"
    require: ["det2 != 0"]
    answer: kk
    hints:
      - 'The first two components must already match: solve $c\,v_1 + d\,w_1 = {{b1}}$, $c\,v_2 + d\,w_2 = {{b2}}$ for $c$ and $d$.'
      - 'The two vectors are not parallel in their first two components, so that $2 \times 2$ system has exactly one solution. The third component then forces $k$.'
    solution: |
      If $\mathbf{b} = c\mathbf{v} + d\mathbf{w}$, the first two components give
      $$ {{v1}}c {{signed: w1}}d = {{b1}}, \qquad {{v2}}c {{signed: w2}}d = {{b2}}. $$
      The determinant $v_1 w_2 - w_1 v_2 = {{det2}}$ is non-zero, so there is exactly one solution: $c = {{c}}$, $d = {{d}}$.
      The third component must then be
      $$ k = c\,v_3 + d\,w_3 = ({{c}})({{v3}}) + ({{d}})({{w3}}) = {{kk}}. $$
      For any other $k$, $\mathbf{b}$ lies off the plane of $\mathbf{v}$ and $\mathbf{w}$.
    verify: "solve(Matrix([[v1, w1, c*v1 + d*w1], [v2, w2, c*v2 + d*w2], [v3, w3, Symbol('k')]]).det(), Symbol('k'))[0]"
    covers: [mit-18-06/lecture-1, game-developer/vector, game-developer/linear-algebra]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 5

  - id: la-vec-005
    difficulty: 2
    type: vector
    prompt: |
      Let $A = {{A}}$ and $\mathbf{x} = {{x}}$. Compute $A\mathbf{x}$ using the **column picture**: as a combination
      of the columns of $A$ with weights $x_1, x_2, x_3$.

      Enter $A\mathbf{x}$ as a list such as `1, 2`.
    params:
      a11: { int: [-3, 3] }
      a12: { int: [-3, 3] }
      a13: { int: [-3, 3] }
      a21: { int: [-3, 3] }
      a22: { int: [-3, 3] }
      a23: { int: [-3, 3] }
      x1: { int: [-3, 3], not: [0] }
      x2: { int: [-3, 3], not: [0] }
      x3: { int: [-3, 3], not: [0] }
    let:
      A: "[[a11, a12, a13], [a21, a22, a23]]"
      x: "[x1, x2, x3]"
      Ax: "A*x"
    answer: Ax
    hints:
      - '$A\mathbf{x} = x_1(\text{column 1}) + x_2(\text{column 2}) + x_3(\text{column 3})$.'
      - 'Here that is ${{x1}}{{A[:,1]}} {{signed: x2}}{{A[:,2]}} {{signed: x3}}{{A[:,3]}}$.'
    solution: |
      $$ A\mathbf{x} = {{x1}}{{A[:,1]}} {{signed: x2}}{{A[:,2]}} {{signed: x3}}{{A[:,3]}}
         = {{x1*A[:,1]}} + {{x2*A[:,2]}} + {{x3*A[:,3]}} = {{Ax}}. $$
      The row picture gives the same numbers: each entry is a row of $A$ dotted with $\mathbf{x}$.
    verify: "list(x1*Matrix([a11, a21]) + x2*Matrix([a12, a22]) + x3*Matrix([a13, a23]))"
    covers: [mit-18-06/lecture-1, game-developer/vector, game-developer/linear-algebra]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 3

  - id: la-vec-006
    difficulty: 2
    type: mc
    prompt: |
      Consider the system $2x - y = 0$, $-x + 2y = 3$. Which statement describes its **column picture**?
    options:
      - "Find the combination of the vectors $(2, -1)$ and $(-1, 2)$ that equals $(0, 3)$"
      - "Find where the two lines $2x - y = 0$ and $-x + 2y = 3$ cross"
      - "Find the dot products of the rows with $(0, 3)$"
      - "Find a vector perpendicular to both rows"
    answer: 0
    hints:
      - 'The row picture looks at one equation (a row) at a time; the column picture looks at the coefficients of one unknown (a column) at a time.'
      - 'The coefficients of $x$ form the vector $(2, -1)$.'
    solution: |
      Writing the system as $x\begin{bmatrix}2\\-1\end{bmatrix} + y\begin{bmatrix}-1\\2\end{bmatrix} = \begin{bmatrix}0\\3\end{bmatrix}$
      is the column picture: find the combination of the columns that produces the right-hand side (here $x = 1$, $y = 2$).
      Crossing lines is the **row** picture.
    verify: "0 if Matrix([[2, -1], [-1, 2]]).solve(Matrix([0, 3])) == Matrix([1, 2]) else 1"
    covers: [mit-18-06/lecture-1, game-developer/vector, game-developer/linear-algebra]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 2

  - id: la-vec-007
    difficulty: 3
    type: multipart
    prompt: |
      Let $\mathbf{u} = {{u}}$, $\mathbf{v} = {{v}}$, $\mathbf{w} = {{[0, 0, 1]}}$ and $\mathbf{b} = {{b}}$.
      Find the numbers $c_1, c_2, c_3$ with $c_1\mathbf{u} + c_2\mathbf{v} + c_3\mathbf{w} = \mathbf{b}$, one at a time.
    params:
      p: { int: [-3, 3], not: [0] }
      q: { int: [-3, 3] }
      r: { int: [-3, 3], not: [0] }
      c1: { int: [-4, 4] }
      c2: { int: [-4, 4] }
      c3: { int: [-4, 4] }
    let:
      u: "[1, p, q]"
      v: "[0, 1, r]"
      b: "c1*u + c2*v + c3*[0, 0, 1]"
    parts:
      - prompt: "(a) Only $\\mathbf{u}$ has a non-zero first component. What is $c_1$?"
        type: numeric
        answer: "b[1]"
        verify: "Matrix([[1, 0, 0], [p, 1, 0], [q, r, 1]]).solve(Matrix([c1, c1*p + c2, c1*q + c2*r + c3]))[0]"
      - prompt: "(b) Using your $c_1$, the second component gives $c_2$. What is $c_2$?"
        type: numeric
        answer: "b[2] - p*part1"
        verify: "(c1*p + c2) - p*part1"
      - prompt: "(c) Using $c_1$ and $c_2$, what is $c_3$?"
        type: numeric
        answer: "b[3] - q*part1 - r*part2"
        verify: "(c1*q + c2*r + c3) - q*part1 - r*part2"
    hints:
      - 'Write out the three component equations. The matrix with columns $\mathbf{u}, \mathbf{v}, \mathbf{w}$ is lower triangular.'
      - 'Component 1: $c_1 = {{b[1]}}$. Component 2: ${{p}}c_1 + c_2 = {{b[2]}}$. Component 3: ${{q}}c_1 {{signed: r}}c_2 + c_3 = {{b[3]}}$.'
    solution: |
      The three component equations are
      $$ c_1 = {{b[1]}}, \qquad {{p}}c_1 + c_2 = {{b[2]}}, \qquad {{q}}c_1 {{signed: r}}c_2 + c_3 = {{b[3]}}. $$
      (a) $c_1 = {{c1}}$.
      (b) $c_2 = {{b[2]}} - ({{p}})({{c1}}) = {{c2}}$.
      (c) $c_3 = {{b[3]}} - ({{q}})({{c1}}) - ({{r}})({{c2}}) = {{c3}}$.

      Solving from the top down like this is **forward substitution**; it works because the matrix $[\mathbf{u}\ \mathbf{v}\ \mathbf{w}]$ is triangular.
    covers: [mit-18-06/lecture-1, game-developer/vector, game-developer/linear-algebra]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 5

  - id: la-vec-008
    difficulty: 3
    type: vector
    prompt: |
      Let $\mathbf{u} = {{u}}$ and $\mathbf{v} = {{v}}$. All combinations $c\mathbf{u} + d\mathbf{v}$ fill a plane through the origin.
      Give a non-zero vector $\mathbf{n}$ perpendicular to that plane, so that $\mathbf{b}$ is a combination of $\mathbf{u}$ and $\mathbf{v}$
      exactly when $\mathbf{n} \cdot \mathbf{b} = 0$.

      Enter it as a list such as `1, 2, 3` (any non-zero multiple is accepted).
    params:
      u1: { int: [-3, 3] }
      u2: { int: [-3, 3] }
      u3: { int: [-3, 3] }
      v1: { int: [-3, 3] }
      v2: { int: [-3, 3] }
      v3: { int: [-3, 3] }
    let:
      u: "[u1, u2, u3]"
      v: "[v1, v2, v3]"
      n: "cross(u, v)"
    require: ["norm(n) > 0"]
    answer: n
    upToScale: true
    hints:
      - '$\mathbf{n}$ must satisfy $\mathbf{n} \cdot \mathbf{u} = 0$ and $\mathbf{n} \cdot \mathbf{v} = 0$: two equations in three unknowns.'
      - 'The cross product $\mathbf{u} \times \mathbf{v}$ is perpendicular to both.'
    solution: |
      Any vector perpendicular to both $\mathbf{u}$ and $\mathbf{v}$ is perpendicular to every combination of them. The cross product gives one:
      $$ \mathbf{n} = \mathbf{u} \times \mathbf{v} = \begin{bmatrix} u_2 v_3 - u_3 v_2 \\ u_3 v_1 - u_1 v_3 \\ u_1 v_2 - u_2 v_1 \end{bmatrix} = {{n}}. $$
      Check: $\mathbf{n} \cdot \mathbf{u} = {{dot(n, u)}}$ and $\mathbf{n} \cdot \mathbf{v} = {{dot(n, v)}}$.
      (Solving the two equations $\mathbf{n} \cdot \mathbf{u} = \mathbf{n} \cdot \mathbf{v} = 0$ by elimination gives the same line of answers.)
    verify: "list(Matrix([[u1, u2, u3], [v1, v2, v3]]).nullspace()[0])"
    covers: [mit-18-06/lecture-1, game-developer/vector, game-developer/linear-algebra]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 4

  - id: la-vec-009
    difficulty: 4
    type: proof
    prompt: |
      Suppose $\mathbf{w}$ is a linear combination of $\mathbf{u}$ and $\mathbf{v}$. Show that every linear combination of
      $\mathbf{u}, \mathbf{v}, \mathbf{w}$ is already a linear combination of $\mathbf{u}$ and $\mathbf{v}$ alone,
      so adding $\mathbf{w}$ does not enlarge the set of combinations.
    hints:
      - 'Write $\mathbf{w} = p\mathbf{u} + q\mathbf{v}$ for some numbers $p, q$.'
      - 'Substitute into $a\mathbf{u} + b\mathbf{v} + c\mathbf{w}$ and collect terms.'
    solution: |
      Let $\mathbf{w} = p\mathbf{u} + q\mathbf{v}$. Any combination of the three vectors is
      $$ a\mathbf{u} + b\mathbf{v} + c\mathbf{w} = a\mathbf{u} + b\mathbf{v} + c(p\mathbf{u} + q\mathbf{v}) = (a + cp)\,\mathbf{u} + (b + cq)\,\mathbf{v}, $$
      which is a combination of $\mathbf{u}$ and $\mathbf{v}$ with coefficients $a + cp$ and $b + cq$.
      Conversely every combination $a\mathbf{u} + b\mathbf{v}$ is a combination of all three (take $c = 0$).
      So the two sets of combinations are equal.
    covers: [mit-18-06/lecture-1, game-developer/linear-algebra]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 5

  - id: la-vec-010
    difficulty: 4
    type: numeric
    prompt: |
      For which **real** number $t$ do the vectors
      $$ \mathbf{u} = \begin{bmatrix} 1 \\ t \\ 0 \end{bmatrix}, \quad \mathbf{v} = \begin{bmatrix} 0 \\ 1 \\ t \end{bmatrix}, \quad \mathbf{w} = \begin{bmatrix} t \\ 0 \\ 1 \end{bmatrix} $$
      **fail** to have every vector of $\mathbb{R}^3$ as a linear combination?
    answer: -1
    hints:
      - 'The combinations fill $\mathbb{R}^3$ unless the three vectors lie in one plane, that is unless the matrix with these columns is singular.'
      - 'Compute the determinant of $\begin{bmatrix} 1 & 0 & t \\ t & 1 & 0 \\ 0 & t & 1 \end{bmatrix}$ and set it to zero.'
    solution: |
      The combinations of $\mathbf{u}, \mathbf{v}, \mathbf{w}$ fill $\mathbb{R}^3$ exactly when the matrix $M = [\mathbf{u}\ \mathbf{v}\ \mathbf{w}]$ is invertible.
      Expanding along the first row,
      $$ \det M = 1\cdot(1\cdot 1 - 0\cdot t) - 0 + t\,(t\cdot t - 1\cdot 0) = 1 + t^3. $$
      This is zero only for the real number $t = -1$. Then $\mathbf{u} + \mathbf{v} + \mathbf{w} = (0, 0, 0)$, so the three vectors lie in a plane.
    verify: "[r for r in solve(Matrix([[1, 0, t], [t, 1, 0], [0, t, 1]]).det(), t) if r.is_real][0]"
    covers: [mit-18-06/lecture-1, game-developer/linear-algebra]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 5

  - id: la-vec-011
    difficulty: 3
    type: mc
    prompt: |
      Let $\mathbf{u} = {{[1, 0, p]}}$ and $\mathbf{v} = {{[0, 1, q]}}$. Which of these vectors is a linear combination of $\mathbf{u}$ and $\mathbf{v}$?
    params:
      p: { int: [-3, 3], not: [0] }
      q: { int: [-3, 3] }
      a: { int: [-3, 3] }
      b: { int: [-3, 3] }
    require: ["p != q", "a != b"]
    options:
      - "$({{a}}, {{b}}, {{a*p + b*q}})$"
      - "$({{a}}, {{b}}, {{a*p + b*q + 1}})$"
      - "$({{a}}, {{b}}, {{a*q + b*p}})$"
      - "$({{a + 1}}, {{b}}, {{a*p + b*q}})$"
    answer: 0
    hints:
      - 'The first two components of $c\mathbf{u} + d\mathbf{v}$ are just $c$ and $d$.'
      - 'So a combination with first two components $(c, d)$ must have third component ${{p}}c {{signed: q}}d$.'
    solution: |
      $c\mathbf{u} + d\mathbf{v} = (c,\ d,\ {{p}}c {{signed: q}}d)$. A vector $(b_1, b_2, b_3)$ is a combination exactly when
      $b_3 = {{p}}b_1 {{signed: q}}b_2$.

      - $({{a}}, {{b}}, {{a*p + b*q}})$: ${{p}}({{a}}) {{signed: q}}({{b}}) = {{a*p + b*q}}$. Yes.
      - $({{a}}, {{b}}, {{a*p + b*q + 1}})$: the third component is off by one. No.
      - $({{a}}, {{b}}, {{a*q + b*p}})$: needs ${{a*q + b*p}} = {{a*p + b*q}}$, false. No.
      - $({{a + 1}}, {{b}}, {{a*p + b*q}})$: needs ${{p*(a + 1) + q*b}} = {{a*p + b*q}}$, false. No.
    verify: "[i for i, w in enumerate([(a, b, a*p + b*q), (a, b, a*p + b*q + 1), (a, b, a*q + b*p), (a + 1, b, a*p + b*q)]) if Matrix([[1, 0, w[0]], [0, 1, w[1]], [p, q, w[2]]]).det() == 0][0]"
    covers: [mit-18-06/lecture-1, game-developer/vector, game-developer/linear-algebra]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 3
