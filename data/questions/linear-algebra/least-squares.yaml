subject: linear-algebra
topic: least-squares
questions:
  - id: la-lsq-001
    difficulty: 1
    type: mc
    prompt: |
      $A\mathbf{x} = \mathbf{b}$ has no solution. Which equation does the least-squares solution $\hat{\mathbf{x}}$ satisfy?
    options:
      - "$A^TA\\hat{\\mathbf{x}} = A^T\\mathbf{b}$"
      - "$AA^T\\hat{\\mathbf{x}} = \\mathbf{b}$"
      - "$A\\hat{\\mathbf{x}} = A^T\\mathbf{b}$"
      - "$A^T\\hat{\\mathbf{x}} = \\mathbf{b}$"
    answer: 0
    hints:
      - 'The error $\mathbf{e} = \mathbf{b} - A\hat{\mathbf{x}}$ must be perpendicular to every column of $A$.'
    solution: |
      The best $A\hat{\mathbf{x}}$ is the projection of $\mathbf{b}$ onto $C(A)$, so the error $\mathbf{b} - A\hat{\mathbf{x}}$ is orthogonal to every column of $A$:
      $A^T(\mathbf{b} - A\hat{\mathbf{x}}) = \mathbf{0}$. Rearranged, these are the **normal equations** $A^TA\hat{\mathbf{x}} = A^T\mathbf{b}$.
    verify: "0"
    covers: [mit-18-06/lecture-16]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 1
  - id: la-lsq-002
    difficulty: 1
    type: numeric
    prompt: |
      Four measurements of the same quantity gave ${{b1}}$, ${{b2}}$, ${{b3}}$ and ${{b4}}$. Fit them by a single constant $C$ in the least-squares sense
      (solve $C\,(1, 1, 1, 1) \approx (b_1, b_2, b_3, b_4)$). What is $\hat{C}$? A decimal is fine.
    params:
      b1: { int: [-5, 9] }
      b2: { int: [-5, 9] }
      b3: { int: [-5, 9] }
      b4: { int: [-5, 9] }
    let:
      C: "(b1 + b2 + b3 + b4) / 4"
    answer: C
    hints:
      - 'Here $A$ is the column $(1, 1, 1, 1)$. What are $A^TA$ and $A^T\mathbf{b}$?'
    solution: |
      With $A = (1, 1, 1, 1)^T$, the normal equation $A^TA\,\hat{C} = A^T\mathbf{b}$ reads
      $$4\hat{C} = {{b1}} {{signed: b2}} {{signed: b3}} {{signed: b4}} = {{b1 + b2 + b3 + b4}},$$
      so $\hat{C} = {{C}}$: the least-squares constant is the **mean** of the data.
    verify: "(lambda A, b: ((A.T * A).inv() * A.T * b)[0])(ones(4, 1), Matrix([b1, b2, b3, b4]))"
    covers: [mit-18-06/lecture-16]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 2
  - id: la-lsq-003
    difficulty: 2
    type: multipart
    prompt: |
      To solve $A\mathbf{x} \approx \mathbf{b}$ by least squares with $A = {{A}}$ and $\mathbf{b} = {{b}}$, first form the normal equations.
    params:
      a11: { int: [-3, 3] }
      a12: { int: [-3, 3] }
      a21: { int: [-3, 3] }
      a22: { int: [-3, 3] }
      a31: { int: [-3, 3] }
      a32: { int: [-3, 3] }
      c1: { int: [-4, 4] }
      c2: { int: [-4, 4] }
      c3: { int: [-4, 4] }
    let:
      A: "[[a11, a12], [a21, a22], [a31, a32]]"
      b: "[c1, c2, c3]"
      M: "transpose(A) * A"
      v: "transpose(A) * b"
    require: ["det(M) != 0"]
    parts:
      - prompt: "(a) What is $A^TA$? Enter it as `[[1, 2], [3, 4]]`."
        type: matrix
        answer: M
        verify: "Matrix([[a11, a12], [a21, a22], [a31, a32]]).T * Matrix([[a11, a12], [a21, a22], [a31, a32]])"
      - prompt: "(b) What is $A^T\\mathbf{b}$? Enter it as a list such as `1, 2`."
        type: vector
        answer: v
        verify: "Matrix([[a11, a12], [a21, a22], [a31, a32]]).T * Matrix([c1, c2, c3])"
    hints:
      - 'Entry $(i, j)$ of $A^TA$ is the dot product of column $i$ with column $j$ of $A$.'
      - 'Entry $i$ of $A^T\mathbf{b}$ is the dot product of column $i$ of $A$ with $\mathbf{b}$.'
    solution: |
      Call the columns $\mathbf{a}_1 = {{[a11, a21, a31]}}$ and $\mathbf{a}_2 = {{[a12, a22, a32]}}$.

      (a) $A^TA = \begin{bmatrix} \mathbf{a}_1\cdot\mathbf{a}_1 & \mathbf{a}_1\cdot\mathbf{a}_2 \\ \mathbf{a}_2\cdot\mathbf{a}_1 & \mathbf{a}_2\cdot\mathbf{a}_2 \end{bmatrix} = {{M}}$. It is symmetric, as $A^TA$ always is.

      (b) $A^T\mathbf{b} = \begin{bmatrix} \mathbf{a}_1\cdot\mathbf{b} \\ \mathbf{a}_2\cdot\mathbf{b} \end{bmatrix} = {{v}}$.

      The normal equations are then ${{M}}\hat{\mathbf{x}} = {{v}}$.
    covers: [mit-18-06/lecture-16]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 4
  - id: la-lsq-004
    difficulty: 3
    type: vector
    prompt: |
      Find the least-squares line $b = C + Dt$ through the three points $(t, b)$: $(-1, {{y1}})$, $(0, {{y2}})$, $(1, {{y3}})$.
      Enter $\hat{C}, \hat{D}$ as a list such as `2, -1`.
    params:
      C: { int: [-4, 4] }
      D: { int: [-3, 3] }
      r: { int: [-2, 2], not: [0] }
    let:
      y1: "C - D + r"
      y2: "C - 2*r"
      y3: "C + D + r"
    answer: "[C, D]"
    hints:
      - 'Write the three equations $C + Dt_i = b_i$ as $A\mathbf{x} = \mathbf{b}$ with $A = \begin{bmatrix} 1 & -1 \\ 1 & 0 \\ 1 & 1 \end{bmatrix}$.'
      - 'Here the columns of $A$ are orthogonal, so $A^TA$ is diagonal.'
    solution: |
      The equations $C + Dt_i = b_i$ are $A\mathbf{x} = \mathbf{b}$ with
      $$A = \begin{bmatrix} 1 & -1 \\ 1 & 0 \\ 1 & 1 \end{bmatrix}, \qquad \mathbf{b} = {{[y1, y2, y3]}}.$$
      Then $A^TA = \begin{bmatrix} 3 & 0 \\ 0 & 2 \end{bmatrix}$ and $A^T\mathbf{b} = {{[y1 + y2 + y3, y3 - y1]}}$, so
      $$\hat{C} = \frac{ {{y1 + y2 + y3}} }{3} = {{C}}, \qquad \hat{D} = \frac{ {{y3 - y1}} }{2} = {{D}}.$$
      The best line is $b = {{C}} {{signed: D}}t$. Its errors ${{[r, -2*r, r]}}$ are orthogonal to both columns of $A$.
    verify: "(lambda A, b: (A.T * A).inv() * A.T * b)(Matrix([[1, -1], [1, 0], [1, 1]]), Matrix([C - D + r, C - 2*r, C + D + r]))"
    covers: [mit-18-06/lecture-16]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 5
  - id: la-lsq-005
    difficulty: 3
    type: multipart
    prompt: |
      Fit a straight line $b = C + Dt$ to the four points $(t, b)$: $(0, {{y[1]}})$, $(1, {{y[2]}})$, $(2, {{y[3]}})$, $(3, {{y[4]}})$.
    params:
      C: { int: [-3, 5] }
      D: { int: [-3, 3] }
      r: { int: [-2, 2] }
      s: { int: [-2, 2] }
    let:
      A: "[[1, 0], [1, 1], [1, 2], [1, 3]]"
      y: "A * [C, D] + r*[1, -2, 1, 0] + s*[0, 1, -2, 1]"
    require: ["r != 0 or s != 0"]
    parts:
      - prompt: "(a) Find $\\hat{C}$ and $\\hat{D}$. Enter them as a list such as `2, -1`."
        type: vector
        answer: "[C, D]"
        verify: "(lambda A, b: (A.T * A).inv() * A.T * b)(Matrix([[1, 0], [1, 1], [1, 2], [1, 3]]), Matrix([C, C + D, C + 2*D, C + 3*D]) + r*Matrix([1, -2, 1, 0]) + s*Matrix([0, 1, -2, 1]))"
      - prompt: "(b) Using your line, what is the sum of the squared errors $\\|\\mathbf{b} - A\\hat{\\mathbf{x}}\\|^2$?"
        type: numeric
        answer: "dot(y - A*part1, y - A*part1)"
        verify: "(Matrix([C, C + D, C + 2*D, C + 3*D]) + r*Matrix([1, -2, 1, 0]) + s*Matrix([0, 1, -2, 1]) - Matrix([[1, 0], [1, 1], [1, 2], [1, 3]]) * Matrix(part1)).norm()**2"
    hints:
      - 'With $A = \begin{bmatrix} 1 & 0 \\ 1 & 1 \\ 1 & 2 \\ 1 & 3 \end{bmatrix}$: $A^TA = \begin{bmatrix} 4 & 6 \\ 6 & 14 \end{bmatrix}$.'
      - '$A^T\mathbf{b} = {{transpose(A) * y}}$. Solve the $2 \times 2$ system.'
      - 'For (b), compute the four errors $b_i - (\hat{C} + \hat{D}t_i)$ and add their squares.'
    solution: |
      (a) The normal equations $A^TA\hat{\mathbf{x}} = A^T\mathbf{b}$ are
      $$\begin{bmatrix} 4 & 6 \\ 6 & 14 \end{bmatrix} \begin{bmatrix} \hat{C} \\ \hat{D} \end{bmatrix} = {{transpose(A) * y}}.$$
      Since $\det(A^TA) = 56 - 36 = 20$,
      $$\begin{bmatrix} \hat{C} \\ \hat{D} \end{bmatrix} = \frac{1}{20}\begin{bmatrix} 14 & -6 \\ -6 & 4 \end{bmatrix} {{transpose(A) * y}} = {{[C, D]}}.$$

      (b) The fitted values are $A\hat{\mathbf{x}} = {{A * [C, D]}}$, so the errors are $\mathbf{e} = {{y - A * [C, D]}}$
      (orthogonal to both columns of $A$, as they must be), and $\|\mathbf{e}\|^2 = {{dot(y - A * [C, D], y - A * [C, D])}}$.
    covers: [mit-18-06/lecture-16]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 8
  - id: la-lsq-006
    difficulty: 2
    type: numeric
    prompt: |
      Fit a line through the origin, $b = Dt$, to the points $(1, {{y[1]}})$, $(2, {{y[2]}})$, $(3, {{y[3]}})$. What is the least-squares slope $\hat{D}$?
    params:
      D: { int: [-4, 4], not: [0] }
      r: { int: [-2, 2] }
      s: { int: [-2, 2] }
    let:
      y: "D*[1, 2, 3] + r*[1, 1, -1] + s*[2, -1, 0]"
    require: ["r != 0 or s != 0"]
    answer: D
    hints:
      - 'With one unknown, $A$ is the single column $\mathbf{t} = (1, 2, 3)$.'
      - '$\hat{D} = \dfrac{\mathbf{t}^T\mathbf{b}}{\mathbf{t}^T\mathbf{t}}$.'
    solution: |
      Here $A = \mathbf{t} = (1, 2, 3)^T$ and the normal equation is $(\mathbf{t}^T\mathbf{t})\hat{D} = \mathbf{t}^T\mathbf{b}$:
      $$\mathbf{t}^T\mathbf{t} = 1 + 4 + 9 = 14, \qquad \mathbf{t}^T\mathbf{b} = {{y[1]}} {{signed: 2*y[2]}} {{signed: 3*y[3]}} = {{dot([1, 2, 3], y)}}.$$
      So $\hat{D} = \dfrac{ {{dot([1, 2, 3], y)}} }{14} = {{D}}$.
    verify: "(lambda A, b: ((A.T * A).inv() * A.T * b)[0])(Matrix([1, 2, 3]), D*Matrix([1, 2, 3]) + r*Matrix([1, 1, -1]) + s*Matrix([2, -1, 0]))"
    covers: [mit-18-06/lecture-16]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 3
  - id: la-lsq-007
    difficulty: 4
    type: vector
    prompt: |
      Fit a parabola $b = C + Dt + Et^2$ by least squares to the four points $(t, b)$: $(-1, {{y[1]}})$, $(0, {{y[2]}})$, $(1, {{y[3]}})$, $(2, {{y[4]}})$.
      Enter $\hat{C}, \hat{D}, \hat{E}$ as a list such as `1, 0, -2`.
    params:
      C: { int: [-3, 3] }
      D: { int: [-3, 3] }
      E: { int: [-2, 2], not: [0] }
      r: { int: [-2, 2], not: [0] }
    let:
      A: "[[1, -1, 1], [1, 0, 0], [1, 1, 1], [1, 2, 4]]"
      y: "A * [C, D, E] + r*[1, -3, 3, -1]"
    answer: "[C, D, E]"
    hints:
      - 'The rows of $A$ are $(1, t_i, t_i^2)$; form $A^TA$ and $A^T\mathbf{b}$.'
      - '$A^TA = {{transpose(A) * A}}$ and $A^T\mathbf{b} = {{transpose(A) * y}}$.'
      - 'Shortcut: $\mathbf{w} = (1, -3, 3, -1)$ is orthogonal to all three columns of $A$. Is $\mathbf{b}$ a parabola plus a multiple of $\mathbf{w}$?'
    solution: |
      The four equations $C + Dt_i + Et_i^2 = b_i$ are $A\mathbf{x} = \mathbf{b}$ with $A = {{A}}$. The normal equations are
      $${{transpose(A) * A}} \begin{bmatrix} \hat{C} \\ \hat{D} \\ \hat{E} \end{bmatrix} = {{transpose(A) * y}},$$
      whose solution is $(\hat{C}, \hat{D}, \hat{E}) = {{row: [C, D, E]}}$ (substitute to check).

      A quicker route: the left null space $N(A^T)$ is spanned by $\mathbf{w} = (1, -3, 3, -1)$ (the third difference kills $1$, $t$ and $t^2$).
      Here $\mathbf{b} = A{{row: [C, D, E]}}^T {{signed: r}}\,\mathbf{w}$, so the projection of $\mathbf{b}$ onto $C(A)$ is $A{{row: [C, D, E]}}^T$
      and the error is ${{r}}\,\mathbf{w}$. The best parabola is $b = {{C}} {{signed: D}}t {{signed: E}}t^2$.
    verify: "(lambda A, b: (A.T * A).inv() * A.T * b)(Matrix([[1, -1, 1], [1, 0, 0], [1, 1, 1], [1, 2, 4]]), Matrix([C - D + E, C, C + D + E, C + 2*D + 4*E]) + r*Matrix([1, -3, 3, -1]))"
    covers: [mit-18-06/lecture-16]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 10
  - id: la-lsq-008
    difficulty: 3
    type: mc
    prompt: |
      In a least-squares problem $A\mathbf{x} \approx \mathbf{b}$, the columns of $A$ are **dependent**. Which statement is true?
    options:
      - "$A^TA$ is singular, so $\\hat{\\mathbf{x}}$ is not unique, but the projection $\\mathbf{p} = A\\hat{\\mathbf{x}}$ is unique"
      - "$A^TA$ is singular, so the normal equations have no solution"
      - "$A^TA$ is still invertible, so $\\hat{\\mathbf{x}}$ is unique"
      - "Both $\\hat{\\mathbf{x}}$ and $\\mathbf{p} = A\\hat{\\mathbf{x}}$ are non-unique"
    answer: 0
    hints:
      - '$N(A^TA) = N(A)$.'
      - 'The projection of $\mathbf{b}$ onto $C(A)$ depends only on the subspace $C(A)$.'
    solution: |
      Since $N(A^TA) = N(A) \ne \{\mathbf{0}\}$, $A^TA$ is singular. The normal equations still have solutions, because
      $A^T\mathbf{b}$ lies in $C(A^T) = C(A^TA)$, but any $\hat{\mathbf{x}} + \mathbf{n}$ with $\mathbf{n} \in N(A)$ also solves them.

      All of those give the same $A\hat{\mathbf{x}}$: it is the projection of $\mathbf{b}$ onto $C(A)$, which is unique.
    verify: "0"
    covers: [mit-18-06/lecture-16]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 3
  - id: la-lsq-009
    difficulty: 4
    type: proof
    prompt: |
      Suppose $A^TA\hat{\mathbf{x}} = A^T\mathbf{b}$. Prove that $\|A\mathbf{x} - \mathbf{b}\|^2 \ge \|A\hat{\mathbf{x}} - \mathbf{b}\|^2$ for every $\mathbf{x}$, so $\hat{\mathbf{x}}$ minimises the squared error.
    hints:
      - 'Write $A\mathbf{x} - \mathbf{b} = A(\mathbf{x} - \hat{\mathbf{x}}) + (A\hat{\mathbf{x}} - \mathbf{b})$.'
      - 'Expand the squared length; what is $(A\mathbf{y})^T(A\hat{\mathbf{x}} - \mathbf{b})$?'
    solution: |
      Let $\mathbf{y} = \mathbf{x} - \hat{\mathbf{x}}$ and $\mathbf{e} = \mathbf{b} - A\hat{\mathbf{x}}$. Then $A\mathbf{x} - \mathbf{b} = A\mathbf{y} - \mathbf{e}$ and
      $$\|A\mathbf{x} - \mathbf{b}\|^2 = \|A\mathbf{y}\|^2 - 2(A\mathbf{y})^T\mathbf{e} + \|\mathbf{e}\|^2.$$
      The cross term is $(A\mathbf{y})^T\mathbf{e} = \mathbf{y}^TA^T(\mathbf{b} - A\hat{\mathbf{x}}) = \mathbf{y}^T(A^T\mathbf{b} - A^TA\hat{\mathbf{x}}) = 0$ by the normal equations.
      Hence
      $$\|A\mathbf{x} - \mathbf{b}\|^2 = \|A(\mathbf{x} - \hat{\mathbf{x}})\|^2 + \|A\hat{\mathbf{x}} - \mathbf{b}\|^2 \ge \|A\hat{\mathbf{x}} - \mathbf{b}\|^2,$$
      with equality exactly when $A\mathbf{x} = A\hat{\mathbf{x}}$. This is Pythagoras: $\mathbf{e}$ is perpendicular to the column space.
    covers: [mit-18-06/lecture-16]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 8
  - id: la-lsq-010
    difficulty: 4
    type: vector
    prompt: |
      Fit a plane $z = C + Dx + Ey$ by least squares to the four measurements $z(0, 0) = {{y[1]}}$, $z(1, 0) = {{y[2]}}$, $z(0, 1) = {{y[3]}}$, $z(1, 1) = {{y[4]}}$.
      Enter $\hat{C}, \hat{D}, \hat{E}$ as a list such as `1, 2, -1`.
    params:
      C: { int: [-3, 3] }
      D: { int: [-3, 3] }
      E: { int: [-3, 3] }
      r: { int: [-2, 2], not: [0] }
    let:
      A: "[[1, 0, 0], [1, 1, 0], [1, 0, 1], [1, 1, 1]]"
      y: "A * [C, D, E] + r*[1, -1, -1, 1]"
    answer: "[C, D, E]"
    hints:
      - 'The rows of $A$ are $(1, x_i, y_i)$. Form $A^TA$ and $A^T\mathbf{z}$.'
      - '$A^TA = {{transpose(A) * A}}$ and $A^T\mathbf{z} = {{transpose(A) * y}}$.'
      - 'The vector $(1, -1, -1, 1)$ is orthogonal to every column of $A$.'
    solution: |
      The equations $C + Dx_i + Ey_i = z_i$ are $A\mathbf{x} = \mathbf{z}$ with $A = {{A}}$ and $\mathbf{z} = {{y}}$. The normal equations are
      $${{transpose(A) * A}} \begin{bmatrix} \hat{C} \\ \hat{D} \\ \hat{E} \end{bmatrix} = {{transpose(A) * y}}.$$
      Elimination (or substituting) gives $(\hat{C}, \hat{D}, \hat{E}) = {{row: [C, D, E]}}$.

      Why: $\mathbf{z} = A{{row: [C, D, E]}}^T {{signed: r}}\,(1, -1, -1, 1)^T$, and $(1, -1, -1, 1)$ spans $N(A^T)$, so it is exactly the error.
      The best plane is $z = {{C}} {{signed: D}}x {{signed: E}}y$.
    verify: "(lambda A, b: (A.T * A).inv() * A.T * b)(Matrix([[1, 0, 0], [1, 1, 0], [1, 0, 1], [1, 1, 1]]), Matrix([C, C + D, C + E, C + D + E]) + r*Matrix([1, -1, -1, 1]))"
    covers: [mit-18-06/lecture-16]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 8
  - id: la-lsq-011
    difficulty: 2
    type: mc
    prompt: |
      $\hat{\mathbf{x}}$ is the least-squares solution of $A\mathbf{x} \approx \mathbf{b}$. What is the vector $A\hat{\mathbf{x}}$?
    options:
      - "The projection of $\\mathbf{b}$ onto the column space of $A$"
      - "The projection of $\\mathbf{b}$ onto the null space of $A^T$"
      - "The vector $\\mathbf{b}$ itself"
      - "The projection of $\\mathbf{b}$ onto the row space of $A$"
    answer: 0
    hints:
      - '$A\hat{\mathbf{x}}$ is a combination of the columns of $A$, and it is as close to $\mathbf{b}$ as such a combination can be.'
    solution: |
      Every $A\mathbf{x}$ lies in $C(A)$, and least squares picks the one closest to $\mathbf{b}$. The closest point of a subspace is the orthogonal
      projection, so $A\hat{\mathbf{x}} = \mathbf{p} = A(A^TA)^{-1}A^T\mathbf{b}$ (when the columns are independent). The error
      $\mathbf{b} - \mathbf{p}$ is the projection onto $N(A^T)$; $A\hat{\mathbf{x}} = \mathbf{b}$ only when $\mathbf{b}$ is already in $C(A)$.
    verify: "0"
    covers: [mit-18-06/lecture-16]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 1
