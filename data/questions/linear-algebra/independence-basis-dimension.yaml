subject: linear-algebra
topic: independence-basis-dimension
questions:
  - id: la-ind-001
    difficulty: 1
    type: mc
    prompt: |
      Any four vectors in $\mathbb{R}^3$ are necessarily:
    options:
      - "Linearly dependent"
      - "Linearly independent"
      - "A basis for $\\mathbb{R}^3$"
      - "Spanning $\\mathbb{R}^3$"
    answer: 0
    hints:
      - 'Put the vectors into the columns of a $3 \times 4$ matrix $A$. How many free variables must $A\mathbf{x} = \mathbf{0}$ have?'
    solution: |
      With the four vectors as columns, $A$ is $3 \times 4$ and has at most 3 pivots, so at least one free variable. Then $A\mathbf{x} = \mathbf{0}$
      has a non-zero solution: a combination with non-zero weights giving $\mathbf{0}$. The vectors are **dependent**.
      They need not span $\mathbb{R}^3$ (four multiples of one vector do not), and a basis of $\mathbb{R}^3$ has exactly 3 vectors.
    verify: "0 if len(Matrix([[1, 2, 0, 1], [0, 1, 1, 3], [2, 0, 1, 1]]).nullspace()) > 0 else 1"
    covers: [mit-18-06/lecture-9]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 1

  - id: la-ind-002
    difficulty: 2
    type: mc
    prompt: |
      Are the vectors $\mathbf{v}_1 = {{p}}$, $\mathbf{v}_2 = {{q}}$, $\mathbf{v}_3 = {{w}}$ linearly independent?
    params:
      p1: { int: [-3, 3] }
      p2: { int: [-3, 3] }
      p3: { int: [-3, 3] }
      q1: { int: [-3, 3] }
      q2: { int: [-3, 3] }
      q3: { int: [-3, 3] }
      a: { int: [-2, 2], not: [0] }
      b: { int: [-2, 2], not: [0] }
    let:
      p: "[p1, p2, p3]"
      q: "[q1, q2, q3]"
      w: "a*p + b*q"
    require: ["norm(cross(p, q)) > 0"]
    options:
      - "No, they are dependent"
      - "Yes, they are independent"
    answer: 0
    hints:
      - 'Put them in the columns of a matrix and eliminate: three pivots means independent.'
      - 'Or look for numbers $a, b$ with $\mathbf{v}_3 = a\mathbf{v}_1 + b\mathbf{v}_2$.'
    solution: |
      $\mathbf{v}_3 = {{a}}\mathbf{v}_1 {{signed: b}}\mathbf{v}_2$: indeed ${{a}}{{p}} {{signed: b}}{{q}} = {{w}}$.
      So ${{a}}\mathbf{v}_1 {{signed: b}}\mathbf{v}_2 - \mathbf{v}_3 = \mathbf{0}$ is a non-trivial combination giving zero, and the vectors are **dependent**.
      (Equivalently the matrix $[\mathbf{v}_1\ \mathbf{v}_2\ \mathbf{v}_3]$ has only two pivots, and its determinant is $0$.)
    verify: "0 if Matrix.hstack(Matrix([p1, p2, p3]), Matrix([q1, q2, q3]), a*Matrix([p1, p2, p3]) + b*Matrix([q1, q2, q3])).det() == 0 else 1"
    covers: [mit-18-06/lecture-9]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 3

  - id: la-ind-003
    difficulty: 2
    type: numeric
    prompt: |
      What is the dimension of the subspace of $\mathbb{R}^3$ spanned by the four columns of
      $$ A = {{A}}? $$
    params:
      r: { int: [1, 3] }
      l21: { int: [-2, 2] }
      l31: { int: [-2, 2] }
      l32: { int: [-2, 2] }
      a: { int: [-3, 3] }
      b: { int: [-3, 3] }
    let:
      E: "[[1, 0, 0], [l21, 1, 0], [l31, l32, 1]]"
      Rf: "[[1, 0, a, 0], [0, 1, b, 0], [0, 0, 0, 1]]"
      R: "diag([1, r >= 2 ? 1 : 0, r >= 3 ? 1 : 0]) * Rf"
      A: "E*R"
    answer: r
    hints:
      - 'The dimension of the column space is the rank: the number of pivots.'
      - 'Eliminate with multipliers $\ell_{21} = {{l21}}$, $\ell_{31} = {{l31}}$.'
    solution: |
      Elimination (multipliers ${{l21}}$, ${{l31}}$, then ${{l32}}$) gives
      $$ {{R}}, $$
      with ${{r}}$ pivot{{r == 1 ? "" : "s"}}. So the rank is ${{r}}$, the pivot columns of $A$ form a basis of $C(A)$, and $\dim C(A) = {{r}}$.
    verify: "(Matrix([[1, 0, 0], [l21, 1, 0], [l31, l32, 1]])*diag(1, 1 if r >= 2 else 0, 1 if r >= 3 else 0)*Matrix([[1, 0, a, 0], [0, 1, b, 0], [0, 0, 0, 1]])).columnspace().__len__()"
    covers: [mit-18-06/lecture-9]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 4

  - id: la-ind-004
    difficulty: 3
    type: vector
    prompt: |
      The vectors $\mathbf{v}_1 = {{p}}$, $\mathbf{v}_2 = {{q}}$, $\mathbf{v}_3 = {{w}}$ are dependent.
      Find numbers $(c_1, c_2, c_3)$, not all zero, with $c_1\mathbf{v}_1 + c_2\mathbf{v}_2 + c_3\mathbf{v}_3 = \mathbf{0}$.

      Enter them as `c1, c2, c3` (any non-zero multiple is accepted).
    params:
      p1: { int: [-3, 3] }
      p2: { int: [-3, 3] }
      p3: { int: [-3, 3] }
      q1: { int: [-3, 3] }
      q2: { int: [-3, 3] }
      q3: { int: [-3, 3] }
      a: { int: [-3, 3], not: [0] }
      b: { int: [-3, 3], not: [0] }
    let:
      p: "[p1, p2, p3]"
      q: "[q1, q2, q3]"
      w: "a*p + b*q"
    require: ["norm(cross(p, q)) > 0"]
    answer: "[a, b, -1]"
    upToScale: true
    hints:
      - 'The coefficients $(c_1, c_2, c_3)$ form a vector in the null space of $A = [\mathbf{v}_1\ \mathbf{v}_2\ \mathbf{v}_3]$.'
      - '$\mathbf{v}_1$ and $\mathbf{v}_2$ are independent, so $c_3 \ne 0$: set $c_3 = -1$ and solve $c_1\mathbf{v}_1 + c_2\mathbf{v}_2 = \mathbf{v}_3$.'
    solution: |
      Setting $c_3 = -1$, we need $c_1\mathbf{v}_1 + c_2\mathbf{v}_2 = \mathbf{v}_3 = {{w}}$. Two of the component equations determine $c_1$ and $c_2$, and the third checks:
      $c_1 = {{a}}$, $c_2 = {{b}}$, since ${{a}}{{p}} {{signed: b}}{{q}} = {{w}}$.

      So $(c_1, c_2, c_3) = {{row: [a, b, -1]}}$, or any non-zero multiple: the null space of $[\mathbf{v}_1\ \mathbf{v}_2\ \mathbf{v}_3]$ is this line.
    verify: "list(Matrix.hstack(Matrix([p1, p2, p3]), Matrix([q1, q2, q3]), a*Matrix([p1, p2, p3]) + b*Matrix([q1, q2, q3])).nullspace()[0])"
    covers: [mit-18-06/lecture-9]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 5

  - id: la-ind-005
    difficulty: 1
    type: numeric
    prompt: |
      What is the dimension of the vector space of all ${{m}} \times {{n}}$ real matrices?
    params:
      m: { int: [2, 5] }
      n: { int: [2, 5] }
    answer: "m*n"
    hints:
      - 'A basis: the matrices with a single entry $1$ and all other entries $0$.'
    solution: |
      The matrices $E_{ij}$ with a $1$ in position $(i, j)$ and zeros elsewhere form a basis: every matrix is $\sum a_{ij}E_{ij}$ in exactly one way.
      There is one for each of the ${{m}} \cdot {{n}}$ positions, so the dimension is ${{m*n}}$.
    verify: "len(zeros(m, n))"
    covers: [mit-18-06/lecture-9]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 1

  - id: la-ind-006
    difficulty: 2
    type: numeric
    prompt: |
      What is the dimension of the subspace of $\mathbb{R}^{ {{n}} }$ consisting of the vectors $\mathbf{x}$ with
      $x_1 = x_2$ and $x_1 + x_2 + \dots + x_{ {{n}} } = 0$?
    params:
      n: { int: [3, 8] }
    answer: "n - 2"
    hints:
      - 'This is the null space of a $2 \times {{n}}$ matrix, one row per equation.'
      - 'Are the two equations independent? Then the dimension is $n - 2$.'
    solution: |
      The subspace is $N(A)$ for
      $$ A = \begin{bmatrix} 1 & -1 & 0 & \cdots & 0 \\ 1 & 1 & 1 & \cdots & 1 \end{bmatrix} \quad (2 \times {{n}}). $$
      The two rows are independent, so $r = 2$ and $\dim N(A) = n - r = {{n}} - 2 = {{n - 2}}$.
    verify: "len(Matrix([[1, -1] + [0]*(n - 2), [1]*n]).nullspace())"
    covers: [mit-18-06/lecture-9]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 2

  - id: la-ind-007
    difficulty: 3
    type: mc
    prompt: |
      Elimination reduces $A$ to $R = \operatorname{rref}(A)$. Which of these is a basis for the column space $C(A)$?
    options:
      - "The pivot columns of $A$"
      - "The pivot columns of $R$"
      - "The non-zero rows of $R$"
      - "The special solutions of $A\\mathbf{x} = \\mathbf{0}$"
    answer: 0
    hints:
      - 'Row operations change the column space, but they do not change which combinations of columns give zero.'
    solution: |
      Row operations keep $N(A)$: $A\mathbf{x} = \mathbf{0} \iff R\mathbf{x} = \mathbf{0}$. So the columns of $A$ satisfy exactly the same dependencies as the columns of $R$.
      In $R$ the pivot columns are independent and every other column is a combination of them; the same is then true for the **pivot columns of $A$**.
      The pivot columns of $R$ usually do **not** lie in $C(A)$ (for example $A = \begin{bmatrix} 1 \\ 2 \end{bmatrix}$ has $R = \begin{bmatrix} 1 \\ 0 \end{bmatrix}$).
      The rows of $R$ are a basis of the row space, and the special solutions a basis of $N(A)$.
    verify: "0 if Matrix([[1, 2], [2, 4]]).columnspace()[0] == Matrix([1, 2]) and Matrix([[1, 2], [2, 4]]).rref()[0][:, 0] != Matrix([1, 2]) else 1"
    covers: [mit-18-06/lecture-9]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 3

  - id: la-ind-008
    difficulty: 3
    type: numeric
    prompt: |
      For which value of $k$ are
      $$ \mathbf{v}_1 = {{[1, a, b]}}, \quad \mathbf{v}_2 = {{[0, 1, c]}}, \quad \mathbf{v}_3 = \begin{bmatrix} {{d}} \\ k \\ {{f}} \end{bmatrix} $$
      linearly **dependent**?
    params:
      a: { int: [-3, 3], not: [0] }
      b: { int: [-3, 3] }
      c: { choice: [1, -1] }
      d: { int: [-3, 3], not: [0] }
      f: { int: [-4, 4] }
    let:
      kk: "(f + d*(a*c - b)) / c"
    answer: kk
    hints:
      - 'Three vectors in $\mathbb{R}^3$ are dependent exactly when the matrix with them as columns is singular.'
      - 'Eliminate on $\begin{bmatrix} 1 & 0 & {{d}} \\ {{a}} & 1 & k \\ {{b}} & {{c}} & {{f}} \end{bmatrix}$ and make the third pivot zero.'
    solution: |
      Put them into the columns of $M = \begin{bmatrix} 1 & 0 & {{d}} \\ {{a}} & 1 & k \\ {{b}} & {{c}} & {{f}} \end{bmatrix}$. Elimination:
      row 2 $- ({{a}})$ row 1 $= (0,\ 1,\ k {{signed: -a*d}})$, row 3 $- ({{b}})$ row 1 $= (0,\ {{c}},\ {{f - b*d}})$.
      Then row 3 $- ({{c}})$ row 2 leaves the third pivot
      $$ {{f - b*d}} - ({{c}})(k {{signed: -a*d}}) = {{f - b*d + c*a*d}} {{signed: -c}}k. $$
      It vanishes when $k = {{kk}}$; then $M$ is singular and the vectors are dependent.
    verify: "solve(Matrix([[1, 0, d], [a, 1, Symbol('k')], [b, c, f]]).det(), Symbol('k'))[0]"
    covers: [mit-18-06/lecture-9]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 5

  - id: la-ind-009
    difficulty: 4
    type: multipart
    prompt: |
      Let
      $$ A = {{A}}. $$
    params:
      l21: { int: [-2, 2] }
      l31: { int: [-2, 2] }
      l32: { int: [-2, 2], not: [0] }
      a: { int: [-3, 3], not: [0] }
      b: { int: [-3, 3] }
      c: { int: [-3, 3] }
    let:
      E: "[[1, 0, 0], [l21, 1, 0], [l31, l32, 1]]"
      R: "[[1, a, 0, b], [0, 0, 1, c], [0, 0, 0, 0]]"
      A: "E*R"
    parts:
      - prompt: "(a) What is the dimension of the column space $C(A)$?"
        type: numeric
        answer: 2
        verify: "len((Matrix([[1, 0, 0], [l21, 1, 0], [l31, l32, 1]])*Matrix([[1, a, 0, b], [0, 0, 1, c], [0, 0, 0, 0]])).columnspace())"
      - prompt: "(b) Which columns of $A$ form a basis for $C(A)$?"
        type: mc
        options:
          - "Columns 1 and 3"
          - "Columns 1 and 2"
          - "Columns 2 and 4"
          - "Columns 3 and 4"
        answer: 0
        verify: "[(0, 2), (0, 1), (1, 3), (2, 3)].index((Matrix([[1, 0, 0], [l21, 1, 0], [l31, l32, 1]])*Matrix([[1, a, 0, b], [0, 0, 1, c], [0, 0, 0, 0]])).rref()[1])"
      - prompt: "(c) What is the dimension of the null space $N(A)$?"
        type: numeric
        answer: 2
        verify: "len((Matrix([[1, 0, 0], [l21, 1, 0], [l31, l32, 1]])*Matrix([[1, a, 0, b], [0, 0, 1, c], [0, 0, 0, 0]])).nullspace())"
    hints:
      - 'Reduce $A$ to echelon form and find the pivot columns.'
      - '$\operatorname{rref}(A) = {{R}}$.'
    solution: |
      Elimination (multipliers ${{l21}}$, ${{l31}}$, then ${{l32}}$ in column 3) gives
      $$ R = {{R}}. $$
      (a) There are 2 pivots, so $\dim C(A) = r = 2$.

      (b) The pivots are in columns 1 and 3, so **columns 1 and 3 of $A$**, ${{A[:,1]}}$ and ${{A[:,3]}}$, form a basis. Column 2 is ${{a}}$ times column 1, so columns 1 and 2 are dependent.

      (c) $\dim N(A) = n - r = 4 - 2 = 2$, one special solution for each free variable $x_2, x_4$.
    covers: [mit-18-06/lecture-9]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 6

  - id: la-ind-010
    difficulty: 4
    type: proof
    prompt: |
      Prove that any $n + 1$ vectors $\mathbf{v}_1, \dots, \mathbf{v}_{n+1}$ in $\mathbb{R}^n$ are linearly dependent.
    hints:
      - 'Put the vectors into the columns of a matrix $A$. What size is it?'
      - 'Count pivots: how many free variables must $A\mathbf{x} = \mathbf{0}$ have?'
    solution: |
      Let $A = [\mathbf{v}_1\ \cdots\ \mathbf{v}_{n+1}]$, an $n \times (n+1)$ matrix. Each pivot uses up a different row, so there are at most $n$ pivots among the $n + 1$ columns,
      and at least one column is free. Setting that free variable to $1$ (the others to $0$) and solving for the pivot variables gives $\mathbf{c} \ne \mathbf{0}$ with $A\mathbf{c} = \mathbf{0}$, that is
      $$ c_1\mathbf{v}_1 + \dots + c_{n+1}\mathbf{v}_{n+1} = \mathbf{0} $$
      with not all $c_i$ zero. So the vectors are dependent. (This is why every basis of $\mathbb{R}^n$ has at most $n$ vectors.)
    covers: [mit-18-06/lecture-9]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 5

  - id: la-ind-011
    difficulty: 4
    type: numeric
    prompt: |
      Fix the non-zero vector $\mathbf{v} = {{row: v}}$ in $\mathbb{R}^{ {{n}} }$. The ${{n}} \times {{n}}$ matrices $A$ with $A\mathbf{v} = \mathbf{0}$ form a subspace of the space of all
      ${{n}} \times {{n}}$ matrices. What is its dimension?
    params:
      n: { int: [2, 5] }
    let:
      v: "1:n"
    answer: "n^2 - n"
    hints:
      - '$A\mathbf{v} = \mathbf{0}$ says each **row** of $A$ is perpendicular to $\mathbf{v}$.'
      - 'The vectors in $\mathbb{R}^{ {{n}} }$ perpendicular to a non-zero $\mathbf{v}$ form a subspace of dimension ${{n - 1}}$.'
    solution: |
      Row $i$ of $A\mathbf{v}$ is $(\text{row } i \text{ of } A) \cdot \mathbf{v}$, so $A\mathbf{v} = \mathbf{0}$ means every row of $A$ lies in the subspace
      $\{\mathbf{x} : \mathbf{x} \cdot \mathbf{v} = 0\}$, which has dimension ${{n}} - 1 = {{n - 1}}$ (one independent equation in ${{n}}$ unknowns).
      The ${{n}}$ rows can be chosen independently from it, so the dimension is
      $$ {{n}} \cdot {{n - 1}} = {{n^2 - n}}. $$
    verify: "n**2 - Matrix(np.kron(np.eye(n, dtype=int), np.arange(1, n + 1).reshape(1, n))).rank()"
    covers: [mit-18-06/lecture-9]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 5
