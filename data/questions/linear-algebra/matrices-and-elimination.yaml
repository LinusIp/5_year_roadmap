subject: linear-algebra
topic: matrices-and-elimination
questions:
  - id: la-elim-001
    difficulty: 1
    type: numeric
    prompt: |
      Elimination on $A = {{A}}$ subtracts a multiple $\ell_{21}$ of row 1 from row 2 to put a zero in position $(2, 1)$.
      What is the multiplier $\ell_{21}$?
    params:
      a: { choice: [1, -1, 2, -2, 3] }
      l: { int: [-4, 4], not: [0] }
      b: { int: [-5, 5] }
      c: { int: [-5, 5] }
    let:
      A: "[[a, b], [l*a, c]]"
    answer: l
    hints:
      - 'The multiplier is (entry to eliminate) / (pivot): $\ell_{21} = a_{21} / a_{11}$.'
    solution: |
      The pivot is $a_{11} = {{a}}$ and the entry to remove is $a_{21} = {{l*a}}$, so
      $$ \ell_{21} = \frac{a_{21}}{a_{11}} = \frac{ {{l*a}} }{ {{a}} } = {{l}}. $$
      Row 2 minus ${{l}}$ times row 1 is $({{0}},\ {{c - l*b}})$.
    verify: "(lambda M: M[1, 0] / M[0, 0])(Matrix([[a, b], [l*a, c]]))"
    covers: [mit-18-06/lecture-2, game-developer/matrix]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 1

  - id: la-elim-002
    difficulty: 2
    type: matrix
    prompt: |
      Use elimination (no row exchanges) to reduce $A = {{A}}$ to an upper triangular matrix $U$.

      Enter $U$ as `[[a, b], [c, d]]`.
    params:
      a: { choice: [1, -1, 2, -2, 3] }
      l: { int: [-4, 4], not: [0] }
      b: { int: [-5, 5] }
      c: { int: [-5, 5] }
    let:
      A: "[[a, b], [l*a, c]]"
      U: "[[a, b], [0, c - l*b]]"
    answer: U
    hints:
      - 'The multiplier is $\ell_{21} = a_{21} / a_{11} = {{l*a}} / ({{a}})$.'
      - 'Replace row 2 by row 2 minus $\ell_{21}$ times row 1; row 1 stays as it is.'
    solution: |
      The multiplier is $\ell_{21} = {{l*a}} / ({{a}}) = {{l}}$. Row 2 $-$ (${{l}}$)(row 1):
      $$ ({{l*a}},\ {{c}}) - ({{l}})({{a}},\ {{b}}) = (0,\ {{c - l*b}}). $$
      So
      $$ U = {{U}}, $$
      with pivots ${{a}}$ and ${{c - l*b}}$.
    verify: "Matrix([[a, b], [l*a, c]]).LUdecomposition()[1]"
    covers: [mit-18-06/lecture-2, game-developer/matrix]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 2

  - id: la-elim-003
    difficulty: 2
    type: numeric
    prompt: |
      Elimination on $A = {{A}}$ needs no row exchanges. What is the **third pivot**?
    params:
      l21: { int: [-2, 2] }
      l31: { int: [-2, 2] }
      l32: { int: [-2, 2] }
      p1: { int: [-3, 3], not: [0] }
      p2: { int: [-3, 3], not: [0] }
      p3: { int: [-4, 4], not: [0] }
      u12: { int: [-3, 3] }
      u13: { int: [-3, 3] }
      u23: { int: [-3, 3] }
    let:
      L: "[[1, 0, 0], [l21, 1, 0], [l31, l32, 1]]"
      U: "[[p1, u12, u13], [0, p2, u23], [0, 0, p3]]"
      A: "L*U"
      A1: "[[p1, u12, u13], [0, p2, u23], [0, l32*p2, l32*u23 + p3]]"
    answer: p3
    hints:
      - 'Clear column 1 using row 1, then clear the $(3, 2)$ entry using the new row 2.'
      - 'After the first step the matrix is ${{A1}}$.'
    solution: |
      Step 1: subtract ${{l21}}$ times row 1 from row 2 and ${{l31}}$ times row 1 from row 3:
      $$ {{A1}}. $$
      Step 2: the second pivot is ${{p2}}$; subtract $\ell_{32} = {{l32*p2}} / ({{p2}}) = {{l32}}$ times row 2 from row 3:
      $$ U = {{U}}. $$
      The pivots are ${{p1}}, {{p2}}, {{p3}}$, so the third pivot is ${{p3}}$.
    verify: "(Matrix([[1, 0, 0], [l21, 1, 0], [l31, l32, 1]])*Matrix([[p1, u12, u13], [0, p2, u23], [0, 0, p3]])).LUdecomposition()[1][2, 2]"
    covers: [mit-18-06/lecture-2, game-developer/matrix]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 4

  - id: la-elim-004
    difficulty: 2
    type: matrix
    prompt: |
      Let $A = {{A}}$. Find the elimination matrix $E_{21}$ that subtracts the right multiple of row 1 from row 2,
      so that $E_{21}A$ has a zero in position $(2, 1)$ (and rows 1 and 3 are unchanged).

      Enter it as `[[1, 0, 0], [x, 1, 0], [0, 0, 1]]`.
    params:
      l21: { int: [-3, 3], not: [0] }
      l31: { int: [-2, 2] }
      l32: { int: [-2, 2] }
      p1: { choice: [1, -1, 2, -2] }
      p2: { int: [-3, 3], not: [0] }
      p3: { int: [-3, 3], not: [0] }
      u12: { int: [-3, 3] }
      u13: { int: [-3, 3] }
      u23: { int: [-3, 3] }
    let:
      A: "[[1, 0, 0], [l21, 1, 0], [l31, l32, 1]] * [[p1, u12, u13], [0, p2, u23], [0, 0, p3]]"
      E: "[[1, 0, 0], [-l21, 1, 0], [0, 0, 1]]"
    answer: E
    hints:
      - 'The multiplier is $\ell_{21} = a_{21} / a_{11} = {{A[2,1]}} / ({{A[1,1]}})$.'
      - '$E_{21}$ is the identity with $-\ell_{21}$ in position $(2, 1)$.'
    solution: |
      The multiplier is $\ell_{21} = {{A[2,1]}} / ({{A[1,1]}}) = {{l21}}$. Subtracting $\ell_{21}$ times row 1 from row 2 is done by the identity
      matrix with $-\ell_{21}$ in row 2, column 1:
      $$ E_{21} = {{E}}, \qquad E_{21}A = {{E*A}}. $$
    verify: "(lambda M: Matrix([[1, 0, 0], [-M[1, 0] / M[0, 0], 1, 0], [0, 0, 1]]))(Matrix([[1, 0, 0], [l21, 1, 0], [l31, l32, 1]])*Matrix([[p1, u12, u13], [0, p2, u23], [0, 0, p3]]))"
    covers: [mit-18-06/lecture-2, game-developer/matrix]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 3

  - id: la-elim-005
    difficulty: 1
    type: mc
    prompt: |
      When does elimination on a square matrix **fail for good** (the matrix is singular), rather than just needing a row exchange?
    options:
      - "A zero appears in a pivot position and every entry below it in that column is also zero"
      - "A pivot turns out to be negative"
      - "A multiplier is larger than 1"
      - "The right-hand side $\\mathbf{b}$ has a zero component"
    answer: 0
    hints:
      - 'A zero in the pivot position can be fixed by exchanging with a lower row, if some lower row has a non-zero entry in that column.'
    solution: |
      If the pivot position holds a zero but some row below has a non-zero entry there, exchanging the two rows lets elimination continue.
      Only when the pivot position **and everything below it** are zero is there no pivot in that column: then $A$ has fewer than $n$ pivots and is singular.
      Negative pivots, large multipliers and zeros in $\mathbf{b}$ cause no trouble.
    verify: "0 if Matrix([[1, 2, 3], [2, 4, 5], [3, 6, 1]]).det() == 0 else 1"
    covers: [mit-18-06/lecture-2, game-developer/matrix]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 1

  - id: la-elim-006
    difficulty: 3
    type: vector
    prompt: |
      Solve $A\mathbf{x} = \mathbf{b}$ by elimination and back substitution, where
      $$ A = {{A}}, \qquad \mathbf{b} = {{b}}. $$
      Enter $\mathbf{x}$ as a list such as `1, 2, 3`.
    params:
      l21: { int: [-2, 2] }
      l31: { int: [-2, 2] }
      l32: { int: [-2, 2] }
      p1: { choice: [1, -1, 2] }
      p2: { choice: [1, -1, 2, -2] }
      p3: { choice: [1, -1, 2, 3] }
      u12: { int: [-2, 2] }
      u13: { int: [-2, 2] }
      u23: { int: [-2, 2] }
      x1: { int: [-3, 3] }
      x2: { int: [-3, 3] }
      x3: { int: [-3, 3] }
    let:
      L: "[[1, 0, 0], [l21, 1, 0], [l31, l32, 1]]"
      U: "[[p1, u12, u13], [0, p2, u23], [0, 0, p3]]"
      A: "L*U"
      x: "[x1, x2, x3]"
      b: "A*x"
      c: "U*x"
    answer: x
    hints:
      - 'Eliminate on the augmented matrix $[A \mid \mathbf{b}]$ so the right-hand side changes along with $A$.'
      - 'Elimination ends at $U\mathbf{x} = \mathbf{c}$ with $U = {{U}}$ and $\mathbf{c} = {{c}}$. Now solve from the bottom row up.'
    solution: |
      Elimination (multipliers $\ell_{21} = {{l21}}$, $\ell_{31} = {{l31}}$, $\ell_{32} = {{l32}}$) turns $[A \mid \mathbf{b}]$ into $[U \mid \mathbf{c}]$ with
      $$ U = {{U}}, \qquad \mathbf{c} = {{c}}. $$
      Back substitution:
      - Row 3: ${{p3}}x_3 = {{c[3]}}$, so $x_3 = {{x3}}$.
      - Row 2: ${{p2}}x_2 {{signed: u23}}({{x3}}) = {{c[2]}}$, so $x_2 = {{x2}}$.
      - Row 1: ${{p1}}x_1 {{signed: u12}}({{x2}}) {{signed: u13}}({{x3}}) = {{c[1]}}$, so $x_1 = {{x1}}$.

      So $\mathbf{x} = {{row: x}}$. Check: $A\mathbf{x} = {{A*x}} = \mathbf{b}$.
    verify: "list((Matrix([[1, 0, 0], [l21, 1, 0], [l31, l32, 1]])*Matrix([[p1, u12, u13], [0, p2, u23], [0, 0, p3]])).LUsolve(Matrix([[1, 0, 0], [l21, 1, 0], [l31, l32, 1]])*Matrix([[p1, u12, u13], [0, p2, u23], [0, 0, p3]])*Matrix([x1, x2, x3])))"
    covers: [mit-18-06/lecture-2, game-developer/matrix]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 7

  - id: la-elim-007
    difficulty: 2
    type: numeric
    prompt: |
      Let $A = \begin{bmatrix} {{a}} & {{b}} \\ {{l*a}} & k \end{bmatrix}$. For which value of $k$ does elimination produce a **zero second pivot**
      (so that $A$ is singular)?
    params:
      a: { choice: [1, -1, 2, -2, 3] }
      l: { int: [-3, 3], not: [0] }
      b: { int: [-4, 4], not: [0] }
    answer: "l*b"
    hints:
      - 'Find the multiplier $\ell_{21}$ and write the second pivot in terms of $k$.'
    solution: |
      The multiplier is $\ell_{21} = {{l*a}} / ({{a}}) = {{l}}$. Row 2 minus ${{l}}$ times row 1 leaves the second pivot
      $$ k - ({{l}})({{b}}) = k {{signed: -l*b}}. $$
      It is zero when $k = {{l*b}}$. Then row 2 is exactly ${{l}}$ times row 1, there is only one pivot, and $A$ is singular.
    verify: "solve(Matrix([[a, b], [l*a, Symbol('k')]]).det(), Symbol('k'))[0]"
    covers: [mit-18-06/lecture-2, game-developer/matrix]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 2

  - id: la-elim-008
    difficulty: 3
    type: multipart
    prompt: |
      Elimination on $A = {{A}}$ needs no row exchanges. Find the three multipliers.
    params:
      l21: { int: [-3, 3] }
      l31: { int: [-3, 3] }
      l32: { int: [-3, 3] }
      p1: { choice: [1, -1, 2, -2] }
      p2: { choice: [1, -1, 2, -2, 3] }
      p3: { int: [-3, 3], not: [0] }
      u12: { int: [-3, 3] }
      u13: { int: [-3, 3] }
      u23: { int: [-3, 3] }
    let:
      U: "[[p1, u12, u13], [0, p2, u23], [0, 0, p3]]"
      A: "[[1, 0, 0], [l21, 1, 0], [l31, l32, 1]] * U"
      A1: "[[p1, u12, u13], [0, p2, u23], [0, l32*p2, l32*u23 + p3]]"
    parts:
      - prompt: "(a) The multiplier $\\ell_{21}$ (the multiple of row 1 subtracted from row 2)."
        type: numeric
        answer: l21
        verify: "(Matrix([[1, 0, 0], [l21, 1, 0], [l31, l32, 1]])*Matrix([[p1, u12, u13], [0, p2, u23], [0, 0, p3]])).LUdecomposition()[0][1, 0]"
      - prompt: "(b) The multiplier $\\ell_{31}$ (the multiple of row 1 subtracted from row 3)."
        type: numeric
        answer: l31
        verify: "(Matrix([[1, 0, 0], [l21, 1, 0], [l31, l32, 1]])*Matrix([[p1, u12, u13], [0, p2, u23], [0, 0, p3]])).LUdecomposition()[0][2, 0]"
      - prompt: "(c) The multiplier $\\ell_{32}$ (the multiple of the **new** row 2 subtracted from the new row 3)."
        type: numeric
        answer: l32
        verify: "(Matrix([[1, 0, 0], [l21, 1, 0], [l31, l32, 1]])*Matrix([[p1, u12, u13], [0, p2, u23], [0, 0, p3]])).LUdecomposition()[0][2, 1]"
    hints:
      - '$\ell_{21} = a_{21}/a_{11}$ and $\ell_{31} = a_{31}/a_{11}$.'
      - 'For $\ell_{32}$, first do step 1. The matrix becomes ${{A1}}$.'
    solution: |
      (a) $\ell_{21} = a_{21}/a_{11} = {{A[2,1]}} / ({{p1}}) = {{l21}}$.

      (b) $\ell_{31} = a_{31}/a_{11} = {{A[3,1]}} / ({{p1}}) = {{l31}}$.

      After subtracting these multiples of row 1, the matrix is
      $$ {{A1}}. $$
      (c) The second pivot is ${{p2}}$ and the entry below it is ${{l32*p2}}$, so $\ell_{32} = {{l32*p2}} / ({{p2}}) = {{l32}}$, leaving
      $$ U = {{U}}. $$
    covers: [mit-18-06/lecture-2, game-developer/matrix]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 6

  - id: la-elim-009
    difficulty: 4
    type: numeric
    prompt: |
      For which number $c$ does elimination on
      $$ A = \begin{bmatrix} {{A[1,1]}} & {{A[1,2]}} & {{A[1,3]}} \\ {{A[2,1]}} & {{A[2,2]}} & {{A[2,3]}} \\ {{A[3,1]}} & {{A[3,2]}} & c \end{bmatrix} $$
      leave a **zero in the third pivot position** (so that $A$ is singular)?
    params:
      l21: { int: [-2, 2] }
      l31: { int: [-2, 2] }
      l32: { int: [-2, 2] }
      p1: { choice: [1, -1, 2] }
      p2: { choice: [1, -1, 2, -2] }
      u12: { int: [-3, 3] }
      u13: { int: [-3, 3] }
      u23: { int: [-3, 3] }
    let:
      A: "[[1, 0, 0], [l21, 1, 0], [l31, l32, 1]] * [[p1, u12, u13], [0, p2, u23], [0, 0, 0]]"
      cc: "A[3,3]"
    answer: cc
    hints:
      - 'The $(3,3)$ entry does not affect the first two elimination steps. Carry it along as $c$.'
      - 'The multipliers are $\ell_{21} = {{l21}}$, $\ell_{31} = {{l31}}$, and then $\ell_{32} = {{l32}}$.'
    solution: |
      Subtracting ${{l21}}$ times row 1 from row 2 and ${{l31}}$ times row 1 from row 3 gives rows
      $({{p1}}, {{u12}}, {{u13}})$, $(0, {{p2}}, {{u23}})$ and $(0, {{l32*p2}}, c {{signed: -l31*u13}})$.
      Then subtracting $\ell_{32} = {{l32}}$ times the new row 2 from row 3 leaves the third pivot
      $$ c {{signed: -l31*u13}} {{signed: -l32*u23}} = c {{signed: -cc}}. $$
      It is zero exactly when $c = {{cc}}$.
    verify: "solve(Matrix([[p1, u12, u13], [l21*p1, l21*u12 + p2, l21*u13 + u23], [l31*p1, l31*u12 + l32*p2, Symbol('c')]]).det(), Symbol('c'))[0]"
    covers: [mit-18-06/lecture-2, game-developer/matrix]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 6

  - id: la-elim-010
    difficulty: 3
    type: mc
    prompt: |
      Start elimination on $A = \begin{bmatrix} 1 & 2 & 3 \\ 2 & 4 & 7 \\ 3 & 7 & 9 \end{bmatrix}$.
      After clearing column 1, what happens at the second pivot?
    options:
      - "The pivot position holds 0, but exchanging rows 2 and 3 fixes it; $A$ is invertible"
      - "The pivot position holds 0 and nothing can fix it; $A$ is singular"
      - "The second pivot is 2 and elimination continues normally"
      - "Row 1 must be exchanged with row 2"
    answer: 0
    hints:
      - 'Compute row 2 $- 2\times$ row 1 and row 3 $- 3\times$ row 1.'
      - 'Look at the entries in column 2 of the new rows 2 and 3.'
    solution: |
      Row 2 $- 2\,$row 1 $= (0, 0, 1)$ and row 3 $- 3\,$row 1 $= (0, 1, 0)$. The second pivot position holds $0$,
      but the entry below it is $1$, so exchanging rows 2 and 3 gives
      $$ \begin{bmatrix} 1 & 2 & 3 \\ 0 & 1 & 0 \\ 0 & 0 & 1 \end{bmatrix}, $$
      with pivots $1, 1, 1$. Three pivots: $A$ is invertible (a permutation is needed, so $PA = LU$ rather than $A = LU$).
    verify: "0 if Matrix([[1, 2, 3], [2, 4, 7], [3, 7, 9]]).rank() == 3 and Matrix([[1, 2, 3], [2, 4, 7], [3, 7, 9]]).LUdecomposition()[2] != [] else 1"
    covers: [mit-18-06/lecture-2, game-developer/matrix]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 3

  - id: la-elim-011
    difficulty: 4
    type: proof
    prompt: |
      $A$ is an $n \times n$ matrix. Elimination (with whatever row exchanges are needed) ends with a matrix $U$ whose last row is all zeros.
      Explain why $A\mathbf{x} = \mathbf{0}$ then has a solution $\mathbf{x} \ne \mathbf{0}$, so $A$ is not invertible.
    hints:
      - 'Elimination steps and row exchanges are invertible, so $A\mathbf{x} = \mathbf{0}$ and $U\mathbf{x} = \mathbf{0}$ have the same solutions.'
      - 'A zero row means fewer than $n$ pivots. Some column has no pivot: give its variable the value 1.'
    solution: |
      Each elimination step multiplies by an invertible matrix ($E_{ij}$ or a permutation $P$), so $U = MA$ with $M$ invertible, and
      $A\mathbf{x} = \mathbf{0} \iff U\mathbf{x} = \mathbf{0}$.

      $U$ is upper triangular (echelon) with a zero last row, so it has at most $n - 1$ pivots and at least one of its $n$ columns has no pivot.
      Set that **free variable** to $1$, set the other free variables (if any) to $0$, and solve the pivot rows from the bottom up for the pivot variables
      (each pivot row determines its pivot variable because the pivot is non-zero). This gives an $\mathbf{x} \ne \mathbf{0}$ with $U\mathbf{x} = \mathbf{0}$,
      hence $A\mathbf{x} = \mathbf{0}$.

      If $A^{-1}$ existed we would get $\mathbf{x} = A^{-1}A\mathbf{x} = A^{-1}\mathbf{0} = \mathbf{0}$, a contradiction. So $A$ is not invertible.
    covers: [mit-18-06/lecture-2, game-developer/matrix]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 6
