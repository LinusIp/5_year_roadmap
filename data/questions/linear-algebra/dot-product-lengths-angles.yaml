subject: linear-algebra
topic: dot-product-lengths-angles
questions:
  - id: la-dot-001
    difficulty: 1
    type: numeric
    prompt: |
      Compute the dot product $\mathbf{v} \cdot \mathbf{w}$ for $\mathbf{v} = {{v}}$ and $\mathbf{w} = {{w}}$.
    params:
      v1: { int: [-5, 5] }
      v2: { int: [-5, 5] }
      v3: { int: [-5, 5] }
      w1: { int: [-5, 5] }
      w2: { int: [-5, 5] }
      w3: { int: [-5, 5] }
    let:
      v: "[v1, v2, v3]"
      w: "[w1, w2, w3]"
      vw: "dot(v, w)"
    answer: vw
    hints:
      - 'Multiply matching components and add: $v_1 w_1 + v_2 w_2 + v_3 w_3$.'
    solution: |
      $$ \mathbf{v} \cdot \mathbf{w} = ({{v1}})({{w1}}) + ({{v2}})({{w2}}) + ({{v3}})({{w3}}) = {{v1*w1}} {{signed: v2*w2}} {{signed: v3*w3}} = {{vw}}. $$
    verify: "Matrix([v1, v2, v3]).dot(Matrix([w1, w2, w3]))"
    covers: [mit-18-06/lecture-1, game-developer/vector]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 1

  - id: la-dot-002
    difficulty: 1
    type: numeric
    prompt: |
      What is the length $\lVert \mathbf{v} \rVert$ of $\mathbf{v} = {{v}}$?
    params:
      k: { int: [1, 5] }
      sa: { choice: [1, -1] }
      sb: { choice: [1, -1] }
    let:
      v: "[sa*[1, 2, 1, 2, 4][k], [2, 3, 4, 6, 4][k], sb*[2, 6, 8, 9, 7][k]]"
      len: "[3, 7, 9, 11, 9][k]"
    answer: len
    hints:
      - '$\lVert \mathbf{v} \rVert = \sqrt{\mathbf{v} \cdot \mathbf{v}} = \sqrt{v_1^2 + v_2^2 + v_3^2}$.'
    solution: |
      $$ \lVert \mathbf{v} \rVert^2 = \mathbf{v} \cdot \mathbf{v} = ({{v[1]}})^2 + ({{v[2]}})^2 + ({{v[3]}})^2 = {{v[1]^2}} + {{v[2]^2}} + {{v[3]^2}} = {{len^2}}, $$
      so $\lVert \mathbf{v} \rVert = \sqrt{ {{len^2}} } = {{len}}$.
    verify: "Matrix([sa*[1, 2, 1, 2, 4][k-1], [2, 3, 4, 6, 4][k-1], sb*[2, 6, 8, 9, 7][k-1]]).norm()"
    covers: [mit-18-06/lecture-1, game-developer/vector]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 1

  - id: la-dot-003
    difficulty: 2
    type: vector
    prompt: |
      Find the unit vector $\mathbf{u}$ in the same direction as $\mathbf{v} = {{v}}$.

      Enter it as a list such as `0.5, 0.5, 0.707`; decimals to 3 places are fine.
    params:
      k: { int: [1, 5] }
      sa: { choice: [1, -1] }
      sb: { choice: [1, -1] }
      m: { int: [1, 3] }
    let:
      v: "m*[sa*[1, 2, 1, 2, 4][k], [2, 3, 4, 6, 4][k], sb*[2, 6, 8, 9, 7][k]]"
      len: "m*[3, 7, 9, 11, 9][k]"
      u: "v / len"
    answer: u
    tolerance: { abs: 0.002 }
    hints:
      - 'Divide $\mathbf{v}$ by its length: $\mathbf{u} = \mathbf{v} / \lVert \mathbf{v} \rVert$.'
      - '$\lVert \mathbf{v} \rVert^2 = {{dot(v, v)}}$.'
    solution: |
      $\lVert \mathbf{v} \rVert = \sqrt{ {{dot(v, v)}} } = {{len}}$, so
      $$ \mathbf{u} = \frac{\mathbf{v}}{\lVert \mathbf{v} \rVert} = \frac{1}{ {{len}} }{{v}} \approx {{u}}. $$
      Check: $\lVert \mathbf{u} \rVert = 1$, and $\mathbf{u}$ points the same way as $\mathbf{v}$ because we divided by a positive number.
    verify: "list(Matrix([m*sa*[1, 2, 1, 2, 4][k-1], m*[2, 3, 4, 6, 4][k-1], m*sb*[2, 6, 8, 9, 7][k-1]]).normalized())"
    covers: [mit-18-06/lecture-1, game-developer/vector]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 2

  - id: la-dot-004
    difficulty: 2
    type: numeric
    prompt: |
      Let $\mathbf{v} = {{[a, b, s]}}$ and $\mathbf{w} = ({{d1}}, {{d2}}, k)$. For which $k$ are $\mathbf{v}$ and $\mathbf{w}$ perpendicular?
    params:
      a: { int: [-4, 4] }
      b: { int: [-4, 4] }
      s: { choice: [1, -1] }
      d1: { int: [-4, 4] }
      d2: { int: [-4, 4] }
    let:
      kk: "-(a*d1 + b*d2) / s"
    answer: kk
    hints:
      - 'Perpendicular means $\mathbf{v} \cdot \mathbf{w} = 0$.'
      - '$\mathbf{v} \cdot \mathbf{w} = {{a*d1 + b*d2}} {{signed: s}}k$.'
    solution: |
      $$ \mathbf{v} \cdot \mathbf{w} = ({{a}})({{d1}}) + ({{b}})({{d2}}) + ({{s}})k = {{a*d1 + b*d2}} {{signed: s}}k. $$
      Setting this to zero gives $k = {{kk}}$.
    verify: "solve(Matrix([a, b, s]).dot(Matrix([d1, d2, Symbol('k')])), Symbol('k'))[0]"
    covers: [mit-18-06/lecture-1, game-developer/vector]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 2

  - id: la-dot-005
    difficulty: 2
    type: numeric
    prompt: |
      What is the angle between $\mathbf{v} = {{v}}$ and $\mathbf{w} = {{w}}$, in **degrees**?
    params:
      k: { int: [1, 5] }
      m: { int: [1, 3] }
      n: { int: [1, 2] }
    let:
      V: "[[1, 1, 0], [1, 0, -1], [1, 2, 2], [1, 0, 0], [1, 1, 0]]"
      W: "[[0, 1, 1], [0, 1, 1], [2, 1, -2], [1, 1, 0], [-1, 0, 0]]"
      v: "m*V[k, :]"
      w: "n*W[k, :]"
      ang: "[60, 120, 90, 45, 135][k]"
    answer: ang
    tolerance: { abs: 0.5 }
    hints:
      - '$\cos\theta = \dfrac{\mathbf{v} \cdot \mathbf{w}}{\lVert \mathbf{v} \rVert\,\lVert \mathbf{w} \rVert}$.'
      - 'Here $\mathbf{v} \cdot \mathbf{w} = {{dot(v, w)}}$, $\lVert \mathbf{v} \rVert^2 = {{dot(v, v)}}$ and $\lVert \mathbf{w} \rVert^2 = {{dot(w, w)}}$.'
    solution: |
      $$ \cos\theta = \frac{\mathbf{v} \cdot \mathbf{w}}{\lVert \mathbf{v} \rVert\,\lVert \mathbf{w} \rVert} = \frac{ {{dot(v, w)}} }{\sqrt{ {{dot(v, v)}} }\,\sqrt{ {{dot(w, w)}} }} = {{dot(v, w) / sqrt(dot(v, v) * dot(w, w))}}. $$
      The angle with that cosine is $\theta = {{ang}}^\circ$. (Scaling $\mathbf{v}$ or $\mathbf{w}$ by a positive number never changes the angle.)
    verify: "(lambda v, w: acos(v.dot(w) / (v.norm()*w.norm()))*180/pi)(m*Matrix([[1, 1, 0], [1, 0, -1], [1, 2, 2], [1, 0, 0], [1, 1, 0]][k-1]), n*Matrix([[0, 1, 1], [0, 1, 1], [2, 1, -2], [1, 1, 0], [-1, 0, 0]][k-1]))"
    covers: [mit-18-06/lecture-1, game-developer/vector]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 3

  - id: la-dot-006
    difficulty: 1
    type: mc
    prompt: |
      $\mathbf{v}$ and $\mathbf{w}$ are non-zero vectors with $\mathbf{v} \cdot \mathbf{w} = 0$. What does that tell you?
    options:
      - "$\\mathbf{v}$ and $\\mathbf{w}$ are perpendicular"
      - "$\\mathbf{v}$ and $\\mathbf{w}$ are parallel"
      - "$\\mathbf{v}$ and $\\mathbf{w}$ have the same length"
      - "$\\mathbf{w} = -\\mathbf{v}$"
    answer: 0
    hints:
      - '$\mathbf{v} \cdot \mathbf{w} = \lVert \mathbf{v} \rVert\,\lVert \mathbf{w} \rVert \cos\theta$.'
    solution: |
      Since $\mathbf{v} \cdot \mathbf{w} = \lVert \mathbf{v} \rVert\,\lVert \mathbf{w} \rVert \cos\theta$ and both lengths are non-zero, $\cos\theta = 0$,
      so $\theta = 90^\circ$: the vectors are perpendicular. (If $\mathbf{w} = -\mathbf{v}$ the dot product would be $-\lVert \mathbf{v} \rVert^2 < 0$.)
    verify: "0 if Matrix([1, 2]).dot(Matrix([-2, 1])) == 0 else 1"
    covers: [mit-18-06/lecture-1, game-developer/vector]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 1

  - id: la-dot-007
    difficulty: 3
    type: numeric
    prompt: |
      Vectors $\mathbf{v}$ and $\mathbf{w}$ have $\lVert \mathbf{v} \rVert = {{a}}$, $\lVert \mathbf{w} \rVert = {{b}}$ and $\mathbf{v} \cdot \mathbf{w} = {{c}}$.
      What is $\lVert \mathbf{v} - 2\mathbf{w} \rVert^2$?
    params:
      a: { int: [1, 5] }
      b: { int: [1, 5] }
      c: { int: [-10, 10] }
    require: ["abs(c) <= a*b"]
    answer: "a^2 + 4*b^2 - 4*c"
    hints:
      - 'Write $\lVert \mathbf{x} \rVert^2 = \mathbf{x} \cdot \mathbf{x}$ with $\mathbf{x} = \mathbf{v} - 2\mathbf{w}$.'
      - 'Expand like $(p - 2q)^2$: the dot product distributes over sums.'
    solution: |
      $$ \lVert \mathbf{v} - 2\mathbf{w} \rVert^2 = (\mathbf{v} - 2\mathbf{w}) \cdot (\mathbf{v} - 2\mathbf{w})
         = \mathbf{v} \cdot \mathbf{v} - 4\,\mathbf{v} \cdot \mathbf{w} + 4\,\mathbf{w} \cdot \mathbf{w}
         = {{a^2}} - 4({{c}}) + 4({{b^2}}) = {{a^2 + 4*b^2 - 4*c}}. $$
    verify: "(lambda v, w: (v - 2*w).dot(v - 2*w))(Matrix([a, 0]), Matrix([Rational(c, a), sqrt(b**2 - Rational(c, a)**2)]))"
    covers: [mit-18-06/lecture-1, game-developer/vector]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 3

  - id: la-dot-008
    difficulty: 3
    type: multipart
    prompt: |
      Let $\mathbf{v} = {{v}}$ and $\mathbf{w} = {{w}}$.
    params:
      v1: { int: [-3, 3] }
      v2: { int: [-3, 3] }
      v3: { int: [-3, 3] }
      w1: { int: [-3, 3] }
      w2: { int: [-3, 3] }
      w3: { int: [-3, 3] }
    let:
      v: "[v1, v2, v3]"
      w: "[w1, w2, w3]"
    require: ["norm(cross(v, w)) > 0"]
    parts:
      - prompt: "(a) What is $\\mathbf{v} \\cdot \\mathbf{w}$?"
        type: numeric
        answer: "dot(v, w)"
        verify: "Matrix([v1, v2, v3]).dot(Matrix([w1, w2, w3]))"
      - prompt: "(b) Using (a), what is $\\cos\\theta$, where $\\theta$ is the angle between them? Give 3 decimal places."
        type: numeric
        answer: "part1 / (norm(v) * norm(w))"
        tolerance: { abs: 0.001 }
        verify: "part1 / (Matrix([v1, v2, v3]).norm() * Matrix([w1, w2, w3]).norm())"
      - prompt: "(c) Using (b), what is $\\theta$ in degrees? Give 1 decimal place."
        type: numeric
        answer: "acos(part2) * 180 / pi"
        tolerance: { abs: 0.1 }
        verify: "acos(part2) * 180 / pi"
    hints:
      - '$\cos\theta = \dfrac{\mathbf{v} \cdot \mathbf{w}}{\lVert \mathbf{v} \rVert\,\lVert \mathbf{w} \rVert}$.'
      - '$\lVert \mathbf{v} \rVert^2 = {{dot(v, v)}}$ and $\lVert \mathbf{w} \rVert^2 = {{dot(w, w)}}$.'
    solution: |
      (a) $\mathbf{v} \cdot \mathbf{w} = ({{v1}})({{w1}}) + ({{v2}})({{w2}}) + ({{v3}})({{w3}}) = {{dot(v, w)}}$.

      (b) $\lVert \mathbf{v} \rVert = \sqrt{ {{dot(v, v)}} }$ and $\lVert \mathbf{w} \rVert = \sqrt{ {{dot(w, w)}} }$, so
      $$ \cos\theta = \frac{ {{dot(v, w)}} }{\sqrt{ {{dot(v, v)}} }\,\sqrt{ {{dot(w, w)}} }} = \frac{ {{dot(v, w)}} }{\sqrt{ {{dot(v, v)*dot(w, w)}} }} \approx {{round(dot(v, w) / (norm(v)*norm(w)), 4)}}. $$

      (c) $\theta = \arccos({{round(dot(v, w) / (norm(v)*norm(w)), 4)}}) \approx {{round(acos(dot(v, w) / (norm(v)*norm(w))) * 180 / pi, 1)}}^\circ$.
    covers: [mit-18-06/lecture-1, game-developer/vector]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 5

  - id: la-dot-009
    difficulty: 3
    type: proof
    prompt: |
      Show that $\lVert \mathbf{v} + \mathbf{w} \rVert^2 = \lVert \mathbf{v} \rVert^2 + \lVert \mathbf{w} \rVert^2$ holds **if and only if** $\mathbf{v} \cdot \mathbf{w} = 0$.
    hints:
      - 'Write $\lVert \mathbf{v} + \mathbf{w} \rVert^2$ as $(\mathbf{v} + \mathbf{w}) \cdot (\mathbf{v} + \mathbf{w})$ and expand.'
    solution: |
      Using $\lVert \mathbf{x} \rVert^2 = \mathbf{x} \cdot \mathbf{x}$, linearity and symmetry of the dot product,
      $$ \lVert \mathbf{v} + \mathbf{w} \rVert^2 = \mathbf{v} \cdot \mathbf{v} + \mathbf{v} \cdot \mathbf{w} + \mathbf{w} \cdot \mathbf{v} + \mathbf{w} \cdot \mathbf{w}
         = \lVert \mathbf{v} \rVert^2 + 2\,\mathbf{v} \cdot \mathbf{w} + \lVert \mathbf{w} \rVert^2. $$
      So $\lVert \mathbf{v} + \mathbf{w} \rVert^2 - \lVert \mathbf{v} \rVert^2 - \lVert \mathbf{w} \rVert^2 = 2\,\mathbf{v} \cdot \mathbf{w}$, which is zero
      exactly when $\mathbf{v} \cdot \mathbf{w} = 0$. This is Pythagoras' theorem and its converse in $\mathbb{R}^n$.
    covers: [mit-18-06/lecture-1, game-developer/vector]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 4

  - id: la-dot-010
    difficulty: 4
    type: proof
    prompt: |
      Assuming the Schwarz inequality $|\mathbf{v} \cdot \mathbf{w}| \le \lVert \mathbf{v} \rVert\,\lVert \mathbf{w} \rVert$, prove the
      **triangle inequality** $\lVert \mathbf{v} + \mathbf{w} \rVert \le \lVert \mathbf{v} \rVert + \lVert \mathbf{w} \rVert$.
    hints:
      - 'Both sides are non-negative, so it is enough to compare their squares.'
      - 'Expand $\lVert \mathbf{v} + \mathbf{w} \rVert^2$ and bound the cross term with Schwarz.'
    solution: |
      Expanding,
      $$ \lVert \mathbf{v} + \mathbf{w} \rVert^2 = \lVert \mathbf{v} \rVert^2 + 2\,\mathbf{v} \cdot \mathbf{w} + \lVert \mathbf{w} \rVert^2
         \le \lVert \mathbf{v} \rVert^2 + 2\,\lVert \mathbf{v} \rVert\,\lVert \mathbf{w} \rVert + \lVert \mathbf{w} \rVert^2 = \big(\lVert \mathbf{v} \rVert + \lVert \mathbf{w} \rVert\big)^2, $$
      where the inequality uses $\mathbf{v} \cdot \mathbf{w} \le |\mathbf{v} \cdot \mathbf{w}| \le \lVert \mathbf{v} \rVert\,\lVert \mathbf{w} \rVert$.
      Both $\lVert \mathbf{v} + \mathbf{w} \rVert$ and $\lVert \mathbf{v} \rVert + \lVert \mathbf{w} \rVert$ are non-negative, and $x \mapsto x^2$ is increasing
      on $[0, \infty)$, so taking square roots gives $\lVert \mathbf{v} + \mathbf{w} \rVert \le \lVert \mathbf{v} \rVert + \lVert \mathbf{w} \rVert$.
    covers: [mit-18-06/lecture-1, game-developer/vector]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 6

  - id: la-dot-011
    difficulty: 4
    type: multipart
    prompt: |
      Let $\mathbf{v} = {{v}}$ and $\mathbf{w} = {{w}}$, and let $f(t) = \lVert \mathbf{v} + t\,\mathbf{w} \rVert^2$ for a real number $t$.
    params:
      v1: { int: [-3, 3] }
      v2: { int: [-3, 3] }
      v3: { int: [-3, 3] }
      w1: { int: [-3, 3] }
      w2: { int: [-3, 3] }
      w3: { int: [-3, 3] }
    let:
      v: "[v1, v2, v3]"
      w: "[w1, w2, w3]"
      vv: "dot(v, v)"
      vw: "dot(v, w)"
      ww: "dot(w, w)"
    require: ["ww > 0", "vw != 0"]
    parts:
      - prompt: "(a) Write $f(t)$ as a polynomial in $t$."
        type: expression
        answer: "vv + 2*vw*t + ww*t^2"
        vars: [t]
        domain: [-3, 3]
        verify: "expand((Matrix([v1, v2, v3]) + t*Matrix([w1, w2, w3])).dot(Matrix([v1, v2, v3]) + t*Matrix([w1, w2, w3])))"
      - prompt: "(b) Which $t$ makes $\\mathbf{v} + t\\,\\mathbf{w}$ as short as possible? Give it as a decimal (3 places) or an integer."
        type: numeric
        answer: "-vw / ww"
        tolerance: { abs: 0.001 }
        verify: "solve(diff((Matrix([v1, v2, v3]) + t*Matrix([w1, w2, w3])).dot(Matrix([v1, v2, v3]) + t*Matrix([w1, w2, w3])), t), t)[0]"
    hints:
      - '$f(t) = (\mathbf{v} + t\mathbf{w}) \cdot (\mathbf{v} + t\mathbf{w}) = \mathbf{v} \cdot \mathbf{v} + 2t\,\mathbf{v} \cdot \mathbf{w} + t^2\,\mathbf{w} \cdot \mathbf{w}$.'
      - 'A parabola $\alpha + 2\beta t + \gamma t^2$ with $\gamma > 0$ is smallest where its derivative $2\beta + 2\gamma t$ is zero.'
    solution: |
      (a) Here $\mathbf{v} \cdot \mathbf{v} = {{vv}}$, $\mathbf{v} \cdot \mathbf{w} = {{vw}}$ and $\mathbf{w} \cdot \mathbf{w} = {{ww}}$, so
      $$ f(t) = {{vv}} {{signed: 2*vw}}\,t + {{ww}}\,t^2. $$

      (b) $f'(t) = {{2*vw}} + {{2*ww}}\,t = 0$ gives
      $$ t^* = -\frac{\mathbf{v} \cdot \mathbf{w}}{\mathbf{w} \cdot \mathbf{w}} = {{frac: -vw / ww}} \approx {{round(-vw / ww, 3)}}. $$
      At this $t^*$, $\mathbf{v} + t^*\mathbf{w}$ is perpendicular to $\mathbf{w}$ (check: its dot product with $\mathbf{w}$ is ${{vw}} + t^* \cdot {{ww}} = 0$),
      the same right angle that defines the projection of $\mathbf{v}$ onto the line through $\mathbf{w}$.
    covers: [mit-18-06/lecture-1, game-developer/vector]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 7
