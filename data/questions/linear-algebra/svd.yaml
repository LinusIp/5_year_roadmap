subject: linear-algebra
topic: svd
questions:
  - id: la-svd-001
    difficulty: 1
    type: mc
    prompt: |
      In the SVD $A = U\Sigma V^T$, the singular values $\sigma_i$ on the diagonal of $\Sigma$ are:
    options:
      - "the square roots of the non-zero eigenvalues of $A^TA$"
      - "the eigenvalues of $A$"
      - "the absolute values of the pivots of $A$"
      - "the diagonal entries of $A$"
    answer: 0
    hints:
      - 'Compute $A^TA$ from $A = U\Sigma V^T$.'
    solution: |
      $A^TA = V\Sigma^TU^TU\Sigma V^T = V(\Sigma^T\Sigma)V^T$, which diagonalises the symmetric matrix $A^TA$: its eigenvalues are $\sigma_i^2$ and its
      eigenvectors are the columns of $V$. So $\sigma_i = \sqrt{\lambda_i(A^TA)}$. (Likewise $AA^T = U\Sigma\Sigma^TU^T$.)

      They are not the eigenvalues of $A$ in general: $\begin{bmatrix} 0 & 1 \\ 0 & 0 \end{bmatrix}$ has eigenvalues $0, 0$ but singular values $1, 0$.
    verify: "0"
    covers: [mit-18-06/lecture-29]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 2
  - id: la-svd-002
    difficulty: 1
    type: numeric
    prompt: |
      What is the **largest** singular value of $A = {{A}}$?
    params:
      a: { int: [-6, 6], not: [0] }
      b: { int: [-6, 6], not: [0] }
    let:
      A: "[[a, 0], [0, b]]"
    require: ["abs(a) != abs(b)"]
    answer: "max(abs(a), abs(b))"
    hints:
      - 'Singular values are never negative.'
      - '$A^TA = {{transpose(A) * A}}$.'
    solution: |
      $A^TA = {{transpose(A) * A}}$ has eigenvalues ${{a^2}}$ and ${{b^2}}$, so the singular values are $|{{a}}| = {{abs(a)}}$ and $|{{b}}| = {{abs(b)}}$.
      (The signs go into $U$ or $V$: for instance $A = U\Sigma V^T$ with $V = I$ and $U$ diagonal with entries $\pm 1$, up to ordering.)
      The largest is ${{max(abs(a), abs(b))}}$.
    verify: "max(Matrix([[a, 0], [0, b]]).singular_values())"
    covers: [mit-18-06/lecture-29]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 1
  - id: la-svd-003
    difficulty: 2
    type: numeric
    prompt: |
      The columns of $A = {{A}}$ are orthogonal. What is the **largest** singular value of $A$?
    params:
      k: { int: [1, 3] }
      s1: { int: [-3, 3], not: [0] }
      s2: { int: [-3, 3], not: [0] }
      sw: { choice: [0, 1] }
    let:
      T: "[[3, 4, 5], [4, 3, 5], [5, 12, 13]]"
      c: "T[k, 1]"
      s: "T[k, 2]"
      h: "T[k, 3]"
      P: "sw == 1 ? [[0, 1], [1, 0]] : [[1, 0], [0, 1]]"
      A: "[[c, -s], [s, c]] * diag([s1, s2]) * P"
      sig: "h * max(abs(s1), abs(s2))"
    require: ["abs(s1) != abs(s2)"]
    answer: sig
    hints:
      - 'With orthogonal columns, $A^TA$ is diagonal.'
      - 'The diagonal entries of $A^TA$ are the squared lengths of the columns.'
    solution: |
      Orthogonal columns make $A^TA = {{transpose(A) * A}}$ diagonal, so its eigenvalues are the squared column lengths and the singular values are the
      column lengths themselves: ${{h*abs(s1)}}$ and ${{h*abs(s2)}}$ (for instance $\|{{row: [c*s1, s*s1]}}\| = {{abs(s1)}}\sqrt{ {{c}}^2 + {{s}}^2 } = {{h*abs(s1)}}$).
      The largest is $\sigma_1 = {{sig}}$.
    verify: "max((lambda T: Matrix([[T[0], -T[1]], [T[1], T[0]]]) * diag(s1, s2) * (Matrix([[0, 1], [1, 0]]) if sw == 1 else eye(2)))([[3, 4], [4, 3], [5, 12]][k - 1]).singular_values())"
    covers: [mit-18-06/lecture-29]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 3
  - id: la-svd-004
    difficulty: 2
    type: multipart
    prompt: |
      $A = {{A}}$ has rank 1: $A = \mathbf{u}\mathbf{v}^T$ with $\mathbf{u} = {{row: u}}$ and $\mathbf{v} = {{row: v}}$.
    params:
      i: { int: [1, 4] }
      j: { int: [1, 4] }
      kk: { int: [1, 2] }
      sg: { choice: [1, -1] }
    let:
      U: "[[1, 2, 2], [2, 1, 2], [2, -2, 1], [1, -2, -2]]"
      V: "[[3, 4], [4, -3], [5, 12], [12, -5]]"
      Vn: "[5, 5, 13, 13]"
      u: "sg*kk*squeeze(U[i, :])"
      v: "squeeze(V[j, :])"
      A: "[[u[1]], [u[2]], [u[3]]] * [[v[1], v[2]]]"
      sig: "3*kk*Vn[j]"
    parts:
      - prompt: "(a) What is the only non-zero singular value $\\sigma_1$?"
        type: numeric
        answer: sig
        verify: "max((sg*kk*Matrix([[1, 2, 2], [2, 1, 2], [2, -2, 1], [1, -2, -2]][i - 1]) * Matrix([[[3, 4], [4, -3], [5, 12], [12, -5]][j - 1]])).singular_values())"
      - prompt: "(b) Give the first right singular vector $\\mathbf{v}_1$ (any non-zero multiple is accepted), as a list such as `1, 2`."
        type: vector
        answer: v
        upToScale: true
        verify: "(lambda M: max(M.eigenvects(), key=lambda e: e[0])[2][0])((lambda A: A.T * A)(sg*kk*Matrix([[1, 2, 2], [2, 1, 2], [2, -2, 1], [1, -2, -2]][i - 1]) * Matrix([[[3, 4], [4, -3], [5, 12], [12, -5]][j - 1]])))"
    hints:
      - 'Write $A = \sigma_1\mathbf{u}_1\mathbf{v}_1^T$ with unit vectors $\mathbf{u}_1 = \mathbf{u}/\|\mathbf{u}\|$ and $\mathbf{v}_1 = \mathbf{v}/\|\mathbf{v}\|$.'
      - '$\|\mathbf{u}\| = {{3*kk}}$ and $\|\mathbf{v}\| = {{Vn[j]}}$.'
    solution: |
      (a) $A = \mathbf{u}\mathbf{v}^T = \|\mathbf{u}\|\,\|\mathbf{v}\|\;\dfrac{\mathbf{u}}{\|\mathbf{u}\|}\dfrac{\mathbf{v}^T}{\|\mathbf{v}\|}$ is already an SVD with one term, so
      $\sigma_1 = \|\mathbf{u}\|\,\|\mathbf{v}\| = {{3*kk}} \cdot {{Vn[j]}} = {{sig}}$. All other singular values are $0$ (rank 1).

      (b) $\mathbf{v}_1 = \mathbf{v}/\|\mathbf{v}\| = \tfrac{1}{ {{Vn[j]}} }{{row: v}}$, so any multiple of ${{row: v}}$. Check: $A^TA = \|\mathbf{u}\|^2\mathbf{v}\mathbf{v}^T$ has
      $\mathbf{v}$ as its eigenvector with eigenvalue ${{sig^2}} = \sigma_1^2$.
    covers: [mit-18-06/lecture-29]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 5
  - id: la-svd-005
    difficulty: 3
    type: numeric
    prompt: |
      Find the **largest** singular value of $A = {{A}}$. (Both singular values turn out to be whole or half-whole numbers.)
    params:
      a: { int: [-4, 4] }
      b: { int: [-4, 4] }
      c: { int: [-4, 4] }
      d: { int: [-4, 4] }
    let:
      A: "[[a, b], [c, d]]"
      S: "a^2 + b^2 + c^2 + d^2"
      P: "abs(a*d - b*c)"
      r1: "round(sqrt(S + 2*P))"
      r2: "round(sqrt(S - 2*P))"
    require: ["P > 0", "a*b + c*d != 0", "r1^2 == S + 2*P", "r2^2 == S - 2*P"]
    answer: "(r1 + r2) / 2"
    hints:
      - '$\sigma_1^2 + \sigma_2^2 = \operatorname{tr}(A^TA)$, the sum of the squares of all entries; and $\sigma_1\sigma_2 = |\det A|$.'
      - 'Here $\sigma_1^2 + \sigma_2^2 = {{S}}$ and $\sigma_1\sigma_2 = {{P}}$. Consider $(\sigma_1 + \sigma_2)^2$ and $(\sigma_1 - \sigma_2)^2$.'
    solution: |
      The eigenvalues of $A^TA$ are $\sigma_1^2, \sigma_2^2$, so
      $$\sigma_1^2 + \sigma_2^2 = \operatorname{tr}(A^TA) = {{a}}^2 + ({{b}})^2 + ({{c}})^2 + ({{d}})^2 = {{S}}, \qquad \sigma_1\sigma_2 = \sqrt{\det(A^TA)} = |\det A| = {{P}}.$$
      Then $(\sigma_1 + \sigma_2)^2 = {{S}} + {{2*P}} = {{S + 2*P}}$ and $(\sigma_1 - \sigma_2)^2 = {{S}} - {{2*P}} = {{S - 2*P}}$, so $\sigma_1 + \sigma_2 = {{r1}}$ and
      $\sigma_1 - \sigma_2 = {{r2}}$. Hence
      $$\sigma_1 = \frac{ {{r1}} + {{r2}} }{2} = {{(r1 + r2) / 2}}, \qquad \sigma_2 = {{(r1 - r2) / 2}}.$$
      (Equivalently, $\sigma^2$ solves $\lambda^2 - {{S}}\lambda + {{P^2}} = 0$, the characteristic equation of $A^TA = {{transpose(A) * A}}$.)
    verify: "max(Matrix([[a, b], [c, d]]).singular_values())"
    covers: [mit-18-06/lecture-29]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 7
  - id: la-svd-006
    difficulty: 4
    type: vector
    prompt: |
      The system $A\mathbf{x} = \mathbf{b}$ with $A = {{A}}$ and $\mathbf{b} = {{b}}$ has infinitely many solutions. Find the one of **minimum length**,
      $\mathbf{x}^+ = A^+\mathbf{b}$. Enter it as a list such as `1, 2, 3`.
    params:
      a11: { int: [-2, 2] }
      a12: { int: [-2, 2] }
      a13: { int: [-2, 2] }
      a21: { int: [-2, 2] }
      a22: { int: [-2, 2] }
      a23: { int: [-2, 2] }
      y1: { int: [-2, 2] }
      y2: { int: [-2, 2] }
    let:
      A: "[[a11, a12, a13], [a21, a22, a23]]"
      AAT: "A * transpose(A)"
      b: "AAT * [y1, y2]"
      xp: "transpose(A) * [y1, y2]"
    require: ["det(AAT) != 0", "y1 != 0 or y2 != 0"]
    answer: xp
    hints:
      - 'The shortest solution has no component in $N(A)$, so it lies in the row space: $\mathbf{x}^+ = A^T\mathbf{y}$ for some $\mathbf{y}$.'
      - 'Substitute: $AA^T\mathbf{y} = \mathbf{b}$, with $AA^T = {{AAT}}$.'
    solution: |
      Every solution is $\mathbf{x}^+ + \mathbf{n}$ with $\mathbf{n} \in N(A)$ and $\mathbf{x}^+$ in the row space; these pieces are orthogonal, so the shortest
      solution is the one in the row space. (That is what the pseudoinverse $A^+ = V\Sigma^+U^T$ produces.)

      Write $\mathbf{x}^+ = A^T\mathbf{y}$. Then $AA^T\mathbf{y} = \mathbf{b}$:
      $${{AAT}}\mathbf{y} = {{b}} \quad\Rightarrow\quad \mathbf{y} = {{[y1, y2]}}.$$
      So $\mathbf{x}^+ = A^T\mathbf{y} = {{xp}}$. Check: $A\mathbf{x}^+ = {{A * xp}} = \mathbf{b}$.
    verify: "Matrix([[a11, a12, a13], [a21, a22, a23]]).pinv() * (Matrix([[a11, a12, a13], [a21, a22, a23]]) * Matrix([[a11, a12, a13], [a21, a22, a23]]).T * Matrix([y1, y2]))"
    covers: [mit-18-06/lecture-33]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 8
  - id: la-svd-007
    difficulty: 3
    type: multipart
    prompt: |
      The two columns of $A = {{A}}$ are orthogonal.
    params:
      k: { int: [1, 4] }
      s1: { int: [-3, 3], not: [0] }
      s2: { int: [-3, 3], not: [0] }
    let:
      U: "[[1, 2, 2], [1, 2, 2], [2, 1, 2], [2, 2, 1]]"
      W: "[[2, 1, -2], [2, -2, 1], [1, 2, -2], [1, -2, 2]]"
      u: "squeeze(U[k, :])"
      w: "squeeze(W[k, :])"
      A: "transpose([s1*u, s2*w])"
      big: "3*max(abs(s1), abs(s2))"
      small: "3*min(abs(s1), abs(s2))"
    require: ["abs(s1) != abs(s2)"]
    parts:
      - prompt: "(a) What is $\\sigma_1$, the largest singular value?"
        type: numeric
        answer: big
        verify: "max((lambda u, w: Matrix.hstack(s1*u, s2*w))(Matrix([[1, 2, 2], [1, 2, 2], [2, 1, 2], [2, 2, 1]][k - 1]), Matrix([[2, 1, -2], [2, -2, 1], [1, 2, -2], [1, -2, 2]][k - 1])).singular_values())"
      - prompt: "(b) What is $\\sigma_2$?"
        type: numeric
        answer: small
        verify: "min((lambda u, w: Matrix.hstack(s1*u, s2*w))(Matrix([[1, 2, 2], [1, 2, 2], [2, 1, 2], [2, 2, 1]][k - 1]), Matrix([[2, 1, -2], [2, -2, 1], [1, 2, -2], [1, -2, 2]][k - 1])).singular_values())"
      - prompt: "(c) Using your answers, what is the condition number $\\sigma_1/\\sigma_2$?"
        type: numeric
        answer: "part1 / part2"
        verify: "(lambda sv: max(sv) / min(sv))((lambda u, w: Matrix.hstack(s1*u, s2*w))(Matrix([[1, 2, 2], [1, 2, 2], [2, 1, 2], [2, 2, 1]][k - 1]), Matrix([[2, 1, -2], [2, -2, 1], [1, 2, -2], [1, -2, 2]][k - 1])).singular_values())"
    hints:
      - '$A^TA$ is diagonal because the columns are orthogonal.'
      - 'Its diagonal holds the squared column lengths.'
    solution: |
      $A^TA = {{transpose(A) * A}}$ is diagonal, so the singular values are the column lengths:
      $\|{{row: s1*u}}\| = {{3*abs(s1)}}$ and $\|{{row: s2*w}}\| = {{3*abs(s2)}}$.

      (a) $\sigma_1 = {{big}}$. (b) $\sigma_2 = {{small}}$. (c) $\sigma_1/\sigma_2 = {{big / small}}$.

      In $A = U\Sigma V^T$, $V$ is $I$ or a swap, and the columns of $U$ are the normalised columns of $A$. The best rank-one approximation
      $\sigma_1\mathbf{u}_1\mathbf{v}_1^T$ keeps the longer column and is off by $\sigma_2$ in the 2-norm.
    covers: [mit-18-06/lecture-29]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 6
  - id: la-svd-008
    difficulty: 2
    type: mc
    prompt: |
      In the SVD $A = U\Sigma V^T$ of an $m \times n$ matrix, the columns of $U$ are:
    options:
      - "orthonormal eigenvectors of $AA^T$"
      - "orthonormal eigenvectors of $A^TA$"
      - "eigenvectors of $A$"
      - "the normalised columns of $A$"
    answer: 0
    hints:
      - 'Compute $AA^T$ from the SVD.'
    solution: |
      $AA^T = U\Sigma V^TV\Sigma^TU^T = U(\Sigma\Sigma^T)U^T$, so the columns of $U$ ($m$ of them) are orthonormal eigenvectors of the $m \times m$ matrix $AA^T$.
      The columns of $V$ are eigenvectors of $A^TA$. They are linked by $A\mathbf{v}_i = \sigma_i\mathbf{u}_i$. Eigenvectors of $A$ itself need not be orthogonal, and
      the columns of $A$ are only the $\mathbf{u}_i$ (scaled) in special cases such as orthogonal columns.
    verify: "0"
    covers: [mit-18-06/lecture-29]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 2
  - id: la-svd-009
    difficulty: 4
    type: proof
    prompt: |
      Let $\sigma_1$ be the largest singular value of $A$. Prove that $\|A\mathbf{x}\| \le \sigma_1\|\mathbf{x}\|$ for every vector $\mathbf{x}$, with equality when $\mathbf{x} = \mathbf{v}_1$.
    hints:
      - 'Write $\mathbf{x}$ in the orthonormal basis $\mathbf{v}_1, \dots, \mathbf{v}_n$ of right singular vectors.'
      - 'Use $A\mathbf{v}_i = \sigma_i\mathbf{u}_i$ (with $\sigma_i = 0$ beyond the rank) and orthonormality of the $\mathbf{u}_i$.'
    solution: |
      Expand $\mathbf{x} = \sum_i c_i\mathbf{v}_i$; orthonormality gives $\|\mathbf{x}\|^2 = \sum_i c_i^2$. Since $A\mathbf{v}_i = \sigma_i\mathbf{u}_i$ (with $\sigma_i = 0$ for $i > r$),
      $$A\mathbf{x} = \sum_i c_i\sigma_i\mathbf{u}_i, \qquad \|A\mathbf{x}\|^2 = \sum_i c_i^2\sigma_i^2 \le \sigma_1^2\sum_i c_i^2 = \sigma_1^2\|\mathbf{x}\|^2,$$
      using that the $\mathbf{u}_i$ are orthonormal and $\sigma_i \le \sigma_1$. Taking square roots, $\|A\mathbf{x}\| \le \sigma_1\|\mathbf{x}\|$.

      For $\mathbf{x} = \mathbf{v}_1$: $\|A\mathbf{v}_1\| = \|\sigma_1\mathbf{u}_1\| = \sigma_1 = \sigma_1\|\mathbf{v}_1\|$. So $\sigma_1 = \max_{\mathbf{x} \ne 0}\|A\mathbf{x}\|/\|\mathbf{x}\|$, the 2-norm of $A$.
    covers: [mit-18-06/lecture-29]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 8
  - id: la-svd-010
    difficulty: 5
    type: proof
    prompt: |
      Let $A = U\Sigma V^T$ be an SVD of the $m \times n$ matrix $A$ of rank $r$, and define the pseudoinverse $A^+ = V\Sigma^+U^T$, where $\Sigma^+$ is $n \times m$ with
      $1/\sigma_1, \dots, 1/\sigma_r$ on its diagonal and zeros elsewhere. Prove that $AA^+A = A$ and that $AA^+$ is the orthogonal projection onto $C(A)$.
    hints:
      - 'Compute $\Sigma\Sigma^+$: it is $m \times m$ and diagonal.'
      - 'A symmetric matrix $P$ with $P^2 = P$ is the projection onto its column space.'
      - '$AA^+ = U(\Sigma\Sigma^+)U^T = \sum_{i \le r}\mathbf{u}_i\mathbf{u}_i^T$.'
    solution: |
      $\Sigma\Sigma^+$ is the $m \times m$ diagonal matrix $D$ with $r$ ones followed by zeros, and $D\Sigma = \Sigma$ (the zeros of $D$ meet the zero rows of $\Sigma$).

      **$AA^+A = A$.** $AA^+A = U\Sigma V^TV\Sigma^+U^TU\Sigma V^T = U(\Sigma\Sigma^+\Sigma)V^T = U(D\Sigma)V^T = U\Sigma V^T = A$.

      **$AA^+$ is the projection onto $C(A)$.** $P := AA^+ = UDU^T = \sum_{i=1}^r\mathbf{u}_i\mathbf{u}_i^T$. It is symmetric, and
      $P^2 = UDU^TUDU^T = UD^2U^T = P$. Its column space is spanned by $\mathbf{u}_1, \dots, \mathbf{u}_r$, which is $C(A)$ because $A\mathbf{v}_i = \sigma_i\mathbf{u}_i$ with
      $\sigma_i \ne 0$ for $i \le r$ and $\operatorname{rank}A = r$. A symmetric idempotent matrix is the orthogonal projection onto its column space
      ($P\mathbf{b} \in C(P)$ and $\mathbf{b} - P\mathbf{b} \perp C(P)$ since $P^T(\mathbf{b} - P\mathbf{b}) = P\mathbf{b} - P^2\mathbf{b} = \mathbf{0}$).
    covers: [mit-18-06/lecture-33]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 12
  - id: la-svd-011
    difficulty: 3
    type: numeric
    prompt: |
      What is the **product** $\sigma_1\sigma_2\sigma_3$ of the singular values of $A = {{A}}$?
    params:
      a11: { int: [-3, 3] }
      a12: { int: [-3, 3] }
      a13: { int: [-3, 3] }
      a21: { int: [-3, 3] }
      a22: { int: [-3, 3] }
      a23: { int: [-3, 3] }
      a31: { int: [-3, 3] }
      a32: { int: [-3, 3] }
      a33: { int: [-3, 3] }
    let:
      A: "[[a11, a12, a13], [a21, a22, a23], [a31, a32, a33]]"
      D: "round(det(A))"
    require: ["D != 0"]
    answer: "abs(D)"
    hints:
      - 'Take determinants in $A = U\Sigma V^T$.'
      - '$\det U$ and $\det V$ are $\pm 1$.'
    solution: |
      $\det A = \det U\,\det\Sigma\,\det V^T$, and orthogonal matrices have determinant $\pm 1$, so
      $$\sigma_1\sigma_2\sigma_3 = \det\Sigma = |\det A|.$$
      Cofactor expansion gives $\det A = {{D}}$, so the product is ${{abs(D)}}$, with no need to find the singular values themselves.
    verify: "float(np.prod(np.linalg.svd(np.array([[a11, a12, a13], [a21, a22, a23], [a31, a32, a33]], dtype=float), compute_uv=False)))"
    covers: [mit-18-06/lecture-29]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 4
