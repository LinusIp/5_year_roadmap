subject: linear-algebra
topic: solving-ax-b-rank
questions:
  - id: la-axb-001
    difficulty: 1
    type: mc
    prompt: |
      When does $A\mathbf{x} = \mathbf{b}$ have at least one solution?
    options:
      - "Exactly when $\\mathbf{b}$ is in the column space $C(A)$"
      - "Exactly when $\\mathbf{b}$ is in the null space $N(A)$"
      - "Exactly when $A$ is square"
      - "Exactly when $\\mathbf{b} \\ne \\mathbf{0}$"
    answer: 0
    hints:
      - '$A\mathbf{x}$ is a combination of the columns of $A$ with weights $x_1, \dots, x_n$.'
    solution: |
      $A\mathbf{x} = x_1(\text{column } 1) + \dots + x_n(\text{column } n)$, so $A\mathbf{x} = \mathbf{b}$ is solvable exactly when $\mathbf{b}$ is some combination of the columns:
      $\mathbf{b} \in C(A)$. Rectangular systems can be solvable, and $\mathbf{b} = \mathbf{0}$ is always solvable (by $\mathbf{x} = \mathbf{0}$).
    verify: "0 if Matrix([[1, 2], [2, 4]]).gauss_jordan_solve(Matrix([3, 6]))[0] is not None else 1"
    covers: [mit-18-06/lecture-8]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 1

  - id: la-axb-002
    difficulty: 2
    type: numeric
    prompt: |
      What is the rank of
      $$ A = {{A}}? $$
    params:
      r: { int: [1, 3] }
      p1: { choice: [1, -1, 2] }
      l21: { int: [-2, 2] }
      l31: { int: [-2, 2] }
      l32: { int: [-2, 2] }
      a: { int: [-3, 3] }
      b: { int: [-3, 3] }
      c: { int: [-3, 3] }
    let:
      E: "[[p1, 0, 0], [l21*p1, 1, 0], [l31*p1, l32, 1]]"
      Rf: "[[1, a, b, 0], [0, 0, 1, c], [0, 0, 0, 1]]"
      R: "diag([1, r >= 2 ? 1 : 0, r >= 3 ? 1 : 0]) * Rf"
      A: "E*R"
    answer: r
    hints:
      - 'The rank is the number of pivots that elimination produces.'
      - 'The multipliers in column 1 are ${{l21}}$ and ${{l31}}$.'
    solution: |
      Subtract ${{l21}}$ and ${{l31}}$ times row 1 from rows 2 and 3, then ${{l32}}$ times the new row 2 from row 3. The echelon form is
      $$ U = {{diag([p1, 1, 1]) * R}}, $$
      which has ${{r}}$ non-zero row{{r == 1 ? "" : "s"}}, so the rank is $r = {{r}}$.
    verify: "(Matrix([[p1, 0, 0], [l21*p1, 1, 0], [l31*p1, l32, 1]])*diag(1, 1 if r >= 2 else 0, 1 if r >= 3 else 0)*Matrix([[1, a, b, 0], [0, 0, 1, c], [0, 0, 0, 1]])).rank()"
    covers: [mit-18-06/lecture-8]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 4

  - id: la-axb-003
    difficulty: 3
    type: vector
    prompt: |
      Let
      $$ A = {{A}}, \qquad \mathbf{b} = {{b}}. $$
      Find the **particular solution** $\mathbf{x}_p$ of $A\mathbf{x} = \mathbf{b}$ with every free variable set to $0$.

      Enter it as a list `x1, x2, x3, x4`.
    params:
      l21: { int: [-2, 2] }
      l31: { int: [-2, 2] }
      l32: { int: [-2, 2], not: [0] }
      a: { int: [-3, 3] }
      b0: { int: [-3, 3] }
      c: { int: [-3, 3] }
      p1: { int: [-4, 4] }
      p3: { int: [-4, 4] }
    let:
      E: "[[1, 0, 0], [l21, 1, 0], [l31, l32, 1]]"
      R: "[[1, a, 0, b0], [0, 0, 1, c], [0, 0, 0, 0]]"
      A: "E*R"
      xp: "[p1, 0, p3, 0]"
      b: "A*xp"
    answer: xp
    hints:
      - 'Reduce the augmented matrix $[A \mid \mathbf{b}]$ to $[R \mid \mathbf{d}]$.'
      - '$R = {{R}}$ with pivot columns 1 and 3; the right side becomes $\mathbf{d} = {{R*xp}}$. Set $x_2 = x_4 = 0$.'
    solution: |
      Elimination (multipliers ${{l21}}$, ${{l31}}$, then ${{l32}}$) takes $[A \mid \mathbf{b}]$ to
      $$ [R \mid \mathbf{d}] = \left[\begin{array}{cccc|c} 1 & {{a}} & 0 & {{b0}} & {{p1}} \\ 0 & 0 & 1 & {{c}} & {{p3}} \\ 0 & 0 & 0 & 0 & 0 \end{array}\right]. $$
      The last row reads $0 = 0$, so the system is solvable. The free variables are $x_2$ and $x_4$; setting them to $0$ leaves
      $x_1 = {{p1}}$ and $x_3 = {{p3}}$:
      $$ \mathbf{x}_p = {{row: xp}}. $$
      Check: $A\mathbf{x}_p = {{row: A*xp}} = \mathbf{b}$.
    verify: "(lambda M: (lambda s: list(s[0].subs({v: 0 for v in s[1]})))(M.gauss_jordan_solve(M*Matrix([p1, 0, p3, 0]))))(Matrix([[1, 0, 0], [l21, 1, 0], [l31, l32, 1]])*Matrix([[1, a, 0, b0], [0, 0, 1, c], [0, 0, 0, 0]]))"
    covers: [mit-18-06/lecture-8]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 6

  - id: la-axb-004
    difficulty: 3
    type: numeric
    prompt: |
      Let
      $$ A = {{A}}. $$
      For which $k$ does $A\mathbf{x} = \mathbf{b}$ have a solution when $\mathbf{b} = ({{b1}}, {{b2}}, k)$?
    params:
      l21: { int: [-2, 2] }
      l31: { int: [-2, 2] }
      l32: { int: [-2, 2], not: [0] }
      a: { int: [-3, 3] }
      b1: { int: [-4, 4] }
      b2: { int: [-4, 4] }
    let:
      E: "[[1, 0, 0], [l21, 1, 0], [l31, l32, 1]]"
      A: "E*[[1, a, 0], [0, 0, 1], [0, 0, 0]]"
      kk: "l31*b1 + l32*(b2 - l21*b1)"
    answer: kk
    hints:
      - 'Eliminate on $[A \mid \mathbf{b}]$. Row 3 of $A$ becomes zero, so the system is solvable only if the right side of row 3 becomes zero too.'
      - 'Multipliers: $\ell_{21} = {{l21}}$, $\ell_{31} = {{l31}}$, then $\ell_{32} = {{l32}}$.'
    solution: |
      Apply the same row operations to $\mathbf{b} = ({{b1}}, {{b2}}, k)$:
      - row 2: ${{b2}} - ({{l21}})({{b1}}) = {{b2 - l21*b1}}$;
      - row 3: $k - ({{l31}})({{b1}}) = k {{signed: -l31*b1}}$, then minus $({{l32}})({{b2 - l21*b1}})$: $\ k {{signed: -kk}}$.

      Row 3 of $A$ is now all zeros, so we need $k {{signed: -kk}} = 0$, i.e. $k = {{kk}}$. For any other $k$, $\mathbf{b}$ is not in $C(A)$.
    verify: "(lambda M: solve(Matrix.hstack(M[:, 0], M[:, 2], Matrix([b1, b2, Symbol('k')])).det(), Symbol('k'))[0])(Matrix([[1, 0, 0], [l21, 1, 0], [l31, l32, 1]])*Matrix([[1, a, 0], [0, 0, 1], [0, 0, 0]]))"
    covers: [mit-18-06/lecture-8]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 5

  - id: la-axb-005
    difficulty: 2
    type: mc
    prompt: |
      $A$ is a $3 \times 5$ matrix of rank 3. How many solutions does $A\mathbf{x} = \mathbf{b}$ have?
    options:
      - "Infinitely many, for every $\\mathbf{b}$"
      - "Exactly one, for every $\\mathbf{b}$"
      - "Infinitely many for some $\\mathbf{b}$, none for others"
      - "Exactly one for some $\\mathbf{b}$, none for others"
    answer: 0
    hints:
      - '$r = m$: is every row a pivot row? Then is every $\mathbf{b}$ reachable?'
      - '$n - r$ free variables: how many is that here?'
    solution: |
      Full row rank, $r = m = 3$: every row has a pivot, so $R$ has no zero rows and $C(A) = \mathbb{R}^3$: a solution exists for every $\mathbf{b}$.
      There are $n - r = 5 - 3 = 2$ free variables, so $N(A)$ is two-dimensional and each solvable system has infinitely many solutions
      $\mathbf{x} = \mathbf{x}_p + \mathbf{x}_n$.
    verify: "0 if (lambda M: M.rank() == M.rows and M.cols - M.rank() > 0)(Matrix([[1, 0, 0, 2, 1], [0, 1, 0, 1, 1], [0, 0, 1, 3, 1]])) else 1"
    covers: [mit-18-06/lecture-8]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 2

  - id: la-axb-006
    difficulty: 1
    type: numeric
    prompt: |
      $A$ is a ${{m}} \times {{n}}$ matrix of rank ${{r}}$. How many free variables does $A\mathbf{x} = \mathbf{0}$ have?
    params:
      m: { int: [2, 5] }
      n: { int: [3, 7] }
      r: { int: [1, 5] }
    require: ["r <= m", "r <= n"]
    answer: "n - r"
    hints:
      - 'Each of the ${{n}}$ columns is either a pivot column or a free column.'
    solution: |
      There are ${{r}}$ pivot columns among the ${{n}}$ columns, so ${{n}} - {{r}} = {{n - r}}$ free variables
      (and $N(A)$ has dimension ${{n - r}}$). The number of rows, ${{m}}$, does not enter.
    verify: "len(Matrix.hstack(eye(m)[:, :r], zeros(m, n - r)).nullspace())"
    covers: [mit-18-06/lecture-8]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 1

  - id: la-axb-007
    difficulty: 4
    type: multipart
    prompt: |
      Find the complete solution $\mathbf{x} = \mathbf{x}_p + c_1\mathbf{s}_1 + c_2\mathbf{s}_2$ of $A\mathbf{x} = \mathbf{b}$, where
      $$ A = {{A}}, \qquad \mathbf{b} = {{b}}. $$
      Enter each vector as a list `x1, x2, x3, x4`.
    params:
      l21: { int: [-2, 2] }
      l31: { int: [-2, 2] }
      l32: { int: [-2, 2], not: [0] }
      a: { int: [-3, 3] }
      b0: { int: [-3, 3] }
      c: { int: [-3, 3] }
      d: { int: [-3, 3] }
      p1: { int: [-4, 4] }
      p2: { int: [-4, 4] }
    let:
      E: "[[1, 0, 0], [l21, 1, 0], [l31, l32, 1]]"
      R: "[[1, 0, a, b0], [0, 1, c, d], [0, 0, 0, 0]]"
      A: "E*R"
      xp: "[p1, p2, 0, 0]"
      b: "A*xp"
    parts:
      - prompt: "(a) The particular solution $\\mathbf{x}_p$ with both free variables $0$."
        type: vector
        answer: xp
        verify: "(lambda M: (lambda s: list(s[0].subs({v: 0 for v in s[1]})))(M.gauss_jordan_solve(M*Matrix([p1, p2, 0, 0]))))(Matrix([[1, 0, 0], [l21, 1, 0], [l31, l32, 1]])*Matrix([[1, 0, a, b0], [0, 1, c, d], [0, 0, 0, 0]]))"
      - prompt: "(b) The special solution $\\mathbf{s}_1$ with $x_3 = 1$, $x_4 = 0$."
        type: vector
        answer: "[-a, -c, 1, 0]"
        verify: "list((Matrix([[1, 0, 0], [l21, 1, 0], [l31, l32, 1]])*Matrix([[1, 0, a, b0], [0, 1, c, d], [0, 0, 0, 0]])).nullspace()[0])"
      - prompt: "(c) The special solution $\\mathbf{s}_2$ with $x_3 = 0$, $x_4 = 1$."
        type: vector
        answer: "[-b0, -d, 0, 1]"
        verify: "list((Matrix([[1, 0, 0], [l21, 1, 0], [l31, l32, 1]])*Matrix([[1, 0, a, b0], [0, 1, c, d], [0, 0, 0, 0]])).nullspace()[1])"
    hints:
      - 'Reduce $[A \mid \mathbf{b}]$ to $[R \mid \mathbf{d}]$. The pivot columns are 1 and 2.'
      - '$R = {{R}}$ and $\mathbf{d} = {{R*xp}}$.'
      - '$\mathbf{x}_p$ solves $R\mathbf{x} = \mathbf{d}$ with $x_3 = x_4 = 0$; each $\mathbf{s}_i$ solves $R\mathbf{x} = \mathbf{0}$ with one free variable $1$.'
    solution: |
      Elimination (multipliers ${{l21}}$, ${{l31}}$, ${{l32}}$) gives
      $$ [R \mid \mathbf{d}] = \left[\begin{array}{cccc|c} 1 & 0 & {{a}} & {{b0}} & {{p1}} \\ 0 & 1 & {{c}} & {{d}} & {{p2}} \\ 0 & 0 & 0 & 0 & 0 \end{array}\right]. $$
      (a) With $x_3 = x_4 = 0$: $x_1 = {{p1}}$, $x_2 = {{p2}}$, so $\mathbf{x}_p = {{row: xp}}$.

      (b) $R\mathbf{x} = \mathbf{0}$ with $x_3 = 1, x_4 = 0$: $x_1 = {{-a}}$, $x_2 = {{-c}}$, so $\mathbf{s}_1 = {{row: [-a, -c, 1, 0]}}$.

      (c) With $x_3 = 0, x_4 = 1$: $x_1 = {{-b0}}$, $x_2 = {{-d}}$, so $\mathbf{s}_2 = {{row: [-b0, -d, 0, 1]}}$.

      The complete solution is $\mathbf{x} = \mathbf{x}_p + c_1\mathbf{s}_1 + c_2\mathbf{s}_2$: a plane in $\mathbb{R}^4$ through $\mathbf{x}_p$, parallel to $N(A)$.
    covers: [mit-18-06/lecture-8]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 8

  - id: la-axb-008
    difficulty: 4
    type: multipart
    prompt: |
      Let
      $$ A = \begin{bmatrix} 1 & {{a}} & {{c}} \\ 1 & {{a + 1}} & {{c + d}} \\ 2 & {{2*a + 1}} & k \end{bmatrix}. $$
    params:
      a: { int: [-3, 3] }
      c: { int: [-3, 3] }
      d: { int: [-3, 3] }
      b1: { int: [-5, 5] }
      b2: { int: [-5, 5] }
    parts:
      - prompt: "(a) For which $k$ is $A$ singular (rank 2)?"
        type: numeric
        answer: "2*c + d"
        verify: "solve(Matrix([[1, a, c], [1, a + 1, c + d], [2, 2*a + 1, Symbol('k')]]).det(), Symbol('k'))[0]"
      - prompt: "(b) With $k$ equal to your answer to (a), for which $m$ does $A\\mathbf{x} = ({{b1}}, {{b2}}, m)$ have a solution?"
        type: numeric
        answer: "b1 + b2"
        verify: "solve(Matrix([[1, a, b1], [1, a + 1, b2], [2, 2*a + 1, Symbol('m')]]).det(), Symbol('m'))[0]"
    hints:
      - 'Eliminate: row 2 $-$ row 1 and row 3 $- 2\,$row 1, then compare the new rows 2 and 3.'
      - 'Do the same operations on the right side $({{b1}}, {{b2}}, m)$ for part (b).'
    solution: |
      Row 2 $-$ row 1 $= (0, 1, {{d}})$ and row 3 $- 2\,$row 1 $= (0, 1, k {{signed: -2*c}})$. Subtracting the new row 2 from the new row 3 leaves
      $$ (0,\ 0,\ k {{signed: -2*c}} {{signed: -d}}). $$
      (a) The third pivot vanishes, and $A$ has rank 2, when $k = {{2*c + d}}$.

      (b) The same operations on the right side give ${{b2}} - ({{b1}}) = {{b2 - b1}}$ in row 2 and
      $m - 2({{b1}}) - ({{b2 - b1}}) = m {{signed: -(b1 + b2)}}$ in row 3. With row 3 of $A$ now zero, we need $m = {{b1 + b2}}$.
      (The right side must satisfy the same dependency as the rows: row 3 $=$ row 1 $+$ row 2.)
    covers: [mit-18-06/lecture-8]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 7

  - id: la-axb-009
    difficulty: 3
    type: proof
    prompt: |
      Let $\mathbf{x}_p$ be one solution of $A\mathbf{x} = \mathbf{b}$. Prove that
      (i) $\mathbf{x}_p + \mathbf{x}_n$ is also a solution for every $\mathbf{x}_n \in N(A)$, and
      (ii) every solution of $A\mathbf{x} = \mathbf{b}$ has this form.
    hints:
      - 'For (i), multiply out $A(\mathbf{x}_p + \mathbf{x}_n)$.'
      - 'For (ii), if $A\mathbf{x} = \mathbf{b}$, look at $\mathbf{x} - \mathbf{x}_p$.'
    solution: |
      (i) $A(\mathbf{x}_p + \mathbf{x}_n) = A\mathbf{x}_p + A\mathbf{x}_n = \mathbf{b} + \mathbf{0} = \mathbf{b}$.

      (ii) If $A\mathbf{x} = \mathbf{b}$, put $\mathbf{x}_n = \mathbf{x} - \mathbf{x}_p$. Then $A\mathbf{x}_n = A\mathbf{x} - A\mathbf{x}_p = \mathbf{b} - \mathbf{b} = \mathbf{0}$,
      so $\mathbf{x}_n \in N(A)$ and $\mathbf{x} = \mathbf{x}_p + \mathbf{x}_n$.

      So the solution set is the null space shifted by $\mathbf{x}_p$. It is not a subspace unless $\mathbf{b} = \mathbf{0}$.
    covers: [mit-18-06/lecture-8]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 4

  - id: la-axb-010
    difficulty: 4
    type: multipart
    prompt: |
      $A$ is a $3 \times n$ matrix, and the complete solution of $A\mathbf{x} = \mathbf{b}$ is
      $$ \mathbf{x} = \begin{bmatrix} 1 \\ 0 \\ 2 \\ 0 \end{bmatrix} + c_1\begin{bmatrix} -3 \\ 1 \\ 0 \\ 0 \end{bmatrix} + c_2\begin{bmatrix} 4 \\ 0 \\ -1 \\ 1 \end{bmatrix}. $$
    parts:
      - prompt: "(a) What is $n$?"
        type: numeric
        answer: 4
        verify: "len(Matrix([1, 0, 2, 0]))"
      - prompt: "(b) What is the rank of $A$?"
        type: numeric
        answer: 2
        verify: "4 - Matrix.hstack(Matrix([-3, 1, 0, 0]), Matrix([4, 0, -1, 1])).rank()"
      - prompt: "(c) Is $A\\mathbf{x} = \\mathbf{b}'$ solvable for **every** $\\mathbf{b}'$ in $\\mathbb{R}^3$?"
        type: mc
        options:
          - "No: the rank is less than 3, so $C(A)$ is not all of $\\mathbb{R}^3$"
          - "Yes: the system has infinitely many solutions, so it is always solvable"
          - "Yes: $A$ has more columns than rows"
        answer: 0
        verify: "0 if 4 - Matrix.hstack(Matrix([-3, 1, 0, 0]), Matrix([4, 0, -1, 1])).rank() < 3 else 1"
    hints:
      - 'The vectors $\mathbf{x}$ have as many components as $A$ has columns.'
      - 'The two vectors multiplying $c_1, c_2$ span $N(A)$, and $\dim N(A) = n - r$.'
    solution: |
      (a) $\mathbf{x}$ has 4 components, so $n = 4$.

      (b) The special solutions $(-3, 1, 0, 0)$ and $(4, 0, -1, 1)$ are independent and span $N(A)$, so $\dim N(A) = 2 = n - r$ and $r = 4 - 2 = 2$.

      (c) $C(A)$ has dimension $r = 2 < 3 = m$: it is a plane in $\mathbb{R}^3$, so some right sides are not reachable. This particular $\mathbf{b}$ happens to lie in it, but not every $\mathbf{b}'$ does.
    covers: [mit-18-06/lecture-8]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 4

  - id: la-axb-011
    difficulty: 5
    type: proof
    prompt: |
      Prove that $\operatorname{rank}(AB) \le \operatorname{rank}(A)$ and $\operatorname{rank}(AB) \le \operatorname{rank}(B)$ whenever the product $AB$ is defined.
    hints:
      - 'Each column of $AB$ is $A$ times a column of $B$. Where does it live?'
      - 'For the second inequality, compare null spaces: if $B\mathbf{x} = \mathbf{0}$, what is $AB\mathbf{x}$? Then use rank $= n -$ (dimension of the null space).'
    solution: |
      **$\operatorname{rank}(AB) \le \operatorname{rank}(A)$.** Column $j$ of $AB$ is $A\mathbf{b}_j$, a combination of the columns of $A$. So $C(AB) \subseteq C(A)$,
      and a subspace has dimension at most that of a space containing it: $\dim C(AB) \le \dim C(A)$.

      **$\operatorname{rank}(AB) \le \operatorname{rank}(B)$.** Let $B$ be $n \times p$. If $B\mathbf{x} = \mathbf{0}$ then $AB\mathbf{x} = \mathbf{0}$, so $N(B) \subseteq N(AB)$ and
      $\dim N(B) \le \dim N(AB)$. Both matrices have $p$ columns, so
      $$ \operatorname{rank}(AB) = p - \dim N(AB) \le p - \dim N(B) = \operatorname{rank}(B). $$
    covers: [mit-18-06/lecture-8]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 8
