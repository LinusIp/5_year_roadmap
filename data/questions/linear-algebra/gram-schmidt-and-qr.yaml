subject: linear-algebra
topic: gram-schmidt-and-qr
questions:
  - id: la-gs-001
    difficulty: 1
    type: mc
    prompt: |
      $Q$ is a $5 \times 3$ matrix with **orthonormal columns**. Which statement is always true?
    options:
      - "$Q^TQ = I$ (the $3 \\times 3$ identity)"
      - "$QQ^T = I$ (the $5 \\times 5$ identity)"
      - "$Q$ is symmetric"
      - "$Q^{-1} = Q^T$"
    answer: 0
    hints:
      - 'Entry $(i, j)$ of $Q^TQ$ is $\mathbf{q}_i^T\mathbf{q}_j$.'
    solution: |
      Entry $(i, j)$ of $Q^TQ$ is $\mathbf{q}_i \cdot \mathbf{q}_j$, which is $1$ when $i = j$ and $0$ otherwise, so $Q^TQ = I_3$.

      $QQ^T$ is $5 \times 5$ with rank $3$, so it cannot be $I_5$: it is the projection onto the column space. A non-square $Q$ has no inverse
      and cannot be symmetric. Only a **square** $Q$ with orthonormal columns (an orthogonal matrix) has $Q^{-1} = Q^T$.
    verify: "0"
    covers: [mit-18-06/lecture-17]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 2
  - id: la-gs-002
    difficulty: 1
    type: matrix
    prompt: |
      $Q = \dfrac{1}{ {{h}} }{{M}}$ is an orthogonal matrix. What is $Q^{-1}$? Enter it with decimals to 3 places, as `[[0.1, 0.2], [0.3, 0.4]]`.
    params:
      k: { int: [1, 4] }
      sg: { choice: [1, -1] }
    let:
      T: "[[3, 4, 5], [5, 12, 13], [8, 15, 17], [7, 24, 25]]"
      c: "T[k, 1]"
      s: "T[k, 2]"
      h: "T[k, 3]"
      M: "[[c, -sg*s], [s, sg*c]]"
      Qinv: "transpose(M) / h"
    answer: Qinv
    tolerance: { abs: 0.002 }
    hints:
      - 'For an orthogonal matrix, $Q^TQ = I$.'
      - 'So $Q^{-1} = Q^T$: transpose, nothing to compute.'
    solution: |
      The columns of $Q$ are orthonormal: each has length $\sqrt{ {{c}}^2 + {{s}}^2 }/{{h}} = 1$ and their dot product is $0$. So $Q^TQ = I$ and $Q^{-1} = Q^T$:
      $$Q^{-1} = \frac{1}{ {{h}} }{{transpose(M)}} \approx {{Qinv}}.$$
    verify: "(lambda T: (Matrix([[T[0], -sg*T[1]], [T[1], sg*T[0]]]) / T[2]).inv())([[3, 4, 5], [5, 12, 13], [8, 15, 17], [7, 24, 25]][k - 1])"
    covers: [mit-18-06/lecture-17]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 2
  - id: la-gs-003
    difficulty: 2
    type: vector
    prompt: |
      Apply Gram–Schmidt to $\mathbf{a} = {{a}}$ and $\mathbf{b} = {{b}}$ (in that order). Give the second orthogonal vector $\mathbf{B}$ before normalising;
      any non-zero multiple is accepted. Enter it as a list such as `1, 2, 3`.
    params:
      a1: { int: [1, 3] }
      a2: { int: [-2, 2] }
      a3: { int: [-2, 2] }
      m: { int: [-2, 2], not: [0] }
      s: { int: [-2, 2] }
      w: { int: [-2, 2] }
    let:
      a: "[a1, a2, a3]"
      B: "s*[a2, -a1, 0] + w*[a3, 0, -a1]"
      b: "m*a + B"
    require: ["s != 0 or w != 0"]
    answer: B
    upToScale: true
    hints:
      - 'Subtract from $\mathbf{b}$ its projection onto $\mathbf{a}$: $\mathbf{B} = \mathbf{b} - \dfrac{\mathbf{a}^T\mathbf{b}}{\mathbf{a}^T\mathbf{a}}\,\mathbf{a}$.'
      - '$\mathbf{a}^T\mathbf{b} = {{dot(a, b)}}$ and $\mathbf{a}^T\mathbf{a} = {{dot(a, a)}}$.'
    solution: |
      Gram–Schmidt keeps $\mathbf{A} = \mathbf{a}$ and removes from $\mathbf{b}$ its component along $\mathbf{a}$:
      $$\mathbf{B} = \mathbf{b} - \frac{\mathbf{a}^T\mathbf{b}}{\mathbf{a}^T\mathbf{a}}\,\mathbf{a} = {{b}} - \frac{ {{dot(a, b)}} }{ {{dot(a, a)}} }{{a}} = {{B}}.$$
      Check: $\mathbf{a}\cdot\mathbf{B} = {{dot(a, B)}}$. Dividing $\mathbf{A}$ and $\mathbf{B}$ by their lengths would give the orthonormal $\mathbf{q}_1, \mathbf{q}_2$.
    verify: "GramSchmidt([Matrix([a1, a2, a3]), m*Matrix([a1, a2, a3]) + s*Matrix([a2, -a1, 0]) + w*Matrix([a3, 0, -a1])])[1]"
    covers: [mit-18-06/lecture-17]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 4
  - id: la-gs-004
    difficulty: 3
    type: multipart
    prompt: |
      Factor $A = {{A}}$ as $A = QR$, where $Q$ has orthonormal columns and $R$ is upper triangular with positive diagonal entries.
    params:
      k: { int: [1, 4] }
      m: { int: [-3, 3] }
      n: { int: [-2, 2], not: [0] }
    let:
      U: "[[1, 2, 2], [1, 2, 2], [2, 1, 2], [2, 2, 1]]"
      W: "[[2, 1, -2], [2, -2, 1], [1, 2, -2], [1, -2, 2]]"
      u: "squeeze(U[k, :])"
      w: "squeeze(W[k, :])"
      A: "transpose([u, m*u + n*w])"
    parts:
      - prompt: "(a) What is $r_{11}$?"
        type: numeric
        answer: 3
        verify: "Matrix([[1, 2, 2], [1, 2, 2], [2, 1, 2], [2, 2, 1]][k - 1]).norm()"
      - prompt: "(b) What is $r_{12}$?"
        type: numeric
        answer: "3*m"
        verify: "Matrix.hstack(Matrix([[1, 2, 2], [1, 2, 2], [2, 1, 2], [2, 2, 1]][k - 1]), m*Matrix([[1, 2, 2], [1, 2, 2], [2, 1, 2], [2, 2, 1]][k - 1]) + n*Matrix([[2, 1, -2], [2, -2, 1], [1, 2, -2], [1, -2, 2]][k - 1])).QRdecomposition()[1][0, 1]"
      - prompt: "(c) What is $r_{22}$?"
        type: numeric
        answer: "3*abs(n)"
        verify: "Matrix.hstack(Matrix([[1, 2, 2], [1, 2, 2], [2, 1, 2], [2, 2, 1]][k - 1]), m*Matrix([[1, 2, 2], [1, 2, 2], [2, 1, 2], [2, 2, 1]][k - 1]) + n*Matrix([[2, 1, -2], [2, -2, 1], [1, 2, -2], [1, -2, 2]][k - 1])).QRdecomposition()[1][1, 1]"
    hints:
      - '$r_{11} = \|\mathbf{a}_1\|$ and $\mathbf{q}_1 = \mathbf{a}_1 / r_{11}$.'
      - '$r_{12} = \mathbf{q}_1^T\mathbf{a}_2$.'
      - '$r_{22}$ is the length of $\mathbf{a}_2 - r_{12}\mathbf{q}_1$.'
    solution: |
      Let $\mathbf{a}_1 = {{u}}$ and $\mathbf{a}_2 = {{m*u + n*w}}$ be the columns.

      (a) $r_{11} = \|\mathbf{a}_1\| = \sqrt{ {{dot(u, u)}} } = 3$, so $\mathbf{q}_1 = \tfrac{1}{3}{{row: u}}$.

      (b) $r_{12} = \mathbf{q}_1^T\mathbf{a}_2 = \tfrac{1}{3}({{dot(u, m*u + n*w)}}) = {{3*m}}$.

      (c) $\mathbf{a}_2 - r_{12}\mathbf{q}_1 = \mathbf{a}_2 - ({{m}})\,\mathbf{a}_1 = {{n*w}}$, whose length is $r_{22} = {{3*abs(n)}}$, and $\mathbf{q}_2 = \tfrac{1}{ {{3*abs(n)}} }{{row: n*w}}$.

      So $R = \begin{bmatrix} 3 & {{3*m}} \\ 0 & {{3*abs(n)}} \end{bmatrix}$.
    covers: [mit-18-06/lecture-17]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 7
  - id: la-gs-005
    difficulty: 3
    type: matrix
    prompt: |
      Find the upper triangular $R$, with positive diagonal, in the factorisation $A = QR$ of $A = {{A}}$ ($Q$ orthogonal).
      Enter it as `[[1, 2], [0, 3]]`.
    params:
      k: { int: [1, 3] }
      sg: { choice: [1, -1] }
      r1: { int: [1, 3] }
      r2: { int: [-3, 3] }
      r3: { int: [1, 3] }
    let:
      T: "[[3, 4, 5], [4, 3, 5], [5, 12, 13]]"
      c: "T[k, 1]"
      s: "T[k, 2]"
      h: "T[k, 3]"
      A: "[[c, -sg*s], [s, sg*c]] * [[r1, r2], [0, r3]]"
      R: "h * [[r1, r2], [0, r3]]"
    answer: R
    hints:
      - '$r_{11}$ is the length of the first column of $A$.'
      - '$r_{12} = \mathbf{q}_1^T\mathbf{a}_2$, and $r_{22}$ is the length of what is left of $\mathbf{a}_2$ after removing that component.'
      - 'Alternatively: $R^TR = A^TA$, with $A^TA = {{transpose(A) * A}}$.'
    solution: |
      Column 1 is $\mathbf{a}_1 = {{[c*r1, s*r1]}}$ with length $r_{11} = {{h*r1}}$, so $\mathbf{q}_1 = \tfrac{1}{ {{h}} }{{row: [c, s]}}$.

      Then $r_{12} = \mathbf{q}_1^T\mathbf{a}_2 = \tfrac{1}{ {{h}} }({{c}} \cdot ({{A[1, 2]}}) + {{s}} \cdot ({{A[2, 2]}})) = {{h*r2}}$.
      Removing that component, $\mathbf{a}_2 - r_{12}\mathbf{q}_1 = {{[A[1, 2] - r2*c, A[2, 2] - r2*s]}}$, of length $r_{22} = {{h*r3}}$.
      $$R = {{R}}.$$
      Check: $R^TR = {{transpose(R) * R}} = A^TA$.
    verify: "(lambda T: (Matrix([[T[0], -sg*T[1]], [T[1], sg*T[0]]]) * Matrix([[r1, r2], [0, r3]])).QRdecomposition()[1])([[3, 4], [4, 3], [5, 12]][k - 1])"
    covers: [mit-18-06/lecture-17]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 6
  - id: la-gs-006
    difficulty: 2
    type: mc
    prompt: |
      Gram–Schmidt turns the independent columns $\mathbf{a}_1, \dots, \mathbf{a}_n$ of $A$ into orthonormal $\mathbf{q}_1, \dots, \mathbf{q}_n$, and $A = QR$. Why is $R$ **upper triangular**?
    options:
      - "Each $\\mathbf{a}_j$ is a combination of $\\mathbf{q}_1, \\dots, \\mathbf{q}_j$ only, so $\\mathbf{q}_i^T\\mathbf{a}_j = 0$ for $i > j$"
      - "Because $R = Q^TA$ and $Q^T$ is upper triangular"
      - "Because $A$ is square"
      - "Because the $\\mathbf{q}_i$ have length $1$"
    answer: 0
    hints:
      - '$R = Q^TA$, so $r_{ij} = \mathbf{q}_i^T\mathbf{a}_j$.'
      - 'Which $\mathbf{q}$''s does Gram–Schmidt use when it builds $\mathbf{q}_j$ from $\mathbf{a}_j$?'
    solution: |
      At step $j$, Gram–Schmidt builds $\mathbf{q}_j$ from $\mathbf{a}_j$ and the earlier $\mathbf{q}_1, \dots, \mathbf{q}_{j-1}$. Turned around,
      $\mathbf{a}_j$ lies in the span of $\mathbf{q}_1, \dots, \mathbf{q}_j$, which is orthogonal to every later $\mathbf{q}_i$ ($i > j$).
      So $r_{ij} = \mathbf{q}_i^T\mathbf{a}_j = 0$ below the diagonal. $A$ need not be square, and $Q^T$ is not triangular.
    verify: "0"
    covers: [mit-18-06/lecture-17]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 2
  - id: la-gs-007
    difficulty: 2
    type: vector
    prompt: |
      $Q = \dfrac{1}{3}\begin{bmatrix} 1 & 2 \\ 2 & 1 \\ 2 & -2 \end{bmatrix}$ has orthonormal columns. Find the least-squares solution $\hat{\mathbf{x}}$ of $Q\mathbf{x} \approx \mathbf{b}$ for $\mathbf{b} = {{b}}$.
      Enter it as a list such as `1, 2`.
    params:
      y1: { int: [-3, 3] }
      y2: { int: [-3, 3] }
      t: { int: [-3, 3], not: [0] }
    let:
      b: "y1*[1, 2, 2] + y2*[2, 1, -2] + t*[2, -2, 1]"
      xh: "[3*y1, 3*y2]"
    answer: xh
    hints:
      - 'The normal equations are $Q^TQ\hat{\mathbf{x}} = Q^T\mathbf{b}$. What is $Q^TQ$?'
      - '$Q^TQ = I$, so $\hat{\mathbf{x}} = Q^T\mathbf{b}$.'
    solution: |
      Orthonormal columns make $Q^TQ = I$, so the normal equations collapse to $\hat{\mathbf{x}} = Q^T\mathbf{b}$:
      $$\hat{\mathbf{x}} = \frac{1}{3}\begin{bmatrix} 1 & 2 & 2 \\ 2 & 1 & -2 \end{bmatrix}{{b}} = \frac{1}{3}{{[9*y1, 9*y2]}} = {{xh}}.$$
      No matrix inverse is needed; that is the point of orthonormal columns.
    verify: "(Matrix([[1, 2], [2, 1], [2, -2]]) / 3).solve_least_squares(y1*Matrix([1, 2, 2]) + y2*Matrix([2, 1, -2]) + t*Matrix([2, -2, 1]))"
    covers: [mit-18-06/lecture-17]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 3
  - id: la-gs-008
    difficulty: 4
    type: proof
    prompt: |
      $A$ has independent columns and $A = QR$ (orthonormal columns in $Q$, square upper triangular $R$). Show that $R$ is invertible, that
      $A^TA = R^TR$, and that the least-squares normal equations $A^TA\hat{\mathbf{x}} = A^T\mathbf{b}$ reduce to $R\hat{\mathbf{x}} = Q^T\mathbf{b}$.
    hints:
      - 'If $R\mathbf{x} = \mathbf{0}$, what is $A\mathbf{x}$?'
      - 'Use $Q^TQ = I$ in $A^TA = (QR)^T(QR)$.'
      - 'Multiply $R^TR\hat{\mathbf{x}} = R^TQ^T\mathbf{b}$ by $(R^T)^{-1}$.'
    solution: |
      **$R$ is invertible.** If $R\mathbf{x} = \mathbf{0}$ then $A\mathbf{x} = QR\mathbf{x} = \mathbf{0}$, and independent columns force $\mathbf{x} = \mathbf{0}$.
      So the square matrix $R$ has a trivial null space and is invertible.

      **$A^TA = R^TR$.** $A^TA = R^TQ^TQR = R^TIR = R^TR$.

      **Normal equations.** $A^T\mathbf{b} = R^TQ^T\mathbf{b}$, so $A^TA\hat{\mathbf{x}} = A^T\mathbf{b}$ reads $R^TR\hat{\mathbf{x}} = R^TQ^T\mathbf{b}$.
      $R^T$ is invertible because $R$ is, and cancelling it gives $R\hat{\mathbf{x}} = Q^T\mathbf{b}$, a triangular system solved by back substitution.
    covers: [mit-18-06/lecture-17]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 8
  - id: la-gs-009
    difficulty: 4
    type: vector
    prompt: |
      Apply Gram–Schmidt to $\mathbf{a} = {{a}}$, $\mathbf{b} = {{b}}$, $\mathbf{c} = {{c}}$ in that order. Give the **third** orthogonal vector $\mathbf{C}$
      (any non-zero multiple is accepted), as a list such as `1, 2, 3`.
    params:
      k: { int: [1, 3] }
      m: { int: [-2, 2] }
      p: { int: [-2, 2] }
      q: { int: [-2, 2] }
      r: { int: [-2, 2], not: [0] }
    let:
      u1: "k == 1 ? [1, 2, 2] : (k == 2 ? [2, 3, 6] : [1, 1, 1])"
      u2: "k == 1 ? [2, 1, -2] : (k == 2 ? [3, -6, 2] : [1, -1, 0])"
      u3: "k == 1 ? [2, -2, 1] : (k == 2 ? [6, 2, -3] : [1, 1, -2])"
      a: "u1"
      b: "m*u1 + u2"
      c: "p*u1 + q*u2 + r*u3"
    answer: u3
    upToScale: true
    hints:
      - 'First $\mathbf{A} = \mathbf{a}$ and $\mathbf{B} = \mathbf{b} - \dfrac{\mathbf{A}^T\mathbf{b}}{\mathbf{A}^T\mathbf{A}}\mathbf{A}$.'
      - 'Then $\mathbf{C} = \mathbf{c} - \dfrac{\mathbf{A}^T\mathbf{c}}{\mathbf{A}^T\mathbf{A}}\mathbf{A} - \dfrac{\mathbf{B}^T\mathbf{c}}{\mathbf{B}^T\mathbf{B}}\mathbf{B}$.'
      - 'You should find $\mathbf{B} = {{u2}}$.'
    solution: |
      **Step 1.** $\mathbf{A} = \mathbf{a} = {{u1}}$, with $\mathbf{A}^T\mathbf{A} = {{dot(u1, u1)}}$.

      **Step 2.** $\mathbf{A}^T\mathbf{b} = {{dot(u1, b)}}$, so $\mathbf{B} = \mathbf{b} - ({{m}})\,\mathbf{A} = {{u2}}$, with $\mathbf{B}^T\mathbf{B} = {{dot(u2, u2)}}$.

      **Step 3.** $\mathbf{A}^T\mathbf{c} = {{dot(u1, c)}}$ and $\mathbf{B}^T\mathbf{c} = {{dot(u2, c)}}$, so
      $$\mathbf{C} = \mathbf{c} - ({{p}})\,\mathbf{A} - ({{q}})\,\mathbf{B} = {{r*u3}}.$$
      Any multiple, such as ${{row: u3}}$, is fine. Check: $\mathbf{C}$ is orthogonal to both $\mathbf{A}$ and $\mathbf{B}$.
    verify: "(lambda u1, u2, u3: GramSchmidt([u1, m*u1 + u2, p*u1 + q*u2 + r*u3])[2])(Matrix([[1, 2, 2], [2, 3, 6], [1, 1, 1]][k - 1]), Matrix([[2, 1, -2], [3, -6, 2], [1, -1, 0]][k - 1]), Matrix([[2, -2, 1], [6, 2, -3], [1, 1, -2]][k - 1]))"
    covers: [mit-18-06/lecture-17]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 9
  - id: la-gs-010
    difficulty: 3
    type: vector
    prompt: |
      The reflection matrix $H = I - 2\dfrac{\mathbf{u}\mathbf{u}^T}{\mathbf{u}^T\mathbf{u}}$ is orthogonal and symmetric. For $\mathbf{u} = {{u}}$, compute $H\mathbf{b}$ where $\mathbf{b} = {{b}}$.
      Enter it as a list such as `1, 2, 3`.
    params:
      a1: { int: [1, 3] }
      a2: { int: [-2, 2] }
      a3: { int: [-2, 2] }
      m: { int: [-2, 2], not: [0] }
      s: { int: [-2, 2] }
      w: { int: [-2, 2] }
    let:
      u: "[a1, a2, a3]"
      perp: "s*[a2, -a1, 0] + w*[a3, 0, -a1]"
      b: "m*u + perp"
      Hb: "-m*u + perp"
    answer: Hb
    hints:
      - '$H\mathbf{b} = \mathbf{b} - 2\dfrac{\mathbf{u}^T\mathbf{b}}{\mathbf{u}^T\mathbf{u}}\,\mathbf{u}$: no need to build $H$.'
      - '$\mathbf{u}^T\mathbf{b} = {{dot(u, b)}}$ and $\mathbf{u}^T\mathbf{u} = {{dot(u, u)}}$.'
    solution: |
      $H\mathbf{b} = \mathbf{b} - 2\dfrac{\mathbf{u}^T\mathbf{b}}{\mathbf{u}^T\mathbf{u}}\mathbf{u} = {{b}} - 2 \cdot \dfrac{ {{dot(u, b)}} }{ {{dot(u, u)}} }{{u}} = {{Hb}}.$

      Geometrically, $\mathbf{b} = {{m}}\,\mathbf{u} + {{perp}}$ with the second part perpendicular to $\mathbf{u}$; the reflection flips the $\mathbf{u}$
      component and keeps the rest. As $H$ is orthogonal, $\|H\mathbf{b}\|^2 = \|\mathbf{b}\|^2 = {{dot(b, b)}}$.
    verify: "(lambda u, b: (eye(3) - 2 * u * u.T / u.dot(u)) * b)(Matrix([a1, a2, a3]), m*Matrix([a1, a2, a3]) + s*Matrix([a2, -a1, 0]) + w*Matrix([a3, 0, -a1]))"
    covers: [mit-18-06/lecture-17]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 4
  - id: la-gs-011
    difficulty: 5
    type: proof
    prompt: |
      Let $A$ be square and invertible. Prove that the factorisation $A = QR$ with $Q$ orthogonal and $R$ upper triangular with **positive** diagonal entries is unique.
    hints:
      - 'Suppose $Q_1R_1 = Q_2R_2$. Rearrange to get one matrix that is both orthogonal and upper triangular.'
      - 'Products and inverses of upper triangular matrices are upper triangular, and their diagonals multiply or invert.'
      - 'An upper triangular orthogonal matrix is diagonal: look at its first column, then the rest.'
    solution: |
      Suppose $A = Q_1R_1 = Q_2R_2$. Both $R_i$ are invertible (positive diagonal), so
      $$M := Q_2^TQ_1 = R_2R_1^{-1}.$$
      The left side is orthogonal (a product of orthogonal matrices). The right side is upper triangular with **positive** diagonal entries
      $(r_2)_{ii}/(r_1)_{ii}$.

      An upper triangular orthogonal $M$ is diagonal: its first column is $(m_{11}, 0, \dots, 0)$ and has length 1, so $m_{11} = \pm 1$. Columns
      $2, \dots, n$ are orthogonal to column 1, so their first entries vanish; by orthogonality of rows (as $M^T$ is also orthogonal) the first row is
      $(m_{11}, 0, \dots, 0)$, and induction on the lower-right block gives $M = \operatorname{diag}(\pm 1, \dots, \pm 1)$.

      Its diagonal is positive, so $M = I$. Hence $R_2 = R_1$ and $Q_2 = Q_1$.
    covers: [mit-18-06/lecture-17]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 12
