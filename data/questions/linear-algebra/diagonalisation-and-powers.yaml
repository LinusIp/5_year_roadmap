subject: linear-algebra
topic: diagonalisation-and-powers
questions:
  - id: la-diag-001
    difficulty: 1
    type: mc
    prompt: |
      An $n \times n$ matrix $A$ can be written as $A = S\Lambda S^{-1}$ with $\Lambda$ diagonal **exactly when**:
    options:
      - "$A$ has $n$ linearly independent eigenvectors"
      - "$A$ has $n$ distinct eigenvalues"
      - "$A$ is invertible"
      - "$A$ has no zero eigenvalue"
    answer: 0
    hints:
      - 'The columns of $S$ are eigenvectors, and $S$ must be invertible.'
      - 'The identity matrix has a single repeated eigenvalue. Is it diagonalisable?'
    solution: |
      $AS = S\Lambda$ says exactly that the columns of $S$ are eigenvectors with the eigenvalues on the diagonal of $\Lambda$, and $S^{-1}$ exists exactly when
      those $n$ columns are independent. So the condition is $n$ independent eigenvectors.

      Distinct eigenvalues are **sufficient** but not necessary ($I$ has one repeated eigenvalue and is already diagonal). Invertibility is unrelated:
      $\begin{bmatrix} 1 & 1 \\ 0 & 1 \end{bmatrix}$ is invertible but not diagonalisable, and $\begin{bmatrix} 0 & 0 \\ 0 & 1 \end{bmatrix}$ is singular but diagonal.
    verify: "0"
    covers: [mit-18-06/lecture-22]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 2
  - id: la-diag-002
    difficulty: 1
    type: numeric
    prompt: |
      A $2 \times 2$ matrix $A$ has eigenvalues ${{l1}}$ and ${{l2}}$. What is the trace of $A^{ {{k}} }$?
    params:
      l1: { int: [-3, 3], not: [0] }
      l2: { int: [-3, 3], not: [0] }
      k: { int: [2, 4] }
    answer: "l1^k + l2^k"
    hints:
      - 'If $A\mathbf{x} = \lambda\mathbf{x}$, then $A^k\mathbf{x} = \lambda^k\mathbf{x}$.'
      - 'The trace is the sum of the eigenvalues.'
    solution: |
      $A^{ {{k}} }$ has the same eigenvectors as $A$, with eigenvalues $({{l1}})^{ {{k}} } = {{l1^k}}$ and $({{l2}})^{ {{k}} } = {{l2^k}}$.
      The trace is the sum of the eigenvalues: $\operatorname{tr}(A^{ {{k}} }) = {{l1^k}} {{signed: l2^k}} = {{l1^k + l2^k}}$.
    verify: "(Matrix([[l1, 1], [0, l2]])**k).trace()"
    covers: [mit-18-06/lecture-22]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 2
  - id: la-diag-003
    difficulty: 2
    type: matrix
    prompt: |
      $A = {{A}}$ has eigenvectors ${{row: [1, n]}}$ (eigenvalue ${{l1}}$) and ${{row: [m, 1 + m*n]}}$ (eigenvalue ${{l2}}$).
      Use $A = S\Lambda S^{-1}$ to compute $A^{ {{k}} }$. Enter it as `[[1, 2], [3, 4]]`.
    params:
      l1: { choice: [-2, -1, 1, 2] }
      l2: { choice: [-2, -1, 0, 1, 2] }
      m: { int: [-2, 2] }
      n: { int: [-2, 2] }
      k: { int: [3, 5] }
    let:
      S: "[[1, m], [n, 1 + m*n]]"
      Si: "[[1 + m*n, -m], [-n, 1]]"
      A: "S * diag([l1, l2]) * Si"
      Ak: "S * diag([l1^k, l2^k]) * Si"
    require: ["l1 != l2", "m != 0 or n != 0"]
    answer: Ak
    hints:
      - '$A^k = S\Lambda^kS^{-1}$, where the columns of $S$ are the eigenvectors.'
      - '$S = {{S}}$ has determinant $1$, so $S^{-1} = {{Si}}$.'
    solution: |
      With $S = {{S}}$, $\Lambda = {{diag([l1, l2])}}$ and $S^{-1} = {{Si}}$ (here $\det S = 1$):
      $$A^{ {{k}} } = S\Lambda^{ {{k}} }S^{-1} = {{S}}{{diag([l1^k, l2^k])}}{{Si}} = {{Ak}}.$$
      Only the eigenvalues get raised to the power: that is why diagonalising makes powers cheap.
    verify: "((lambda S: S * diag(l1, l2) * S.inv())(Matrix([[1, m], [n, 1 + m*n]])))**k"
    covers: [mit-18-06/lecture-22]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 5
  - id: la-diag-004
    difficulty: 3
    type: vector
    prompt: |
      $A = {{A}}$ has eigenvectors $\mathbf{x}_1 = {{row: x1}}$ with $\lambda_1 = {{l1}}$ and $\mathbf{x}_2 = {{row: x2}}$ with $\lambda_2 = {{l2}}$.
      Starting from $\mathbf{u}_0 = {{u0}}$, find $\mathbf{u}_{ {{k}} } = A^{ {{k}} }\mathbf{u}_0$. Enter it as a list such as `1, 2`.
    params:
      l1: { choice: [-2, -1, 1, 2, 3] }
      l2: { choice: [-2, -1, 1, 2, 3] }
      m: { int: [-2, 2] }
      n: { int: [-2, 2] }
      c1: { int: [-2, 2], not: [0] }
      c2: { int: [-2, 2], not: [0] }
      k: { int: [3, 5] }
    let:
      x1: "[1, n]"
      x2: "[m, 1 + m*n]"
      S: "[[1, m], [n, 1 + m*n]]"
      Si: "[[1 + m*n, -m], [-n, 1]]"
      A: "S * diag([l1, l2]) * Si"
      u0: "c1*x1 + c2*x2"
      uk: "c1*l1^k*x1 + c2*l2^k*x2"
    require: ["l1 != l2", "m != 0 or n != 0"]
    answer: uk
    hints:
      - 'Write $\mathbf{u}_0 = c_1\mathbf{x}_1 + c_2\mathbf{x}_2$.'
      - 'Then $A^k\mathbf{u}_0 = c_1\lambda_1^k\mathbf{x}_1 + c_2\lambda_2^k\mathbf{x}_2$.'
    solution: |
      Solve $c_1\mathbf{x}_1 + c_2\mathbf{x}_2 = \mathbf{u}_0$: here $c_1 = {{c1}}$ and $c_2 = {{c2}}$ (check: ${{c1}}{{row: x1}} {{signed: c2}}{{row: x2}} = {{row: u0}}$).
      Each eigenvector is just multiplied by its eigenvalue at every step, so
      $$\mathbf{u}_{ {{k}} } = {{c1}}\,({{l1}})^{ {{k}} }\mathbf{x}_1 + ({{c2}})({{l2}})^{ {{k}} }\mathbf{x}_2 = {{c1*l1^k}}{{row: x1}} {{signed: c2*l2^k}}{{row: x2}} = {{row: uk}}.$$
    verify: "((lambda S: S * diag(l1, l2) * S.inv())(Matrix([[1, m], [n, 1 + m*n]])))**k * (c1*Matrix([1, n]) + c2*Matrix([m, 1 + m*n]))"
    covers: [mit-18-06/lecture-22]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 6
  - id: la-diag-005
    difficulty: 3
    type: numeric
    prompt: |
      A sequence satisfies $u_{k+2} = {{a}}\,u_{k+1} {{signed: b}}\,u_k$ with $u_0 = {{u0}}$ and $u_1 = {{u1}}$. What is $u_{ {{nn}} }$?
    params:
      r1: { int: [-3, 3], not: [0] }
      r2: { int: [-3, 3], not: [0] }
      u0: { int: [-2, 3] }
      u1: { int: [-3, 3] }
      nn: { int: [7, 9] }
    let:
      a: "r1 + r2"
      b: "-r1*r2"
      c1: "(u1 - r2*u0) / (r1 - r2)"
      c2: "(r1*u0 - u1) / (r1 - r2)"
      un: "c1*r1^nn + c2*r2^nn"
    require: ["r1 > r2", "a != 0", "u0 != 0 or u1 != 0"]
    answer: un
    hints:
      - 'Write $\mathbf{u}_k = (u_{k+1}, u_k)$; then $\mathbf{u}_{k+1} = A\mathbf{u}_k$ with $A = \begin{bmatrix} {{a}} & {{b}} \\ 1 & 0 \end{bmatrix}$.'
      - 'The eigenvalues of $A$ solve $\lambda^2 = {{a}}\lambda {{signed: b}}$.'
      - 'So $u_k = c_1\lambda_1^k + c_2\lambda_2^k$; find $c_1, c_2$ from $u_0$ and $u_1$.'
    solution: |
      With $\mathbf{u}_k = (u_{k+1}, u_k)$ the rule is $\mathbf{u}_{k+1} = A\mathbf{u}_k$, $A = \begin{bmatrix} {{a}} & {{b}} \\ 1 & 0 \end{bmatrix}$.
      Its eigenvalues solve $\lambda^2 {{signed: -a}}\lambda {{signed: -b}} = 0$, i.e. $(\lambda - ({{r1}}))(\lambda - ({{r2}})) = 0$: $\lambda_1 = {{r1}}$, $\lambda_2 = {{r2}}$.

      So $u_k = c_1({{r1}})^k + c_2({{r2}})^k$. From $u_0 = c_1 + c_2 = {{u0}}$ and $u_1 = {{r1}}c_1 {{signed: r2}}c_2 = {{u1}}$:
      $c_1 = {{frac: c1}}$ and $c_2 = {{frac: c2}}$. Then
      $$u_{ {{nn}} } = {{frac: c1}}\cdot({{r1}})^{ {{nn}} } + \left({{frac: c2}}\right)\cdot({{r2}})^{ {{nn}} } = {{un}}.$$
    verify: "(Matrix([[r1 + r2, -r1*r2], [1, 0]])**(nn - 1) * Matrix([u1, u0]))[0]"
    covers: [mit-18-06/lecture-22]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 8
  - id: la-diag-006
    difficulty: 3
    type: numeric
    prompt: |
      Every year, a fraction ${{p}}$ of the people in city A move to city B and a fraction ${{q}}$ of those in B move to A; nobody else moves.
      The two cities hold 1000 people in total. In the long run (steady state), how many live in A?
    params:
      p: { real: [0.1, 0.5], step: 0.1 }
      q: { real: [0.1, 0.5], step: 0.1 }
    let:
      M: "[[1 - p, q], [p, 1 - q]]"
      xA: "1000 * q / (p + q)"
    answer: xA
    tolerance: { rel: 0.002 }
    hints:
      - 'The Markov matrix is $M = {{M}}$ acting on $(\text{A}, \text{B})$. The steady state is the eigenvector for $\lambda = 1$.'
      - 'Solve $(M - I)\mathbf{x} = \mathbf{0}$: the first row gives $-{{p}}\,x_A + {{q}}\,x_B = 0$.'
    solution: |
      Each year $(x_A, x_B) \mapsto M(x_A, x_B)$ with the Markov matrix $M = {{M}}$ (columns add to 1).
      Its eigenvalues are $1$ and $1 - {{p}} - {{q}} = {{1 - p - q}}$; since $|{{1 - p - q}}| < 1$ that part dies out and the populations approach the
      $\lambda = 1$ eigenvector.

      $(M - I)\mathbf{x} = \mathbf{0}$ gives ${{p}}\,x_A = {{q}}\,x_B$: the flows balance. With $x_A + x_B = 1000$,
      $$x_A = 1000\cdot\frac{ {{q}} }{ {{p}} + {{q}} } \approx {{xA}}.$$
    verify: "(lambda v: 1000 * v[0] / (v[0] + v[1]))((Matrix([[1 - nsimplify(p), nsimplify(q)], [nsimplify(p), 1 - nsimplify(q)]]) - eye(2)).nullspace()[0])"
    covers: [mit-18-06/lecture-24]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 5
  - id: la-diag-007
    difficulty: 4
    type: vector
    prompt: |
      Solve $\dfrac{d\mathbf{u}}{dt} = A\mathbf{u}$ with $A = {{A}}$ and $\mathbf{u}(0) = {{u0}}$. What is $\lim_{t \to \infty}\mathbf{u}(t)$?
      Enter it as a list such as `1, 2`.
    params:
      l: { int: [1, 3] }
      m: { int: [-2, 2] }
      n: { int: [-2, 2] }
      c1: { int: [-2, 2], not: [0] }
      c2: { int: [-2, 2], not: [0] }
    let:
      S: "[[1, m], [n, 1 + m*n]]"
      Si: "[[1 + m*n, -m], [-n, 1]]"
      A: "S * diag([0, -l]) * Si"
      x1: "[1, n]"
      x2: "[m, 1 + m*n]"
      u0: "c1*x1 + c2*x2"
      uinf: "c1*x1"
    require: ["m != 0 or n != 0"]
    answer: uinf
    hints:
      - 'Find the eigenvalues: $\operatorname{tr}A = {{-l}}$ and $\det A = 0$.'
      - '$\mathbf{u}(t) = c_1e^{\lambda_1t}\mathbf{x}_1 + c_2e^{\lambda_2t}\mathbf{x}_2$. Which term survives as $t \to \infty$?'
      - 'Eigenvectors: ${{row: x1}}$ for $\lambda = 0$ and ${{row: x2}}$ for $\lambda = {{-l}}$.'
    solution: |
      $\det A = 0$ and $\operatorname{tr}A = {{-l}}$, so the eigenvalues are $\lambda_1 = 0$ and $\lambda_2 = {{-l}}$. Solving $(A - \lambda I)\mathbf{x} = \mathbf{0}$ gives
      $\mathbf{x}_1 = {{row: x1}}$ and $\mathbf{x}_2 = {{row: x2}}$.

      Write $\mathbf{u}(0) = c_1\mathbf{x}_1 + c_2\mathbf{x}_2$: $c_1 = {{c1}}$, $c_2 = {{c2}}$. Then
      $$\mathbf{u}(t) = {{c1}}\,e^{0t}\mathbf{x}_1 + ({{c2}})\,e^{ {{-l}}t }\mathbf{x}_2.$$
      The second term decays, so $\mathbf{u}(t) \to {{c1}}\,\mathbf{x}_1 = {{row: uinf}}$, a steady state (it lies in the null space of $A$).
    verify: "(lambda A, u0: ((A * Symbol('s')).exp() * u0).applyfunc(lambda f: limit(f, Symbol('s'), oo)))((lambda S: S * diag(0, -l) * S.inv())(Matrix([[1, m], [n, 1 + m*n]])), c1*Matrix([1, n]) + c2*Matrix([m, 1 + m*n]))"
    covers: [mit-18-06/lecture-23]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 7
  - id: la-diag-008
    difficulty: 2
    type: mc
    prompt: |
      $A$ is a real $2 \times 2$ matrix. Which condition guarantees that **every** solution of $\dfrac{d\mathbf{u}}{dt} = A\mathbf{u}$ tends to $\mathbf{0}$?
    options:
      - "$\\operatorname{tr}A < 0$ and $\\det A > 0$"
      - "$\\det A < 0$"
      - "$\\operatorname{tr}A > 0$ and $\\det A > 0$"
      - "$\\operatorname{tr}A < 0$ alone"
    answer: 0
    hints:
      - 'Stability needs both eigenvalues to have negative real part.'
      - 'The trace is $\lambda_1 + \lambda_2$ and the determinant is $\lambda_1\lambda_2$.'
    solution: |
      Solutions are built from $e^{\lambda t}$, so all decay exactly when $\operatorname{Re}\lambda_1 < 0$ and $\operatorname{Re}\lambda_2 < 0$.
      For real eigenvalues that means both negative: sum $< 0$ and product $> 0$. For a complex pair $a \pm ib$: $\operatorname{tr}A = 2a < 0$ and
      $\det A = a^2 + b^2 > 0$ automatically. So the test is $\operatorname{tr}A < 0$ **and** $\det A > 0$.

      $\det A < 0$ means one positive eigenvalue (unstable); $\operatorname{tr}A < 0$ alone allows eigenvalues such as $1$ and $-3$.
    verify: "0"
    covers: [mit-18-06/lecture-23]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 2
  - id: la-diag-009
    difficulty: 4
    type: proof
    prompt: |
      Prove that eigenvectors $\mathbf{x}_1, \dots, \mathbf{x}_k$ of $A$ belonging to **distinct** eigenvalues $\lambda_1, \dots, \lambda_k$ are linearly independent.
      Conclude that an $n \times n$ matrix with $n$ distinct eigenvalues is diagonalisable.
    hints:
      - 'Start with two: suppose $c_1\mathbf{x}_1 + c_2\mathbf{x}_2 = \mathbf{0}$. Multiply by $A$, and separately by $\lambda_2$, and subtract.'
      - 'In general, take a shortest dependence $c_1\mathbf{x}_1 + \dots + c_j\mathbf{x}_j = \mathbf{0}$ and do the same to get a shorter one.'
    solution: |
      Suppose not, and take a dependence $c_1\mathbf{x}_1 + \dots + c_j\mathbf{x}_j = \mathbf{0}$ among the $\mathbf{x}_i$ using as **few** vectors as possible
      (renumbered), so every $c_i \ne 0$ and $j \ge 2$ (an eigenvector is non-zero).

      Apply $A$: $c_1\lambda_1\mathbf{x}_1 + \dots + c_j\lambda_j\mathbf{x}_j = \mathbf{0}$. Multiply the original by $\lambda_j$ and subtract:
      $$c_1(\lambda_1 - \lambda_j)\mathbf{x}_1 + \dots + c_{j-1}(\lambda_{j-1} - \lambda_j)\mathbf{x}_{j-1} = \mathbf{0}.$$
      The coefficients $c_i(\lambda_i - \lambda_j)$ are non-zero because the eigenvalues are distinct, so this is a shorter dependence: a contradiction.
      Hence the eigenvectors are independent.

      With $n$ distinct eigenvalues, pick one eigenvector for each: they are $n$ independent vectors, so $S = [\mathbf{x}_1 \cdots \mathbf{x}_n]$ is invertible and
      $AS = S\Lambda$ gives $A = S\Lambda S^{-1}$.
    covers: [mit-18-06/lecture-22]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 10
  - id: la-diag-010
    difficulty: 4
    type: matrix
    prompt: |
      Let $A = {{A}}$. Its eigenvalues are $1$ and ${{h}}$. Find $\displaystyle\lim_{k \to \infty} A^k$. Enter it as `[[1, 2], [3, 4]]`.
    params:
      h: { choice: [0.5, -0.5] }
      m: { int: [-2, 2] }
      n: { int: [-2, 2] }
    let:
      S: "[[1, m], [n, 1 + m*n]]"
      Si: "[[1 + m*n, -m], [-n, 1]]"
      A: "S * diag([1, h]) * Si"
      L: "S * diag([1, 0]) * Si"
    require: ["m != 0 or n != 0"]
    answer: L
    hints:
      - '$A^k = S\Lambda^kS^{-1}$ and $({{h}})^k \to 0$.'
      - 'Find the eigenvector for $\lambda = 1$ and the one for $\lambda = {{h}}$ to build $S$, then let $k \to \infty$ in $S\Lambda^kS^{-1}$.'
    solution: |
      Solving $(A - I)\mathbf{x} = \mathbf{0}$ and $(A - ({{h}})I)\mathbf{x} = \mathbf{0}$ gives the eigenvectors ${{row: [1, n]}}$ and ${{row: [m, 1 + m*n]}}$, so
      $$S = {{S}}, \qquad S^{-1} = {{Si}}.$$
      Then $A^k = S\begin{bmatrix} 1 & 0 \\ 0 & ({{h}})^k \end{bmatrix}S^{-1}$, and as $({{h}})^k \to 0$,
      $$\lim_{k\to\infty}A^k = S\begin{bmatrix} 1 & 0 \\ 0 & 0 \end{bmatrix}S^{-1} = {{L}}.$$
      The limit is the (oblique) projection onto the $\lambda = 1$ eigenvector along the other one; it satisfies $L^2 = L$.
    verify: "N(((lambda S: S * diag(1, nsimplify(h)) * S.inv())(Matrix([[1, m], [n, 1 + m*n]])))**90, 30)"
    covers: [mit-18-06/lecture-22, mit-18-06/lecture-24]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 7
  - id: la-diag-011
    difficulty: 5
    type: numeric
    prompt: |
      Let $A = {{A}}$, whose eigenvalues are ${{l1}}$ and ${{l2}}$. What is the $(1, 2)$ entry of the matrix exponential $e^{A}$? Give 4 significant figures.
    params:
      l1: { choice: [0, -1, 1, -2] }
      l2: { choice: [0, -1, 1, -2] }
      m: { int: [-2, 2] }
      n: { int: [-2, 2] }
    let:
      S: "[[1, m], [n, 1 + m*n]]"
      Si: "[[1 + m*n, -m], [-n, 1]]"
      A: "S * diag([l1, l2]) * Si"
      E: "S * diag([exp(l1), exp(l2)]) * Si"
    require: ["l1 != l2", "m != 0"]
    answer: "E[1, 2]"
    hints:
      - '$e^{A} = Se^{\Lambda}S^{-1}$ with $e^{\Lambda} = \operatorname{diag}(e^{\lambda_1}, e^{\lambda_2})$.'
      - 'The eigenvectors are ${{row: [1, n]}}$ for ${{l1}}$ and ${{row: [m, 1 + m*n]}}$ for ${{l2}}$; here $\det S = 1$.'
    solution: |
      The eigenvectors give $S = {{S}}$ with $S^{-1} = {{Si}}$. The series $e^{A} = I + A + \tfrac{1}{2}A^2 + \cdots$ becomes $Se^{\Lambda}S^{-1}$ because $A^k = S\Lambda^kS^{-1}$:
      $$e^{A} = S\begin{bmatrix} e^{ {{l1}} } & 0 \\ 0 & e^{ {{l2}} } \end{bmatrix}S^{-1}.$$
      The $(1, 2)$ entry is row 1 of $S$ times $e^{\Lambda}$ times column 2 of $S^{-1}$:
      $$1\cdot e^{ {{l1}} }\cdot({{-m}}) + ({{m}})\cdot e^{ {{l2}} }\cdot 1 = {{m}}\left(e^{ {{l2}} } - e^{ {{l1}} }\right) \approx {{E[1, 2]}}.$$
    verify: "N(((lambda S: S * diag(l1, l2) * S.inv())(Matrix([[1, m], [n, 1 + m*n]]))).exp()[0, 1], 20)"
    covers: [mit-18-06/lecture-23]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 8
