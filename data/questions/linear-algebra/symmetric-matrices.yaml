subject: linear-algebra
topic: symmetric-matrices
questions:
  - id: la-sym-001
    difficulty: 1
    type: mc
    prompt: |
      $A$ is a real **symmetric** matrix ($A^T = A$). Which statement is always true?
    options:
      - "Its eigenvalues are real, and it has an orthonormal basis of eigenvectors"
      - "Its eigenvalues are all positive"
      - "It is invertible"
      - "Its eigenvalues are its diagonal entries"
    answer: 0
    hints:
      - 'This is the spectral theorem.'
      - 'Test the other options on $\begin{bmatrix} 0 & 1 \\ 1 & 0 \end{bmatrix}$ and on the zero matrix.'
    solution: |
      The spectral theorem: a real symmetric matrix has real eigenvalues and orthonormal eigenvectors, so $A = Q\Lambda Q^T$ with $Q$ orthogonal.

      The rest can fail: $\begin{bmatrix} 0 & 1 \\ 1 & 0 \end{bmatrix}$ has eigenvalues $1$ and $-1$ (not all positive, and not its diagonal entries $0, 0$),
      and the zero matrix is symmetric but not invertible.
    verify: "0"
    covers: [mit-18-06/lecture-25]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 1
  - id: la-sym-002
    difficulty: 1
    type: numeric
    prompt: |
      What is the **larger** eigenvalue of $A = {{A}}$?
    params:
      a: { int: [-5, 5] }
      b: { int: [-4, 4], not: [0] }
    let:
      A: "[[a, b], [b, a]]"
    answer: "a + abs(b)"
    hints:
      - 'Try the vectors $(1, 1)$ and $(1, -1)$.'
    solution: |
      $A{{row: [1, 1]}}^T = ({{a + b}})(1, 1)^T$ and $A(1, -1)^T = ({{a - b}})(1, -1)^T$, so the eigenvalues are $a + b = {{a + b}}$ and $a - b = {{a - b}}$,
      with orthogonal eigenvectors as the spectral theorem promises. The larger is ${{a + abs(b)}}$.
    verify: "max(Matrix([[a, b], [b, a]]).eigenvals().keys())"
    covers: [mit-18-06/lecture-25]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 2
  - id: la-sym-003
    difficulty: 2
    type: vector
    prompt: |
      The symmetric matrix $A = {{A}}$ has $\mathbf{v} = {{row: [p, q]}}$ as an eigenvector. Without computing any eigenvalues, give an eigenvector for its **other**
      eigenvalue (any non-zero multiple is accepted), as a list such as `1, 2`.
    params:
      p: { int: [1, 3] }
      q: { int: [-3, 3], not: [0] }
      c: { int: [-3, 3] }
      m: { int: [-2, 2], not: [0] }
    let:
      A: "c*identity(2) + m*[[p*p, p*q], [q*p, q*q]]"
    answer: "[-q, p]"
    upToScale: true
    hints:
      - 'Eigenvectors of a symmetric matrix for different eigenvalues are orthogonal.'
      - 'In $\mathbb{R}^2$, which direction is orthogonal to ${{row: [p, q]}}$?'
    solution: |
      For a symmetric matrix, eigenvectors belonging to different eigenvalues are orthogonal, and in $\mathbb{R}^2$ only one direction is orthogonal to $\mathbf{v}$:
      $$\mathbf{w} = {{row: [-q, p]}}.$$
      Check: $A\mathbf{w} = {{row: A * [-q, p]}} = {{c}}\,\mathbf{w}$, while $A\mathbf{v} = {{row: A * [p, q]}} = {{c + m*(p^2 + q^2)}}\,\mathbf{v}$.
    verify: "[vec for (val, mult, vs) in (c*eye(2) + m*Matrix([p, q])*Matrix([[p, q]])).eigenvects() for vec in vs if vec[0]*q - vec[1]*p != 0][0]"
    covers: [mit-18-06/lecture-25]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 3
  - id: la-sym-004
    difficulty: 3
    type: numeric
    prompt: |
      The symmetric matrix $A = {{A}}$ has one eigenvalue repeated twice and one that is not repeated. What is the **non-repeated** eigenvalue?
    params:
      v1: { int: [1, 2] }
      v2: { int: [-2, 2] }
      v3: { int: [-2, 2] }
      c: { int: [-3, 3] }
      m: { int: [-2, 2], not: [0] }
    let:
      v: "[v1, v2, v3]"
      A: "c*identity(3) + m*[[v1], [v2], [v3]] * [[v1, v2, v3]]"
      lam: "c + m*dot(v, v)"
    answer: lam
    hints:
      - '$A - ({{c}})I$ has rank 1. What does that say about the eigenvalue ${{c}}$?'
      - 'The trace is the sum of all three eigenvalues: $\operatorname{tr}A = {{trace(A)}}$.'
    solution: |
      $A - ({{c}})I = {{A - c*identity(3)}}$ has every row a multiple of ${{row: v}}$: rank 1, so its null space is a plane and $\lambda = {{c}}$ is an eigenvalue
      with two independent eigenvectors (the repeated one).

      The trace gives the third: $\lambda_3 = \operatorname{tr}A - 2({{c}}) = {{trace(A)}} - ({{2*c}}) = {{lam}}$. Its eigenvector is ${{row: v}}$,
      orthogonal to that plane: $A{{row: v}}^T = {{lam}}{{row: v}}^T$.
    verify: "[val for val, mult in (c*eye(3) + m*Matrix([v1, v2, v3])*Matrix([[v1, v2, v3]])).eigenvals().items() if mult == 1][0]"
    covers: [mit-18-06/lecture-25]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 5
  - id: la-sym-005
    difficulty: 2
    type: matrix
    prompt: |
      Build the symmetric matrix $A = \lambda_1\mathbf{q}_1\mathbf{q}_1^T + \lambda_2\mathbf{q}_2\mathbf{q}_2^T$ with $\lambda_1 = {{l1}}$, $\lambda_2 = {{l2}}$ and the orthonormal eigenvectors
      $\mathbf{q}_1 = \tfrac{1}{ {{h}} }{{row: [c, s]}}$, $\mathbf{q}_2 = \tfrac{1}{ {{h}} }{{row: [-s, c]}}$. Enter $A$ with decimals, as `[[1.5, 2], [2, -0.25]]`.
    params:
      k: { int: [1, 4] }
      l1: { int: [-4, 6] }
      l2: { int: [-4, 6] }
    let:
      T: "[[3, 4, 5], [4, 3, 5], [7, 24, 25], [24, 7, 25]]"
      c: "T[k, 1]"
      s: "T[k, 2]"
      h: "T[k, 3]"
      P1: "[[c*c, c*s], [s*c, s*s]] / h^2"
      P2: "[[s*s, -s*c], [-c*s, c*c]] / h^2"
      A: "l1*P1 + l2*P2"
    require: ["l1 != l2"]
    answer: A
    tolerance: { abs: 0.005 }
    hints:
      - '$\mathbf{q}_1\mathbf{q}_1^T = \tfrac{1}{ {{h^2}} }{{[[c*c, c*s], [s*c, s*s]]}}$ is the projection onto the line through $\mathbf{q}_1$.'
      - 'Similarly $\mathbf{q}_2\mathbf{q}_2^T = \tfrac{1}{ {{h^2}} }{{[[s*s, -s*c], [-c*s, c*c]]}}$; the two projections add to $I$.'
    solution: |
      The spectral theorem writes a symmetric matrix as a combination of projections onto its eigenvector lines:
      $$A = {{l1}}\cdot\frac{1}{ {{h^2}} }{{[[c*c, c*s], [s*c, s*s]]}} + ({{l2}})\cdot\frac{1}{ {{h^2}} }{{[[s*s, -s*c], [-c*s, c*c]]}} = {{A}}.$$
      Check: $\operatorname{tr}A = {{l1 + l2}} = \lambda_1 + \lambda_2$, and $A\mathbf{q}_1 = {{l1}}\,\mathbf{q}_1$.
    verify: "(lambda T: (lambda Q: Q * diag(l1, l2) * Q.T)(Matrix([[T[0], -T[1]], [T[1], T[0]]]) / T[2]))([[3, 4, 5], [4, 3, 5], [7, 24, 25], [24, 7, 25]][k - 1])"
    covers: [mit-18-06/lecture-25]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 5
  - id: la-sym-006
    difficulty: 3
    type: multipart
    prompt: |
      Let $A = {{A}}$.
    params:
      a: { int: [-2, 3] }
      b: { int: [1, 3] }
      k: { int: [3, 4] }
    let:
      A: "[[a, b], [b, a]]"
    parts:
      - prompt: "(a) What is the larger eigenvalue of $A$?"
        type: numeric
        answer: "a + b"
        verify: "max(Matrix([[a, b], [b, a]]).eigenvals().keys())"
      - prompt: "(b) Using $A = Q\\Lambda Q^T$, what is the $(1, 2)$ entry of $A^{ {{k}} }$?"
        type: numeric
        answer: "((a + b)^k - (a - b)^k) / 2"
        verify: "(Matrix([[a, b], [b, a]])**k)[0, 1]"
    hints:
      - 'Try $(1, 1)$ and $(1, -1)$ as eigenvectors.'
      - 'With $\mathbf{q}_1 = \tfrac{1}{\sqrt 2}(1, 1)$, $\mathbf{q}_2 = \tfrac{1}{\sqrt 2}(1, -1)$: $A^k = \lambda_1^k\mathbf{q}_1\mathbf{q}_1^T + \lambda_2^k\mathbf{q}_2\mathbf{q}_2^T$.'
      - 'The $(1,2)$ entry of $\mathbf{q}_1\mathbf{q}_1^T$ is $\tfrac12$ and that of $\mathbf{q}_2\mathbf{q}_2^T$ is $-\tfrac12$.'
    solution: |
      (a) $A(1, 1)^T = {{a + b}}\,(1, 1)^T$ and $A(1, -1)^T = {{a - b}}\,(1, -1)^T$, so the eigenvalues are ${{a + b}}$ and ${{a - b}}$; the larger is ${{a + b}}$.

      (b) With unit eigenvectors $\mathbf{q}_1 = \tfrac{1}{\sqrt 2}(1, 1)$ and $\mathbf{q}_2 = \tfrac{1}{\sqrt 2}(1, -1)$,
      $$A^{ {{k}} } = ({{a + b}})^{ {{k}} }\,\mathbf{q}_1\mathbf{q}_1^T + ({{a - b}})^{ {{k}} }\,\mathbf{q}_2\mathbf{q}_2^T, \qquad \mathbf{q}_1\mathbf{q}_1^T = \tfrac12\begin{bmatrix} 1 & 1 \\ 1 & 1 \end{bmatrix}, \quad \mathbf{q}_2\mathbf{q}_2^T = \tfrac12\begin{bmatrix} 1 & -1 \\ -1 & 1 \end{bmatrix}.$$
      The $(1, 2)$ entry is $\tfrac12\left({{(a + b)^k}} - ({{(a - b)^k}})\right) = {{((a + b)^k - (a - b)^k) / 2}}$.
    covers: [mit-18-06/lecture-25]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 6
  - id: la-sym-007
    difficulty: 2
    type: mc
    prompt: |
      $A$ is any real $m \times n$ matrix. Which of these matrices is **always** symmetric?
    options:
      - "$A^TA$"
      - "$A^2$"
      - "$A - A^T$"
      - "$AA^TA$"
    answer: 0
    hints:
      - 'Take the transpose of each, using $(XY)^T = Y^TX^T$.'
    solution: |
      $(A^TA)^T = A^T(A^T)^T = A^TA$, so $A^TA$ is symmetric (and $n \times n$) for every $A$.

      $A^2$ needs $A$ square and is symmetric only for special $A$; $(A - A^T)^T = A^T - A = -(A - A^T)$ is **skew**-symmetric;
      $(AA^TA)^T = A^TAA^T$, which is not even the same shape unless $m = n$.
    verify: "0"
    covers: [mit-18-06/lecture-25]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 2
  - id: la-sym-008
    difficulty: 4
    type: proof
    prompt: |
      $A$ is real symmetric, $A\mathbf{x} = \lambda_1\mathbf{x}$ and $A\mathbf{y} = \lambda_2\mathbf{y}$ with $\lambda_1 \ne \lambda_2$. Prove that $\mathbf{x}^T\mathbf{y} = 0$.
    hints:
      - 'Compute $\mathbf{x}^TA\mathbf{y}$ in two ways.'
      - 'Use $\mathbf{x}^TA = (A^T\mathbf{x})^T = (A\mathbf{x})^T$.'
    solution: |
      On one hand, $\mathbf{x}^TA\mathbf{y} = \mathbf{x}^T(\lambda_2\mathbf{y}) = \lambda_2\,\mathbf{x}^T\mathbf{y}$.

      On the other, since $A^T = A$, $\mathbf{x}^TA = (A^T\mathbf{x})^T = (A\mathbf{x})^T = \lambda_1\mathbf{x}^T$, so $\mathbf{x}^TA\mathbf{y} = \lambda_1\,\mathbf{x}^T\mathbf{y}$.

      Subtracting, $(\lambda_1 - \lambda_2)\,\mathbf{x}^T\mathbf{y} = 0$, and $\lambda_1 \ne \lambda_2$ forces $\mathbf{x}^T\mathbf{y} = 0$.
    covers: [mit-18-06/lecture-25]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 6
  - id: la-sym-009
    difficulty: 5
    type: proof
    prompt: |
      A complex matrix is **Hermitian** if $\bar{A}^T = A$ (written $A^H = A$). Prove that every eigenvalue of a Hermitian matrix is real. Deduce that a real
      symmetric matrix has real eigenvalues.
    hints:
      - 'Start from $A\mathbf{x} = \lambda\mathbf{x}$ and multiply on the left by $\mathbf{x}^H = \bar{\mathbf{x}}^T$.'
      - 'Show that the number $\mathbf{x}^HA\mathbf{x}$ equals its own complex conjugate.'
      - '$\mathbf{x}^H\mathbf{x} = |x_1|^2 + \dots + |x_n|^2 > 0$ for $\mathbf{x} \ne \mathbf{0}$.'
    solution: |
      Let $A\mathbf{x} = \lambda\mathbf{x}$ with $\mathbf{x} \ne \mathbf{0}$. Multiply by $\mathbf{x}^H$:
      $$\mathbf{x}^HA\mathbf{x} = \lambda\,\mathbf{x}^H\mathbf{x}.$$
      The number $\mathbf{x}^HA\mathbf{x}$ (a $1 \times 1$ matrix) is real: its conjugate is its conjugate transpose,
      $(\mathbf{x}^HA\mathbf{x})^H = \mathbf{x}^HA^H\mathbf{x} = \mathbf{x}^HA\mathbf{x}$.
      Also $\mathbf{x}^H\mathbf{x} = \sum|x_i|^2$ is real and positive. Hence $\lambda = \dfrac{\mathbf{x}^HA\mathbf{x}}{\mathbf{x}^H\mathbf{x}}$ is real.

      A real symmetric matrix satisfies $\bar{A}^T = A^T = A$, so it is Hermitian, and its eigenvalues (a priori complex roots of $\det(A - \lambda I)$) are real.
    covers: [mit-18-06/lecture-25, mit-18-06/lecture-26]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 10
  - id: la-sym-010
    difficulty: 4
    type: numeric
    prompt: |
      The complex matrix
      $$A = \begin{bmatrix} {{a}} & {{bb}} {{signed: cc}}i \\ {{bb}} {{signed: -cc}}i & {{d}} \end{bmatrix}$$
      is Hermitian, so its eigenvalues are real. What is the **larger** one?
    params:
      k: { int: [1, 9] }
      d: { int: [-3, 3] }
      sb: { choice: [1, -1] }
      sc: { choice: [1, -1] }
    let:
      T: "[[1, 2, 2, 3], [2, 1, 2, 3], [2, 2, 1, 3], [0, 3, 4, 5], [0, 4, 3, 5], [2, 3, 6, 7], [2, 6, 3, 7], [1, 4, 8, 9], [4, 4, 7, 9]]"
      u: "T[k, 1]"
      bb: "sb*T[k, 2]"
      cc: "sc*T[k, 3]"
      r: "T[k, 4]"
      a: "d + 2*u"
      big: "d + u + r"
    answer: big
    hints:
      - '$\det(A - \lambda I) = ({{a}} - \lambda)({{d}} - \lambda) - |{{bb}} {{signed: cc}}i|^2$.'
      - '$|{{bb}} {{signed: cc}}i|^2 = {{bb^2 + cc^2}}$. Use the quadratic formula.'
    solution: |
      The off-diagonal entries are conjugates, so $(A_{12})(A_{21}) = |{{bb}} {{signed: cc}}i|^2 = {{bb^2 + cc^2}}$ and
      $$\det(A - \lambda I) = ({{a}} - \lambda)({{d}} - \lambda) - {{bb^2 + cc^2}} = \lambda^2 {{signed: -(a + d)}}\lambda {{signed: a*d - bb^2 - cc^2}} = 0.$$
      The discriminant is $({{a - d}})^2 + 4\cdot{{bb^2 + cc^2}} = {{(a - d)^2 + 4*(bb^2 + cc^2)}} = {{2*r}}^2$, so
      $$\lambda = \frac{ {{a + d}} \pm {{2*r}} }{2}: \qquad \lambda = {{big}} \text{ or } {{d + u - r}}.$$
      Both are real, as they must be for a Hermitian matrix; the larger is ${{big}}$.
    verify: "max(re(ev) for ev in Matrix([[d + 2*[1, 2, 2, 0, 0, 2, 2, 1, 4][k - 1], sb*[2, 1, 2, 3, 4, 3, 6, 4, 4][k - 1] + sc*[2, 2, 1, 4, 3, 6, 3, 8, 7][k - 1]*I], [sb*[2, 1, 2, 3, 4, 3, 6, 4, 4][k - 1] - sc*[2, 2, 1, 4, 3, 6, 3, 8, 7][k - 1]*I, d]]).eigenvals().keys())"
    covers: [mit-18-06/lecture-26]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 6
  - id: la-sym-011
    difficulty: 2
    type: numeric
    prompt: |
      The symmetric matrix $A = {{A}}$ has $\mathbf{u} = {{row: uj}}$ as an eigenvector. What is the corresponding eigenvalue?
    params:
      j: { int: [1, 3] }
      c: { int: [-2, 2] }
      m1: { int: [-1, 1] }
      m2: { int: [-1, 1] }
      m3: { int: [-1, 1] }
    let:
      u1: "[[1], [2], [2]]"
      u2: "[[2], [1], [-2]]"
      u3: "[[2], [-2], [1]]"
      A: "c*identity(3) + m1*u1*transpose(u1) + m2*u2*transpose(u2) + m3*u3*transpose(u3)"
      uj: "j == 1 ? [1, 2, 2] : (j == 2 ? [2, 1, -2] : [2, -2, 1])"
      ms: "[m1, m2, m3]"
      lam: "c + 9*ms[j]"
    require: ["m1 != m2 or m2 != m3"]
    answer: lam
    hints:
      - 'Multiply $A\mathbf{u}$ and compare with $\mathbf{u}$.'
    solution: |
      $A\mathbf{u} = {{A * uj}}$, which is ${{lam}}$ times $\mathbf{u} = {{uj}}$. So $\lambda = {{lam}}$.

      (Behind the scenes, $A = {{c}}I + \sum_i m_i\mathbf{u}_i\mathbf{u}_i^T$ for the orthogonal vectors $(1, 2, 2), (2, 1, -2), (2, -2, 1)$ of length 3, which is why its
      eigenvalues are ${{c}} + 9m_i$.)
    verify: "(lambda A, u: (A*u).dot(u) / u.dot(u))(c*eye(3) + m1*Matrix([1, 2, 2])*Matrix([[1, 2, 2]]) + m2*Matrix([2, 1, -2])*Matrix([[2, 1, -2]]) + m3*Matrix([2, -2, 1])*Matrix([[2, -2, 1]]), Matrix([[1, 2, 2], [2, 1, -2], [2, -2, 1]][j - 1]))"
    covers: [mit-18-06/lecture-25]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 3
