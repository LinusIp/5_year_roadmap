subject: linear-algebra
topic: orthogonality-and-projections
questions:
  - id: la-proj-001
    difficulty: 1
    type: mc
    prompt: |
      Let $A$ be an $m \times n$ matrix. Which pair of subspaces are **orthogonal complements** of each other in $\mathbb{R}^n$?
    options:
      - "The row space $C(A^T)$ and the null space $N(A)$"
      - "The column space $C(A)$ and the null space $N(A)$"
      - "The row space $C(A^T)$ and the left null space $N(A^T)$"
      - "The column space $C(A)$ and the row space $C(A^T)$"
    answer: 0
    hints:
      - 'Which two of these spaces live in $\mathbb{R}^n$ (vectors with $n$ components)?'
      - 'If $A\mathbf{x} = \mathbf{0}$, every row of $A$ has zero dot product with $\mathbf{x}$.'
    solution: |
      Both $C(A^T)$ and $N(A)$ are subspaces of $\mathbb{R}^n$. If $A\mathbf{x} = \mathbf{0}$, then each row $\mathbf{r}_i$ of $A$ satisfies $\mathbf{r}_i \cdot \mathbf{x} = 0$,
      so $\mathbf{x}$ is orthogonal to every combination of rows: $N(A) \perp C(A^T)$. Their dimensions are $r$ and $n - r$, which add to $n$,
      so each is the **whole** orthogonal complement of the other.

      $C(A)$ and $N(A^T)$ are the complementary pair in $\mathbb{R}^m$; $C(A)$ and $N(A)$ usually live in different spaces altogether.
    verify: "0"
    covers: [mit-18-06/lecture-14]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 2
  - id: la-proj-002
    difficulty: 1
    type: numeric
    prompt: |
      For which value of $k$ are $\mathbf{u} = {{u}}$ and $\mathbf{v} = \begin{bmatrix} {{r}} \\ {{s}} \\ k \end{bmatrix}$ orthogonal?
    params:
      p: { int: [-4, 4] }
      q: { int: [-4, 4], not: [0] }
      r: { int: [-4, 4], not: [0] }
      s: { int: [-4, 4] }
    let:
      u: "[p, q, 1]"
      k: "-(p*r + q*s)"
    answer: k
    hints:
      - 'Two vectors are orthogonal when their dot product is $0$.'
      - 'Write $\mathbf{u} \cdot \mathbf{v}$ with the third component of $\mathbf{v}$ equal to $k$.'
    solution: |
      The dot product is
      $$\mathbf{u} \cdot \mathbf{v} = ({{p}})({{r}}) + ({{q}})({{s}}) + (1)k = {{p*r + q*s}} + k.$$
      Setting this to $0$ gives $k = {{k}}$.
    verify: "solve(Matrix([p, q, 1]).dot(Matrix([r, s, Symbol('kk')])), Symbol('kk'))[0]"
    covers: [mit-18-06/lecture-14]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 2
  - id: la-proj-003
    difficulty: 2
    type: vector
    prompt: |
      Project $\mathbf{b} = {{b}}$ onto the line through $\mathbf{a} = {{a}}$. Enter the projection $\mathbf{p}$ as a list such as `1, 2, 3`.
    params:
      a1: { int: [1, 3] }
      a2: { int: [-2, 2] }
      a3: { int: [-2, 2] }
      m: { int: [-3, 3], not: [0] }
      s: { int: [-2, 2] }
      w: { int: [-2, 2] }
    let:
      a: "[a1, a2, a3]"
      b: "m*a + s*[a2, -a1, 0] + w*[a3, 0, -a1]"
      p: "m*a"
    require: ["s != 0 or w != 0"]
    answer: p
    hints:
      - 'The projection is $\mathbf{p} = \dfrac{\mathbf{a}^T\mathbf{b}}{\mathbf{a}^T\mathbf{a}}\,\mathbf{a}$.'
      - 'Here $\mathbf{a}^T\mathbf{a} = {{dot(a, a)}}$.'
    solution: |
      The projection onto the line through $\mathbf{a}$ is $\mathbf{p} = \hat{x}\,\mathbf{a}$ with $\hat{x} = \dfrac{\mathbf{a}^T\mathbf{b}}{\mathbf{a}^T\mathbf{a}}$.

      $\mathbf{a}^T\mathbf{b} = {{dot(a, b)}}$ and $\mathbf{a}^T\mathbf{a} = {{dot(a, a)}}$, so $\hat{x} = {{m}}$ and
      $$\mathbf{p} = {{m}}\,{{a}} = {{p}}.$$
      Check: the error $\mathbf{b} - \mathbf{p} = {{b - p}}$ has $\mathbf{a} \cdot (\mathbf{b} - \mathbf{p}) = {{dot(a, b - p)}}$, so it is perpendicular to the line.
    verify: "(lambda a, b: (a.dot(b) / a.dot(a)) * a)(Matrix([a1, a2, a3]), m*Matrix([a1, a2, a3]) + s*Matrix([a2, -a1, 0]) + w*Matrix([a3, 0, -a1]))"
    covers: [mit-18-06/lecture-15]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 4
  - id: la-proj-004
    difficulty: 2
    type: numeric
    prompt: |
      What is the distance from the point $\mathbf{b} = {{b}}$ to the line through the origin in the direction $\mathbf{a} = {{a}}$?
    params:
      k: { int: [1, 6] }
      m: { int: [-2, 2] }
      n: { int: [-2, 2], not: [0] }
    let:
      T: "[[3, 4], [4, 3], [5, 12], [12, 5], [6, 8], [8, 15]]"
      a: "squeeze(T[k, :])"
      b: "m*a + n*[-a[2], a[1]]"
      d: "abs(n) * norm(a)"
    answer: d
    hints:
      - 'The distance is the length of the error $\mathbf{e} = \mathbf{b} - \mathbf{p}$, where $\mathbf{p}$ is the projection of $\mathbf{b}$ onto the line.'
      - '$\mathbf{p} = \dfrac{\mathbf{a}^T\mathbf{b}}{\mathbf{a}^T\mathbf{a}}\,\mathbf{a}$ with $\mathbf{a}^T\mathbf{a} = {{dot(a, a)}}$.'
    solution: |
      Project first: $\mathbf{a}^T\mathbf{b} = {{dot(a, b)}}$ and $\mathbf{a}^T\mathbf{a} = {{dot(a, a)}}$, so $\hat{x} = {{m}}$ and $\mathbf{p} = {{m*a}}$.

      The error is $\mathbf{e} = \mathbf{b} - \mathbf{p} = {{b - m*a}}$, which is perpendicular to $\mathbf{a}$. The distance is
      $$\|\mathbf{e}\| = \sqrt{ {{dot(b - m*a, b - m*a)}} } = {{d}}.$$
    verify: "(lambda a, b: (b - (a.dot(b) / a.dot(a)) * a).norm())(Matrix([[3, 4], [4, 3], [5, 12], [12, 5], [6, 8], [8, 15]][k - 1]), Matrix([[3, 4], [4, 3], [5, 12], [12, 5], [6, 8], [8, 15]][k - 1]) * m + n * Matrix([-[[3, 4], [4, 3], [5, 12], [12, 5], [6, 8], [8, 15]][k - 1][1], [[3, 4], [4, 3], [5, 12], [12, 5], [6, 8], [8, 15]][k - 1][0]]))"
    covers: [mit-18-06/lecture-15]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 4
  - id: la-proj-005
    difficulty: 4
    type: matrix
    prompt: |
      Let $P$ be the $3 \times 3$ matrix that projects onto the plane through the origin with normal vector $\mathbf{n} = {{n}}$.
      Every entry of $P$ is a multiple of $\tfrac{1}{9}$, so enter the integer matrix $9P$, as `[[1, 2, 3], [4, 5, 6], [7, 8, 9]]`.
    params:
      k: { int: [1, 6] }
    let:
      N: "[[1, 2, 2], [2, 1, 2], [2, 2, 1], [1, -2, 2], [2, -1, 2], [2, 2, -1]]"
      n: "squeeze(N[k, :])"
      nnT: "[[n[1]], [n[2]], [n[3]]] * [[n[1], n[2], n[3]]]"
      P9: "9*identity(3) - nnT"
    answer: P9
    hints:
      - 'Projecting onto the plane removes the component along $\mathbf{n}$: $P = I - Q$, where $Q$ projects onto the line through $\mathbf{n}$.'
      - '$Q = \dfrac{\mathbf{n}\mathbf{n}^T}{\mathbf{n}^T\mathbf{n}}$, and here $\mathbf{n}^T\mathbf{n} = 9$.'
    solution: |
      The plane is the orthogonal complement of the line through $\mathbf{n}$, so the two projections add to the identity: $P = I - \dfrac{\mathbf{n}\mathbf{n}^T}{\mathbf{n}^T\mathbf{n}}$.

      Here $\mathbf{n}^T\mathbf{n} = 9$ and $\mathbf{n}\mathbf{n}^T = {{nnT}}$, so
      $$9P = 9I - \mathbf{n}\mathbf{n}^T = {{P9}}.$$
      Check: $P\mathbf{n} = \mathbf{0}$ (each row of $9P$ is orthogonal to $\mathbf{n}$) and $P^2 = P$. Its trace is $\tfrac{18}{9} = 2$, the dimension of the plane.
    verify: "(lambda A: 9 * A * (A.T * A).inv() * A.T)(Matrix.hstack(*Matrix([[[1, 2, 2], [2, 1, 2], [2, 2, 1], [1, -2, 2], [2, -1, 2], [2, 2, -1]][k - 1]]).nullspace()))"
    covers: [mit-18-06/lecture-15]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 6
  - id: la-proj-006
    difficulty: 3
    type: multipart
    prompt: |
      Let $A = {{A}}$ and $\mathbf{b} = {{b}}$.
    params:
      a: { int: [-2, 2] }
      c: { int: [-2, 2] }
      x1: { int: [-3, 3] }
      x2: { int: [-3, 3] }
      w: { int: [-2, 2], not: [0] }
    let:
      A: "[[1, 0], [0, 1], [a, c]]"
      p: "A * [x1, x2]"
      err: "w * [-a, -c, 1]"
      b: "p + err"
    parts:
      - prompt: "(a) Find the projection $\\mathbf{p}$ of $\\mathbf{b}$ onto the column space of $A$. Enter it as a list such as `1, 2, 3`."
        type: vector
        answer: p
        verify: "(lambda A, b: A * (A.T * A).inv() * A.T * b)(Matrix([[1, 0], [0, 1], [a, c]]), Matrix([x1, x2, a*x1 + c*x2]) + w * Matrix([-a, -c, 1]))"
      - prompt: "(b) Using your $\\mathbf{p}$, what is $\\|\\mathbf{b} - \\mathbf{p}\\|^2$?"
        type: numeric
        answer: "dot(b - part1, b - part1)"
        verify: "(Matrix([x1, x2, a*x1 + c*x2]) + w * Matrix([-a, -c, 1]) - Matrix(part1)).norm()**2"
    hints:
      - 'Solve $A^TA\hat{\mathbf{x}} = A^T\mathbf{b}$, then $\mathbf{p} = A\hat{\mathbf{x}}$.'
      - 'Here $A^TA = {{transpose(A) * A}}$ and $A^T\mathbf{b} = {{transpose(A) * b}}$.'
      - 'Check that $\mathbf{b} - \mathbf{p}$ is orthogonal to both columns of $A$.'
    solution: |
      (a) The normal equations are $A^TA\hat{\mathbf{x}} = A^T\mathbf{b}$ with
      $$A^TA = {{transpose(A) * A}}, \qquad A^T\mathbf{b} = {{transpose(A) * b}}.$$
      Their solution is $\hat{\mathbf{x}} = {{[x1, x2]}}$ (check: $A^TA\hat{\mathbf{x}} = {{transpose(A) * A * [x1, x2]}}$), so
      $$\mathbf{p} = A\hat{\mathbf{x}} = {{p}}.$$

      (b) $\mathbf{e} = \mathbf{b} - \mathbf{p} = {{err}}$. It is a multiple of ${{row: [-a, -c, 1]}}$, which is orthogonal to both columns of $A$, as it must be.
      So $\|\mathbf{e}\|^2 = {{dot(err, err)}}$.
    covers: [mit-18-06/lecture-15]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 7
  - id: la-proj-007
    difficulty: 2
    type: mc
    prompt: |
      $P$ is the matrix that projects $\mathbb{R}^3$ onto a plane through the origin. Which statement is **false**?
    options:
      - "$P$ is invertible"
      - "$P^2 = P$"
      - "$P^T = P$"
      - "$P$ has eigenvalues $1, 1, 0$"
    answer: 0
    hints:
      - 'What does $P$ do to a vector perpendicular to the plane?'
    solution: |
      A vector $\mathbf{n}$ normal to the plane projects to $P\mathbf{n} = \mathbf{0}$, so $P$ has a non-zero null space and is **not** invertible.

      The others hold: projecting twice changes nothing ($P^2 = P$), $P = A(A^TA)^{-1}A^T$ is symmetric, and $P\mathbf{x} = \mathbf{x}$ for the two independent
      directions in the plane while $P\mathbf{n} = 0\,\mathbf{n}$, giving eigenvalues $1, 1, 0$.
    verify: "0"
    covers: [mit-18-06/lecture-15]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 2
  - id: la-proj-008
    difficulty: 4
    type: proof
    prompt: |
      Prove that $N(A^TA) = N(A)$ for every real matrix $A$. Conclude that $A^TA$ is invertible exactly when the columns of $A$ are independent.
    hints:
      - 'One inclusion is immediate: if $A\mathbf{x} = \mathbf{0}$, what is $A^TA\mathbf{x}$?'
      - 'For the other, multiply $A^TA\mathbf{x} = \mathbf{0}$ on the left by $\mathbf{x}^T$.'
      - '$\mathbf{x}^TA^TA\mathbf{x} = \|A\mathbf{x}\|^2$.'
    solution: |
      **$N(A) \subseteq N(A^TA)$.** If $A\mathbf{x} = \mathbf{0}$ then $A^TA\mathbf{x} = A^T\mathbf{0} = \mathbf{0}$.

      **$N(A^TA) \subseteq N(A)$.** Suppose $A^TA\mathbf{x} = \mathbf{0}$. Then
      $$0 = \mathbf{x}^TA^TA\mathbf{x} = (A\mathbf{x})^T(A\mathbf{x}) = \|A\mathbf{x}\|^2,$$
      and a vector of length zero is the zero vector, so $A\mathbf{x} = \mathbf{0}$.

      So the null spaces are equal. $A^TA$ is square ($n \times n$), so it is invertible exactly when $N(A^TA) = \{\mathbf{0}\}$, that is when
      $N(A) = \{\mathbf{0}\}$, which says the columns of $A$ are independent.
    covers: [mit-18-06/lecture-15, mit-18-06/lecture-16]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 8
  - id: la-proj-009
    difficulty: 2
    type: vector
    prompt: |
      Find a non-zero vector orthogonal to both $\mathbf{u} = {{u}}$ and $\mathbf{v} = {{v}}$ (any non-zero multiple is accepted). Enter it as a list such as `1, 2, 3`.
    params:
      u1: { int: [-3, 3] }
      u2: { int: [-3, 3] }
      u3: { int: [-3, 3] }
      v1: { int: [-3, 3] }
      v2: { int: [-3, 3] }
      v3: { int: [-3, 3] }
    let:
      u: "[u1, u2, u3]"
      v: "[v1, v2, v3]"
      c: "cross(u, v)"
    require: ["norm(c) > 0"]
    answer: c
    upToScale: true
    hints:
      - 'The vectors you want form the null space of the $2 \times 3$ matrix whose rows are $\mathbf{u}^T$ and $\mathbf{v}^T$.'
      - 'In $\mathbb{R}^3$ the cross product $\mathbf{u} \times \mathbf{v}$ is orthogonal to both.'
    solution: |
      A vector $\mathbf{x}$ orthogonal to both satisfies $\mathbf{u}^T\mathbf{x} = 0$ and $\mathbf{v}^T\mathbf{x} = 0$: it lies in the null space of
      $\begin{bmatrix} {{u1}} & {{u2}} & {{u3}} \\ {{v1}} & {{v2}} & {{v3}} \end{bmatrix}$, which is a line because $\mathbf{u}$ and $\mathbf{v}$ are independent.

      The cross product gives a vector on that line:
      $$\mathbf{u} \times \mathbf{v} = {{c}}.$$
      Check: $\mathbf{u} \cdot (\mathbf{u}\times\mathbf{v}) = {{dot(u, c)}}$ and $\mathbf{v} \cdot (\mathbf{u}\times\mathbf{v}) = {{dot(v, c)}}$.
    verify: "Matrix([[u1, u2, u3], [v1, v2, v3]]).nullspace()[0]"
    covers: [mit-18-06/lecture-14]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 3
  - id: la-proj-010
    difficulty: 3
    type: vector
    prompt: |
      Project $\mathbf{b} = {{b}}$ onto the plane through the origin with normal vector $\mathbf{n} = {{n}}$. Enter the projection as a list such as `1, 2, 3`.
    params:
      n1: { int: [1, 3] }
      n2: { int: [-2, 2] }
      n3: { int: [-2, 2] }
      s: { int: [-2, 2] }
      w: { int: [-2, 2] }
      r: { int: [-2, 2], not: [0] }
    let:
      n: "[n1, n2, n3]"
      p: "s*[n2, -n1, 0] + w*[n3, 0, -n1]"
      b: "p + r*n"
    answer: p
    hints:
      - 'Subtract from $\mathbf{b}$ its component along the normal: $\mathbf{p} = \mathbf{b} - \dfrac{\mathbf{n}^T\mathbf{b}}{\mathbf{n}^T\mathbf{n}}\,\mathbf{n}$.'
      - '$\mathbf{n}^T\mathbf{n} = {{dot(n, n)}}$.'
    solution: |
      The plane is $\mathbf{n}^\perp$, so $\mathbf{b}$ splits into a part along $\mathbf{n}$ and a part in the plane. The part along $\mathbf{n}$ is
      $$\frac{\mathbf{n}^T\mathbf{b}}{\mathbf{n}^T\mathbf{n}}\,\mathbf{n} = \frac{ {{dot(n, b)}} }{ {{dot(n, n)}} }\,\mathbf{n} = {{r*n}}.$$
      Removing it leaves
      $$\mathbf{p} = \mathbf{b} - {{r*n}} = {{p}}.$$
      Check: $\mathbf{n} \cdot \mathbf{p} = {{dot(n, p)}}$, so $\mathbf{p}$ lies in the plane.
    verify: "(lambda A, b: A * (A.T * A).inv() * A.T * b)(Matrix.hstack(*Matrix([[n1, n2, n3]]).nullspace()), s*Matrix([n2, -n1, 0]) + w*Matrix([n3, 0, -n1]) + r*Matrix([n1, n2, n3]))"
    covers: [mit-18-06/lecture-15]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 4
  - id: la-proj-011
    difficulty: 5
    type: proof
    prompt: |
      Let $V$ and $W$ be subspaces of $\mathbb{R}^n$ with $V \perp W$ (every vector of $V$ is orthogonal to every vector of $W$) and $\dim V + \dim W = n$.
      Prove that $W = V^\perp$.
    hints:
      - 'First show $W \subseteq V^\perp$; then compare dimensions.'
      - 'A subspace of $V^\perp$ whose dimension equals $\dim V^\perp$ is all of $V^\perp$.'
      - 'Why is $\dim V^\perp = n - \dim V$? Think of $V^\perp$ as the null space of a matrix whose rows are a basis of $V$.'
    solution: |
      **$W \subseteq V^\perp$.** By definition $V^\perp$ is the set of vectors orthogonal to all of $V$, and every $\mathbf{w} \in W$ is.

      **$\dim V^\perp = n - \dim V$.** Let $k = \dim V$ and put a basis of $V$ into the rows of a $k \times n$ matrix $B$. Then $V = C(B^T)$ and
      $V^\perp = N(B)$. Since $B$ has rank $k$, $\dim N(B) = n - k$.

      **Conclusion.** $W$ is a subspace of $V^\perp$ with $\dim W = n - \dim V = \dim V^\perp$. A subspace of a finite-dimensional space with the
      same dimension is the whole space (a basis of $W$ is $n - k$ independent vectors in the $(n-k)$-dimensional $V^\perp$, hence a basis of it).
      Therefore $W = V^\perp$.

      (The hypothesis on dimensions matters: in $\mathbb{R}^3$ two perpendicular lines are orthogonal, but neither is the complement of the other.)
    covers: [mit-18-06/lecture-14]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 10
