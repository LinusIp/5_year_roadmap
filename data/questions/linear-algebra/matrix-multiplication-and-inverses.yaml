subject: linear-algebra
topic: matrix-multiplication-and-inverses
questions:
  - id: la-mul-001
    difficulty: 1
    type: numeric
    prompt: |
      Let $A = {{A}}$ and $B = {{B}}$. What is the entry $(AB)_{ {{i}}{{j}} }$ (row ${{i}}$, column ${{j}}$ of $AB$)?
    params:
      a11: { int: [-3, 3] }
      a12: { int: [-3, 3] }
      a13: { int: [-3, 3] }
      a21: { int: [-3, 3] }
      a22: { int: [-3, 3] }
      a23: { int: [-3, 3] }
      b11: { int: [-3, 3] }
      b12: { int: [-3, 3] }
      b21: { int: [-3, 3] }
      b22: { int: [-3, 3] }
      b31: { int: [-3, 3] }
      b32: { int: [-3, 3] }
      i: { int: [1, 2] }
      j: { int: [1, 2] }
    let:
      A: "[[a11, a12, a13], [a21, a22, a23]]"
      B: "[[b11, b12], [b21, b22], [b31, b32]]"
      AB: "A*B"
      entry: "AB[i, j]"
    answer: entry
    hints:
      - '$(AB)_{ij}$ is (row $i$ of $A$) $\cdot$ (column $j$ of $B$).'
    solution: |
      Row ${{i}}$ of $A$ is ${{row: A[i, :]}}$ and column ${{j}}$ of $B$ is ${{row: B[:, j]}}$. Their dot product is
      $$ ({{A[i,1]}})({{B[1,j]}}) + ({{A[i,2]}})({{B[2,j]}}) + ({{A[i,3]}})({{B[3,j]}}) = {{entry}}. $$
    verify: "(Matrix([[a11, a12, a13], [a21, a22, a23]])*Matrix([[b11, b12], [b21, b22], [b31, b32]]))[i - 1, j - 1]"
    covers: [mit-18-06/lecture-3, game-developer/matrix]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 2

  - id: la-mul-002
    difficulty: 1
    type: mc
    prompt: |
      $A$ is $3 \times 4$ and $B$ is $4 \times 2$. What is the shape of $AB$?
    options:
      - "$3 \\times 2$"
      - "$4 \\times 4$"
      - "$2 \\times 3$"
      - "$AB$ is not defined"
    answer: 0
    hints:
      - '$(m \times n)(n \times p)$ is $m \times p$: the inner sizes must agree and the outer sizes remain.'
    solution: |
      The inner sizes agree ($4 = 4$), so $AB$ is defined. It has as many rows as $A$ and as many columns as $B$: $3 \times 2$.
      (By contrast $BA$ would be $(4 \times 2)(3 \times 4)$, which is not defined.)
    verify: "[(3, 2), (4, 4), (2, 3)].index((zeros(3, 4)*zeros(4, 2)).shape)"
    covers: [mit-18-06/lecture-3, game-developer/matrix]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 1

  - id: la-mul-003
    difficulty: 2
    type: multipart
    prompt: |
      Let $A = {{A}}$ and $B = {{B}}$.

      Enter each matrix as `[[a, b], [c, d]]`.
    params:
      a11: { int: [-3, 3] }
      a12: { int: [-3, 3] }
      a21: { int: [-3, 3] }
      a22: { int: [-3, 3] }
      b11: { int: [-3, 3] }
      b12: { int: [-3, 3] }
      b21: { int: [-3, 3] }
      b22: { int: [-3, 3] }
    let:
      A: "[[a11, a12], [a21, a22]]"
      B: "[[b11, b12], [b21, b22]]"
    require: ["not deepEqual(A*B, B*A)"]
    parts:
      - prompt: "(a) Compute $AB$."
        type: matrix
        answer: "A*B"
        verify: "Matrix([[a11, a12], [a21, a22]])*Matrix([[b11, b12], [b21, b22]])"
      - prompt: "(b) Compute $BA$."
        type: matrix
        answer: "B*A"
        verify: "Matrix([[b11, b12], [b21, b22]])*Matrix([[a11, a12], [a21, a22]])"
    hints:
      - 'Entry $(i, j)$ of a product is row $i$ of the left factor dotted with column $j$ of the right factor.'
      - 'For $BA$ the roles swap: rows of $B$ with columns of $A$.'
    solution: |
      (a) $$ AB = \begin{bmatrix} ({{a11}})({{b11}}) + ({{a12}})({{b21}}) & ({{a11}})({{b12}}) + ({{a12}})({{b22}}) \\ ({{a21}})({{b11}}) + ({{a22}})({{b21}}) & ({{a21}})({{b12}}) + ({{a22}})({{b22}}) \end{bmatrix} = {{A*B}}. $$
      (b) $$ BA = \begin{bmatrix} ({{b11}})({{a11}}) + ({{b12}})({{a21}}) & ({{b11}})({{a12}}) + ({{b12}})({{a22}}) \\ ({{b21}})({{a11}}) + ({{b22}})({{a21}}) & ({{b21}})({{a12}}) + ({{b22}})({{a22}}) \end{bmatrix} = {{B*A}}. $$
      $AB \ne BA$: matrix multiplication is not commutative.
    covers: [mit-18-06/lecture-3, game-developer/matrix]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 4

  - id: la-mul-004
    difficulty: 2
    type: matrix
    prompt: |
      Find the inverse of $A = {{A}}$.

      Enter it as `[[a, b], [c, d]]`.
    params:
      p: { int: [-3, 3], not: [0] }
      q: { int: [-3, 3], not: [0] }
      s: { choice: [1, -1] }
    let:
      A: "[[s + s*p*q, p], [s*q, 1]]"
      Ainv: "round(inv(A))"
    answer: Ainv
    hints:
      - 'For $\begin{bmatrix} a & b \\ c & d \end{bmatrix}$, the inverse is $\dfrac{1}{ad - bc}\begin{bmatrix} d & -b \\ -c & a \end{bmatrix}$.'
      - 'Here $ad - bc = {{det(A)}}$.'
    solution: |
      $\det A = ({{A[1,1]}})(1) - ({{p}})({{s*q}}) = {{round(det(A))}}$. Swap the diagonal entries, change the signs of the off-diagonal ones, and divide by the determinant:
      $$ A^{-1} = \frac{1}{ {{round(det(A))}} }{{[[1, -p], [-s*q, s + s*p*q]]}} = {{Ainv}}. $$
      Check: $AA^{-1} = {{round(A*Ainv)}}$.
    verify: "Matrix([[s + s*p*q, p], [s*q, 1]]).inv()"
    covers: [mit-18-06/lecture-3, game-developer/matrix]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 2

  - id: la-mul-005
    difficulty: 2
    type: mc
    prompt: |
      $A$ and $B$ are invertible $n \times n$ matrices. What is $(AB)^{-1}$?
    options:
      - "$B^{-1}A^{-1}$"
      - "$A^{-1}B^{-1}$"
      - "$A^{-1} + B^{-1}$"
      - "$B^{\\mathsf T}A^{\\mathsf T}$"
    answer: 0
    hints:
      - 'Whatever $(AB)^{-1}$ is, multiplying it by $AB$ must give $I$.'
      - 'Try $(AB)(B^{-1}A^{-1})$ and use associativity.'
    solution: |
      $$ (AB)(B^{-1}A^{-1}) = A(BB^{-1})A^{-1} = AIA^{-1} = AA^{-1} = I, $$
      and in the same way $(B^{-1}A^{-1})(AB) = I$. So $(AB)^{-1} = B^{-1}A^{-1}$: the inverses come in **reverse order**
      (like taking off socks and shoes). $A^{-1}B^{-1}$ only works when $A$ and $B$ happen to commute.
    verify: "(lambda A, B: [i for i, M in enumerate([B.inv()*A.inv(), A.inv()*B.inv(), A.inv() + B.inv(), B.T*A.T]) if M == (A*B).inv()][0])(Matrix([[1, 2], [0, 1]]), Matrix([[1, 0], [3, 1]]))"
    covers: [mit-18-06/lecture-3, game-developer/matrix]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 2

  - id: la-mul-006
    difficulty: 3
    type: matrix
    prompt: |
      Find $A^{-1}$ for
      $$ A = {{A}}. $$
      (Gauss–Jordan on $[A \mid I]$ works; all entries of $A^{-1}$ are integers.)

      Enter it as `[[a, b, c], [d, e, f], [g, h, i]]`.
    params:
      l21: { int: [-2, 2] }
      l31: { int: [-2, 2] }
      l32: { int: [-2, 2] }
      s1: { choice: [1, -1] }
      s2: { choice: [1, -1] }
      s3: { choice: [1, -1] }
      u12: { int: [-2, 2] }
      u13: { int: [-2, 2] }
      u23: { int: [-2, 2] }
    let:
      L: "[[1, 0, 0], [l21, 1, 0], [l31, l32, 1]]"
      U: "[[s1, u12, u13], [0, s2, u23], [0, 0, s3]]"
      A: "L*U"
      Ainv: "round(inv(A))"
    answer: Ainv
    hints:
      - 'Row reduce $[A \mid I]$: eliminate below the pivots, then above them, then divide each row by its pivot. The right half becomes $A^{-1}$.'
      - 'Elimination below the pivots gives $U = {{U}}$, using multipliers $\ell_{21} = {{l21}}$, $\ell_{31} = {{l31}}$, $\ell_{32} = {{l32}}$.'
      - 'Equivalently $A = LU$ with $L = {{L}}$, so $A^{-1} = U^{-1}L^{-1}$.'
    solution: |
      Elimination below the pivots factors $A = LU$ with
      $$ L = {{L}}, \qquad U = {{U}}. $$
      Gauss–Jordan applied to $[L \mid I]$ and $[U \mid I]$ (or directly to $[A \mid I]$) gives
      $$ L^{-1} = {{round(inv(L))}}, \qquad U^{-1} = {{round(inv(U))}}, $$
      and so
      $$ A^{-1} = U^{-1}L^{-1} = {{Ainv}}. $$
      Check: $AA^{-1} = {{round(A*Ainv)}}$. The inverse has integer entries because every pivot is $\pm 1$ ($\det A = {{round(det(A))}}$).
    verify: "(Matrix([[1, 0, 0], [l21, 1, 0], [l31, l32, 1]])*Matrix([[s1, u12, u13], [0, s2, u23], [0, 0, s3]])).inv()"
    covers: [mit-18-06/lecture-3, game-developer/matrix]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 8

  - id: la-mul-007
    difficulty: 3
    type: matrix
    prompt: |
      Let $A = {{A}}$ and $B = {{B}}$. Find the matrix $X$ with $AX = B$.

      Enter it as `[[a, b], [c, d]]`.
    params:
      p: { int: [-2, 2], not: [0] }
      q: { int: [-2, 2], not: [0] }
      s: { choice: [1, -1] }
      b11: { int: [-3, 3] }
      b12: { int: [-3, 3] }
      b21: { int: [-3, 3] }
      b22: { int: [-3, 3] }
    let:
      A: "[[s + s*p*q, p], [s*q, 1]]"
      B: "[[b11, b12], [b21, b22]]"
      Ainv: "round(inv(A))"
      X: "Ainv*B"
    answer: X
    hints:
      - 'Multiply both sides of $AX = B$ on the **left** by $A^{-1}$.'
      - '$A^{-1} = {{Ainv}}$.'
    solution: |
      $\det A = {{round(det(A))}}$, so
      $$ A^{-1} = \frac{1}{ {{round(det(A))}} }{{[[1, -p], [-s*q, s + s*p*q]]}} = {{Ainv}}. $$
      Multiplying $AX = B$ on the left by $A^{-1}$:
      $$ X = A^{-1}B = {{Ainv}}{{B}} = {{X}}. $$
      (Order matters: $BA^{-1}$ would solve $XA = B$ instead.) Check: $AX = {{A*X}} = B$.
    verify: "Matrix([[s + s*p*q, p], [s*q, 1]]).LUsolve(Matrix([[b11, b12], [b21, b22]]))"
    covers: [mit-18-06/lecture-3, game-developer/matrix]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 4

  - id: la-mul-008
    difficulty: 4
    type: matrix
    prompt: |
      Let $\mathbf{u} = {{u}}$ and $\mathbf{v} = {{v}}$, and let $M = I - \mathbf{u}\mathbf{v}^{\mathsf T}$:
      $$ M = {{M}}. $$
      Find $M^{-1}$.

      Enter it as `[[a, b, c], [d, e, f], [g, h, i]]`.
    params:
      u1: { int: [-2, 2] }
      u2: { int: [-2, 2] }
      u3: { int: [-2, 2] }
      v1: { int: [-2, 2] }
      v2: { int: [-2, 2] }
      v3: { int: [-2, 2] }
    let:
      u: "[u1, u2, u3]"
      v: "[v1, v2, v3]"
      uvT: "[[u1], [u2], [u3]] * [[v1, v2, v3]]"
      M: "identity(3) - uvT"
      vu: "dot(v, u)"
      Minv: "round(inv(M))"
    require: ["vu == 0 or vu == 2", "norm(u) > 0", "norm(v) > 0"]
    answer: Minv
    hints:
      - 'Look for an inverse of the same shape: $M^{-1} = I + c\,\mathbf{u}\mathbf{v}^{\mathsf T}$ for some number $c$.'
      - 'Multiply out $(I - \mathbf{u}\mathbf{v}^{\mathsf T})(I + c\,\mathbf{u}\mathbf{v}^{\mathsf T})$ and use that $\mathbf{v}^{\mathsf T}\mathbf{u} = {{vu}}$ is a number.'
    solution: |
      Try $M^{-1} = I + c\,\mathbf{u}\mathbf{v}^{\mathsf T}$. Since $\mathbf{u}\mathbf{v}^{\mathsf T}\mathbf{u}\mathbf{v}^{\mathsf T} = \mathbf{u}(\mathbf{v}^{\mathsf T}\mathbf{u})\mathbf{v}^{\mathsf T} = (\mathbf{v}^{\mathsf T}\mathbf{u})\,\mathbf{u}\mathbf{v}^{\mathsf T}$,
      $$ (I - \mathbf{u}\mathbf{v}^{\mathsf T})(I + c\,\mathbf{u}\mathbf{v}^{\mathsf T}) = I + \big(c - 1 - c\,\mathbf{v}^{\mathsf T}\mathbf{u}\big)\,\mathbf{u}\mathbf{v}^{\mathsf T}. $$
      This is $I$ when $c = \dfrac{1}{1 - \mathbf{v}^{\mathsf T}\mathbf{u}}$. Here $\mathbf{v}^{\mathsf T}\mathbf{u} = {{vu}}$, so $c = {{1 / (1 - vu)}}$ and
      $$ M^{-1} = I {{signed: 1 / (1 - vu)}}\,\mathbf{u}\mathbf{v}^{\mathsf T} = I {{signed: 1 / (1 - vu)}}{{uvT}} = {{Minv}}. $$
      Check: $MM^{-1} = {{round(M*Minv)}}$.
    verify: "(eye(3) - Matrix([u1, u2, u3])*Matrix([[v1, v2, v3]])).inv()"
    covers: [mit-18-06/lecture-3, game-developer/matrix]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 8

  - id: la-mul-009
    difficulty: 3
    type: proof
    prompt: |
      Suppose a square matrix $A$ has a non-zero vector $\mathbf{x}$ with $A\mathbf{x} = \mathbf{0}$. Prove that $A$ has no inverse.
    hints:
      - 'Argue by contradiction: suppose $A^{-1}$ exists.'
      - 'Multiply $A\mathbf{x} = \mathbf{0}$ on the left by $A^{-1}$.'
    solution: |
      Suppose $A^{-1}$ existed. Multiplying $A\mathbf{x} = \mathbf{0}$ on the left by $A^{-1}$ gives
      $$ \mathbf{x} = I\mathbf{x} = A^{-1}A\mathbf{x} = A^{-1}\mathbf{0} = \mathbf{0}, $$
      contradicting $\mathbf{x} \ne \mathbf{0}$. So $A$ is not invertible.
      Put another way: $A$ sends both $\mathbf{x}$ and $\mathbf{0}$ to $\mathbf{0}$, so no matrix can undo $A$.
    covers: [mit-18-06/lecture-3, game-developer/matrix]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 3

  - id: la-mul-010
    difficulty: 2
    type: matrix
    prompt: |
      Let $E = {{E}}$. Compute $E^{ {{n}} }$.

      Enter it as `[[a, b], [c, d]]`.
    params:
      l: { int: [-3, 3], not: [0] }
      n: { int: [2, 6] }
    let:
      E: "[[1, 0], [l, 1]]"
      En: "[[1, 0], [n*l, 1]]"
    answer: En
    hints:
      - 'Compute $E^2$ first and look for the pattern.'
      - '$E$ adds ${{l}}$ times row 1 to row 2. What does doing that ${{n}}$ times do?'
    solution: |
      $E^2 = {{E}}{{E}} = {{E*E}}$. Each multiplication by $E$ adds another ${{l}}$ times row 1 to row 2, so after ${{n}}$ of them
      $$ E^{ {{n}} } = \begin{bmatrix} 1 & 0 \\ {{n}}\cdot({{l}}) & 1 \end{bmatrix} = {{En}}. $$
    verify: "Matrix([[1, 0], [l, 1]])**n"
    covers: [mit-18-06/lecture-3, game-developer/matrix]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 2

  - id: la-mul-011
    difficulty: 4
    type: matrix
    prompt: |
      Find the inverse of
      $$ M = {{M}}. $$
      Enter it as `[[a, b, c, d], [e, f, g, h], [i, j, k, l], [m, n, o, p]]`.
    params:
      a: { int: [-3, 3], not: [0, 1, -1] }
    let:
      M: "[[1, -a, 0, 0], [0, 1, -a, 0], [0, 0, 1, -a], [0, 0, 0, 1]]"
      Minv: "round(inv(M))"
    answer: Minv
    hints:
      - '$M = I - N$, where $N$ has ${{a}}$ on the superdiagonal and zeros elsewhere. What are $N^2, N^3, N^4$?'
      - 'For a number, $1/(1 - x) = 1 + x + x^2 + \dots$. Here the series stops because $N^4 = 0$.'
    solution: |
      Write $M = I - N$ with $N$ having ${{a}}$ just above the diagonal. Each power of $N$ moves those entries one diagonal further up,
      so $N^2$ has ${{a^2}}$ on the second superdiagonal, $N^3$ has ${{a^3}}$ in the corner, and $N^4 = 0$. Then
      $$ (I - N)(I + N + N^2 + N^3) = I - N^4 = I, $$
      so
      $$ M^{-1} = I + N + N^2 + N^3 = {{Minv}}. $$
      Gauss–Jordan on $[M \mid I]$ gives the same result, row by row from the bottom.
    verify: "Matrix([[1, -a, 0, 0], [0, 1, -a, 0], [0, 0, 1, -a], [0, 0, 0, 1]]).inv()"
    covers: [mit-18-06/lecture-3, game-developer/matrix]
    source: Original
    license: CC BY-NC-SA 4.0
    estMinutes: 6
