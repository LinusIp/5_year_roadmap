# The practice subjects and their topics, in teaching order. A daily set works through each subject's topics in
# this order (a topic is done after 15 questions at 80 % or better). Question files live in
# data/questions/<subject>/<topic>.yaml. Topic ids are stable: practice history is stored against them.
#
# `units` (linear algebra only) lists the MIT 18.06 lectures (data/units/mit-18-06.yaml) that teach the topic, so a
# set can follow the user's place in 18.06: at lecture 9, new questions come from the topics of lectures 1-9.
# `covers` are roadmap.sh nodes a topic practises; 85 % accuracy over its last 20 questions ticks them.
- id: linear-algebra
  title: Linear algebra
  short: Linear algebra
  level: MIT 18.06
  follows: mit-18-06
  tracks: [math]
  topics:
    - { id: vectors-and-linear-combinations, title: "Vectors and linear combinations", units: [lecture-1], covers: [game-developer/vector, game-developer/linear-algebra] }
    - { id: dot-product-lengths-angles, title: "Dot product, lengths, angles", units: [lecture-1], covers: [game-developer/vector] }
    - { id: matrices-and-elimination, title: "Matrices and elimination", units: [lecture-2], covers: [game-developer/matrix] }
    - { id: matrix-multiplication-and-inverses, title: "Matrix multiplication and inverses", units: [lecture-3], covers: [game-developer/matrix] }
    - { id: lu-factorisation, title: "LU factorisation", units: [lecture-4] }
    - { id: vector-spaces-and-subspaces, title: "Vector spaces and subspaces", units: [lecture-5] }
    - { id: column-space-and-null-space, title: "Column space and null space", units: [lecture-6, lecture-7] }
    - { id: solving-ax-b-rank, title: "Solving Ax = b, rank", units: [lecture-8] }
    - { id: independence-basis-dimension, title: "Independence, basis, dimension", units: [lecture-9] }
    - { id: four-fundamental-subspaces, title: "The four fundamental subspaces", units: [lecture-10, lecture-11, lecture-12] }
    - { id: orthogonality-and-projections, title: "Orthogonality and projections", units: [lecture-14, lecture-15] }
    - { id: least-squares, title: "Least squares", units: [lecture-16] }
    - { id: gram-schmidt-and-qr, title: "Gram–Schmidt and QR", units: [lecture-17] }
    - { id: determinants, title: "Determinants", units: [lecture-18, lecture-19, lecture-20] }
    - { id: eigenvalues-and-eigenvectors, title: "Eigenvalues and eigenvectors", units: [lecture-21] }
    - { id: diagonalisation-and-powers, title: "Diagonalisation and powers of matrices", units: [lecture-22, lecture-23, lecture-24] }
    - { id: symmetric-matrices, title: "Symmetric matrices", units: [lecture-25, lecture-26] }
    - { id: positive-definite-matrices, title: "Positive definite matrices", units: [lecture-27] }
    - { id: svd, title: "Singular value decomposition", units: [lecture-29, lecture-33] }
    - { id: linear-transformations-and-change-of-basis, title: "Linear transformations and change of basis", units: [lecture-28, lecture-30, lecture-31], covers: [game-developer/linear-transformation] }
- id: calculus
  title: Calculus
  short: Calculus
  level: MIT 18.01 + 18.02
  tracks: [math]
  topics:
    - { id: limits-and-continuity, title: "Limits and continuity" }
    - { id: derivatives-and-rules, title: "Derivatives and rules" }
    - { id: chain-rule-and-implicit-differentiation, title: "Chain rule and implicit differentiation" }
    - { id: applications-of-derivatives, title: "Applications: rates, linear approximation, optimisation" }
    - { id: integrals-and-the-fundamental-theorem, title: "Integrals and the fundamental theorem" }
    - { id: substitution-and-integration-by-parts, title: "Substitution and integration by parts" }
    - { id: applications-of-integrals, title: "Applications: areas, volumes, work, averages" }
    - { id: exponentials-logarithms-lhopital, title: "Exponentials, logarithms, L'Hôpital" }
    - { id: sequences-series-taylor, title: "Sequences and series, Taylor series" }
    - { id: vectors-dot-and-cross-product, title: "Vectors and the dot/cross product" }
    - { id: partial-derivatives-and-gradients, title: "Partial derivatives and gradients" }
    - { id: directional-derivatives-and-tangent-planes, title: "Directional derivatives and tangent planes" }
    - { id: multivariable-optimisation-lagrange, title: "Multivariable optimisation and Lagrange multipliers" }
    - { id: double-and-triple-integrals, title: "Double and triple integrals" }
    - { id: line-integrals-and-greens-theorem, title: "Line integrals and Green's theorem" }
    - { id: flux-divergence-curl, title: "Flux, divergence and curl (intro)" }
