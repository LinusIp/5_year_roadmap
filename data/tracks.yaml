# The sixteen tracks of the data model. `slot` picks one of the eight validated categorical
# colours (src/index.css: --series-1 … --series-8). Tracks of one family share a colour; the
# name carries the identity. Order here is the order used in legends and stacked charts.
- { id: ai,         name: AI & ML,              family: AI & ML,                      slot: 1, summary: "Machine learning, deep learning, LLMs and agents." }
- { id: swe,        name: Software engineering, family: Software & systems,           slot: 2, summary: "CS foundations, tooling, algorithms and engineering practice." }
- { id: systems,    name: Systems & scale,      family: Software & systems,           slot: 2, summary: "Operating systems, databases, networks, distributed and scalable systems." }
- { id: graphics,   name: Graphics,             family: "Graphics, simulation & games", slot: 3, summary: "OpenGL, Vulkan, rendering and shaders." }
- { id: simulation, name: Simulation,           family: "Graphics, simulation & games", slot: 3, summary: "Custom physics engines: rigid bodies, cloth, fluids, FEM." }
- { id: gamedev,    name: Game development,     family: "Graphics, simulation & games", slot: 3, summary: "Finished games, jams and engine work." }
- { id: languages,  name: Languages,            family: Languages,                    slot: 4, summary: "Python, C, C++, Rust, Go and the domain languages of each stage." }
- { id: math,       name: Mathematics,          family: Math & science,               slot: 5, summary: "Linear algebra, calculus, differential equations, probability." }
- { id: physics,    name: Physics,              family: Math & science,               slot: 5, summary: "Mechanics, E&M, waves, quantum." }
- { id: chem,       name: Chemistry,            family: Math & science,               slot: 5, summary: "Solid-state chemistry, thermodynamics and kinetics." }
- { id: ee,         name: Electrical,           family: Electrical & embedded,        slot: 6, summary: "Circuits, electronics, signals, power, PCB design." }
- { id: embedded,   name: Embedded,             family: Electrical & embedded,        slot: 6, summary: "Microcontrollers, firmware, FPGAs and digital design." }
- { id: controls,   name: Controls,             family: Electrical & embedded,        slot: 6, summary: "Feedback systems, DSP and control theory." }
- { id: mech,       name: Mechanical,           family: Mechanical & robotics,        slot: 7, summary: "Mechanics of materials, dynamics, thermal-fluids, CAD, manufacturing." }
- { id: robotics,   name: Robotics,             family: Mechanical & robotics,        slot: 7, summary: "Kinematics, planning, ROS 2 and mechatronics." }
- { id: career,     name: Career & review,      family: Career & review,              slot: 8, summary: "Reviews, portfolio, write-ups and certification admin." }
