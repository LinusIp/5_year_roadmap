# The five roadmap.sh roadmaps the user follows (brief, "Roadmap tracks"). Node labels come from the PDFs the user
# supplied; ids are slugs of the labels. Each section names the phase that teaches it. `optional: true` marks nodes
# the coverage rule leaves out: vendor-specific enterprise items, engine-specific nodes, and long lists of
# interchangeable tools where one is enough. A roadmap is "mastered" at 90 % of its other nodes plus a done
# credential-map row (`subject`).

- id: inference-engineering
