# Block A projects: the work the graphics / rendering / simulation lane carries itself. Since the brief of
# 2026-10-07 games are not the subject: one finished small game closes the loop (monthly project 5), and
# stage 2's simulators follow. Block D carries the numbered builds (monthly-stage-*.yaml).

- id: a-small-game-1
  title: One finished small game (close the GameDevHQ loop)
  cadence: monthly
  tracks:
    - gamedev
  phaseId: y1-p0
  estHours: 70
  subject: gamedev
  brief: "Take one small idea to 'finished' in the engine you already know: menu, one complete loop of play, an ending, sound, a build that runs on someone else's machine. This closes the game loop; from here games are a vehicle for graphics and physics work."
  acceptance:
    - "Playable from start to end without the editor: title screen, play, win or lose, restart"
    - A downloadable or web build published on itch.io
    - Public repository with a README and a list of what was cut to ship it
  skills:
    - scoping
    - game loop
    - finishing
  number: 5
- id: a-dsp-visualiser
  title: Signal and DSP visualiser
  cadence: monthly
  tracks:
    - simulation
    - controls
    - graphics
  phaseId: y4
  estHours: 80
  subject: signals-control
  brief: "A desktop tool in your own renderer that shows what 6.003 teaches: signals in time and frequency, filters being designed and applied, poles and zeros being dragged while the response updates."
  acceptance:
    - Live FFT and spectrogram of generated signals and of audio input
    - FIR and IIR filter design with the magnitude and phase response drawn, applied to a signal in real time
    - A draggable pole-zero plot that drives the impulse and frequency responses
  skills:
    - FFT
    - filter design
    - real-time plotting
  parts: []
- id: a-multibody-dynamics
  title: Multibody dynamics in your own engine
  cadence: monthly
  tracks:
    - simulation
    - mech
  phaseId: y4
  estHours: 150
  subject: simulation
  brief: "Extend the Stage 1 engine from game physics to engineering dynamics: articulated bodies with joints and motors, solved accurately enough to predict a real mechanism. This is what the inverted pendulum (project 45) and the year 4 capstone are simulated in."
  acceptance:
    - Revolute and prismatic joints with limits and motors; a double pendulum conserves energy to a stated tolerance
    - A cart-pole model whose response matches the analytical linearisation near upright
    - Parameters (masses, inertias, friction) loaded from a file so that a real rig can be described
  skills:
    - constrained dynamics
    - numerical integration
    - model validation
  parts: []
- id: a-vehicle-simulator
  title: Vehicle or mobile-robot simulator
  cadence: monthly
  tracks:
    - simulation
    - robotics
    - mech
  phaseId: y5
  estHours: 120
  subject: simulation
  brief: "The 'vehicle' half of the year 5 simulators (the robot arm is project 54): a wheeled vehicle or differential-drive robot with tyre or wheel-ground models, sensors and a controller in the loop, in your own engine."
  acceptance:
    - A vehicle model with suspension or a differential-drive robot with wheel slip, validated against a hand calculation
    - Simulated sensors (IMU, encoders, a range sensor) with noise
    - A path-following controller that runs unchanged against the simulator and, later, a real robot
  skills:
    - vehicle dynamics
    - sensor models
    - hardware-in-the-loop interfaces
  parts: []
