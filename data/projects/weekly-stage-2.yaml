# Weekly mini-builds, stage 2 (electrical and mechanical): 2-6 hours each, most of them at the bench.
# `parts` lists what the card needs beyond the standing bench of project 36.

# ---- circuits and measurement
- { id: w-ee-rc-bode, title: "Measure an RC filter's Bode plot", cadence: weekly, stage: 2, tracks: [ee], estHours: 3, brief: "Sweep a first-order RC low-pass by hand with a function generator and a scope; plot magnitude and phase against the theory.", acceptance: ["Measured and theoretical curves on one plot", "The corner frequency error explained by component tolerance"], parts: ["Resistors, capacitors, function generator, oscilloscope"] }
- { id: w-ee-voltage-divider-loading, title: "Load a voltage divider until it lies", cadence: weekly, stage: 2, tracks: [ee], estHours: 2, brief: "Measure a divider's output under several loads, including your own multimeter and scope probe, and derive its Thevenin equivalent.", acceptance: ["Thevenin resistance from measurement matches the calculation"], parts: ["Resistor kit, multimeter"] }
- { id: w-ee-rlc-resonance, title: "RLC resonance and Q", cadence: weekly, stage: 2, tracks: [ee], estHours: 3, brief: "Build a series RLC circuit, find its resonance, measure Q from the bandwidth and from the ring-down.", acceptance: ["Two independent Q measurements that agree", "The inductor's series resistance inferred"], parts: ["Inductor, capacitors, resistors, function generator, oscilloscope"] }
- { id: w-ee-diode-curve, title: "Trace a diode's I-V curve", cadence: weekly, stage: 2, tracks: [ee], estHours: 2, brief: "Measure a silicon diode, a Schottky and an LED, and fit the Shockley equation to each.", acceptance: ["Three curves with fitted ideality factors"], parts: ["1N4148, a Schottky diode, LEDs, bench supply, multimeter"] }
- { id: w-ee-opamp-limits, title: "Find an op-amp's limits", cadence: weekly, stage: 2, tracks: [ee], estHours: 3, brief: "Measure gain-bandwidth product, slew rate and output swing of a cheap op-amp and compare with its datasheet.", acceptance: ["Each measured number next to the datasheet's typical value"], parts: ["LM358 or TL072, resistors, function generator, oscilloscope"] }
- { id: w-ee-mosfet-switch, title: "Switch a load with a MOSFET, properly", cadence: weekly, stage: 2, tracks: [ee], estHours: 3, brief: "Drive a motor or LED strip from a logic-level MOSFET; scope the gate and drain; add the flyback diode and see what it fixes.", acceptance: ["Scope captures with and without the flyback diode", "Switching loss estimated from the waveforms"], parts: ["Logic-level N-MOSFET, flyback diode, small motor or LED strip"] }
- { id: w-ee-linear-vs-buck, title: "Linear regulator against a buck converter", cadence: weekly, stage: 2, tracks: [ee], estHours: 3, brief: "Power the same load from an LDO and from a buck module; measure efficiency, ripple and temperature.", acceptance: ["Efficiency against load current for both", "Ripple measured with a proper probe ground"], parts: ["LDO regulator, buck converter module, electronic or resistor load"] }
- { id: w-ee-spice-vs-bench, title: "Predict, then measure: a common-emitter amplifier", cadence: weekly, stage: 2, tracks: [ee], estHours: 4, brief: "Design for a target gain, simulate in ngspice or LTspice, build it, and reconcile the three answers.", acceptance: ["Designed, simulated and measured gain and bias point in one table"], parts: ["2N3904, resistors, capacitors"] }
- { id: w-ee-555-timer, title: "A 555 from astable to PWM dimmer", cadence: weekly, stage: 2, tracks: [ee], estHours: 2, brief: "Build the astable, predict its frequency, then turn it into a PWM dimmer.", acceptance: ["Frequency within tolerance of the formula", "Duty cycle sweeps over a useful range"], parts: ["NE555, potentiometer, LED or small lamp"] }
- { id: w-ee-kicad-breakout, title: "A breakout board in KiCad in one sitting", cadence: weekly, stage: 2, tracks: [ee], estHours: 4, brief: "Schematic to fabrication files for a small sensor breakout, including a custom footprint.", acceptance: ["Design-rule check clean", "Footprint checked against the datasheet at 1:1 on paper"] }
- { id: w-ee-solder-smd, title: "Surface-mount soldering practice", cadence: weekly, stage: 2, tracks: [ee], estHours: 3, brief: "Assemble a practice board down to 0603 parts and a fine-pitch IC; inspect every joint under magnification.", acceptance: ["Every joint inspected; rework done where needed", "The board works"], parts: ["SMD practice kit, flux, fine solder, tweezers, magnifier"] }

# ---- signals and control
- { id: w-ctl-sampling-aliasing, title: "Make aliasing happen", cadence: weekly, stage: 2, tracks: [controls, embedded], estHours: 2, brief: "Sample a swept sine with a microcontroller ADC and watch it fold; then add an anti-aliasing filter.", acceptance: ["Spectra before and after the filter"], parts: ["Microcontroller board, function generator, RC filter parts"] }
- { id: w-ctl-fir-filter, title: "Design and run an FIR filter", cadence: weekly, stage: 2, tracks: [controls], estHours: 3, brief: "Window-method low-pass designed in Python, then run in C on recorded data.", acceptance: ["Measured frequency response matches the design", "Fixed-point version within a stated error of the floating-point one"] }
- { id: w-ctl-pid-sim, title: "Tune a PID on a simulated plant, three ways", cadence: weekly, stage: 2, tracks: [controls], estHours: 3, brief: "Ziegler-Nichols, pole placement and hand tuning on the same second-order plant.", acceptance: ["Step responses overlaid, with overshoot and settling time in a table"] }
- { id: w-ctl-step-identification, title: "Identify a system from its step response", cadence: weekly, stage: 2, tracks: [controls], estHours: 3, brief: "Record the step response of a real thing (a heater, a motor, an RC network) and fit a first- or second-order model.", acceptance: ["Model and measurement overlaid", "The model predicts a second experiment it was not fitted to"], parts: ["Whatever you are identifying, plus a way to log it"] }
- { id: w-ctl-kalman-1d, title: "A one-dimensional Kalman filter", cadence: weekly, stage: 2, tracks: [controls], estHours: 3, brief: "Fuse a noisy position sensor with a motion model; then break it by lying about the noise.", acceptance: ["Filtered, raw and true signals on one plot", "What mis-set covariances do, shown"] }
- { id: w-ctl-bode-by-hand, title: "Bode plots by hand, then by computer", cadence: weekly, stage: 2, tracks: [controls], estHours: 2, brief: "Sketch five transfer functions' Bode plots with straight-line rules, then check them.", acceptance: ["Sketches and computed plots side by side", "Gain and phase margins read off both"] }

# ---- embedded and digital
- { id: w-emb-debounce, title: "Debounce a button in firmware", cadence: weekly, stage: 2, tracks: [embedded], estHours: 2, brief: "Capture real switch bounce on a scope, then debounce it in firmware with a timer and a small state machine.", acceptance: ["A scope capture of the bounce", "Ten thousand presses counted without an error"], parts: ["Push button, microcontroller board, oscilloscope or logic analyser"] }
- { id: w-emb-blinky-no-hal, title: "Blink an LED from the reference manual", cadence: weekly, stage: 2, tracks: [embedded], estHours: 3, brief: "No HAL, no generated code: enable the clock, set the pin mode, toggle the bit, with a timer interrupt for the delay.", acceptance: ["Every register write has a comment citing the manual section"], parts: ["STM32 Nucleo board"] }
- { id: w-emb-uart-ring, title: "Interrupt-driven UART with your ring buffer", cadence: weekly, stage: 2, tracks: [embedded, languages], estHours: 3, brief: "Reuse the ring buffer card from stage 1 behind UART receive and transmit interrupts.", acceptance: ["No bytes lost at 115200 baud under a flood test"], parts: ["Microcontroller board, USB-serial adapter"] }
- { id: w-emb-i2c-sensor, title: "Write an I2C sensor driver from the datasheet", cadence: weekly, stage: 2, tracks: [embedded], estHours: 4, brief: "Pick a sensor you have no library for and get calibrated readings out of it.", acceptance: ["Logic-analyser capture annotated with the protocol", "Readings match a reference instrument"], parts: ["I2C sensor breakout, logic analyser"] }
- { id: w-emb-pwm-servo, title: "Drive a hobby servo with a hardware timer", cadence: weekly, stage: 2, tracks: [embedded, robotics], estHours: 2, brief: "Generate the 50 Hz pulse train from a timer peripheral and sweep the servo smoothly.", acceptance: ["Pulse width verified on a scope", "Motion eased rather than stepped"], parts: ["Hobby servo, 5 V supply"] }
- { id: w-emb-low-power-sleep, title: "Measure sleep current", cadence: weekly, stage: 2, tracks: [embedded, ee], estHours: 3, brief: "Put a microcontroller into its deepest sleep, wake it from a timer, and measure the current in every state.", acceptance: ["A table of current per state", "Battery life estimated for a duty cycle you chose"], parts: ["Microcontroller board with accessible supply jumper, precision shunt or power profiler"] }
- { id: w-emb-rust-blinky, title: "Blinky in embedded Rust", cadence: weekly, stage: 2, tracks: [embedded, languages], estHours: 3, brief: "A no_std Rust program on a real board, flashed with probe-rs, with defmt logging.", acceptance: ["Builds in CI", "A panic handler you chose on purpose"], parts: ["A board supported by a Rust HAL crate, debug probe"] }
- { id: w-fpga-counter-7seg, title: "Counter to a seven-segment display on an FPGA", cadence: weekly, stage: 2, tracks: [embedded], estHours: 3, brief: "A clock divider, a counter and a decoder, each with a testbench, then on hardware.", acceptance: ["Simulation waveforms for each module", "Timing report read and understood"], parts: ["FPGA board with a seven-segment display or a PMOD"] }
- { id: w-fpga-fsm-traffic, title: "A traffic-light state machine in Verilog", cadence: weekly, stage: 2, tracks: [embedded], estHours: 3, brief: "A Moore machine with a pedestrian request, written with a clean three-block style and verified in simulation.", acceptance: ["A self-checking testbench", "No inferred latches in the synthesis log"], parts: ["FPGA board, LEDs"] }
- { id: w-fpga-pwm-audio, title: "PWM audio from an FPGA", cadence: weekly, stage: 2, tracks: [embedded, controls], estHours: 4, brief: "Play a sine table through a PWM output and an RC filter; then a square-wave melody.", acceptance: ["Output spectrum captured", "The filter corner justified"], parts: ["FPGA board, RC filter parts, small speaker or amplifier"] }

# ---- mechanical, CAD and manufacturing
- { id: w-mech-snap-fit, title: "Model and print a snap-fit", cadence: weekly, stage: 2, tracks: [mech], estHours: 3, brief: "Design a cantilever snap-fit from the beam equations, print it, and cycle it until it fails.", acceptance: ["Predicted and measured deflection force", "Cycles to failure, and what you changed for version two"], parts: ["3D printer, filament, calipers"] }
- { id: w-mech-truss, title: "Hand-solve then simulate a truss", cadence: weekly, stage: 2, tracks: [mech, simulation], estHours: 3, brief: "Solve a small planar truss by the method of joints, then with a direct-stiffness script of your own.", acceptance: ["Member forces agree", "The script handles a truss too large to do by hand"] }
- { id: w-mech-tolerance-test, title: "Print a tolerance test and learn your printer", cadence: weekly, stage: 2, tracks: [mech], estHours: 2, brief: "Holes, pegs and gaps from 0.1 to 0.5 mm clearance: find what your printer really produces.", acceptance: ["A clearance table for press, slip and loose fits on your machine"], parts: ["3D printer, filament, calipers"] }
- { id: w-mech-beam-deflection, title: "Measure a beam's deflection", cadence: weekly, stage: 2, tracks: [mech], estHours: 3, brief: "Load a cantilevered ruler or printed beam with known weights and compare with Euler-Bernoulli.", acceptance: ["Deflection against load, measured and predicted", "Young's modulus inferred and compared with a reference value"], parts: ["Beam sample, weights, dial indicator or calipers"] }
- { id: w-mech-drawing, title: "A proper engineering drawing of one part", cadence: weekly, stage: 2, tracks: [mech], estHours: 3, brief: "Orthographic views, a section, dimensions, tolerances and a title block for a part you designed.", acceptance: ["Someone else can make the part from the drawing alone"] }
- { id: w-mech-fastener-joint, title: "Design a bolted joint", cadence: weekly, stage: 2, tracks: [mech], estHours: 2, brief: "Size the bolts, preload and clearance holes for a bracket carrying a stated load, with a factor of safety.", acceptance: ["Calculation sheet with every assumption stated", "Checked against a fastener handbook table"] }
- { id: w-mech-gear-pair, title: "Generate and print an involute gear pair", cadence: weekly, stage: 2, tracks: [mech], estHours: 4, brief: "Generate involute profiles from the module and tooth count in CAD or by script; print a meshing pair.", acceptance: ["Centre distance matches the calculation", "Backlash measured"], parts: ["3D printer, filament, two shafts or pins"] }
- { id: w-mech-cadquery-part, title: "One parametric part by script", cadence: weekly, stage: 2, tracks: [mech, languages], estHours: 3, brief: "A bracket, enclosure or knob generated entirely from a CadQuery script with parameters at the top.", acceptance: ["Three variants exported from one script", "One of them printed"], source: "CadQuery documentation", sourceUrl: "https://cadquery.readthedocs.io/en/latest/" }
- { id: w-mech-heat-fin, title: "Cooling curve of a hot object", cadence: weekly, stage: 2, tracks: [mech, physics], estHours: 3, brief: "Log an object cooling in still and moving air; fit Newton's law of cooling and extract the convection coefficient.", acceptance: ["Fitted time constants for both cases", "A sanity check of the coefficient against textbook ranges"], parts: ["Thermocouple or thermistor with a logger, small fan"] }
- { id: w-mech-four-bar, title: "Four-bar linkage coupler curves", cadence: weekly, stage: 2, tracks: [mech, robotics, simulation], estHours: 3, brief: "Solve a four-bar's position analysis and animate its coupler curve; classify it with Grashof's condition.", acceptance: ["Animation for a crank-rocker and a double-rocker", "One linkage printed and compared with the animation"] }

# ---- robotics
- { id: w-rob-forward-kinematics, title: "Forward kinematics with the product of exponentials", cadence: weekly, stage: 2, tracks: [robotics, math], estHours: 3, brief: "Compute the end-effector pose of a 3R arm with screw axes, and check it against the Modern Robotics library.", acceptance: ["Matches the library to numerical precision", "A plot of the workspace"] }
- { id: w-rob-ros2-pubsub, title: "A ROS 2 publisher, subscriber and launch file", cadence: weekly, stage: 2, tracks: [robotics, languages], estHours: 3, brief: "One node in C++ and one in Python talking over a topic, started from a launch file with parameters.", acceptance: ["ros2 topic echo shows the data", "Quality-of-service settings chosen on purpose and explained"] }
- { id: w-rob-imu-complementary, title: "Tilt from an IMU with a complementary filter", cadence: weekly, stage: 2, tracks: [robotics, controls, embedded], estHours: 3, brief: "Fuse accelerometer and gyroscope into a drift-free tilt estimate, and plot it live.", acceptance: ["Gyro-only, accelerometer-only and fused estimates on one plot during a shake test"], parts: ["IMU breakout, microcontroller board"] }
- { id: w-rob-trajectory, title: "Minimum-jerk point-to-point trajectories", cadence: weekly, stage: 2, tracks: [robotics, math], estHours: 2, brief: "Quintic time scaling between two poses, with velocity and acceleration limits respected.", acceptance: ["Position, velocity and acceleration plotted; limits never exceeded"] }
