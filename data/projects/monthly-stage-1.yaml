# Monthly projects 1-34 (Stage 1, software). Block D carries them in this order; number 35 is the
# Stage 1 capstone (capstones.yaml). 20-40 hours each. A project is only `done` once its repo URL is filled in.
# `sourceUrl` links were verified on 2026-09-20 (the build-your-own-x ones down to the category anchor).

