# One card for each category of codecrafters-io/build-your-own-x, linked to the category's section
# (all 29 anchors were checked against the rendered README on 2026-09-20).
# Ten categories are already numbered monthly projects and carry the link there:
#   Neural Network (5), Game (6), Shell (7), Git (9), 3D Renderer (12), Memory Allocator (14),
#   Physics Engine (15), Database (19), Web Server (21), Processor (43).
# The other nineteen are below: an unplanned pool for "Pick my next project" and for months that go off-script.

- { id: byox-ai-model, title: "Build your own AI model", cadence: monthly, stage: 1, tracks: [ai], estHours: 30, brief: "Follow one of the from-scratch model tutorials end to end, then change something the tutorial did not: the dataset, the architecture or the training recipe.", acceptance: ["The tutorial's result reproduced", "One change of your own, with its effect measured"], source: "build-your-own-x: AI Model", sourceUrl: "https://github.com/codecrafters-io/build-your-own-x#build-your-own-ai-model" }
- { id: byox-augmented-reality, title: "Build your own augmented reality", cadence: monthly, stage: 1, tracks: [graphics, ai], estHours: 30, brief: "Marker tracking and pose estimation from a webcam, with a 3D object drawn in place.", acceptance: ["The object stays attached to the marker as the camera moves", "Camera calibration done by you"], source: "build-your-own-x: Augmented Reality", sourceUrl: "https://github.com/codecrafters-io/build-your-own-x#build-your-own-augmented-reality" }
- { id: byox-bittorrent-client, title: "Build your own BitTorrent client", cadence: monthly, stage: 1, tracks: [systems], estHours: 35, brief: "Parse a torrent file, talk to a tracker, speak the peer wire protocol and download a legal test torrent from several peers at once.", acceptance: ["Downloads a real file and verifies every piece hash", "Several peers in parallel with a rarest-first or sequential strategy"], source: "build-your-own-x: BitTorrent Client", sourceUrl: "https://github.com/codecrafters-io/build-your-own-x#build-your-own-bittorrent-client" }
- { id: byox-blockchain, title: "Build your own blockchain", cadence: monthly, stage: 1, tracks: [systems], estHours: 30, brief: "A toy chain with proof of work, transactions, a mempool and a few nodes that reach agreement over a network.", acceptance: ["Three nodes converge on the longest chain after a partition", "Tampering with a block is detected"], source: "build-your-own-x: Blockchain / Cryptocurrency", sourceUrl: "https://github.com/codecrafters-io/build-your-own-x#build-your-own-blockchain--cryptocurrency" }
- { id: byox-bot, title: "Build your own bot", cadence: weekly, stage: 1, tracks: [swe, languages], estHours: 5, brief: "A chat bot for a platform you use, with two commands that are useful to you.", acceptance: ["Deployed and running for a week", "Secrets kept out of the repository"], source: "build-your-own-x: Bot", sourceUrl: "https://github.com/codecrafters-io/build-your-own-x#build-your-own-bot" }
- { id: byox-command-line-tool, title: "Build your own command-line tool", cadence: weekly, stage: 1, tracks: [swe, languages], estHours: 5, brief: "A small tool that scratches an itch of yours, in the language of the month, with the conventions of a good CLI.", acceptance: ["--help, exit codes and stdin/stdout behave as Unix users expect", "Installable with the language's package manager"], source: "build-your-own-x: Command-Line Tool", sourceUrl: "https://github.com/codecrafters-io/build-your-own-x#build-your-own-command-line-tool" }
- { id: byox-docker, title: "Build your own Docker", cadence: monthly, stage: 1, tracks: [systems], estHours: 30, brief: "Beyond the 100-line container: pull an image from a registry, unpack its layers, and run it with namespaces, cgroups and a virtual network.", acceptance: ["Runs an image pulled from a public registry", "Resource limits and a bridged network that work"], source: "build-your-own-x: Docker", sourceUrl: "https://github.com/codecrafters-io/build-your-own-x#build-your-own-docker" }
- { id: byox-emulator, title: "Build your own emulator", cadence: monthly, stage: 1, tracks: [systems, gamedev], estHours: 35, brief: "CHIP-8 in a weekend, then a Game Boy or NES CPU core that passes a public test ROM suite.", acceptance: ["CHIP-8 runs commercial-era ROMs", "The second CPU core passes its instruction test ROMs"], source: "build-your-own-x: Emulator / Virtual Machine", sourceUrl: "https://github.com/codecrafters-io/build-your-own-x#build-your-own-emulator--virtual-machine" }
- { id: byox-frontend-framework, title: "Build your own front-end framework", cadence: monthly, stage: 1, tracks: [swe], estHours: 25, brief: "A virtual DOM with diffing, components with state, and a to-do app written in it.", acceptance: ["Keyed list reconciliation that does not re-create unchanged nodes (shown with a counter)", "A to-do app built on it"], source: "build-your-own-x: Front-end Framework / Library", sourceUrl: "https://github.com/codecrafters-io/build-your-own-x#build-your-own-front-end-framework--library" }
- { id: byox-network-stack, title: "Build your own network stack", cadence: monthly, stage: 1, tracks: [systems], estHours: 40, brief: "A user-space TCP/IP stack on a TUN/TAP device: Ethernet, ARP, IP, ICMP, then enough TCP to fetch a web page.", acceptance: ["Answers ping", "Completes a TCP handshake and an HTTP request against a real server"], source: "build-your-own-x: Network Stack", sourceUrl: "https://github.com/codecrafters-io/build-your-own-x#build-your-own-network-stack" }
- { id: byox-operating-system, title: "Build your own operating system", cadence: monthly, stage: 1, tracks: [systems], estHours: 40, brief: "A bootable kernel of your own: boot, print, handle interrupts, manage memory, and run a user-mode program.", acceptance: ["Boots in QEMU from your own image", "Keyboard interrupts, paging and one system call working"], source: "build-your-own-x: Operating System", sourceUrl: "https://github.com/codecrafters-io/build-your-own-x#build-your-own-operating-system" }
- { id: byox-programming-language, title: "Build your own programming language", cadence: monthly, stage: 1, tracks: [swe, languages], estHours: 40, brief: "A small language with functions and closures: lexer, parser, tree-walking interpreter, then a bytecode compiler and VM.", acceptance: ["Runs recursive Fibonacci and a closure-based counter", "The bytecode VM beats the tree-walker on a benchmark"], source: "build-your-own-x: Programming Language", sourceUrl: "https://github.com/codecrafters-io/build-your-own-x#build-your-own-programming-language" }
- { id: byox-regex-engine, title: "Build your own regex engine", cadence: monthly, stage: 1, tracks: [swe], estHours: 25, brief: "The full version of the weekly card: parse to an AST, compile to an NFA, add capture groups, character classes and lazy quantifiers.", acceptance: ["Passes a test suite borrowed from an existing engine", "Linear time on the patterns that make backtracking engines explode"], source: "build-your-own-x: Regex Engine", sourceUrl: "https://github.com/codecrafters-io/build-your-own-x#build-your-own-regex-engine" }
- { id: byox-search-engine, title: "Build your own search engine", cadence: monthly, stage: 1, tracks: [systems, ai], estHours: 30, brief: "Crawl a corner of the web, build an inverted index, rank with BM25, and serve queries quickly.", acceptance: ["Index of at least 50,000 documents", "Queries answered in under 50 ms; ranking judged on twenty test queries"], source: "build-your-own-x: Search Engine", sourceUrl: "https://github.com/codecrafters-io/build-your-own-x#build-your-own-search-engine" }
- { id: byox-template-engine, title: "Build your own template engine", cadence: weekly, stage: 1, tracks: [swe], estHours: 5, brief: "Variables, loops, conditionals and escaping, compiled to a function rather than interpreted on each render.", acceptance: ["HTML escaping on by default", "Compiled templates measurably faster than re-parsing"], source: "build-your-own-x: Template Engine", sourceUrl: "https://github.com/codecrafters-io/build-your-own-x#build-your-own-template-engine" }
- { id: byox-text-editor, title: "Build your own text editor", cadence: monthly, stage: 1, tracks: [swe, languages], estHours: 30, brief: "A terminal editor in C in the style of kilo: raw mode, a row buffer, search, and syntax highlighting.", acceptance: ["Opens, edits and saves real files without corrupting them", "Incremental search and highlighting for one language"], source: "build-your-own-x: Text Editor", sourceUrl: "https://github.com/codecrafters-io/build-your-own-x#build-your-own-text-editor" }
- { id: byox-visual-recognition, title: "Build your own visual recognition system", cadence: monthly, stage: 1, tracks: [ai], estHours: 25, brief: "A recognition pipeline on your own images: detection or face recognition with a model you fine-tuned.", acceptance: ["Evaluated on images the model never saw, with precision and recall", "Runs on a webcam stream"], source: "build-your-own-x: Visual Recognition System", sourceUrl: "https://github.com/codecrafters-io/build-your-own-x#build-your-own-visual-recognition-system" }
- { id: byox-voxel-engine, title: "Build your own voxel engine", cadence: monthly, stage: 1, tracks: [graphics, gamedev], estHours: 35, brief: "Chunked voxel terrain with greedy meshing, frustum culling and editing, in your OpenGL or Vulkan renderer.", acceptance: ["Infinite terrain streamed in chunks on a background thread", "Greedy meshing cuts triangle count by a measured factor"], source: "build-your-own-x: Voxel Engine", sourceUrl: "https://github.com/codecrafters-io/build-your-own-x#build-your-own-voxel-engine" }
- { id: byox-web-browser, title: "Build your own web browser", cadence: monthly, stage: 1, tracks: [swe, systems], estHours: 40, brief: "Fetch a page over your own HTTP code, parse HTML and a subset of CSS, lay out blocks and text, and paint them.", acceptance: ["Renders a simple real page recognisably", "Links are clickable; block and inline layout both handled"], source: "build-your-own-x: Web Browser", sourceUrl: "https://github.com/codecrafters-io/build-your-own-x#build-your-own-web-browser" }
