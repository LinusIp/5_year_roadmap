overview: >-
  A thread-caching slab allocator in C++ for a packet processor that spends 25% of its time in malloc. Each thread
  keeps its own free lists per size class, so most allocations and frees are a pointer pop or push with no lock;
  empty lists refill in batches from a central pool, which carves 64 KB slabs out of memory mapped with `mmap`. An
  `LD_PRELOAD` shim swaps it in for `malloc` and `free` in real programs, and a debug mode with canaries catches
  overflows and double frees.
