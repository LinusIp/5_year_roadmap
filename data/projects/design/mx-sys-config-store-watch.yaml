overview: >-
  A three-node configuration store so Quill's 60 services can change settings without restarts. Writes go to the
  leader, which appends them to a revision log replicated by an existing Raft library (a consensus algorithm that
  acknowledges only after a majority has stored the entry); every key carries the revision that last changed it, so
  writers can compare-and-swap. Clients watch a key prefix from a revision and resume from the last one they saw
  after reconnecting, and a rollout rule decides per client, by a stable hash of its id, whether it sees the new
  value yet.
learn:
  - name: Raft consensus
    ref: mit-6-5840
  - name: Compare-and-swap writes
  - name: Revision-based watches
  - name: Log compaction
    ref: mit-6-5840
  - name: Stale versus linearisable reads
    ref: ddia
  - name: Stable-hash rollout
stats:
  - value: < 50 ms
    label: write p99
  - value: < 100 ms
    label: watch notification delay
  - value: "0"
    label: acknowledged writes lost
components:
  - id: admin
    name: Operator CLI
    role: Sends config changes with an expected revision and rollout percentage.
    tech: CLI · gRPC
    talksTo: [log]
    kind: external
  - id: log
    name: Revision log
    role: Checks compare-and-swap, assigns revisions, stores keys and history.
    tech: Go · bbolt
    talksTo: [raft]
    kind: core
  - id: raft
    name: Replication layer
    role: Replicates each entry to a majority of the three nodes before it applies.
    tech: hashicorp/raft
    talksTo: [watch, audit]
    kind: core
  - id: watch
    name: Watch hub
    role: Streams applied changes to every watcher of a matching prefix.
    tech: gRPC streams
    talksTo: [sdk]
    kind: core
  - id: sdk
    name: Client SDK
    role: Keeps a live copy of the service's config and resumes watches after reconnects.
    tech: Go library
    talksTo: [rollout]
    kind: core
  - id: rollout
    name: Rollout evaluator
    role: Decides by stable hash whether this client gets the new value.
    tech: Hash function
    talksTo: []
    kind: core
  - id: audit
    name: Audit store
    role: Records who changed what at which revision, and supports rollback.
    tech: Append-only table
    talksTo: []
    kind: offline
flow:
  - component: admin
    text: >-
      sends `Put("billing/timeout_ms", "800", expect_rev=4120, rollout_pct=10)` to any node; followers forward
      writes to the leader.
  - component: log
    text: checks the key was last changed at revision 4120; if not, it returns `conflict` and nothing is written.
  - component: raft
    text: >-
      replicates the entry and acknowledges only when 2 of 3 nodes have it on disk; applying it assigns revision
      4121.
  - component: watch
    text: >-
      pushes `rev 4121` to every stream on `billing/`; a client reconnecting with `start_rev=4119` gets every
      change since, or an explicit `compacted` error if that history is gone.
  - component: sdk
    text: receives the event and asks the rollout evaluator which value this pod should use.
  - component: rollout
    text: >-
      computes `hash(key + client_id) mod 100 < 10`; the hash never includes the value, so the same 10% stay in
      when the rollout widens to 50%.
interface:
  lang: protobuf
  code: |
    service Config {
      rpc Put(PutReq) returns (PutResp);
      rpc Watch(WatchReq) returns (stream Event);
    }
    message PutReq {
      string key = 1;  bytes value = 2;
      int64 expect_rev = 3;   // 0 = must not exist
      uint32 rollout_pct = 4; // 100 = everyone
    }
    message WatchReq { string prefix = 1;
      int64 start_rev = 2; }  // resume point
    message Event { int64 rev = 1; string key = 2;
      bytes value = 3; uint32 rollout_pct = 4; }
decisions:
  - choice: A Raft library, not primary-backup
    instead: A primary-backup design with fencing
    why: >-
      The requirement is no lost acknowledged write when one node dies, and a majority-ack library gives that for
      free. The constraint forbids writing Raft yourself, not using it.
  - choice: Reads marked stale or strong
    instead: Answer every read from the local replica
    why: >-
      A follower can lag the leader, so a service doing read-modify-write would see old values. Watches and plain
      reads may be stale; `consistent=true` reads go through the leader.
  - choice: Keep 10,000 revisions before compaction
    instead: Compact on every snapshot
    why: >-
      Watchers reconnecting after a deploy need recent history; 10,000 small entries fit easily in 512 MB. Older
      watchers get `compacted` and re-read the prefix.
watchOut: >-
  Never let a resumed watch silently skip revisions after compaction. Return `compacted` so the client re-reads the
  whole prefix, or a service runs on an old value with no sign anything is wrong.
