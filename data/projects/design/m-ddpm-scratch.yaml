overview: >-
  A diffusion model written from the papers and trained on CIFAR-10. Training adds a known amount of Gaussian noise
  to an image in one closed-form step and teaches a U-Net to predict that noise; sampling starts from pure noise and
  removes it step by step. One trained network serves three samplers: DDPM over all 1,000 steps, DDIM over a short
  subsequence, and classifier-free guidance (mixing class-conditioned and unconditioned predictions), each scored
  with FID.
learn:
  - name: Forward noising process
    ref: lilian-weng-diffusion
  - name: U-Net denoiser
    ref: annotated-diffusion
  - name: DDIM sampling
    ref: hf-diffusion-course
  - name: Classifier-free guidance
    ref: sander-dieleman-blog
  - name: EMA weights
  - name: FID evaluation
stats:
  - value: ≤ 20
    label: FID, DDPM at 1,000 steps
  - value: ≤ 3
    label: FID gap for DDIM at 50 steps
  - value: ~10 h
    label: training on one 24 GB GPU
components:
  - id: data
    name: CIFAR-10 loader
    role: Serves image batches scaled to −1 to 1, with their class labels.
    tech: torchvision
    talksTo: [trainer]
    kind: core
  - id: schedule
    name: Noise schedule
    role: Precomputes the betas, alphas and their running products for linear or cosine schedules.
    tech: PyTorch
    talksTo: [trainer, sampler]
    kind: core
  - id: trainer
    name: Trainer
    role: Noises a batch at random timesteps and regresses the noise, dropping labels 10 % of the time.
    tech: PyTorch 2.x · W&B
    talksTo: [unet, ema]
    kind: core
  - id: unet
    name: U-Net
    role: Predicts the noise from the noisy image, the timestep and the class, with about 30–40M parameters.
    tech: PyTorch
    talksTo: []
    kind: core
  - id: ema
    name: EMA weights
    role: Keeps an exponential moving average of the U-Net weights for sampling.
    tech: PyTorch
    talksTo: [sampler]
    kind: core
  - id: sampler
    name: Samplers
    role: DDPM, DDIM and guided sampling, all from the same trained network.
    tech: PyTorch
    talksTo: [fid]
    kind: core
  - id: fid
    name: FID evaluator
    role: Generates 10,000 samples and scores them against the CIFAR-10 training set.
    tech: clean-fid
    talksTo: []
    kind: offline
flow:
  - component: data
    text: hands over a batch of images in `[-1, 1]` with labels.
  - component: schedule
    text: has `alpha_bar[t]`, the share of the original image left after `t` noising steps, ready for any `t`.
  - component: trainer
    text: >-
      picks a timestep `t` per image, draws noise `eps`, and builds the noisy image in **one closed-form step**
      from `alpha_bar[t]`.
  - component: unet
    text: >-
      predicts `eps` from the noisy image, `t` and the label (or the null label), and the trainer takes the mean
      squared error against the true noise.
  - component: ema
    text: updates its averaged copy of the weights after every optimiser step.
  - component: sampler
    text: >-
      starts from pure noise and denoises with the EMA weights: all 1,000 steps for DDPM, 10 to 250 for DDIM, and
      guidance scale `w` from 0 to 7.
  - component: fid
    text: scores 10,000 samples per setting with one fixed script, and plots FID against steps and against `w`.
interface:
  lang: python
  code: |
    def q_sample(x0, t, eps):       # closed form
        a = alpha_bar[t].view(-1, 1, 1, 1)
        return a.sqrt() * x0 + (1 - a).sqrt() * eps

    def loss_fn(unet, x0, y):
        t = torch.randint(0, T, (len(x0),))
        eps = torch.randn_like(x0)
        drop = torch.rand(len(y)) < 0.1
        y = torch.where(drop, NULL_CLASS, y)
        eps_hat = unet(q_sample(x0, t, eps), t, y)
        return F.mse_loss(eps_hat, eps)

    # guided: (1 + w) * eps(x, y) - w * eps(x, null)
decisions:
  - choice: Predict the noise
    instead: Predict v or the clean image
    why: >-
      Epsilon prediction is the DDPM paper's loss and the simplest to check against it. v-prediction is the stretch,
      compared on the same FID protocol.
  - choice: One network for every sampler
    instead: A separate model per sampler
    why: >-
      DDIM uses the same trained noise predictor, so it skips steps without retraining, and 10 % label dropout gives
      guidance its unconditional branch for free.
  - choice: A fixed FID protocol
    instead: FID on whatever samples are at hand
    why: >-
      With few samples or the wrong reference set, FID swings by several points between runs. Always use 10,000
      samples against the training set with clean-fid.
watchOut: >-
  An off-by-one between the timestep index and the alpha arrays gives samples that are almost right and easy to
  accept. Unit-test the closed-form noisy image against iterating the forward process step by step.
