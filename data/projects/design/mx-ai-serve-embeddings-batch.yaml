overview: >-
  Semantic search over 5M listings on one 16 GB server. A checkpointed batch job embeds every listing once, an HNSW
  index (a graph that finds near neighbours without comparing against all 5M) serves queries, and the day's new
  listings go into a small exact delta index that is merged nightly. Filters such as category and region are applied
  inside the search, and a benchmark checks recall against exact search.
learn:
  - name: Text embeddings
    ref: llm-zoomcamp
  - name: HNSW indexes
  - name: Product quantisation
  - name: Filtered vector search
  - name: Load testing
stats:
  - value: ≥ 0.95
    label: recall@10 vs exact
  - value: < 80 ms
    label: p99 at 200 QPS
  - value: < 12 GB
    label: index memory
components:
  - id: listings
    name: Listings DB
    role: The 5M listings with text, category, region and price.
    tech: Bazaarly database
    talksTo: [embedder]
    kind: external
  - id: embedder
    name: Batch embedder
    role: Embeds listings in shards of 100k and resumes from the last finished shard.
    tech: sentence-transformers
    talksTo: [shards]
    kind: offline
  - id: shards
    name: Shard store
    role: Vector and id files per shard, the source for every index build.
    tech: NumPy files
    talksTo: [index]
    kind: offline
  - id: api
    name: Query API
    role: Parses the query and filters and merges main and delta results.
    tech: FastAPI
    talksTo: [encoder]
    kind: core
  - id: encoder
    name: Query encoder
    role: Embeds the query with the same model used for listings.
    tech: sentence-transformers
    talksTo: [filter]
    kind: core
  - id: filter
    name: Filter engine
    role: Turns category, region and price into an allowed-id set.
    tech: NumPy bitmaps
    talksTo: [index]
    kind: core
  - id: index
    name: ANN index
    role: Main HNSW index plus a flat delta index for today's changes.
    tech: hnswlib · FAISS
    talksTo: []
    kind: core
  - id: bench
    name: Benchmark
    role: Compares results with exact search and load-tests at 200 QPS.
    tech: Python · Locust
    talksTo: [api]
    kind: offline
flow:
  - component: api
    text: receives `GET /search?q=mountain bike 29&category=bikes&region=porto`.
  - component: encoder
    text: embeds the query into the same 384-dimension space as the listings in a few milliseconds.
  - component: filter
    text: builds the allowed-id set; if it holds fewer than 20k listings it is searched exactly, which is fast and avoids losing recall.
  - component: index
    text: otherwise searches HNSW with the filter applied **during** the graph walk and `ef = 128`, plus the delta index for listings added today.
  - component: api
    text: merges both result lists, drops deleted ids and returns the top 10.
interface:
  lang: http
  code: |
    GET /search?q=mountain+bike+29
        &category=bikes&region=porto&k=10

    200 OK
    { "results": [
        { "id": "L-4410982", "score": 0.83 },
        { "id": "L-0981127", "score": 0.81 } ],
      "searched": "hnsw+delta",
      "took_ms": 21 }
decisions:
  - choice: HNSW on float vectors
    instead: IVF-PQ compressed vectors
    why: >-
      5M × 384 floats is about 7.7 GB, plus about 1.3 GB of graph, which fits the 12 GB limit. HNSW reaches 0.95
      recall easily; switch to PQ (compressing each vector to a few bytes) if the catalogue doubles.
  - choice: Daily delta index, merged nightly
    instead: Insert and delete in the main index
    why: >-
      Deletes leave holes in an HNSW graph and updates are slow. A small exact index for the day's changes stays
      correct and is rebuilt into the main one each night.
  - choice: Exact search for narrow filters
    instead: Filter after the ANN search
    why: >-
      Filtering the top 10 afterwards returns almost nothing for a rare category. Small filtered sets are searched
      exactly; large ones filter inside the graph walk.
watchOut: >-
  Recall measured on popular, easy queries looks fine and hides failures on rare terms and narrow filters. Sample
  benchmark queries from real logs, filters included.
