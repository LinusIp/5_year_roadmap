overview: >-
  The two structures at the bottom of a relational database, built inside CMU's BusTub codebase. The buffer pool keeps
  a fixed number of page-sized frames in memory, maps page ids to frames through a page table, evicts with the LRU-K
  policy (it evicts the page whose k-th most recent use is oldest) and writes dirty pages through a background disk
  scheduler. The B+tree stores its internal and leaf pages in those frames, and each operation descends from the root
  with latch crabbing: it takes a child's latch, then releases the ancestors once the child cannot split or merge.
