overview: >-
  A short-time Fourier transform (an FFT on many small overlapping slices of the signal) of a WAV file in NumPy:
  frames of 1,024 samples with 50 percent overlap and a Hann window, rendered as a PNG of log magnitude over time
  and frequency.
learn:
  - name: Discrete Fourier transform
    ref: think-dsp
  - name: Windowing and leakage
    ref: dspguide
  - name: Bin-to-Hz mapping
components:
  - id: reader
    name: WAV reader
    role: Loads samples as floats and the sample rate.
    tech: scipy.io.wavfile or wave
    talksTo: [framer]
    kind: core
  - id: framer
    name: Framer
    role: Cuts overlapping frames and multiplies each by a Hann window.
    tech: NumPy
    talksTo: [fft]
    kind: core
  - id: fft
    name: FFT
    role: Computes magnitudes per frame and converts them to decibels.
    tech: numpy.fft.rfft
    talksTo: [plot]
    kind: core
  - id: plot
    name: Renderer
    role: Draws the time by frequency image with labelled axes.
    tech: matplotlib
    talksTo: []
    kind: core
flow:
  - component: reader
    text: loads a synthetic 440 Hz plus 1,000 Hz test tone at 44,100 Hz.
  - component: framer
    text: takes frames of 1,024 samples every 512 samples and applies `np.hanning(1024)`.
  - component: fft
    text: runs `rfft` per frame and maps bin `k` to `k × 44100 / 1024`, about 43 Hz per bin.
  - component: plot
    text: draws `20·log10(magnitude)`; the two peaks must sit within one bin of 440 and 1,000 Hz.
decisions:
  - choice: Hann window
    instead: No window (rectangular)
    why: >-
      Cutting a frame abruptly smears a pure tone across many bins (leakage). Hann tapers the edges and keeps the
      two peaks sharp at the cost of slightly wider main lobes.
watchOut: >-
  Getting the bin-to-Hz mapping wrong shifts every peak. Use `rfftfreq(1024, 1/44100)` and check with a tone of
  known frequency.
