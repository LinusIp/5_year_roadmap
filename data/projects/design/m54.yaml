overview: >-
  A planar two-link arm worked out fully before any hardware. One parameter file feeds a SymPy derivation of the
  equations of motion from the Lagrangian (energy-based mechanics), which generates code for the mass matrix, the
  Coriolis terms and gravity, and the same file builds the arm in your own engine. Kinematics and the Jacobian are
  checked against the Modern Robotics library, and a computed-torque controller tracks quintic trajectories while the
  engine, cross-checked by a SciPy ODE, integrates the motion.
learn:
  - name: Forward and inverse kinematics
    ref: modern-robotics
  - name: The Jacobian
    ref: modern-robotics
  - name: Lagrangian dynamics
    ref: mit-2-12
  - name: Computed-torque control
    ref: modern-robotics
  - name: Energy checks
    ref: mit-6-832-underactuated
stats:
  - value: < 0.5°
    label: RMS tracking error, computed torque
  - value: < 0.1 %
    label: energy drift over 60 s, no torque
  - value: "1e-9"
    label: FK and Jacobian against the library
components:
  - id: params
    name: Parameter file
    role: Holds link lengths, masses, inertias and joint friction for every other part.
    tech: YAML
    talksTo: [dynamics, kinematics, engine]
    kind: core
  - id: dynamics
    name: Lagrange derivation
    role: Derives M(q), C(q, q̇) and g(q) symbolically and generates them as functions.
    tech: SymPy · codegen
    talksTo: [controller]
    kind: core
  - id: kinematics
    name: Kinematics
    role: Gives forward and closed-form inverse kinematics, elbow up and down, and the Jacobian.
    tech: NumPy
    talksTo: [trajectory]
    kind: core
  - id: trajectory
    name: Trajectory generator
    role: Produces desired angles, velocities and accelerations from quintic or straight-line paths.
    tech: NumPy
    talksTo: [controller]
    kind: core
  - id: controller
    name: Controller
    role: Computes joint torques by computed torque or PD with gravity compensation.
    tech: Python · C++
    talksTo: [engine]
    kind: core
  - id: engine
    name: Your engine
    role: Integrates the arm's motion from the torques and returns the joint states.
    tech: C++ multibody joints
    talksTo: [controller, checks]
    kind: core
  - id: ode
    name: SciPy ODE
    role: Integrates the generated equations independently as a cross-check.
    tech: SciPy solve_ivp
    talksTo: [checks]
    kind: offline
  - id: checks
    name: Checks
    role: Compares with modern_robotics, plots energy drift and tracking error.
    tech: pytest · Matplotlib
    talksTo: []
    kind: offline
flow:
  - component: params
    text: >-
      loads one set of lengths, masses and inertias so the derivation and the engine cannot drift apart.
  - component: dynamics
    text: >-
      forms `L = T − V`, applies the Euler-Lagrange equations, and writes `M`, `C` and `g` out as code.
  - component: kinematics
    text: >-
      turns a Cartesian straight line into joint angles, staying clear of the **fully stretched** singularity.
  - component: trajectory
    text: >-
      gives `q_d`, `q̇_d` and `q̈_d` along a 2-second quintic, smooth in position, velocity and acceleration.
  - component: controller
    text: >-
      computes `τ = M(q)(q̈_d + K_d ė + K_p e) + C q̇ + g(q)` at its own rate, not tied to the sim step.
  - component: engine
    text: >-
      integrates at 1 ms and returns `q` and `q̇` to the controller, closing the **control loop**.
  - component: checks
    text: >-
      require the engine and the ODE to agree within 0.1° over 10 s, and tracking to hold under 2° with masses off by
      10 %.
interface:
  lang: python
  code: |
    def computed_torque(q, qd, q_des, qd_des,
                        qdd_des, Kp, Kd):
        e, ed = q_des - q, qd_des - qd
        v = qdd_des + Kd @ ed + Kp @ e
        return M(q) @ v + C(q, qd) @ qd + g(q)

    # M, C and g are generated by SymPy from
    #   L = T(q, qd) - V(q)
    #   d/dt(dL/dqd) - dL/dq = tau
decisions:
  - choice: SymPy derivation with code generation
    instead: Equations derived by hand and typed in
    why: >-
      Coriolis terms with a factor-of-two slip only show at speed. Generated code removes transcription errors, and
      the energy check catches derivation errors.
  - choice: One parameter file for everything
    instead: Separate numbers in the model and the engine
    why: >-
      The engine-against-ODE check within 0.1° is meaningless if the two use different masses, and project 55
      generates its URDF from the same file.
  - choice: SciPy ODE as a second integrator
    instead: Trusting the engine alone
    why: >-
      Two independent integrators that agree make it likely both are right; when they disagree, the energy drift of
      each shows which one to suspect.
watchOut: >-
  Angle conventions, such as where zero is and which way is positive, can differ between your derivation and the
  Modern Robotics library, so correct code fails the check. Fix the convention in the parameter file and convert at
  the comparison.
