overview: >-
  Tallyhand moves from passwords in repos and a spreadsheet to credentials that expire on their own. A scanner finds
  and blocks secrets in code, a self-hosted Vault holds the rest behind per-service policies, and services prove who
  they are with their Kubernetes service account or, in CI, a GitHub OIDC token, a short signed statement of which
  repo and branch is running. Vault then creates a fresh Postgres user for each service that lives for one hour, so a
  leaked password is soon worthless and revoking a lease cuts access in under 2 minutes.
learn:
  - name: Secret scanning
  - name: Dynamic credentials
  - name: Workload identity
    ref: kubernetes-tutorials
  - name: OIDC federation in CI
    ref: github-actions-docs
  - name: Lease and revoke
  - name: Zero-downtime rotation
stats:
  - value: "0"
    label: secret findings on main
  - value: 1 h
    label: database credential lifetime
  - value: < 2 min
    label: emergency revoke
components:
  - id: scanner
    name: Secret scanner
    role: Scans every commit and the full history for 15 secret types, in pre-commit and in CI.
    tech: gitleaks
    talksTo: []
    kind: offline
  - id: workload
    name: Workload
    role: A service pod or a CI job that needs a database credential.
    tech: Kubernetes · GitHub Actions
    talksTo: [vault]
    kind: external
  - id: vault
    name: Vault
    role: Checks the caller's identity token against a per-service policy and issues leases.
    tech: OpenBao or Vault · HA mode
    talksTo: [dbengine]
    kind: core
  - id: dbengine
    name: Database engine
    role: Creates a scoped Postgres user with a 1-hour TTL and drops it when the lease ends.
    tech: Vault database secrets engine
    talksTo: [postgres, injector]
    kind: core
  - id: postgres
    name: PostgreSQL
    role: The payroll database that the generated users log in to.
    tech: PostgreSQL
    talksTo: []
    kind: external
  - id: injector
    name: Secret injector
    role: Puts the credential into a memory-only volume and renews it before expiry, never into env vars or disk.
    tech: Vault Agent sidecar
    talksTo: []
    kind: core
  - id: revoke
    name: Revoke runbook
    role: Revokes every lease under a path and confirms no session is left open.
    tech: Shell · Vault CLI
    talksTo: [vault]
    kind: offline
flow:
  - component: workload
    text: starts and sends its service-account token, or in CI the GitHub OIDC token, to Vault; no stored password is involved.
  - component: vault
    text: checks the token and the policy, which lets `payroll-api` read only `database/creds/payroll-api`.
  - component: dbengine
    text: runs `CREATE ROLE` for a new user valid for `1h` with only that service's grants and returns it as a lease.
  - component: injector
    text: writes the username and password to an in-memory file the app reads, and renews the lease while the pod lives, so rotation needs **no restart**.
  - component: vault
    text: on an emergency revoke, `vault lease revoke -prefix` drops every user under that path; the app's next login fails within 2 minutes.
interface:
  lang: shell
  code: |
    $ vault read database/creds/payroll-api
    Key                Value
    lease_id           database/creds/payroll-api/h3Kd…
    lease_duration     1h
    lease_renewable    true
    password           A1a-8xQ…(masked)
    username           v-k8s-payroll-api-Zr7c

    # emergency: kill every payroll-api credential
    $ vault lease revoke -prefix \
        database/creds/payroll-api
decisions:
  - choice: Dynamic credentials, not rotated static ones
    instead: Store static passwords in Vault and rotate them monthly
    why: Six repos already leaked static passwords. A per-service user that dies in an hour limits a leak to that hour and that service, and revoke is one command.
  - choice: OIDC federation for CI
    instead: A Vault token saved as a CI secret
    why: A saved token is just another long-lived secret. The OIDC token is minted per job and names the repo and branch, so policies can trust it.
watchOut: Vault becomes the thing every service needs to start. Run it with three nodes, test what happens when it is down, and let apps keep a valid lease for a short outage.
