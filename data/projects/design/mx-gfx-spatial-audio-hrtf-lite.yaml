overview: >-
  A positional audio engine for Hollow Lantern Studio's horror game, so players hear where a sound comes from. Each
  emitter's voice runs through a delay line whose length is distance divided by the speed of sound, which gives both
  delay and Doppler shift, then distance and air-absorption filters, an occlusion low-pass from game raycasts, and a
  binaural panner that delays and shades the far ear like a spherical head. Voices mix into a stereo bus and a reverb
  per zone, all inside a 256-sample callback at 48 kHz.
learn:
  - name: Delay lines and Doppler
    ref: dspguide
  - name: Fractional delay interpolation
    ref: think-dsp
  - name: One-pole filters
    ref: dspguide
  - name: ITD and ILD
  - name: Parameter smoothing
  - name: Real-time audio threads
stats:
  - value: < 25%
    label: of a 5.3 ms callback, 64 emitters
  - value: ≤ 20 µs
    label: ITD error vs spherical head
  - value: < -60 dBFS
    label: steps during fast motion
components:
  - id: game
    name: Game thread
    role: Posts emitter and listener positions and occlusion raycast results each frame.
    tech: Game engine
    talksTo: [model]
    kind: external
  - id: model
    name: Emitter model
    role: Turns positions into distance, gain from the distance curve and the angle to the listener.
    tech: C++17
    talksTo: [delay]
    kind: core
  - id: delay
    name: Delay-line Doppler
    role: Reads each voice at distance / 343 m/s behind the write head with interpolation, plus air absorption.
    tech: C++17
    talksTo: [occlusion]
    kind: core
  - id: occlusion
    name: Occlusion filter
    role: Low-passes and quietens a voice by the wall thickness the raycasts found.
    tech: C++17
    talksTo: [panner]
    kind: core
  - id: panner
    name: Binaural panner
    role: Delays the far ear by the ITD and shades it with a head-shadow filter.
    tech: C++17
    talksTo: [reverb]
    kind: core
  - id: reverb
    name: Reverb zones
    role: Adds each zone's reverb and crossfades when the listener changes zone.
    tech: C++17
    talksTo: [device]
    kind: core
  - id: device
    name: Audio device
    role: Calls back for 256 stereo frames at 48 kHz.
    tech: miniaudio-style backend
    talksTo: []
    kind: external
  - id: harness
    name: Test harness
    role: Renders scenes offline and checks ITD error, Doppler pitch and click level.
    tech: C++17 · WAV out
    talksTo: []
    kind: offline
flow:
  - component: model
    text: reads the latest positions from a lock-free buffer at the start of the callback, so the audio thread never waits on the game.
  - component: delay
    text: sets each voice's read position to `distance / 343` seconds behind the write head; a changing delay is the **Doppler** shift, and cubic interpolation reads between samples.
  - component: occlusion
    text: maps the wall thickness from the last raycast to a low-pass cutoff and gain, both smoothed over about 10 ms.
  - component: panner
    text: delays the far ear by `(a / c) * (θ + sin θ)`, with head radius a = 8.75 cm, and applies a high-shelf cut for the head's shadow.
  - component: reverb
    text: sums all 64 voices into the stereo bus and the current zone's reverb send, then hands 256 frames to the device, within 1.3 ms.
interface:
  lang: cpp
  code: |
    struct EmitterState {     // written by game thread
      vec3  pos, vel;         // world, m and m/s
      float occlusion;        // 0 open .. 1 thick wall
      uint8_t zone;
    };
    // audio thread: 256 frames at 48 kHz = 5.3 ms
    void process(const Listener& l,
                 std::span<const EmitterState> e,
                 float* outL, float* outR, int frames);

    // ITD (Woodworth): (a / c) * (theta + sin theta)
    // a = 0.0875 m, c = 343 m/s, max about 0.66 ms
decisions:
  - choice: Delay-line Doppler
    instead: Pitch-shift by a resampling ratio from velocity
    why: One delay line gives correct arrival time and Doppler from the same distance, and the pitch never jumps when velocity is noisy. The cost is interpolation work per sample.
  - choice: Spherical-head ITD and ILD
    instead: Convolution with a measured HRTF set
    why: No middleware is allowed, and 64 voices inside 25% of the callback leaves little room for long filters. ITD and ILD give left and right clearly; revisit HRTF filters if players need above and below cues.
  - choice: Raycasts on the game thread
    instead: Raycasts inside the audio callback
    why: Physics queries can take longer than 5.3 ms and would make the audio glitch. The game sends thickness values, and the audio thread only smooths them.
watchOut: >-
  Changing gain, filter cutoff or delay once per 256-sample block makes zipper noise and clicks when a monster moves
  fast. Ramp every parameter per sample, or through a one-pole smoother, and run the 50 random fast-motion click trials.
