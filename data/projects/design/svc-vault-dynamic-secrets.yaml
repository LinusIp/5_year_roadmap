overview: >-
  An app that never stores a database password: it asks Vault's database secrets engine for a credential that
  Vault creates in Postgres with a 5-minute lease, renews or re-fetches it before expiry, and swaps its connection
  pool without failing requests.
learn:
  - name: Dynamic secrets
  - name: Lease renewal
  - name: Connection pool rotation
components:
  - id: app
    name: App
    role: Serves requests through a pool built from the current credential.
    tech: Python · SQLAlchemy
    talksTo: [vault, db]
    kind: core
  - id: vault
    name: Vault
    role: Creates a Postgres user per request for credentials and drops it when the lease ends.
    tech: Vault dev server
    talksTo: [db]
    kind: core
  - id: db
    name: Postgres
    role: Holds the data and the short-lived roles Vault creates.
    tech: PostgreSQL
    talksTo: []
    kind: core
flow:
  - component: app
    text: reads `database/creds/app-role` and gets a username, password and `lease_duration=300`.
  - component: vault
    text: runs the role's creation SQL in Postgres, granting that user only the tables the app needs.
  - component: app
    text: at about 2/3 of the lease fetches new credentials, builds a new pool and drains the old one.
  - component: db
    text: loses the old role when its lease is revoked, by which time no live connection uses it.
decisions:
  - choice: Re-fetch and swap pools
    instead: Renew the same lease forever
    why: >-
      Leases have a maximum TTL, so renewal only delays the swap that must work anyway. Test the swap every 5
      minutes so it is boring when it matters.
watchOut: >-
  A connection pool keeps old connections open after their credential is revoked, so requests fail at random later.
  Swap the pool before revocation and set a maximum connection age.
