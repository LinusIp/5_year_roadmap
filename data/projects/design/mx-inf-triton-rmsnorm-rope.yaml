overview: >-
  Vela Labs' 3B assistant decodes at 38 ms per token at small batch, and the profile shows dozens of tiny elementwise
  kernels around attention. At batch 1 each of those kernels moves a few kilobytes and spends most of its time being
  launched, so fusing them saves both launches and memory round trips. You write two Triton kernels, residual add
  plus RMSNorm and rotary embedding for queries and keys, swap them into the model, then try CUDA graphs on top.
learn:
  - name: Kernel launch overhead
    ref: horace-he-brrr
  - name: Kernel fusion in Triton
    ref: triton-tutorials
  - name: RMSNorm and rotary embeddings
  - name: CUDA graphs
    ref: cuda-guide
  - name: Fuzz testing kernels
stats:
  - value: ≥ 3×
    label: kernel speed-up at batch 1
  - value: ≥ 12%
    label: lower decode latency
  - value: ≤ 2e-3
    label: max abs error, bf16
components:
  - id: profile
    name: Decode profile
    role: Captures one decode step and lists every kernel launch with its time.
    tech: Nsight Systems
    talksTo: [reference]
    kind: core
  - id: reference
    name: Reference ops
    role: Plain PyTorch RMSNorm, residual add and rotary embedding used as ground truth.
    tech: PyTorch
    talksTo: [kernels]
    kind: core
  - id: kernels
    name: Triton kernels
    role: Fused residual-add-RMSNorm and fused rotary for Q and K, one launch each.
    tech: Triton
    talksTo: [swap]
    kind: core
  - id: swap
    name: Module swap
    role: Replaces the norm and rotary modules in the 3B model with the fused versions.
    tech: PyTorch
    talksTo: [bench]
    kind: core
  - id: fuzz
    name: Fuzz tests
    role: Compares fused and reference on 1,000 random shapes, strides and dtypes.
    tech: pytest
    talksTo: [kernels]
    kind: offline
  - id: bench
    name: Benchmark suite
    role: Measures kernel microseconds, GB/s and end-to-end ms per token at batch 1, 4 and 16.
    tech: Python · CUDA events
    talksTo: []
    kind: core
flow:
  - component: profile
    text: >-
      shows that one layer's decode step launches separate kernels for residual add, square, mean, rsqrt, scale and
      the rotary sin, cos, multiply and add.
  - component: reference
    text: fixes the exact maths, `y = x / sqrt(mean(x²) + eps) * w` after `x = x + residual`, to compare against.
  - component: kernels
    text: >-
      load each row of hidden state once, add the residual, normalise and write both outputs in one launch; the
      rotary kernel rotates Q and K pairs in registers.
  - component: swap
    text: replaces the modules in every layer, so one decode step goes from dozens of small launches to a few.
  - component: bench
    text: >-
      measures ms per token at batch 1, 4 and 16, then captures the step in a **CUDA graph** to remove the remaining
      launch cost and reports both numbers.
interface:
  lang: python
  code: |
    @triton.jit
    def add_rmsnorm(x_ptr, res_ptr, w_ptr,
                    out_ptr, res_out_ptr,
                    stride, n_cols, eps,
                    BLOCK: tl.constexpr): ...

    @triton.jit
    def rotary_qk(q_ptr, k_ptr, cos_ptr, sin_ptr,
                  pos_ptr, stride_q, stride_k,
                  n_heads, HEAD_DIM: tl.constexpr): ...
decisions:
  - choice: Fuse the elementwise chain, not attention
    instead: Write a custom attention kernel
    why: >-
      At batch 1 the profile points to many tiny launches rather than attention's maths, and fusing them is a
      smaller, safer change. Revisit attention if it tops the profile after fusion.
  - choice: Triton only
    instead: Hand-written CUDA
    why: >-
      The constraint says Triton, and for row-wise memory-bound kernels it reaches near-peak bandwidth with little
      code. CUDA graphs handle the launch cost Triton cannot.
watchOut: >-
  Check first whether torch.compile already fuses these ops in the real deployment; fusing what the compiler already
  fused gains nothing. Also fuzz with non-contiguous strides, which real models produce and neat tests miss.
