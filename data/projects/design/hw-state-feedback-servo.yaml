overview: >-
  A position servo for the motor identified in the system-identification build: its model becomes a discrete
  state-space model with position and velocity as states, the controller gain comes from pole placement, and a
  Luenberger observer (a copy of the model run alongside the motor and corrected by the measured position) estimates
  velocity instead of differencing noisy encoder counts. It runs at 1 kHz on the MCU, with under 5% overshoot on a step.
learn:
  - name: State-space models
    ref: brian-douglas-control
  - name: Pole placement
    ref: brunton-control-bootcamp
  - name: Luenberger observers
  - name: Zero-order-hold discretisation
components:
  - id: design
    name: Python design
    role: Discretises the model, places poles and writes the gains to a C header.
    tech: Python · SciPy
    talksTo: [ctrl]
    kind: offline
  - id: motor
    name: Motor and encoder
    role: The identified geared motor with its quadrature encoder.
    tech: Encoder motor · H-bridge
    talksTo: [observer]
    kind: external
  - id: observer
    name: Observer
    role: Predicts position and velocity from the model and corrects with the encoder.
    tech: C · float
    talksTo: [ctrl]
    kind: core
  - id: ctrl
    name: Controller
    role: Computes the motor voltage from the estimated state and the reference.
    tech: C · 1 kHz timer ISR
    talksTo: [motor]
    kind: core
flow:
  - component: design
    text: discretises `x = [θ, ω]` at 1 ms with `cont2discrete`, places controller poles at about ζ = 0.7 for under 5% overshoot and observer poles 3 to 5x faster, and exports `Ad`, `Bd`, `K`, `L`.
  - component: motor
    text: is read by the 1 kHz interrupt as encoder counts, converted to position in radians.
  - component: observer
    text: predicts `x̂ = Ad·x̂ + Bd·u` and adds `L·(θ - θ̂)`, giving velocity without differentiating counts.
  - component: ctrl
    text: sets `u = N̄·r - K·x̂`, clamps it to the supply and writes PWM, which closes the **control loop**; each step response is logged for overshoot and settling time.
interface:
  lang: c
  code: |
    /* generated by design.py, Ts = 1 ms */
    extern const float Ad[2][2], Bd[2], K[2], L[2];
    extern const float Nbar;    /* reference gain */
    static float xh[2];         /* [theta, omega] */

    void control_isr(void) {    /* 1 kHz */
      float y = encoder_rad();
      float u = Nbar*ref - (K[0]*xh[0] + K[1]*xh[1]);
      u = clampf(u, -V_SUPPLY, V_SUPPLY);
      pwm_set(u);
      float e = y - xh[0];      /* measured - predicted */
      float p[2];  predict(Ad, Bd, xh, u, p);
      xh[0] = p[0] + L[0]*e;  xh[1] = p[1] + L[1]*e;
    }
decisions:
  - choice: Observer for velocity
    instead: Velocity from count differences each 1 ms
    why: >-
      With a 1,000-count encoder, one count in 1 ms reads as 6.3 rad/s, so differencing jumps between a few large
      values. The observer uses the model to fill in between counts and gives a smooth estimate.
watchOut: >-
  Observer poles that are too fast pass encoder noise straight into the velocity estimate and the motor buzzes. Keep
  them 3 to 5x faster than the controller poles and check the estimated velocity is quiet at standstill.
