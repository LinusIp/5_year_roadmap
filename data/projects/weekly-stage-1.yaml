# Weekly mini-builds, stage 1 (software): 2-6 hours each. "Pick my next project" draws from this pool,
# matching the tracks of the current phase; the first matching card in file order is the default suggestion.
# Cards are deliberately small: one idea, finished and pushed, every week.

# ---- languages: Python
- { id: w-py-cli-wordcount, title: "A word-frequency CLI in Python", cadence: weekly, stage: 1, tracks: [languages], estHours: 3, brief: "Read files or stdin, print the top N words, with flags for case folding and stop words.", acceptance: ["Works on stdin and on several files", "argparse help text and three pytest tests"] }
- { id: w-py-file-organiser, title: "Downloads-folder organiser", cadence: weekly, stage: 1, tracks: [languages], estHours: 3, brief: "A script that sorts a messy folder into subfolders by type and date, with a dry-run mode.", acceptance: ["--dry-run prints what would move and moves nothing", "Never overwrites an existing file"] }
- { id: w-py-api-client, title: "A small API client with retries", cadence: weekly, stage: 1, tracks: [languages, swe], estHours: 4, brief: "Wrap a public JSON API in a typed Python client with timeouts, retries with backoff and a cache on disk.", acceptance: ["Tests run offline against recorded responses", "Type hints pass mypy or pyright"] }
- { id: w-py-decorators, title: "Three decorators you will reuse", cadence: weekly, stage: 1, tracks: [languages], estHours: 2, brief: "Write @timed, @retry and @memoize from scratch, preserving signatures and docstrings.", acceptance: ["functools.wraps used correctly", "Tests for each, including the failure paths of @retry"] }
- { id: w-py-generators, title: "A lazy log-processing pipeline with generators", cadence: weekly, stage: 1, tracks: [languages], estHours: 3, brief: "Parse a large log file with a chain of generators: read, filter, parse, aggregate. Memory stays flat.", acceptance: ["Processes a 1 GB file without loading it", "Peak memory measured and reported"] }
- { id: w-py-dataclass-parser, title: "Config loader with dataclasses and validation", cadence: weekly, stage: 1, tracks: [languages], estHours: 3, brief: "Load TOML into nested dataclasses with clear errors for missing or mistyped fields.", acceptance: ["Error messages name the offending key path", "Round-trip test: dump then load"] }
- { id: w-aoc-day, title: "One Advent of Code day in the language of the month", cadence: weekly, stage: 1, tracks: [languages, swe], estHours: 3, brief: "Pick any day from any year and solve both parts in whichever language block B is teaching right now.", acceptance: ["Both parts solved", "A second, cleaner version after reading two other people's solutions"], source: "Advent of Code", sourceUrl: "https://adventofcode.com/" }
- { id: w-py-async-crawler, title: "Async link checker", cadence: weekly, stage: 1, tracks: [languages, systems], estHours: 4, brief: "Crawl one site with asyncio and report broken links, with a concurrency limit and polite delays.", acceptance: ["Concurrency limit enforced with a semaphore", "Respects robots.txt"] }

# ---- languages: C
- { id: w-c-ring-buffer, title: "Implement a ring buffer in C", cadence: weekly, stage: 1, tracks: [languages, systems], estHours: 3, brief: "A fixed-capacity FIFO over a byte array, the kind every driver and audio path uses.", acceptance: ["Push, pop, peek, full and empty handled without a wasted slot or with a documented one", "Tests, and a run under AddressSanitizer"] }
- { id: w-c-dynamic-array, title: "A generic dynamic array in C", cadence: weekly, stage: 1, tracks: [languages], estHours: 3, brief: "A growable vector with amortised O(1) push, done with macros or void pointers, your choice, defended in the README.", acceptance: ["Growth policy benchmarked", "No leaks under Valgrind or a sanitizer"] }
- { id: w-c-hash-table, title: "Hash table with open addressing in C", cadence: weekly, stage: 1, tracks: [languages, swe], estHours: 5, brief: "String keys, linear or Robin Hood probing, tombstones, resizing.", acceptance: ["Insert, find, delete and iterate", "Load factor against probe length plotted"] }
- { id: w-c-arena-allocator, title: "Arena allocator", cadence: weekly, stage: 1, tracks: [languages, systems], estHours: 3, brief: "A bump allocator with alignment and a reset, then use it in one of your earlier C programs.", acceptance: ["Alignment correct for any type", "Before and after timing of the program you ported"] }
- { id: w-c-string-builder, title: "A safe string builder in C", cadence: weekly, stage: 1, tracks: [languages], estHours: 2, brief: "Append, format and slice without a single buffer overflow.", acceptance: ["printf-style append", "Fuzzed for ten minutes without a sanitizer report"] }
- { id: w-c-cat-grep, title: "Rewrite cat, wc and a tiny grep in C", cadence: weekly, stage: 1, tracks: [languages, systems], estHours: 4, brief: "Three Unix tools from scratch, reading with read(2) and buffering yourself.", acceptance: ["Output matches the real tools on test files", "Handles binary input and very long lines"] }
- { id: w-c-bit-tricks, title: "Bit manipulation drills", cadence: weekly, stage: 1, tracks: [languages, systems], estHours: 2, brief: "Popcount, reverse bits, next power of two, sign extension: each without a loop where possible.", acceptance: ["Each checked exhaustively against a naive version on 16-bit inputs"] }
- { id: w-c-linked-list-debug, title: "Debug a broken linked list with gdb only", cadence: weekly, stage: 1, tracks: [languages, swe], estHours: 2, brief: "Write a doubly linked list, plant three bugs, come back a day later and find them using only gdb: no printf.", acceptance: ["A short log of the gdb commands that found each bug"] }

# ---- languages: C++ and Rust
- { id: w-cpp-neetcode-5, title: "Solve five NeetCode problems in C++", cadence: weekly, stage: 1, tracks: [swe, languages], estHours: 4, brief: "Five problems from one pattern of the NeetCode roadmap, in idiomatic modern C++.", acceptance: ["All five accepted", "Each solution has its time and space complexity in a comment"], source: "NeetCode roadmap", sourceUrl: "https://neetcode.io/roadmap" }
- { id: w-cpp-raii-wrapper, title: "RAII wrapper for a C resource", cadence: weekly, stage: 1, tracks: [languages], estHours: 3, brief: "Wrap a FILE*, a socket or an OpenGL handle in a move-only C++ class.", acceptance: ["Rule of five handled deliberately", "No leak on any exit path, shown with a test"] }
- { id: w-cpp-small-vector, title: "A small-buffer-optimised vector", cadence: weekly, stage: 1, tracks: [languages], estHours: 5, brief: "A vector that stores its first N elements inline and only allocates beyond that.", acceptance: ["Correct for non-trivial types (constructors and destructors counted in a test)", "Benchmarked against std::vector"] }
- { id: w-cpp-thread-pool, title: "Thread pool with futures", cadence: weekly, stage: 1, tracks: [languages, systems], estHours: 4, brief: "A fixed pool with a task queue, returning std::future from submit().", acceptance: ["Clean shutdown with tasks in flight", "ThreadSanitizer clean"] }
- { id: w-cpp-templates-units, title: "Compile-time units of measure", cadence: weekly, stage: 1, tracks: [languages, physics], estHours: 4, brief: "A tiny template library where metres divided by seconds is a velocity and adding metres to seconds does not compile.", acceptance: ["static_assert tests for legal and illegal expressions"] }
- { id: w-rust-cli-grep, title: "minigrep, then make it fast", cadence: weekly, stage: 1, tracks: [languages], estHours: 4, brief: "The Rust book's grep, extended with recursive search and a parallel walk.", acceptance: ["Error handling with Result throughout, no unwrap in library code", "Timed against ripgrep on a large tree, just to see"] }
- { id: w-rust-linked-list, title: "A linked list in Rust, the hard way", cadence: weekly, stage: 1, tracks: [languages], estHours: 4, brief: "Singly linked stack with Box, then a doubly linked deque: meet the borrow checker on purpose.", acceptance: ["Iterators (iter, iter_mut, into_iter) implemented", "A note on what ownership forced you to change"] }
- { id: w-rust-ffi, title: "Call your C ring buffer from Rust", cadence: weekly, stage: 1, tracks: [languages, systems], estHours: 3, brief: "Bind the C ring buffer card's code through FFI and wrap it in a safe Rust API.", acceptance: ["The unsafe block is small and its invariants are documented", "Tests run under Miri or a sanitizer"] }
- { id: w-rust-trait-objects, title: "A plugin system with trait objects", cadence: weekly, stage: 1, tracks: [languages], estHours: 3, brief: "A small text-processing tool whose filters are trait objects registered at start-up; then the same with generics.", acceptance: ["Both versions benchmarked; the trade-off written down"] }
- { id: w-go-worker-pool, title: "Worker pool and pipeline in Go", cadence: weekly, stage: 1, tracks: [languages, systems], estHours: 3, brief: "Fan-out, fan-in and cancellation with goroutines, channels and context.", acceptance: ["No goroutine leaks (checked in a test)", "Race detector clean"] }

# ---- software engineering and algorithms
- { id: w-bloom-filter, title: "Write a Bloom filter", cadence: weekly, stage: 1, tracks: [swe, systems], estHours: 3, brief: "A Bloom filter with k hash functions from double hashing, sized from a target false-positive rate.", acceptance: ["Measured false-positive rate within 20% of the predicted one", "Used to skip lookups in a toy key-value store"] }
- { id: w-lru-cache, title: "LRU cache in O(1)", cadence: weekly, stage: 1, tracks: [swe], estHours: 3, brief: "Hash map plus doubly linked list, in the language of the month.", acceptance: ["get and put in O(1), proved by a benchmark that stays flat", "Thread-safe variant as a stretch"] }
- { id: w-trie-autocomplete, title: "Trie-based autocomplete", cadence: weekly, stage: 1, tracks: [swe], estHours: 3, brief: "Load a word list into a trie and return the top completions for a prefix, ranked by frequency.", acceptance: ["Answers in under a millisecond on a 300k-word list", "Memory use measured; a compressed (radix) version as a stretch"] }
- { id: w-heap-scheduler, title: "Binary heap and a job scheduler on top of it", cadence: weekly, stage: 1, tracks: [swe], estHours: 3, brief: "Implement a heap, then use it for a scheduler that runs jobs at their due time.", acceptance: ["Heap property checked by a property-based test", "decrease-key supported"] }
- { id: w-union-find, title: "Union-find, then a maze generator", cadence: weekly, stage: 1, tracks: [swe, gamedev], estHours: 3, brief: "Disjoint sets with path compression and union by rank, used to generate perfect mazes with Kruskal's algorithm.", acceptance: ["A rendered maze", "Near-constant amortised time shown empirically"] }
- { id: w-skip-list, title: "Skip list", cadence: weekly, stage: 1, tracks: [swe], estHours: 4, brief: "An ordered map with probabilistic balancing: the structure behind many memtables.", acceptance: ["Insert, delete, find and range scan", "Compared with a balanced tree from the standard library"] }
- { id: w-rope, title: "A rope for text editing", cadence: weekly, stage: 1, tracks: [swe], estHours: 5, brief: "A balanced tree of strings supporting insert and delete in the middle of a very large text.", acceptance: ["Editing a 100 MB text stays interactive", "Line-number index as a stretch"] }
- { id: w-dijkstra-visual, title: "Dijkstra and A* on a grid, visualised", cadence: weekly, stage: 1, tracks: [swe, gamedev], estHours: 4, brief: "Draw walls, press run, watch the frontier expand. Compare the nodes each algorithm visits.", acceptance: ["Both algorithms, step by step", "A heuristic that is inadmissible on purpose, and what it breaks"] }
- { id: w-property-tests, title: "Property-based tests for an old project", cadence: weekly, stage: 1, tracks: [swe], estHours: 3, brief: "Add Hypothesis (or the equivalent) to one of your data structures and let it find what your examples missed.", acceptance: ["At least three properties", "One real bug found, or a note on why none was"] }
- { id: w-git-internals, title: "Rescue a repository using only plumbing commands", cadence: weekly, stage: 1, tracks: [swe], estHours: 2, brief: "Delete a branch and a stash, then recover both from the object database without reflog shortcuts.", acceptance: ["A write-up of the commands used", "cat-file and fsck explained in your own words"] }
- { id: w-ci-pipeline, title: "A CI pipeline worth having", cadence: weekly, stage: 1, tracks: [swe], estHours: 3, brief: "Give one of your repositories lint, tests, coverage, a build matrix and a release job.", acceptance: ["A pull request cannot merge red", "Caching cuts the run time, with numbers"] }
- { id: w-profiling-session, title: "One profiling session", cadence: weekly, stage: 1, tracks: [swe, systems], estHours: 3, brief: "Take a slow program of yours, profile it, fix the top hotspot, and stop.", acceptance: ["Flame graph before and after", "The speed-up, and what you expected it to be"] }
- { id: w-regex-engine-mini, title: "A regex matcher in 50 lines, then with Thompson's NFA", cadence: weekly, stage: 1, tracks: [swe], estHours: 5, brief: "Start from the classic recursive matcher, then build an NFA simulation that cannot blow up.", acceptance: ["A pathological pattern that kills the backtracking version and not the NFA one"] }
- { id: w-json-parser, title: "A JSON parser by hand", cadence: weekly, stage: 1, tracks: [swe, languages], estHours: 4, brief: "Recursive descent, with line and column in every error.", acceptance: ["Passes a public JSON test suite", "Fuzzed without a crash"] }

# ---- systems
- { id: w-sys-strace-tour, title: "What does ls actually do?", cadence: weekly, stage: 1, tracks: [systems], estHours: 2, brief: "Run strace (or dtruss) on three everyday commands and annotate every system call.", acceptance: ["An annotated trace for each", "One surprise written down"] }
- { id: w-sys-mmap-reader, title: "Read a huge file with mmap", cadence: weekly, stage: 1, tracks: [systems], estHours: 3, brief: "Count lines in a multi-gigabyte file with read(), with buffered I/O and with mmap, and explain the numbers.", acceptance: ["Three versions timed with a cold and a warm page cache"] }
- { id: w-sys-tcp-echo, title: "TCP echo server three ways", cadence: weekly, stage: 1, tracks: [systems], estHours: 4, brief: "One thread per connection, a thread pool, and an epoll loop.", acceptance: ["Load tested with 1,000 concurrent clients", "A table of throughput and memory for the three"] }
- { id: w-sys-dns-resolver, title: "A DNS resolver that talks to the root servers", cadence: weekly, stage: 1, tracks: [systems], estHours: 5, brief: "Build queries by hand, send them over UDP, follow referrals from the root down.", acceptance: ["Resolves A records for real domains without a recursive resolver", "Packets checked in Wireshark"] }
- { id: w-sys-sql-queries, title: "Twenty SQL queries on a real dataset", cadence: weekly, stage: 1, tracks: [systems, languages], estHours: 3, brief: "Load a public dataset into SQLite or Postgres and answer twenty questions with joins, window functions and CTEs.", acceptance: ["EXPLAIN read and one query made faster with an index"] }
- { id: w-sys-wal, title: "A write-ahead log with crash tests", cadence: weekly, stage: 1, tracks: [systems], estHours: 4, brief: "An append-only log with checksums and fsync, plus a harness that kills the writer at random and verifies recovery.", acceptance: ["A thousand random kills, zero corrupted recoveries"] }
- { id: w-sys-docker-from-scratch, title: "A container in 100 lines", cadence: weekly, stage: 1, tracks: [systems], estHours: 4, brief: "Namespaces, a chroot and a cgroup limit from a small program of your own.", acceptance: ["A shell runs inside with its own PID 1 and hostname", "Memory limit enforced and demonstrated"] }
- { id: w-sys-load-test, title: "Load test something and find the knee", cadence: weekly, stage: 1, tracks: [systems], estHours: 3, brief: "Point k6, wrk or Locust at one of your services and plot latency percentiles against offered load.", acceptance: ["The saturation point identified", "p50, p95 and p99 on one chart"] }
- { id: w-sys-consistent-hashing, title: "Consistent hashing with virtual nodes", cadence: weekly, stage: 1, tracks: [systems], estHours: 3, brief: "A ring with virtual nodes; measure how many keys move when a node joins or leaves.", acceptance: ["Key movement close to 1/N, shown by simulation", "Load imbalance against the number of virtual nodes plotted"] }
- { id: w-sys-design-doc, title: "One design document, no code", cadence: weekly, stage: 1, tracks: [systems, career], estHours: 3, brief: "Pick a familiar system (a paste bin, a chat, a news feed) and write its design: requirements, estimates, data model, API, failure modes.", acceptance: ["Back-of-envelope numbers with their assumptions", "Reviewed by someone, or posted for review"] }
- { id: w-sys-k8s-deploy, title: "Deploy one of your services to a local Kubernetes", cadence: weekly, stage: 1, tracks: [systems], estHours: 4, brief: "kind or minikube, a Deployment, a Service, a ConfigMap, probes and a rolling update.", acceptance: ["A rolling update with zero failed requests during a load test"] }
- { id: w-sys-terraform-hello, title: "Infrastructure as code for a static site", cadence: weekly, stage: 1, tracks: [systems], estHours: 3, brief: "Bucket, CDN and DNS described in Terraform and created from nothing.", acceptance: ["terraform destroy leaves nothing behind", "State stored remotely"] }

# ---- AI and ML
- { id: w-ml-paper-figure, title: "Re-implement one paper figure", cadence: weekly, stage: 1, tracks: [ai], estHours: 5, brief: "Choose one figure from a paper in the reading queue and reproduce it from your own code.", acceptance: ["Your figure next to the original", "A note on every choice the paper did not specify"] }
- { id: w-ml-linear-regression-scratch, title: "Linear and logistic regression from scratch", cadence: weekly, stage: 1, tracks: [ai, math], estHours: 3, brief: "Closed form and gradient descent in NumPy, checked against scikit-learn.", acceptance: ["Coefficients match scikit-learn to four decimal places"] }
- { id: w-ml-kaggle-baseline, title: "A Kaggle baseline in one sitting", cadence: weekly, stage: 1, tracks: [ai], estHours: 4, brief: "Pick a tabular competition, build an honest validation split and a gradient-boosting baseline, submit once.", acceptance: ["Local validation score within noise of the leaderboard score"] }
- { id: w-ml-tokenizer-bpe, title: "Byte-pair encoding in an evening", cadence: weekly, stage: 1, tracks: [ai], estHours: 3, brief: "Train a small BPE vocabulary on a text file and encode and decode with it.", acceptance: ["Round-trip is lossless", "Compression ratio against vocabulary size plotted"] }
- { id: w-ml-attention-numpy, title: "Scaled dot-product attention in NumPy", cadence: weekly, stage: 1, tracks: [ai, math], estHours: 3, brief: "Single-head then multi-head attention with a causal mask, tested against PyTorch.", acceptance: ["Outputs match torch.nn.functional to 1e-6"] }
- { id: w-ml-embedding-search, title: "Semantic search over your notes", cadence: weekly, stage: 1, tracks: [ai], estHours: 3, brief: "Embed your notes with a small local model and search them with cosine similarity.", acceptance: ["Ten queries judged by hand; hit rate at 3 reported"] }
- { id: w-ml-eval-harness-mini, title: "A tiny eval harness for prompts", cadence: weekly, stage: 1, tracks: [ai], estHours: 4, brief: "Run a set of prompts against two models or two prompt versions and score the outputs automatically.", acceptance: ["Results table regenerated with one command", "At least one metric that is not exact match"] }
- { id: w-ml-quantise-model, title: "Quantise a model and measure what it costs", cadence: weekly, stage: 1, tracks: [ai], estHours: 3, brief: "Run a small language model at 16, 8 and 4 bits with llama.cpp and compare speed, memory and perplexity.", acceptance: ["A table of tokens per second, memory and perplexity"] }
- { id: w-ml-data-cleaning, title: "Clean one ugly dataset", cadence: weekly, stage: 1, tracks: [ai], estHours: 3, brief: "Take a genuinely messy public dataset and turn it into something a model can use, recording every decision.", acceptance: ["A notebook where each cleaning step has a reason", "Row counts before and after each step"] }
- { id: w-ml-agent-tool, title: "Give an agent one new tool", cadence: weekly, stage: 1, tracks: [ai], estHours: 3, brief: "Add a single well-specified tool to your agent and write the tests that prove it is used correctly.", acceptance: ["Five tasks that need the tool, and two that must not use it"] }
- { id: w-ml-cnn-visualise, title: "Look inside a CNN", cadence: weekly, stage: 1, tracks: [ai], estHours: 3, brief: "Visualise first-layer filters, activation maps and a Grad-CAM heat map for a pretrained network.", acceptance: ["Three images where the heat map explains a wrong prediction"] }
- { id: w-ml-gradient-check, title: "Gradient-check a layer you wrote", cadence: weekly, stage: 1, tracks: [ai, math], estHours: 2, brief: "Write the backward pass of layer normalisation or softmax cross-entropy by hand and verify it numerically.", acceptance: ["Relative error below 1e-6"] }

# ---- mathematics and physics
- { id: w-math-svd-compression, title: "Image compression with the SVD", cadence: weekly, stage: 1, tracks: [math], estHours: 2, brief: "Keep the top k singular values of an image and watch what each rank adds.", acceptance: ["Error against k plotted", "One paragraph linking it to 18.06"] }
- { id: w-math-pagerank, title: "PageRank by power iteration", cadence: weekly, stage: 1, tracks: [math, swe], estHours: 3, brief: "Compute PageRank on a real link graph and relate the convergence rate to the second eigenvalue.", acceptance: ["Convergence plot with the predicted slope drawn on it"] }
- { id: w-math-least-squares, title: "Least squares four ways", cadence: weekly, stage: 1, tracks: [math], estHours: 3, brief: "Normal equations, QR, SVD and gradient descent on the same ill-conditioned problem.", acceptance: ["A table of error against condition number for each method"] }
- { id: w-math-monte-carlo-pi, title: "Monte Carlo integration and its error", cadence: weekly, stage: 1, tracks: [math], estHours: 2, brief: "Estimate pi and one harder integral, and show the error falling as one over root N.", acceptance: ["Log-log error plot with the reference slope"] }
- { id: w-math-ode-integrators, title: "Euler, RK4 and symplectic Euler on a pendulum", cadence: weekly, stage: 1, tracks: [math, simulation, physics], estHours: 3, brief: "Integrate a pendulum with three methods and plot the energy over a thousand periods.", acceptance: ["Energy drift plotted for each", "Why the symplectic one behaves differently, in your own words"] }
- { id: w-phys-projectile-drag, title: "Projectile with drag against the textbook", cadence: weekly, stage: 1, tracks: [physics, simulation], estHours: 2, brief: "Simulate a projectile with quadratic drag and compare the range with the drag-free formula.", acceptance: ["Range against launch angle for both; the optimal angle is no longer 45 degrees"] }
- { id: w-phys-orbit-sim, title: "Two-body and three-body orbits", cadence: weekly, stage: 1, tracks: [physics, simulation], estHours: 4, brief: "A gravitational N-body integrator with a stable two-body orbit and a chaotic three-body one.", acceptance: ["Energy and angular momentum conserved to a stated tolerance in the two-body case"] }
- { id: w-math-fourier-drawing, title: "Draw with Fourier epicycles", cadence: weekly, stage: 1, tracks: [math, graphics], estHours: 4, brief: "Take a closed path, compute its discrete Fourier transform, and redraw it with rotating circles.", acceptance: ["The drawing degrades gracefully as terms are dropped"] }

# ---- graphics, simulation and game development
- { id: w-gfx-shadertoy-effect, title: "One Shadertoy effect", cadence: weekly, stage: 1, tracks: [graphics], estHours: 3, brief: "One fragment shader: a raymarched scene, a noise field, a transition. Collect them into the shader reel.", acceptance: ["Published, with a one-paragraph explanation of the technique"] }
- { id: w-gfx-sdf-raymarcher, title: "Signed-distance raymarcher with soft shadows", cadence: weekly, stage: 1, tracks: [graphics, math], estHours: 4, brief: "Sphere-trace a scene built from SDF primitives with smooth blending, soft shadows and ambient occlusion.", acceptance: ["Runs at 60 fps at 1080p on your GPU"] }
- { id: w-gfx-perlin-terrain, title: "Noise terrain", cadence: weekly, stage: 1, tracks: [graphics, gamedev], estHours: 4, brief: "Implement gradient noise yourself and build a height-mapped terrain with fractal octaves.", acceptance: ["Noise implemented by you, not imported", "Normals computed analytically or by finite differences"] }
- { id: w-gfx-line-rasteriser, title: "Bresenham lines and a wireframe cube", cadence: weekly, stage: 1, tracks: [graphics], estHours: 3, brief: "Draw lines into a pixel buffer by hand and spin a wireframe cube with your own matrices.", acceptance: ["No graphics API: a raw framebuffer written to a window or an image"] }
- { id: w-gfx-camera-math, title: "View and projection matrices from first principles", cadence: weekly, stage: 1, tracks: [graphics, math], estHours: 2, brief: "Derive look-at and perspective on paper, implement them, and compare with GLM element by element.", acceptance: ["Matches GLM to floating-point precision", "The derivation, photographed or typeset, in the repository"] }
- { id: w-gfx-post-processing, title: "A post-processing stack", cadence: weekly, stage: 1, tracks: [graphics], estHours: 4, brief: "Render to a texture, then add bloom, tone mapping and a vignette as separate passes.", acceptance: ["Each pass can be toggled at run time", "Frame time per pass measured"] }
- { id: w-gfx-instancing, title: "Draw 100,000 things", cadence: weekly, stage: 1, tracks: [graphics], estHours: 3, brief: "Instanced rendering of a field of objects, with per-instance data in a buffer.", acceptance: ["Frame time against instance count plotted", "Compared with one draw call per object"] }
- { id: w-sim-verlet-rope, title: "Verlet rope", cadence: weekly, stage: 1, tracks: [simulation, gamedev], estHours: 3, brief: "Points, distance constraints and a few relaxation iterations: a rope you can drag around.", acceptance: ["Stable under fast mouse movement", "Stiffness against iteration count explored"] }
- { id: w-sim-aabb-sweep, title: "Sweep-and-prune broadphase", cadence: weekly, stage: 1, tracks: [simulation], estHours: 3, brief: "Find overlapping pairs among thousands of moving boxes, and beat the brute-force version.", acceptance: ["Pair count identical to brute force", "Timing against N for both"] }
- { id: w-sim-spring-mass-cloth, title: "Mass-spring cloth", cadence: weekly, stage: 1, tracks: [simulation], estHours: 4, brief: "A grid of particles with structural, shear and bend springs, pinned at two corners, in the wind.", acceptance: ["Explicit integration blows up at a stiffness you report; implicit or Verlet does not"] }
- { id: w-sim-boids, title: "Boids with a spatial grid", cadence: weekly, stage: 1, tracks: [simulation, gamedev], estHours: 3, brief: "Flocking with separation, alignment and cohesion, accelerated with a uniform grid.", acceptance: ["Ten thousand boids at interactive rates"] }
- { id: w-sim-fixed-timestep, title: "Fix your timestep", cadence: weekly, stage: 1, tracks: [simulation, gamedev], estHours: 2, brief: "Retrofit an accumulator-based fixed timestep with render interpolation into one of your games.", acceptance: ["Identical simulation at 30, 60 and 144 fps, proved by a replay"], source: "Gaffer On Games", sourceUrl: "https://gafferongames.com/" }
- { id: w-game-one-mechanic, title: "One mechanic, one evening", cadence: weekly, stage: 1, tracks: [gamedev], estHours: 3, brief: "Prototype a single game mechanic (a grapple, a dash, a time rewind) until it feels good. No menus, no art.", acceptance: ["A playable build and a list of the numbers you tuned"] }
- { id: w-game-juice-pass, title: "A juice pass on an old prototype", cadence: weekly, stage: 1, tracks: [gamedev], estHours: 3, brief: "Add screen shake, hit pause, particles, easing and sound to something that already works.", acceptance: ["Before and after clips"] }
- { id: w-game-ecs-mini, title: "A tiny entity-component system", cadence: weekly, stage: 1, tracks: [gamedev, languages], estHours: 5, brief: "Entities as ids, components in packed arrays, systems as functions over them.", acceptance: ["A demo with 50,000 entities", "Compared with an array-of-objects version"] }
- { id: w-game-tilemap-editor, title: "Tile-map loader and collision", cadence: weekly, stage: 1, tracks: [gamedev], estHours: 4, brief: "Load a Tiled map, draw it with culling, and collide a character against it.", acceptance: ["No tunnelling at high speed", "Only visible tiles drawn"] }

# ---- career
- { id: w-career-writeup, title: "Write up one finished project", cadence: weekly, stage: 1, tracks: [career], estHours: 3, brief: "Take a project that is done but undocumented and write the article: the problem, the design, the hard part, the numbers.", acceptance: ["Published, with at least one diagram and one measurement"] }
- { id: w-career-readme-pass, title: "README pass on three repositories", cadence: weekly, stage: 1, tracks: [career], estHours: 2, brief: "Each repository gets what it does, how to run it, a screenshot and its status.", acceptance: ["A stranger could build and run each from the README alone"] }
- { id: w-career-open-source-pr, title: "One pull request to a project you use", cadence: weekly, stage: 1, tracks: [career, swe], estHours: 4, brief: "Find a small, real issue in a library you depend on and send a fix with tests.", acceptance: ["Pull request opened following the project's contribution guide"] }
