<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#E6EAE7" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Atlas: a local-first, five-year personal learning platform. What exactly do I do in my 8 hours today?" />
    <link rel="icon" href="/brand/atlas-favicon-light-32.png" sizes="32x32" type="image/png" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="/brand/atlas-favicon-light-16.png" sizes="16x16" type="image/png" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="/brand/atlas-favicon-dark-32.png" sizes="32x32" type="image/png" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/brand/atlas-favicon-dark-16.png" sizes="16x16" type="image/png" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/brand/atlas-icon-light-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- The social preview: the wordmark on the clay background. Link previews need an absolute address. -->
    <meta property="og:title" content="Atlas" />
    <meta property="og:description" content="A local-first, five-year personal learning platform." />
    <meta property="og:image" content="https://linusip.github.io/5_year_roadmap/brand/social-preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Atlas</title>
    <script src="/theme-init.js"></script>
    <!-- The launch screen (ATLAS-ART): the app icon over a soft wash, in place until the app mounts. -->
    <style>
      .splash { min-height: 100dvh; display: grid; place-items: center; background: radial-gradient(circle at 50% 35%, #dceff4 0%, #e6eae7 60%); }
      html[data-theme='dark'] .splash { background: radial-gradient(circle at 50% 35%, #2d4249 0%, #2b2f36 60%); }
      .splash img { width: 96px; height: 96px; border-radius: 24px; box-shadow: 6px 6px 14px #c3cbc6, -6px -6px 14px #ffffff; }
      html[data-theme='dark'] .splash img { box-shadow: 6px 6px 14px #1f2227, -6px -6px 14px #363b44; }
    </style>
  </head>
  <body>
    <div id="root"><div class="splash" aria-hidden="true"><img src="/brand/atlas-icon-light-192.png" alt="" width="96" height="96" /></div></div>
    <noscript>Atlas needs JavaScript: it is a local-first app that runs entirely in your browser.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
