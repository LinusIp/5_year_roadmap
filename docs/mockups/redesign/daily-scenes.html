<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Atlas daily scenes</title>

</head>
<body>
<x-dc>
<helmet>
<style>/* fonts: Nunito normal 600, Nunito normal 700, Nunito normal 800, Nunito normal 900 */
</style>
<style>
body{margin:0;font-family:'Nunito',system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
a{color:inherit;text-decoration:none}
.tile{background:var(--paper);border-radius:26px;box-shadow:6px 6px 14px var(--sd),-6px -6px 14px #FFFFFF;border:2px solid rgba(255,255,255,.6);box-sizing:border-box}
.lbl{margin:0;font-size:13px;font-weight:800;color:var(--ink2);letter-spacing:.03em}
.meta{font-size:14px;font-weight:600;color:var(--ink2);line-height:1.35}
.cell{position:relative;border:0;padding:0;cursor:pointer;border-radius:18px;overflow:hidden;aspect-ratio:3/4;background:#DDD}
.cell img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cell .sw{position:absolute;left:6px;right:6px;bottom:6px;display:flex;gap:3px;padding:4px;border-radius:999px;background:rgba(255,255,255,.85)}
.cell .sw i{flex:1;height:8px;border-radius:999px;display:block}
.sel{box-shadow:0 0 0 3px var(--paper),0 0 0 6px var(--l0)}
.chip{position:absolute;left:6px;top:6px;font-size:10px;font-weight:900;padding:2px 7px;border-radius:999px;background:var(--l0);color:#FFFFFF}
.sq{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;font-weight:800;color:var(--ink2);flex:1}
.sq i{width:100%;height:32px;border-radius:10px;display:block}
</style>
</helmet>
<div style="width:390px;height:1300px;position:relative;box-sizing:border-box;background:var(--paper);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;padding:44px 20px 30px 20px;display:flex;flex-direction:column;gap:16px;overflow:hidden;{{vars}}">

<header style="display:flex;align-items:center;gap:12px">
<a href="Main.dc.html" aria-label="Back to Today" class="tile" style="width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:var(--x0)"><svg sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a>
<span style="display:flex;flex-direction:column"><h1 style="margin:0;font-size:26px;font-weight:900">Daily scenes</h1><span class="meta" style="font-size:13px">A new image and palette every day</span></span>
</header>

<section class="tile" style="padding:0;overflow:hidden">
<div style="position:relative;height:200px"><img src="{{sel.i}}" alt="{{selAlt}}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover"></div>
<div style="padding:14px 18px 18px 18px;display:flex;flex-direction:column;gap:10px">
<div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font-size:19px;font-weight:900">{{sel.n}}</span><span class="meta" style="font-size:12px;font-weight:800;color:var(--x0)">{{selWhen}}</span></div>
<div style="display:flex;gap:6px">
<span class="sq"><i style="background:{{sel.p}};box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)"></i>Paper</span>
<span class="sq"><i style="background:{{sel.k}}"></i>Ink</span>
<span class="sq"><i style="background:{{l0}}"></i>Primary</span>
<span class="sq"><i style="background:{{l1}}"></i>Lane 2</span>
<span class="sq"><i style="background:{{l2}}"></i>Lane 3</span>
<span class="sq"><i style="background:{{l3}}"></i>Lane 4</span>
<span class="sq"><i style="background:{{l4}}"></i>Lane 5</span>
</div>
<span class="meta" style="font-size:12px">Colours are taken from the image and adjusted so text and buttons stay readable.</span>
</div>
</section>

<div style="display:flex;justify-content:space-between;align-items:baseline;padding:0 4px"><h2 class="lbl">ALL 17 SCENES</h2><span class="meta" style="font-size:12px">tap to preview</span></div>
<div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px">
<sc-for list="{{cells}}" as="c" hint-placeholder-count="17">
<button class="{{c.cls}}" sc-camel-on-click="{{c.pick}}" aria-label="{{c.aria}}">
<img src="{{c.i}}" alt="">
<sc-if value="{{c.today}}" hint-placeholder-val="{{ false }}"><span class="chip">TODAY</span></sc-if>
<span class="sw"><i style="background:{{c.a}}"></i><i style="background:{{c.b}}"></i><i style="background:{{c.c}}"></i></span>
</button>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:1300}}">
class Component extends DCLogic {

    super(props);
    this.state = { pick: null };
  }

185C53","#684D2F"],"D":["#C08092","#CFA992","#AA87A9","#5D9E92","#AC8C6B"],"d":["#311A2B","#3E2738","#F5ECE8","#C6B7C2","#C08092"]},{"n":"Lilac bridge","i":"(the scene image)","p":"#EEECEA","s":"#CECCCA","k":"#312825","k2":"#695F5A","L":["#816B9C","#996582","#5A76A1","#657B51","#A16467"],"T":["#E8DFF1","#F0DEE7","#DCE3F2","#DEE5D6","#F4DDDE"],"X":["#5E497A","#75425F","#34547D","#42592F","#7C4146"],"D":["#917AAF","#AA7392","#6885B2","#738B5E","#B37276"],"d":["#2F1E16","#3C2A22","#F3EDE6","#CAB8B0","#917AAF"]}];
    const n = TH.length;
    const sceneIndex = (shift) => {
      const now = new Date();
      const day = new Date(now.getFullYear(), now.getMonth(), now.getDate() + shift);
      const doy = Math.floor((day - new Date(day.getFullYear(), 0, 0)) / 86400000);
      let seed = day.getFullYear() * 97 + Math.floor(doy / n) + 1;
      const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
      const order = TH.map((_, i) => i);
      for (let i = n - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); const t = order[i]; order[i] = order[j]; order[j] = t; }
      return order[doy % n];
    };
    const today = sceneIndex(0);
    const upcoming = {};
    for (let s = 1; s <= 30; s++) { const k = sceneIndex(s); if (upcoming[k] === undefined) upcoming[k] = s; }
    const selIdx = this.state.pick === null ? today : this.state.pick;
    const sel = TH[selIdx];
    const page = TH[today];
    let v = '--paper:' + page.p + ';--sd:' + page.s + ';--ink:' + page.k + ';--ink2:' + page.k2 + ';--l0:' + page.L[0] + ';--x0:' + page.X[0] + ';';
    const when = selIdx === today ? 'Today' : upcoming[selIdx] === 1 ? 'Tomorrow' : upcoming[selIdx] ? 'In ' + upcoming[selIdx] + ' days' : 'Later this cycle';
    const cells = TH.map((t, i) => ({
      i: t.i, a: t.L[0], b: t.L[1], c: t.L[2], today: i === today,
      cls: i === selIdx ? 'cell sel' : 'cell',
      aria: 'Preview scene ' + t.n,
      pick: () => this.setState({ pick: i })
    }));

      vars: v, sel: sel, selAlt: 'Scene: ' + sel.n, selWhen: when, cells: cells,
      l0: sel.L[0], l1: sel.L[1], l2: sel.L[2], l3: sel.L[3], l4: sel.L[4]
    };

</script>
