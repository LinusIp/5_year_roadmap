<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Atlas Focus</title>

</head>
<body>
<x-dc>
<helmet>
<style>/* fonts: Nunito normal 600, Nunito normal 700, Nunito normal 800, Nunito normal 900 */
</style>
<style>
body{margin:0;font-family:'Nunito',system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
a{color:inherit;text-decoration:none}
a:hover{opacity:.85}
.tile{background:var(--dsf);border-radius:26px;box-shadow:0 10px 24px rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.06);box-sizing:border-box}
.lbl{margin:0;font-size:13px;font-weight:800;color:var(--dtx2);letter-spacing:.03em}
.rt{font-size:16px;font-weight:700;line-height:1.25;color:var(--dtx)}
.meta{font-size:14px;font-weight:600;color:var(--dtx2);line-height:1.35}
.chip{flex:none;min-height:44px;padding:0 16px;border-radius:999px;border:0;cursor:pointer;font:700 14px 'Nunito',system-ui,sans-serif;white-space:nowrap;color:var(--dtx);background:rgba(255,255,255,.08)}
.chip.on{color:#111111;background:var(--dac)}
.hs{scrollbar-width:none;-ms-overflow-style:none;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 20px,#000 calc(100% - 44px),transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 20px,#000 calc(100% - 44px),transparent 100%)}
.hs::-webkit-scrollbar{display:none}
.tm{flex:1;min-height:44px;border-radius:999px;border:0;cursor:pointer;font:800 14px 'Nunito',system-ui,sans-serif;color:var(--dtx2);background:transparent}
.tm.on{color:#111111;background:var(--dac)}
.row{display:flex;align-items:center;gap:12px;min-height:72px;padding:8px 0;box-sizing:border-box;width:100%;border:0;background:transparent;cursor:pointer;text-align:left;font:inherit}
.row + .row{border-top:1px solid rgba(255,255,255,.08)}
.thumb{width:84px;height:48px;border-radius:12px;flex:none;object-fit:cover}
.sw{width:52px;height:30px;border-radius:999px;border:0;cursor:pointer;padding:3px;box-sizing:border-box;display:flex;flex:none;background:rgba(255,255,255,.12)}
.sw i{width:24px;height:24px;border-radius:999px;background:var(--dtx2)}
.sw.on{background:var(--dac);justify-content:flex-end}
.sw.on i{background:#FFFFFF}
.tabs{position:absolute;left:12px;right:12px;bottom:16px;display:flex;justify-content:space-between;padding:6px;border-radius:28px;background:var(--dsf);box-shadow:0 8px 24px rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.08)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:52px;border-radius:20px;font-size:11px;font-weight:800;color:var(--dtx2)}
.tab.on{color:#111111;background:var(--dac)}
</style>
</helmet>
<div style="width:390px;height:1300px;position:relative;box-sizing:border-box;background:var(--dbg);color:var(--dtx);font-family:'Nunito',system-ui,sans-serif;padding:44px 20px 120px 20px;display:flex;flex-direction:column;gap:16px;overflow:hidden;{{vars}}">

<header style="padding:0 4px;display:flex;align-items:flex-end;justify-content:space-between">
<span style="display:flex;flex-direction:column"><h1 style="margin:0;font-size:28px;font-weight:900">Focus</h1><span class="meta">Hugging Face block · ends 12:00</span></span>
<span style="font-size:13px;font-weight:800;color:#111111;background:var(--dac);padding:6px 12px;border-radius:999px">{{timeLeft}}</span>
</header>

<section class="tile" style="padding:12px;display:flex;flex-direction:column;gap:12px">
<div style="position:relative;border-radius:18px;overflow:hidden;aspect-ratio:16/9;background:#000">
<img src="{{now.src}}" alt="{{now.alt}}" sc-camel-on-error="{{now.fail}}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">
<div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 50%,rgba(0,0,0,.55))"></div>
<span style="position:absolute;left:10px;top:10px;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:#FFFFFF;background:rgba(0,0,0,.55);padding:4px 10px;border-radius:999px"><svg sc-camel-view-box="0 0 24 24" style="width:16px;height:12px" aria-hidden="true"><rect x="1" y="3" width="22" height="18" rx="5" fill="#E2483D"></rect><path d="M10 8v8l6-4z" fill="#FFFFFF"></path></svg>YouTube</span>
<sc-if value="{{now.hasLen}}" hint-placeholder-val="{{ true }}"><span style="position:absolute;right:10px;bottom:10px;font-size:12px;font-weight:800;color:#FFFFFF;background:{{now.lenBg}};padding:3px 8px;border-radius:8px">{{now.len}}</span></sc-if>
<button sc-camel-on-click="{{toggle}}" aria-label="{{playLabel}}" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:999px;border:0;cursor:pointer;background:rgba(255,255,255,.92);color:#111111;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.35)">
<sc-if value="{{playing}}" hint-placeholder-val="{{ false }}"><svg sc-camel-view-box="0 0 24 24" fill="currentColor" style="width:22px;height:22px" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg></sc-if>
<sc-if value="{{paused}}" hint-placeholder-val="{{ true }}"><svg sc-camel-view-box="0 0 24 24" fill="currentColor" style="width:24px;height:24px;margin-left:3px" aria-hidden="true"><path d="M7 4v16l13-8z"></path></svg></sc-if>
</button>
</div>
<div style="display:flex;flex-direction:column;gap:2px;padding:0 4px">
<span class="rt" style="font-size:17px;font-weight:800">{{now.title}}</span>
<span class="meta" style="font-size:13px">{{now.channel}}</span>
</div>
<div style="display:flex;gap:4px;padding:5px;border-radius:999px;background:var(--dbg)">
<sc-for list="{{timers}}" as="t" hint-placeholder-count="5">
<button class="{{t.cls}}" sc-camel-on-click="{{t.pick}}">{{t.label}}</button>
</sc-for>
</div>
</section>

<div class="hs" style="display:flex;gap:10px;overflow-x:auto;margin:0 -20px;padding:2px 20px 6px 20px">
<sc-for list="{{cats}}" as="c" hint-placeholder-count="6">
<button class="{{c.cls}}" sc-camel-on-click="{{c.pick}}">{{c.name}}</button>
</sc-for>
</div>

<section class="tile" style="padding:4px 16px">
<sc-for list="{{sessions}}" as="s" hint-placeholder-count="3">
<button class="row" sc-camel-on-click="{{s.play}}" aria-label="{{s.aria}}">
<img class="thumb" src="{{s.src}}" alt="" sc-camel-on-error="{{s.fail}}">
<span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px"><span class="rt" style="font-size:15px">{{s.title}}</span><span class="meta" style="font-size:12px">{{s.sub}}</span></span>
<sc-if value="{{s.current}}" hint-placeholder-val="{{ false }}"><span style="font-size:11px;font-weight:900;color:#111111;background:var(--dac);padding:3px 8px;border-radius:999px">ON</span></sc-if>
</button>
</sc-for>
<label style="display:flex;align-items:center;gap:10px;min-height:56px;border-top:1px solid rgba(255,255,255,.08)">
<span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Add a YouTube link</span>
<input type="url" placeholder="Paste a YouTube link to save it" style="flex:1;border:0;background:transparent;font:600 15px 'Nunito',system-ui,sans-serif;color:var(--dtx);outline:none;min-height:44px">
<span style="font-size:13px;font-weight:800;color:var(--dac)">Add</span>
</label>
</section>

<section class="tile" style="padding:12px 16px 6px 16px">
<div style="display:flex;justify-content:space-between;align-items:baseline"><h2 class="lbl">ATLAS SOUNDS</h2><span class="meta" style="font-size:12px">plays with the screen locked</span></div>
<sc-for list="{{sounds}}" as="n" hint-placeholder-count="3">
<div style="display:flex;align-items:center;gap:12px;min-height:54px">
<span style="flex:1;display:flex;flex-direction:column"><span class="rt" style="font-size:15px">{{n.name}}</span><span class="meta" style="font-size:12px">{{n.note}}</span></span>
<button class="{{n.cls}}" sc-camel-on-click="{{n.toggle}}" aria-label="{{n.aria}}"><i></i></button>
</div>
</sc-for>
</section>

<nav class="tabs" aria-label="Main">
<a class="tab" href="Main.dc.html"><svg sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="width:22px;height:22px" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>Today</a>
<a class="tab" href="Plan.dc.html"><svg sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="width:22px;height:22px" aria-hidden="true"><path d="M4 6h16M4 12h10M4 18h13"></path></svg>Plan</a>
<a class="tab" href="Calendar.dc.html"><svg sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="width:22px;height:22px" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>Calendar</a>
<a class="tab" href="Library.dc.html"><svg sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="width:22px;height:22px" aria-hidden="true"><path d="M5 4v16M10 4v16M15 5l4 15"></path></svg>Library</a>
<a class="tab" href="Stats.dc.html"><svg sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="width:22px;height:22px" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg>Stats</a>
<a class="tab on" href="Focus.dc.html"><svg sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:22px;height:22px" aria-hidden="true"><path d="M4 15v-3a8 8 0 0 1 16 0v3"></path><rect x="3" y="14" width="4" height="6" rx="1.5"></rect><rect x="17" y="14" width="4" height="6" rx="1.5"></rect></svg>Focus</a>
</nav>
</div>
</x-dc>

        yt('S3eFxkxpe20', 'Echoes of Elegance – Dark Cello Reverie', 'Timeless Serenade', '', 6)
      ],
      Lofi: [
        yt('jfKfPfyJRdk', 'lofi hip hop radio · beats to relax/study to', 'Lofi Girl', 'LIVE', 0),
        yt('lTRiuFIWV54', '1 A.M Study Session [lofi hip hop]', 'Lofi Girl', '', 3),
        yt('28KRPhVzCus', 'lofi hip hop radio · beats to sleep/chill to', 'Lofi Girl', 'LIVE', 7),
        yt('4xDzrJKXOOY', 'synthwave radio · beats to chill/game to', 'Lofi Girl', 'LIVE', 9)
      ],
      Piano: [
        yt('HSOtku1j600', '2 Hour Beautiful Piano Music for Studying and Sleeping', 'The Soul of Wind', '2 h', 2),
        yt('77ZozI0rw7w', 'Relaxing Piano Music & Water Sounds', 'Soothing Relaxation', '', 9)
      ],
      Classical: [yt('jgpJVI3tDbY', 'The Best of Classical Music: Mozart, Beethoven, Bach, Chopin, Vivaldi', 'Just Instrumental Music', '', 5)],
      Ambient: [yt('1ZYbU82GVz4', 'Flying: Relaxing Sleep Music by Peder B. Helland', 'Soothing Relaxation', '', 11)],
      Rain: [
        yt('mPZkdNFkNps', 'Rain Sound On Window with Thunder Sounds', 'Relaxing Ambience ASMR', '', 13),
        yt('xNN7iTA57jM', 'Forest Sounds | Woodland Ambience, Bird Song', 'The Guild of Ambience', '', 14)
      ],
      Jazz: [yt('Dx5qFachd3A', 'Relaxing Jazz Piano Radio · 24/7 Live Stream', 'Cafe Music BGM channel', 'LIVE', 15)]
    };
    const failed = this.state.failed;
    const thumb = (s) => failed[s.id] ? s.cover : 'https://i.ytimg.com/vi/' + s.id + '/hqdefault.jpg';
    const markFail = (s) => () => { if (!this.state.failed[s.id]) this.setState({ failed: Object.assign({}, this.state.failed, { [s.id]: true }) }); };
    const cats = ['Mine', 'Lofi', 'Piano', 'Classical', 'Ambient', 'Rain', 'Jazz'].map((c) => ({
      name: c === 'Rain' ? 'Rain & nature' : c === 'Mine' ? 'My sessions' : c,
      cls: this.state.cat === c ? 'chip on' : 'chip',
      pick: () => this.setState({ cat: c, now: 0 })
    }));
    const list = lib[this.state.cat];
    const nowItem = list[this.state.now] || list[0];
    const sessions = list.map((s, i) => Object.assign({}, s, {
      src: thumb(s), fail: markFail(s), sub: s.channel + (s.len ? ' · ' + s.len : ''),
      current: i === this.state.now, aria: 'Play ' + s.title,
      play: () => this.setState({ now: i, playing: true })
    }));
    const timers = ['25 m', '50 m', '60 m', '90 m', 'Block'].map((x) => ({
      label: x === 'Block' ? 'Till 12:00' : x,
      cls: this.state.timer === x ? 'tm on' : 'tm',
      pick: () => this.setState({ timer: x })
    }));
    const left = { '25 m': '25:00', '50 m': '50:00', '60 m': '60:00', '90 m': '90:00', Block: '1:05 left' }[this.state.timer];
    const defs = [{ key: 'rain', name: 'Soft rain', note: 'Layered under the video' }, { key: 'brown', name: 'Brown noise', note: 'Deep and steady' }, { key: 'pad', name: 'Ambient pad', note: 'Slow warm tone' }];
    const sounds = defs.map((d) => ({
      name: d.name, note: d.note,
      cls: this.state.sounds[d.key] ? 'sw on' : 'sw',
      aria: (this.state.sounds[d.key] ? 'Turn off ' : 'Turn on ') + d.name,
      toggle: () => this.setState({ sounds: Object.assign({}, this.state.sounds, { [d.key]: !this.state.sounds[d.key] }) })
    }));
    return {
      vars: v, cats: cats, sessions: sessions, timers: timers, sounds: sounds, timeLeft: left,
      now: Object.assign({}, nowItem, { alt: 'Thumbnail of ' + nowItem.title, src: thumb(nowItem), fail: markFail(nowItem), hasLen: !!nowItem.len, lenBg: nowItem.len === 'LIVE' ? '#D93025' : 'rgba(0,0,0,.65)' }),
      playing: this.state.playing, paused: !this.state.playing,
      playLabel: this.state.playing ? 'Pause' : 'Play',
      toggle: () => this.setState({ playing: !this.state.playing })
    };
  }
}
