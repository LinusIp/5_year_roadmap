name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Fails on schema errors, duplicate ids, dangling references and missing credential-map rows.
      - run: npm run validate:data
      # The catalogue's refs and covers are what scripts/lib/catalogue-mapping.ts gives: nothing hand-edited out of sync.
      - run: npm run map:catalogue -- --check
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build
      - name: Install the browser for the smoke tests
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      # The lesson checklists' notes and video links, requested from the runner: a report that never fails the build,
      # last so its summary ends the log (the links that answered are left out).
      - name: Link report for the lesson checklists
        if: always()
        timeout-minutes: 5
        run: npm run check:links -- --only ml-zoomcamp | grep -v '^ok '

  # The Focus tab's starter sessions (data/focus-sessions.json, ATLAS-FOCUS-MUSIC) asked of YouTube's oEmbed endpoint
  # from the runner: the build-time check that each still exists and allows embedding. Red when one does not; the
  # weekly focus-check workflow opens an issue for the same.
  focus-oembed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run focus:verify

  # Screenshot baselines are drawn here, on CI's Linux, so the comparison in `verify` runs on the same platform.
  # Commit an empty `screenshots/.redraw` to a pull request's branch: this job redraws every baseline, removes the
  # marker and pushes the result to the branch. Nothing happens without the marker.
  screenshots:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - id: marker
        run: if [ -f screenshots/.redraw ]; then echo "redraw=true" >> "$GITHUB_OUTPUT"; else echo "redraw=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.marker.outputs.redraw == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - if: steps.marker.outputs.redraw == 'true'
        run: npm ci && npx playwright install --with-deps chromium && npx vite build
      - if: steps.marker.outputs.redraw == 'true'
        run: npx playwright test tests/e2e/screenshots.spec.ts --update-snapshots=all
      - if: steps.marker.outputs.redraw == 'true'
        run: |
          git rm -q screenshots/.redraw
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenshots
          git commit -q -m "Screenshots: every baseline redrawn on CI's Linux"
          git push

  # One-off for pull request #50: the quality pass's new rows and corrected URLs, checked from the runner (the container
  # cannot resolve the hosts). Removed before the merge. 403 and 429 are "check by hand", never broken.
  links-atlas-15:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:links -- --in data/resources/library-atlas-15.yaml | grep -v '^ok ' | grep -v '^        '
      - run: for id in book-redbook-5th article-mocz-nbody paper-akamai-network ms-hlsl-sm6-features docs-basilisk-astrodynamics book-sundstrom-mathematical-reasoning repo-rust-vmm-kvm-ioctls repo-pyrk docs-cub doitpoms-brillouin-zones; do npm run --silent check:links -- --only "$id" | grep -v '^ok ' | grep -v '^        '; done
