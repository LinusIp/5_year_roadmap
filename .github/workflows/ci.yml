name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Fails on schema errors, duplicate ids, dangling references and missing credential-map rows.
      - run: npm run validate:data
      # The catalogue's refs and covers are what scripts/lib/catalogue-mapping.ts gives: nothing hand-edited out of sync.
      - run: npm run map:catalogue -- --check
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build
      - name: Install the browser for the smoke tests
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      # The lesson checklists' notes and video links, requested from the runner: a report that never fails the build,
      # last so its summary ends the log (the links that answered are left out).
      - name: Link report for the lesson checklists
        if: always()
        timeout-minutes: 5
        run: npm run check:links -- --only ml-zoomcamp | grep -v '^ok '

  # The links of the Atlas Library's third file (ATLAS-LIBRARY, 3,811 rows): the 418 rows it adds, requested from the
  # runner for the pull request's report. A job of its own so a slow site cannot hold up `verify`; report only, it
  # never fails and never edits the data. It runs once for the pull request and goes before it merges.
  links-atlas-3:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Link report
        continue-on-error: true
        timeout-minutes: 25
        run: npm run check:links -- --in data/resources/library-atlas-3.yaml | grep -v '^ok ' | grep -v '^        '

  # Screenshot baselines are drawn here, on CI's Linux, so the comparison in `verify` runs on the same platform.
  # Commit an empty `screenshots/.redraw` to a pull request's branch: this job redraws every baseline, removes the
  # marker and pushes the result to the branch. Nothing happens without the marker.
  screenshots:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - id: marker
        run: if [ -f screenshots/.redraw ]; then echo "redraw=true" >> "$GITHUB_OUTPUT"; else echo "redraw=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.marker.outputs.redraw == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - if: steps.marker.outputs.redraw == 'true'
        run: npm ci && npx playwright install --with-deps chromium && npx vite build
      - if: steps.marker.outputs.redraw == 'true'
        run: npx playwright test tests/e2e/screenshots.spec.ts --update-snapshots=all
      - if: steps.marker.outputs.redraw == 'true'
        run: |
          git rm -q screenshots/.redraw
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenshots
          git commit -q -m "Screenshots: every baseline redrawn on CI's Linux"
          git push
