name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Fails on schema errors, duplicate ids, dangling references and missing credential-map rows.
      - run: npm run validate:data
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build
      - name: Install the browser for the smoke tests
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Every answer in the practice bank, recomputed with SymPy and NumPy from each question's independent `verify`.
  # 40 draws a template here (about five minutes); `npm run verify:questions` runs the full 200 locally.
  questions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install sympy numpy
      - run: npm ci
      - run: npm run verify:questions -- --draws 40
